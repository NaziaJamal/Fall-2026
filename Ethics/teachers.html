<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 8 Teachers</title><style>
:root{--navy:#143865;--gold:#d39f10;--sky:#c1cddd;--sky3:#edf2f9}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--sky3)}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}
.top img{width:40px;height:40px;border-radius:6px}.top .t{font-weight:700;font-size:17px;line-height:1.2}.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}
.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--sky);padding:6px 10px;align-items:center}
nav button{font:inherit;font-size:15px;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--navy);white-space:nowrap}
nav button.on{background:var(--navy);color:#fff}
nav a{margin-left:auto;font-size:13px;color:var(--navy);white-space:nowrap;padding-left:10px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}iframe.on{display:block}
@media (max-width:600px){.top .t small{display:none}.top .t{font-size:14px}nav button{font-size:14px;padding:7px 9px}}
</style></head><body>

s:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Teacher\u003c/span>\u003c/header>\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 8 Teacher Guide\u003c/h1>\n\u003cp class=\"lead\">Chapter 8: Recognizing and Respecting the Rights of All · \"Invited is not the same as included\" · Class 1 9:00–10:40 · Break 10:40–11:10 · Class 2 11:10–12:50\u003c/p>\n\n\u003csection class=\"noprint\">\n\u003ch2>Contents\u003c/h2>\n\u003col class=\"toc\">\n\u003cli>\u003ca href=\"#overview\">Week at a glance\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#goals\">Learning goals\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#concepts\">Key concepts and book pages\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#vocab\">Essential vocabulary and language\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#bigq\">Big ethical questions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#read\">What students read in the book\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#materials\">Materials (textbook and outside sources)\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#ground\">Ground rules for this week\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#c1\">Class 1: Invited is not included\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#bridge\">The bridge\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#c2\">Class 2: Rights across borders\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#lang\">Discussion language\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#hw\">Homework: Personal Code of Ethics draft\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#check\">Check for understanding\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#align\">How Week 8 builds toward the assessments\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#prep\">Materials to prepare\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#flags\">Notes and flags\u003c/a>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"overview\">\n\u003ch2>Week at a glance\u003c/h2>\n\u003cp>Weeks 6 and 7 looked at the two sides of the employment relationship. Week 8 asks a wider question: \u003cb>whose rights does a business have to respect, and how far does it have to go?\u003c/b> Class 1 stays inside one workplace: who is in the room, who is heard, and what a company must change so that people of different abilities and faiths can do their jobs. Class 2 moves across borders: the same pay gap judged under four different rulebooks, then a pitch to a skeptical board.\u003c/p>\n\u003cp>One fictional company runs through both classes: \u003cb>Meridian Freight\u003c/b>, a logistics firm with its headquarters in the U.S. and offices in New Jersey, Minnesota, Germany and other countries. Class 1 ends with two Meridian payslips. After the break, students find out that \"Is this legal?\" has four different answers.\u003c/p>\n\u003cp>The week also does two jobs for the course: students write the first part of their \u003cb>Personal Code of Ethics\u003c/b>, and they take \u003cb>Quiz 3 (Chapters 6–8)\u003c/b> at the end of Class 2.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clock\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Activity\u003c/th>\u003cth>Syllabus link\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd colspan=\"4\">\u003cb>Class 1 · Invited is not included (9:00–10:40)\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:00–9:14\u003c/td>\u003ctd>Engage\u003c/td>\u003ctd>The Meeting Nobody Noticed (secret-role simulation)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:14–9:30\u003c/td>\u003ctd>Study\u003c/td>\u003ctd>Invited vs. included, and Data Detective\u003c/td>\u003ctd>Diversity, equity and inclusion\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:30–10:02\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>Discussion circles: three rounds\u003c/td>\u003ctd>Discussion circles: DEI\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:02–10:33\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>The Accommodation Desk (role-play)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:33–10:40\u003c/td>\u003ctd>Bridge\u003c/td>\u003ctd>The Payslip: fair? legal?\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd colspan=\"4\">\u003cb>Class 2 · Rights across borders (11:10–12:50)\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:10–11:20\u003c/td>\u003ctd>Engage\u003c/td>\u003ctd>Would you rather? (with a switch rule)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:20–11:55\u003c/td>\u003ctd>Study + Activate\u003c/td>\u003ctd>Case study: Same Job, Four Rulebooks (jigsaw)\u003c/td>\u003ctd>Global perspectives on human rights in business\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:55–12:10\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>The Board Asks (pitch and challenge)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:10–12:20\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>From red lines to a code\u003c/td>\u003ctd>Personal Code of Ethics (draft)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:20–12:45\u003c/td>\u003ctd>Assess\u003c/td>\u003ctd>Quiz 3 (Chapters 6–8)\u003c/td>\u003ctd>Quiz 3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:45–12:50\u003c/td>\u003ctd>Close\u003c/td>\u003ctd>Exit ticket and homework\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Collect at 9:00:\u003c/b> Journal #4 (the Ari Moreno paragraph from Week 7).\u003c/p>\n\u003cdiv class=\"note\">\u003cb>New activity types this week.\u003c/b> None of this week's activities repeats Week 7's formats. There is no spectrum line, paired reading, clause negotiation, card sort or formal debate. Instead there are a secret-role simulation, a data-checking task, discussion circles with rotating roles, a three-person role-play, a \"would you rather\" with a switch rule, a four-way jigsaw and a board pitch.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"goals\">\n\u003ch2>Learning goals\u003c/h2>\n\u003cp>By the end of Week 8, students will be able to:\u003c/p>\n\u003col>\n\u003cli>Explain the difference between \u003cb>diversity\u003c/b> and \u003cb>inclusion\u003c/b>, and describe practical changes (meeting formats, rewards, schedules) that make a workplace more inclusive.\u003c/li>\n\u003cli>Read diversity performance data critically, and tell a \u003cb>correlation\u003c/b> from a \u003cb>cause\u003c/b>.\u003c/li>\n\u003cli>Decide whether a request for a \u003cb>reasonable accommodation\u003c/b> (disability or religion) should be granted, and explain the \u003cb>undue hardship\u003c/b> test.\u003c/li>\n\u003cli>Compare how different legal systems treat the same pay gap (U.S. federal law, New Jersey, Minnesota and the EU) and recommend a policy for a company that works in all of them.\u003c/li>\n\u003cli>Write specific, checkable commitments for a Personal Code of Ethics.\u003c/li>\n\u003cli>\u003cb>Language:\u003c/b> hedge and qualify in sensitive discussions (\"It could be argued that…\", \"That may be true in some workplaces, but…\"), and use the language of obligation and permission in policy (\"Employers \u003ci>must\u003c/i>…\", \"\u003ci>are not allowed to\u003c/i>…\", \"\u003ci>may\u003c/i> refuse only if…\").\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"concepts\">\n\u003ch2>Key concepts and book pages\u003c/h2>\n\u003cp>Book: \u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 8, pages 231–264. Links go to the free online book. Page numbers come from the PDF's table of contents.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>Ideas you need this week\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-introduction\" target=\"_blank\" rel=\"noopener\">Introduction\u003c/a>\u003c/td>\u003ctd>231\u003c/td>\u003ctd>Managers must recognize and respect the rights of all; global markets make a diverse workforce an advantage\u003c/td>\u003ctd>Slide 2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-1-diversity-and-inclusion-in-the-workforce\" target=\"_blank\" rel=\"noopener\">8.1 Diversity and Inclusion in the Workforce\u003c/a>\u003c/td>\u003ctd>232–238\u003c/td>\u003ctd>Diversity vs. inclusion (Howard Ross: \"invited to the party\" vs. \"asked to dance\"); SHRM's wider definition (thinking styles, personality, abilities, orientation); women's and minorities' workforce share; Google's figures (Fig. 8.3); McKinsey study and the \u003cb>diversity dividend\u003c/b> (Fig. 8.4); \"correlation does not equal causation\"; challenges, including the 2017 Google memo and the 2018 NLRB finding; leaders' accommodations (meeting formats, prayer rooms, rethinking rewards); Texas Health Resources and Marriott\u003c/td>\u003ctd>Meeting simulation, Data Detective, Circles rounds 1–2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-2-accommodating-different-abilities-and-faiths\" target=\"_blank\" rel=\"noopener\">8.2 Accommodating Different Abilities and Faiths\u003c/a>\u003c/td>\u003ctd>239–243\u003c/td>\u003ctd>ADA (1990): disability, \u003cb>reasonable accommodation\u003c/b>, \u003cb>undue hardship\u003c/b>; employees don't have to use the legal words; EEOC; Verizon's $20 million settlement over a no-fault attendance policy; Title VII and religion (nondiscrimination, nonharassment, nonretaliation, accommodation); Juneteenth picnic (\u003ci>What Would You Do?\u003c/i>); Sikh kirpan; \u003ci>Welsh v. United States\u003c/i> (1970) and nontraditional beliefs; Abercrombie &amp; Fitch (2015)\u003c/td>\u003ctd>Accommodation Desk\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-3-sexual-identification-and-orientation\" target=\"_blank\" rel=\"noopener\">8.3 Sexual Identification and Orientation\u003c/a>\u003c/td>\u003ctd>244–246\u003c/td>\u003ctd>Legal protections; \u003ci>Bostock v. Clayton County\u003c/i> (2020) in the online edition (see flag); state laws (Fig. 8.7); ethical leadership beyond the law; Corporate Equality Index; boycotts of state laws\u003c/td>\u003ctd>Circles round 3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-4-income-inequalities\" target=\"_blank\" rel=\"noopener\">8.4 Income Inequalities\u003c/a>\u003c/td>\u003ctd>247–251\u003c/td>\u003ctd>\u003cb>Income inequality\u003c/b>; the shrinking middle class; federal minimum wage $7.25; employees vs. independent contractors; Neumark and Wascher's skepticism; women paid about 80% of men's pay; New Jersey's Diane B. Allen Equal Pay Act (\"substantially similar work\", six years, triple damages); Minnesota's pay equity system\u003c/td>\u003ctd>Would you rather, Four Rulebooks, Board Asks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-5-animal-rights-and-the-implications-for-business\" target=\"_blank\" rel=\"noopener\">8.5 Animal Rights and the Implications for Business\u003c/a>\u003c/td>\u003ctd>252–\u003c/td>\u003ctd>\u003cb>Animal rights\u003c/b>; agribusiness ethics; Peter Singer and sentience; cosmetics testing (EU ban in 2013, about forty nations); Beagle Freedom Project\u003c/td>\u003ctd>Would you rather (card 2); Chapter Summary\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp class=\"src\">Chapter 9 begins on p. 265, so the key terms, summary and questions for Chapter 8 come after section 8.5 and before p. 265.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Coverage choice:\u003c/b> The syllabus asks for DEI discussion circles, a global human rights case and the code draft. Sections 8.1, 8.2 and 8.4 get the most class time because they connect most directly to students' professional lives. Section 8.3 is handled as a policy question in one discussion round, and 8.5 appears in one \"would you rather\" card and the Chapter Summary tab. Both are on Quiz 3 only lightly (one question each).\u003c/div>\n\u003c/section>\n\n\u003csection id=\"vocab\">\n\u003ch2>Essential vocabulary and language\u003c/h2>\n\u003ch3>Core terms (taught through use, not a list)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning in plain words\u003c/th>\u003cth>Where students use it\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>diversity\u003c/td>\u003ctd>the mix of people and perspectives in a workforce\u003c/td>\u003ctd>Meeting simulation, Data Detective\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>inclusion\u003c/td>\u003ctd>the book: \"the engagement of all employees in the corporate culture\"; people are heard and belong\u003c/td>\u003ctd>Meeting simulation, circles\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>diversity dividend\u003c/td>\u003ctd>the financial benefit of better performance linked to a diverse workforce\u003c/td>\u003ctd>Data Detective\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>correlation vs. causation\u003c/td>\u003ctd>two things happening together vs. one thing making the other happen\u003c/td>\u003ctd>Data Detective, Board Asks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>reasonable accommodation\u003c/td>\u003ctd>a change to a job or the workplace that lets a person with a disability or other need do the job\u003c/td>\u003ctd>Accommodation Desk\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>undue hardship\u003c/td>\u003ctd>a difficulty or cost to the firm large enough that an accommodation may not be required\u003c/td>\u003ctd>Accommodation Desk\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>bona fide (religious) belief\u003c/td>\u003ctd>a sincere, genuine belief (the employee tells the employer about it)\u003c/td>\u003ctd>Accommodation Desk\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>retaliation (review)\u003c/td>\u003ctd>punishing someone for asking for their rights or complaining\u003c/td>\u003ctd>Accommodation Desk, quiz\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>income inequality\u003c/td>\u003ctd>the unequal distribution of income among people in an economy\u003c/td>\u003ctd>Would you rather\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pay equity / pay gap\u003c/td>\u003ctd>fair pay for work of the same value / the difference in average pay between two groups\u003c/td>\u003ctd>Four Rulebooks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"equal work\" vs. \"substantially similar work\"\u003c/td>\u003ctd>the same job vs. jobs that are alike in skill, effort and responsibility even if the titles differ\u003c/td>\u003ctd>Four Rulebooks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>comparable worth (review, Ch. 6)\u003c/td>\u003ctd>pay should reflect a job's value to the organization, not the person's salary history\u003c/td>\u003ctd>Four Rulebooks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>independent contractor\u003c/td>\u003ctd>a worker who is not an employee, so the company doesn't pay benefits or payroll taxes\u003c/td>\u003ctd>Would you rather (optional)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>animal rights\u003c/td>\u003ctd>the entitlement of nonhuman animals to ethical treatment\u003c/td>\u003ctd>Would you rather card 2\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Collocations\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>make / grant / deny an accommodation\u003c/span>\u003cspan>impose an undue hardship\u003c/span>\u003cspan>a sincerely held belief\u003c/span>\u003cspan>close the pay gap\u003c/span>\u003cspan>pay below / above the minimum wage\u003c/span>\u003cspan>meet / exceed the legal minimum\u003c/span>\u003cspan>a level playing field\u003c/span>\u003cspan>feel heard / be left out\u003c/span>\u003cspan>roll back a policy\u003c/span>\u003cspan>comply with the law\u003c/span>\u003cspan>bear the burden of proof\u003c/span>\u003c/div>\n\u003ch3>Words students may misunderstand\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>accommodation\u003c/b>: in this chapter it means an \u003ci>adjustment\u003c/i>, not a place to stay. Students in hospitality will notice the double meaning.\u003c/li>\n\u003cli>\u003cb>minority\u003c/b>: a statistical group in a population, not \"less important\". Some students may find the word itself loaded; acknowledge that.\u003c/li>\n\u003cli>\u003cb>equity vs. equality\u003c/b>: equality = everyone gets the same; equity = everyone gets what they need for a fair outcome. The book uses \"pay equity\" to mean fair pay for comparable work.\u003c/li>\n\u003cli>\u003cb>undue\u003c/b>: more than is reasonable (not \"not yet due\").\u003c/li>\n\u003cli>\u003cb>dividend\u003c/b>: here a metaphor (a benefit that comes back to you), not only a shareholder payment.\u003c/li>\n\u003cli>\u003cb>bona fide\u003c/b>: Latin, \"in good faith\", meaning real and sincere.\u003c/li>\n\u003c/ul>\n\u003ch3>Pronunciation\u003c/h3>\n\u003cp>in\u003cb>CLU\u003c/b>sion · di\u003cb>VER\u003c/b>sity · accommo\u003cb>DA\u003c/b>tion · \u003cb>HARD\u003c/b>ship · e\u003cb>QUI\u003c/b>ty (\u003ci>EK-wi-tee\u003c/i>) · bona \u003cb>FI\u003c/b>de (\u003ci>BOH-nuh FY-dee\u003c/i> or \u003ci>FEE-day\u003c/i>) · dis\u003cb>CRIM\u003c/b>ination · ju\u003cb>RIS\u003c/b>diction. Watch the stress shift: \u003cb>DI\u003c/b>verse → di\u003cb>VER\u003c/b>sity; \u003cb>E\u003c/b>qual → e\u003cb>QUAL\u003c/b>ity.\u003c/p>\n\u003ch3>Grammar in context\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Obligation and permission in rules:\u003c/b> \"Employers \u003ci>must\u003c/i> give a pay range before the interview.\" \"They \u003ci>are not allowed to\u003c/i> ask about salary history.\" \"An employer \u003ci>may\u003c/i> refuse only if it \u003ci>can show\u003c/i> undue hardship.\"\u003c/li>\n\u003cli>\u003cb>Hedging for sensitive topics:\u003c/b> \"It could be argued that…\", \"This may not apply to every workplace…\", \"In some contexts, …\".\u003c/li>\n\u003cli>\u003cb>Conditionals for policy:\u003c/b> \"If Meridian \u003ci>applied\u003c/i> the strictest rule everywhere, costs \u003ci>would rise\u003c/i>, but…\"\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"bigq\">\n\u003ch2>Big ethical questions\u003c/h2>\n\u003cul>\n\u003cli>Is it enough to hire different people, or does a company also owe them a voice?\u003c/li>\n\u003cli>When a request for an accommodation costs the business money or causes inconvenience to colleagues, whose interests come first?\u003c/li>\n\u003cli>If something is legal in one country and illegal in another, which standard should a global company follow?\u003c/li>\n\u003cli>Does a company have an ethical duty to pay more than the law requires?\u003c/li>\n\u003cli>Should a company's values change when the law or the political climate changes?\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"read\">\n\u003ch2>What students read in the book\u003c/h2>\n\u003cp>The same list, with links, is at the top of the student worksheet and inside each worksheet part. Page numbers are from the PDF.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>When\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 8 introduction\u003c/a>\u003c/td>\u003ctd>p. 231\u003c/td>\u003ctd>Before class (short)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-1-diversity-and-inclusion-in-the-workforce\" target=\"_blank\" rel=\"noopener\">8.1 Diversity and Inclusion in the Workforce\u003c/a>\u003c/td>\u003ctd>pp. 232–238\u003c/td>\u003ctd>\u003cb>Before class\u003c/b>\u003c/td>\u003ctd>Meeting, Data Detective, Circles rounds 1–2 (Parts 1–3)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-2-accommodating-different-abilities-and-faiths\" target=\"_blank\" rel=\"noopener\">8.2 Accommodating Different Abilities and Faiths\u003c/a>\u003c/td>\u003ctd>pp. 239–243\u003c/td>\u003ctd>Before Class 1 if possible\u003c/td>\u003ctd>Accommodation Desk (Part 4)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-3-sexual-identification-and-orientation\" target=\"_blank\" rel=\"noopener\">8.3 Sexual Identification and Orientation\u003c/a>\u003c/td>\u003ctd>pp. 244–246\u003c/td>\u003ctd>Read the \u003cb>online\u003c/b> version (includes \u003ci>Bostock\u003c/i>)\u003c/td>\u003ctd>Circles round 3 (Part 3)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-4-income-inequalities\" target=\"_blank\" rel=\"noopener\">8.4 Income Inequalities\u003c/a>\u003c/td>\u003ctd>pp. 247–251\u003c/td>\u003ctd>During the break or before Class 2\u003c/td>\u003ctd>Payslip, Would you rather, Four Rulebooks, Board Asks (Parts 5–8)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-5-animal-rights-and-the-implications-for-business\" target=\"_blank\" rel=\"noopener\">8.5 Animal Rights and the Implications for Business\u003c/a>\u003c/td>\u003ctd>from p. 252\u003c/td>\u003ctd>Homework if not read\u003c/td>\u003ctd>Would you rather card 2 (Part 6)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-key-terms\" target=\"_blank\" rel=\"noopener\">Key terms\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-summary\" target=\"_blank\" rel=\"noopener\">Summary\u003c/a>\u003c/td>\u003ctd>end of chapter\u003c/td>\u003ctd>Before Quiz 3\u003c/td>\u003ctd>Quiz 3 (note: the Summary page is out of date on 8.3)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Quiz 3 review: \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 6\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 7\u003c/a>\u003c/td>\u003ctd>pp. 159–230\u003c/td>\u003ctd>Before class\u003c/td>\u003ctd>Quiz 3 (Study Notes tab links every section)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"materials\">\n\u003ch2>Materials\u003c/h2>\n\u003ch3>Textbook (primary source)\u003c/h3>\n\u003cul>\n\u003cli>OpenStax \u003ci>Business Ethics\u003c/i>, Chapter 8, sections 8.1–8.5 (pp. 231–264). All case facts marked \"book\" in the activities come from these sections.\u003c/li>\n\u003cli>Figures used: Fig. 8.3 (Google workforce by gender) and Fig. 8.4 (McKinsey: likelihood of above-median performance by diversity quartile).\u003c/li>\n\u003c/ul>\n\u003ch3>Outside sources (clearly marked as not from the textbook)\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Google ends diversity hiring targets (February 2025).\u003c/b> Reported by Reuters, NBC News and others. Google said it would no longer set hiring targets for representation, citing court decisions and U.S. executive orders. Meta, Amazon and Target also scaled back programs; Costco and Delta said they would continue theirs. Used in Circles round 2.\u003c/li>\n\u003cli>\u003cb>\u003ci>Groff v. DeJoy\u003c/i> (U.S. Supreme Court, June 29, 2023).\u003c/b> A unanimous ruling: an employer that denies a religious accommodation must show that granting it \"would result in substantial increased costs in relation to the conduct of its particular business.\" This replaced the older \"more than a minimal cost\" reading and makes religious accommodation harder to refuse than the book suggests. Used in the Accommodation Desk.\u003c/li>\n\u003cli>\u003cb>EU Pay Transparency Directive (2023/970).\u003c/b> Countries had to make it national law by 7 June 2026; only four of 27 (Italy, Slovakia, Lithuania, Malta) did so on time. Its main rules: pay range given before the interview; no questions about salary history; workers may ask for pay information; employers with 100+ workers report gender pay gaps (250+ annually from June 2027); an unexplained gap of 5% or more in a worker category that isn't fixed within six months triggers a joint pay assessment; the burden of proof shifts to the employer. Used on Rulebook card D.\u003c/li>\n\u003cli>\u003cb>U.S. minimum wage, 2026.\u003c/b> The federal minimum is still $7.25 per hour (unchanged since 2009). About 30 states and Washington, D.C. set a higher minimum; 20 states use $7.25. The book says 29 states. Used on Rulebook card A.\u003c/li>\n\u003cli>\u003cb>Teacher-made:\u003c/b> Meridian Freight (fictional), the meeting roles, the six accommodation requests, the payslips, the \"would you rather\" cards and the Quiz 3 case.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"ground\">\n\u003ch2>Ground rules for this week\u003c/h2>\n\u003cp>This chapter touches identity, religion, disability, sexual orientation and money. Most students will engage happily, but some may feel exposed. Set these rules at 9:30 before the circles (slide 8), and keep them up for the whole day.\u003c/p>\n\u003col>\n\u003cli>\u003cb>Speak from a workplace you know\u003c/b>, not on behalf of a country, religion or group.\u003c/li>\n\u003cli>\u003cb>No one has to share personal information\u003c/b> about their own health, beliefs, family or identity. Discuss policies and situations, not people in the room.\u003c/li>\n\u003cli>\u003cb>Challenge ideas, not people.\u003c/b> Use \"That argument assumes…\", not \"You are…\".\u003c/li>\n\u003cli>\u003cb>One pass per round.\u003c/b> Anyone may say \"I'll pass on this one\" without explaining.\u003c/li>\n\u003cli>\u003cb>Laws differ, and that's the point.\u003c/b> Saying \"In my previous workplace, the rule was…\" is information, not a judgment.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"note\">\u003cb>Your stance.\u003c/b> On contested political questions (for example, whether companies were right to end DEI targets), stay neutral. Ask for reasons, frameworks and stakeholders; don't give your own verdict. The goal is reasoning, not agreement.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"c1\">\n\u003ch2>Class 1 · Invited is not included (9:00–10:40)\u003c/h2>\n\n\u003cdiv class=\"activity\" id=\"c1a\">\n\u003ch3>9:00–9:14 · Engage: The Meeting Nobody Noticed\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Let students feel, not just hear, the difference between being in the room and being heard; generate the question for the day\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>14 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Groups of 5 (4 or 6 works; see note)\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 3–4; Handout 1 (task card + 5 secret role cards per group); sticky notes for the remote colleague; worksheet Part 1\u003c/div>\u003c/div>\n\u003cp>\u003cb>Teacher instructions.\u003c/b> Collect Journal #4 as students arrive. Put students in groups of five. Each group gets one task card (face up) and five secret role cards (face down). Each student takes one role card and does not show it. The group has four minutes to make a decision for Meridian Freight's annual team day.\u003c/p>\n\u003cp>\u003cb>Task card (read aloud):\u003c/b> \"You are Meridian Freight's planning team. Choose ONE option for this year's team day: (A) an evening dinner with drinks downtown; (B) a Saturday volunteer day at a food bank; (C) a weekday afternoon workshop with lunch. You have four minutes. Write your decision and one reason.\"\u003c/p>\n\u003cp>\u003cb>Secret role cards (Handout 1):\u003c/b>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Card\u003c/th>\u003cth>Role\u003c/th>\u003cth>Secret instruction\u003c/th>\u003cth>Hidden constraint\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Senior manager\u003c/td>\u003ctd>Speak first. Give your opinion early and confidently. Summarize the decision before time is up.\u003c/td>\u003ctd>None. You like option A.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Fast talker\u003c/td>\u003ctd>Jump in as soon as anyone pauses. Agree loudly with whoever is winning.\u003c/td>\u003ctd>None.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Remote colleague\u003c/td>\u003ctd>You are \"on a bad video call\". You may NOT speak. You can only write short notes on sticky notes and hold them up. You may speak only if someone reads your note aloud.\u003c/td>\u003ctd>You can't attend an evening event in person.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Newer colleague\u003c/td>\u003ctd>Speak ONLY if someone asks you by name.\u003c/td>\u003ctd>You care for a family member on Saturdays, so option B is impossible for you.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Colleague working in a second language\u003c/td>\u003ctd>Before you speak, count silently to five after the last speaker stops. If someone starts talking, start counting again.\u003c/td>\u003ctd>You don't drink alcohol and an evening at a bar would be uncomfortable for you.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>\u003cb>1 min.\u003c/b> Hand out cards. Say: \"Read your card. Don't show anyone. Follow it exactly.\"\u003c/li>\n\u003cli>\u003cb>4 min.\u003c/b> Groups decide (slide 3 timer).\u003c/li>\n\u003cli>\u003cb>2 min.\u003c/b> Each group calls out its decision. Write them on the board. Most groups usually choose A or B.\u003c/li>\n\u003cli>\u003cb>5 min.\u003c/b> Reveal (slide 4). Ask the remote colleagues: \"Did anyone read your notes?\" Ask the newer colleagues: \"Did anyone ask your name? What did you want to say?\" Ask the second-language colleagues: \"How many times did you get to five?\" Then ask the card 4 and card 5 players to read their hidden constraints aloud. Ask the whole class: \"Was your decision a good one?\"\u003c/li>\n\u003cli>\u003cb>2 min.\u003c/b> Worksheet Part 1: one thing that would have changed the meeting.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"say\">Everyone was invited to this meeting. Not everyone was heard. And the people who weren't heard had information the group needed: the decision you made may exclude the people you didn't hear from. That's this week's question: what's the difference between being invited and being included?\u003c/div>\n\u003cp>\u003cb>Expected outcome:\u003c/b> cards 1 and 2 dominate; cards 3, 4 and 5 rarely speak; at least one group chooses an option that excludes a silent member. Students are often surprised and slightly uncomfortable, which is the point.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Group size.\u003c/b> Groups of 4: drop card 2. Groups of 6: give two students card 2. If a student seems uncomfortable with a role, let them be an observer who counts how often each person speaks.\u003c/div>\n\u003ch4>Debrief questions\u003c/h4>\n\u003cul>\u003cli>Who spoke most? Was that because they had the best ideas?\u003c/li>\u003cli>What could the senior manager have done differently? (Ask each person by name; collect written ideas first; read notes aloud.)\u003c/li>\u003cli>Which of these roles have you seen in real meetings in your field?\u003c/li>\u003cli>The book lists \"changing meeting formats so everyone can be heard\" as one thing leaders can do (8.1). What would that look like in your workplace?\u003c/li>\u003c/ul>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>I noticed that…\u003c/span>\u003cspan>We didn't hear from…\u003c/span>\u003cspan>In hindsight, we should have…\u003c/span>\u003cspan>What would have helped me was…\u003c/span>\u003cspan>The decision looked fair, but…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1b\">\n\u003ch3>9:14–9:30 · Study: Invited vs. included, and Data Detective\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Give the 8.1 concepts; practice reading evidence critically (correlation vs. causation)\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>16 min (5 input + 9 pairs + 2 check)\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Pairs\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 5–7; worksheet Part 2\u003c/div>\u003c/div>\n\u003cp>\u003cb>5-minute input (slide 5).\u003c/b> Teaching notes:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Ross's metaphor (8.1).\u003c/b> Howard J. Ross, founder of the diversity consulting firm Cook Ross: diversity is \"being invited to the party\"; inclusion is \"being asked to dance\". He also says diversity is the mix of ingredients, and inclusion is the container that lets people feel they belong while staying distinct.\u003c/li>\n\u003cli>\u003cb>Wider definition.\u003c/b> The Society for Human Resource Management (SHRM) says diversity now includes thinking styles, personality types, physical and cognitive abilities and sexual orientation, not only race, gender and religion. The book adds age, experience and country of residence, which support a \"global mindset\".\u003c/li>\n\u003cli>\u003cb>Diversity dividend.\u003c/b> The book's term for the financial benefit linked to a diverse workforce.\u003c/li>\n\u003cli>\u003cb>The warning.\u003c/b> The book says plainly that \"positive correlations do not equal causation\". Diversity is linked to better creativity, decisions, employee satisfaction and customer goodwill, and those improve results.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Data Detective (9 min, worksheet Part 2, slides 6–7).\u003c/b> Slide 6 shows the Fig. 8.4 numbers: in the McKinsey study, companies in the top quartile for \u003cb>gender\u003c/b> diversity were 15% more likely to have financial returns above their national industry median (54 vs. 47 on the chart). For \u003cb>ethnic\u003c/b> diversity, the figure was 35% (58 vs. 43). Top-quartile firms for executive and/or board diversity had returns on equity more than 50% higher than the bottom quartile. Pairs judge five \"headlines\" as \u003ci>Supported\u003c/i>, \u003ci>Overstated\u003c/i> or \u003ci>Not supported\u003c/i>, then press \"Check\" on the worksheet.\u003c/p>\n\u003col>\n\u003cli>\"Ethnically diverse companies earn 35% more profit.\" → \u003cb>Overstated.\u003c/b> The 35% is about how much \u003ci>more likely\u003c/i> they are to beat the median, not how much more they earn.\u003c/li>\n\u003cli>\"Companies in the top quartile for ethnic diversity were more likely to beat their industry median.\" → \u003cb>Supported.\u003c/b>\u003c/li>\n\u003cli>\"Hiring more women will make your company more profitable.\" → \u003cb>Not supported\u003c/b> as a cause. The data show a link, not a cause.\u003c/li>\n\u003cli>\"Firms with the most diverse boards and executives had returns on equity over 50% higher than the least diverse.\" → \u003cb>Supported.\u003c/b>\u003c/li>\n\u003cli>\"Diversity creates tension, so it hurts performance.\" → \u003cb>Not supported.\u003c/b> The book says diversity can create tension, but managers can deal with it through inclusion; the data point the other way.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Check (2 min).\u003c/b> Ask: \"If the link isn't a cause, what might explain it?\" (Successful firms can afford to recruit widely; diverse teams consider more viewpoints; better customer understanding.)\u003c/p>\n\u003cdiv class=\"flag\">\u003cb>Flag:\u003c/b> The book's own end-of-chapter answer to question 4 says diverse companies had \"earnings between 15 and 35 percent greater\" than industry medians. That is the same error as headline 1. If a sharp student finds it, praise them: that's exactly the skill.\u003c/div>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>The data show a link between… and…\u003c/span>\u003cspan>That doesn't prove that…\u003c/span>\u003cspan>It's more accurate to say…\u003c/span>\u003cspan>An alternative explanation is…\u003c/span>\u003cspan>The headline overstates…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1c\">\n\u003ch3>9:30–10:02 · Activate: Discussion circles (syllabus activity)\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Structured, respectful discussion of three hard DEI questions; practice clarifying and complicating\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>32 min (4 setup + 3 × 8 rounds + 4 report)\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>New groups of 4–5 (mix professions)\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 8–11; Handout 2 (role cards + three prompt cards per group); worksheet Part 3\u003c/div>\u003c/div>\n\u003cp>\u003cb>Setup (4 min, slide 8).\u003c/b> Read the ground rules aloud. Hand out the five role cards. Roles rotate clockwise each round, so everyone plays at least three.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Role\u003c/th>\u003cth>Job\u003c/th>\u003cth>Sentence starters\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Facilitator\u003c/td>\u003ctd>Reads the card, makes sure everyone speaks once before anyone speaks twice\u003c/td>\u003ctd>\"Let's hear from ___ first.\" \"We have two minutes left.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Clarifier\u003c/td>\u003ctd>Checks understanding before the group argues\u003c/td>\u003ctd>\"So what you're saying is…?\" \"Do you mean… or…?\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Complicator\u003c/td>\u003ctd>Adds a \"what if\" that makes the question harder\u003c/td>\u003ctd>\"What if the company were…?\" \"Would that still hold if…?\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Book connector\u003c/td>\u003ctd>Finds what the book says (or that it doesn't say)\u003c/td>\u003ctd>\"Section 8.1 says…\" \"The book doesn't cover this, but…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Reporter\u003c/td>\u003ctd>Writes the group's best \"It depends on…\" sentence\u003c/td>\u003ctd>\"We agreed that it depends on whether…\"\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>(Groups of 4: the facilitator is also the reporter.)\u003c/p>\n\n\u003ch4>Round 1 (8 min, slide 9) · Speech or conduct? (book, 8.1)\u003c/h4>\n\u003cp>In 2017, a senior Google software engineer wrote an internal memo criticizing the company's diversity programs. It said women's underrepresentation in tech had partly \"biological causes\". The memo leaked, there were protests on social media, and Google fired him. In February 2018 the National Labor Relations Board found that the firing did not break federal labor law. It said he was dismissed for conduct that demeaned women, not for discussing working conditions. The book notes there is no right of free speech in a private-sector workplace.\u003c/p>\n\u003cul>\u003cli>Should employees be free to criticize their company's diversity programs at work?\u003c/li>\u003cli>Where is the line between an opinion and conduct that harms colleagues?\u003c/li>\u003cli>Would your answer change if he had sent the memo only to his manager?\u003c/li>\u003cli>Complicator: \"What if the memo had criticized a program for older workers instead?\"\u003c/li>\u003c/ul>\n\n\u003ch4>Round 2 (8 min, slide 10) · When the wind changes (book + outside source)\u003c/h4>\n\u003cp>\u003cb>Book (8.1):\u003c/b> from 2014, many tech companies published diversity statistics. More than 30 companies, including Intel, Spotify, Lyft, Airbnb and Pinterest, signed a pledge to increase diversity and inclusion, and Google pledged more than $100 million. \u003cb>Outside the book (February 2025):\u003c/b> Google said it would no longer set hiring targets for representation, citing court decisions and U.S. executive orders. Meta, Amazon and Target also scaled back programs. Costco and Delta said they would continue theirs.\u003c/p>\n\u003cul>\u003cli>Should a company's values change when the law or political pressure changes? What's the difference between a value and a program?\u003c/li>\u003cli>Is a hiring target the same thing as inclusion? Could a company drop the targets and still be inclusive, or keep them and still not be?\u003c/li>\u003cli>Which stakeholders gain and which lose under each choice?\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>Keep it neutral.\u003c/b> You are not asking whether students support a government or party. Redirect any political point to the business question: \"What should a company do when the rules around it change?\"\u003c/div>\n\n\u003ch4>Round 3 (8 min, slide 11) · One company, many laws (book 8.3 + outside source)\u003c/h4>\n\u003cp>Meridian Freight gives the same benefits to employees' same-sex partners as to opposite-sex spouses in the U.S., where (according to the online edition of the book) the Supreme Court held in \u003ci>Bostock v. Clayton County\u003c/i> (2020) that sex discrimination at work includes discrimination based on sexual orientation and gender identity. In the EU, the Employment Equality Directive (2000) also bans discrimination at work based on sexual orientation. Meridian is opening an office in a country with no such protection, where some of these benefits may conflict with local law.\u003c/p>\n\u003cul>\u003cli>Should Meridian apply one global policy everywhere, or follow each country's law?\u003c/li>\u003cli>What if applying the global policy put local employees at legal or social risk?\u003c/li>\u003cli>The book (8.1) describes Marriott CEO Arne Sorenson's public letter: everyone, regardless of orientation, gender, race, religion, disability or ethnicity, should have an equal opportunity to get a job. Is it a CEO's role to say this publicly?\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>Alternative card (Handout 2, Card 3B).\u003c/b> If you judge that this topic doesn't suit your group, use Card 3B instead: \"Meridian's global dress code says 'no head coverings in client meetings'. Should it have one global dress code at all?\" (connects to Abercrombie &amp; Fitch, 8.2). Make this decision before class.\u003c/div>\n\n\u003cp>\u003cb>Report (4 min).\u003c/b> Each reporter reads one \"It depends on…\" sentence. Write the key words on the board (\"whether it targets people\", \"whether it's a value or a tactic\", \"local risk\").\u003c/p>\n\u003ch4>Debrief questions\u003c/h4>\n\u003cul>\u003cli>Which round produced the most disagreement in your group? Why?\u003c/li>\u003cli>Did anyone change position? What changed it?\u003c/li>\u003cli>Which role was hardest to play?\u003c/li>\u003c/ul>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>I see where you're coming from, but…\u003c/span>\u003cspan>That may be true in some workplaces, but…\u003c/span>\u003cspan>I'd distinguish between… and…\u003c/span>\u003cspan>Would that still apply if…?\u003c/span>\u003cspan>From a rights-based perspective, …\u003c/span>\u003cspan>The strongest argument on the other side is…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1d\">\n\u003ch3>10:02–10:33 · Activate: The Accommodation Desk\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Apply reasonable accommodation and undue hardship to realistic requests; experience three stakeholder perspectives\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>31 min (5 input + 22 desk + 4 debrief)\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Groups of 3\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 12–13; Handout 3 (three role cards + six request cards per group); worksheet Part 4\u003c/div>\u003c/div>\n\u003cp>\u003cb>5-minute input (slide 12).\u003c/b> Students first do the quick \"Which rule?\" match in worksheet Part 4 (90 seconds), then you confirm:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Disability (ADA, 1990, 8.2):\u003c/b> employers can't refuse a qualified person because of a disability, and must make \u003cb>reasonable accommodations\u003c/b> (accessible workplace, restructured job, equipment, part-time or modified schedules, readers, interpreters) unless that causes \u003cb>undue hardship\u003c/b> (significant difficulty or expense).\u003c/li>\n\u003cli>\u003cb>Employees don't need the \"magic words.\"\u003c/b> A request may sound like a scheduling problem (\"I can't get here on time because of my treatment\"). Managers must recognize it. Verizon paid $20 million, the largest single disability settlement in EEOC history, over a rigid no-fault attendance policy.\u003c/li>\n\u003cli>\u003cb>Religion (Title VII, 1964, 8.2):\u003c/b> four duties: nondiscrimination, nonharassment, nonretaliation and reasonable accommodation. The employer must prove any hardship. Covered beliefs include nontraditional and nonreligious moral beliefs held as sincerely (\u003ci>Welsh\u003c/i>, 1970). Abercrombie &amp; Fitch (2015): an employer may not refuse to hire someone to avoid accommodating a religious practice.\u003c/li>\n\u003cli>\u003cb>Update (outside the book): \u003ci>Groff v. DeJoy\u003c/i> (2023).\u003c/b> To deny a religious accommodation, the employer must show \"substantial increased costs\" in relation to its particular business. Minor costs or colleagues' annoyance are not enough.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>How the desk works (22 min, slide 13).\u003c/b> Each group has three roles. Roles rotate after every request.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Employee:\u003c/b> reads the request card and explains it in their own words, adding realistic detail.\u003c/li>\n\u003cli>\u003cb>Operations manager:\u003c/b> raises one practical concern (cost, coverage, safety, colleagues).\u003c/li>\n\u003cli>\u003cb>HR partner:\u003c/b> asks one question, then decides: \u003cb>Grant\u003c/b>, \u003cb>Grant with changes\u003c/b> or \u003cb>Deny (undue hardship)\u003c/b>, and names the rule or test. Everyone records the decision in Part 4.\u003c/li>\n\u003c/ul>\n\u003cp>About 3½ minutes per request. Groups should finish at least four; fast groups do all six.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>#\u003c/th>\u003cth>Request (Handout 3)\u003c/th>\u003cth>Book or outside link\u003c/th>\u003cth>Likely outcome (for the debrief)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003cb>Sunday shifts.\u003c/b> A warehouse supervisor asks not to work Sundays for religious reasons. Weekend shifts rotate. Two colleagues could swap but say it's unfair to them.\u003c/td>\u003ctd>Title VII (8.2); \u003ci>Groff\u003c/i> (outside)\u003c/td>\u003ctd>Grant or grant with changes (voluntary swaps, premium pay for Sunday volunteers). Colleagues' annoyance alone is not undue hardship after \u003ci>Groff\u003c/i>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003cb>Mornings.\u003c/b> A data analyst has been late on Tuesdays and Thursdays six times this month. When warned, she says, \"I have hospital appointments early those mornings and the train takes 90 minutes.\" Policy: three late arrivals = written warning.\u003c/td>\u003ctd>ADA; no \"magic words\"; Verizon (8.2)\u003c/td>\u003ctd>Treat as a possible accommodation request. Modified start time on those days; don't discipline under a rigid policy without talking first.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003cb>The look policy.\u003c/b> A candidate for a customer-facing sales job wears a hijab. The store manager says the brand's \"look\" means no head coverings, and wants to hire someone else \"just to avoid problems\".\u003c/td>\u003ctd>Abercrombie &amp; Fitch (2015, 8.2)\u003c/td>\u003ctd>Refusing to hire to avoid accommodating a religious practice is discrimination. Hire on merit; the look policy must allow an exception.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003cb>The kirpan.\u003c/b> A Sikh engineer in the Fresno, California office wants to wear a kirpan (a small sheathed blade required by his faith) at work. Some colleagues say they feel uncomfortable.\u003c/td>\u003ctd>Sikh kirpan, California law (8.2)\u003c/td>\u003ctd>Grant with changes is common: worn openly and sheathed (California allows this), size limits, a conversation with the team. Colleagues' discomfort alone is not undue hardship; a real, specific safety risk may be.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003cb>The team reward.\u003c/b> The quarterly team reward is always drinks at a bar. Two employees ask for a change: one doesn't drink for religious reasons; the other simply prefers not to.\u003c/td>\u003ctd>Rethinking incentives (8.1)\u003c/td>\u003ctd>Not strictly a legal accommodation for the second employee, but an inclusion issue. Rotate or offer a menu of rewards. Good example of ethics going beyond law.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003cb>June 19.\u003c/b> The annual summer picnic is booked for June 19. Several Black employees want to mark Juneteenth with family and community events. Catering is already paid for.\u003c/td>\u003ctd>\u003ci>What Would You Do?\u003c/i> (8.2). Juneteenth: the day in 1865 that news of emancipation reached enslaved people in Texas\u003c/td>\u003ctd>Many options: make it a Juneteenth celebration; move the event to a different time of day; allow people to attend part. Key point: ask the employees, don't decide for them.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Debrief (4 min).\u003c/b> Take one decision per request from different groups. Ask: \"Which request was hardest? Did the operations manager's concern ever reach undue hardship?\"\u003c/p>\n\u003cdiv class=\"say\">Notice how often the answer was \"grant with changes\". Reasonable accommodation is usually a conversation, not a yes-or-no ruling.\u003c/div>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>Could you tell me more about…?\u003c/span>\u003cspan>Would it work if we…?\u003c/span>\u003cspan>The cost would be…, but is it substantial?\u003c/span>\u003cspan>We can grant this on the condition that…\u003c/span>\u003cspan>Unfortunately, this would cause undue hardship because…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1e\">\n\u003ch3>10:33–10:40 · Bridge: The Payslip\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Create a question for Class 2; individual exit ticket\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>7 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Individual\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slide 14; worksheet Part 5\u003c/div>\u003c/div>\n\u003cp>Show two Meridian Freight payslips (slide 14; full case on Handout 5):\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>\u003c/th>\u003cth>Dana Reyes\u003c/th>\u003cth>Marco Bianchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Title\u003c/td>\u003ctd>Customer Insights Analyst\u003c/td>\u003ctd>Logistics Data Analyst\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Annual salary\u003c/td>\u003ctd>$68,000\u003c/td>\u003ctd>$76,000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Experience\u003c/td>\u003ctd>4 years\u003c/td>\u003ctd>4 years\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Work\u003c/td>\u003ctd colspan=\"2\">Both build dashboards, present findings to clients and supervise one intern. Different teams, different titles.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Students answer worksheet Part 5 alone: \u003cb>Fair?\u003c/b> (Yes / No / It depends) and \u003cb>Legal?\u003c/b> (Yes / No / It depends), with one reason each.\u003c/p>\n\u003cdiv class=\"say\">After the break, you'll find out whether this is legal. The answer depends on where Meridian is.\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"bridge\">\n\u003ch2>The bridge (during the break)\u003c/h2>\n\u003cp>Ask students to call out or show their Part 5 votes before they leave (or count hands). Note the totals for \"Fair?\" and \"Legal?\" on slide 20 (click a box to type the number). Most classes vote \"No\" or \"It depends\" for fair, and split on legal. That split is the hook for Class 2.\u003c/p>\n\u003cp>During the break, put the four Rulebook cards (Handout 5) on four tables and the case brief on every table.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"c2\">\n\u003ch2>Class 2 · Rights across borders (11:10–12:50)\u003c/h2>\n\n\u003cdiv class=\"activity\" id=\"c2a\">\n\u003ch3>11:10–11:20 · Engage: Would you rather? (with a switch rule)\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Re-energize after the break; bring in 8.4 and 8.5 through choices professionals actually face\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>10 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Whole class (left side / right side of the room)\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 17–20; worksheet Part 6\u003c/div>\u003c/div>\n\u003cp>\u003cb>The switch rule:\u003c/b> After both sides give one argument, anyone convinced by the other side walks across. Count the switchers. The side that wins switchers \"wins\" the round.\u003c/p>\n\u003col>\n\u003cli>\u003cb>Card 1 (8.4, slide 17):\u003c/b> Would you rather work for \u003cb>Company A\u003c/b>, which pays everyone at least 40% above the local minimum wage but has a 15% gender pay gap, or \u003cb>Company B\u003c/b>, which pays exactly the legal minimum and has no gender pay gap?\u003c/li>\n\u003cli>\u003cb>Card 2 (8.5, slide 18):\u003c/b> You run a new cosmetics brand. Would you rather \u003cb>launch in the U.S. this year\u003c/b> using ingredients that were tested on animals (legal there), or \u003cb>wait 18 months\u003c/b> to reformulate without animal testing so you can also sell in the EU? (Book: the EU banned animal testing for cosmetics and the sale of animal-tested cosmetics in 2013; about forty nations have acted.)\u003c/li>\n\u003cli>\u003cb>Card 3 (8.4, slide 19):\u003c/b> You're the CEO. Would you rather \u003cb>raise all entry-level wages above the legal minimum\u003c/b>, or \u003cb>keep wages and pay the same money as a one-time bonus to top performers\u003c/b>?\u003c/li>\n\u003c/ol>\n\u003cp>About 2½ minutes per card. Then show the Payslip votes from the break (slide 20).\u003c/p>\n\u003cp>\u003cb>Book link for card 3:\u003c/b> 8.4 lists companies that raised wages above the minimum (Costco, IKEA, Target, banks at $15) and asks: \"How would you explain to a board of directors your decision to pay entry-level workers more than the law requires?\" Students will answer that question later in The Board Asks.\u003c/p>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>I'd rather…, because…\u003c/span>\u003cspan>I'd go for… on condition that…\u003c/span>\u003cspan>You've convinced me, because…\u003c/span>\u003cspan>That's a false choice; what about…?\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2b\">\n\u003ch3>11:20–11:55 · Case study: Same Job, Four Rulebooks (jigsaw, syllabus activity)\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Compare legal and ethical approaches to the same rights issue across jurisdictions; build a policy for a global company\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>35 min (3 brief + 12 experts + 14 home groups + 6 reveal)\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Four expert groups (A–D), then mixed home groups of 4\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 21–22; Handout 5 (case brief + Rulebook cards A–D); worksheet Part 7\u003c/div>\u003c/div>\n\u003cp>\u003cb>Step 1 · The case (3 min).\u003c/b> Everyone reads the case brief (Handout 5, also in worksheet Part 7): Dana's offer was based on her previous salary; Marco negotiated a higher start. Both have the same degree level and four years' experience, build dashboards, present to clients and supervise an intern. Dana found out about the gap when a colleague mentioned Marco's salary. She has worked at Meridian for three years.\u003c/p>\n\u003cp>\u003cb>Step 2 · Expert groups (12 min).\u003c/b> Assign each student a letter A–D. Each expert group studies one rulebook and answers four questions on the worksheet:\u003c/p>\n\u003col>\u003cli>Under our rulebook, is Dana's pay gap likely to be illegal?\u003c/li>\u003cli>What would Dana need to show?\u003c/li>\u003cli>What must (or should) Meridian do now?\u003c/li>\u003cli>One strength and one weakness of our rulebook.\u003c/li>\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Card\u003c/th>\u003cth>Rulebook\u003c/th>\u003cth>Key facts on the card\u003c/th>\u003cth>Source\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A\u003c/td>\u003ctd>U.S. federal law\u003c/td>\u003ctd>Federal standard: \"equal pay for equal work\" (the jobs must be equal). Women are paid about 80% of what men are paid (AAUW and Pew, cited in the book). Federal minimum wage $7.25 (unchanged since 2009; about 30 states set more).\u003c/td>\u003ctd>Book 8.4 + outside update\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B\u003c/td>\u003ctd>New Jersey: Diane B. Allen Equal Pay Act\u003c/td>\u003ctd>Standard: \"equal pay for \u003ci>substantially similar\u003c/i> work\", judged by skill, effort and responsibility, not job title. An employee can recover up to six years of underpayment, and damages are tripled.\u003c/td>\u003ctd>Book 8.4\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C\u003c/td>\u003ctd>Minnesota pay equity\u003c/td>\u003ctd>Jobs are evaluated by knowledge, problem solving, responsibility and working conditions, not titles. Applies only to state government employees. Links to Chapter 6's \"comparable worth\".\u003c/td>\u003ctd>Book 8.4 + Ch. 6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D\u003c/td>\u003ctd>EU Pay Transparency Directive\u003c/td>\u003ctd>Pay range given before the interview; employers may not ask about salary history; workers can ask for pay information; employers with 100+ workers report gender pay gaps; an unexplained gap of 5% or more in a worker category, not fixed within 6 months, triggers a joint pay assessment; burden of proof on the employer. Deadline 7 June 2026; only 4 of 27 countries met it.\u003c/td>\u003ctd>Outside source\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Step 3 · Home groups (14 min).\u003c/b> New groups with one expert from each rulebook. Each expert teaches their rulebook in 90 seconds while the others complete the comparison grid (worksheet Part 7). Then the group writes Meridian's \u003cb>global pay policy\u003c/b> in three lines, choosing one approach:\u003c/p>\n\u003cul>\u003cli>\u003cb>Local:\u003c/b> follow each location's law (the legal minimum everywhere);\u003c/li>\u003cli>\u003cb>Strictest:\u003c/b> apply the strictest rule everywhere;\u003c/li>\u003cli>\u003cb>Hybrid:\u003c/b> something in between (explain it).\u003c/li>\u003c/ul>\n\u003cp>They must name one ethical framework that supports their choice (utilitarian, Kantian/rights, Rawls's justice, virtue) and one stakeholder who loses.\u003c/p>\n\u003cp>\u003cb>Step 4 · Reveal (6 min, slide 22).\u003c/b> Go through the likely answer for each rulebook (see Answer Key tab). Then ask: \"Which rulebook would you want if you were Dana? If you were Meridian's CFO? If you didn't know which one you'd be?\" (Rawls's veil of ignorance, Week 2.)\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Using students' experience.\u003c/b> Add an optional fifth \"expert\" for any student whose workplace had a different system (pay bands, published salary scales, union pay scales). They speak from the workplace they know, not for a country.\u003c/div>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>Under rulebook ___, employers must…\u003c/span>\u003cspan>Dana would have to show that…\u003c/span>\u003cspan>The burden of proof is on…\u003c/span>\u003cspan>The main weakness is that…\u003c/span>\u003cspan>If Meridian applied the strictest rule everywhere, …\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2c\">\n\u003ch3>11:55–12:10 · Activate: The Board Asks\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Defend a policy under pressure; answer the book's question about paying more than the law requires\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>15 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Home groups; a rotating \"board\" of 3\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slide 23; Handout 6 (board question cards); worksheet Part 8\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>1 min.\u003c/b> Each home group chooses a presenter. You chair the board. Two students from the next group join you as board members and draw one question card each.\u003c/li>\n\u003cli>\u003cb>About 2½ minutes per group.\u003c/b> The presenter pitches the policy (60 seconds). The board asks one question (card). The presenter answers in 30 seconds, and a teammate can add one sentence.\u003c/li>\n\u003cli>\u003cb>Last 2 min.\u003c/b> Everyone votes for the most convincing answer (not the policy they like best) using three criteria: names a framework, gives evidence, answers the cost question.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Board question cards (Handout 6):\u003c/b>\u003c/p>\n\u003cul>\n\u003cli>\"Why should we pay more than the law requires?\"\u003c/li>\n\u003cli>\"How much will this cost us, and who pays?\"\u003c/li>\n\u003cli>\"Marco negotiated better. Isn't rewarding negotiation fair?\"\u003c/li>\n\u003cli>\"Our competitors follow only local law. Won't we lose money?\"\u003c/li>\n\u003cli>\"What do we do in countries where the law is weaker?\"\u003c/li>\n\u003cli>\"The data show correlation, not causation. Why should we believe this helps the business?\"\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"say\">The question \"Why pay more than the law requires?\" is the book's own question. A good answer usually has two parts: a business reason and an ethical reason.\u003c/div>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>That's a fair question. Our answer is…\u003c/span>\u003cspan>In the short term…, but in the long term…\u003c/span>\u003cspan>The cost of not doing this is…\u003c/span>\u003cspan>Even if…, we would still…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2d\">\n\u003ch3>12:10–12:20 · Activate: From red lines to a code\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Start the Personal Code of Ethics draft; learn to write specific, checkable commitments\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>10 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Individual, then pairs\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 24–25; worksheet Part 9; the Code of Ethics Draft tab\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>2 min (slide 24).\u003c/b> Show the five-part code template: (1) core values, (2) commitments to stakeholders, (3) red lines, (4) a hard case, (5) how I'll keep my code. Remind students that their Week 7 \"red lines\" (worksheet Part 12) go into Part 3.\u003c/li>\n\u003cli>\u003cb>3 min (slide 25).\u003c/b> Vague → specific. Students rewrite three vague promises so someone could check them (worksheet Part 9):\n\u003cul>\u003cli>\"I will be fair.\" → \"I will base pay recommendations on job content, not on a person's salary history.\"\u003c/li>\u003cli>\"I will respect diversity.\" → \"In meetings I lead, I will ask everyone for input before I give my opinion.\"\u003c/li>\u003cli>\"I will be honest.\" → \"I will correct a mistake in a client report within one working day of finding it.\"\u003c/li>\u003c/ul>\u003c/li>\n\u003cli>\u003cb>3 min.\u003c/b> Each student writes their own rights commitment: \"To respect the rights of everyone I work with, I will…\"\u003c/li>\n\u003cli>\u003cb>2 min.\u003c/b> Pair check with one question: \"Could someone check whether you kept this promise?\" If not, make it more specific.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"note\">Point students to the \u003cb>Code of Ethics Draft\u003c/b> tab on their page. It saves automatically, counts words, builds the finished code as one document and lets them download or print it. They'll bring it to Week 9 for peer review.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2e\">\n\u003ch3>12:20–12:45 · Assess: Quiz 3 (Chapters 6–8)\u003c/h3>\n\u003cul>\n\u003cli>Print the Quiz 3 tab (student version: keep the teacher key hidden). 30 points: Part A multiple choice (10), Part B matching (8), Part C short case response (12).\u003c/li>\n\u003cli>No phones or notes. Give a 5-minute warning at 12:40.\u003c/li>\n\u003cli>The answer key and the Part C rubric are in the Quiz 3 tab (tap \u003cb>Show teacher key\u003c/b>).\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>Why the end of Class 2?\u003c/b> As with Quiz 1 in Week 3, the quiz includes the chapter taught this week, so it comes after students have used the Chapter 8 ideas several times. Part C is a case like the Accommodation Desk and the Four Rulebooks. If you prefer, give the quiz at the start of Week 9 and use these 25 minutes to extend the Board Asks and the code draft.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2f\">\n\u003ch3>12:45–12:50 · Close: Exit ticket and homework\u003c/h3>\n\u003cp>\u003cb>Exit ticket (worksheet Part 10):\u003c/b> (1) One difference between diversity and inclusion. (2) One thing a company should do even if the law doesn't require it. (3) Confidence today, 1–4.\u003c/p>\n\u003cp>\u003cb>Homework:\u003c/b> complete the Personal Code of Ethics draft (Code of Ethics Draft tab, 350–450 words) and bring it to Week 9 for peer review. Read 8.5 if you haven't. Preview Chapter 9 (from p. 265).\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"lang\">\n\u003ch2>Discussion language (B2+)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Function\u003c/th>\u003cth>Language\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Raising a sensitive point carefully\u003c/td>\u003ctd>\"This may be a sensitive point, but…\" · \"I'd like to raise something without making it personal…\" · \"Speaking from my last workplace, …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hedging\u003c/td>\u003ctd>\"It could be argued that…\" · \"To some extent…\" · \"That may not apply to every workplace.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Clarifying\u003c/td>\u003ctd>\"So what you're saying is…?\" · \"Are you distinguishing between… and…?\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Complicating\u003c/td>\u003ctd>\"Would that still hold if…?\" · \"What if the company were…?\" · \"That works for…, but what about…?\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Applying a framework\u003c/td>\u003ctd>\"From a rights-based perspective, …\" · \"A utilitarian would weigh… against…\" · \"Behind a veil of ignorance, I'd choose… because I might be…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Disagreeing respectfully\u003c/td>\u003ctd>\"I see your point, but I'd question whether…\" · \"I agree up to a point; however…\" · \"The strongest argument for your side is…, but…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rules and policy\u003c/td>\u003ctd>\"Employers must… / are required to…\" · \"They're not allowed to…\" · \"An employer may refuse only if…\" · \"The burden of proof is on…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Changing your mind\u003c/td>\u003ctd>\"I've changed my mind slightly: …\" · \"That's made me rethink…\"\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"hw\">\n\u003ch2>Homework: Personal Code of Ethics (draft)\u003c/h2>\n\u003cp>\u003cb>Task.\u003c/b> Complete all five parts in the Code of Ethics Draft tab (350–450 words in total). Bring it to Week 9 for peer review (printed, downloaded or on a device).\u003c/p>\n\u003col>\n\u003cli>\u003cb>My core values\u003c/b> (three values, with what each means in my work).\u003c/li>\n\u003cli>\u003cb>My commitments\u003c/b> to my employer or organization, to colleagues, to clients or the public, and to respecting the rights of everyone I work with.\u003c/li>\n\u003cli>\u003cb>My red lines\u003c/b> (two or three \"I will never…\" statements; use your Week 7 red lines).\u003c/li>\n\u003cli>\u003cb>A hard case\u003c/b> from my field, with the ethical framework I'd use and what I'd do.\u003c/li>\n\u003cli>\u003cb>How I will keep my code\u003c/b> (how I'll check myself, and who I'd talk to).\u003c/li>\n\u003c/ol>\n\u003ch3>Rubric (20 points)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>Points\u003c/th>\u003cth>What a strong draft does\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Completeness and structure\u003c/td>\u003ctd>5\u003c/td>\u003ctd>All five parts; clear headings; 350–450 words\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Specific, checkable commitments\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Promises someone could observe (\"I will ask everyone for input before I give my opinion\"), not slogans (\"I will be fair\")\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Use of course concepts\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Uses at least four course terms accurately (e.g., stakeholder, conflict of interest, reasonable accommodation, inclusion, pay equity, whistleblowing)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Reasoning in the hard case\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Names a framework and applies it, considers another view\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Language\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Accurate modals (\u003ci>will, would, must, should\u003c/i>); range of vocabulary; few errors that block meaning\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>A model code is in the Code of Ethics Draft tab (students can open it) and in the Answer Key tab.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"check\">\n\u003ch2>Check for understanding\u003c/h2>\n\u003cp>Quick oral checks you can use during Class 1 or before the quiz:\u003c/p>\n\u003col>\n\u003cli>What's the difference between diversity and inclusion? (Mix of people vs. engagement of all; invited vs. asked to dance.)\u003c/li>\n\u003cli>Does the McKinsey study prove diversity causes profit? (No; correlation, not causation.)\u003c/li>\n\u003cli>When can an employer refuse a reasonable accommodation? (Undue hardship; for religion, substantial increased costs after \u003ci>Groff\u003c/i>.)\u003c/li>\n\u003cli>Does an employee have to say the word \"disability\" to ask for an accommodation? (No.)\u003c/li>\n\u003cli>What's the difference between \"equal work\" and \"substantially similar work\"? (Identical jobs vs. jobs alike in skill, effort, responsibility.)\u003c/li>\n\u003cli>Name one way a business can reduce income inequality without a change in the law. (Pay above the minimum; hire workers as employees with benefits rather than as contractors; pay women and men equally for similar work.)\u003c/li>\n\u003c/ol>\n\u003cp>The Exit ticket (Part 10) and Quiz 3 Part C show whether students can apply the ideas, not just define them.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"align\">\n\u003ch2>How Week 8 builds toward the assessments\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>This week's preparation\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Quiz 3 (this week)\u003c/td>\u003ctd>Data Detective and the Accommodation Desk practice the Chapter 8 terms; the Study Notes tab reviews Chapters 6–7; Part C mirrors the Accommodation Desk and the Four Rulebooks.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Written assignments (15%)\u003c/td>\u003ctd>Personal Code of Ethics draft started in class, finished at home, peer-reviewed in Week 9.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Final assessment (Week 11)\u003c/td>\u003ctd>Comparing jurisdictions and recommending a policy with a framework and a counterargument is the same skill as the final's case analysis and essay.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Participation (20%)\u003c/td>\u003ctd>Circle roles, desk roles and board pitches give every student a visible speaking job. The worksheet records it.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"prep\">\n\u003ch2>Materials to prepare\u003c/h2>\n\u003cul>\n\u003cli>☐ Upload \u003ccode>students.html\u003c/code> and \u003ccode>teachers.html\u003c/code> to the Week 8 folder on GitHub and share the student link.\u003c/li>\n\u003cli>☐ Decide on Round 3: Card 3 (sexual orientation and global policy) or Card 3B (dress code). Print only the one you'll use.\u003c/li>\n\u003cli>☐ Print from the Handouts tab: Handout 1 (task card + 5 secret roles, one set per group of 5, cut); Handout 2 (role cards + prompt cards, one set per circle); Handout 3 (three role cards + six request cards per group of 3); Handout 5 (case brief for everyone; Rulebook cards A–D, enough for each expert group); Handout 6 (board question cards, one set, cut); Handout 7 (exit tickets, if you don't want to use the worksheet).\u003c/li>\n\u003cli>☐ Sticky notes for the \"remote colleague\" cards.\u003c/li>\n\u003cli>☐ Print Quiz 3 (student version), one per student.\u003c/li>\n\u003cli>☐ Room: groups of 5 for the meeting; room to split left/right for \"Would you rather\"; four tables labeled A–D for the jigsaw.\u003c/li>\n\u003cli>☐ Collect Journal #4 at 9:00.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"flags\">\n\u003ch2>Notes and flags\u003c/h2>\n\u003cdiv class=\"flag\">\u003cb>1 · The book disagrees with itself on sexual orientation law.\u003c/b> The online section 8.3 says the Supreme Court held in \u003ci>Bostock v. Clayton County\u003c/i> (2020) that sex discrimination includes sexual orientation and gender identity. But the online Chapter 8 Summary still says federal law gives no such protection, and printed or older PDF copies may say the same. Tell students that \u003ci>Bostock\u003c/i> (2020) is the current position, and that they should use the online version of 8.3.\u003c/div>\n\u003cdiv class=\"flag\">\u003cb>2 · Religious accommodation has become harder to refuse since the book was written.\u003c/b> The book describes undue hardship in general terms. Since \u003ci>Groff v. DeJoy\u003c/i> (2023), an employer must show \"substantial increased costs\" to deny a religious accommodation. The Accommodation Desk and Quiz 3 use this update and label it as outside the book.\u003c/div>\n\u003cdiv class=\"flag\">\u003cb>3 · Data in 8.1 are old.\u003c/b> Google's figures, the EEOC figures and the pledges date from 2014–2018. Round 2 brings in the February 2025 change, labeled as outside the book. Google's most recent diversity report (as reported in February 2025) listed 33.8% of its U.S. employees as women, compared with the book's 31%.\u003c/div>\n\u003cdiv class=\"flag\">\u003cb>4 · Minimum wage numbers.\u003c/b> The book says 29 states pay more than $7.25. In 2026, about 30 states and Washington, D.C. do; the federal minimum is still $7.25.\u003c/div>\n\u003cdiv class=\"flag\">\u003cb>5 · The book's answer key repeats a common misreading.\u003c/b> The end-of-chapter answer to question 4 says diverse companies had earnings 15–35% greater than industry medians. The McKinsey figures are about how much more \u003ci>likely\u003c/i> companies were to beat the median. Data Detective headline 1 targets this exact error.\u003c/div>\n\u003cdiv class=\"flag\">\u003cb>6 · Quiz timing.\u003c/b> The syllabus puts Quiz 3 in Week 8. Students meet some Chapter 8 ideas for the first time today, so the quiz tests only the Chapter 8 ideas used in class (diversity/inclusion, correlation, accommodation, pay equity) plus one item each on 8.3 and 8.5, which are in the reading. Moving the quiz to the start of Week 9 is a reasonable alternative.\u003c/div>\n\u003cdiv class=\"flag\">\u003cb>7 · Sensitive content.\u003c/b> Juneteenth, religion, disability and sexual orientation all come up. Keep the focus on workplace policy, use the ground rules, and allow passes. Never ask a student to speak for a group they belong to.\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "briefing": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Teacher Briefing · Recognizing and Respecting the Rights of All\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-rad
