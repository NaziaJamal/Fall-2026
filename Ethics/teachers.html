ius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Teacher\u003c/span>\u003c/header>\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 8 Teacher Briefing\u003c/h1>\n\u003cp class=\"lead\">Everything you need to understand before class, in plain words. Simple meanings are in [brackets].\u003c/p>\n\n\u003csection>\n\u003ch2>The big idea in one paragraph\u003c/h2>\n\u003cp>Chapter 8 says that an ethical business respects the rights of \u003cb>everyone\u003c/b>: employees of every background, ability, faith and orientation, low-paid workers, and even animals. The law sets a minimum [the least a company must do], but the book keeps asking managers to go further. This week's thread: being \u003cb>invited\u003c/b> into a workplace is not the same as being \u003cb>included\u003c/b> in it.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.1 · Diversity and inclusion (pp. 232–238)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Diversity\u003c/b> [the mix of different people and viewpoints]. Today it means more than race, gender and religion. SHRM [the Society for Human Resource Management, a large HR professional association] includes thinking styles, personality, physical and cognitive [mental] abilities and sexual orientation.\u003c/li>\n\u003cli>\u003cb>Inclusion\u003c/b> [everyone takes part and feels they belong]. The book's definition: \"the engagement of all employees in the corporate culture\". Howard Ross's metaphor: diversity = invited to the party; inclusion = asked to dance.\u003c/li>\n\u003cli>\u003cb>Diversity dividend\u003c/b> [the money benefit linked to having a diverse workforce]. Evidence: a McKinsey study [McKinsey is a management consulting firm] found that companies in the top quarter for ethnic diversity were 35% more likely to have above-median [better than the middle company in their industry] financial returns; for gender, 15% more likely.\u003c/li>\n\u003cli>\u003cb>Correlation is not causation\u003c/b> [two things happening together doesn't prove one causes the other]. The book says this directly. Diversity is linked to better decisions, creativity, employee satisfaction and customer goodwill.\u003c/li>\n\u003cli>\u003cb>Challenges.\u003c/b> Some employees resist diversity programs. The book's example: a Google engineer's 2017 memo claiming \"biological causes\" for women's underrepresentation. Google fired him, and the NLRB [National Labor Relations Board, the U.S. agency for workers' rights to act together] said the firing was lawful because his conduct demeaned [insulted] women. There is no right of free speech at a private company.\u003c/li>\n\u003cli>\u003cb>What leaders can do\u003c/b>: change meeting formats so everyone is heard; value skills that returning parents bring; offer a prayer room; rethink rewards (not everyone wants football tickets or bar outings); mentor; explain the business case.\u003c/li>\n\u003cli>\u003cb>Real cases:\u003c/b> Texas Health Resources and Marriott ranked high in \u003ci>Fortune\u003c/i>'s best workplaces for diversity.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.2 · Different abilities and faiths (pp. 239–243)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>ADA\u003c/b> [Americans with Disabilities Act, 1990]: an employer can't refuse a qualified person because of a disability [a physical or mental impairment that limits a major life activity such as work].\u003c/li>\n\u003cli>\u003cb>Reasonable accommodation\u003c/b> [a sensible change so the person can do the job]: accessible buildings, changed duties, equipment, flexible or part-time schedules, readers, interpreters or assistance animals.\u003c/li>\n\u003cli>\u003cb>Undue hardship\u003c/b> [too much difficulty or cost for the business]: the only reason to refuse.\u003c/li>\n\u003cli>\u003cb>No \"magic words.\"\u003c/b> An employee doesn't have to say \"ADA\" or \"disability\". \"I can't get here on time because of my treatment\" is enough; the manager must recognize it.\u003c/li>\n\u003cli>\u003cb>Verizon case:\u003c/b> a strict \"no-fault\" attendance policy [absences are counted the same whatever the reason] punished workers whose absences were caused by disabilities. Verizon paid $20 million, the largest single disability settlement in EEOC [Equal Employment Opportunity Commission, the agency that enforces anti-discrimination law] history.\u003c/li>\n\u003cli>\u003cb>Religion (Title VII of the Civil Rights Act, 1964):\u003c/b> four duties: no discrimination, no harassment, no retaliation [punishment for complaining], and reasonable accommodation. The employee tells the employer about a \u003cb>bona fide\u003c/b> [sincere] belief; the employer considers all options and must prove any hardship.\u003c/li>\n\u003cli>\u003cb>Nontraditional beliefs count.\u003c/b> \u003ci>Welsh v. United States\u003c/i> (1970): sincere moral or ethical beliefs that play the same role as religion are protected. Atheists and agnostics can be covered.\u003c/li>\n\u003cli>\u003cb>Abercrombie &amp; Fitch (2015):\u003c/b> the store refused to hire Samantha Elauf, who wore a hijab [a Muslim headscarf], because of its \"Look Policy\". The Supreme Court said an employer can't refuse to hire someone to avoid accommodating a religious practice.\u003c/li>\n\u003cli>\u003cb>Sikh kirpan\u003c/b> [a small blade that adult Sikh men are required to carry]: California law allows it to be worn openly in a sheath [cover], not hidden.\u003c/li>\n\u003cli>\u003cb>Juneteenth\u003c/b> [June 19, 1865: the day news of emancipation (freedom from slavery) reached enslaved people in Texas]: the book's \u003ci>What Would You Do?\u003c/i> box about a company picnic on that date.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>Update outside the book: \u003ci>Groff v. DeJoy\u003c/i> (2023).\u003c/b> A postal worker asked not to work Sundays. In a unanimous decision, the Supreme Court said that to refuse a religious accommodation, the employer must show \"substantial increased costs\" [big extra costs, compared with its whole business]. Colleagues being annoyed is not enough. Before 2023, many courts let employers refuse for any cost \"more than minimal\".\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.3 · Sexual identification and orientation (pp. 244–246)\u003c/h2>\n\u003cul>\n\u003cli>The online edition now says that in \u003cb>\u003ci>Bostock v. Clayton County\u003c/i> (2020)\u003c/b> the Supreme Court held that discrimination \"because of sex\" at work includes sexual orientation and gender identity [a person's own sense of their gender].\u003c/li>\n\u003cli>Other cases in the section: \u003ci>United States v. Windsor\u003c/i> (2013) and \u003ci>Obergefell v. Hodges\u003c/i> (2015) on same-sex marriage. The proposed \u003cb>Equality Act\u003c/b> [a bill in Congress, not law] would extend protections to housing, credit and education.\u003c/li>\n\u003cli>The ethical point: good companies go beyond the law, for example by giving same-sex partners the same benefits as spouses. The \u003cb>Corporate Equality Index\u003c/b> [a 0–100 score from the Human Rights Campaign] rates company policies. Companies and states faced boycotts over anti-LGBTQ laws, for example North Carolina's 2016 \"bathroom bill\".\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"flag\">\u003cb>Watch out:\u003c/b> the online Chapter 8 Summary page still says federal law gives no protection. That's out of date. Use \u003ci>Bostock\u003c/i> (2020).\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.4 · Income inequalities (pp. 247–251)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Income inequality\u003c/b> [income is spread very unevenly]. The book: the top 1% make more than forty times what the bottom 90% make; the top 1%'s share of U.S. income rose from 8% to 22%; middle-income households fell from almost 60% (1970) to 47% (2014).\u003c/li>\n\u003cli>Why business should care: the middle class is the core customer base. Household spending is more than two-thirds of U.S. GDP [gross domestic product, the value of everything an economy produces].\u003c/li>\n\u003cli>\u003cb>Minimum wage:\u003c/b> $7.25 federally. The book lists companies that chose to pay more (Costco, IKEA, Target, several banks at $15). Economists Neumark and Wascher doubt that raising it reduces poverty much; they prefer the Earned Income Tax Credit [a tax benefit for low-income workers].\u003c/li>\n\u003cli>\u003cb>Independent contractors\u003c/b> [workers who aren't employees]: companies save the cost of benefits and payroll taxes (about 30% of total compensation in the book's 2017 figures), which pushes workers toward the edge of the middle class.\u003c/li>\n\u003cli>\u003cb>Pay equity\u003c/b> [fair pay for comparable work]: women are paid about 80% of men's pay. \u003cb>New Jersey's Diane B. Allen Equal Pay Act\u003c/b>: \"equal pay for substantially similar work\" [jobs that are alike in skill, effort and responsibility], up to six years of back pay, damages tripled. Federal law uses \"equal pay for equal work\". \u003cb>Minnesota\u003c/b> evaluates state government jobs by knowledge, problem solving, responsibility and working conditions.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>Updates outside the book.\u003c/b> Federal minimum wage is still $7.25 in 2026 (unchanged since 2009); about 30 states and Washington, D.C. set more. \u003cb>EU Pay Transparency Directive\u003c/b> (2023): pay range before the interview; no salary-history questions; right to pay information; gender pay gap reports for employers with 100+ workers; an unexplained gap of 5% or more triggers a joint pay assessment [a review with worker representatives]; burden of proof [who has to prove their side] on the employer. Countries had to adopt it by 7 June 2026; only four of 27 did so on time.\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.5 · Animal rights (from p. 252)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Animal rights\u003c/b> [the idea that animals deserve ethical treatment]. Laws: Humane Slaughter Act (1950s), Animal Welfare Act (1966).\u003c/li>\n\u003cli>\u003cb>Agribusiness ethics\u003c/b> [ethics of large-scale food production]: safe food, responsible use of resources, humane treatment of animals, informed consumers, workers' welfare.\u003c/li>\n\u003cli>\u003cb>Peter Singer\u003c/b>, philosopher, \u003ci>Animal Liberation\u003c/i> (1975): if we judge by \u003cb>sentience\u003c/b> [the ability to feel pain], many animals we eat should be off limits.\u003c/li>\n\u003cli>\u003cb>Cosmetics testing:\u003c/b> U.S. law doesn't require animal testing for cosmetics. The EU banned animal testing for cosmetics and the sale of animal-tested cosmetics in 2013; about forty nations have acted. U.S. firms must change to sell there.\u003c/li>\n\u003cli>\u003cb>Beagle Freedom Project\u003c/b>: rescues dogs from labs; 96% of dogs used in testing are beagles.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Questions students may ask you\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Question\u003c/th>\u003cth>A short, accurate answer\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\"Is DEI illegal now in the U.S.?\"\u003c/td>\u003ctd>No. Discrimination laws (Title VII, the ADA) still apply. In 2025 the federal government targeted some DEI programs, especially for federal contractors, and many companies changed or dropped hiring targets. Others kept their programs. The legal details are still being argued in court, so say \"It's changing, and companies are making different choices.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Is this only about the U.S.?\"\u003c/td>\u003ctd>The book's laws are American, but the questions are global. Invite comparisons: \"In workplaces you know, how were requests like this handled?\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Can a company just pay what people negotiate?\"\u003c/td>\u003ctd>Often legally, yes, in many places. But under New Jersey's standard or the EU directive, \"he negotiated better\" may not be enough if the work is substantially similar. Ethically, negotiation can carry forward old inequalities.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Why is animal rights in a chapter about people's rights?\"\u003c/td>\u003ctd>The book treats it as one of the \"most pressing social themes\" managers must deal with. It affects food, medicine and cosmetics businesses directly.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Is the McKinsey study proof?\"\u003c/td>\u003ctd>No: it shows a link. The book says so. Good question to praise.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>How to handle the sensitive moments\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>If a student makes a remark that targets a group:\u003c/b> stay calm and redirect to the idea. \"Let's look at the argument. What evidence supports that? What does the book say?\" If it continues, remind the class of ground rule 3 (ideas, not people).\u003c/li>\n\u003cli>\u003cb>If a student shares something personal:\u003c/b> thank them briefly and move on. Don't ask follow-up questions about their own life.\u003c/li>\n\u003cli>\u003cb>If a student refuses Round 3:\u003c/b> that's allowed (one pass). If several do, switch to Card 3B.\u003c/li>\n\u003cli>\u003cb>If the class turns political:\u003c/b> bring it back to the business decision: \"What should Meridian do?\"\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "slides": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Slides · Recognizing and Respecting the Rights of All\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0d2747;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}\n.deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n.s{display:none;position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#fff;color:#1d2433;padding:4.2% 5.5% 6%;overflow:hidden;font-size:min(2.15vw,3.8vh)}\n.s.on{display:flex;flex-direction:column}\n.s h2{font-size:2.05em;color:var(--navy);margin:0 0 .45em;line-height:1.15;border-bottom:.12em solid var(--gold);padding-bottom:.18em}\n.s .k{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--dgold);font-weight:700;margin-bottom:.25em}\n.s p,.s li{line-height:1.35;margin:.25em 0}\n.s ul,.s ol{margin:.2em 0 .2em 1.2em;padding:0}\n.s .sm{font-size:.82em}.s .xs{font-size:.68em;color:#5b6577}\n.s .two{display:grid;grid-template-columns:1fr 1fr;gap:4%;flex:1;min-height:0}\n.s .box{background:var(--sky3);border-left:.25em solid var(--navy);border-radius:.4em;padding:.6em .8em}\n.s .box.g{border-color:var(--gold);background:#fbf6e8}\n.s table{border-collapse:collapse;width:100%;font-size:.8em}\n.s th,.s td{border:1px solid var(--sky);padding:.28em .5em;text-align:left;vertical-align:top}\n.s th{background:var(--navy);color:#fff}\n.s.dark{background:var(--navy);color:#fff}\n.s.dark h2{color:#fff}\n.s.title{background:var(--navy);color:#fff;justify-content:center;align-items:flex-start}\n.s.title img{width:7.5em;margin-bottom:1em;border-radius:.4em}\n.s.title h1{font-size:2.8em;margin:0;color:#fff}\n.s.title p{color:var(--sky);font-size:1.2em}\n.s.title .q{color:var(--gold);font-size:1.6em;font-weight:700;margin-top:.6em}\n.foot{position:absolute;left:5.5%;right:5.5%;bottom:2.2%;display:flex;align-items:center;gap:.6em;font-size:.6em;color:#5b6577}\n.s.dark .foot,.s.title .foot{color:var(--sky)}\n.foot img{height:1.9em;border-radius:.2em}\n.foot .n{margin-left:auto}\n.timer{position:absolute;right:5.5%;top:4.2%;display:flex;align-items:center;gap:.4em;font-size:.8em}\n.timer b{font-variant-numeric:tabular-nums;font-size:1.5em;color:var(--navy);min-width:3.2em;text-align:right}\n.s.dark .timer b{color:#fff}\n.timer button{font:inherit;font-size:.8em;border:0;border-radius:.3em;background:var(--gold);color:var(--navy);padding:.2em .6em;cursor:pointer;font-weight:700}\n.timer.done b{color:#c0392b}\n.big{font-size:1.25em}\n.tally{display:grid;grid-template-columns:repeat(6,1fr);gap:.4em;margin-top:.4em}\n.tally div{border:2px solid var(--sky);border-radius:.4em;text-align:center;padding:.4em .2em;font-size:.8em}\n.tally div b{display:block;font-size:2em;color:var(--navy);min-height:1.2em}\n.ladder{display:flex;flex-direction:column-reverse;gap:.25em}\n.ladder div{background:var(--sky2);border-radius:.3em;padding:.25em .6em;font-size:.85em}\n.ladder div:nth-child(5){background:#fbf6e8;border:2px solid var(--gold);font-weight:700}\n.nav{position:fixed;bottom:8px;right:10px;z-index:5;display:flex;gap:6px;opacity:.35;transition:opacity .2s}\n.nav:hover{opacity:1}\n.nav button{font:14px sans-serif;border:0;border-radius:6px;padding:6px 10px;background:#fff;color:var(--navy);cursor:pointer}\n@media print{html,body{overflow:visible;height:auto;background:#fff}.deck{position:static;display:block}.s{display:flex!important;flex-direction:column;width:100%;height:auto;aspect-ratio:16/9;page-break-after:always;font-size:12pt;border:1px solid #ccc}.nav,.timer button{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"deck\" id=\"deck\">\n\n\u003cdiv class=\"s title\">\u003cimg src=\"logo.png\" alt=\"Approach logo\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Ethics in a Global World · Week 8\u003c/div>\u003ch1>Recognizing and Respecting the Rights of All\u003c/h1>\u003cp>Chapter 8 · \u003ci>Business Ethics\u003c/i> (OpenStax), pp. 231–264 · \u003ca style=\"color:var(--gold)\" href=\"https://openstax.org/books/business-ethics/pages/8-introduction\" target=\"_blank\" rel=\"noopener\">openstax.org/books/business-ethics\u003c/a>\u003c/p>\u003cdiv class=\"q\">Invited is not the same as included.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Today\u003c/div>\u003ch2>Two classes, one company\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Class 1 · Invited is not included (9:00–10:40)\u003c/b>\u003col class=\"sm\">\u003cli>The Meeting Nobody Noticed\u003c/li>\u003cli>Invited vs. included\u003c/li>\u003cli>Data Detective\u003c/li>\u003cli>Discussion circles\u003c/li>\u003cli>The Accommodation Desk\u003c/li>\u003cli>The Payslip\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Class 2 · Rights across borders (11:10–12:50)\u003c/b>\u003col class=\"sm\">\u003cli>Would you rather?\u003c/li>\u003cli>Same Job, Four Rulebooks\u003c/li>\u003cli>The Board Asks\u003c/li>\u003cli>From red lines to a code\u003c/li>\u003cli>Quiz 3 (Chapters 6–8)\u003c/li>\u003c/ol>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Meridian Freight is fictional. Please hand in Journal #4 now.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"4\">\u003cdiv class=\"k\">Engage · Meridian Freight (fictional)\u003c/div>\u003ch2>The Meeting Nobody Noticed\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>You are Meridian's planning team. Choose \u003cb>ONE\u003c/b> option for this year's team day:\u003c/p>\u003cul>\u003cli>\u003cb>A\u003c/b> · Evening dinner with drinks downtown\u003c/li>\u003cli>\u003cb>B\u003c/b> · Saturday volunteer day at a food bank\u003c/li>\u003cli>\u003cb>C\u003c/b> · Weekday afternoon workshop with lunch\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>Rules\u003c/b>\u003c/p>\u003col class=\"sm\">\u003cli>Read your secret role card. Don't show anyone.\u003c/li>\u003cli>Follow it exactly.\u003c/li>\u003cli>Write your decision and one reason.\u003c/li>\u003c/ol>\u003cp class=\"big\">\u003cb>4 minutes\u003c/b>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Engage · The reveal\u003c/div>\u003ch2>Who was in the room? Who was heard?\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cul>\u003cli>Remote colleagues: \u003cb>did anyone read your notes?\u003c/b>\u003c/li>\u003cli>Newer colleagues: \u003cb>did anyone ask your name?\u003c/b>\u003c/li>\u003cli>Second-language colleagues: \u003cb>how often did you reach five?\u003c/b>\u003c/li>\u003c/ul>\u003cp>Cards 4 and 5: read your hidden constraint aloud.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003cp>\u003cb>Discuss\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>Who spoke most? Did they have the best ideas?\u003c/li>\u003cli>Was your decision a good one?\u003c/li>\u003cli>What could the senior manager have done differently?\u003c/li>\u003cli>Which of these roles have you seen in real meetings?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · 8.1, pp. 232–238\u003c/div>\u003ch2>Invited vs. included\u003c/h2>\n\u003cp class=\"big\" style=\"color:var(--navy)\">\"Diversity is being invited to the party; inclusion is being asked to dance.\"\u003c/p>\u003cp class=\"xs\">Howard J. Ross, Cook Ross, quoted in section 8.1\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Diversity\u003c/b>\u003cp class=\"sm\">The mix of people and perspectives. SHRM: also thinking styles, personality, physical and cognitive abilities, sexual orientation; the book adds age, experience, country of residence.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Inclusion\u003c/b>\u003cp class=\"sm\">\"The engagement of all employees in the corporate culture.\" People belong, and they are heard.\u003c/p>\u003cb>Diversity dividend\u003c/b>\u003cp class=\"sm\">The financial benefit linked to a diverse workforce.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · Data Detective · Figure 8.4\u003c/div>\u003ch2>What the McKinsey study found\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Companies in the…\u003c/th>\u003cth>Top quarter\u003c/th>\u003cth>Bottom quarter\u003c/th>\u003cth>Difference\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Gender diversity: likelihood of returns above industry median\u003c/td>\u003ctd>54\u003c/td>\u003ctd>47\u003c/td>\u003ctd>\u003cb>15% more likely\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ethnic diversity: likelihood of returns above industry median\u003c/td>\u003ctd>58\u003c/td>\u003ctd>43\u003c/td>\u003ctd>\u003cb>35% more likely\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Executive and/or board diversity: return on equity\u003c/td>\u003ctd colspan=\"3\">Top quarter more than \u003cb>50% higher\u003c/b> than the bottom quarter\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"box g\" style=\"margin-top:.6em\">The book: \u003cb>\"positive correlations do not equal causation.\"\u003c/b>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Study · Data Detective\u003c/div>\u003ch2>Supported, overstated or not supported?\u003c/h2>\n\u003col>\u003cli>\"Ethnically diverse companies earn 35% more profit.\"\u003c/li>\u003cli>\"Companies in the top quarter for ethnic diversity were more likely to beat their industry median.\"\u003c/li>\u003cli>\"Hiring more women will make your company more profitable.\"\u003c/li>\u003cli>\"Firms with the most diverse boards and executives had returns on equity more than 50% higher than the least diverse.\"\u003c/li>\u003cli>\"Diversity creates tension, so it hurts performance.\"\u003c/li>\u003c/ol>\n\u003cp class=\"sm\">Worksheet Part 2 → \u003cb>Check my answers\u003c/b>. Then: if it's not a cause, what explains the link?\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Activate · Discussion circles\u003c/div>\u003ch2>Roles and ground rules\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Roles (rotate each round)\u003c/b>\u003cul class=\"sm\">\u003cli>\u003cb>Facilitator\u003c/b>: everyone speaks once before anyone speaks twice\u003c/li>\u003cli>\u003cb>Clarifier\u003c/b>: \"So what you're saying is…?\"\u003c/li>\u003cli>\u003cb>Complicator\u003c/b>: \"What if…?\"\u003c/li>\u003cli>\u003cb>Book connector\u003c/b>: \"Section 8.1 says…\"\u003c/li>\u003cli>\u003cb>Reporter\u003c/b>: writes the \"It depends on…\" sentence\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Ground rules\u003c/b>\u003col class=\"sm\">\u003cli>Speak from a workplace you know, not for a country or group.\u003c/li>\u003cli>No one has to share personal information.\u003c/li>\u003cli>Challenge ideas, not people.\u003c/li>\u003cli>One pass per round.\u003c/li>\u003cli>Laws differ, and that's the point.\u003c/li>\u003c/ol>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Round 1 · Book, 8.1\u003c/div>\u003ch2>Speech or conduct?\u003c/h2>\n\u003cp class=\"sm\">2017: a senior Google engineer's internal memo criticized the company's diversity programs and said women's underrepresentation in tech had partly \"biological causes\". It leaked; Google fired him. 2018: the National Labor Relations Board found the firing lawful: he was dismissed for conduct that demeaned women. The book notes there is no right of free speech in a private-sector workplace.\u003c/p>\n\u003cul>\u003cli>Should employees be free to criticize their company's diversity programs at work?\u003c/li>\u003cli>Where is the line between an opinion and conduct that harms colleagues?\u003c/li>\u003cli>Would it matter if he had sent it only to his manager?\u003c/li>\u003c/ul>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Round 2 · Book + outside source\u003c/div>\u003ch2>When the wind changes\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Book (8.1)\u003c/b>\u003cp class=\"sm\">From 2014, tech companies published diversity numbers. More than 30 signed a diversity pledge; Google pledged more than $100 million.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Outside the book · February 2025\u003c/b>\u003cp class=\"sm\">Google stopped setting hiring targets for representation, citing court decisions and U.S. executive orders. Meta, Amazon and Target scaled back programs; Costco and Delta said they would continue theirs.\u003c/p>\u003c/div>\u003c/div>\n\u003cul class=\"sm\">\u003cli>Should a company's values change when the law or political pressure changes?\u003c/li>\u003cli>Is a hiring target the same thing as inclusion?\u003c/li>\u003cli>Which stakeholders gain and which lose under each choice?\u003c/li>\u003c/ul>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Round 3 · Your teacher's card\u003c/div>\u003ch2>One company, many rules\u003c/h2>\n\u003cp>Read the Round 3 card your teacher gives you.\u003c/p>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>The key question for every version:\u003c/b>\u003c/p>\u003cp class=\"big\">Should a global company apply one policy everywhere, or follow each country's law?\u003c/p>\u003c/div>\n\u003cp class=\"xs\">Reporters: be ready to read your best \"It depends on…\" sentence.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · 8.2, pp. 239–243\u003c/div>\u003ch2>The Accommodation Desk: the rules\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>What it says\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>ADA\u003c/b> (1990)\u003c/td>\u003ctd>No discrimination against qualified people with disabilities; \u003cb>reasonable accommodation\u003c/b> unless it causes \u003cb>undue hardship\u003c/b>. Employees don't need to use the legal words.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Title VII\u003c/b> (1964)\u003c/td>\u003ctd>Religion: nondiscrimination, nonharassment, nonretaliation, reasonable accommodation. Nontraditional, sincere beliefs count (\u003ci>Welsh\u003c/i>, 1970).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Abercrombie\u003c/b> (2015)\u003c/td>\u003ctd>An employer may not refuse to hire someone to avoid accommodating a religious practice.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>\u003ci>Groff v. DeJoy\u003c/i>\u003c/b> (2023) \u003cspan class=\"xs\">outside the book\u003c/span>\u003c/td>\u003ctd>To deny a religious accommodation, the employer must show \u003cb>substantial increased costs\u003c/b> for its business.\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"xs\">Book example: Verizon paid $20 million over a rigid \"no-fault\" attendance policy.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"22\">\u003cdiv class=\"k\">Activate · Groups of 3\u003c/div>\u003ch2>How the desk works\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col>\u003cli>\u003cb>Employee\u003c/b> presents the request in their own words.\u003c/li>\u003cli>\u003cb>Operations manager\u003c/b> raises one practical concern.\u003c/li>\u003cli>\u003cb>HR partner\u003c/b> asks one question, then decides:\u003cbr>\u003cspan class=\"pill\">Grant\u003c/span> \u003cspan class=\"pill\">Grant with changes\u003c/span> \u003cspan class=\"pill\">Deny (undue hardship)\u003c/span>\u003c/li>\u003cli>Everyone records the decision and the test in Part 4.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Then rotate roles.\u003c/b>\u003cp class=\"sm\">About 3½ minutes per request. Do at least four of the six.\u003c/p>\u003cp class=\"sm\">HR: \"Is the cost or difficulty \u003ci>substantial\u003c/i>, or just inconvenient?\"\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s dark\" data-min=\"4\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Bridge · Meridian Freight (fictional)\u003c/div>\u003ch2>The Payslip\u003c/h2>\n\u003ctable style=\"color:#1d2433;background:#fff\">\u003ctr>\u003cth>\u003c/th>\u003cth>Dana Reyes\u003c/th>\u003cth>Marco Bianchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Title\u003c/td>\u003ctd>Customer Insights Analyst\u003c/td>\u003ctd>Logistics Data Analyst\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Salary\u003c/td>\u003ctd>\u003cb>$68,000\u003c/b>\u003c/td>\u003ctd>\u003cb>$76,000\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Experience\u003c/td>\u003ctd>4 years\u003c/td>\u003ctd>4 years\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Work\u003c/td>\u003ctd colspan=\"2\">Both build dashboards, present findings to clients and supervise one intern.\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Worksheet Part 5: \u003cb>Fair?\u003c/b> \u003cb>Legal?\u003c/b> Yes / No / It depends, with one reason each.\u003c/p>\n\u003cp style=\"color:var(--gold)\">After the break: the answer depends on where Meridian is.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s title\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Break · 10:40–11:10\u003c/div>\u003ch1>Back at 11:10\u003c/h1>\u003cp>Before you go: show your Payslip votes.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s title\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Class 2 · 11:10–12:50\u003c/div>\u003ch1>Rights across borders\u003c/h1>\u003cp>Same company. Same job. Different rules.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Engage · 8.4 · Switch rule\u003c/div>\u003ch2>Would you rather? 1\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>LEFT · Company A\u003c/b>\u003cp>Pays everyone at least \u003cb>40% above\u003c/b> the local minimum wage, but has a \u003cb>15% gender pay gap\u003c/b>.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>RIGHT · Company B\u003c/b>\u003cp>Pays \u003cb>exactly the legal minimum\u003c/b> and has \u003cb>no gender pay gap\u003c/b>.\u003c/p>\u003c/div>\u003c/div>\n\u003cp class=\"sm\">One argument from each side. Then anyone convinced may switch sides.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Engage · 8.5 · Switch rule\u003c/div>\u003ch2>Would you rather? 2\u003c/h2>\n\u003cp>You run a new cosmetics brand.\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>LEFT\u003c/b>\u003cp>Launch in the U.S. \u003cb>this year\u003c/b> using ingredients that were tested on animals (legal there).\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>RIGHT\u003c/b>\u003cp>\u003cb>Wait 18 months\u003c/b> to reformulate without animal testing, so you can also sell in the EU.\u003c/p>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Book (8.5): the EU banned animal testing for cosmetics and the sale of animal-tested cosmetics in 2013; about forty nations have acted.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Engage · 8.4 · Switch rule\u003c/div>\u003ch2>Would you rather? 3\u003c/h2>\n\u003cp>You're the CEO, with a fixed amount of money.\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>LEFT\u003c/b>\u003cp>\u003cb>Raise all entry-level wages\u003c/b> above the legal minimum.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>RIGHT\u003c/b>\u003cp>Keep wages, and pay the same money as a \u003cb>one-time bonus to top performers\u003c/b>.\u003c/p>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Book (8.4): \"How would you explain to a board of directors your decision to pay entry-level workers more than the law requires?\"\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Your votes from the break\u003c/div>\u003ch2>Dana and Marco: fair? legal?\u003c/h2>\n\u003cp>\u003cb>Fair?\u003c/b>\u003c/p>\u003cdiv class=\"tally\" style=\"grid-template-columns:repeat(3,1fr)\">\u003cdiv>Yes\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>No\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>It depends\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003c/div>\n\u003cp>\u003cb>Legal?\u003c/b>\u003c/p>\u003cdiv class=\"tally\" style=\"grid-template-columns:repeat(3,1fr)\">\u003cdiv>Yes\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>No\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>It depends\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Teacher: click a box to type the count.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"12\">\u003cdiv class=\"k\">Case study · jigsaw · 8.4 + outside source\u003c/div>\u003ch2>Same Job, Four Rulebooks\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>\u003cb>Read the case\u003c/b> (Handout 5 / Part 7): 3 min.\u003c/li>\u003cli>\u003cb>Expert groups\u003c/b>: 12 min. Under your rulebook:\u003cul>\u003cli>Is Dana's gap likely illegal?\u003c/li>\u003cli>What would Dana need to show?\u003c/li>\u003cli>What must Meridian do now?\u003c/li>\u003cli>One strength, one weakness.\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cul class=\"sm\">\u003cli>\u003cb>A\u003c/b> · U.S. federal law\u003c/li>\u003cli>\u003cb>B\u003c/b> · New Jersey: Diane B. Allen Equal Pay Act\u003c/li>\u003cli>\u003cb>C\u003c/b> · Minnesota pay equity\u003c/li>\u003cli>\u003cb>D\u003c/b> · EU Pay Transparency Directive \u003cspan class=\"xs\">(outside the book)\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"14\">\u003cdiv class=\"k\">Case study · home groups\u003c/div>\u003ch2>Teach, compare, decide\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>Each expert teaches their rulebook in \u003cb>90 seconds\u003c/b>. Others fill in the grid.\u003c/li>\u003cli>Write Meridian's \u003cb>global pay policy\u003c/b> in three lines:\u003cul>\u003cli>\u003cb>Local\u003c/b>: follow each location's law\u003c/li>\u003cli>\u003cb>Strictest\u003c/b>: strictest rule everywhere\u003c/li>\u003cli>\u003cb>Hybrid\u003c/b>: explain\u003c/li>\u003c/ul>\u003c/li>\u003cli>Name one \u003cb>framework\u003c/b> that supports it and one \u003cb>stakeholder who loses\u003c/b>.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Then think like Rawls\u003c/b>\u003cp class=\"sm\">Which rulebook would you choose if you didn't know whether you'd be Dana, Marco or Meridian's finance director?\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"15\">\u003cdiv class=\"k\">Activate · pitch and challenge\u003c/div>\u003ch2>The Board Asks\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>Presenter pitches your policy: \u003cb>60 seconds\u003c/b>.\u003c/li>\u003cli>The board draws one question card.\u003c/li>\u003cli>Presenter answers: \u003cb>30 seconds\u003c/b> (+ one sentence from a teammate).\u003c/li>\u003c/ol>\n\u003cp class=\"sm\">\u003cb>Vote for the best answer\u003c/b>, not the policy you like:\u003cbr>✓ names a framework ✓ gives evidence ✓ answers the cost question\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp class=\"sm\">\u003ci>\"Why should we pay more than the law requires?\"\u003c/i>\u003c/p>\u003cp class=\"sm\">\u003ci>\"How much will this cost us, and who pays?\"\u003c/i>\u003c/p>\u003cp class=\"sm\">\u003ci>\"Marco negotiated better. Isn't that fair?\"\u003c/i>\u003c/p>\u003cp class=\"sm\">\u003ci>\"What do we do where the law is weaker?\"\u003c/i>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Personal Code of Ethics · draft\u003c/div>\u003ch2>From red lines to a code\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003col>\u003cli>\u003cb>My core values\u003c/b> (3)\u003c/li>\u003cli>\u003cb>My commitments\u003c/b> to my organization, colleagues, clients/public, and the rights of everyone I work with\u003c/li>\u003cli>\u003cb>My red lines\u003c/b> ← Week 7, Part 12\u003c/li>\u003cli>\u003cb>A hard case\u003c/b> + a framework\u003c/li>\u003cli>\u003cb>How I'll keep my code\u003c/b>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>350–450 words\u003c/b>\u003c/p>\u003cp class=\"sm\">Write it in the \u003cb>Code of Ethics Draft\u003c/b> tab. It saves, counts words and builds your finished code.\u003c/p>\u003cp class=\"sm\">Bring it to \u003cb>Week 9\u003c/b> for peer review.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Personal Code of Ethics · the specific test\u003c/div>\u003ch2>Could someone check it?\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Vague\u003c/th>\u003cth>Specific\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\"I will be fair.\"\u003c/td>\u003ctd>\"I will base pay recommendations on job content, not on a person's salary history.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"I will respect diversity.\"\u003c/td>\u003ctd>\"In meetings I lead, I will ask everyone for input before I give my opinion.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"I will be honest.\"\u003c/td>\u003ctd>\"I will correct a mistake in a client report within one working day of finding it.\"\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sm\">Now write yours: \u003cb>\"To respect the rights of everyone I work with, I will…\"\u003c/b> Then ask your partner: \u003ci>Could someone check this?\u003c/i>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s dark\" data-min=\"25\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Assess\u003c/div>\u003ch2>Quiz 3 · Chapters 6–8\u003c/h2>\n\u003cul>\u003cli>Part A · Multiple choice (10)\u003c/li>\u003cli>Part B · Matching (8)\u003c/li>\u003cli>Part C · Short case response (12)\u003c/li>\u003c/ul>\n\u003cp>30 points · 25 minutes · no phones or notes\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s dark\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Close\u003c/div>\u003ch2>Exit ticket and homework\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>\u003cb>Exit ticket (Part 10)\u003c/b>\u003c/p>\u003col class=\"sm\">\u003cli>One difference between diversity and inclusion\u003c/li>\u003cli>One thing a company should do even if the law doesn't require it\u003c/li>\u003cli>Confidence today, 1–4\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv>\u003cp>\u003cb>Homework\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>Finish your \u003cb>Personal Code of Ethics\u003c/b> draft (350–450 words). Bring it to Week 9 for peer review.\u003c/li>\u003cli>Read \u003ca style=\"color:var(--gold)\" href=\"https://openstax.org/books/business-ethics/pages/8-5-animal-rights-and-the-implications-for-business\" target=\"_blank\" rel=\"noopener\">8.5\u003c/a> if you haven't.\u003c/li>\u003cli>Preview \u003ca style=\"color:var(--gold)\" href=\"https://openstax.org/books/business-ethics/pages/9-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 9\u003c/a> (from p. 265).\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003c/div>\n\u003cdiv class=\"nav\">\u003cbutton onclick=\"go(-1)\" aria-label=\"Previous\">‹\u003c/button>\u003cbutton onclick=\"fs()\">Full screen\u003c/button>\u003cbutton onclick=\"go(1)\" aria-label=\"Next\">›\u003c/button>\u003c/div>\n\u003cscript>\nconst S=[...document.querySelectorAll('.s')];let i=0,iv=null;\nS.forEach((s,n)=>{if(!s.classList.contains('title')){const f=document.createElement('div');f.className='foot';f.innerHTML='\u003cimg src=\"logo.png\" alt=\"\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan class=\"n\">'+(n+1)+' / '+S.length+'\u003c/span>';s.appendChild(f)}\n if(s.dataset.min){const t=document.createElement('div');t.className='timer';const sec=s.dataset.min*60;t.innerHTML='\u003cb>'+fmt(sec)+'\u003c/b>\u003cbutton>Start\u003c/button>\u003cbutton>Reset\u003c/button>';s.appendChild(t);let left=sec;const [b,st,rs]=t.children;\n st.onclick=e=>{e.stopPropagation();if(iv){clearInterval(iv);iv=null;st.textContent='Start';return}st.textContent='Pause';iv=setInterval(()=>{left--;b.textContent=fmt(Math.max(left,0));if(left\u003c=0){clearInterval(iv);iv=null;t.classList.add('done');st.textContent='Start'}},1000)};\n rs.onclick=e=>{e.stopPropagation();clearInterval(iv);iv=null;left=sec;b.textContent=fmt(sec);t.classList.remove('done');st.textContent='Start'}}});\nfunction fmt(x){return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}\nfunction show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k===i));try{history.replaceState(null,'','#'+(i+1))}catch(e){}}\nfunction go(d){show(i+d)}\nfunction fs(){const d=document.documentElement;if(!document.fullscreenElement){d.requestFullscreen&&d.requestFullscreen()}else document.exitFullscreen()}\ndocument.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='f')fs()});\ndocument.getElementById('deck').addEventListener('click',e=>{if(e.target.closest('button,[contenteditable],a'))return;const x=e.clientX/innerWidth;go(x\u003c0.3?-1:1)});\nlet tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d\u003c0?1:-1);tx=null});\nshow(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));\n\u003c/script>\n\u003c/body>\u003c/html>\n", "handouts": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Handouts · Recognizing and Respecting the Rights of All\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.page{background:#fff;border-radius:10px;padding:18px 22px;margin:16px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\n.page h2{margin-top:0}\n.hh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);border-bottom:1px solid var(--sky);padding-bottom:4px;margin-bottom:8px;gap:8px}\n.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.cards.one{grid-template-columns:1fr}\n.cut{border:2px dashed #9aa7ba;border-radius:8px;padding:10px 12px;font-size:15px;break-inside:avoid;min-height:110px}\n.cut .no{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-bottom:4px}\n.cut .no.g{background:var(--gold);color:var(--navy)}\n.cut .sec{display:block;margin-top:6px;padding-top:6px;border-top:1px dotted #9aa7ba;font-size:14px}\n.cut h3{margin:4px 0 6px;font-size:17px}\n.cut ul,.cut ol{margin:4px 0;padding-left:20px}\n.slip{border:2px dashed #9aa7ba;border-radius:8px;padding:8px 12px;font-size:13.5px;break-inside:avoid}\n.slip p{margin:2px 0}\n.line{border-bottom:1px solid #999;height:22px}\n.big{font-size:20px}\n.pay td,.pay th{font-size:16px}\n@media (max-width:640px){.cards{grid-template-columns:1fr}}\n@media print{.page{box-shadow:none;border:0;padding:0;margin:0;break-after:page}.page:last-child{break-after:auto}.cut,.slip{font-size:11pt}.cut h3{font-size:13pt}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Handouts\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1 class=\"noprint\">Week 8 Handouts\u003c/h1>\n\u003cp class=\"lead noprint\">Print the pages you need. Each handout starts on a new page. Cut along the dashed lines.\u003c/p>\n\u003csection class=\"noprint\">\u003ch2>Contents\u003c/h2>\u003col class=\"toc\">\n\u003cli>\u003ca href=\"#h1\">Handout 1 · The Meeting Nobody Noticed\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h2\">Handout 2 · Discussion circles\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h3\">Handout 3 · The Accommodation Desk\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h4\">Handout 4 · The Payslip\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h5\">Handout 5 · Same Job, Four Rulebooks\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h6\">Handout 6 · The Board Asks\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h7\">Handout 7 · Exit ticket slips\u003c/a>\u003c/li>\n\u003c/ol>\u003c/section>\n\n\u003cdiv class=\"page\" id=\"h1\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 1 · The Meeting Nobody Noticed · one set per group of 5\u003c/span>\u003c/div>\n\u003cdiv class=\"cards one\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no g\">Task card · face up\u003c/span>\u003ch3>Meridian Freight planning team (fictional)\u003c/h3>\n\u003cp>Choose ONE option for this year's team day:\u003c/p>\n\u003cul>\u003cli>\u003cb>A\u003c/b> · An evening dinner with drinks downtown\u003c/li>\u003cli>\u003cb>B\u003c/b> · A Saturday volunteer day at a food bank\u003c/li>\u003cli>\u003cb>C\u003c/b> · A weekday afternoon workshop with lunch\u003c/li>\u003c/ul>\n\u003cp>\u003cb>You have 4 minutes.\u003c/b> Write your decision and one reason. Follow your secret role card exactly.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"cards\" style=\"margin-top:10px\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Secret role 1\u003c/span>\u003ch3>Senior manager\u003c/h3>\u003cp>Speak first. Give your opinion early and confidently. Summarize the group's decision before time is up.\u003c/p>\u003cp class=\"sec\">You like option A.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Secret role 2\u003c/span>\u003ch3>Fast talker\u003c/h3>\u003cp>Jump in as soon as anyone pauses. Agree loudly with whoever seems to be winning.\u003c/p>\u003cp class=\"sec\">You have no strong preference.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Secret role 3\u003c/span>\u003ch3>Remote colleague\u003c/h3>\u003cp>You are \"on a bad video call\". You may NOT speak. Write short notes on sticky notes and hold them up. You may speak only if someone reads your note aloud.\u003c/p>\u003cp class=\"sec\">\u003cb>Hidden:\u003c/b> you can't attend an evening event in person.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Secret role 4\u003c/span>\u003ch3>Newer colleague\u003c/h3>\u003cp>Speak ONLY if someone asks you by name.\u003c/p>\u003cp class=\"sec\">\u003cb>Hidden:\u003c/b> you care for a family member on Saturdays, so option B is impossible for you.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Secret role 5\u003c/span>\u003ch3>Colleague working in a second language\u003c/h3>\u003cp>Before you speak, count silently to five after the last speaker stops. If someone starts talking, start counting again.\u003c/p>\u003cp class=\"sec\">\u003cb>Hidden:\u003c/b> you don't drink alcohol, and an evening at a bar would be uncomfortable for you.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Observer (optional)\u003c/span>\u003ch3>Meeting observer\u003c/h3>\u003cp>Don't speak. Make a tally mark every time each person speaks. Report the numbers after the reveal.\u003c/p>\u003cp class=\"sec\">Use this card for a student who prefers not to play a role.\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h2\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 2 · Discussion circles · roles (one set per circle)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Facilitator\u003c/h3>\u003cp>Read the card aloud. Make sure everyone speaks once before anyone speaks twice. Keep time.\u003c/p>\u003cp class=\"sec\">\"Let's hear from ___ first.\" · \"We have two minutes left.\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Clarifier\u003c/h3>\u003cp>Before the group argues, check that you understand each other.\u003c/p>\u003cp class=\"sec\">\"So what you're saying is…?\" · \"Do you mean… or…?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Complicator\u003c/h3>\u003cp>Add a \"what if\" that makes the question harder.\u003c/p>\u003cp class=\"sec\">\"What if the company were…?\" · \"Would that still hold if…?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Book connector\u003c/h3>\u003cp>Find what the book says, or notice that it doesn't cover something.\u003c/p>\u003cp class=\"sec\">\"Section 8.1 says…\" · \"The book doesn't cover this, but…\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Reporter\u003c/h3>\u003cp>Write the group's best \"It depends on…\" sentence and read it to the class.\u003c/p>\u003cp class=\"sec\">\"We agreed that it depends on whether…\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no g\">Ground rules\u003c/span>\u003col style=\"font-size:14px\">\u003cli>Speak from a workplace you know, not for a country or group.\u003c/li>\u003cli>No one has to share personal information.\u003c/li>\u003cli>Challenge ideas, not people.\u003c/li>\u003cli>One pass per round.\u003c/li>\u003cli>Laws differ, and that's the point.\u003c/li>\u003c/ol>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 2 · Discussion circles · prompt cards\u003c/span>\u003c/div>\n\u003cdiv class=\"cards one\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Round 1 · Book, 8.1\u003c/span>\u003ch3>Speech or conduct?\u003c/h3>\n\u003cp>In 2017, a senior Google software engineer wrote an internal memo criticizing the company's diversity programs. It said women's underrepresentation in tech had partly \"biological causes\". The memo leaked, there were protests on social media, and Google fired him. In February 2018, the National Labor Relations Board found that the firing did not break federal labor law: he was dismissed for conduct that demeaned women. The book notes that there is no right of free speech in a private-sector workplace.\u003c/p>\n\u003cul>\u003cli>Should employees be free to criticize their company's diversity programs at work?\u003c/li>\u003cli>Where is the line between an opinion and conduct that harms colleagues?\u003c/li>\u003cli>Would your answer change if he had sent the memo only to his manager?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Round 2 · Book + outside source\u003c/span>\u003ch3>When the wind changes\u003c/h3>\n\u003cp>\u003cb>Book (8.1):\u003c/b> From 2014, many technology companies published diversity statistics. More than 30 companies, including Intel, Spotify, Lyft, Airbnb and Pinterest, signed a pledge to increase diversity and inclusion. Google pledged more than $100 million.\u003c/p>\n\u003cp>\u003cb>Outside the book (February 2025):\u003c/b> Google said it would no longer set hiring targets to improve representation, citing court decisions and U.S. executive orders. Meta, Amazon and Target also scaled back programs. Costco and Delta said they would continue theirs.\u003c/p>\n\u003cul>\u003cli>Should a company's values change when the law or political pressure changes? What's the difference between a value and a program?\u003c/li>\u003cli>Is a hiring target the same thing as inclusion?\u003c/li>\u003cli>Which stakeholders gain and which lose under each choice?\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 2 · Round 3 (teacher chooses ONE card)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards one\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Round 3 · Book 8.3 + outside source\u003c/span>\u003ch3>One company, many laws\u003c/h3>\n\u003cp>Meridian Freight (fictional) gives the same benefits to employees' same-sex partners as to opposite-sex spouses. In the U.S., the online edition of the book reports that the Supreme Court held in \u003ci>Bostock v. Clayton County\u003c/i> (2020) that discrimination at work based on sexual orientation or gender identity is sex discrimination. In the EU, the Employment Equality Directive (2000) also bans discrimination at work based on sexual orientation. Meridian is opening an office in a country with no such protection, where some of these benefits may conflict with local law.\u003c/p>\n\u003cul>\u003cli>Should Meridian apply one global policy everywhere, or follow each country's law?\u003c/li>\u003cli>What if the global policy put local employees at legal or social risk?\u003c/li>\u003cli>The book describes Marriott CEO Arne Sorenson's public letter saying everyone, regardless of orientation, gender, race, religion, disability or ethnicity, should have an equal opportunity to get a job. Is it a CEO's role to say this publicly?\u003c/li>\u003c/ul>\n\u003cp class=\"src\">Discuss policies and situations. No one should be asked about their own life.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no g\">Round 3B · alternative · Book 8.2\u003c/span>\u003ch3>One company, one dress code?\u003c/h3>\n\u003cp>Meridian Freight's global dress code says: \"No head coverings in client meetings.\" Offices in different countries say the rule causes problems: some employees cover their heads for religious reasons, and some clients expect a \"traditional business look\". In 2015, the U.S. Supreme Court ruled against Abercrombie &amp; Fitch, which had refused to hire Samantha Elauf because her hijab didn't fit its \"Look Policy\" (book, 8.2).\u003c/p>\n\u003cul>\u003cli>Should a global company have one dress code everywhere, or let each office decide?\u003c/li>\u003cli>Whose preferences matter more: clients', employees' or the brand's?\u003c/li>\u003cli>Is there a version of the rule that respects everyone?\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h3\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 3 · The Accommodation Desk · role cards (one set per group of 3)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Employee\u003c/h3>\u003cp>Read the request card. Explain it in your own words, adding realistic detail. You can say how the problem affects your work and life. You don't have to use legal words.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>Operations manager\u003c/h3>\u003cp>Raise ONE practical concern: cost, staffing, safety, customers or colleagues. Be realistic, not difficult.\u003c/p>\u003cp class=\"sec\">\"My concern is…\" · \"This would mean that…\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role\u003c/span>\u003ch3>HR partner\u003c/h3>\u003cp>Ask the employee ONE question. Then decide: \u003cb>Grant\u003c/b> · \u003cb>Grant with changes\u003c/b> · \u003cb>Deny (undue hardship)\u003c/b>. Name the rule or test.\u003c/p>\u003cp class=\"sec\">\"Is the cost \u003ci>substantial\u003c/i>, or just inconvenient?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no g\">The rules\u003c/span>\u003cul style=\"font-size:14px\">\u003cli>\u003cb>ADA (1990):\u003c/b> reasonable accommodation for disability unless undue hardship. No \"magic words\" needed.\u003c/li>\u003cli>\u003cb>Title VII (1964):\u003c/b> religion: no discrimination, harassment or retaliation; reasonable accommodation.\u003c/li>\u003cli>\u003cb>Abercrombie (2015):\u003c/b> can't refuse to hire to avoid accommodating.\u003c/li>\u003cli>\u003cb>\u003ci>Groff\u003c/i> (2023, outside the book):\u003c/b> denying a religious accommodation requires substantial increased costs.\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 3 · Request cards · Meridian Freight (fictional)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Request 1\u003c/span>\u003ch3>Sunday shifts\u003c/h3>\u003cp>A warehouse supervisor asks not to work Sundays for religious reasons. Weekend shifts rotate among six supervisors. Two colleagues could swap with him, but they say it's unfair that they would work more Sundays.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Request 2\u003c/span>\u003ch3>Mornings\u003c/h3>\u003cp>A data analyst has been late on Tuesdays and Thursdays six times this month. When her manager warns her, she says: \"I have hospital appointments early those mornings and the train takes 90 minutes.\" Company policy: three late arrivals = a written warning.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Request 3\u003c/span>\u003ch3>The look policy\u003c/h3>\u003cp>A candidate for a customer-facing sales job at Meridian's retail shop wears a hijab. The shop manager says the brand's \"look\" means no head coverings, and wants to hire someone else \"just to avoid problems\".\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Request 4\u003c/span>\u003ch3>The kirpan\u003c/h3>\u003cp>A Sikh engineer in Meridian's California office wants to wear a kirpan (a small sheathed blade that his faith requires adult men to carry) at work. Some colleagues say they feel uncomfortable.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Request 5\u003c/span>\u003ch3>The team reward\u003c/h3>\u003cp>The quarterly team reward is always drinks at a bar after work. Two employees ask for a change: one doesn't drink for religious reasons; the other simply prefers not to.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Request 6\u003c/span>\u003ch3>June 19\u003c/h3>\u003cp>The annual summer picnic is booked for June 19. Several Black employees want to mark Juneteenth (the day in 1865 when news of emancipation reached enslaved people in Texas) with family and community events. Catering is already paid for.\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h4\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 4 · The Payslip (optional; also on slide 14)\u003c/span>\u003c/div>\n\u003ch2>Meridian Freight (fictional)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable class=\"pay\">\u003ctr>\u003cth>\u003c/th>\u003cth>Dana Reyes\u003c/th>\u003cth>Marco Bianchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Title\u003c/td>\u003ctd>Customer Insights Analyst\u003c/td>\u003ctd>Logistics Data Analyst\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Annual salary\u003c/td>\u003ctd>\u003cb>$68,000\u003c/b>\u003c/td>\u003ctd>\u003cb>$76,000\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Experience\u003c/td>\u003ctd>4 years\u003c/td>\u003ctd>4 years\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Work\u003c/td>\u003ctd colspan=\"2\">Both build dashboards, present findings to clients and supervise one intern. Different teams, different titles.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"big\">\u003cb>Is this fair?\u003c/b> Yes · No · It depends &nbsp;&nbsp; \u003cb>Is this legal?\u003c/b> Yes · No · It depends\u003c/p>\n\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h5\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 5 · Case brief (one per student)\u003c/span>\u003c/div>\n\u003ch2>Same Job, Four Rulebooks: the case\u003c/h2>\n\u003cp>Meridian Freight (fictional) hired \u003cb>Dana Reyes\u003c/b> three years ago as a \u003cb>Customer Insights Analyst\u003c/b>. Her starting offer was based on her previous salary. \u003cb>Marco Bianchi\u003c/b> joined a year later as a \u003cb>Logistics Data Analyst\u003c/b>. He negotiated a higher starting salary.\u003c/p>\n\u003cp>Both have the same level of degree and four years' experience. Both build dashboards, present findings to clients and supervise one intern. They work on different teams with different titles. Dana now earns \u003cb>$68,000\u003c/b>; Marco earns \u003cb>$76,000\u003c/b>. Dana found out when a colleague mentioned Marco's salary.\u003c/p>\n\u003cp>Meridian has offices in \u003cb>New Jersey\u003c/b>, \u003cb>Minnesota\u003c/b>, \u003cb>Germany\u003c/b> and other countries.\u003c/p>\n\u003ch3>Expert group questions\u003c/h3>\n\u003col>\u003cli>Under our rulebook, is Dana's pay gap likely to be illegal?\u003c/li>\u003cli>What would Dana need to show?\u003c/li>\u003cli>What must (or should) Meridian do now?\u003c/li>\u003cli>One strength and one weakness of our rulebook.\u003c/li>\u003c/ol>\n\u003ch3>Home group task\u003c/h3>\n\u003cp>Teach your rulebook in 90 seconds. Complete the grid. Then write Meridian's \u003cb>global pay policy\u003c/b> in three lines: \u003cb>Local\u003c/b> (follow each location's law), \u003cb>Strictest\u003c/b> (strictest rule everywhere) or \u003cb>Hybrid\u003c/b>. Name one ethical framework that supports it and one stakeholder who loses.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 5 · Rulebook cards A–D (one per expert group)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Rulebook A · Book 8.4 + update\u003c/span>\u003ch3>U.S. federal law\u003c/h3>\u003cul>\u003cli>Federal standard: \u003cb>\"equal pay for equal work\"\u003c/b>. The jobs must be equal.\u003c/li>\u003cli>Women are paid about \u003cb>80%\u003c/b> of what men are paid (AAUW and Pew studies, cited in the book).\u003c/li>\u003cli>Federal minimum wage: \u003cb>$7.25\u003c/b> per hour.\u003c/li>\u003cli>\u003ci>Update (outside the book):\u003c/i> still $7.25 in 2026, unchanged since 2009. About 30 states and Washington, D.C. set a higher minimum.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Rulebook B · Book 8.4\u003c/span>\u003ch3>New Jersey: Diane B. Allen Equal Pay Act\u003c/h3>\u003cul>\u003cli>Standard: \u003cb>\"equal pay for substantially similar work\"\u003c/b>, judged by skill, effort and responsibility, not job title.\u003c/li>\u003cli>An employee can recover up to \u003cb>six years\u003c/b> of underpayment.\u003c/li>\u003cli>A winning employee's damages are \u003cb>tripled\u003c/b>.\u003c/li>\u003cli>Named after a retired New Jersey state senator who experienced pay discrimination.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Rulebook C · Book 8.4 + Chapter 6\u003c/span>\u003ch3>Minnesota pay equity\u003c/h3>\u003cul>\u003cli>Jobs are evaluated by \u003cb>knowledge, problem solving, responsibility and working conditions\u003c/b>, not by titles.\u003c/li>\u003cli>Applies \u003cb>only to state government employees\u003c/b>.\u003c/li>\u003cli>Chapter 6 link: \u003cb>comparable worth\u003c/b>: pay should reflect a job's value to the organization, not the person's salary history.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no g\">Rulebook D · Outside the book\u003c/span>\u003ch3>EU Pay Transparency Directive (2023)\u003c/h3>\u003cul style=\"font-size:14px\">\u003cli>Pay range given \u003cb>before the interview\u003c/b>.\u003c/li>\u003cli>Employers may \u003cb>not ask about salary history\u003c/b>.\u003c/li>\u003cli>Workers may \u003cb>ask for pay information\u003c/b>, including average pay by sex for the same work or work of equal value.\u003c/li>\u003cli>Employers with 100+ workers \u003cb>report gender pay gaps\u003c/b> (250+: every year from June 2027).\u003c/li>\u003cli>An unexplained gap of \u003cb>5% or more\u003c/b> in a worker category, not fixed within 6 months → \u003cb>joint pay assessment\u003c/b> with worker representatives.\u003c/li>\u003cli>\u003cb>Burden of proof on the employer.\u003c/b>\u003c/li>\u003cli>Deadline to become national law: \u003cb>7 June 2026\u003c/b>. Only 4 of 27 countries met it.\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h6\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 6 · The Board Asks · question cards (one set, cut)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Board question\u003c/span>\u003cp class=\"big\">\"Why should we pay more than the law requires?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Board question\u003c/span>\u003cp class=\"big\">\"How much will this cost us, and who pays?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Board question\u003c/span>\u003cp class=\"big\">\"Marco negotiated better. Isn't rewarding negotiation fair?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Board question\u003c/span>\u003cp class=\"big\">\"Our competitors follow only local law. Won't we lose money?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Board question\u003c/span>\u003cp class=\"big\">\"What do we do in countries where the law is weaker?\"\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Board question\u003c/span>\u003cp class=\"big\">\"The data show correlation, not causation. Why should we believe this helps the business?\"\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h7\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan>Handout 7 · Exit ticket slips (Class 2)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Week 8 · Exit ticket\u003c/b> &nbsp; Name: ____________\u003c/p>\u003cp>1. One difference between diversity and inclusion:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>2. One thing a company should do even if the law doesn't require it:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>3. Confidence today: 1 · 2 · 3 · 4\u003c/p>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Week 8 · Exit ticket\u003c/b> &nbsp; Name: ____________\u003c/p>\u003cp>1. One difference between diversity and inclusion:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>2. One thing a company should do even if the law doesn't require it:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>3. Confidence today: 1 · 2 · 3 · 4\u003c/p>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Week 8 · Exit ticket\u003c/b> &nbsp; Name: ____________\u003c/p>\u003cp>1. One difference between diversity and inclusion:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>2. One thing a company should do even if the law doesn't require it:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>3. Confidence today: 1 · 2 · 3 · 4\u003c/p>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Week 8 · Exit ticket\u003c/b> &nbsp; Name: ____________\u003c/p>\u003cp>1. One difference between diversity and inclusion:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>2. One thing a company should do even if the law doesn't require it:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>3. Confidence today: 1 · 2 · 3 · 4\u003c/p>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Week 8 · Exit ticket\u003c/b> &nbsp; Name: ____________\u003c/p>\u003cp>1. One difference between diversity and inclusion:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>2. One thing a company should do even if the law doesn't require it:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>3. Confidence today: 1 · 2 · 3 · 4\u003c/p>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Week 8 · Exit ticket\u003c/b> &nbsp; Name: ____________\u003c/p>\u003cp>1. One difference between diversity and inclusion:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>2. One thing a company should do even if the law doesn't require it:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cp>3. Confidence today: 1 · 2 · 3 · 4\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "quiz": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 · Quiz 3 (Chapters 6–8)\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;ve
