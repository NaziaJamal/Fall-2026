splay:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.qbar{position:sticky;top:63px;z-index:10;background:#fff;border-bottom:1px solid var(--sky);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.qbar .st{font-size:13px;color:var(--mut);margin-left:auto}\n.q{margin:12px 0;break-inside:avoid}\n.q p{margin:0 0 4px}\n.q ol{list-style:lower-alpha;margin:2px 0 0;padding-left:24px}\n.q li{margin:1px 0}\n.ans{display:none;background:#eef7ee;border-left:4px solid #3c7d3c;padding:6px 10px;border-radius:6px;margin:6px 0;font-size:15px}\nbody.key .ans{display:block}\nbody.key .right{background:#d8eed8;border-radius:4px;font-weight:700}\n.mt{display:grid;grid-template-columns:1fr 1.6fr;gap:10px 24px}\n.mt ol{padding-left:22px}\n.mt ol.def{list-style:upper-alpha}\n.mt li{margin:5px 0}\n.blank{display:inline-block;width:46px;border-bottom:1px solid #333;margin-right:6px}\n.lines div{border-bottom:1px solid #999;height:28px}\n.hd{display:flex;gap:20px;flex-wrap:wrap;margin:6px 0 10px}\n.hd span{flex:1 1 200px;border-bottom:1px solid #999;padding-bottom:2px}\n@media (max-width:640px){.mt{grid-template-columns:1fr}}\n@media print{.pc{break-before:page}.qbar{display:none}.q{margin:8px 0}.lines div{height:26px}section{break-inside:auto}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Quiz 3\u003c/span>\u003c/header>\n\n\u003cdiv class=\"qbar noprint\">\n\u003cbutton class=\"btn g\" id=\"kb\" onclick=\"toggleKey()\">Show teacher key\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\n\u003cspan class=\"st\" id=\"st\">Student version (print with the key hidden)\u003c/span>\n\u003c/div>\n\u003cdiv class=\"wrap\">\n\u003ch1>Quiz 3 · Chapters 6–8\u003c/h1>\n\u003cp class=\"lead\">Ethics in a Global World · Week 8 · 25 minutes · 30 points · No phones or notes\u003c/p>\n\u003cdiv class=\"hd\">\u003cspan>Name:\u003c/span>\u003cspan>Date:\u003c/span>\u003cspan>Score: ______ / 30\u003c/span>\u003c/div>\n\n\u003csection>\n\u003ch2>Part A · Multiple choice (10 points)\u003c/h2>\n\u003cp>Circle the best answer.\u003c/p>\n\u003cdiv class=\"q\">\u003cp>\u003cb>1.\u003c/b> (Ch. 6) OSHA, the Occupational Safety and Health Act, mainly governs…\u003c/p>\u003col>\u003cli class=\"right\">workplace safety.\u003c/li>\u003cli>union elections.\u003c/li>\u003cli>employee privacy.\u003c/li>\u003cli>the minimum wage.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>2.\u003c/b> (Ch. 6) \"Comparable worth\" means that pay should reflect…\u003c/p>\u003col>\u003cli>the employee's previous salary.\u003c/li>\u003cli class=\"right\">the job's value to the organization.\u003c/li>\u003cli>how well the employee negotiates.\u003c/li>\u003cli>how long the employee has worked there.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>3.\u003c/b> (Ch. 7) Which action most clearly breaks an employee's duty of loyalty?\u003c/p>\u003col>\u003cli>Applying for other jobs during a lunch break\u003c/li>\u003cli class=\"right\">Secretly starting a competing business and contacting the employer's clients\u003c/li>\u003cli>Discussing pay with coworkers\u003c/li>\u003cli>Resigning with two weeks' notice\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>4.\u003c/b> (Ch. 7) In the textbook, whistleblowing means…\u003c/p>\u003col>\u003cli>complaining about a manager on social media.\u003c/li>\u003cli>telling coworkers about a problem.\u003c/li>\u003cli class=\"right\">reporting an employer's illegal conduct to a government agency or outside authority.\u003c/li>\u003cli>refusing to sign a non-compete agreement.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>5.\u003c/b> (Ch. 7) Insider trading is…\u003c/p>\u003col>\u003cli>buying shares in the company you work for.\u003c/li>\u003cli class=\"right\">trading securities using important private information the public doesn't have.\u003c/li>\u003cli>selling products to other employees.\u003c/li>\u003cli>giving gifts to suppliers.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>6.\u003c/b> (Ch. 8) Howard Ross says, \"Diversity is being invited to the party; inclusion is…\"\u003c/p>\u003col>\u003cli>paying for the party.\u003c/li>\u003cli class=\"right\">being asked to dance.\u003c/li>\u003cli>choosing the music.\u003c/li>\u003cli>staying until the end.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>7.\u003c/b> (Ch. 8) What can we conclude from the McKinsey study in Chapter 8?\u003c/p>\u003col>\u003cli>Diversity causes higher profits.\u003c/li>\u003cli>Diverse companies earn 35% more than other companies.\u003c/li>\u003cli class=\"right\">Diverse companies were more likely to perform above their industry median, but correlation does not prove causation.\u003c/li>\u003cli>Diversity has no connection with performance.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>8.\u003c/b> (Ch. 8) An employer may refuse a reasonable accommodation if…\u003c/p>\u003col>\u003cli>other employees don't like it.\u003c/li>\u003cli>the employee didn't use the word \"disability\".\u003c/li>\u003cli class=\"right\">it would cause undue hardship to the business.\u003c/li>\u003cli>the employee is new.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>9.\u003c/b> (Ch. 8) According to section 8.3 (online edition), in \u003ci>Bostock v. Clayton County\u003c/i> (2020) the U.S. Supreme Court held that…\u003c/p>\u003col>\u003cli>states may decide whether to protect sexual orientation.\u003c/li>\u003cli class=\"right\">sex discrimination at work includes discrimination based on sexual orientation and gender identity.\u003c/li>\u003cli>only public employers must protect sexual orientation.\u003c/li>\u003cli>the Equality Act became law.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>10.\u003c/b> (Ch. 8) New Jersey's Diane B. Allen Equal Pay Act requires…\u003c/p>\u003col>\u003cli>equal pay for identical job titles only.\u003c/li>\u003cli class=\"right\">equal pay for substantially similar work.\u003c/li>\u003cli>a $15 minimum wage.\u003c/li>\u003cli>pay equity for state government employees only.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"ans\">\u003cb>Key, Part A:\u003c/b> 1a · 2b · 3b · 4c · 5b · 6b · 7c · 8c · 9b · 10b. (Q9 uses the online edition of 8.3; the Chapter Summary page and older print copies are out of date.)\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Part B · Matching (8 points)\u003c/h2>\n\u003cp>Write the letter of the best definition next to each term. Two definitions are not used.\u003c/p>\n\u003cdiv class=\"mt\">\n\u003col>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>employment at will\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>codetermination\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>conflict of interest\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>non-compete agreement\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>retaliation\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>diversity dividend\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>reasonable accommodation\u003c/li>\n\u003cli>\u003cspan class=\"blank\">\u003c/span>income inequality\u003c/li>\n\u003c/ol>\n\u003col class=\"def\">\n\u003cli>a promise not to work for a competitor for a period after leaving a job\u003c/li>\n\u003cli>the financial benefit of improved performance linked to a diverse workforce\u003c/li>\n\u003cli>a change to a job or the workplace that lets an employee with a disability or other need do the job\u003c/li>\n\u003cli>either the employer or the employee can end the job at any time, for any legal reason\u003c/li>\n\u003cli>how many times greater the average executive's pay is than the average worker's\u003c/li>\n\u003cli>punishing an employee for reporting a problem or asserting a right\u003c/li>\n\u003cli>the unequal distribution of income among people in an economy\u003c/li>\n\u003cli>a situation where personal interests could influence a person's work decisions\u003c/li>\n\u003cli>a European practice of giving workers a seat on the company's board of directors\u003c/li>\n\u003cli>the entitlement of nonhuman animals to ethical treatment\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cdiv class=\"ans\">\u003cb>Key, Part B:\u003c/b> 1 D · 2 I · 3 H · 4 A · 5 F · 6 B · 7 C · 8 G. Not used: E (pay ratio), J (animal rights).\u003c/div>\n\u003c/section>\n\n\u003csection class=\"pc\">\n\u003ch2>Part C · Short case response (12 points)\u003c/h2>\n\u003cdiv class=\"case\" style=\"border-left:3px solid var(--navy);padding:6px 12px;background:#f7f9fc\">\n\u003cp>\u003cb>Kestrel Foods (fictional)\u003c/b> runs a busy food-processing plant in Ohio, in the U.S. Amira, a quality inspector, asks her manager for a 20-minute break on Friday afternoons for prayer. She offers to start 20 minutes earlier on Fridays. The manager says no: \"Friday afternoon is our busiest time, and if I say yes to you, everyone will want special breaks.\" While looking into the request, HR notices that Amira earns 12% less than a male inspector, Tom, who does the same tasks on the same shift. Tom was hired at a higher salary because his last employer paid more.\u003c/p>\u003c/div>\n\u003cp>Write one paragraph (150–200 words). In your answer:\u003c/p>\n\u003col>\n\u003cli>Identify \u003cb>two\u003c/b> rights issues in this case, using at least \u003cb>three\u003c/b> terms from Chapter 8.\u003c/li>\n\u003cli>Recommend what Kestrel Foods should do, and support your recommendation with \u003cb>one ethical framework\u003c/b>.\u003c/li>\n\u003cli>Give \u003cb>one counterargument\u003c/b> and respond to it.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"lines\">\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003c/div>\n\u003cdiv class=\"ans\">\n\u003cp>\u003cb>Rubric, Part C (12 points)\u003c/b>\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>Points\u003c/th>\u003cth>Full marks\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Rights issues and terms\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Identifies both issues (religious accommodation; unequal pay for the same work) and uses at least three Chapter 8 terms accurately (e.g., reasonable accommodation, undue hardship, bona fide belief, pay equity, income inequality, inclusion)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Recommendation and framework\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Clear recommendation for both issues; a framework is applied, not just named\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Counterargument and response\u003c/td>\u003ctd>2\u003c/td>\u003ctd>A realistic counterargument (e.g., production pressure, fairness to coworkers, \"the market set his pay\") and a reasoned response\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Language\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Clear paragraph; accurate modals and linking; errors don't block meaning\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Model answer (about 190 words):\u003c/b> This case raises two rights issues. First, Amira is asking for a reasonable accommodation of a bona fide religious practice. Under Title VII, Kestrel must accommodate her unless it can show undue hardship, and since \u003ci>Groff v. DeJoy\u003c/i> (2023) that means substantial increased costs. Her offer to start earlier means the cost is small, and \"everyone will want special breaks\" is not a hardship. Second, Amira earns 12% less than Tom for the same work. Basing pay on salary history carries past inequality forward, which is a pay equity problem. Kestrel should grant the Friday break with the earlier start, and raise Amira's pay to match Tom's. From a Kantian or rights-based perspective, Amira should be treated as an equal person with her own beliefs, not as a cost on a production line. Some would argue that Tom's higher pay simply reflects the market and is not discrimination. However, if two people do the same job, using a previous employer's pay decisions as the reason means Kestrel is choosing to repeat that inequality. Correcting the gap is fairer and also protects the company's reputation.\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\n\u003cscript>\nfunction toggleKey(){const on=document.body.classList.toggle('key');document.getElementById('kb').textContent=on?'Hide teacher key':'Show teacher key';document.getElementById('st').textContent=on?'Teacher key is showing: hide it before printing for students':'Student version (print with the key hidden)'}\n\u003c/script>\n\u003c/body>\u003c/html>", "key": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Answer Key · Recognizing and Respecting the Rights of All\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;disp px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.open{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:middle}\n.set{display:inline-block;background:#3c7d3c;color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:middle}\n.look{background:var(--sky2);border-left:4px solid var(--blue);padding:6px 12px;border-radius:6px;margin:8px 0;font-size:15px}\n.look::before{content:\"Look for: \";font-weight:700;color:var(--blue)}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Answer key\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 8 Answer Key\u003c/h1>\n\u003cp class=\"lead\">Worksheet Parts 1–10 and the Code of Ethics draft · \u003cspan class=\"set\">Set answer\u003c/span> = one correct answer · \u003cspan class=\"open\">Open answer\u003c/span> = model answer and what to look for · \u003cbutton class=\"btn noprint\" onclick=\"print()\">Print\u003c/button>\u003c/p>\n\u003cp class=\"note\">The Quiz 3 key and rubric are in the \u003cb>Quiz 3\u003c/b> tab (tap \"Show teacher key\").\u003c/p>\n\n\u003csection>\n\u003ch2>1 · The Meeting Nobody Noticed \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cp>\u003cb>Model:\u003c/b> \"We chose A because the senior manager liked it and nobody objected. After the reveal, we learned that the remote colleague couldn't attend evenings and the second-language colleague doesn't drink, so A excluded two people. One change: collect written ideas from everyone first, then discuss.\"\u003c/p>\n\u003cdiv class=\"look\">who was silent and why; the connection between not being heard and a worse decision; a concrete format change (round-robin, written input first, reading remote notes aloud, asking people by name).\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>2a · Invited vs. included \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cp>\u003cb>Model:\u003c/b> Diversity means having people with different backgrounds, abilities and viewpoints in the workforce. Inclusion means those people are engaged, heard and feel they belong. Example: \"In my hospital, shift handovers used a written checklist, so newer nurses' observations were recorded, not just the senior nurse's.\"\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>2b · Data Detective \u003cspan class=\"set\">Set answer\u003c/span>\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>#\u003c/th>\u003cth>Headline\u003c/th>\u003cth>Answer\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\"Ethnically diverse companies earn 35% more profit.\"\u003c/td>\u003ctd>\u003cb>Overstated\u003c/b>\u003c/td>\u003ctd>35% is how much more \u003ci>likely\u003c/i> they were to beat the industry median, not how much more profit they made.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\"…top quarter for ethnic diversity were more likely to beat their industry median.\"\u003c/td>\u003ctd>\u003cb>Supported\u003c/b>\u003c/td>\u003ctd>That's what Fig. 8.4 shows (58 vs. 43).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\"Hiring more women will make your company more profitable.\"\u003c/td>\u003ctd>\u003cb>Not supported\u003c/b>\u003c/td>\u003ctd>It claims a cause; the data show a correlation.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\"…most diverse boards and executives had ROE more than 50% higher…\"\u003c/td>\u003ctd>\u003cb>Supported\u003c/b>\u003c/td>\u003ctd>Stated in 8.1.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\"Diversity creates tension, so it hurts performance.\"\u003c/td>\u003ctd>\u003cb>Not supported\u003c/b>\u003c/td>\u003ctd>The book says tension can arise but can be managed through inclusion; the data point the other way.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Other explanations (open):\u003c/b> profitable firms can afford wide recruiting; diverse teams consider more viewpoints; better understanding of diverse customers; firms that are good at managing people may be good at both.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>3 · Discussion circles \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cp>\u003cb>Model \"It depends on…\" sentences:\u003c/b>\u003c/p>\n\u003cul>\u003cli>Round 1: \"It depends on whether the criticism targets a program or demeans a group of colleagues.\"\u003c/li>\u003cli>Round 2: \"It depends on whether diversity was a value or only a program; values shouldn't change with politics, but methods may have to change with the law.\"\u003c/li>\u003cli>Round 3: \"It depends on whether a global policy would protect employees or put them at risk locally.\"\u003c/li>\u003cli>Round 3B: \"It depends on whether the dress code is needed for safety or is only about image.\"\u003c/li>\u003c/ul>\n\u003cdiv class=\"look\">a real condition (not \"it depends on the situation\"); at least one stakeholder; respectful language.\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>4 · The Accommodation Desk\u003c/h2>\n\u003ch3>Warm-up: Which rule? \u003cspan class=\"set\">Set answer\u003c/span>\u003c/h3>\n\u003cp>ADA → protects people with disabilities; reasonable accommodation · Title VII → bans discrimination based on religion (and race, sex); religious accommodation · Abercrombie &amp; Fitch → may not refuse to hire to avoid accommodating · \u003ci>Groff\u003c/i> → substantial increased costs.\u003c/p>\n\u003ch3>Requests \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>#\u003c/th>\u003cth>Likely decision\u003c/th>\u003cth>Strong reasoning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 · Sunday shifts\u003c/td>\u003ctd>Grant / grant with changes\u003c/td>\u003ctd>Title VII religious accommodation. Voluntary swaps, or extra pay for Sunday volunteers. After \u003ci>Groff\u003c/i>, colleagues' annoyance isn't undue hardship; the employer would have to show substantial increased costs.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 · Mornings\u003c/td>\u003ctd>Grant with changes\u003c/td>\u003ctd>A possible ADA accommodation even though she didn't say \"disability\". Adjust her start time on those days or let her make up the time; talk before disciplining (Verizon lesson).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 · The look policy\u003c/td>\u003ctd>Hire on merit; allow the exception\u003c/td>\u003ctd>Abercrombie &amp; Fitch (2015): refusing to hire to avoid accommodating a religious practice is discrimination.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 · The kirpan\u003c/td>\u003ctd>Grant with changes\u003c/td>\u003ctd>California allows a kirpan worn openly and sheathed. Discomfort alone isn't undue hardship; a specific, real safety risk might change the answer. Talk with the team.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 · The team reward\u003c/td>\u003ctd>Grant (change the reward)\u003c/td>\u003ctd>Religious reason: accommodation and inclusion. Second employee: no legal duty, but the book (8.1) says leaders should rethink rewards so they suit everyone. Ethics beyond the law.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6 · June 19\u003c/td>\u003ctd>Grant with changes\u003c/td>\u003ctd>Ask the employees. Options: make the event a Juneteenth celebration; change the time; let people attend part of it. Avoid deciding for them.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"look\">the correct test named (reasonable accommodation, undue hardship, substantial increased costs); \"grant with changes\" with realistic conditions; recognizing request 2 without the \"magic words\".\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>5 · The Payslip \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cp>There is no single answer: that is the point of Class 2. Strong reasons mention: same work but different titles; salary history carrying forward past inequality; negotiation as a legitimate or illegitimate factor; where the job is located.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>6 · Would you rather? \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cb>Card 1:\u003c/b> for A: higher pay for everyone, including women, reduces income inequality (8.4). For B: pay equity is a matter of rights, not only income (Kantian). Good students notice a false choice: a company can do both.\u003c/li>\u003cli>\u003cb>Card 2:\u003c/b> for waiting: access to the EU market and many other countries; consumer pressure (8.5); sentience (Singer). For launching: speed, legality in the U.S. Good students raise reputation risk and the 40 nations.\u003c/li>\u003cli>\u003cb>Card 3:\u003c/b> for raising wages: the middle class is the customer base; stability; reduces inequality (8.4). For bonuses: rewards performance (utilitarian incentives). Neumark and Wascher's skepticism can support either side.\u003c/li>\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>7 · Same Job, Four Rulebooks\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Rulebook\u003c/th>\u003cth>Likely illegal?\u003c/th>\u003cth>What Dana must show\u003c/th>\u003cth>What Meridian must / should do\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A · U.S. federal\u003c/td>\u003ctd>Uncertain; harder for Dana\u003c/td>\u003ctd>That the jobs are \u003cb>equal\u003c/b>, not just similar. Different titles and teams make this harder.\u003c/td>\u003ctd>Legally, possibly nothing. Ethically: review pay for similar roles.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B · New Jersey\u003c/td>\u003ctd>Likely illegal\u003c/td>\u003ctd>That the work is \u003cb>substantially similar\u003c/b> in skill, effort and responsibility. Titles don't matter.\u003c/td>\u003ctd>Correct the gap; it risks up to six years of back pay, tripled (for example, a gap of about $8,000 a year for the two years since Marco joined, tripled, is about $48,000).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C · Minnesota\u003c/td>\u003ctd>Doesn't apply (private employer)\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Not required. But the method (evaluate jobs by knowledge, problem solving, responsibility, working conditions) is a good tool for Meridian's own review.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D · EU\u003c/td>\u003ctd>Likely illegal if the jobs are of equal value\u003c/td>\u003ctd>Facts suggesting discrimination; then the \u003cb>employer\u003c/b> must prove the gap is justified by objective, gender-neutral factors. Salary history is not acceptable.\u003c/td>\u003ctd>Answer Dana's request for pay information; fix the gap; if a 5%+ unexplained gap appears in reporting, do a joint pay assessment. Stop asking about salary history.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"src\">The New Jersey figure is an illustration for class discussion, not legal advice: the actual amount would depend on the facts and the court.\u003c/p>\n\u003cp>\u003cb>Model global policy (Hybrid):\u003c/b> \"Meridian will evaluate every job by skill, effort, responsibility and working conditions, and pay the same range for substantially similar work in every country. We will publish pay ranges in job ads and stop asking about salary history everywhere. Where local law requires more, we will follow local law.\" \u003cb>Framework:\u003c/b> Rawls: behind a veil of ignorance, no one would choose a system where pay depends on your previous employer. \u003cb>Who loses:\u003c/b> shareholders (higher costs in the short term) and managers who lose flexibility in negotiation.\u003c/p>\n\u003cdiv class=\"look\">accurate use of each rulebook; the difference between \"equal\" and \"substantially similar\"; a policy that names a framework and admits a cost.\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8 · The Board Asks \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Strong answer includes\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\"Why pay more than the law requires?\"\u003c/td>\u003ctd>Business: retention, lower hiring costs, reputation, legal risk in stricter places (NJ, EU). Ethical: rights-based fairness; the book's argument that the middle class is the customer base.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"How much will it cost, and who pays?\"\u003c/td>\u003ctd>An honest estimate; compared with the cost of lawsuits, turnover, or losing EU business.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Marco negotiated better.\"\u003c/td>\u003ctd>Negotiation reflects confidence and past pay, not the value of the job; it can carry forward past inequality. Pay bands still allow some negotiation within a range.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Competitors follow only local law.\"\u003c/td>\u003ctd>Long-term vs. short-term; talent goes to fairer employers; laws are tightening (EU directive, U.S. states).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Where the law is weaker?\"\u003c/td>\u003ctd>Apply our standard anyway (consistency, integrity), unless it would put employees at risk.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"Correlation, not causation.\"\u003c/td>\u003ctd>Agree honestly; argue from ethics and risk, not only from the McKinsey numbers.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>9 · From red lines to a code \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cp>\u003cb>Model rewrites:\u003c/b> \"I will be fair.\" → \"I will base pay recommendations on job content, not on salary history.\" · \"I will respect diversity.\" → \"In meetings I lead, I will ask everyone for input before giving my opinion, and read remote colleagues' comments aloud.\" · \"I will be honest.\" → \"I will correct a mistake in a client report within one working day of finding it.\"\u003c/p>\n\u003cdiv class=\"look\">an observable action, a time or situation, and a clear subject (\"I will…\").\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>10 · Exit ticket \u003cspan class=\"open\">Open answer\u003c/span>\u003c/h2>\n\u003cp>(1) Diversity is who is in the workforce; inclusion is whether they are engaged and heard. (2) Examples: pay above the minimum wage; equal pay for similar work; accommodations beyond the legal minimum; inclusive meeting formats; equal benefits for same-sex partners.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Personal Code of Ethics: model and rubric\u003c/h2>\n\u003cp>The model code (a logistics project manager, about 360 words) is inside the \u003cb>Code of Ethics Draft\u003c/b> tab under \"See a model code\". The rubric (20 points) is in the Teacher Guide, Homework section.\u003c/p>\n\u003cdiv class=\"look\">specific, checkable commitments; red lines from Week 7; a hard case with a framework and a counterargument; at least four course terms used correctly.\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "notes": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Study Notes · Quiz 3 Review (Chapters 6–8)\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t 03c/small>\u003c/div>\u003cspan class=\"who\">Study notes\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1>Quiz 3 Review: Study Notes\u003c/h1>\n\u003cp class=\"lead\">Chapters 6–8 · Key ideas in plain words · \u003cbutton class=\"btn noprint\" onclick=\"print()\">Print\u003c/button>\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Quiz 3:\u003c/b> end of Class 2, Week 8 · 25 minutes · 30 points · Part A multiple choice (10) · Part B matching (8) · Part C a short case paragraph (12): identify rights issues using course terms, recommend an action with one ethical framework, and answer a counterargument.\u003c/div>\n\n\u003csection>\n\u003ch2>Chapter 6 · What Employers Owe Employees \u003cspan class=\"src\">(pp. 159–194)\u003c/span>\u003c/h2>\n\u003cp class=\"src\">\u003cb>Read online:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-1-the-workplace-environment-and-working-conditions\" target=\"_blank\" rel=\"noopener\">6.1 The Workplace Environment and Working Conditions\u003c/a> (p. 160) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-2-what-constitutes-a-fair-wage\" target=\"_blank\" rel=\"noopener\">6.2 What Constitutes a Fair Wage?\u003c/a> (p. 169) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-3-an-organized-workforce\" target=\"_blank\" rel=\"noopener\">6.3 An Organized Workforce\u003c/a> (p. 177) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-4-privacy-in-the-workplace\" target=\"_blank\" rel=\"noopener\">6.4 Privacy in the Workplace\u003c/a> (p. 184) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-key-terms\" target=\"_blank\" rel=\"noopener\">Key terms\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-summary\" target=\"_blank\" rel=\"noopener\">Summary\u003c/a>\u003c/p>\n\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning in plain words\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>OSHA\u003c/td>\u003ctd>the Occupational Safety and Health Act, the U.S. law on workplace safety, and the agency that enforces it\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>EEOC\u003c/td>\u003ctd>the Equal Employment Opportunity Commission, which works to end workplace discrimination\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>sexual harassment\u003c/td>\u003ctd>unwelcome sexual advances, requests or conduct from a supervisor, coworker, client or customer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>employment at will\u003c/td>\u003ctd>either side can end the job at any time, without a reason, unless a contract says otherwise\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>comparable worth\u003c/td>\u003ctd>pay should reflect the job's value to the organization, not the person's salary history\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pay ratio\u003c/td>\u003ctd>how many times more the average executive earns than the average worker\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>collective bargaining\u003c/td>\u003ctd>a union negotiating with the employer for the employees\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>closed shop / right-to-work law\u003c/td>\u003ctd>new workers must join the union / a state law saying workers can't be required to join a union\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>codetermination\u003c/td>\u003ctd>a European practice of giving workers a seat on the company's board\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>business purpose / consent exception\u003c/td>\u003ctd>two exceptions to the 1986 Electronic Communications Privacy Act that let employers monitor communications (for a legitimate business reason / with employees' consent)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Big ideas:\u003c/b> safe, respectful workplaces attract and keep talent; fair pay takes judgment (the minimum wage has lost about 23% of its value since 1960, and women still earn less); unions have declined while productivity grew faster than wages; monitoring employees raises legal and ethical privacy questions.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Chapter 7 · What Employees Owe Employers \u003cspan class=\"src\">(pp. 195–230)\u003c/span>\u003c/h2>\n\u003cp class=\"src\">\u003cb>Read online:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\" target=\"_blank\" rel=\"noopener\">7.1 Loyalty to the Company\u003c/a> (p. 196) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-2-loyalty-to-the-brand-and-to-customers\" target=\"_blank\" rel=\"noopener\">7.2 Loyalty to the Brand and to Customers\u003c/a> (p. 203) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-3-contributing-to-a-positive-work-atmosphere\" target=\"_blank\" rel=\"noopener\">7.3 Contributing to a Positive Work Atmosphere\u003c/a> (p. 207) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-4-financial-integrity\" target=\"_blank\" rel=\"noopener\">7.4 Financial Integrity\u003c/a> (p. 212) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">7.5 Criticism of the Company and Whistleblowing\u003c/a> (p. 218) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-key-terms\" target=\"_blank\" rel=\"noopener\">Key terms\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-summary\" target=\"_blank\" rel=\"noopener\">Summary\u003c/a>\u003c/p>\n\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning in plain words\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>duty of loyalty\u003c/td>\u003ctd>employees must not act against their employer's interests\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>fiduciary duty\u003c/td>\u003ctd>a higher duty of trust for people with authority or access to secrets\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>conflict of interest\u003c/td>\u003ctd>personal gain could influence your work decisions\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>moonlighting\u003c/td>\u003ctd>having a second job, usually after hours\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>confidentiality / trade secret\u003c/td>\u003ctd>keeping company information private / valuable information a company keeps secret\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>non-compete agreement\u003c/td>\u003ctd>a promise not to work for a competitor, during or after the job\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nonsolicitation / nondisparagement\u003c/td>\u003ctd>not taking clients or coworkers with you / not damaging the company's reputation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>internal marketing\u003c/td>\u003ctd>getting employees to believe in the company's brand\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>insider trading\u003c/td>\u003ctd>trading shares using important private information\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>bribe / grease payment\u003c/td>\u003ctd>a payment for an improper act / a small payment to speed up a routine task\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>whistleblowing\u003c/td>\u003ctd>reporting an employer's illegal conduct to a government agency or outside authority\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>retaliation\u003c/td>\u003ctd>punishing someone for reporting or complaining\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>qui tam\u003c/td>\u003ctd>a False Claims Act rule that lets a private person sue for the government and share the money recovered\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Big ideas:\u003c/b> loyalty should be a two-way street; employees protect company assets and avoid conflicts of interest; discussing pay with coworkers is generally protected, but personal attacks online are not; whistleblowing should stop serious wrongdoing, not settle personal scores.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Chapter 8 · Recognizing and Respecting the Rights of All \u003cspan class=\"src\">(pp. 231–264)\u003c/span>\u003c/h2>\n\u003cp class=\"src\">\u003cb>Read online:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-1-diversity-and-inclusion-in-the-workforce\" target=\"_blank\" rel=\"noopener\">8.1 Diversity and Inclusion in the Workforce\u003c/a> (pp. 232–238) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-2-accommodating-different-abilities-and-faiths\" target=\"_blank\" rel=\"noopener\">8.2 Accommodating Different Abilities and Faiths\u003c/a> (pp. 239–243) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-3-sexual-identification-and-orientation\" target=\"_blank\" rel=\"noopener\">8.3 Sexual Identification and Orientation\u003c/a> (pp. 244–246) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-4-income-inequalities\" target=\"_blank\" rel=\"noopener\">8.4 Income Inequalities\u003c/a> (pp. 247–251) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-5-animal-rights-and-the-implications-for-business\" target=\"_blank\" rel=\"noopener\">8.5 Animal Rights and the Implications for Business\u003c/a> (from p. 252) · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-key-terms\" target=\"_blank\" rel=\"noopener\">Key terms\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-summary\" target=\"_blank\" rel=\"noopener\">Summary\u003c/a>\u003c/p>\n\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning in plain words\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>diversity\u003c/td>\u003ctd>the mix of people and perspectives in a workforce\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>inclusion\u003c/td>\u003ctd>the engagement of all employees in the corporate culture; being \"asked to dance\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>diversity dividend\u003c/td>\u003ctd>the financial benefit linked to a diverse workforce\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>reasonable accommodation\u003c/td>\u003ctd>a change to a job or workplace so a person with a disability or other need can do the job\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>undue hardship\u003c/td>\u003ctd>a difficulty or cost large enough that the employer may refuse an accommodation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>income inequality\u003c/td>\u003ctd>the unequal distribution of income in an economy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pay equity\u003c/td>\u003ctd>fair pay for work of the same value\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>animal rights\u003c/td>\u003ctd>the entitlement of nonhuman animals to ethical treatment\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Cases and laws to know (Chapter 8)\u003c/h2>\n\u003cdiv class=\"two\">\n\u003cdiv>\u003cul>\n\u003cli>\u003cb>McKinsey study:\u003c/b> diverse firms more likely to beat their industry median; correlation ≠ causation\u003c/li>\n\u003cli>\u003cb>Google memo (2017):\u003c/b> engineer fired; NLRB (2018) said the firing was lawful\u003c/li>\n\u003cli>\u003cb>ADA (1990):\u003c/b> disability; reasonable accommodation; undue hardship\u003c/li>\n\u003cli>\u003cb>Verizon:\u003c/b> $20 million over a rigid attendance policy\u003c/li>\n\u003cli>\u003cb>Title VII (1964):\u003c/b> religion: no discrimination, harassment, retaliation; accommodation\u003c/li>\n\u003c/ul>\u003c/div>\n\u003cdiv>\u003cul>\n\u003cli>\u003cb>\u003ci>Welsh\u003c/i> (1970):\u003c/b> sincere nonreligious beliefs are protected\u003c/li>\n\u003cli>\u003cb>Abercrombie &amp; Fitch (2015):\u003c/b> can't refuse to hire to avoid accommodating a hijab\u003c/li>\n\u003cli>\u003cb>\u003ci>Bostock\u003c/i> (2020):\u003c/b> sex discrimination includes sexual orientation and gender identity\u003c/li>\n\u003cli>\u003cb>New Jersey (Diane B. Allen Act):\u003c/b> equal pay for substantially similar work\u003c/li>\n\u003cli>\u003cb>EU (2013):\u003c/b> ban on animal-tested cosmetics\u003c/li>\n\u003cli>\u003ci>Outside the book:\u003c/i> \u003cb>\u003ci>Groff\u003c/i> (2023)\u003c/b>: substantial increased costs\u003c/li>\n\u003c/ul>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Frameworks for Part C (review)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Framework\u003c/th>\u003cth>Ask yourself\u003c/th>\u003cth>Sentence starter\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Utilitarian\u003c/td>\u003ctd>Which choice produces the most good for the most people?\u003c/td>\u003ctd>\"From a utilitarian perspective, … outweighs…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Kantian / duty / rights\u003c/td>\u003ctd>Does this respect every person as an end, not just a means?\u003c/td>\u003ctd>\"A Kantian would object that… treats… merely as a means.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Virtue\u003c/td>\u003ctd>What would a person of good character do?\u003c/td>\u003ctd>\"A fair and honest manager would…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rawls / justice\u003c/td>\u003ctd>Which rule would I choose if I didn't know my position?\u003c/td>\u003ctd>\"Behind a veil of ignorance, I'd choose…, because I might be…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Stakeholder\u003c/td>\u003ctd>Who is affected, and how much?\u003c/td>\u003ctd>\"The stakeholder who loses most is…\"\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "summary": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 · Chapter 8 Summary\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;paddin u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Summary\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1>Chapter 8 Summary\u003c/h1>\n\u003cp class=\"lead\">Recognizing and Respecting the Rights of All · \u003ci>Business Ethics\u003c/i> (OpenStax), pp. 231–264 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-introduction\" target=\"_blank\" rel=\"noopener\">Read Chapter 8 online\u003c/a> · \u003cbutton class=\"btn noprint\" onclick=\"print()\">Print\u003c/button>\u003c/p>\n\n\u003csection>\n\u003ch2>The chapter in three sentences\u003c/h2>\n\u003cp>An ethical business respects the rights of everyone its decisions affect: employees of every background, ability, faith and sexual orientation, low-paid workers, and even animals. The law sets the minimum, but the book argues that good managers go further, because it is right and because it usually helps the business too. Being invited into a workplace is not the same as being included in it.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.1 · Diversity and Inclusion in the Workforce \u003cspan class=\"src\">(pp. 232–238 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-1-diversity-and-inclusion-in-the-workforce\" target=\"_blank\" rel=\"noopener\">online\u003c/a>)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Diversity\u003c/b> is the mix of people and perspectives. It now includes thinking styles, personality, abilities, age, experience and sexual orientation, not only race, gender and religion.\u003c/li>\n\u003cli>\u003cb>Inclusion\u003c/b> is \"the engagement of all employees in the corporate culture\". In Howard Ross's words, diversity is being invited to the party; inclusion is being asked to dance.\u003c/li>\n\u003cli>U.S. workforces have become more diverse since the Civil Rights Act of 1964, but progress is \"steady but very slow\". In the book's figures, women were 31% of Google's employees and 20% of its technical roles.\u003c/li>\n\u003cli>A McKinsey study found diverse companies were more likely to perform above their industry median (the \u003cb>diversity dividend\u003c/b>). But the book warns: \u003cb>correlation is not causation\u003c/b>.\u003c/li>\n\u003cli>Diversity brings challenges: some employees resist it (for example, the 2017 Google memo). Leaders can respond by changing meeting formats, rethinking rewards, mentoring and explaining the benefits.\u003c/li>\n\u003c/ul>\n\u003cp class=\"upd\">In February 2025, Google said it would stop setting diversity hiring targets, citing court decisions and U.S. executive orders. Several other U.S. companies also scaled back their programs; some, such as Costco and Delta, said they would keep theirs.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.2 · Accommodating Different Abilities and Faiths \u003cspan class=\"src\">(pp. 239–243 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-2-accommodating-different-abilities-and-faiths\" target=\"_blank\" rel=\"noopener\">online\u003c/a>)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>The \u003cb>ADA\u003c/b> (1990) protects people with disabilities. Employers must make \u003cb>reasonable accommodations\u003c/b> unless they cause \u003cb>undue hardship\u003c/b>. Employees don't need to use legal words to ask.\u003c/li>\n\u003cli>Verizon paid $20 million because its rigid attendance policy punished absences caused by disabilities.\u003c/li>\n\u003cli>\u003cb>Title VII\u003c/b> (1964) protects religious belief and nonbelief: no discrimination, harassment or retaliation, and reasonable accommodation (schedules, dress, prayer space, diet).\u003c/li>\n\u003cli>Sincere nontraditional beliefs are protected too (\u003ci>Welsh\u003c/i>, 1970).\u003c/li>\n\u003cli>Abercrombie &amp; Fitch (2015): a company may not refuse to hire someone, such as a woman wearing a hijab, to avoid accommodating her religious practice.\u003c/li>\n\u003c/ul>\n\u003cp class=\"upd\">In \u003ci>Groff v. DeJoy\u003c/i> (2023), the U.S. Supreme Court ruled that an employer can refuse a religious accommodation only if it would cause \"substantial increased costs\" for its business.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.3 · Sexual Identification and Orientation \u003cspan class=\"src\">(pp. 244–246 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-3-sexual-identification-and-orientation\" target=\"_blank\" rel=\"noopener\">online\u003c/a>)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>The online edition reports that in \u003ci>Bostock v. Clayton County\u003c/i> (2020) the Supreme Court held that discrimination at work based on sexual orientation or gender identity is sex discrimination under federal law. Many states also have their own protections.\u003c/li>\n\u003cli>The book argues for ethical leadership beyond the law: equal benefits for same-sex partners, and respect for employees who are still understanding their identity.\u003c/li>\n\u003cli>Companies' policies are rated by the Corporate Equality Index, and some states faced boycotts over anti-LGBTQ laws.\u003c/li>\n\u003c/ul>\n\u003cp class=\"src\">\u003cb>Note:\u003c/b> The online Chapter 8 Summary page and some older copies still say federal law gives no protection. The section text itself has been updated.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.4 · Income Inequalities \u003cspan class=\"src\">(pp. 247–251 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-4-income-inequalities\" target=\"_blank\" rel=\"noopener\">online\u003c/a>)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Income inequality\u003c/b> has grown sharply in the U.S. and the middle class, the \"engine of growth\", has shrunk (from almost 60% of households in 1970 to 47% in 2014).\u003c/li>\n\u003cli>The federal minimum wage is $7.25. Economists disagree about how much raising it would help, but businesses can choose to pay more, hire workers as employees with benefits rather than as independent contractors, and pay women and men equally.\u003c/li>\n\u003cli>Women are paid about 80% of what men are paid. New Jersey requires equal pay for \u003cb>substantially similar\u003c/b> work (federal law says \u003cb>equal\u003c/b> work). Minnesota evaluates state government jobs by their content, not their titles.\u003c/li>\n\u003c/ul>\n\u003cp class=\"upd\">The federal minimum wage is still $7.25 in 2026; about 30 states and Washington, D.C. set a higher one. The EU Pay Transparency Directive (2023) requires pay ranges before interviews, bans salary-history questions and requires larger employers to report gender pay gaps. EU countries had to adopt it by 7 June 2026.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>8.5 · Animal Rights and the Implications for Business \u003cspan class=\"src\">(from p. 252 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-5-animal-rights-and-the-implications-for-business\" target=\"_blank\" rel=\"noopener\">online\u003c/a>)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Animal rights\u003c/b> means the entitlement of nonhuman animals to ethical treatment. It affects agribusiness, medicine, cosmetics and the growing pet industry.\u003c/li>\n\u003cli>Philosopher Peter Singer argues that sentience (the ability to feel pain), not species, should guide how we treat animals.\u003c/li>\n\u003cli>The EU banned animal testing for cosmetics and the sale of animal-tested cosmetics in 2013; about forty nations have acted. Companies that want to sell there must change.\u003c/li>\n\u003cli>Consumer choices, such as buying cruelty-free products, push businesses to improve.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Key terms (book)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>animal rights\u003c/td>\u003ctd>the entitlement of nonhuman animals to ethical treatment\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>diversity dividend\u003c/td>\u003ctd>the financial benefit of improved performance resulting from a diverse workforce\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>inclusion\u003c/td>\u003ctd>the engagement of all employees in the corporate culture\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>income inequality\u003c/td>\u003ctd>the unequal distribution of income among the participants of an economy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>reasonable accommodation\u003c/td>\u003ctd>a change to a job or the work environment that lets an employee with a disability or other need do the job\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>undue hardship\u003c/td>\u003ctd>a difficulty or expense for the firm significant enough that reasonable accommodation may not be required\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"src\">Source: OpenStax, \u003ci>Business Ethics\u003c/i>, Chapter 8 key terms (some definitions slightly shortened). Updates come from outside sources and are labeled.\u003c/p>\n\u003c/section>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "worksheet": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Student Worksheet · Recognizing and Respecting the Rights of All\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex
