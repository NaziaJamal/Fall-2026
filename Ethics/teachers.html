one}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Teacher\u003c/span>\u003c/header>\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 7 Teacher Briefing\u003c/h1>\n\u003cp class=\"lead\">Everything you need to know to teach Chapter 7, in plain language. Simple meanings are in brackets after technical terms.\u003c/p>\n\n\u003csection>\n\u003ch2>The big picture\u003c/h2>\n\u003cp>Chapter 6 asked what companies owe workers. Chapter 7 asks the opposite: what workers owe companies. The chapter's message is that employees do owe real duties (hard work, loyalty, keeping secrets, honesty with money, respect), but loyalty should be a \u003cb>two-way street\u003c/b> [both sides owe each other]. The hardest moment is when loyalty to the company conflicts with the law or with conscience. That is the whistleblowing question in Class 2.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>7.1 · Loyalty to the company\u003c/h2>\n\u003ch3>The duty of loyalty\u003c/h3>\n\u003cp>In the U.S., most workers have no written contract. The relationship is governed by \u003cb>common law\u003c/b> [rules made by court decisions over time, not by a written law] called the \u003cb>law of agency\u003c/b> [rules for people who act on behalf of someone else]. In all fifty states this law gives employees a \u003cb>duty of loyalty\u003c/b> [you must not work against your employer's interests]. It means:\u003c/p>\n\u003cul>\u003cli>work \u003cb>in good faith\u003c/b> [honestly, with good intentions];\u003c/li>\u003cli>avoid \u003cb>conflicts of interest\u003c/b> [situations where your own gain could affect your work decisions], e.g., choosing a supplier because your relative works there;\u003c/li>\u003cli>no \u003cb>moonlighting\u003c/b> [a second job] that competes with the employer, unless the employer agrees. The book's example: a graphic designer at an ad agency running a web design business on weekends. Non-competing side work (wedding photography, catering) is usually fine.\u003c/li>\u003c/ul>\n\u003cp>People with more power or access to secrets owe a \u003cb>fiduciary duty\u003c/b> [a higher duty of trust, like a lawyer to a client]. Students met this term in Chapter 1.\u003c/p>\n\u003ch3>Why loyalty has changed\u003c/h3>\n\u003cp>Wharton professor \u003cb>Matthew Bidwell\u003c/b> says loyalty has two parts: (1) caring about the employer's interests and (2) staying with the employer. The book shows part 2 weakening: a Forbes HR survey found millennials three times more likely to change jobs, and about 91% don't expect to stay more than three years. Reasons the book gives:\u003c/p>\n\u003cul>\u003cli>\u003cb>At-will employment\u003c/b> [either side can end the job at any time for any legal reason]. The book says this mainly benefits the employer.\u003c/li>\u003cli>Leaders moving to whoever pays most: if the CEO does it, why shouldn't workers?\u003c/li>\u003cli>Retirement plans changed from \u003cb>defined-benefit plans\u003c/b> [pensions paid by the employer that reward long service] to \u003cb>defined-contribution plans\u003c/b> such as 401(k) [savings accounts the worker pays into, which go with them to the next job].\u003c/li>\u003cli>Pay: PayScale data say higher pay is a top reason people leave.\u003c/li>\u003c/ul>\n\u003cp>The book's box \"The Ties That Bind\" discusses \u003cb>retention bonuses\u003c/b> [money for agreeing to stay for a set time]. Glassdoor found that people who change jobs get on average more than a 5% raise.\u003c/p>\n\u003ch3>Confidentiality and contracts\u003c/h3>\n\u003cp>Employees handle secret information. Companies protect it with employment agreements:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Works for hire\u003c/b> [what you create at work belongs to the company] and \u003cb>patent assignment\u003c/b> [inventions made on the job belong to the company].\u003c/li>\n\u003cli>\u003cb>Trade secrets\u003c/b> [valuable information a company keeps secret: designs, marketing plans, research]. Protected mainly by secrecy and \u003cb>NDAs\u003c/b> [nondisclosure agreements: contracts to keep secrets], not by federal law.\u003c/li>\n\u003cli>\u003cb>Intellectual property\u003c/b> [ideas protected by \u003cb>patents\u003c/b> (inventions), \u003cb>copyrights\u003c/b> (creative work) or \u003cb>trademarks\u003c/b> (names, logos, slogans, and \u003cb>trade dress\u003c/b>, the look of a product or package)].\u003c/li>\n\u003cli>\u003cb>Non-compete agreement\u003c/b> [a promise not to work for a competitor during or after the job]. To be enforced, it is usually limited by time and distance. About 20% of U.S. private-sector workers have one, including about 1 in 6 people earning under $40,000.\u003c/li>\n\u003cli>\u003cb>Nonsolicitation clause\u003c/b> [don't take clients or coworkers with you]; \u003cb>nondisparagement clause\u003c/b> [don't damage the company's reputation].\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Jimmy John's (2016).\u003c/b> The sandwich chain made all workers promise not to work at any business selling sandwiches within two miles of any of its 2,500+ shops for two years. After an investigation by New York's attorney general (and a lawsuit by Illinois's), it agreed to stop. The point: non-competes for low-wage workers protect no real secrets; they mostly stop workers from leaving and keep wages down.\u003c/p>\n\u003cp>\u003cb>California\u003c/b> made most non-competes void in a 2017 law (the book's date).\u003c/p>\n\u003cp>\u003cb>Update (not in the book).\u003c/b> In April 2024 the \u003cb>FTC\u003c/b> [Federal Trade Commission, the U.S. agency that enforces fair competition] adopted a rule banning most non-competes. A Texas court set it aside in August 2024. On September 5, 2025, the FTC dropped its appeal, so the rule will never take effect. Non-competes are now mainly a matter of state law, and the FTC says it will challenge unfair ones case by case.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>7.2 · Loyalty to the brand and to customers\u003c/h2>\n\u003cp>A \u003cb>brand\u003c/b> [a product or service sold under a company's name] is valuable; \u003cb>branding\u003c/b> [building the brand's image] creates \u003cb>goodwill\u003c/b> [the value of a good reputation]. Some brand elements are legally owned, like Tiffany's blue color.\u003c/p>\n\u003cp>Employees can destroy that value fast on social media. The book's examples: a Taco Bell worker licking tacos, Domino's workers tampering with food on YouTube (fired and charged), a Burger King Japan worker lying on hamburger buns. The companies said the food was never served, but they still lost trust.\u003c/p>\n\u003cp>\u003cb>Internal marketing\u003c/b> [persuading employees to believe in the product] is the company's answer. McDonald's brand executive Colin Mitchell: employees are the people who make the brand real for customers. The book's main worry is not sabotage but \u003cb>slacking\u003c/b> [not trying].\u003c/p>\n\u003cp>\u003cb>Customers.\u003c/b> Employees are the first contact, so they owe customers respect. Two cases:\u003c/p>\n\u003cul>\u003cli>\u003cb>Kathy Fryman\u003c/b>, a school custodian in Kentucky for three decades, who treated students and teachers as her \"customers\" and cared for them far beyond her job.\u003c/li>\u003cli>\u003cb>Pizza Hut (Oklahoma franchise).\u003c/b> A server, Lockard, told her boss two regular customers made sexual comments. He made her serve them again; they physically abused her. A jury awarded her $360,000, and an appeals court upheld it. Lesson: good service does not mean accepting harassment, and employers must protect workers.\u003c/li>\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>7.3 · Contributing to a positive work atmosphere\u003c/h2>\n\u003cp>We spend a lot of time with coworkers, so the book asks for courtesy and respect. Disagreement is healthy, but argue about \u003cb>\"principles, not personalities.\"\u003c/b> Practical advice: keep an open mind, be kind, don't take credit for others' work, avoid sexual jokes, be civil to everyone, don't gossip on social media.\u003c/p>\n\u003cp>It discusses \u003cb>emotional intelligence\u003c/b> [understanding other people's emotions and managing your own], \u003cb>workplace personalities\u003c/b> [how people think and behave at work: some lead with logic, some with feeling] and \u003cb>work styles\u003c/b> [whether you prefer working alone or in teams, fast or collaboratively]. No type is better.\u003c/p>\n\u003cp>\u003cb>Workplace violence\u003c/b> has four types (from NIOSH [the U.S. National Institute for Occupational Safety and Health]): criminal intent (e.g., robbery), worker against worker, personal relationship (e.g., a partner coming to the workplace), and customer violence. Not used in this week's activities.\u003c/p>\n\u003cp>\u003cb>Codes of conduct\u003c/b> [a company's written rules for ethical behavior]: Table 7.1 covers obeying laws, gifts and bribes, conflicts of interest, company property, cybersecurity, social media, sexual harassment and respect. The book also mentions data breaches (Equifax, Sony) and the #MeToo movement.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>7.4 · Financial integrity\u003c/h2>\n\u003cp>\u003cb>Insider trading\u003c/b> [buying or selling shares using important information the public doesn't have yet]. It's illegal because it's cheating other investors. Three kinds of violator: insiders who trade, outsiders who trade on a tip, and the \"messenger\" who passes the tip on. Even \u003cb>temporary insiders\u003c/b> [bankers, lawyers, accountants, reporters who learn secrets through their work] count.\u003c/p>\n\u003cul>\u003cli>\u003cb>Texas Gulf Sulphur (1968):\u003c/b> employees who knew about a copper discovery secretly bought shares and had to return the profits.\u003c/li>\u003cli>\u003cb>Drexel Burnham Lambert (1980s):\u003c/b> Ivan Boesky bought takeover information from bankers Dennis Levine and Martin Siegel. Michael Milken paid about $1.1 billion and went to prison; the firm went bankrupt in 1990.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Bribe\u003c/b> [something of value given to get someone to break legal or ethical rules]. Gifts are a gray area: it depends on value, purpose, timing, who receives it and company policy. The book's example: accepting a gift card from a vendor, then choosing that vendor's more expensive copier. U.S. federal employees, for example, must report gifts from one source over $390 a year.\u003c/p>\n\u003cp>\u003cb>Foreign Corrupt Practices Act (FCPA, 1977)\u003c/b> [U.S. law that bans bribing foreign government officials to win or keep business]. It applies to U.S. companies and citizens anywhere in the world. Exception: \u003cb>facilitating or \"grease\" payments\u003c/b> [small payments to low-level officials to speed up routine tasks, not to win contracts]. Examples of fines: BHP Billiton and GlaxoSmithKline ($25 million each for Olympic tickets for officials), Telia ($965 million for bribery in Uzbekistan). Critics say the FCPA hurts U.S. firms; supporters say it levels the playing field. Other countries followed (UK Bribery Act 2010, OECD Convention 1997). \u003ci>Note:\u003c/i> the UK Bribery Act does not allow grease payments; useful for Gray Zone card 3.\u003c/p>\n\u003cp>\u003cb>Ethical leadership:\u003c/b> some choices are legal but unethical, e.g., using a rival's pricing information brought by a new hire (the book's \"What Would You Do?\" box, Gray Zone card 6).\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>7.5 · Criticism of the company and whistleblowing\u003c/h2>\n\u003ch3>Talking about pay\u003c/h3>\n\u003cp>\u003cb>Pay secrecy\u003c/b> [a rule that stops employees from discussing pay] was common. The \u003cb>National Labor Relations Act\u003c/b> (NLRA, 1935) [the main U.S. law on workers acting together] protects \u003cb>concerted activity\u003c/b> [two or more employees acting or talking together about pay, hours or conditions], for union and non-union workers, online too. Since 2012, most pay secrecy rules have been found unenforceable. A 2014 executive order banned them for federal contractors.\u003c/p>\n\u003ch3>Criticizing the employer online\u003c/h3>\n\u003cp>The \u003cb>First Amendment\u003c/b> [free speech in the U.S. Constitution] limits the government, not private employers. So an at-will employee can usually be fired for criticizing the company, unless the firing breaks a specific law (e.g., discrimination law). \u003cb>Adrian Duane\u003c/b> posted an angry Glassdoor review about IXL Learning and was fired. A labor judge said the post was personal, not concerted activity, so it was not protected. Summary: criticism about pay and conditions, made with coworkers, may be protected; personal attacks and false posts are not.\u003c/p>\n\u003ch3>Whistleblowing\u003c/h3>\n\u003cp>\u003cb>Whistleblowing\u003c/b> [going to a government agency to report that your employer broke the law]. Risks: career damage, no promotion, resentment, \u003cb>blacklisting\u003c/b> [other employers won't hire you], \u003cb>retaliation\u003c/b> [punishment for reporting].\u003c/p>\n\u003cp>The book's ethical guidance (the \"five tests\" in class): good motive, not revenge; internal channels first, usually; hard evidence; a serious violation; a realistic chance of stopping it.\u003c/p>\n\u003cp>\u003cb>Legal protection\u003c/b> exists only under specific laws, starting with the \u003cb>Occupational Safety and Health Act of 1970\u003c/b>; now more than twenty federal laws, including environmental ones.\u003c/p>\n\u003cp>\u003cb>Rewards.\u003c/b> The \u003cb>False Claims Act\u003c/b> (1863) [a Civil War law against cheating the government] has a \u003cb>qui tam\u003c/b> provision [a private person, called a \u003cb>relator\u003c/b>, can sue on the government's behalf and share the money]: 15–25% if the government joins the case, 25–30% if it doesn't. Programs at the IRS, SEC and CFTC also pay rewards. Examples: Birkenfeld ($104 million from the IRS, 2012, but he also went to prison), ten Pfizer employees ($102 million; Kopchinski got $50 million), two HCA employees ($100 million).\u003c/p>\n\u003cp>\u003cb>Watkins (Enron).\u003c/b> She warned Ken Lay, who ignored her, then went to the press instead of the \u003cb>SEC\u003c/b> [Securities and Exchange Commission, which regulates financial markets], so she had no legal protection. Her case helped lead to the \u003cb>Sarbanes-Oxley Act\u003c/b> [a 2002 law on corporate accounting that also protects employees who report fraud].\u003c/p>\n\u003cp>\u003cb>Krawcheck (Merrill Lynch).\u003c/b> She found a \"safe\" retirement fund had lost money for ordinary investors, mostly Walmart workers. She persuaded Bank of America's CEO to pay them back and was later pushed out.\u003c/p>\n\u003cp>\u003cb>Defense contractor box.\u003c/b> The book ends with a dilemma: an engineer discovers the firm is overcharging the Department of Defense after a low bid; reporting it could bankrupt the firm and hurt friends.\u003c/p>\n\u003ch3>Outside sources used in class\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>SEC program, FY2025:\u003c/b> about $60 million to 48 whistleblowers, about 27,000 tips; FY2024 was $255 million.\u003c/li>\n\u003cli>\u003cb>EU Directive 2019/1937:\u003c/b> three protected routes (internal, regulator, public); organizations with 50+ workers must have an internal channel.\u003c/li>\n\u003cli>\u003cb>Japan:\u003c/b> the 2025 amendment adds criminal penalties for retaliation (up to six months in prison for individuals; company fines up to ¥30 million) and protects freelancers. It takes effect December 1, 2026.\u003c/li>\n\u003cli>\u003cb>Sam Salehpour (Boeing, 2024):\u003c/b> a quality engineer who said 787 and 777 assembly took shortcuts, testified to the Senate, and said he faced retaliation. Boeing rejected the claims; the FAA investigated.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Likely student questions\u003c/h2>\n\u003cdl>\n\u003cdt>\u003cb>\"In my country, nobody reports their company to the government. Isn't that just disloyal?\"\u003c/b>\u003c/dt>\u003cdd>Accept this as a real view. Ask: \"Loyal to whom: the managers, the company, the coworkers, the customers?\" Point to the EU and Japan, which are making internal and external reporting safer, and to the book's view that whistleblowers serve the public interest.\u003c/dd>\n\u003cdt>\u003cb>\"Isn't a reward like $50 million a bribe to betray your company?\"\u003c/b>\u003c/dt>\u003cdd>Good question for the debate. The reward is for information about illegal conduct, paid by the government after penalties are collected. Utilitarians may defend it; virtue ethicists may worry about motive (the book's first test).\u003c/dd>\n\u003cdt>\u003cb>\"Is Corvane real?\"\u003c/b>\u003c/dt>\u003cdd>No. Corvane, Ari, Dana and FlowSure are invented. The FDA [Food and Drug Administration, which regulates medical devices in the U.S.] is real.\u003c/dd>\n\u003cdt>\u003cb>\"Can a contract stop me from reporting a crime?\"\u003c/b>\u003c/dt>\u003cdd>Generally, no. For example, SEC Rule 21F-17 forbids using confidentiality agreements to stop people from contacting the SEC. Keep it general: \"A contract can't make a crime secret.\"\u003c/dd>\n\u003c/dl>\n\u003c/section>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "summary": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 7 · Chapter 7 Summary\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.sec{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}\n.sec a{font-size:14px}\n.big{font-size:17px}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Summary\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1>Chapter 7 Summary: What Employees Owe Employers\u003c/h1>\n\u003cp class=\"lead\">\u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 7, from p. 195 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-introduction\" target=\"_blank\" rel=\"noopener\">Open Chapter 7 online\u003c/a>\u003c/p>\n\u003cp class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\u003c/p>\n\n\u003csection>\n\u003ch2>The chapter in one paragraph\u003c/h2>\n\u003cp class=\"big\">Chapter 6 looked at what employers owe employees. Chapter 7 looks at the other side. Employees owe their employers hard work, loyalty, confidentiality, respect for the brand and customers, a positive attitude toward coworkers, and honesty with money. But the book argues that loyalty must be a \u003cb>two-way street\u003c/b>: companies earn loyalty by how they treat people. Employees may criticize their employer in some situations, and when the company breaks the law, they may become \u003cb>whistleblowers\u003c/b>, which can be both protected and risky.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.1 · Loyalty to the company\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\" target=\"_blank\" rel=\"noopener\">Read 7.1 (pp. 196–202)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>In the U.S., employees have a \u003cb>duty of loyalty\u003c/b>: they must not act against their employer's interests. They should work in good faith, avoid \u003cb>conflicts of interest\u003c/b>, and not take a competing second job (\u003cb>moonlighting\u003c/b>) without permission. People with more authority owe a higher \u003cb>fiduciary duty\u003c/b>.\u003c/li>\n\u003cli>Professor Matthew Bidwell says loyalty has two parts: caring about the employer's interests, and staying with the employer. The second part has weakened: younger workers change jobs much more often.\u003c/li>\n\u003cli>Reasons include \u003cb>at-will employment\u003c/b> (either side can end the job at any time), leaders who move for more money, retirement plans that move with the worker, and better pay elsewhere. The book says employers must also earn loyalty.\u003c/li>\n\u003cli>Employees must protect \u003cb>confidential\u003c/b> information. Companies use \u003cb>trade secrets\u003c/b>, \u003cb>nondisclosure agreements\u003c/b>, patents, copyrights and trademarks to protect their ideas.\u003c/li>\n\u003cli>\u003cb>Non-compete agreements\u003c/b> stop people from working for competitors. They are controversial, especially for low-wage workers: Jimmy John's agreed in 2016 to stop using them for sandwich makers, and California makes most of them void. Contracts may also include \u003cb>nonsolicitation\u003c/b> and \u003cb>nondisparagement\u003c/b> clauses.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.2 · Loyalty to the brand and to customers\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-2-loyalty-to-the-brand-and-to-customers\" target=\"_blank\" rel=\"noopener\">Read 7.2 (pp. 203–206)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>A \u003cb>brand\u003c/b> is valuable, and employees can protect it or damage it. Employees at Taco Bell, Domino's and Burger King Japan hurt their companies with videos and photos online.\u003c/li>\n\u003cli>Companies use \u003cb>internal marketing\u003c/b> to help employees believe in the product.\u003c/li>\n\u003cli>Employees owe customers respect and good service. A school custodian, Kathy Fryman, is the book's example of going far beyond the job.\u003c/li>\n\u003cli>But good service does not mean accepting harassment. In a Pizza Hut case, a jury awarded $360,000 to a server whose manager made her serve customers who harassed her.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.3 · Contributing to a positive work atmosphere\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-3-contributing-to-a-positive-work-atmosphere\" target=\"_blank\" rel=\"noopener\">Read 7.3 (pp. 207–211)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>Employees should treat coworkers with courtesy and respect, and disagree about \u003cb>\"principles, not personalities.\"\u003c/b>\u003c/li>\n\u003cli>People have different \u003cb>work styles\u003c/b> and \u003cb>workplace personalities\u003c/b>; understanding them helps teams work well.\u003c/li>\n\u003cli>The book describes four types of \u003cb>workplace violence\u003c/b>: criminal intent, worker against worker, personal relationships, and customers.\u003c/li>\n\u003cli>Companies write \u003cb>codes of conduct\u003c/b> about laws, gifts, conflicts of interest, company property, cybersecurity, social media and harassment.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.4 · Financial integrity\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-4-financial-integrity\" target=\"_blank\" rel=\"noopener\">Read 7.4 (pp. 212–217)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Insider trading\u003c/b> means trading shares using important information the public doesn't have. It is illegal for insiders, for outsiders who receive a tip, and for the person who passes the tip on. Examples: Texas Gulf Sulphur and Drexel Burnham Lambert.\u003c/li>\n\u003cli>A \u003cb>bribe\u003c/b> is something of value given to get someone to break the rules. Gifts can be a gray area; it depends on value, purpose, timing and company policy.\u003c/li>\n\u003cli>The \u003cb>Foreign Corrupt Practices Act (FCPA)\u003c/b> bans U.S. companies and citizens from bribing foreign officials. It allows small \u003cb>\"grease\" payments\u003c/b> for routine tasks. Companies such as Telia have paid large fines.\u003c/li>\n\u003cli>Some actions are legal but still unethical. Ethical leaders think about more than the law.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.5 · Criticism of the company and whistleblowing\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">Read 7.5 (p. 218 onward)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Pay secrecy:\u003c/b> under the National Labor Relations Act, employees may usually talk together about pay, hours and working conditions (\u003cb>concerted activity\u003c/b>). Most rules against discussing pay are unenforceable.\u003c/li>\n\u003cli>\u003cb>Criticism online:\u003c/b> free speech rights limit the government, not private employers. Purely personal criticism (like Adrian Duane's review of his manager) is usually not protected.\u003c/li>\n\u003cli>\u003cb>Whistleblowing\u003c/b> means reporting your employer's illegal conduct to a government agency. Whistleblowers can lose their careers or face \u003cb>retaliation\u003c/b>.\u003c/li>\n\u003cli>The book's advice: act from a good motive, usually try \u003cb>internal channels\u003c/b> first, have \u003cb>hard evidence\u003c/b>, and report \u003cb>serious\u003c/b> problems that can realistically be stopped.\u003c/li>\n\u003cli>U.S. legal protection comes from \u003cb>specific laws\u003c/b>, starting with OSHA (1970). The \u003cb>False Claims Act\u003c/b> lets whistleblowers share in money recovered (\u003cb>qui tam\u003c/b>). Some received very large rewards (Birkenfeld, Kopchinski).\u003c/li>\n\u003cli>Two stories show the cost: \u003cb>Sherron Watkins\u003c/b> (Enron) went to the press, not the SEC, and had no legal protection. \u003cb>Sallie Krawcheck\u003c/b> (Merrill Lynch) got investors repaid and later lost her job.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Key terms\u003c/h2>\n\u003cdiv class=\"phr\">\u003cspan>duty of loyalty\u003c/span>\u003cspan>conflict of interest\u003c/span>\u003cspan>moonlighting\u003c/span>\u003cspan>fiduciary duty\u003c/span>\u003cspan>at-will employment\u003c/span>\u003cspan>confidentiality\u003c/span>\u003cspan>trade secret\u003c/span>\u003cspan>intellectual property\u003c/span>\u003cspan>non-compete agreement\u003c/span>\u003cspan>nonsolicitation\u003c/span>\u003cspan>nondisparagement\u003c/span>\u003cspan>brand\u003c/span>\u003cspan>internal marketing\u003c/span>\u003cspan>code of conduct\u003c/span>\u003cspan>insider trading\u003c/span>\u003cspan>bribe\u003c/span>\u003cspan>FCPA\u003c/span>\u003cspan>grease payment\u003c/span>\u003cspan>pay secrecy\u003c/span>\u003cspan>concerted activity\u003c/span>\u003cspan>whistleblowing\u003c/span>\u003cspan>retaliation\u003c/span>\u003cspan>qui tam\u003c/span>\u003c/div>\n\u003cp class=\"src\">Full list with definitions: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-key-terms\" target=\"_blank\" rel=\"noopener\">Chapter 7 key terms\u003c/a> · The book's own summary: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-summary\" target=\"_blank\" rel=\"noopener\">Chapter 7 summary\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Updates since the book (outside sources)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Non-competes:\u003c/b> the U.S. Federal Trade Commission's 2024 national ban never took effect. The FTC dropped its appeal in September 2025, so state law now decides.\u003c/li>\n\u003cli>\u003cb>Whistleblower rewards:\u003c/b> in fiscal year 2025, the SEC paid about $60 million to 48 whistleblowers.\u003c/li>\n\u003cli>\u003cb>Around the world:\u003c/b> the EU Whistleblower Directive (2019) protects reporting inside the company, to a regulator, or to the public. Japan's amended law adds criminal penalties for retaliation from December 1, 2026.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003cp class=\"src\">Textbook: Byars & Stanberry, \u003ci>Business Ethics\u003c/i>, OpenStax (CC BY 4.0). Summary written for this course.\u003c/p>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "slides": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 7 Slides · What Employees Owe Employers\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0d2747;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}\n.deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n.s{display:none;position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#fff;color:#1d2433;padding:4.2% 5.5% 6%;overflow:hidden;font-size:min(2.15vw,3.8vh)}\n.s.on{display:flex;flex-direction:column}\n.s h2{font-size:2.05em;color:var(--navy);margin:0 0 .45em;line-height:1.15;border-bottom:.12em solid var(--gold);padding-bottom:.18em}\n.s .k{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--dgold);font-weight:700;margin-bottom:.25em}\n.s p,.s li{line-height:1.35;margin:.25em 0}\n.s ul,.s ol{margin:.2em 0 .2em 1.2em;padding:0}\n.s .sm{font-size:.82em}.s .xs{font-size:.68em;color:#5b6577}\n.s .two{display:grid;grid-template-columns:1fr 1fr;gap:4%;flex:1;min-height:0}\n.s .box{background:var(--sky3);border-left:.25em solid var(--navy);border-radius:.4em;padding:.6em .8em}\n.s .box.g{border-color:var(--gold);background:#fbf6e8}\n.s table{border-collapse:collapse;width:100%;font-size:.8em}\n.s th,.s td{border:1px solid var(--sky);padding:.28em .5em;text-align:left;vertical-align:top}\n.s th{background:var(--navy);color:#fff}\n.s td:first-child{white-space:nowrap}\n.s.dark{background:var(--navy);color:#fff}\n.s.dark h2{color:#fff}\n.s.title{background:var(--navy);color:#fff;justify-content:center;align-items:flex-start}\n.s.title img{width:7.5em;margin-bottom:1em;border-radius:.4em}\n.s.title h1{font-size:2.8em;margin:0;color:#fff}\n.s.title p{color:var(--sky);font-size:1.2em}\n.s.title .q{color:var(--gold);font-size:1.6em;font-weight:700;margin-top:.6em}\n.foot{position:absolute;left:5.5%;right:5.5%;bottom:2.2%;display:flex;align-items:center;gap:.6em;font-size:.6em;color:#5b6577}\n.s.dark .foot,.s.title .foot{color:var(--sky)}\n.foot img{height:1.9em;border-radius:.2em}\n.foot .n{margin-left:auto}\n.timer{position:absolute;right:5.5%;top:4.2%;display:flex;align-items:center;gap:.4em;font-size:.8em}\n.timer b{font-variant-numeric:tabular-nums;font-size:1.5em;color:var(--navy);min-width:3.2em;text-align:right}\n.s.dark .timer b{color:#fff}\n.timer button{font:inherit;font-size:.8em;border:0;border-radius:.3em;background:var(--gold);color:var(--navy);padding:.2em .6em;cursor:pointer;font-weight:700}\n.timer.done b{color:#c0392b}\n.big{font-size:1.25em}\n.tally{display:grid;grid-template-columns:repeat(6,1fr);gap:.4em;margin-top:.4em}\n.tally div{border:2px solid var(--sky);border-radius:.4em;text-align:center;padding:.4em .2em;font-size:.8em}\n.tally div b{display:block;font-size:2em;color:var(--navy);min-height:1.2em}\n.ladder{display:flex;flex-direction:column-reverse;gap:.25em}\n.ladder div{background:var(--sky2);border-radius:.3em;padding:.25em .6em;font-size:.85em}\n.ladder div:nth-child(5){background:#fbf6e8;border:2px solid var(--gold);font-weight:700}\n.nav{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;opacity:.35;transition:opacity .2s}\n.nav:hover{opacity:1}\n.nav button{font:14px sans-serif;border:0;border-radius:6px;padding:6px 10px;background:#fff;color:var(--navy);cursor:pointer}\n@media print{html,body{overflow:visible;height:auto;background:#fff}.deck{position:static;display:block}.s{display:flex!important;flex-direction:column;width:100%;height:auto;aspect-ratio:16/9;page-break-after:always;font-size:17pt;border:1px solid #ccc}.nav,.timer button{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"deck\" id=\"deck\">\n\n\u003cdiv class=\"s title\">\u003cimg src=\"logo.png\" alt=\"Approach logo\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Ethics in a Global World · Week 7\u003c/div>\u003ch1>What Employees Owe Employers\u003c/h1>\u003cp>Chapter 7 · \u003ci>Business Ethics\u003c/i> (OpenStax), pp. 195–230\u003c/p>\u003cdiv class=\"q\">Loyal to whom?\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Today\u003c/div>\u003ch2>Two classes, one question\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Class 1 · What do you owe? (9:00–10:40)\u003c/b>\u003col class=\"sm\">\u003cli>Loyal or not?\u003c/li>\u003cli>Loyalty is a two-way street\u003c/li>\u003cli>Paired reading\u003c/li>\u003cli>Clause Clinic\u003c/li>\u003cli>Gray Zone\u003c/li>\u003cli>A problem at Corvane…\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Class 2 · When loyalty and conscience collide (11:10–12:50)\u003c/b>\u003col class=\"sm\">\u003cli>The price of speaking up\u003c/li>\u003cli>The whistleblower's ladder\u003c/li>\u003cli>Case files\u003c/li>\u003cli>Debate\u003c/li>\u003cli>Rights or responsibilities?\u003c/li>\u003cli>My red lines\u003c/li>\u003c/ol>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"12\">\u003cdiv class=\"k\">Engage\u003c/div>\u003ch2>Loyal or not?\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"big\">Stand on the line.\u003c/p>\u003cp>\u003cb>FINE\u003c/b> ←————————→ \u003cb>DISLOYAL\u003c/b>\u003c/p>\u003cp>Tell the person next to you \u003cb>why\u003c/b> you are standing there.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003cp class=\"sm\">\u003cb>Useful language\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>It depends on whether…\u003c/li>\u003cli>That's only disloyal if…\u003c/li>\u003cli>I'd draw the line at…\u003c/li>\u003cli>In my field, that would be seen as…\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Engage · Six situations\u003c/div>\u003ch2>Where do you stand?\u003c/h2>\n\u003col type=\"a\">\u003cli>You apply for other jobs during your lunch break.\u003c/li>\u003cli>You start a weekend web design business. Your day job: graphic designer at an ad agency.\u003c/li>\u003cli>When you leave, you take your list of client contacts.\u003c/li>\u003cli>You tell three coworkers how much you earn.\u003c/li>\u003cli>You accept two free concert tickets from a supplier you buy from.\u003c/li>\u003cli>You post a joke about your boss online. You don't name the company.\u003c/li>\u003c/ol>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · 7.1, p. 196 onward\u003c/div>\u003ch2>The duty of loyalty\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cul>\u003cli>In all 50 U.S. states, employees must \u003cb>not act against the employer's interests\u003c/b>.\u003c/li>\u003cli>Work in \u003cb>good faith\u003c/b>. Avoid \u003cb>conflicts of interest\u003c/b>.\u003c/li>\u003cli>No competing \u003cb>second job\u003c/b> without consent.\u003c/li>\u003cli>More trust and authority → a higher \u003cb>fiduciary duty\u003c/b>.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box\">\u003cp>\u003cb>Two parts of loyalty\u003c/b> (Matthew Bidwell, Wharton)\u003c/p>\u003col>\u003cli>Having the employer's interests at heart\u003c/li>\u003cli>Staying with the same employer\u003c/li>\u003c/ol>\u003cp class=\"sm\">Book: millennials are 3× more likely to change jobs; about 91% don't expect to stay more than 3 years.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Study\u003c/div>\u003ch2>Loyalty is a two-way street\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>\u003cb>At-will employment:\u003c/b> either side can end the job at any time, for any legal reason. The book says this usually favors the employer.\u003c/p>\u003cp>So what do employees still owe?\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>Loyalty map · pairs\u003c/b>\u003c/p>\u003col class=\"sm\">\u003cli>How long should someone stay to be seen as loyal?\u003c/li>\u003cli>Is it disloyal to look for a new job while employed? Would you tell your manager?\u003c/li>\u003cli>What did an employer do that earned (or lost) your loyalty?\u003c/li>\u003c/ol>\u003cp class=\"xs\">Worksheet Part 2 · speak from workplaces you know\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"11\">\u003cdiv class=\"k\">Study · Paired reading\u003c/div>\u003ch2>Loyalty vs. whistleblowing\u003c/h2>\n\u003cp>\u003cb>Predict:\u003c/b> Can a person be loyal \u003ci>and\u003c/i> a whistleblower?\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Partner A · Loyalty\u003c/b>\u003cp class=\"sm\">7.1, pp. 196–202: duty of loyalty, changing loyalty, confidentiality, non-competes\u003c/p>\u003cp class=\"xs\">Worksheet: Reading A + questions A1–A4\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Partner B · Whistleblowing\u003c/b>\u003cp class=\"sm\">7.5, from p. 218: risks, the book's advice, legal protection, rewards, Watkins, Krawcheck\u003c/p>\u003cp class=\"xs\">Worksheet: Reading B + questions B1–B4\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"sm\">Last 3 minutes: As meet As, Bs meet Bs to check answers.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"9\">\u003cdiv class=\"k\">Study · Teach your partner\u003c/div>\u003ch2>Teach, listen, question\u003c/h2>\n\u003col>\u003cli>\u003cb>A teaches\u003c/b> (4 min). B fills the table and asks one \u003ci>Why?\u003c/i> or \u003ci>What if?\u003c/i>\u003c/li>\u003cli>\u003cb>B teaches\u003c/b> (4 min). A fills the table and asks one question.\u003c/li>\u003cli>\u003cb>Agree\u003c/b> (1 min): Can a person be loyal and a whistleblower?\u003c/li>\u003c/ol>\n\u003cdiv class=\"box\">\u003cp class=\"sm\">The main point of my section is… · According to the book (p. ___)… · An example the book gives is… · So would you say that…?\u003c/p>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"15\">\u003cdiv class=\"k\">Activate\u003c/div>\u003ch2>Clause Clinic\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>Corvane Medical makes infusion pumps (fictional company).\u003c/p>\u003cp>Negotiate its employment contract for \u003cb>one\u003c/b> person:\u003c/p>\u003cul class=\"sm\">\u003cli>\u003cb>A\u003c/b> Assembly-line technician, $38,000\u003c/li>\u003cli>\u003cb>B\u003c/b> Senior research engineer\u003c/li>\u003cli>\u003cb>C\u003c/b> Vice president of sales\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>Groups of 4\u003c/b>: 2 employee side, 2 HR side\u003c/p>\u003col class=\"sm\">\u003cli>For each clause: keep, change or delete\u003c/li>\u003cli>Agree on every clause\u003c/li>\u003cli>Rewrite at least one clause\u003c/li>\u003c/ol>\u003cp class=\"sm\">We could accept it if it were limited to… · What's the business reason for…? · Let's meet in the middle…\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Activate · Rawls test\u003c/div>\u003ch2>Behind the veil of ignorance\u003c/h2>\n\u003cp class=\"big\">You don't know if you will be the \u003cb>technician\u003c/b>, the \u003cb>engineer\u003c/b> or the \u003cb>VP\u003c/b>.\u003c/p>\u003cp class=\"big\">Would you still sign your version?\u003c/p>\u003cp>Then report: \u003ci>\"For [role], we ___ because ___.\"\u003c/i>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">The real world\u003c/div>\u003ch2>Non-competes: what actually happens\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cp>\u003cb>From the book (7.1)\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>About 20% of U.S. private-sector workers have one.\u003c/li>\u003cli>Jimmy John's: no sandwich-shop job within 2 miles of any shop, for 2 years. After a New York investigation, it agreed in 2016 to stop.\u003c/li>\u003cli>California makes most non-competes void.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>Update (outside sources)\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>2024: the FTC adopted a rule banning most non-competes nationwide.\u003c/li>\u003cli>Courts blocked it. On Sept. 5, 2025, the FTC dropped its appeal, so the rule will never take effect.\u003c/li>\u003cli>Today it depends on \u003cb>state law\u003c/b>; the FTC says it will act case by case.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"14\">\u003cdiv class=\"k\">Activate · Speed rounds\u003c/div>\u003ch2>Gray Zone\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>Two lines face each other.\u003c/li>\u003cli>Two cards per round, 3.5 minutes.\u003c/li>\u003cli>Decide: \u003cb>OK / Not OK / It depends\u003c/b>.\u003c/li>\u003cli>Name the rule or concept (7.2, 7.4, 7.5).\u003c/li>\u003cli>One line moves one place left.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box\">\u003cp class=\"sm\">That crosses the line because… · Legally it may be OK, but ethically… · This is a conflict of interest since… · It depends on the company's policy and…\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s dark\" data-min=\"4\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Corvane, Part 1 · fictional\u003c/div>\u003ch2>A problem at Corvane\u003c/h2>\n\u003cp class=\"sm\">Ari Moreno has been a quality engineer at Corvane Medical for six years. Corvane paid for Ari's master's degree. The new infusion pump, FlowSure 2, goes to a large hospital group in three weeks: the company's biggest contract ever.\u003c/p>\n\u003cp class=\"sm\">Ari finds that one safety test was changed. The original data showed that in about \u003cb>1 in 400 tests\u003c/b> the pump gave a higher dose than set. The submitted data show no errors. Ari's manager, \u003cb>Dana\u003c/b>, approved the change.\u003c/p>\n\u003cp class=\"sm\">\u003cb>Exit ticket:\u003c/b> Ari's first move? \u003cb>A\u003c/b> say nothing and keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> the regulator (FDA) · \u003cb>F\u003c/b> a journalist. One reason.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Class 2 · Welcome back\u003c/div>\u003ch2>What should Ari do first? Your votes\u003c/h2>\n\u003cdiv class=\"tally\">\u003cdiv>A\u003cbr>say nothing\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>B\u003cbr>Dana\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>C\u003cbr>Dana's boss\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>D\u003cbr>hotline\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>E\u003cbr>regulator\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>F\u003cbr>journalist\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Teacher: click a box to type the count.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"5\">\u003cdiv class=\"k\">Engage · 7.5\u003c/div>\u003ch2>The price of speaking up\u003c/h2>\n\u003cp>Match each person to what happened. (Worksheet Part 7)\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cul>\u003cli>Bradley Birkenfeld (UBS)\u003c/li>\u003cli>John Kopchinski (Pfizer)\u003c/li>\u003cli>Sherron Watkins (Enron)\u003c/li>\u003cli>Sallie Krawcheck (Merrill Lynch)\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cul class=\"sm\">\u003cli>Received about $50 million\u003c/li>\u003cli>Received $104 million AND went to prison\u003c/li>\u003cli>Persuaded the CEO to repay investors, then was \"reorganized out\"\u003c/li>\u003cli>No whistleblower protection; never worked in corporate America again\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · 7.5\u003c/div>\u003ch2>What is whistleblowing?\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"big\">Going to a \u003cb>government agency\u003c/b> to report your employer's \u003cb>legal violation\u003c/b>.\u003c/p>\u003cp class=\"sm\">Complaining to your boss is not whistleblowing in the book's sense.\u003c/p>\u003c/div>\n\u003cdiv>\u003cp class=\"sm\">\u003cb>The ladder\u003c/b>\u003c/p>\u003cdiv class=\"ladder\">\u003cdiv>1 · Fix it yourself\u003c/div>\u003cdiv>2 · Your manager\u003c/div>\u003cdiv>3 · Your manager's boss\u003c/div>\u003cdiv>4 · Compliance office / ethics hotline\u003c/div>\u003cdiv>5 · Regulator (government agency)\u003c/div>\u003cdiv>6 · Media\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · the book's advice\u003c/div>\u003ch2>Five tests for responsible whistleblowing\u003c/h2>\n\u003col class=\"big\">\u003cli>Good \u003cb>motive\u003c/b>: to stop wrongdoing or protect victims, not revenge\u003c/li>\u003cli>\u003cb>Internal channels\u003c/b> first, usually\u003c/li>\u003cli>\u003cb>Hard evidence\u003c/b>\u003c/li>\u003cli>A \u003cb>serious\u003c/b> violation\u003c/li>\u003cli>Reporting could \u003cb>realistically stop\u003c/b> it\u003c/li>\u003c/ol>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"4\">\u003cdiv class=\"k\">Study · protection around the world\u003c/div>\u003ch2>Who protects the whistleblower?\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Where\u003c/th>\u003cth>What\u003c/th>\u003cth>Source\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>U.S.\u003c/td>\u003ctd>Protection only under specific laws (OSHA 1970 among the first; 20+ federal laws). False Claims Act \u003ci>qui tam\u003c/i>: 15–25% of the recovery, 25–30% if the government doesn't join.\u003c/td>\u003ctd>Book, 7.5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>U.S. SEC\u003c/td>\u003ctd>FY2025: about $60 million to 48 whistleblowers; about 27,000 tips\u003c/td>\u003ctd>SEC report, Feb. 2026\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>Directive (2019): three routes protected: internal, regulator, public. Internal first is encouraged, not required.\u003c/td>\u003ctd>Directive 2019/1937\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Japan\u003c/td>\u003ctd>New criminal penalties for retaliation; company fines up to ¥30 million. In force \u003cb>December 1, 2026\u003c/b>.\u003c/td>\u003ctd>2025 amendment\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sm\">\u003cb>Pairs:\u003c/b> Watkins told Ken Lay, then the press. Which step did she skip? Why did it matter?\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"20\">\u003cdiv class=\"k\">Study · jigsaw\u003c/div>\u003ch2>Case files\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>\u003cb>Read\u003c/b> your case (6 min)\u003c/li>\u003cli>\u003cb>Teach\u003c/b> your group (8 min)\u003c/li>\u003cli>\u003cb>Score\u003c/b> all three on the five tests (6 min)\u003c/li>\u003c/ol>\u003cp class=\"sm\">Write one sentence per case:\u003cbr>\u003ci>\"If ___ had ___, ___ would have ___.\"\u003c/i>\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003cp>\u003cb>A\u003c/b> Sherron Watkins · Enron \u003cspan class=\"xs\">(book)\u003c/span>\u003c/p>\u003cp>\u003cb>B\u003c/b> Sallie Krawcheck · Merrill Lynch \u003cspan class=\"xs\">(book)\u003c/span>\u003c/p>\u003cp>\u003cb>C\u003c/b> Sam Salehpour · Boeing, 2024 \u003cspan class=\"xs\">(news reports)\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s dark\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Corvane, Part 2 · fictional\u003c/div>\u003ch2>Ari tried. Now what?\u003c/h2>\n\u003cp class=\"sm\">Dana: \"The error happened only in the old test setup. Engineering is fixing the software for the next batch. If we delay, we lose the contract and maybe 200 jobs. Trust me.\"\u003c/p>\n\u003cp class=\"sm\">Ari used the ethics hotline. Compliance \"opened a review\": \u003cb>6–8 weeks\u003c/b>. The first pumps reach hospitals in \u003cb>2 weeks\u003c/b>. Ari is no longer invited to the weekly product meeting.\u003c/p>\n\u003cdiv class=\"box g\" style=\"color:#1d2433\">\u003cb>Motion:\u003c/b> Ari should report the altered test data to the regulator now, before Corvane's internal review is finished.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"38\">\u003cdiv class=\"k\">Activate · Debate\u003c/div>\u003ch2>Run of show\u003c/h2>\n\u003ctable class=\"sm\">\u003ctr>\u003cth>Min\u003c/th>\u003cth>Step\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Read Part 2; roles: Proposition · Opposition · Judges (patient advocate, CFO, coworker, hospital buyer)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Prepare: 3 arguments, 2+ frameworks; predict their best point\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Opening statements: 2 min each (Proposition first)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 + 3\u003c/td>\u003ctd>Rebuttal huddle → rebuttals, 90 sec each: \"Our opponents argued that… However, …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Judges' questions\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Closing, 1 min each, with one concession: \"We accept that…, but…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 + 5\u003c/td>\u003ctd>Judges deliberate in public → verdict → debrief\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Activate · team race\u003c/div>\u003ch2>Rights or responsibilities?\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>Sort 12 cards into three columns:\u003c/p>\u003cul>\u003cli>\u003cb>Employee's right\u003c/b>\u003c/li>\u003cli>\u003cb>Employee's responsibility\u003c/b>\u003c/li>\u003cli>\u003cb>Both / depends\u003c/b>\u003c/li>\u003c/ul>\u003cp class=\"sm\">Say one key term for each card.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>Swap and check another team.\u003c/p>\u003cp class=\"sm\">1 point per correct card. +1 for explaining a \"Both\" card.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"11\">\u003cdiv class=\"k\">Activate · Personal Code of Ethics seed\u003c/div>\u003ch2>My red lines\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>About your own profession:\u003c/p>\u003col class=\"sm\">\u003cli>I owe my employer…\u003c/li>\u003cli>I would break a company rule if…\u003c/li>\u003cli>I would never… even if my job depended on it.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box\">\u003cp>\u003cb>Pressure test\u003c/b> in threes: each listener gives one hard scenario.\u003c/p>\u003cp class=\"sm\">What if…? · Would that still apply if…? · That's a fair challenge; I'd add an exception for…\u003c/p>\u003cp class=\"xs\">Keep these for Week 8.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s dark\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Close\u003c/div>\u003ch2>Exit ticket and homework\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>\u003cb>Exit ticket\u003c/b> (Worksheet Part 13)\u003c/p>\u003col class=\"sm\">\u003cli>One thing employees owe employers\u003c/li>\u003cli>One thing an employer can never ask of an employee\u003c/li>\u003cli>Confidence 1–4\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv>\u003cp>\u003cb>Journal #4\u003c/b> (200–250 words)\u003c/p>\u003cp class=\"sm\">Should Ari report now? Position → 2 reasons (1 framework) → evidence → strongest counterargument → rebuttal → conclusion.\u003c/p>\u003cp class=\"sm\">\u003cb>Read:\u003c/b> 8.1 (p. 231). \u003cb>Next week:\u003c/b> Quiz 3 (Ch. 6–8) and your Personal Code of Ethics draft.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003c/div>\n\u003cdiv class=\"nav\">\u003cbutton onclick=\"go(-1)\" aria-label=\"Previous\">‹\u003c/button>\u003cbutton onclick=\"fs()\">Full screen\u003c/button>\u003cbutton onclick=\"go(1)\" aria-label=\"Next\">›\u003c/button>\u003c/div>\n\u003cscript>\nconst S=[...document.querySelectorAll('.s')];let i=0,iv=null;\nS.forEach((s,n)=>{if(!s.classList.contains('title')){const f=document.createElement('div');f.className='foot';f.innerHTML='\u003cimg src=\"logo.png\" alt=\"\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan class=\"n\">'+(n+1)+' / '+S.length+'\u003c/span>';s.appendChild(f)}\n if(s.dataset.min){const t=document.createElement('div');t.className='timer';const sec=s.dataset.min*60;t.innerHTML='\u003cb>'+fmt(sec)+'\u003c/b>\u003cbutton>Start\u003c/button>\u003cbutton>Reset\u003c/button>';s.appendChild(t);let left=sec;const [b,st,rs]=t.children;\n st.onclick=e=>{e.stopPropagation();if(iv){clearInterval(iv);iv=null;st.textContent='Start';return}st.textContent='Pause';iv=setInterval(()=>{left--;b.textContent=fmt(Math.max(left,0));if(left\u003c=0){clearInterval(iv);iv=null;t.classList.add('done');st.textContent='Start'}},1000)};\n rs.onclick=e=>{e.stopPropagation();clearInterval(iv);iv=null;left=sec;b.textContent=fmt(sec);t.classList.remove('done');st.textContent='Start'}}});\nfunction fmt(x){return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}\nfunction show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k===i));try{history.replaceState(null,'','#'+(i+1))}catch(e){}}\nfunction go(d){show(i+d)}\nfunction fs(){const d=document.documentElement;if(!document.fullscreenElement){d.requestFullscreen&&d.requestFullscreen()}else document.exitFullscreen()}\ndocument.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='f')fs()});\ndocument.getElementById('deck').addEventListener('click',e=>{if(e.target.closest('button,[contenteditable],a'))return;const x=e.clientX/innerWidth;go(x\u003c0.3?-1:1)});\nlet tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d\u003c0?1:-1);tx=null});\nshow(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));\n\u003c/script>\n\u003c/body>\u003c/html>\n", "handouts": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 7 Handouts · What Employees Owe Employers\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.page{background:#fff;border-radius:10px;padding:18px 22px;margin:16px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\n.page h2{margin-top:0}\n.hh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);border-bottom:1px solid var(--sky);padding-bottom:4px;margin-bottom:8px}\n.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.cards.c3{grid-template-columns:1fr 1fr 1fr}\n.page table{font-size:14px}\n.page p{overflow-wrap:anywhere}\n.cut{border:2px dashed #9aa7ba;border-radius:8px;padding:10px 12px;font-size:15px;break-inside:avoid;min-height:110px}\n.cut .no{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-bottom:4px}\n.cut .src{display:block;margin-top:4px}\n.sign{height:300px;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:800;color:var(--navy);border:6px solid var(--gold);border-radius:14px;margin:12px 0;letter-spacing:.04em}\n.slip{border:2px dashed #9aa7ba;border-radius:8px;padding:8px 12px;font-size:13.5px;break-inside:avoid}\n.slip p{margin:2px 0}\n.line{border-bottom:1px solid #999;height:22px}\n.clause{border-left:3px solid var(--navy);padding:4px 10px;margin:8px 0;background:#f7f9fc}\n.score td{height:40px}\n.tool{margin:8px 0}\n@media (max-width:640px){.cards,.cards.c3{grid-template-columns:1fr}.page{padding:12px}.page table{display:block;overflow-x:auto}.sign{font-size:44px;height:180px}}\n@media print{.page{box-shadow:none;border:0;padding:0;margin:0;break-after:page}.page:last-child{break-after:auto}.cut,.slip{font-size:11pt}.sign{height:42vh;font-size:96pt}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Handouts\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1 class=\"noprint\">Week 7 Handouts\u003c/h1>\n\u003cp class=\"lead noprint\">Print the pages you need. Each handout starts on a new page. Cut along the dashed lines.\u003c/p>\n\u003csection class=\"noprint\">\u003ch2>Contents\u003c/h2>\u003col class=\"toc\">\n\u003cli>\u003ca href=\"#h1\">Handout 1 · Spectrum signs and exit ticket slips\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h2\">Handout 2 · Clause Clinic contract and role cards\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h3\">Handout 3 · Gray Zone cards\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h4\">Handout 4 · Case files A–C\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h5\">Handout 5 · Debate pack\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#h6\">Handout 6 · Sort race cards and key\u003c/a>\u003c/li>\n\u003c/ol>\u003c/section>\n\n\u003cdiv class=\"page\" id=\"h1\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 1 · Spectrum signs\u003c/span>\u003c/div>\n\u003cdiv class=\"sign\">FINE\u003c/div>\n\u003cdiv class=\"sign\">DISLOYAL\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 1 · Exit ticket slips (Class 1)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Exit ticket · Corvane\u003c/b> Name: ____________\u003c/p>\u003cp>Ari's first move should be (circle one):\u003c/p>\u003cp>\u003cb>A\u003c/b> say nothing, keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> regulator (FDA) · \u003cb>F\u003c/b> journalist\u003c/p>\u003cp>because…\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Exit ticket · Corvane\u003c/b> Name: ____________\u003c/p>\u003cp>Ari's first move should be (circle one):\u003c/p>\u003cp>\u003cb>A\u003c/b> say nothing, keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> regulator (FDA) · \u003cb>F\u003c/b> journalist\u003c/p>\u003cp>because…\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Exit ticket · Corvane\u003c/b> Name: ____________\u003c/p>\u003cp>Ari's first move should be (circle one):\u003c/p>\u003cp>\u003cb>A\u003c/b> say nothing, keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> regulator (FDA) · \u003cb>F\u003c/b> journalist\u003c/p>\u003cp>because…\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Exit ticket · Corvane\u003c/b> Name: ____________\u003c/p>\u003cp>Ari's first move should be (circle one):\u003c/p>\u003cp>\u003cb>A\u003c/b> say nothing, keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> regulator (FDA) · \u003cb>F\u003c/b> journalist\u003c/p>\u003cp>because…\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Exit ticket · Corvane\u003c/b> Name: ____________\u003c/p>\u003cp>Ari's first move should be (circle one):\u003c/p>\u003cp>\u003cb>A\u003c/b> say nothing, keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> regulator (FDA) · \u003cb>F\u003c/b> journalist\u003c/p>\u003cp>because…\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"slip\">\u003cp>\u003cb>Exit ticket · Corvane\u003c/b> Name: ____________\u003c/p>\u003cp>Ari's first move should be (circle one):\u003c/p>\u003cp>\u003cb>A\u003c/b> say nothing, keep checking · \u003cb>B\u003c/b> talk to Dana · \u003cb>C\u003c/b> Dana's boss · \u003cb>D\u003c/b> ethics hotline / compliance · \u003cb>E\u003c/b> regulator (FDA) · \u003cb>F\u003c/b> journalist\u003c/p>\u003cp>because…\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h2\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 2 · Clause Clinic\u003c/span>\u003c/div>\n\u003ch2>Corvane Medical · Employment Agreement (excerpt)\u003c/h2>\n\u003cp class=\"src\">Fictional company. Corvane makes infusion pumps for hospitals.\u003c/p>\n\u003cdiv class=\"clause\">\u003cb>1 · Inventions.\u003c/b> Anything the employee creates, invents or writes while employed belongs to Corvane.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>2 · Confidentiality.\u003c/b> During and after employment, with no time limit, the employee will not share any Corvane information with anyone outside the company.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>3 · Non-compete.\u003c/b> For two years after leaving, the employee will not work for any medical device company within 100 miles of any Corvane office.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>4 · Nonsolicitation.\u003c/b> For two years after leaving, the employee will not contact Corvane customers or invite Corvane employees to join another company.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>5 · Nondisparagement.\u003c/b> During and after employment, the employee will never say or write anything negative about Corvane, its products or its managers, in any place or forum.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>6 · Outside work.\u003c/b> The employee will not take any second job without written permission.\u003c/div>\n\u003ch3>Your task\u003c/h3>\n\u003col>\u003cli>Read your role card. Two of you are the employee side; two are HR.\u003c/li>\u003cli>For each clause decide: \u003cb>keep, change or delete\u003c/b> for this person. You must agree.\u003c/li>\u003cli>Rewrite at least one clause in your own words.\u003c/li>\u003cli>\u003cb>Rawls test:\u003c/b> if you didn't know which of the three people you'd be, would you still sign your version?\u003c/li>\u003c/ol>\n\u003ctable>\u003ctr>\u003cth>Clause\u003c/th>\u003cth>Keep / change / delete\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 2 · Role cards (one per group)\u003c/span>\u003c/div>\n\u003cdiv class=\"cards\" style=\"grid-template-columns:1fr\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role A\u003c/span>\u003ch3 style=\"margin:4px 0\">Assembly-line technician\u003c/h3>\u003cp>Puts together pump parts on the production line. Earns $38,000 a year. Has no access to designs or customer lists. The town has two other medical device factories that sometimes pay more.\u003c/p>\u003cp>\u003cb>Employee side wants:\u003c/b> freedom to take a better-paid factory job. \u003cb>HR wants:\u003c/b> low staff turnover.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role B\u003c/span>\u003ch3 style=\"margin:4px 0\">Senior research engineer\u003c/h3>\u003cp>Designs the software and parts of new pumps. Knows plans for products that will launch in the next three years. Earns $145,000. Recruiters contact her often.\u003c/p>\u003cp>\u003cb>Employee side wants:\u003c/b> career freedom and the right to consult. \u003cb>HR wants:\u003c/b> to protect product plans.\u003c/p>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Role C\u003c/span>\u003ch3 style=\"margin:4px 0\">Vice president of sales\u003c/h3>\u003cp>Built Corvane's relationships with its ten biggest hospital customers over twelve years. Many clients call her directly. Earns $210,000 plus bonus.\u003c/p>\u003cp>\u003cb>Employee side wants:\u003c/b> to keep working in the industry she knows. \u003cb>HR wants:\u003c/b> to keep the clients if she leaves.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h3\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 3 · Gray Zone cards (one set per pair)\u003c/span>\u003c/div>\n\u003cp>Decide: \u003cb>OK / Not OK / It depends\u003c/b>. Name the rule or concept from Chapter 7.\u003c/p>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 1\u003c/span>\u003cbr>A copier vendor gives you a $150 gift card. Next week you choose which company's copiers your office will buy.\u003cspan class=\"src\">Section 7.4\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 2\u003c/span>\u003cbr>A friend tells you her company will be bought next week. You buy shares in her company.\u003cspan class=\"src\">Section 7.4\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 3\u003c/span>\u003cbr>Abroad, a customs officer asks for $20 to process your already-approved shipment today instead of next week.\u003cspan class=\"src\">Section 7.4\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 4\u003c/span>\u003cbr>You post a funny video of a mistake in your restaurant's kitchen. You are wearing the restaurant's uniform.\u003cspan class=\"src\">Section 7.2\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 5\u003c/span>\u003cbr>A regular customer makes sexual comments to you. Your manager says, \"Just serve him, he tips well.\"\u003cspan class=\"src\">Section 7.2\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 6\u003c/span>\u003cbr>A new hire from your main rival tells you the rival's new prices for a bid you're both making. No nondisclosure agreement was broken.\u003cspan class=\"src\">Section 7.4\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 7\u003c/span>\u003cbr>You discuss salaries with three coworkers. Your manager says this is against company policy.\u003cspan class=\"src\">Section 7.5\u003c/span>\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Card 8\u003c/span>\u003cbr>You post an angry anonymous review online attacking your manager's personality.\u003cspan class=\"src\">Section 7.5\u003c/span>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h4\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 4 · Case file A\u003c/span>\u003c/div>\n\u003ch2>Case file A · Sherron Watkins, Enron\u003c/h2>\u003cp class=\"src\">From the textbook, 7.5 (section 7.5, from p. 218)\u003c/p>\n\u003cp>Enron was an energy company in Houston and one of the largest companies in the U.S. Sherron Watkins was a vice president there. In 2001 she found serious accounting irregularities, ways of hiding losses and debt. She wrote to founder and chairman Ken Lay and warned him. Lay ignored her warning. Enron's president, Jeff Skilling, had quit within two weeks of her discovery.\u003c/p>\n\u003cp>Watkins then spoke to the press, not to the SEC, the government agency for financial markets. Because of that, the whistleblower laws of the time did not protect her. Enron collapsed, and shareholders lost about $60 billion. Partly because of her experience, Congress passed the Sarbanes-Oxley Act, which added protection for employees who report fraud.\u003c/p>\n\u003cp>Watkins later became a speaker on ethics. She said that staying silent about important matters puts you on the wrong path, and that she would never again have a job in corporate America.\u003c/p>\n\u003cp>\u003cb>Teach your group:\u003c/b> What did she find? Whom did she tell? What did it cost her? \u003cb>Think:\u003c/b> Did Watkins owe a duty to Enron, its shareholders, or the investing public?\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 4 · Case file B\u003c/span>\u003c/div>\n\u003ch2>Case file B · Sallie Krawcheck, Merrill Lynch\u003c/h2>\u003cp class=\"src\">From the textbook, 7.5 (section 7.5, from p. 218)\u003c/p>\n\u003cp>Sallie Krawcheck took over the wealth management division of Merrill Lynch after Bank of America bought it. She discovered that the Stable Value Fund, sold as a low-risk choice for people's 401(k) retirement savings, had been managed with far more risk than its investors expected. It lost much of its value. Many investors earned modest salaries; the largest group were Walmart employees.\u003c/p>\n\u003cp>Earlier in her career, Krawcheck had been fired from Citigroup's Smith Barney after she paid back clients for losses she believed were the company's fault. Now most of her colleagues told her to do nothing. She took the problem to Bank of America's CEO, who agreed to put company money into the fund to cover the losses.\u003c/p>\n\u003cp>Krawcheck said she acted from her sense of purpose, not from ethical theory. The decision cost her powerful allies, and after the CEO retired she was \"reorganized out\" of her job. She later founded Ellevest, an investment company focused on women.\u003c/p>\n\u003cp>\u003cb>Teach your group:\u003c/b> What did she find? Whom did she tell? What did it cost her? \u003cb>Think:\u003c/b> She never went to a regulator. Is she a whistleblower?\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 4 · Case file C and scoring\u003c/span>\u003c/div>\n\u003ch2>Case file C · Sam Salehpour, Boeing\u003c/h2>\u003cp class=\"src\">Outside source: news reports, April
