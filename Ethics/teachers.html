2024 (NPR, Fortune). Not in the textbook.\u003c/p>\n\u003cp>Sam Salehpour is a quality engineer at Boeing, the U.S. aircraft maker. In April 2024, his lawyers made his concerns public. He said Boeing had taken shortcuts when assembling the body of the 787 Dreamliner: small gaps between sections were not properly filled, and too much force was used to make parts line up, which he said could cause tiny cracks over time (called \"fatigue\"). He also raised concerns about the 777.\u003c/p>\n\u003cp>Salehpour said he raised these problems with managers and was then moved to another program, left out of meetings and threatened. On April 17, 2024, he testified before a U.S. Senate subcommittee. He said he was still employed only because his lawyers used whistleblower protections. The Federal Aviation Administration (FAA) said it was investigating his claims.\u003c/p>\n\u003cp>Boeing strongly rejected his claims and said it was fully confident in the 787.\u003c/p>\n\u003cp>\u003cb>Teach your group:\u003c/b> What did he find? Whom did he tell? What did it cost him? \u003cb>Think:\u003c/b> Which of the five tests is hardest to judge from outside the company?\u003c/p>\n\u003ch3>Score the cases: ✓ / ✗ / ?\u003c/h3>\n\u003ctable class=\"score\">\u003ctr>\u003cth>Test\u003c/th>\u003cth>A Watkins\u003c/th>\u003cth>B Krawcheck\u003c/th>\u003cth>C Salehpour\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 Good motive (not revenge)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 Internal channels first\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 Hard evidence\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 Serious violation\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 Could realistically stop it\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Route used\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>One sentence per case: \u003ci>If ___ had ___, ___ would have ___.\u003c/i>\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h5\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 5 · Debate pack\u003c/span>\u003c/div>\n\u003ch2>Corvane, Part 2 (fictional)\u003c/h2>\n\u003cp>Ari spoke to Dana. Dana said: \"The 1-in-400 error happened only in the old test setup. Engineering is fixing the software for the next batch. If we delay delivery, we lose the contract and maybe 200 jobs. I need you to trust me on this.\"\u003c/p>\n\u003cp>Ari then used the company's ethics hotline. A week later, Compliance replied that they had \"opened a review\" that will take six to eight weeks. The first FlowSure 2 pumps reach hospitals in two weeks. Two coworkers have noticed that Ari is no longer invited to the weekly product meeting.\u003c/p>\n\u003cp class=\"tool\">\u003cb>Motion:\u003c/b> \u003ci>Ari should report the altered test data to the regulator now, before Corvane's internal review is finished.\u003c/i>\u003c/p>\n\u003cdiv class=\"cards\">\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Proposition\u003c/span>\u003cbr>\u003cb>Report now.\u003c/b> Prepare three arguments using at least two frameworks. Predict the Opposition's strongest point and prepare your rebuttal.\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Opposition\u003c/span>\u003cbr>\u003cb>Wait and push internally.\u003c/b> Prepare three arguments using at least two frameworks. Predict the Proposition's strongest point and prepare your rebuttal.\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Judge\u003c/span>\u003cbr>\u003cb>Patient safety advocate.\u003c/b> You represent people who will be connected to these pumps. You care about risk, speed and honesty.\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Judge\u003c/span>\u003cbr>\u003cb>Corvane CFO.\u003c/b> You are responsible for the company's finances and 900 jobs. You care about the contract, the company's reputation and legal risk.\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Judge\u003c/span>\u003cbr>\u003cb>Ari's coworker.\u003c/b> You've worked with Ari and Dana for years. You care about trust in the team, fairness to Dana and your own job.\u003c/div>\n\u003cdiv class=\"cut\">\u003cspan class=\"no\">Judge\u003c/span>\u003cbr>\u003cb>Hospital buyer.\u003c/b> Your hospital group ordered FlowSure 2. You care about patient safety, delivery dates and whether you can trust Corvane in the future.\u003c/div>\n\u003c/div>\n\u003cp class=\"src\">Steps: read 3 · prepare 8 · opening statements 2+2 · rebuttal huddle 2 · rebuttals 1.5+1.5 · judges' questions 5 · closing 1+1 (with a concession) · judges deliberate in public 4 · debrief 5\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 5 · Judges' scoring sheet\u003c/span>\u003c/div>\n\u003ch2>Judges' scoring sheet\u003c/h2>\n\u003cp>Judge's name: ____________________ Stakeholder: ____________________\u003c/p>\n\u003cp>Score each team 1–4 (1 = weak, 4 = excellent).\u003c/p>\n\u003ctable class=\"score\">\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>Proposition\u003c/th>\u003cth>Opposition\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Clear position\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Reasons that apply ethical frameworks (not just name them)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Evidence from the case\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Quality of rebuttal: answered the other side's best point\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Respect and a fair concession\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Total (out of 20)\u003c/th>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/table>\n\u003ch3>My two questions (from my stakeholder's view)\u003c/h3>\n\u003cp>1. ___________________________________________________________________\u003c/p>\n\u003cp>2. ___________________________________________________________________\u003c/p>\n\u003ch3>My verdict as this stakeholder\u003c/h3>\n\u003cp>Ari should / should not report now, because ___________________________________________\u003c/p>\n\u003cp>__________________________________________________________________________\u003c/p>\n\u003cp class=\"src\">Your verdict can differ from the score. A team can debate better and still be wrong from your stakeholder's point of view.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"page\" id=\"h6\">\n\u003cdiv class=\"hh\">\u003cspan>Ethics in a Global World · Week 7\u003c/span>\u003cspan>Handout 6 · Sort race (one set per team)\u003c/span>\u003c/div>\n\u003cp>Sort into three columns: \u003cb>Employee's right\u003c/b> · \u003cb>Employee's responsibility\u003c/b> · \u003cb>Both / depends\u003c/b>. Say one key term for each card.\u003c/p>\n\u003cdiv class=\"cards c3\">\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Discuss your pay with coworkers\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Keep trade secrets confidential\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Quit your job at any time\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Avoid conflicts of interest\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Be protected from harassment, including by customers\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Give your best effort\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Report legal violations to a government agency\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Not trade shares using inside information\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Follow the company's code of conduct\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Criticize the company\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Take a second job\u003c/div>\n\u003cdiv class=\"cut\" style=\"min-height:70px\">Follow a non-compete after you leave\u003c/div>\n\u003c/div>\n\u003ch3>Key card (give one to each team after sorting)\u003c/h3>\n\u003cdiv class=\"cut\" style=\"min-height:0\">\n\u003cp>\u003cb>Right:\u003c/b> discuss pay with coworkers (NLRA) · quit at any time (at-will) · be protected from harassment, including by customers (Pizza Hut case) · report legal violations to a government agency (protected under specific laws)\u003c/p>\n\u003cp>\u003cb>Responsibility:\u003c/b> keep trade secrets confidential · avoid conflicts of interest · give your best effort · not trade on inside information · follow the code of conduct\u003c/p>\n\u003cp>\u003cb>Both / depends:\u003c/b> criticize the company (protected about pay and conditions with coworkers; not personal attacks or false posts) · take a second job (OK if it doesn't compete) · follow a non-compete (depends on the state and the contract)\u003c/p>\n\u003c/div>\u003c/div>\n\n\u003cp class=\"src noprint\">Textbook: Byars & Stanberry, \u003ci>Business Ethics\u003c/i>, OpenStax (CC BY 4.0). Corvane Medical and Ari Moreno are fictional.\u003c/p>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "notes": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 7 Study Notes · What Employees Owe Employers\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media (max-width:640px){.two{grid-template-columns:1fr}}\n.def b{color:var(--navy)}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Study notes\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 7 Study Notes\u003c/h1>\n\u003cp class=\"lead\">Chapter 7: What Employees Owe Employers · Key ideas in plain words · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 7 online\u003c/a>\u003c/p>\n\u003cp class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\u003c/p>\n\n\u003csection>\n\u003ch2>1 · Loyalty to the company (7.1, p. 196)\u003c/h2>\n\u003cdiv class=\"two\">\n\u003cdiv class=\"def\">\n\u003cp>\u003cb>Duty of loyalty:\u003c/b> employees must not act against their employer's interests. In practice: work in good faith, avoid \u003cb>conflicts of interest\u003c/b>, and don't take a competing second job (\u003cb>moonlighting\u003c/b>) without permission.\u003c/p>\n\u003cp>\u003cb>Fiduciary duty:\u003c/b> a higher duty of trust for people with more authority or access to secrets.\u003c/p>\n\u003cp>\u003cb>At-will employment:\u003c/b> either side can end the job at any time for any legal reason. The book says this usually favors the employer.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"def\">\n\u003cp>\u003cb>Two parts of loyalty\u003c/b> (Bidwell): (1) having the employer's interests at heart; (2) staying with the employer. Part 2 has weakened.\u003c/p>\n\u003cp>\u003cb>Two-way street:\u003c/b> the book says loyalty must be earned by both sides, through pay, benefits and respect.\u003c/p>\n\u003cp>\u003cb>Retention bonus:\u003c/b> money for agreeing to stay a set time.\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch3>Protecting company information\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>keeping the employer's private information secret (products, customers, salaries)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Trade secret\u003c/td>\u003ctd>valuable information a company keeps secret (designs, marketing plans, research)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Intellectual property\u003c/td>\u003ctd>ideas protected by patents, copyrights or trademarks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nondisclosure agreement (NDA)\u003c/td>\u003ctd>a contract to keep secrets\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Non-compete agreement\u003c/td>\u003ctd>a promise not to work for a competitor during or after the job, usually for a limited time and place\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nonsolicitation clause\u003c/td>\u003ctd>a promise not to take the company's clients or coworkers with you\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nondisparagement clause\u003c/td>\u003ctd>a promise not to damage the company's reputation\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Example:\u003c/b> Jimmy John's banned sandwich makers from working at any sandwich shop within two miles of any Jimmy John's for two years. It agreed in 2016 to stop. California makes most non-competes void. \u003ci>Update (outside the book):\u003c/i> the FTC's 2024 national ban never took effect; the FTC dropped its appeal in September 2025, so state law decides.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>2 · Loyalty to the brand and to customers (7.2, p. 203)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Brand\u003c/b> = a product or service sold under a company's name. \u003cb>Branding\u003c/b> = building its image and reputation.\u003c/li>\n\u003cli>Employees can badly damage a brand online (Taco Bell, Domino's, Burger King Japan videos and photos).\u003c/li>\n\u003cli>\u003cb>Internal marketing\u003c/b> = getting employees to believe in the product.\u003c/li>\n\u003cli>Employees owe customers respect, \u003cb>but good service does not mean accepting harassment\u003c/b>. In the Pizza Hut case, a jury awarded a server $360,000 after her manager made her serve customers who harassed her.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>3 · A positive work atmosphere (7.3, p. 207)\u003c/h2>\n\u003cul>\n\u003cli>Respect coworkers even when you disagree: argue about \u003cb>\"principles, not personalities.\"\u003c/b>\u003c/li>\n\u003cli>People have different \u003cb>work styles\u003c/b> and \u003cb>workplace personalities\u003c/b>; no type is better.\u003c/li>\n\u003cli>\u003cb>Codes of conduct\u003c/b> cover laws, gifts and bribery, conflicts of interest, company property, cybersecurity, social media and harassment.\u003c/li>\n\u003cli>Four types of \u003cb>workplace violence\u003c/b> (NIOSH): criminal intent, worker against worker, personal relationship, customer.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>4 · Financial integrity (7.4, p. 212)\u003c/h2>\n\u003cdiv class=\"two\">\n\u003cdiv class=\"def\">\u003cp>\u003cb>Insider trading:\u003c/b> buying or selling shares using important information the public doesn't have. Illegal for insiders, for outsiders who get a tip, and for the person who passes it on.\u003c/p>\n\u003cp>\u003cb>Bribe:\u003c/b> something of value given for an act that breaks legal or ethical rules. Gifts depend on value, purpose, timing and company policy.\u003c/p>\u003c/div>\n\u003cdiv class=\"def\">\u003cp>\u003cb>Foreign Corrupt Practices Act (FCPA):\u003c/b> U.S. law banning bribes to foreign officials to win or keep business.\u003c/p>\n\u003cp>\u003cb>Grease (facilitating) payment:\u003c/b> a small payment to speed up a routine task. The FCPA allows it, but many countries and companies do not.\u003c/p>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>5 · Criticism and whistleblowing (7.5, p. 218)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Pay secrecy:\u003c/b> rules against discussing pay. Under the National Labor Relations Act, most are unenforceable. Employees talking together about pay, hours or conditions is protected \u003cb>concerted activity\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Personal attacks\u003c/b> online (like Adrian Duane's Glassdoor review) usually are not protected. False posts are not protected.\u003c/li>\n\u003cli>\u003cb>Whistleblowing:\u003c/b> going to a \u003cb>government agency\u003c/b> to report your employer's legal violation.\u003c/li>\n\u003cli>\u003cb>Risks:\u003c/b> career damage, no promotion, anger from colleagues, blacklisting, \u003cb>retaliation\u003c/b> (punishment for reporting).\u003c/li>\n\u003c/ul>\n\u003ch3>The book's five tests\u003c/h3>\n\u003col>\u003cli>Good motive (stop wrongdoing, protect victims), not revenge\u003c/li>\u003cli>Internal channels first, usually\u003c/li>\u003cli>Hard evidence\u003c/li>\u003cli>A serious violation\u003c/li>\u003cli>Reporting could realistically stop it\u003c/li>\u003c/ol>\n\u003ch3>Protection and rewards\u003c/h3>\n\u003cul>\n\u003cli>In the U.S., protection comes only from \u003cb>specific laws\u003c/b> (OSHA 1970 was among the first; now 20+ federal laws).\u003c/li>\n\u003cli>\u003cb>False Claims Act, qui tam:\u003c/b> a private person can sue for the government and keep 15–25% of the recovery (25–30% if the government doesn't join).\u003c/li>\n\u003cli>Cases: Birkenfeld ($104 million, and prison) · Kopchinski ($50 million) · Watkins (Enron: went to the press, not the SEC, so no protection) · Krawcheck (Merrill Lynch: got investors repaid, then lost her job).\u003c/li>\n\u003cli>\u003ci>Outside the book:\u003c/i> EU Directive (2019) protects internal, regulator and public reporting. Japan adds criminal penalties for retaliation from December 1, 2026.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Language to use\u003c/h2>\n\u003cdiv class=\"phr\">\u003cspan>owe a duty to\u003c/span>\u003cspan>act in good faith\u003c/span>\u003cspan>a breach of confidentiality\u003c/span>\u003cspan>go through proper channels\u003c/span>\u003cspan>blow the whistle on\u003c/span>\u003cspan>face retaliation\u003c/span>\u003cspan>turn a blind eye to\u003c/span>\u003c/div>\n\u003cp>If she \u003cb>had gone\u003c/b> to the SEC, she \u003cb>would have been\u003c/b> protected. · Employees \u003cb>are entitled to\u003c/b> discuss pay. · Employees \u003cb>are obliged to\u003c/b> keep trade secrets.\u003c/p>\n\u003c/section>\n\u003cp class=\"src\">Textbook: Byars & Stanberry, \u003ci>Business Ethics\u003c/i>, OpenStax (CC BY 4.0). Notes written for this course.\u003c/p>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "worksheet": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 7 Student Worksheet · What Employees Owe Employers\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\ntextarea,input[type=text],select{width:100%;font:inherit;border:1px solid var(--sky);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink)}\ntextarea{min-height:64px;resize:vertical}\ntextarea.lg{min-height:180px}\nselect{width:auto;max-width:100%}\nlabel{display:block;margin:10px 0 4px;font-weight:600;color:var(--navy)}\n.opt{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}\n.opt label{display:inline-flex;align-items:center;gap:5px;font-weight:400;color:var(--ink);margin:0}\n.bar{position:sticky;top:63px;z-index:10;background:#fff;border-bottom:1px solid var(--sky);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}\n.bar input{max-width:260px}\n.bar .saved{font-size:13px;color:var(--mut);margin-left:auto}\n.cardq{border:1px solid var(--sky);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fbfcfe}\n.cardq p{margin:0 0 6px}\n.res{font-weight:700;margin-left:6px}\n.ok{color:#2e7d32}.no{color:#b3261e}\n.wc{font-size:13px;color:var(--mut);text-align:right}\ntd textarea{min-height:44px}\n.clause{border-left:3px solid var(--navy);padding:4px 10px;margin:8px 0;background:#f7f9fc}\n@media (max-width:640px){.bar{top:63px;padding:6px 10px}.bar .saved{width:100%;margin:0}}\n@media print{.bar{display:none}textarea,input[type=text]{border:0;border-bottom:1px solid #999;border-radius:0}details{display:block}details>*{display:block}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Student\u003c/span>\u003c/header>\n\n\u003cdiv class=\"bar noprint\">\n\u003cinput type=\"text\" data-k=\"name\" placeholder=\"Your name\" aria-label=\"Your name\">\n\u003cbutton class=\"btn\" onclick=\"dl()\">Download answers\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"clr()\" style=\"background:#7a8597\">Clear\u003c/button>\n\u003cspan class=\"saved\" id=\"saved\">Answers save automatically on this device.\u003c/span>\n\u003c/div>\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 7 Worksheet\u003c/h1>\n\u003cp class=\"lead\">What Employees Owe Employers · Book: \u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 7, from p. 195 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-introduction\" target=\"_blank\" rel=\"noopener\">Open Chapter 7 online\u003c/a>\u003c/p>\n\n\u003csection id=\"read\">\n\u003ch2>What to read in the book\u003c/h2>\n\u003cp>\u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 7. The book is free online; click a section to open it. Page numbers are from the PDF.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>Read for\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 7 introduction\u003c/a>\u003c/td>\u003ctd>p. 195\u003c/td>\u003ctd>Before class (short)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\" target=\"_blank\" rel=\"noopener\">7.1 Loyalty to the Company\u003c/a>\u003c/td>\u003ctd>pp. 196–202\u003c/td>\u003ctd>\u003cb>Partner A\u003c/b> (Part 3) · Clause Clinic (Part 4)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-2-loyalty-to-the-brand-and-to-customers\" target=\"_blank\" rel=\"noopener\">7.2 Loyalty to the Brand and to Customers\u003c/a>\u003c/td>\u003ctd>pp. 203–206\u003c/td>\u003ctd>Gray Zone cards 4–5 (Part 5)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-3-contributing-to-a-positive-work-atmosphere\" target=\"_blank\" rel=\"noopener\">7.3 Contributing to a Positive Work Atmosphere\u003c/a>\u003c/td>\u003ctd>pp. 207–211\u003c/td>\u003ctd>Optional background\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-4-financial-integrity\" target=\"_blank\" rel=\"noopener\">7.4 Financial Integrity\u003c/a>\u003c/td>\u003ctd>pp. 212–217\u003c/td>\u003ctd>Gray Zone cards 1–3 and 6 (Part 5)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">7.5 Criticism of the Company and Whistleblowing\u003c/a>\u003c/td>\u003ctd>p. 218 onward\u003c/td>\u003ctd>\u003cb>Partner B\u003c/b> (Part 3) · Gray Zone cards 7–8 · Case files A–B (Part 9)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-key-terms\" target=\"_blank\" rel=\"noopener\">Key terms\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-summary\" target=\"_blank\" rel=\"noopener\">Chapter summary\u003c/a>\u003c/td>\u003ctd>after 7.5\u003c/td>\u003ctd>Review for Quiz 3\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp class=\"src\">Readings A and B in this worksheet are short adapted summaries. The book sections have the full text.\u003c/p>\n\u003c/section>\n\u003csection class=\"noprint\">\n\u003ch2>Contents\u003c/h2>\n\u003col class=\"toc\">\n\u003cli>\u003ca href=\"#read\">What to read in the book\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p1\">Loyal or not?\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p2\">Loyalty map\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p3\">Paired reading\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p4\">Clause Clinic\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p5\">Gray Zone\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p6\">Corvane, Part 1 + exit ticket\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p7\">The price of speaking up\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p8\">The whistleblower's ladder\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p9\">Case files\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p10\">Debate preparation\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p11\">Rights or responsibilities?\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p12\">My red lines\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p13\">Exit ticket\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p14\">Homework: Journal #4\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#lang\">Language bank\u003c/a>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003ch2 style=\"border:0;margin-bottom:0\">Class 1 · What do you owe?\u003c/h2>\n\n\u003csection id=\"p1\">\n\u003ch2>1 · Loyal or not?\u003c/h2>\n\u003cp>Stand on the line between FINE and DISLOYAL for each situation. Then write notes here.\u003c/p>\n\u003col type=\"a\">\u003cli>You apply for other jobs during your lunch break.\u003c/li>\u003cli>You start a weekend web design business. Your day job is graphic designer at an advertising agency.\u003c/li>\u003cli>When you leave, you take your list of client contacts with you.\u003c/li>\u003cli>You tell three coworkers how much you earn.\u003c/li>\u003cli>You accept two free concert tickets from a supplier you buy from.\u003c/li>\u003cli>You post a joke about your boss on social media. You don't name the company.\u003c/li>\u003c/ol>\n\u003clabel>Which situation was hardest to decide? Why?\u003c/label>\u003ctextarea data-k=\"p1a\">\u003c/textarea>\n\u003clabel>Complete: \"Whether it is disloyal depends on…\"\u003c/label>\u003ctextarea data-k=\"p1b\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p2\">\n\u003ch2>2 · Loyalty map\u003c/h2>\n\u003cp>Talk with a partner from a different profession or workplace. Write both answers.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Me\u003c/th>\u003cth>My partner\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>How long should someone stay in a job to be seen as loyal?\u003c/td>\u003ctd>\u003ctextarea data-k=\"p2a1\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p2a2\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Is it disloyal to look for a new job while employed? Would you tell your manager?\u003c/td>\u003ctd>\u003ctextarea data-k=\"p2b1\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p2b2\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>One thing an employer did that earned (or lost) your loyalty\u003c/td>\u003ctd>\u003ctextarea data-k=\"p2c1\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p2c2\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Key ideas (7.1, p. 196 onward):\u003c/b> \u003cb>duty of loyalty\u003c/b> (don't act against your employer's interests) · \u003cb>at-will employment\u003c/b> (either side can end the job at any time for any legal reason) · loyalty should be a \u003cb>two-way street\u003c/b>.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p3\">\n\u003ch2>3 · Paired reading: loyalty vs. whistleblowing\u003c/h2>\n\u003cp>\u003cb>Prediction (before reading):\u003c/b> Can a person be loyal and a whistleblower at the same time?\u003c/p>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p3pre\" data-k=\"p3pre\" value=\"Yes\"> Yes\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p3pre\" data-k=\"p3pre\" value=\"No\"> No\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p3pre\" data-k=\"p3pre\" value=\"It depends\"> It depends\u003c/label>\u003c/div>\n\u003clabel>My role\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p3role\" data-k=\"p3role\" value=\"Partner A\"> Partner A · Loyalty\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p3role\" data-k=\"p3role\" value=\"Partner B\"> Partner B · Whistleblowing\u003c/label>\u003c/div>\n\n\u003cdetails>\u003csummary>Reading A · Loyalty to the company (adapted from 7.1, pp. 196–202)\u003c/summary>\n\u003cp class=\"src\">Full text in the book: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\" target=\"_blank\" rel=\"noopener\">7.1 Loyalty to the Company\u003c/a>, pp. 196–202, from \"A Duty of Loyalty\" to the end of \"Other Clauses.\"\u003c/p>\n\u003cp>\u003cb>A duty of loyalty.\u003c/b> Hard work and best effort are clear duties of every employee. Loyalty is harder to define. Most U.S. workers have no employment contract, but the common law in all fifty states says that employees have a \u003cb>duty of loyalty\u003c/b>: they must not act against their employer's interests. They should work \"in good faith,\" avoid \u003cb>conflicts of interest\u003c/b>, and not benefit themselves at the employer's expense. For example, a graphic designer at an advertising agency usually cannot run a web design business on the side without permission, because it competes with the employer. Side work that does not compete, such as wedding photography, is usually fine. An employee who chooses a supplier because a relative works there is also acting wrongly. People with more trust and authority owe more: a \u003cb>fiduciary duty\u003c/b>.\u003c/p>\n\u003cp>\u003cb>Changing ideas of loyalty.\u003c/b> A Forbes survey reported in the book found that millennials are three times more likely than older workers to change jobs, and about 91% do not expect to stay more than three years. Wharton professor Matthew Bidwell says loyalty has two parts: having the employer's interests at heart, and staying with the employer. He adds that companies no longer take care of employees as they once did. Most employers use \u003cb>at-will employment\u003c/b>, so they can fire workers at any time for any legal reason. The book argues that loyalty should be a \u003cb>two-way street\u003c/b>: when CEOs move to the highest bidder and companies replace pensions with 401(k) plans, workers learn to look after themselves. Pay, benefits and simple thanks can build loyalty.\u003c/p>\n\u003cp>\u003cb>Confidentiality.\u003c/b> Employees often handle secret information: product plans, customer data, salary records. Many companies use employment agreements to protect it. Work you create on the job usually belongs to the employer. \u003cb>Trade secrets\u003c/b> (valuable information kept secret, such as designs or marketing plans) are protected mainly by secrecy and \u003cb>nondisclosure agreements (NDAs)\u003c/b>. \u003cb>Intellectual property\u003c/b> is protected by patents, copyrights and trademarks.\u003c/p>\n\u003cp>\u003cb>Non-compete agreements\u003c/b> stop employees from working for a competitor during or after the job, usually for a limited time and distance. About 20% of U.S. private-sector workers have one, including many low-paid workers. In 2016, the sandwich chain Jimmy John's agreed to stop using non-competes for low-wage workers after New York's attorney general investigated. Its agreement had banned workers from any sandwich shop within two miles of any Jimmy John's for two years. California makes most non-competes void. Other clauses include \u003cb>nonsolicitation\u003c/b> (don't take clients or coworkers with you) and \u003cb>nondisparagement\u003c/b> (don't damage the company's reputation).\u003c/p>\n\u003c/details>\n\n\u003cdetails>\u003csummary>Reading B · Whistleblowing: risks and rewards (adapted from 7.5, from p. 218)\u003c/summary>\n\u003cp class=\"src\">Full text in the book: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">7.5 Criticism of the Company and Whistleblowing\u003c/a>, from \"Whistleblowing: Risks and Rewards\" to the end of the Krawcheck case.\u003c/p>\n\u003cp>\u003cb>What it is.\u003c/b> \u003cb>Whistleblowing\u003c/b> means going to a government agency to report that your employer has broken the law. It is mostly seen as a public service, and whistleblowers act as \"stewards\" of the public interest, although not all of them are purely unselfish.\u003c/p>\n\u003cp>\u003cb>The risks.\u003c/b> Whistleblowers whose names become known may damage their careers, lose promotions, face anger from managers and coworkers, and be \u003cb>blacklisted\u003c/b> (no one else will hire them).\u003c/p>\n\u003cp>\u003cb>The book's advice.\u003c/b> The motive should be to stop illegal conduct or protect victims, not revenge. Employees should usually try \u003cb>internal channels first\u003c/b>, have \u003cb>hard evidence\u003c/b>, and report \u003cb>serious\u003c/b> violations that could \u003cb>realistically be stopped\u003c/b>.\u003c/p>\n\u003cp>\u003cb>Legal protection\u003c/b> in the U.S. comes only from specific laws. The Occupational Safety and Health Act of 1970 was one of the first. Congress has since protected whistleblowers in more than twenty federal laws, including environmental laws.\u003c/p>\n\u003cp>\u003cb>Rewards.\u003c/b> The False Claims Act (1863) has a \u003cb>qui tam\u003c/b> provision: a private person (a \"relator\") can sue on behalf of the government and receive 15–25% of the money recovered, or 25–30% if the government does not join the case. Ten former Pfizer employees shared $102 million; the original whistleblower, John Kopchinski, received $50 million. Bradley Birkenfeld received $104 million for reporting tax fraud at the bank UBS, but he also went to prison for his part in it. Payment can take years.\u003c/p>\n\u003cp>\u003cb>Sherron Watkins (Enron).\u003c/b> Watkins, an officer at Enron, told chairman Ken Lay about accounting problems. He ignored her. She then went to the press, not the SEC, so she had no whistleblower protection. Enron collapsed, and shareholders lost about $60 billion. She later said she would never again work in corporate America.\u003c/p>\n\u003cp>\u003cb>Sallie Krawcheck (Merrill Lynch).\u003c/b> Krawcheck found that a \"low-risk\" retirement fund had been managed with too much risk, and many ordinary investors, mostly Walmart employees, lost money. Most colleagues told her to do nothing. She went to Bank of America's CEO, who agreed to pay investors back. Later she was \"reorganized out\" of her job.\u003c/p>\n\u003c/details>\n\n\u003ch3>Guide questions\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Partner A · Loyalty\u003c/th>\u003cth>Partner B · Whistleblowing\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1. What does the duty of loyalty forbid? Give two examples.\u003ctextarea data-k=\"p3a1\">\u003c/textarea>\u003c/td>\u003ctd>1. How does the book define whistleblowing?\u003ctextarea data-k=\"p3b1\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2. Who owes a fiduciary duty, and why?\u003ctextarea data-k=\"p3a2\">\u003c/textarea>\u003c/td>\u003ctd>2. What risks does a whistleblower face?\u003ctextarea data-k=\"p3b2\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3. Why has loyalty changed? Give two reasons from the book.\u003ctextarea data-k=\"p3a3\">\u003c/textarea>\u003c/td>\u003ctd>3. List the book's five pieces of advice for whistleblowers.\u003ctextarea data-k=\"p3b3\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4. What is a non-compete? What happened with Jimmy John's?\u003ctextarea data-k=\"p3a4\">\u003c/textarea>\u003c/td>\u003ctd>4. Why did Watkins have no legal protection? What did Krawcheck lose?\u003ctextarea data-k=\"p3b4\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003clabel>Listener's \"Why?\" or \"What if?\" question to my partner\u003c/label>\u003ctextarea data-k=\"p3q\">\u003c/textarea>\n\u003clabel>After reading: can a person be loyal and a whistleblower? Our answer and one reason\u003c/label>\u003ctextarea data-k=\"p3post\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p4\">\n\u003ch2>4 · Clause Clinic\u003c/h2>\n\u003cp>Negotiate this contract for \u003cb>one\u003c/b> person. Two of you are the employee side; two are HR. You must agree on every clause.\u003c/p>\n\u003clabel>Our role card\u003c/label>\n\u003cselect data-k=\"p4role\">\u003coption value=\"\">Choose…\u003c/option>\u003coption>A · Assembly-line technician ($38,000 a year)\u003c/option>\u003coption>B · Senior research engineer (access to device designs)\u003c/option>\u003coption>C · Vice president of sales (owns main client relationships)\u003c/option>\u003c/select>\n\u003cdetails>\u003csummary>Role cards\u003c/summary>\n\u003cp>\u003cb>A · Assembly-line technician.\u003c/b> Puts together pump parts on the production line. Earns $38,000 a year. Has no access to designs or customer lists. The town has two other medical device factories.\u003c/p>\n\u003cp>\u003cb>B · Senior research engineer.\u003c/b> Designs the software and parts of new pumps. Knows plans for products that will launch in the next three years. Earns $145,000. Is often contacted by recruiters.\u003c/p>\n\u003cp>\u003cb>C · Vice president of sales.\u003c/b> Built Corvane's relationships with its ten biggest hospital customers over twelve years. Many clients call her directly. Earns $210,000 plus bonus.\u003c/p>\n\u003c/details>\n\u003cdetails open>\u003csummary>Corvane Medical · Employment Agreement (excerpt, fictional)\u003c/summary>\n\u003cdiv class=\"clause\">\u003cb>1 · Inventions.\u003c/b> Anything the employee creates, invents or writes while employed belongs to Corvane.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>2 · Confidentiality.\u003c/b> During and after employment, with no time limit, the employee will not share any Corvane information with anyone outside the company.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>3 · Non-compete.\u003c/b> For two years after leaving, the employee will not work for any medical device company within 100 miles of any Corvane office.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>4 · Nonsolicitation.\u003c/b> For two years after leaving, the employee will not contact Corvane customers or invite Corvane employees to join another company.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>5 · Nondisparagement.\u003c/b> During and after employment, the employee will never say or write anything negative about Corvane, its products or its managers, in any place or forum.\u003c/div>\n\u003cdiv class=\"clause\">\u003cb>6 · Outside work.\u003c/b> The employee will not take any second job without written permission.\u003c/div>\n\u003c/details>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Clause\u003c/th>\u003cth>Keep / change / delete\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 Inventions\u003c/td>\u003ctd>\u003cselect data-k=\"p4c1\">\u003coption>\u003c/option>\u003coption>Keep\u003c/option>\u003coption>Change\u003c/option>\u003coption>Delete\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4r1\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 Confidentiality\u003c/td>\u003ctd>\u003cselect data-k=\"p4c2\">\u003coption>\u003c/option>\u003coption>Keep\u003c/option>\u003coption>Change\u003c/option>\u003coption>Delete\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4r2\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 Non-compete\u003c/td>\u003ctd>\u003cselect data-k=\"p4c3\">\u003coption>\u003c/option>\u003coption>Keep\u003c/option>\u003coption>Change\u003c/option>\u003coption>Delete\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4r3\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 Nonsolicitation\u003c/td>\u003ctd>\u003cselect data-k=\"p4c4\">\u003coption>\u003c/option>\u003coption>Keep\u003c/option>\u003coption>Change\u003c/option>\u003coption>Delete\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4r4\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 Nondisparagement\u003c/td>\u003ctd>\u003cselect data-k=\"p4c5\">\u003coption>\u003c/option>\u003coption>Keep\u003c/option>\u003coption>Change\u003c/option>\u003coption>Delete\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4r5\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6 Outside work\u003c/td>\u003ctd>\u003cselect data-k=\"p4c6\">\u003coption>\u003c/option>\u003coption>Keep\u003c/option>\u003coption>Change\u003c/option>\u003coption>Delete\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4r6\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003clabel>Our rewritten clause (number and new wording)\u003c/label>\u003ctextarea data-k=\"p4rew\">\u003c/textarea>\n\u003clabel>Rawls test: behind the veil of ignorance, you don't know if you'll be the technician, the engineer or the VP. Would you still sign your version? Why?\u003c/label>\u003ctextarea data-k=\"p4rawls\">\u003c/textarea>\n\u003clabel>Our one-sentence report: \"For [role], we ___ because ___.\"\u003c/label>\u003cinput type=\"text\" data-k=\"p4rep\">\n\u003c/section>\n\n\u003csection id=\"p5\">\n\u003ch2>5 · Gray Zone\u003c/h2>\n\u003cp>For each card, decide \u003cb>OK / Not OK / It depends\u003c/b>, and name the rule or concept from Chapter 7.\u003c/p>\n\u003cdiv id=\"gz\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p6\">\n\u003ch2>6 · Corvane, Part 1 (fictional)\u003c/h2>\n\u003cp>Ari Moreno has been a quality engineer at Corvane Medical for six years. Corvane is a mid-size company of 900 employees that makes infusion pumps, the machines hospitals use to give patients medicine through a drip. Ari likes the work and the team, and Corvane paid for Ari's master's degree.\u003c/p>\n\u003cp>The new pump, FlowSure 2, must be delivered to a large hospital group in three weeks. It is Corvane's biggest contract ever. While checking files, Ari finds that the results of one safety test were changed. The original data showed that in about 1 in 400 tests, the pump gave a higher dose than it was set to. The submitted data show no errors. The change was approved by Ari's manager, Dana.\u003c/p>\n\u003cp>Ari has signed the Corvane employment agreement from the Clause Clinic, including the confidentiality and nondisparagement clauses.\u003c/p>\n\u003ch3>Exit ticket · Class 1\u003c/h3>\n\u003clabel>Ari's first move should be…\u003c/label>\n\u003cdiv class=\"opt\" style=\"flex-direction:column\">\n\u003clabel>\u003cinput type=\"radio\" name=\"p6\" data-k=\"p6\" value=\"A\"> A · Say nothing and keep checking\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"p6\" data-k=\"p6\" value=\"B\"> B · Talk to Dana directly\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"p6\" data-k=\"p6\" value=\"C\"> C · Go to Dana's boss\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"p6\" data-k=\"p6\" value=\"D\"> D · Use the ethics hotline or compliance office\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"p6\" data-k=\"p6\" value=\"E\"> E · Contact the regulator (the U.S. Food and Drug Administration)\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"p6\" data-k=\"p6\" value=\"F\"> F · Contact a journalist\u003c/label>\u003c/div>\n\u003clabel>…because…\u003c/label>\u003ctextarea data-k=\"p6why\">\u003c/textarea>\n\u003c/section>\n\n\u003ch2 style=\"border:0;margin-bottom:0\">Class 2 · When loyalty and conscience collide\u003c/h2>\n\n\u003csection id=\"p7\">\n\u003ch2>7 · The price of speaking up\u003c/h2>\n\u003cp>Match each person to what happened. All four are in 7.5 (from p. 218).\u003c/p>\n\u003cdiv id=\"match\">\u003c/div>\n\u003cbutton class=\"btn g noprint\" onclick=\"checkSet('m')\">Check my answers\u003c/button> \u003cspan id=\"m-score\" class=\"res\">\u003c/span>\n\u003c/section>\n\n\u003csection id=\"p8\">\n\u003ch2>8 · The whistleblower's ladder\u003c/h2>\n\u003cp>\u003cb>Ladder:\u003c/b> fix it yourself → your manager → your manager's boss → compliance office / ethics hotline → \u003cb>regulator\u003c/b> → media.\u003c/p>\n\u003cp>\u003cb>The book's five tests:\u003c/b> (1) good motive, not revenge · (2) internal channels first, usually · (3) hard evidence · (4) a serious violation · (5) reporting could realistically stop it.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Around the world\u003c/b> (outside sources, checked November 2026): The \u003cb>EU\u003c/b> Whistleblower Directive (2019) protects three routes (internal, regulator, public) and encourages, but does not require, internal reporting first. \u003cb>Japan's\u003c/b> amended law adds criminal penalties for retaliation, with company fines up to ¥30 million, from December 1, 2026. In the \u003cb>U.S.\u003c/b>, the SEC paid about $60 million to 48 whistleblowers in fiscal year 2025 and received about 27,000 tips.\u003c/div>\n\u003clabel>Watkins told Ken Lay first, then went to the press. Which step did she skip, and why did it matter legally?\u003c/label>\u003ctextarea data-k=\"p8a\">\u003c/textarea>\n\u003clabel>In workplaces you know, which step would people use first? Which step is unthinkable? Why?\u003c/label>\u003ctextarea data-k=\"p8b\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p9\">\n\u003ch2>9 · Case files\u003c/h2>\n\u003cp>Read one case. Teach it to your group. Then score all three together.\u003c/p>\n\u003clabel>My case\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p9c\" data-k=\"p9c\" value=\"A\"> A · Watkins\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p9c\" data-k=\"p9c\" value=\"B\"> B · Krawcheck\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p9c\" data-k=\"p9c\" value=\"C\"> C · Salehpour\u003c/label>\u003c/div>\n\u003cdetails>\u003csummary>Case file A · Sherron Watkins, Enron (book, 7.5)\u003c/summary>\n\u003cp class=\"src\">In the book: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">section 7.5\u003c/a>, \"Whistleblowing: Risks and Rewards.\"\u003c/p>\n\u003cp>Enron was an energy company in Houston and one of the largest companies in the U.S. Sherron Watkins was a vice president there. In 2001 she found serious accounting irregularities, ways of hiding losses and debt. She wrote to founder and chairman Ken Lay and warned him. Lay ignored her warning. Enron's president, Jeff Skilling, had quit within two weeks of her discovery.\u003c/p>\n\u003cp>Watkins then spoke to the press, not to the SEC, the government agency for financial markets. Because of that, the whistleblower laws of the time did not protect her. Enron collapsed, and shareholders lost about $60 billion. Partly because of her experience, Congress passed the Sarbanes-Oxley Act, which added protection for employees who report fraud.\u003c/p>\n\u003cp>Watkins later became a speaker on ethics. She said that staying silent about important matters puts you on the wrong path, and that she would never again have a job in corporate America.\u003c/p>\n\u003cp>\u003cb>Think:\u003c/b> Did Watkins owe a duty to Enron, its shareholders, or the investing public? How large a price is it fair to ask a whistleblower to pay?\u003c/p>\n\u003c/details>\n\u003cdetails>\u003csummary>Case file B · Sallie Krawcheck, Merrill Lynch (book, 7.5)\u003c/summary>\n\u003cp class=\"src\">In the book: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">section 7.5\u003c/a>, \"Whistleblowing: Risks and Rewards.\"\u003c/p>\n\u003cp>Sallie Krawcheck took over the wealth management division of Merrill Lynch after Bank of America bought it. She discovered that the Stable Value Fund, sold as a low-risk choice for people's 401(k) retirement savings, had been managed with far more risk than its investors expected. It lost much of its value. Many investors earned modest salaries; the largest group were Walmart employees.\u003c/p>\n\u003cp>Earlier in her career, Krawcheck had been fired from Citigroup's Smith Barney after she paid back clients for losses she believed were the company's fault. Now most of her colleagues told her to do nothing. She took the problem to Bank of America's CEO, who agreed to put company money into the fund to cover the losses.\u003c/p>\n\u003cp>Krawcheck said she acted from her sense of purpose, not from ethical theory. The decision cost her powerful allies, and after the CEO retired she was \"reorganized out\" of her job. She later founded Ellevest, an investment company focused on women.\u003c/p>\n\u003cp>\u003cb>Think:\u003c/b> Krawcheck never went to a regulator. Is she a whistleblower? Could you risk being fired a second time?\u003c/p>\n\u003c/details>\n\u003cdetails>\u003csummary>Case file C · Sam Salehpour, Boeing (outside source: 2024 news reports)\u003c/summary>\n\u003cp>Sam Salehpour is a quality engineer at Boeing, the U.S. aircraft maker. In April 2024, his lawyers made his concerns public. He said Boeing had taken shortcuts when assembling the body of the 787 Dreamliner: small gaps between sections were not properly filled, and too much force was used to make parts line up, which he said could cause tiny cracks over time (called \"fatigue\"). He also raised concerns about the 777.\u003c/p>\n\u003cp>Salehpour said he raised these problems with managers and was then moved to another program, left out of meetings and threatened. On April 17, 2024, he testified before a U.S. Senate subcommittee. He said he was still employed only because his lawyers used whistleblower protections. The Federal Aviation Administration (FAA) said it was investigating his claims.\u003c/p>\n\u003cp>Boeing strongly rejected his claims and said it was fully confident in the 787.\u003c/p>\n\u003cp class=\"src\">Sources: NPR (April 9, 2024); Fortune (April 10, 16 and 17, 2024).\u003c/p>\n\u003cp>\u003cb>Think:\u003c/b> Which of the book's five tests is hardest to judge from outside the company?\u003c/p>\n\u003c/details>\n\u003ch3>Score the cases: ✓ / ✗ / ?\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Test\u003c/th>\u003cth>A Watkins\u003c/th>\u003cth>B Krawcheck\u003c/th>\u003cth>C Salehpour\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 Good motive\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t1a\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t1b\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t1c\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 Internal first\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t2a\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t2b\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t2c\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 Hard evidence\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t3a\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t3b\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t3c\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 Serious violation\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t4a\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t4b\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t4c\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 Could stop it\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t5a\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t5b\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9t5c\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Route used\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9ra\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9rb\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p9rc\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003clabel>One conditional sentence per case: \"If ___ had ___, ___ would have ___.\"\u003c/label>\n\u003ctextarea data-k=\"p9cond\" placeholder=\"If Watkins had gone to the SEC, she would have…\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p10\">\n\u003ch2>10 · Debate: Should Ari go to the regulator?\u003c/h2>\n\u003cdetails open>\u003csummary>Corvane, Part 2 (fictional)\u003c/summary>\n\u003cp>Ari spoke to Dana. Dana said: \"The 1-in-400 error happened only in the old test setup. Engineering is fixing the software for the next batch. If we delay delivery, we lose the contract and maybe 200 jobs. I need you to trust me on this.\"\u003c/p>\n\u003cp>Ari then used the company's ethics hotline. A week later, Compliance replied that they had \"opened a review\" that will take six to eight weeks. The first FlowSure 2 pumps reach hospitals in two weeks. Two coworkers have noticed that Ari is no longer invited to the weekly product meeting.\u003c/p>\n\u003c/details>\n\u003cp>\u003cb>Motion:\u003c/b> \u003ci>Ari should report the altered test data to the regulator now, before Corvane's internal review is finished.\u003c/i>\u003c/p>\n\u003clabel>My role\u003c/label>\n\u003cselect data-k=\"p10role\">\u003coption value=\"\">Choose…\u003c/option>\u003coption>Proposition (report now)\u003c/option>\u003coption>Opposition (wait and push internally)\u003c/option>\u003coption>Judge: patient safety advocate\u003c/option>\u003coption>Judge: Corvane CFO\u003c/option>\u003coption>Judge: Ari's coworker\u003c/option>\u003coption>Judge: hospital buyer\u003c/option>\u003c/select>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>#\u003c/th>\u003cth>Argument\u003c/th>\u003cth>Reason / evidence from the case\u003c/th>\u003cth>Framework\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ctextarea data-k=\"p10a1\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p10e1\">\u003c/textarea>\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p10f1\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ctextarea data-k=\"p10a2\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p10e2\">\u003c/textarea>\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p10f2\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ctextarea data-k=\"p10a3\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p10e3\">\u003c/textarea>\u003c/td>\u003ctd>\u003cinput type=\"text\" data-k=\"p10f3\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003clabel>The other side's strongest argument will probably be…\u003c/label>\u003ctextarea data-k=\"p10opp\">\u003c/textarea>\n\u003clabel>Our rebuttal: \"Our opponents argued that… However, …\"\u003c/label>\u003ctextarea data-k=\"p10reb\">\u003c/textarea>\n\u003clabel>Our concession for the closing: \"We accept that…, but…\"\u003c/label>\u003ctextarea data-k=\"p10con\">\u003c/textarea>\n\u003clabel>Judges only: my two questions, from my stakeholder's point of view\u003c/label>\u003ctextarea data-k=\"p10jq\">\u003c/textarea>\n\u003clabel>After the debate: the argument from the other side that was hardest to answer\u003c/label>\u003ctextarea data-k=\"p10hard\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p11\">\n\u003ch2>11 · Rights or responsibilities?\u003c/h2>\n\u003cp>Sort each item. Then check.\u003c/p>\n\u003cdiv id=\"sort\">\u003c/div>\n\u003cbutton class=\"btn g noprint\" onclick=\"checkSet('s')\">Check my answers\u003c/button> \u003cspan id=\"s-score\" class=\"res\">\u003c/span>\n\u003c/section>\n\n\u003csection id=\"p12\">\n\u003ch2>12 · My red lines\u003c/h2>\n\u003cp>Write about your own profession. Keep these: you'll use them in your Personal Code of Ethics draft in Week 8.\u003c/p>\n\u003clabel>I owe my employer…\u003c/label>\u003ctextarea data-k=\"p12a\">\u003c/textarea>\n\u003clabel>I would break a company rule if…\u003c/label>\u003ctextarea data-k=\"p12b\">\u003c/textarea>\n\u003clabel>I would never… even if my job depended on it.\u003c/label>\u003ctextarea data-k=\"p12c\">\u003c/textarea>\n\u003clabel>The challenge my group gave me, and my revised sentence\u003c/label>\u003ctextarea data-k=\"p12rev\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p13\">\n\u003ch2>13 · Exit ticket · Class 2\u003c/h2>\n\u003clabel>One thing employees owe employers\u003c/label>\u003cinput type=\"text\" data-k=\"p13a\">\n\u003clabel>One thing an employer can never ask of an employee\u003c/label>\u003cinput type=\"text\" data-k=\"p13b\">\n\u003clabel>My confidence with this week's ideas\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p13c\" data-k=\"p13c\" value=\"1\"> 1 · Still confused\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p13c\" data-k=\"p13c\" value=\"2\"> 2\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p13c\" data-k=\"p13c\" value=\"3\"> 3\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p13c\" data-k=\"p13c\" value=\"4\"> 4 · I could explain it\u003c/label>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p14\">\n\u003ch2>14 · Homework: Journal #4\u003c/h2>\n\u003cp>\u003cb>Should Ari report the altered data to the regulator before the internal review is finished?\u003c/b> Write one paragraph (200–250 words):\u003c/p>\n\u003col>\u003cli>Your position\u003c/li>\u003cli>Two reasons, at least one using an ethical framework (utilitarian, Kantian, virtue, Rawls)\u003c/li>\u003cli>Evidence from the case\u003c/li>\u003cli>The strongest counterargument\u003c/li>\u003cli>Your rebuttal\u003c/li>\u003cli>A conclusion\u003c/li>\u003c/ol>\n\u003cp>Use at least four terms from this week (e.g., duty of loyalty, internal channels, retaliation, whistleblowing, confidentiality, conflict of interest).\u003c/p>\n\u003ctextarea class=\"lg\" data-k=\"p14\" id=\"journal\">\u003c/textarea>\n\u003cdiv class=\"wc\" id=\"wc\">0 words\u003c/div>\n\u003cp>\u003cb>Also:\u003c/b> read 8.1 (from p. 231) before Week 8.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"lang\">\n\u003ch2>Language bank\u003c/h2>\n\u003ch3>Collocations\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>owe a duty to\u003c/span>\u003cspan>act in good faith\u003c/span>\u003cspan>a breach of confidentiality\u003c/span>\u003cspan>sign / enforce a non-compete\u003c/span>\u003cspan>leak / disclose information\u003c/span>\u003cspan>raise a concern with\u003c/span>\u003cspan>go through proper channels\u003c/span>\u003cspan>blow the whistle on\u003c/span>\u003cspan>turn a blind eye to\u003c/span>\u003cspan>face retaliation\u003c/span>\u003cspan>speak up\u003c/span>\u003cspan>cut corners\u003c/span>\u003c/div>\n\u003ch3>Debate\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>On balance, I'd argue that…\u003c/span>\u003cspan>That assumes…, but…\u003c/span>\u003cspan>What evidence supports that?\u003c/span>\u003cspan>From a utilitarian perspective, …\u003c/span>\u003cspan>A Kantian would object that…\u003c/span>\u003cspan>Our opponents argued that… However, …\u003c/span>\u003cspan>Even if that were true, …\u003c/span>\u003cspan>We accept that…, but…\u003c/span>\u003c/div>\n\u003ch3>Talking about past choices\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>If she had gone to the SEC, she would have been protected.\u003c/span>\u003cspan>Had he stayed silent, …\u003c/span>\u003cspan>If Krawcheck had kept quiet, she might still be…\u003c/span>\u003c/div>\n\u003ch3>Pronunciation\u003c/h3>\n\u003cp>fiduciary (fi-DOO-shee-air-ee) · qui tam (kwee TAHM) · solicitation (suh-lis-i-TAY-shun) · disparage (dis-PAIR-ij) · retaliation (ri-tal-ee-AY-shun)\u003c/p>\n\u003c/section>\n\u003cp class=\"src\">Textbook: Byars & Stanberry, \u003ci>Business Ethics\u003c/i>, OpenStax (CC BY 4.0). Readings A and B are adapted summaries. Corvane Medical and Ari Moreno are fictional.\u003c/p>\n\u003c/div>\n\n\n\n\u003cscript>\nconst GZ=[\n[\"1\",\"A copier vendor gives you a $150 gift card. Next week you choose which company's copiers your office will buy.\",\"7.4\"],\n[\"2\",\"A friend tells you her company will be bought next week. You buy shares in her company.\",\"7.4\"],\n[\"3\",\"Abroad, a customs officer asks for $20 to process your already-approved shipment today instead of next week.\",\"7.4\"],\n[\"4\",\"You post a funny video of a mistake in your restaurant's kitchen. You are wearing the restaurant's uniform.\",\"7.2\"],\n[\"5\",\"A regular customer makes sexual comments to you. Your manager says, \\\"Just serve him, he tips well.\\\"\",\"7.2\"],\n[\"6\",\"A new hire from your main rival tells you the rival's new prices for a bid you're both making. No nondisclosure agreement was broken.\",\"7.4\"],\n[\"7\",\"You discuss salaries with three coworkers. Your manager says this is against company policy.\",\"7.5\"],\n[\"8\",\"You post an angry anonymous review online attacking your manager's personality.\",\"7.5\"]];\ndocument.getElementById('gz').innerHTML=GZ.map(g=>`\u003cdiv class=\"cardq\">\u003cp>\u003cspan class=\"pill g\">Card ${g[0]}\u003c/span> ${g[1]} \u003ca class=\"src\" href=\"${({\"7.2\":\"https://openstax.org/books/business-ethics/pages/7-2-loyalty-to-the-brand-and-to-customers\",\"7.4\":\"https://openstax.org/books/business-ethics/pages/7-4-financial-integrity\",\"7.5\":\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\"})[g[2]]}\" target=\"_blank\" rel=\"noopener\">(${g[2]})\u003c/a>\u003c/p>\n\u003cdiv class=\"opt\">${['OK','Not OK','It depends'].map(v=>`\u003clabel>\u003cinput type=\"radio\" name=\"gz${g[0]}\" data-k=\"gz${g[0]}\" value=\"${v}\"> ${v}\u003c/label>`).join('')}\u003c/div>\n\u003cinput type=\"text\" data-k=\"gz${g[0]}c\" placeholder=\"Rule or concept…\">\u003c/div>`).join('');\nconst M=[[\"Bradley Birkenfeld (UBS)\",\"b\"],[\"John Kopchinski (Pfizer)\",\"a\"],[\"Sherron Watkins (Enron)\",\"d\"],[\"Sallie Krawcheck (Merrill Lynch)\",\"c\"]];\nconst MO={a:\"Received about $50 million\",b:\"Received $104 million AND went to prison\",c:\"Persuaded the CEO to repay investors, then was \\\"reorganized out\\\"\",d:\"Had no whistleblower protection; never worked in corporate America again\"};\ndocument.getElementById('match').innerHTML=M.map((m,i)=>`\u003cdiv class=\"cardq\">\u003cp>\u003cb>${m[0]}\u003c/b>\u003c/p>\u003cselect data-k=\"m${i}\" data-ans=\"${m[1]}\" class=\"chk-m\">\u003coption value=\"\">Choose…\u003c/option>${Object.entries(MO).map(([k,v])=>`\u003coption value=\"${k}\">${v}\u003c/option>`).join('')}\u003c/select>\u003cspan class=\"res\">\u003c/span>\u003c/div>`).join('');\nconst S=[[\"Discuss your pay with coworkers\",\"R\"],[\"Keep trade secrets confidential\",\"P\"],[\"Quit your job at any time (at-will)\",\"R\"],[\"Avoid conflicts of interest\",\"P\"],[\"Be protected from harassment, including by customers\",\"R\"],[\"Give your best effort\",\"P\"],[\"Report legal violations to a government agency\",\"R\"],[\"Not trade shares using inside information\",\"P\"],[\"Follow the company's code of conduct\",\"P\"],[\"Criticize the company\",\"B\"],[\"Take a second job\",\"B\"],[\"Follow a non-compete after you leave\",\"B\"]];\nconst SO={R:\"Employee's right\",P:\"Employee's responsibility\",B:\"Both / depends\"};\ndocument.getElementById('sort').innerHTML=S.map((s,i TABS.forEach(t=>{const b=document.createElement('button');b.textContent=t.label;b.dataset.id=t.id;b.onclick=()=>open(t.id);nav.appendChild(b)});
const ext=document.createElement('a');ext.target='_blank';ext.rel='noopener';ext.textContent='Open in new tab';nav.appendChild(ext);
function open(id){const t=TABS.find(x=>x.id===id)||TABS[0];let f=document.getElementById('f-'+t.id);
 if(!f){f=document.createElement('iframe');f.id='f-'+t.id;f.title=t.label;f.srcdoc=DOCS[t.id].split('src="logo.png"').join('src="'+DOCS.__logo+'"');main.appendChild(f)}
 document.querySelectorAll('iframe').forEach(x=>x.classList.toggle('on',x===f));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===t.id));
 ext.href=t.file;try{history.replaceState(null,'','#'+t.id)}catch(e){}}
