<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 7 Teachers</title><style>
:root{--navy:#143865;--gold:#d39f10;--sky:#c1cddd;--sky3:#edf2f9}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--sky3)}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}
.top img{width:40px;height:40px;border-radius:6px}.top .t{font-weight:700;font-size:17px;line-height:1.2}.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}
.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--sky);padding:6px 10px;align-items:center}
nav button{font:inherit;font-size:15px;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--navy);white-space:nowrap}
nav button.on{background:var(--navy);color:#fff}
nav a{margin-left:auto;font-size:13px;color:var(--navy);white-space:nowrap;padding-left:10px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}iframe.on{display:block}
@media (max-width:600px){.top .t small{display:none}.top .t{font-size:14px}nav button{font-size:14px;padding:7px 9px}}
</style></head><body>

;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Teacher\u003c/span>\u003c/header>\n\u003cdiv class=\"wrap\">\n\u003ch1>Week 7 Teacher Guide\u003c/h1>\n\u003cp class=\"lead\">Chapter 7: What Employees Owe Employers · \"Loyal to whom?\" · Class 1 9:00–10:40 · Break 10:40–11:10 · Class 2 11:10–12:50\u003c/p>\n\n\u003csection class=\"noprint\">\n\u003ch2>Contents\u003c/h2>\n\u003col class=\"toc\">\n\u003cli>\u003ca href=\"#overview\">Week at a glance\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#goals\">Learning goals\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#concepts\">Key concepts and book pages\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#vocab\">Essential vocabulary and language\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#bigq\">Big ethical questions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#materials\">Materials (textbook and outside sources)\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#c1\">Class 1: What do you owe?\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#bridge\">The bridge\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#c2\">Class 2: When loyalty and conscience collide\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#lang\">Discussion and debate language\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#hw\">Homework: Journal #4\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#check\">Check for understanding (Quiz 3 practice)\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#align\">How Week 7 builds toward the assessments\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#prep\">Materials to prepare\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#keys\">Answer keys and model answers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#flags\">Notes and flags\u003c/a>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"overview\">\n\u003ch2>Week at a glance\u003c/h2>\n\u003cp>Week 6 looked at what employers owe employees. This week flips the relationship. Class 1 asks what a good employee owes the company: loyalty, confidentiality, honesty with money, respect for the brand and for customers. Class 2 asks what happens when those duties collide with conscience, and when it is right to break company rules or \"blow the whistle.\"\u003c/p>\n\u003cp>One fictional case runs through both classes. \u003cb>Ari Moreno\u003c/b>, a quality engineer at \u003cb>Corvane Medical\u003c/b>, finds altered test data at the end of Class 1. In Class 2, students judge Ari's options and then debate them.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clock\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Activity\u003c/th>\u003cth>Syllabus link\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd colspan=\"4\">\u003cb>Class 1 · What do you owe? (9:00–10:40)\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:00–9:12\u003c/td>\u003ctd>Engage\u003c/td>\u003ctd>Loyal or not? Spectrum line\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:12–9:24\u003c/td>\u003ctd>Study\u003c/td>\u003ctd>Loyalty is a two-way street\u003c/td>\u003ctd>Workplace rights and responsibilities\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:24–9:49\u003c/td>\u003ctd>Study\u003c/td>\u003ctd>Paired reading: loyalty vs. whistleblowing\u003c/td>\u003ctd>Paired reading\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:49–10:15\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>Clause Clinic: negotiate an employment contract\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:15–10:33\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>Gray Zone speed rounds\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:33–10:40\u003c/td>\u003ctd>Bridge\u003c/td>\u003ctd>Corvane, Part 1 and exit ticket\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd colspan=\"4\">\u003cb>Class 2 · When loyalty and conscience collide (11:10–12:50)\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:10–11:20\u003c/td>\u003ctd>Engage\u003c/td>\u003ctd>Your votes, and the price of speaking up\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:20–11:30\u003c/td>\u003ctd>Study\u003c/td>\u003ctd>The whistleblower's ladder and five tests\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:30–11:50\u003c/td>\u003ctd>Study\u003c/td>\u003ctd>Case files: three real whistleblowers\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:50–12:28\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>Debate: Should Ari go to the regulator?\u003c/td>\u003ctd>Debate: breaking company rules\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:28–12:36\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>Rights or responsibilities? Sort race\u003c/td>\u003ctd>Vocabulary\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:36–12:47\u003c/td>\u003ctd>Activate\u003c/td>\u003ctd>My red lines\u003c/td>\u003ctd>Personal Code of Ethics (seed)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:47–12:50\u003c/td>\u003ctd>Close\u003c/td>\u003ctd>Exit ticket and homework\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Reading for students:\u003c/b> the worksheet opens with a \"What to read in the book\" table that links each section (with pages) to the activity that uses it. A Chapter 7 summary is a separate tab on both the student and teacher pages.\u003c/p>\n\u003cp>\u003cb>Assessment this week:\u003c/b> none. Quiz 3 is next week and covers Chapters 6–8, so the check questions at the end of this guide double as Quiz 3 practice.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"goals\">\n\u003ch2>Learning goals\u003c/h2>\n\u003cp>By the end of Week 7, students will be able to:\u003c/p>\n\u003col>\n\u003cli>Explain the main duties an employee owes an employer (loyalty, best effort, confidentiality, avoiding conflicts of interest, financial integrity) and why loyalty should be a two-way street.\u003c/li>\n\u003cli>Judge whether common employment clauses (non-compete, nonsolicitation, nondisclosure, nondisparagement) are fair for different kinds of workers.\u003c/li>\n\u003cli>Tell apart criticism that is usually protected (about pay, hours and conditions, made with coworkers) from criticism that usually is not (purely personal attacks, false posts).\u003c/li>\n\u003cli>Apply the book's tests for responsible whistleblowing to real cases, and compare how the U.S., the EU and Japan protect whistleblowers.\u003c/li>\n\u003cli>Build an argument with a counterargument and a rebuttal in a formal debate, and in writing (Journal #4).\u003c/li>\n\u003cli>\u003cb>Language:\u003c/b> use modals of obligation and entitlement (\u003ci>owe, be obliged to, be entitled to, ought to\u003c/i>) and third and mixed conditionals for past decisions (\"If she had gone to the SEC, she would have been protected\").\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"concepts\">\n\u003ch2>Key concepts and book pages\u003c/h2>\n\u003cp>Book: \u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 7, pages 195–230. Links go to the free online book.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>Ideas you need this week\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\">7.1 Loyalty to the Company\u003c/a>\u003c/td>\u003ctd>196–202\u003c/td>\u003ctd>Duty of loyalty (don't act against the employer, no conflicts of interest, no competing second job); fiduciary duty for trusted employees; Bidwell's two parts of loyalty; at-will employment; loyalty as a two-way street; retention bonuses; confidentiality, trade secrets, intellectual property; non-compete, nonsolicitation, nondisparagement clauses; Jimmy John's case; California's ban\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-2-loyalty-to-the-brand-and-to-customers\">7.2 Loyalty to the Brand and to Customers\u003c/a>\u003c/td>\u003ctd>203–206\u003c/td>\u003ctd>Brand and branding; employees damaging brands online (Taco Bell, Domino's, Burger King Japan); internal marketing; obligations to customers; Kathy Fryman; Pizza Hut harassment case (Lockard): good service does not mean accepting harassment\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-3-contributing-to-a-positive-work-atmosphere\">7.3 Contributing to a Positive Work Atmosphere\u003c/a>\u003c/td>\u003ctd>207–211\u003c/td>\u003ctd>Respect for coworkers (\"principles, not personalities\"); work styles and workplace personalities; four types of workplace violence; codes of conduct (Table 7.1); cybersecurity; harassment\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-4-financial-integrity\">7.4 Financial Integrity\u003c/a>\u003c/td>\u003ctd>212–217\u003c/td>\u003ctd>Insider trading (insiders, outsiders, \"messengers\"; Texas Gulf Sulphur; Drexel Burnham Lambert); bribes and gifts; Foreign Corrupt Practices Act and its \"grease payment\" exception; ethical leadership\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\">7.5 Criticism of the Company and Whistleblowing\u003c/a>\u003c/td>\u003ctd>218 onward\u003c/td>\u003ctd>Pay secrecy limited by the NLRA; social media criticism (Adrian Duane and IXL); whistleblowing risks, ethical guidance and legal protection; False Claims Act and qui tam rewards; Watkins (Enron) and Krawcheck (Merrill Lynch); the defense contractor dilemma\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp class=\"src\">Page numbers are each section's start page in the textbook's table of contents. Section 7.5 starts on p. 218 and is followed by the end-of-chapter pages (key terms, summary, questions); Chapter 8 starts on p. 231.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Coverage choice:\u003c/b> The syllabus centers on loyalty and whistleblowing, so 7.1 and 7.5 get the most time. Sections 7.2, 7.3 and 7.4 come in through the Gray Zone cards, the Clause Clinic and the sort race. Workplace violence (7.3) is not used in an activity; it appears only in the study notes.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"vocab\">\n\u003ch2>Essential vocabulary and language\u003c/h2>\n\u003ch3>Core terms (taught through use, not a list)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning in plain words\u003c/th>\u003cth>Where students use it\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>duty of loyalty\u003c/td>\u003ctd>the legal and ethical duty not to act against your employer's interests\u003c/td>\u003ctd>Spectrum line, paired reading\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>conflict of interest\u003c/td>\u003ctd>a situation where your personal gain could affect your work decisions\u003c/td>\u003ctd>Gray Zone\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>moonlighting\u003c/td>\u003ctd>having a second job, usually after hours\u003c/td>\u003ctd>Spectrum line, Clause Clinic\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>at-will employment\u003c/td>\u003ctd>either side can end the job at any time for any legal reason\u003c/td>\u003ctd>Two-way street\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>fiduciary duty\u003c/td>\u003ctd>a higher duty of trust owed by people with authority or secret information (review from Ch. 1)\u003c/td>\u003ctd>Paired reading\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>confidentiality / trade secret\u003c/td>\u003ctd>keeping company information private / valuable information a company keeps secret\u003c/td>\u003ctd>Clause Clinic\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>intellectual property\u003c/td>\u003ctd>ideas protected by patent, copyright or trademark\u003c/td>\u003ctd>Clause Clinic\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>non-compete agreement\u003c/td>\u003ctd>a promise not to work for a competitor during or after the job\u003c/td>\u003ctd>Clause Clinic\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nonsolicitation / nondisparagement clause\u003c/td>\u003ctd>a promise not to take clients or coworkers with you / not to damage the company's reputation\u003c/td>\u003ctd>Clause Clinic\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>internal marketing\u003c/td>\u003ctd>getting employees to believe in the company's product\u003c/td>\u003ctd>Gray Zone\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>insider trading\u003c/td>\u003ctd>trading shares using important information the public doesn't have\u003c/td>\u003ctd>Gray Zone\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>bribe / grease payment\u003c/td>\u003ctd>a payment for an improper act / a small payment to speed up a routine task\u003c/td>\u003ctd>Gray Zone\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pay secrecy\u003c/td>\u003ctd>a rule that stops employees from discussing pay\u003c/td>\u003ctd>Gray Zone, sort race\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>whistleblowing\u003c/td>\u003ctd>reporting your employer's illegal conduct to a government agency\u003c/td>\u003ctd>Class 2 throughout\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>retaliation\u003c/td>\u003ctd>punishment for reporting or complaining\u003c/td>\u003ctd>Case files, debate\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>qui tam\u003c/td>\u003ctd>a False Claims Act rule that lets a private person sue for the government and share the money recovered\u003c/td>\u003ctd>Price of speaking up\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Collocations\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>owe a duty to\u003c/span>\u003cspan>act in good faith\u003c/span>\u003cspan>a breach of confidentiality\u003c/span>\u003cspan>sign / enforce a non-compete\u003c/span>\u003cspan>leak / disclose information\u003c/span>\u003cspan>raise a concern with\u003c/span>\u003cspan>go through proper channels\u003c/span>\u003cspan>blow the whistle on\u003c/span>\u003cspan>turn a blind eye to\u003c/span>\u003cspan>face retaliation\u003c/span>\u003cspan>speak up / speak out\u003c/span>\u003cspan>cut corners\u003c/span>\u003c/div>\n\u003ch3>Words students may misunderstand\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>whistleblower\u003c/b> has nothing to do with sports referees here. Ask: \"Who blows a whistle, and why? Why is that a good image for this?\"\u003c/li>\n\u003cli>\u003cb>at will\u003c/b> does not mean \"willing.\" It means \"whenever either side chooses.\"\u003c/li>\n\u003cli>\u003cb>solicit\u003c/b> (to try to get customers or staff) vs. \u003cb>solicitor\u003c/b> (a British lawyer).\u003c/li>\n\u003cli>\u003cb>disclose\u003c/b> (make public) vs. \u003cb>enclose\u003c/b> (put inside). \u003cb>discreet\u003c/b> (careful) vs. \u003cb>discrete\u003c/b> (separate).\u003c/li>\n\u003cli>\u003cb>loyal\u003c/b> vs. \u003cb>royal\u003c/b> (L/R learners). \u003cb>owe\u003c/b> (rhymes with \"go\") is not \"own.\"\u003c/li>\n\u003c/ul>\n\u003ch3>Pronunciation\u003c/h3>\n\u003cp>fiduciary (fi-DOO-shee-air-ee) · qui tam (kwee TAHM) · solicitation (suh-lis-i-TAY-shun) · disparage (dis-PAIR-ij) · retaliation (ri-tal-ee-AY-shun) · confidentiality (con-fi-den-shee-AL-i-tee)\u003c/p>\n\u003ch3>Grammar in context\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Obligation and entitlement:\u003c/b> \"Employees \u003ci>owe\u003c/i> their employer… / are \u003ci>obliged to\u003c/i>… / are \u003ci>entitled to\u003c/i>… / \u003ci>ought to\u003c/i>… / \u003ci>are not required to\u003c/i>…\"\u003c/li>\n\u003cli>\u003cb>Third and mixed conditionals\u003c/b> for judging past decisions (Class 2 case files): \"If Watkins \u003ci>had gone\u003c/i> to the SEC, she \u003ci>would have been\u003c/i> protected.\" \"If Krawcheck \u003ci>had stayed\u003c/i> quiet, she \u003ci>might still be\u003c/i> at the bank.\"\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"bigq\">\n\u003ch2>Big ethical questions\u003c/h2>\n\u003col>\n\u003cli>Is loyalty to an employer a virtue, a contract, or a trade?\u003c/li>\n\u003cli>If the employer can fire you \"at will,\" what do you still owe it?\u003c/li>\n\u003cli>Who owns what you know when you leave a job?\u003c/li>\n\u003cli>When does keeping a secret become covering up?\u003c/li>\n\u003cli>When is it right to break company rules, and to whom do you report?\u003c/li>\n\u003cli>How much should a person have to sacrifice to tell the truth?\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"materials\">\n\u003ch2>Materials\u003c/h2>\n\u003ch3>Textbook (primary source)\u003c/h3>\n\u003cul>\n\u003cli>7.1: Duty of loyalty, Differing Concepts of Loyalty, Confidentiality, Jimmy John's case, Figure 7.4 sample clauses (Partner A reading, Clause Clinic)\u003c/li>\n\u003cli>7.5: Whistleblowing: Risks and Rewards, Watkins and Krawcheck cases (Partner B reading, Case files)\u003c/li>\n\u003cli>7.2, 7.4, 7.5 boxes for the Gray Zone cards (each card names its section)\u003c/li>\n\u003c/ul>\n\u003ch3>Outside sources (clearly marked as not from the textbook)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Source\u003c/th>\u003cth>Used for\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Federal Trade Commission ended its appeal on September 5, 2025, so the national non-compete ban will not take effect; non-competes are now mainly a state-law question, and the FTC says it will act case by case (\u003ca href=\"https://foleyhoag.com/news-and-insights/publications/alerts-and-updates/2025/september/trump-administration-ends-ftcs-attempt-to-ban-noncompetes/\">Foley Hoag\u003c/a>, \u003ca href=\"https://www.paulweiss.com/insights/client-memos/ftc-shifts-approach-to-non-compete-enforcement\">Paul Weiss\u003c/a>)\u003c/td>\u003ctd>Clause Clinic debrief (updates the book, which only says a court struck the rule down)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Boeing quality engineer Sam Salehpour went public in April 2024 and testified to a Senate subcommittee about 787 and 777 assembly shortcuts and retaliation (\u003ca href=\"https://www.wamc.org/2024-04-09/a-boeing-whistleblower-raises-fresh-concerns-about-the-787-and-the-faa-investigates\">NPR via WAMC\u003c/a>, \u003ca href=\"https://fortune.com/2024/04/16/boeing-whistleblower-787-dreamliner-panels/\">Fortune\u003c/a>, \u003ca href=\"https://dc.fortune.com/2024/04/17/boeing-whistleblower-sam-salehpour-safety-faa-senate-hearing\">Fortune\u003c/a>)\u003c/td>\u003ctd>Case file C (a recent case to sit beside the book's older ones)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SEC whistleblower program, fiscal year 2025: about $60 million to 48 people and about 27,000 tips, down from $255 million in FY2024 (\u003ca href=\"https://www.phillipsandcohen.com/?p=76452\">Phillips & Cohen summary\u003c/a> of the \u003ca href=\"https://sec.gov/files/fy25-annual-whistleblower-report.pdf\">SEC report\u003c/a>)\u003c/td>\u003ctd>Price of speaking up, ladder mini-input\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>EU Whistleblower Directive 2019/1937: a three-tier system (internal, regulator, public); internal reporting is encouraged but not required (\u003ca href=\"https://paulhastings.com/insights/client-alerts/new-eu-directive-enhancing-the-protection-of-whistleblowers\">Paul Hastings\u003c/a>)\u003c/td>\u003ctd>Global comparison in the ladder mini-input\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Japan's 2025 amendment to its Whistleblower Protection Act adds criminal penalties for retaliation (companies up to ¥30 million) and takes effect December 1, 2026 (\u003ca href=\"https://www.bakermckenzie.com/en/insight/publications/2026/04/japan-2026-guidelines-update-for-whistleblower-protection-act\">Baker McKenzie\u003c/a>, \u003ca href=\"https://chambers.com/articles/summary-of-the-2025-amendments-to-the-whistleblower-protection-act\">Chambers\u003c/a>)\u003c/td>\u003ctd>Global comparison: happening two weeks after this class\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Fictional:\u003c/b> Corvane Medical, Ari Moreno, the FlowSure pump and the Clause Clinic contract are invented for this course.\u003c/p>\n\u003c/section>\n\n\u003c!-- ================= CLASS 1 ================= -->\n\u003csection id=\"c1\">\n\u003ch2>Class 1 · What do you owe? (9:00–10:40)\u003c/h2>\n\n\u003cdiv class=\"activity\" id=\"c1a\">\n\u003ch3>9:00–9:12 · Engage: Loyal or not? Spectrum line\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Surface students' ideas of loyalty before the reading; create disagreement\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>12 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Whole class standing, then pairs\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slide 3–4; two signs on opposite walls: FINE / DISLOYAL; worksheet Part 1\u003c/div>\u003c/div>\n\u003cp>\u003cb>Teacher instructions.\u003c/b> Put FINE on one wall and DISLOYAL on the other. The space between is a line. Read one situation at a time. Students stand where their opinion is, then talk to the person next to them. Don't give answers yet; the reading will.\u003c/p>\n\u003cp>\u003cb>Student instructions (slide):\u003c/b> \"Stand on the line where your opinion is. Then tell the person next to you why you are standing there.\"\u003c/p>\n\u003col>\n\u003cli>\u003cb>1 min.\u003c/b> Explain the line. Do the first statement together.\u003c/li>\n\u003cli>\u003cb>8 min.\u003c/b> Read statements 1–6 (about 80 seconds each). After each, ask one person near each end: \"Why are you standing there?\" For statement 4, ask someone in the middle.\n\u003col type=\"a\">\n\u003cli>You apply for other jobs during your lunch break.\u003c/li>\n\u003cli>You start a weekend web design business. Your day job is graphic designer at an advertising agency.\u003c/li>\n\u003cli>When you leave, you take your list of client contacts with you.\u003c/li>\n\u003cli>You tell three coworkers how much you earn.\u003c/li>\n\u003cli>You accept two free concert tickets from a supplier you buy from.\u003c/li>\n\u003cli>You post a joke about your boss on social media. You don't name the company.\u003c/li>\n\u003c/ol>\u003c/li>\n\u003cli>\u003cb>3 min.\u003c/b> Pairs sit down and complete worksheet Part 1: which statement was hardest, and what does it depend on?\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"say\">Most of you said \"It depends.\" Today we'll find out what it depends on. Some of these are a question of ethics, some of the law, and one of them is protected by U.S. law even if your boss hates it.\u003c/div>\n\u003cp>\u003cb>Expected outcome:\u003c/b> wide spread on (a), (d) and (f); most near DISLOYAL on (c). Statement (b) is the book's example in 7.1. Statement (d) is protected under the NLRA (7.5). Students find out in the Gray Zone.\u003c/p>\n\u003ch4>Debrief questions\u003c/h4>\n\u003cul>\u003cli>Which statement moved people the most when they heard the reasons?\u003c/li>\u003cli>Is \"disloyal\" the same as \"illegal\"? Give an example where they are different.\u003c/li>\u003cli>Did anyone's profession change their position? (A lawyer and a chef may answer (b) differently.)\u003c/li>\u003c/ul>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>It depends on whether…\u003c/span>\u003cspan>That's only disloyal if…\u003c/span>\u003cspan>I'd draw the line at…\u003c/span>\u003cspan>In my field, that would be seen as…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1b\">\n\u003ch3>9:12–9:24 · Study: Loyalty is a two-way street\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Give the core concepts (duty of loyalty, at-will, two-way loyalty) and connect them to students' professions\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>12 min (4 input + 6 pairs + 2 share)\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Pairs from different professions or countries\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 5–6; worksheet Part 2\u003c/div>\u003c/div>\n\u003cp>\u003cb>4-minute input (slides 5–6).\u003c/b> Keep it short. Teaching notes:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Duty of loyalty (7.1, p. 196 onward).\u003c/b> In all fifty U.S. states, the common law says employees must not act against the employer's interests: work in good faith, avoid conflicts of interest, and no competing second job without consent. People with more trust and authority owe more: a \u003cb>fiduciary duty\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Two parts of loyalty.\u003c/b> Wharton professor Matthew Bidwell: (1) having the employer's interests at heart, and (2) staying with the same employer. Part 1 is still expected. Part 2 has weakened: the book cites a Forbes HR Council survey that millennials are three times more likely to change jobs, and about 91% don't expect to stay more than three years.\u003c/li>\n\u003cli>\u003cb>At-will employment.\u003c/b> Most U.S. workers have no contract. The employer can fire them at any time for any legal reason, and they can quit at any time. The book says this freedom mostly favors the employer.\u003c/li>\n\u003cli>\u003cb>The book's position.\u003c/b> Loyalty should be a \u003cb>two-way street\u003c/b>: built on obligations on both sides, shown through pay, benefits and recognition. Week 6 was the employer's side of the street.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Pair task (6 min, worksheet Part 2 \"Loyalty map\").\u003c/b> Pairs compare, from their own profession and workplaces:\u003c/p>\n\u003col>\u003cli>How long should someone stay in a job to be seen as loyal?\u003c/li>\u003cli>Is it disloyal to look for a new job while employed? Would you tell your manager?\u003c/li>\u003cli>Name one thing an employer did that earned (or lost) your loyalty.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Share (2 min).\u003c/b> Ask two pairs with the biggest difference to report. Write the two numbers (years) on the board.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Cultural care:\u003c/b> Ask \"In workplaces you know…\" not \"In your country…\". Lifetime employment, family businesses and public-sector jobs can all change the answer within one country.\u003c/div>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>Where I worked, leaving after a year would signal…\u003c/span>\u003cspan>Loyalty there meant… rather than…\u003c/span>\u003cspan>What earned my loyalty was…\u003c/span>\u003cspan>The employer owes… in return for…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1c\">\n\u003ch3>9:24–9:49 · Study: Paired reading: loyalty vs. whistleblowing\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Cover the two central sections through reading and peer teaching (syllabus: paired reading)\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>25 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Pairs: Partner A and Partner B\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Textbook 7.1 and 7.5 (or the adapted readings in the worksheet, Part 3); slides 7–8\u003c/div>\u003c/div>\n\u003cp>\u003cb>Teacher instructions.\u003c/b> Each pair splits the reading. Partner A becomes the expert on loyalty, Partner B on whistleblowing. They then teach each other and fill an information-gap table. The two readings deliberately pull in opposite directions; that tension sets up Class 2.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>\u003c/th>\u003cth>Partner A · Loyalty\u003c/th>\u003cth>Partner B · Whistleblowing\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Book\u003c/td>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\" target=\"_blank\" rel=\"noopener\">7.1\u003c/a>, from \"A Duty of Loyalty\" to the end of \"Other Clauses\" (pp. 196–202). Skip the \"What Would You Do?\" box.\u003c/td>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">7.5\u003c/a>, \"Whistleblowing: Risks and Rewards\" to the end of the Krawcheck case (from p. 218)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Worksheet\u003c/td>\u003ctd>Reading A (adapted summary with page references)\u003c/td>\u003ctd>Reading B (adapted summary with page references)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Words to gloss\u003c/td>\u003ctd>refrain, good faith, consent, proprietary, enforceable, punitive\u003c/td>\u003ctd>blacklisting, altruism, steward, relator, intervene, irregularities\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>\u003cb>2 min · Prediction.\u003c/b> Ask pairs: \"Can a person be loyal and a whistleblower at the same time?\" Quick yes/no show of hands. Remember the count.\u003c/li>\n\u003cli>\u003cb>11 min · Read.\u003c/b> Each partner reads their part and answers the four guide questions in the worksheet. Partners A sit together and Partners B sit together for the last 3 minutes to check answers (\"expert huddle\").\u003c/li>\n\u003cli>\u003cb>9 min · Teach.\u003c/b> Back in pairs. A teaches first (4 min) while B fills the gap table. Then B teaches (4 min). The listener must ask one \"Why?\" or \"What if?\" question. 1 min to agree on the pair's answer to the prediction question.\u003c/li>\n\u003cli>\u003cb>3 min · Whole class.\u003c/b> Repeat the yes/no vote. Did anyone change? Take two reasons.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Expected outcome:\u003c/b> students can name 3+ employee duties, 2 contract clauses, the book's 5 pieces of guidance for whistleblowers, and why Watkins had no legal protection.\u003c/p>\n\u003ch4>Debrief questions\u003c/h4>\n\u003cul>\u003cli>Reading A says employees must not act against the employer's interests. Is reporting the employer to the government \"acting against\" it? Whose interests?\u003c/li>\u003cli>Bidwell's first part of loyalty is \"having the employer's interests at heart.\" Is a whistleblower ever doing exactly that?\u003c/li>\u003c/ul>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>The main point of my section is…\u003c/span>\u003cspan>According to the book (p. ___)…\u003c/span>\u003cspan>An example the book gives is…\u003c/span>\u003cspan>What surprised me was…\u003c/span>\u003cspan>So would you say that…?\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1d\">\n\u003ch3>9:49–10:15 · Activate: Clause Clinic\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Apply 7.1 to real contract language; negotiate; test fairness with Rawls's veil of ignorance\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>26 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Groups of 4: two \"employee side,\" two \"HR side\"\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Handout 2 (Corvane contract + 3 role cards), worksheet Part 4, slides 9–11\u003c/div>\u003c/div>\n\u003cp>\u003cb>Setup.\u003c/b> Every group gets the same six-clause Corvane Medical employment agreement and \u003cb>one\u003c/b> role card: A) assembly-line technician ($38,000 a year), B) senior research engineer with access to device designs, C) vice president of sales who owns the main client relationships. Give at least two groups each role if you can, so you can compare.\u003c/p>\n\u003cp>\u003cb>Student instructions (slide):\u003c/b> \"You are negotiating the contract for this one person. For each clause, decide: keep, change or delete. HR wants to protect the company. The employee side wants freedom to work. You must agree on every clause.\"\u003c/p>\n\u003col>\n\u003cli>\u003cb>3 min.\u003c/b> Read the role card and the contract. Teacher reads clause 3 (non-compete) aloud and checks understanding: \"What can't this person do? For how long? Where?\"\u003c/li>\n\u003cli>\u003cb>12 min.\u003c/b> Negotiate. Groups record keep/change/delete and a reason in the worksheet table. They must rewrite at least one clause in their own words.\u003c/li>\n\u003cli>\u003cb>3 min · Rawls test.\u003c/b> \"Behind the veil of ignorance you don't know if you will be the technician, the engineer or the VP. Would you still sign your version?\" Groups adjust if needed.\u003c/li>\n\u003cli>\u003cb>8 min · Report and debrief.\u003c/b> One sentence per group: \"For [role], we deleted/changed ___ because ___.\" Compare roles. Then give the real-world update (slide 11).\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"say\">Here's what actually happens. Jimmy John's asked sandwich makers to promise not to work at any sandwich shop within two miles of any Jimmy John's for two years. After investigations by two state attorneys general, the company agreed in 2016 to stop. California makes most non-competes void. In 2024 the Federal Trade Commission tried to ban most non-competes nationwide. Courts blocked the rule, and in September 2025 the FTC dropped its appeal. So in the U.S. today, it depends on the state.\u003c/div>\n\u003cp>\u003cb>Expected outcome:\u003c/b> Groups delete or sharply limit the non-compete for the technician; keep a narrower one for the engineer; focus on nonsolicitation for the VP. Most groups notice clause 5 (nondisparagement) is too broad. Some will notice it could stop someone from reporting a crime, which sets up Class 2.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>Teacher note on clause 5.\u003c/b> A contract can't stop someone from reporting possible securities violations to the SEC: SEC Rule 21F-17 bans any action, including enforcing a confidentiality agreement, that impedes someone from contacting the SEC. The U.S. Speak Out Act (2022) also makes pre-dispute nondisclosure and nondisparagement clauses unenforceable for sexual harassment and assault disputes. These are outside the textbook; mention them only if a group raises the issue.\u003c/div>\n\u003ch4>Debrief questions\u003c/h4>\n\u003cul>\u003cli>Which clause changed the most between roles? Why?\u003c/li>\u003cli>Jimmy John's said non-competes protect business secrets. What secrets does a sandwich maker have?\u003c/li>\u003cli>Is a non-compete for a low-wage worker a loyalty tool, a fear tool, or both?\u003c/li>\u003cli>Clause 5 says \"never say anything negative.\" What if the \"negative\" thing is true and dangerous?\u003c/li>\u003c/ul>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>We could accept it if it were limited to…\u003c/span>\u003cspan>That's reasonable for an engineer, but not for…\u003c/span>\u003cspan>What's the business reason for…?\u003c/span>\u003cspan>Would you agree to… in exchange for…?\u003c/span>\u003cspan>Let's meet in the middle: …\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1e\">\n\u003ch3>10:15–10:33 · Activate: Gray Zone speed rounds\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Cover 7.2, 7.4 and 7.5 quickly through decisions; resolve the opening spectrum statements\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>18 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Two lines facing each other (speed-dating), new partner each round\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Handout 3 (8 Gray Zone cards, one set per pair); worksheet Part 5; slide 12 timer\u003c/div>\u003c/div>\n\u003cp>\u003cb>Teacher instructions.\u003c/b> Students stand in two lines. Each pair gets two cards per round. For each card they decide: \u003cb>OK / Not OK / It depends\u003c/b>, and name the rule or concept from Chapter 7. After each round, one line moves one place to the left.\u003c/p>\n\u003col>\n\u003cli>\u003cb>14 min.\u003c/b> Four rounds of 3.5 minutes, two cards each (cards 1–2, 3–4, 5–6, 7–8). Students note their verdicts in worksheet Part 5.\u003c/li>\n\u003cli>\u003cb>4 min.\u003c/b> Debrief the three cards with the most disagreement. Reveal answers from the key (in \u003ca href=\"#keys\">Answer keys\u003c/a>). Link back: card 7 answers spectrum statement (d); card 8 answers (f).\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Cards (short form):\u003c/b> 1 Gift card from a copier vendor · 2 A friend's tip about a merger · 3 $20 to speed up customs abroad · 4 Funny kitchen video in uniform · 5 \"Serve him, he tips well\" · 6 A rival's prices from a new hire · 7 Talking about salaries · 8 Angry anonymous review about your manager\u003c/p>\n\u003cp>\u003cb>If short on time:\u003c/b> do three rounds (cards 1–6) and give 7–8 as the answers to the spectrum line.\u003c/p>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>That crosses the line because…\u003c/span>\u003cspan>Legally it may be OK, but ethically…\u003c/span>\u003cspan>This is a conflict of interest since…\u003c/span>\u003cspan>It depends on the company's policy and…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c1f\">\n\u003ch3>10:33–10:40 · Bridge: Corvane, Part 1 and exit ticket\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Create a cliffhanger that carries students into Class 2\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>7 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Individual\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slide 13 (case text, also in worksheet Part 6); exit ticket (worksheet or paper slips)\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>3 min.\u003c/b> Read Corvane, Part 1 aloud (slide 13).\u003c/li>\n\u003cli>\u003cb>4 min.\u003c/b> Exit ticket. Students choose Ari's first move (A–F) and write one reason. Collect slips (or ask students to submit the worksheet's exit ticket).\u003c/li>\n\u003c/ol>\n\u003cdetails open>\u003csummary>Corvane, Part 1 (fictional)\u003c/summary>\n\u003cp>Ari Moreno has been a quality engineer at Corvane Medical for six years. Corvane is a mid-size company of 900 employees that makes infusion pumps, the machines hospitals use to give patients medicine through a drip. Ari likes the work and the team, and Corvane paid for Ari's master's degree.\u003c/p>\n\u003cp>The new pump, FlowSure 2, must be delivered to a large hospital group in three weeks. It is Corvane's biggest contract ever. While checking files, Ari finds that the results of one safety test were changed. The original data showed that in about 1 in 400 tests, the pump gave a higher dose than it was set to. The submitted data show no errors. The change was approved by Ari's manager, Dana.\u003c/p>\n\u003cp>Ari has signed the Corvane employment agreement you saw in the Clause Clinic, including the confidentiality and nondisparagement clauses.\u003c/p>\n\u003c/details>\n\u003cp>\u003cb>Exit ticket:\u003c/b> Ari's first move should be… \u003cb>A\u003c/b> say nothing and keep checking · \u003cb>B\u003c/b> talk to Dana directly · \u003cb>C\u003c/b> go to Dana's boss · \u003cb>D\u003c/b> use the ethics hotline or compliance office · \u003cb>E\u003c/b> contact the regulator (the U.S. Food and Drug Administration) · \u003cb>F\u003c/b> contact a journalist. One reason: \"…because…\"\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"bridge\">\n\u003ch2>The bridge (during the break)\u003c/h2>\n\u003cp>At the break, sort the exit tickets into A–F and count them. Write the counts on slide 14 (there is a blank tally) or on the board. Class 2 opens with these numbers, so students see their own class's decision before they learn the rules.\u003c/p>\n\u003c/section>\n\n\u003c!-- ================= CLASS 2 ================= -->\n\u003csection id=\"c2\">\n\u003ch2>Class 2 · When loyalty and conscience collide (11:10–12:50)\u003c/h2>\n\n\u003cdiv class=\"activity\" id=\"c2a\">\n\u003ch3>11:10–11:20 · Engage: Your votes, and the price of speaking up\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Restart the case; show that whistleblowing can bring a fortune, a prison sentence or the end of a career\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>10 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Pairs\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 14–15; worksheet Part 7 (matching)\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>3 min.\u003c/b> Show the exit-ticket counts. Ask one student from the biggest group and one from the smallest to explain.\u003c/li>\n\u003cli>\u003cb>5 min.\u003c/b> Pairs match four real people to four outcomes (worksheet Part 7). Students guess before you reveal; there is a self-check button.\n\u003cul>\u003cli>Bradley Birkenfeld (UBS) → received $104 million from the IRS in 2012 \u003ci>and\u003c/i> went to prison for the tax fraud he reported\u003c/li>\n\u003cli>John Kopchinski (Pfizer) → received about $50 million for exposing illegal drug promotion\u003c/li>\n\u003cli>Sherron Watkins (Enron) → went to the press, not the SEC, so had no whistleblower protection; said she would never again have a job in corporate America\u003c/li>\n\u003cli>Sallie Krawcheck (Merrill Lynch/Bank of America) → convinced the CEO to repay investors, then was \"reorganized out\" of her job\u003c/li>\u003c/ul>\u003c/li>\n\u003cli>\u003cb>2 min.\u003c/b> Ask: \"Which outcome surprised you most? Would money change your decision?\"\u003c/li>\n\u003c/ol>\n\u003cp class=\"src\">All four cases are in 7.5 (from p. 218).\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2b\">\n\u003ch3>11:20–11:30 · Study: The whistleblower's ladder and five tests\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Give students the analytic tool they will use for the cases and the debate\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>10 min (6 input + 4 practice)\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Whole class, then pairs\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Slides 16–18; worksheet Part 8\u003c/div>\u003c/div>\n\u003cp>\u003cb>Input (6 min).\u003c/b>\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Definition (7.5).\u003c/b> Whistleblowing means going to a government agency to report your employer's legal violation. Complaining to your boss is not whistleblowing in the book's sense.\u003c/li>\n\u003cli>\u003cb>The ladder\u003c/b> (a teaching tool, built from the book's advice to use internal channels first): fix it yourself → your manager → your manager's boss → compliance office or ethics hotline → regulator → media.\u003c/li>\n\u003cli>\u003cb>The book's five tests\u003c/b> for responsible whistleblowing: (1) the motive is to stop wrongdoing or protect victims, not revenge; (2) internal channels were tried first, usually; (3) there is hard evidence; (4) the violation is serious; (5) reporting could realistically stop it.\u003c/li>\n\u003cli>\u003cb>U.S. legal protection (7.5)\u003c/b> comes only from specific laws. The Occupational Safety and Health Act of 1970 was among the first; Congress has since added more than twenty. The False Claims Act (1863) lets a private person sue on the government's behalf (qui tam) and keep 15–25% of the recovery, or 25–30% if the government doesn't join. \u003ci>Outside source:\u003c/i> in fiscal year 2025, the SEC awarded about $60 million to 48 whistleblowers and received about 27,000 tips.\u003c/li>\n\u003cli>\u003cb>Around the world (outside sources).\u003c/b> The EU Directive (2019) protects three routes: internal, regulator, public. Internal reporting is encouraged but not required. Japan's amended law adds criminal penalties for retaliation, with company fines up to ¥30 million. It takes effect on December 1, 2026, two weeks from today.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Practice (4 min).\u003c/b> Pairs answer in the worksheet: \"Watkins told Ken Lay first, then went to the press. Which step of the ladder did she skip, and why did it matter legally?\" (Answer: the regulator, the SEC. Going to the press didn't give her whistleblower protection.) Then: \"Ask your partner: in workplaces you know, which step would people use first, and which step is unthinkable?\"\u003c/p>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>Before going outside, Ari should…\u003c/span>\u003cspan>The internal route fails if…\u003c/span>\u003cspan>It passes the evidence test because…\u003c/span>\u003cspan>In the EU / Japan, by contrast, …\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2c\">\n\u003ch3>11:30–11:50 · Study: Case files: three real whistleblowers\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Apply the five tests to real cases; practice third and mixed conditionals\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>20 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Groups of 3 (one case each), jigsaw\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Handout 4 (case files A–C) or worksheet Part 9; slide 19\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>6 min · Read.\u003c/b> Each member reads one case: \u003cb>A\u003c/b> Sherron Watkins, Enron (book) · \u003cb>B\u003c/b> Sallie Krawcheck, Merrill Lynch (book) · \u003cb>C\u003c/b> Sam Salehpour, Boeing (outside source, 2024).\u003c/li>\n\u003cli>\u003cb>8 min · Teach.\u003c/b> Each member has about 2.5 minutes to tell the story: what they found, whom they told, what it cost them.\u003c/li>\n\u003cli>\u003cb>6 min · Score.\u003c/b> As a group, score each case on the five tests (✓ / ✗ / ?) in the worksheet table, then write one conditional sentence per case: \"If ___ had ___, ___ would have ___.\"\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Expected outcome:\u003c/b> Watkins: strong motive and evidence, internal first, but wrong external route (press, not SEC). Krawcheck: never needed to go outside; she used the top of the internal ladder and paid with her job. Salehpour: raised concerns internally, says he faced retaliation, then went public through lawyers and testified to Congress.\u003c/p>\n\u003ch4>Debrief questions (whole class, 2 min if time)\u003c/h4>\n\u003cul>\u003cli>Krawcheck never went to a regulator. Is she a whistleblower by the book's definition? Does it matter?\u003c/li>\u003cli>The book says the cost of speaking up can be high. How large a price is it fair to ask one person to pay?\u003c/li>\u003c/ul>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2d\">\n\u003ch3>11:50–12:28 · Activate: Debate: Should Ari go to the regulator?\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Formal debate with counterargument and rebuttal (syllabus: \"When is it right to break company rules?\")\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>38 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Proposition team, Opposition team, stakeholder judges (2 debates in parallel if more than 16 students)\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Handout 5 (Corvane Part 2, role cards, judges' scoring sheet); worksheet Part 10; slides 20–21 with timers\u003c/div>\u003c/div>\n\u003cdetails open>\u003csummary>Corvane, Part 2 (fictional)\u003c/summary>\n\u003cp>Ari spoke to Dana. Dana said: \"The 1-in-400 error happened only in the old test setup. Engineering is fixing the software for the next batch. If we delay delivery, we lose the contract and maybe 200 jobs. I need you to trust me on this.\"\u003c/p>\n\u003cp>Ari then used the company's ethics hotline. A week later, Compliance replied that they had \"opened a review\" that will take six to eight weeks. The first FlowSure 2 pumps reach hospitals in two weeks. Two coworkers have noticed that Ari is no longer invited to the weekly product meeting.\u003c/p>\n\u003c/details>\n\u003cp>\u003cb>Motion:\u003c/b> \u003ci>Ari should report the altered test data to the regulator now, before Corvane's internal review is finished.\u003c/i>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Time\u003c/th>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>3 min\u003c/td>\u003ctd>Read and assign roles\u003c/td>\u003ctd>Read Part 2. Split class: Proposition (report now), Opposition (wait and push internally), 3–4 judges with stakeholder cards: patient safety advocate, Corvane CFO, Ari's coworker, a hospital buyer.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8 min\u003c/td>\u003ctd>Prepare\u003c/td>\u003ctd>Teams: three arguments, each with a reason and a framework (at least two different frameworks); predict the other side's strongest point and prepare a rebuttal. Judges: two questions from their stakeholder's view; read the scoring sheet.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 min\u003c/td>\u003ctd>Opening statements\u003c/td>\u003ctd>2 minutes each, Proposition first. Two speakers per team.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 min\u003c/td>\u003ctd>Rebuttal huddle\u003c/td>\u003ctd>Teams choose the one point to attack.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 min\u003c/td>\u003ctd>Rebuttals\u003c/td>\u003ctd>90 seconds each, Opposition first. Must begin: \"Our opponents argued that… However, …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 min\u003c/td>\u003ctd>Judges' questions\u003c/td>\u003ctd>Judges question both teams. Any team member may answer.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 min\u003c/td>\u003ctd>Closing statements\u003c/td>\u003ctd>1 minute each. Must include one concession: \"We accept that… but…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 min\u003c/td>\u003ctd>Judges deliberate in public\u003c/td>\u003ctd>Judges talk in the middle of the room, fishbowl style; teams listen silently. Verdict and scores.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 min\u003c/td>\u003ctd>Debrief\u003c/td>\u003ctd>Step out of roles. See questions below.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 min\u003c/td>\u003ctd>Transitions\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Strong arguments students may use\u003c/b>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Proposition (report now)\u003c/th>\u003cth>Opposition (wait, push internally)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Patients may get overdoses within two weeks; a utilitarian count of possible deaths outweighs jobs.\u003cbr>Kant: hiding the data treats patients merely as a means to a contract.\u003cbr>Ari has used two internal steps already; the review is slower than the risk (book's test 5).\u003cbr>Being excluded from meetings looks like the start of retaliation.\u003c/td>\u003ctd>Ari has no proof that the new batch has the problem; Dana may be right (book's test 3: hard evidence).\u003cbr>The internal review exists and has not failed yet; going outside early breaks trust and may cost 200 jobs.\u003cbr>Virtue ethics: prudence and loyalty to colleagues who paid for Ari's degree.\u003cbr>Ari can still go to the regulator later, after one more internal step (e.g., the CEO or board).\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Judges' scoring\u003c/b> (on the handout, 1–4 each): clear position · reasons with frameworks · evidence from the case · quality of rebuttal · respect and concession. Judges also give a verdict from their stakeholder's view, which may differ from the score.\u003c/p>\n\u003ch4>Debrief questions\u003c/h4>\n\u003cul>\u003cli>Which argument from the \u003ci>other\u003c/i> side was hardest to answer?\u003c/li>\u003cli>Did any judge's stakeholder role pull them away from their personal view?\u003c/li>\u003cli>Was there a third option neither team chose (e.g., going to the CEO or board, getting a lawyer first)?\u003c/li>\u003cli>The syllabus question: when is it right to break company rules? Finish the sentence as a class.\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>If students ask \"What would really happen?\":\u003c/b> Say that U.S. protection depends on which specific law applies, as the book says, so a real Ari would usually talk to a whistleblower lawyer first. If hospitals bill government health programs for faulty devices, the False Claims Act could be one route. Don't go further into legal detail; it's beyond the course.\u003c/div>\n\u003ch4>Useful language\u003c/h4>\n\u003cdiv class=\"phr\">\u003cspan>Our opponents argued that… However, …\u003c/span>\u003cspan>From a utilitarian perspective, …\u003c/span>\u003cspan>That assumes that…, but the case says…\u003c/span>\u003cspan>We accept that…, but…\u003c/span>\u003cspan>The strongest argument against us is… and our answer is…\u003c/span>\u003cspan>What evidence supports that?\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2e\">\n\u003ch3>12:28–12:36 · Activate: Rights or responsibilities? Sort race\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Consolidate the week's vocabulary (syllabus: workplace rights and responsibilities)\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>8 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Teams of 3–4, competitive\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Handout 6 (12 cards per team) or worksheet Part 11; slide 22\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>4 min.\u003c/b> Teams sort 12 cards into three columns: \u003cb>Employee's right\u003c/b>, \u003cb>Employee's responsibility\u003c/b>, \u003cb>Both / depends\u003c/b>. For each card they must also say one key term aloud (e.g., \"trade secret,\" \"concerted activity\").\u003c/li>\n\u003cli>\u003cb>4 min.\u003c/b> Teams swap and check another team's sort against the key card (Handout 6). One point per correct card, one bonus point per team that explains a \"Both\" card correctly.\u003c/li>\n\u003c/ol>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2f\">\n\u003ch3>12:36–12:47 · Activate: My red lines\u003c/h3>\n\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Purpose\u003c/b>Personalize the week; seed the Personal Code of Ethics draft in Week 8\u003c/div>\u003cdiv>\u003cb>Time\u003c/b>11 min\u003c/div>\u003cdiv>\u003cb>Grouping\u003c/b>Individual, then triads\u003c/div>\u003cdiv>\u003cb>Materials\u003c/b>Worksheet Part 12; slide 23\u003c/div>\u003c/div>\n\u003col>\n\u003cli>\u003cb>4 min.\u003c/b> Each student completes three sentences about their own profession:\u003cbr>\u003ci>\"I owe my employer… / I would break a company rule if… / I would never… even if my job depended on it.\"\u003c/i>\u003c/li>\n\u003cli>\u003cb>5 min · Pressure test.\u003c/b> In triads, each person reads their sentences. The other two each give one hard scenario that tests a red line (\"What if the rule protected a coworker's privacy?\").\u003c/li>\n\u003cli>\u003cb>2 min.\u003c/b> Revise one sentence. Tell students to keep it: they'll use it in their Personal Code of Ethics draft next week.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"phr\">\u003cspan>What if…?\u003c/span>\u003cspan>Would that still apply if…?\u003c/span>\u003cspan>I'd revise mine to say…\u003c/span>\u003cspan>That's a fair challenge; I'd add an exception for…\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"activity\" id=\"c2g\">\n\u003ch3>12:47–12:50 · Close: Exit ticket and homework\u003c/h3>\n\u003cp>\u003cb>Exit ticket (worksheet Part 13, slide 24):\u003c/b> (1) One thing employees owe employers. (2) One thing an employer can never ask of an employee. (3) Confidence today, 1–4.\u003c/p>\n\u003cp>Assign Journal #4 and preview Week 8 (rights of all, and the Personal Code of Ethics draft) and Quiz 3.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"lang\">\n\u003ch2>Discussion and debate language (B2+)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Function\u003c/th>\u003cth>Language\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Stating a position with nuance\u003c/td>\u003ctd>\"On balance, I'd argue that…\" · \"I'm inclined to think…, although…\" · \"It depends on whether…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Clarifying\u003c/td>\u003ctd>\"So if I understand you correctly, you're saying…\" · \"Are you distinguishing between… and…?\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Challenging an idea, not a person\u003c/td>\u003ctd>\"That assumes…, but…\" · \"What evidence supports that?\" · \"I'd question the idea that…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Applying a framework\u003c/td>\u003ctd>\"From a utilitarian perspective, … outweighs…\" · \"A Kantian would object that… treats … merely as a means.\" · \"A person of good character would…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rebutting\u003c/td>\u003ctd>\"Our opponents argued that… However, this overlooks…\" · \"Even if that were true, …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Conceding\u003c/td>\u003ctd>\"We accept that…, but…\" · \"That's a fair point, and yet…\" · \"I've modified my view: …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Obligation\u003c/td>\u003ctd>\"Employees owe… to…\" · \"She was under no obligation to…\" · \"He was entitled to…\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Judging past choices\u003c/td>\u003ctd>\"If she had…, she would have…\" · \"Had he gone to the SEC, …\" · \"If he hadn't spoken up, the planes might still…\"\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"hw\">\n\u003ch2>Homework: Journal #4\u003c/h2>\n\u003cp>\u003cb>Prompt.\u003c/b> Should Ari report the altered data to the regulator before the internal review is finished? Write one paragraph (200–250 words) with this structure: position → two reasons, at least one using an ethical framework → evidence from the case → the strongest counterargument → your rebuttal → conclusion. Use at least four terms from this week.\u003c/p>\n\u003cp>\u003cb>Also:\u003c/b> Read 8.1 (from p. 231) before Week 8. Bring your three red-line sentences.\u003c/p>\n\u003ch3>Rubric (12 points)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Part\u003c/th>\u003cth>2 points\u003c/th>\u003cth>1 point\u003c/th>\u003cth>0\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Position\u003c/td>\u003ctd>Clear and specific\u003c/td>\u003ctd>Present but vague\u003c/td>\u003ctd>Missing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Reasons and framework\u003c/td>\u003ctd>Two reasons; a framework is applied, not just named\u003c/td>\u003ctd>One reason or framework only named\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Evidence\u003c/td>\u003ctd>Specific details from the case\u003c/td>\u003ctd>General reference\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Counterargument\u003c/td>\u003ctd>The strongest opposing point, stated fairly\u003c/td>\u003ctd>A weak or unfair version\u003c/td>\u003ctd>Missing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rebuttal and conclusion\u003c/td>\u003ctd>Answers the counterargument directly; clear ending\u003c/td>\u003ctd>Partly answers\u003c/td>\u003ctd>Missing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Language\u003c/td>\u003ctd>4+ week terms used correctly; errors don't block meaning\u003c/td>\u003ctd>2–3 terms or some unclear sentences\u003c/td>\u003ctd>Hard to follow\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"check\">\n\u003ch2>Check for understanding (Quiz 3 practice)\u003c/h2>\n\u003col>\n\u003cli>Name two things the duty of loyalty forbids. \u003cb>(Acting against the employer's interests; conflicts of interest; a competing second job without consent; benefiting yourself at the employer's expense.)\u003c/b>\u003c/li>\n\u003cli>What are Bidwell's two parts of loyalty? Which one has weakened? \u003cb>(Having the employer's interests at heart; staying with the same employer. The second.)\u003c/b>\u003c/li>\n\u003cli>Explain at-will employment and who it usually favors, according to the book. \u003cb>(Either side can end the job at any time for any legal reason; it usually favors the employer.)\u003c/b>\u003c/li>\n\u003cli>What's the difference between a non-compete and a nonsolicitation clause? \u003cb>(Non-compete: you can't work for a competitor; nonsolicitation: you can't take the company's customers or coworkers with you.)\u003c/b>\u003c/li>\n\u003cli>True or false: Under the NLRA, most rules that forbid employees from discussing pay are unenforceable. \u003cb>(True.)\u003c/b>\u003c/li>\n\u003cli>Why wasn't Adrian Duane's Glassdoor review protected? \u003cb>(It was personal criticism, not concerted activity with coworkers about pay or conditions.)\u003c/b>\u003c/li>\n\u003cli>Define whistleblowing as the book does. \u003cb>(Going to a government agency to report the employer's legal violation.)\u003c/b>\u003c/li>\n\u003cli>Give three of the book's guidelines for responsible whistleblowing. \u003cb>(Good motive, internal channels first, hard evidence, serious violation, could realistically be stopped.)\u003c/b>\u003c/li>\n\u003cli>What is a qui tam provision? \u003cb>(Part of the False Claims Act letting a private person sue on the government's behalf and receive a share of the recovery.)\u003c/b>\u003c/li>\n\u003cli>Your friend tells you her company will be bought next week. You buy its shares. What have you done? \u003cb>(Insider trading as an outsider/tippee: illegal.)\u003c/b>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"align\">\n\u003ch2>How Week 7 builds toward the assessments\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>This week's practice\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Quiz 3 (Week 8, Chapters 6–8)\u003c/td>\u003ctd>Check questions above; sort race vocabulary; the two-way street link to Chapter 6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Written assignments\u003c/td>\u003ctd>Journal #4 adds the counterargument-and-rebuttal step to the paragraph structure from Weeks 2–6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Personal Code of Ethics (Weeks 8–9)\u003c/td>\u003ctd>\"My red lines\" sentences, pressure-tested by peers\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Final assessment (Week 11)\u003c/td>\u003ctd>Case analysis with five tests and two frameworks; formal argument with rebuttal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Participation (20%)\u003c/td>\u003ctd>Spectrum line, negotiation roles, debate roles and judges' scores, exit tickets\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"prep\">\n\u003ch2>Materials to prepare\u003c/h2>\n\u003cul>\n\u003cli>Two signs: FINE and DISLOYAL (or print from Handout 1).\u003c/li>\n\u003cli>Handout 2: Clause Clinic contract (one per student) and role cards A–C (one per group).\u003c/li>\n\u003cli>Handout 3: Gray Zone cards (one set per pair; cut).\u003c/li>\n\u003cli>Handout 4: Case files A–C (one per group of three, or students use the worksheet).\u003c/li>\n\u003cli>Handout 5: Corvane Part 2, debate role cards and judges' scoring sheet.\u003c/li>\n\u003cli>Handout 6: Sort race cards (one set per team; cut).\u003c/li>\n\u003cli>Exit ticket slips for Class 1 (Handout 1) if students won't use devices.\u003c/li>\n\u003cli>Slides open; test the timers.\u003c/li>\n\u003cli>Share the student page link: \u003ccode>students.html\u003c/code> (worksheet and slides).\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"keys\">\n\u003ch2>Answer keys and model answers\u003c/h2>\n\u003ch3>Paired reading: guide questions\u003c/h3>\n\u003cdiv class=\"key\">\u003cb>Reading A (7.1).\u003c/b> (1) Not acting against the employer's interests, working in good faith, no conflicts of interest, no competing second job without consent. (2) Fiduciary duty: a higher duty for people with more authority or access to secrets. (3) It's a two-way street; at-will employment and defined-contribution retirement plans reduced reasons to stay; CEOs moving for money send a message. (4) Non-compete: limited by time and distance; Jimmy John's applied two-year, two-mile non-competes to sandwich makers and agreed in 2016 to stop; California voids most non-competes.\u003c/div>\n\u003cdiv class=\"key\">\u003cb>Reading B (7.5).\u003c/b> (1) Going to a government agency to report the employer's legal violation. (2) Career damage, no promotion, resentment, blacklisting. (3) Good motive, internal first, hard evidence, serious violation, could realistically be stopped. (4) Watkins went to the press, not the SEC, so she had no whistleblower protection; Krawcheck persuaded the CEO to repay investors and was later \"reorganized out.\"\u003c/div>\n\u003ch3>Clause Clinic: likely outcomes\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clause\u003c/th>\u003cth>A: Technician\u003c/th>\u003cth>B: Research engineer\u003c/th>\u003cth>C: VP of Sales\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 Inventions belong to Corvane\u003c/td>\u003ctd>Keep (rarely matters)\u003c/td>\u003ctd>Keep, but limit to work done on the job (book: \"within the scope of employment\")\u003c/td>\u003ctd>Keep\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 Confidentiality forever\u003c/td>\u003ctd>Keep, narrow to real secrets\u003c/td>\u003ctd>Keep (trade secrets)\u003c/td>\u003ctd>Keep, narrow to trade secrets and client data\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 Non-compete 2 years / 100 miles\u003c/td>\u003ctd>Delete (no secrets; Jimmy John's)\u003c/td>\u003ctd>Change: shorter (e.g., 1 year, as in Figure 7.4), competing products only, maybe paid\u003c/td>\u003ctd>Change, or replace with nonsolicitation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 Nonsolicitation 2 years\u003c/td>\u003ctd>Delete or limit to coworkers\u003c/td>\u003ctd>Keep for coworkers\u003c/td>\u003ctd>Keep (main risk is clients)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 Nondisparagement forever\u003c/td>\u003ctd colspan=\"3\">Change for all: limit to false statements; add \"nothing stops you from reporting to a government agency\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6 No second job without consent\u003c/td>\u003ctd>Change: only competing work\u003c/td>\u003ctd>Keep for competing or consulting work\u003c/td>\u003ctd>Keep for competing work\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Gray Zone cards\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Card\u003c/th>\u003cth>Verdict\u003c/th>\u003cth>Concept and book link\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 $150 gift card from a copier vendor before you choose the new copier\u003c/td>\u003ctd>Not OK (decline or declare per policy)\u003c/td>\u003ctd>Gift giving and conflict of interest; the book's own copier example (7.4)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 A friend says her company will be bought next week; you buy shares\u003c/td>\u003ctd>Not OK, illegal\u003c/td>\u003ctd>Insider trading by an outsider who got the tip from an insider (7.4)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 A customs officer abroad asks for $20 to process your approved shipment today, not next week\u003c/td>\u003ctd>It depends\u003c/td>\u003ctd>FCPA \"facilitating or grease payment\" exception for routine tasks (7.4). But it may be illegal locally, and many company policies ban it. \u003ci>Outside the book:\u003c/i> the UK Bribery Act has no such exception.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 You post a funny video of a kitchen mistake, in your restaurant's uniform\u003c/td>\u003ctd>Not OK / risky\u003c/td>\u003ctd>Protecting the brand online: Taco Bell, Domino's, Burger King Japan (7.2); social media policy (7.3)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 A regular customer makes sexual comments; your manager says \"Serve him, he tips well.\"\u003c/td>\u003ctd>Not OK for the manager\u003c/td>\u003ctd>Pizza Hut case (Lockard, $360,000 verdict): good service doesn't mean accepting harassment; employers must protect employees (7.2)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6 A new hire from your main rival tells you the rival's new prices for a bid you are both making; no NDA was broken\u003c/td>\u003ctd>It depends (legal, ethically debatable)\u003c/td>\u003ctd>The book's \"What Would You Do?\" box in 7.4; ethical leadership\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7 You discuss salaries with three coworkers; your manager says it's against policy\u003c/td>\u003ctd>OK, protected\u003c/td>\u003ctd>NLRA Section 7; most pay secrecy rules unenforceable (7.5). Answers spectrum statement (d).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8 You post an angry anonymous review attacking your manager's personality\u003c/td>\u003ctd>Usually not protected\u003c/td>\u003ctd>Duane/IXL: personal criticism isn't concerted activity; false posts aren't protected (7.5). Answers spectrum statement (f).\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Price of speaking up: matching\u003c/h3>\n\u003cdiv class=\"key\">Birkenfeld → $104 million and prison · Kopchinski → about $50 million · Watkins → no protection; no future job in corporate America · Krawcheck → \"reorganized out\"\u003c/div>\n\u003ch3>Case files: five tests\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Test\u003c/th>\u003cth>Watkins\u003c/th>\u003cth>Krawcheck\u003c/th>\u003cth>Salehpour\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Good motive\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓ (her sense of purpose)\u003c/td>\u003ctd>✓ (says he wants to prevent crashes)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Internal first\u003c/td>\u003ctd>✓ (Ken Lay)\u003c/td>\u003ctd>✓ (only internal)\u003c/td>\u003ctd>✓ (raised concerns with managers)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hard evidence\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>? (he cited inspection records; Boeing rejected his claims)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Serious violation\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓ (modest investors' losses)\u003c/td>\u003ctd>✓ (aircraft safety)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Could stop it\u003c/td>\u003ctd>? (by then, late)\u003c/td>\u003ctd>✓ (investors repaid)\u003c/td>\u003ctd>? (FAA investigated)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Route\u003c/td>\u003ctd>Press, not SEC: no protection\u003c/td>\u003ctd>CEO\u003c/td>\u003ctd>Lawyers, FAA, Senate testimony\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Sort race\u003c/h3>\n\u003cdiv class=\"key\">\u003cb>Right:\u003c/b> discuss pay with coworkers · quit at any time (at-will) · be protected from harassment, including by customers · report legal violations to a government agency (protected under specific laws).\u003cbr>\u003cb>Responsibility:\u003c/b> keep trade secrets confidential · avoid conflicts of interest · give best effort · not trade on inside information · follow the code of conduct.\u003cbr>\u003cb>Both / depends:\u003c/b> criticize the company (protected about pay/conditions with coworkers; not personal attacks) · take a second job (allowed if not competing) · follow a non-compete after leaving (depends on the state and the contract).\u003c/div>\n\u003ch3>Journal #4: model paragraph\u003c/h3>\n\u003cdiv class=\"key\">In my view, Ari should report the altered data to the regulator now. First, the risk is serious and close: the original tests showed overdoses in about one in 400 cases, and pumps reach hospitals in two weeks, while Compliance needs six to eight weeks. From a utilitarian perspective, even a small chance of harming patients outweighs the cost of a delayed contract. Second, a Kantian would say that hiding the data treats patients merely as a means to Corvane's profit. Ari has also gone through proper channels: Ari spoke to Dana and used the ethics hotline, so the book's test of trying internal routes first has been met. The strongest counterargument is that Ari lacks hard evidence that the new batch has the problem, and that going outside early could cost 200 jobs. However, Ari does not need to prove the new batch is unsafe; the regulator exists to investigate exactly this question, and the evidence that test data were changed is already in the files. Moreover, Ari being excluded from meetings suggests that waiting may lead to retaliation rather than a fix. Therefore, reporting now is both the safest and the most loyal choice, because a company that sells unsafe pumps will lose far more than one contract. \u003ci>(232 words)\u003c/i>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"flags\">\n\u003ch2>Notes and flags\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Returning the midterm.\u003c/b> If you hand back midterms this week, take 5 minutes from the Gray Zone (do three rounds) and 5 from \"My red lines\" (skip the revision step), and return papers at 9:00 before the spectrum line.\u003c/li>\n\u003cli>\u003cb>Sensitive content.\u003c/b> Gray Zone card 5 involves sexual harassment by a customer; the book discusses it. Keep it, but tell students they may pass on any card. The Duane/IXL case in 7.5 mentions gender transition; it's not used in an activity.\u003c/li>\n\u003cli>\u003cb>Salehpour (Case file C)\u003c/b> is from 2024 news reports. Boeing rejected his claims. The case file presents both. Check for any later developments before class if you want an update.\u003c/li>\n\u003cli>\u003cb>Class size.\u003c/b> With more than 16 students, run two debates side by side with separate judges; you move between them. With fewer than 9, skip the judges and let the whole class vote by stakeholder.\u003c/li>\n\u003cli>\u003cb>Large-number facts\u003c/b> from outside sources (FTC, SEC, EU, Japan) are dated in the slides so they won't look wrong later in the term.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003cp class=\"src\">Textbook: Byars, S. M., & Stanberry, K. \u003ci>Business Ethics\u003c/i>. OpenStax. Access for free at https://openstax.org/books/business-ethics/pages/1-introduction (CC BY 4.0). Adapted summaries in this set are written for this course.\u003c/p>\n\u003c/div>\n\n\n\u003c/body>\u003c/html>", "briefing": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 7 Teacher Briefing · What Employees Owe Employers\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:n
