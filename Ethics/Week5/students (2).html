(8px);transition:opacity .3s,transform .3s}\n.step.shown{opacity:1;transform:none}\n.timechip{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:3px 12px;border-radius:20px;font-size:18px;margin-left:10px;vertical-align:middle}\n.brand{display:flex;align-items:center;gap:16px;margin-bottom:auto}\n.brand img{height:74px}\n.brand .w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.14em;font-size:22px;line-height:1.1}\n.brand .w small{display:block;font-size:13px;letter-spacing:.03em;color:#e6d8a8}\n#qr{background:#fff;padding:10px;border-radius:10px;width:max-content}\n#qr img,#qr canvas{display:block;width:170px!important;height:170px!important}\n.warn{background:#fbf1dc;border-left:6px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:20px;margin-bottom:12px}\n#timer{position:fixed;right:18px;top:18px;background:var(--gold);color:var(--navy);font:700 46px \"Source Sans 3\",sans-serif;padding:6px 20px;border-radius:12px;display:none;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}\n#timer.done{background:#a33a2a;color:#fff;animation:pulse 1s infinite}\n@keyframes pulse{50%{opacity:.6}}\n#help{position:fixed;left:14px;bottom:12px;color:#7f93ad;font-size:13px;z-index:10}\n#prog{position:fixed;left:0;top:0;height:4px;background:var(--gold);z-index:11;transition:width .2s}\n@media print{html,body{overflow:visible;background:#fff;height:auto}#stage{position:static;display:block}#deck{transform:none!important;width:auto;height:auto}.slide{display:flex!important;position:relative;width:1280px;height:720px;break-after:page}.step{opacity:1;transform:none}#timer,#help,#prog{display:none}}\n\n.corners{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}\n.corners div{border-radius:12px;padding:18px 22px;font-size:30px;font-weight:700;color:#fff}\n.c1{background:#1c4f8f}.c2{background:#8c3a2a}.c3{background:#8c7535}.c4{background:#4a5f7a}\n.matrix{display:grid;grid-template-columns:60px 1fr 1fr;grid-template-rows:1fr 1fr 40px;gap:8px;height:420px}\n.matrix .q{border-radius:10px;padding:14px 18px;font-size:22px;background:var(--sky3);border:2px solid var(--sky)}\n.matrix .q b{display:block;font-size:24px;color:var(--navy)}\n.matrix .q.key{background:var(--navy);color:#fff;border-color:var(--navy)}\n.matrix .q.key b{color:var(--gold)}\n.matrix .ax{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-d);font-size:18px;letter-spacing:.08em}\n.matrix .ay{writing-mode:vertical-rl;transform:rotate(180deg)}\n.therm{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0;border-radius:10px;overflow:hidden;font-size:22px;font-weight:700;text-align:center}\n.therm div{padding:16px 8px}\n.paper{background:#f8f5ec;border:2px solid #2b2b2b;padding:22px 30px;font-family:\"Libre Baskerville\",serif;color:#1a1a1a;box-shadow:6px 6px 0 rgba(0,0,0,.15)}\n.paper .mast{text-align:center;font-size:44px;font-weight:700;border-bottom:4px double #1a1a1a;padding-bottom:6px;letter-spacing:.04em}\n.paper .date{display:flex;justify-content:space-between;font-family:\"Source Sans 3\",sans-serif;font-size:15px;border-bottom:1px solid #1a1a1a;padding:4px 0;margin-bottom:14px}\n.paper .head{font-size:44px;line-height:1.15;font-weight:700;margin:6px 0 10px}\n.paper p{font-family:\"Source Sans 3\",sans-serif;font-size:22px}\n.lie{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}\n.lie div{background:#fff;border:2px solid var(--sky);border-radius:12px;padding:14px 18px;font-size:23px;line-height:1.35}\n.lie b{color:var(--gold-d);font-size:26px;margin-right:6px}\n.ev{background:#fff;border:3px dashed var(--gold-d);border-radius:14px;padding:30px 36px;font-size:36px;line-height:1.35;font-family:\"Libre Baskerville\",serif;color:var(--navy);margin:12px 0}\n\n.fix{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.fix div{background:#fff;border:2px solid var(--sky);border-left:6px solid #a33a2a;border-radius:10px;padding:12px 16px;font-size:22px}\n.fix div.ok{border-left-color:#2f6b2f}\n.flaglist li{font-size:25px;margin:6px 0}\n.flaglist small{color:var(--gold-d);font-size:18px}\n.stn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.stn div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--blue);border-radius:10px;padding:10px 14px;font-size:20px}\n.stn b{display:block;color:var(--navy);font-family:\"Libre Baskerville\",serif;font-size:21px}\n.verdict{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:4px 14px;border-radius:6px;margin-top:6px}\n.fish{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}\n.fish div{background:var(--sky3);border-radius:10px;padding:12px;text-align:center;font-size:21px}\n.fish b{display:block;font-size:34px;color:var(--navy)}\n\n.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}\n.scale div{border-radius:10px;padding:10px;text-align:center;font-size:21px;font-weight:700;color:#fff}\n.sit li{font-size:26px;margin:10px 0}\n.ee{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.ee div{border-radius:12px;padding:16px 20px;font-size:22px}\n.para{background:#fff;border:2px solid var(--sky);border-radius:10px;padding:12px 16px;font-size:18px;line-height:1.45}\n.para.bad{border-left:8px solid #a33a2a}.para.good{border-left:8px solid #2f6b2f}\n.six{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.six div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:20px}\n.six b{display:block;font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:22px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"prog\">\u003c/div>\n\u003cdiv id=\"stage\">\u003cdiv id=\"deck\">\n\n\u003c!-- 1 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"brand\">\u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px\">\n    \u003cdiv>\u003cdiv class=\"kick\">Ethics in a Global World · Week 5\u003c/div>\n    \u003ch1>The Impact of Culture and\u003cbr>Time on Business Ethics\u003c/h1>\n    \u003cp class=\"muted\">Chapter 5 · Samsung Galaxy Note 7 · Quiz 2\u003c/p>\u003c/div>\n    \u003cdiv style=\"text-align:center\">\u003cdiv id=\"qr\">\u003c/div>\u003cp style=\"font-size:16px;margin-top:8px\" class=\"muted\">Scan for your worksheet\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5\u003c/span>\u003cspan>1\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection class=\"slide\">\n  \u003cdiv class=\"kick\">Today\u003c/div>\n  \u003ch2>Does ethics have a passport — and an expiry date?\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:10px\">\n    \u003cdiv class=\"box\">\u003ch3>Class 1 · 9:00–10:40\u003c/h3>\u003cp>\u003cb>Does Ethics Have a Passport?\u003c/b>\u003c/p>\u003cp>Culture: rude or wrong, a 1626 deal, your workplace norms, dilemmas\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>Break · 10:40–11:10\u003c/h3>\u003cp>A question from 1929\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Class 2 · 11:10–12:50\u003c/h3>\u003cp>\u003cb>Does Ethics Have an Expiry Date?\u003c/b>\u003c/p>\u003cp>Time, Samsung, a writing workshop and \u003cb>Quiz 2\u003c/b>\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:26px\" class=\"muted\">Please hand in \u003cb>Ethics Journal #4\u003c/b>.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5 · Overview\u003c/span>\u003cspan>2\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Rude or wrong?\u003c/h2>\n  \u003cp class=\"big\">For each situation, hold up fingers:\u003c/p>\n  \u003cdiv class=\"scale\">\n    \u003cdiv style=\"background:#2f6b2f\">1 · Fine\u003c/div>\n    \u003cdiv style=\"background:#8c7535\">2 · A bit rude\u003c/div>\n    \u003cdiv style=\"background:#b5651d\">3 · Very rude\u003c/div>\n    \u003cdiv style=\"background:#a33a2a\">4 · Unethical\u003c/div>\n  \u003c/div>\n  \u003cp class=\"muted\">Then discuss with a partner: where did you learn your answer?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>3\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Situations 1–3\u003c/h2>\n  \u003col class=\"sit\">\n    \u003cli>You arrive \u003cb>15 minutes late\u003c/b> to a meeting with a new client.\u003c/li>\n    \u003cli>Before any business talk, your host serves \u003cb>three rounds of tea\u003c/b> and talks about family for 40 minutes.\u003c/li>\n    \u003cli>A new colleague calls the \u003cb>CEO by her first name\u003c/b>.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>4\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Situations 4–6\u003c/h2>\n  \u003col class=\"sit\" start=\"4\">\n    \u003cli>A supplier sends your manager an \u003cb>expensive watch\u003c/b> the week before a contract decision.\u003c/li>\n    \u003cli>Your manager says \u003cb>\"yes, maybe\"\u003c/b> to a client's request, knowing the answer is no.\u003c/li>\n    \u003cli>A company tells an applicant the job is \u003cb>\"flexible\"\u003c/b> but expects 70-hour weeks.\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"muted\">Pairs: discuss the two situations with the most disagreement. \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>5\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Manners or morals?\u003c/div>\n  \u003cdiv class=\"ee\" style=\"margin-top:10px\">\n    \u003cdiv style=\"background:#1c4673\">\u003cb class=\"gold\" style=\"font-size:28px\">Etiquette\u003c/b>\u003cbr>manners · what is polite\u003cbr>\u003cspan class=\"muted\">1 · 2 · 3 — and maybe 5\u003c/span>\u003c/div>\n    \u003cdiv style=\"background:#5a2a22\">\u003cb style=\"color:#f6c9a4;font-size:28px\">Ethics\u003c/b>\u003cbr>morals · what is right or wrong\u003cbr>\u003cspan style=\"color:#e8c3b8\">4 · 6 — and maybe 5\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:26px\">Some answers came from how you were raised. Others would be wrong anywhere.\u003c/p>\n  \u003cp class=\"step big gold\">This week's question: where exactly is the line?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage · 5.3\u003c/span>\u003cspan>6\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study · 5.1\u003c/span>\n  \u003ch2>How do we learn a culture?\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>Enculturation\u003c/h3>\u003cp class=\"big\">Learning \u003cb>your own\u003c/b> society's rules, customs and values. No one is born with a culture.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>Acculturation\u003c/h3>\u003cp class=\"big\">Cultural change when \u003cb>two cultures meet\u003c/b>. It changes both sides.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q\" style=\"margin-top:20px;font-size:28px\">The textbook: business is \u003cspan class=\"gold\">not culturally neutral\u003c/span>.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study\u003c/span>\u003cspan>7\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag s\">Information gap\u003c/span>\n  \u003ch2>Manhattan, May 1626 \u003cspan class=\"timechip\">4 + 4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>Student A\u003c/h3>\u003cp>Read card A — the Dutch side. Don't show it.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Student B\u003c/h3>\u003cp>Read card B — the Lenape side. Don't show it.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"big\" style=\"margin-top:18px\">Explain your side to your partner. Then: What did each side think they agreed to? What assumption caused the problem?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · 5.1\u003c/span>\u003cspan>8\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 9 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">The textbook (5.1)\u003c/span>\n  \u003ch2>One deal, two meanings\u003c/h2>\n  \u003cul>\n    \u003cli class=\"step\">The Dutch paid goods worth \"sixty guilders\" (about $1,000 today). To them, it was a \u003cb>purchase\u003c/b>.\u003c/li>\n    \u003cli class=\"step\">No deed survives. Some historians think the Lenape granted \u003cb>use rights\u003c/b>, not ownership.\u003c/li>\n    \u003cli class=\"step\">The dispute over property later led to \u003cb>war\u003c/b>. (\"$24 in beads\" is a legend.)\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"step q\" style=\"margin-top:18px;font-size:28px\">Where do two sides sign the same contract today — and understand it differently?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · 5.1\u003c/span>\u003cspan>9\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 10 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Cultural consultants · ground rule\u003c/div>\n  \u003ch2>Speak from a workplace you know.\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"margin-top:16px\">\n    \u003cdiv class=\"box\">\u003ch3>Yes\u003c/h3>\u003cp class=\"big\">\"In the hospital where I worked in ___, …\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:#a33a2a\">\u003ch3>No\u003c/h3>\u003cp class=\"big\">\"In my country, everyone…\"\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"big gold\" style=\"margin-top:20px\">One workplace is not a whole nation.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>10\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 11 -->\n\u003csection class=\"slide\" data-t=\"7\">\n  \u003cspan class=\"tag a\">Activate\u003c/span>\n  \u003ch2>Your consultant profile \u003cspan class=\"timechip\">7 min\u003c/span>\u003c/h2>\n  \u003cp>One workplace you know well (country, industry, size). How does it handle…\u003c/p>\n  \u003cdiv class=\"cols3\" style=\"gap:10px 18px;margin-top:6px\">\n    \u003cdiv class=\"box\">\u003cp>\u003cb>1\u003c/b> Time and punctuality\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>2\u003c/b> Gifts and hospitality\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>3\u003c/b> Disagreeing with your boss\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>4\u003c/b> Relationships before business\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>5\u003c/b> Hiring family and friends\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>6\u003c/b> A serious ethical violation\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · 5.3\u003c/span>\u003cspan>11\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 12 -->\n\u003csection class=\"slide cream\" data-t=\"5\">\n  \u003cspan class=\"tag a\">Speed consulting\u003c/span>\n  \u003ch2>Three rounds · 5 minutes each\u003c/h2>\n  \u003cul>\n    \u003cli>Compare \u003cb>two norms\u003c/b> of your choice.\u003c/li>\n    \u003cli>Find \u003cb>one surprising difference\u003c/b> and \u003cb>one similarity\u003c/b>.\u003c/li>\n    \u003cli>Note your partner's examples. Then move.\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"In the company where I worked, it was common to…\" · \"That surprised me, because…\" · \"We do that too, but for a different reason.\" · \"I wouldn't generalize, but…\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>12\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 13 -->\n\u003csection class=\"slide\" data-t=\"10\">\n  \u003cspan class=\"tag a\">Groups of 4\u003c/span>\n  \u003ch2>Sort your differences \u003cspan class=\"timechip\">10 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"ee\">\n    \u003cdiv style=\"background:var(--sky3)\">\u003cb style=\"color:var(--navy);font-size:26px\">Etiquette\u003c/b>\u003cbr>We would \u003cb>adapt\u003c/b> to it.\u003c/div>\n    \u003cdiv style=\"background:#fbefec\">\u003cb style=\"color:#a33a2a;font-size:26px\">Ethics\u003c/b>\u003cbr>We would \u003cb>not compromise\u003c/b>.\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q\" style=\"margin-top:22px\">Then agree on \u003cspan class=\"gold\">one value\u003c/span> that seemed universal across all your workplaces.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · 5.4\u003c/span>\u003cspan>13\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 14 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Activate\u003c/span>\n  \u003ch2>Dilemma cards: adapt or refuse?\u003c/h2>\n  \u003cdiv class=\"cols3\">\n    \u003cdiv class=\"box\">\u003ch3>1 · \"Everyone expects it here\"\u003c/h3>\u003cp>Siemens paid billions in fines for bribing officials in several countries. (5.1)\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>2 · Whose standard?\u003c/h3>\u003cp>Nike's 1990s sweatshop suppliers. Western standards — imperialism or humanity? (5.1)\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>3 · Lunch during Ramadan\u003c/h3>\u003cp>An auditor in Islamabad; her colleagues are fasting. Where should she eat? (5.3)\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:16px\">Triads: choose \u003cb>two\u003c/b> cards.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>14\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 15 -->\n\u003csection class=\"slide cream\" data-t=\"15\">\n  \u003cspan class=\"tag a\">For each card\u003c/span>\n  \u003ch2>Three questions \u003cspan class=\"timechip\">15 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>Etiquette, ethics,\u003c/b> or both?\u003c/li>\n    \u003cli>\u003cb>Adapt\u003c/b> to the local norm, or \u003cb>keep\u003c/b> your own standard?\u003c/li>\n    \u003cli>Which \u003cb>framework\u003c/b> supports your answer? \u003cspan class=\"muted\">virtue · utilitarian · Kantian · Rawlsian · stakeholder\u003c/span>\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"That's a matter of manners rather than morals.\" · \"I'd adapt to that, but I'd draw the line at…\" · \"From a Kantian standpoint, …\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>15\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 16 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Debrief · 5.3\u003c/span>\n  \u003ch2>Where does localization stop?\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>Localization\u003c/h3>\u003cp>Adapting a product or practice to a local culture — e.g., McDonald's serving \u003cb>sambal\u003c/b> chili sauce in Indonesia.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>The GLOBE study\u003c/h3>\u003cp>Good leaders must \u003cb>\"understand and exceed\"\u003c/b> the expectations of the cultures they work in.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:20px;font-size:28px\">Adapt your manners. \u003cspan class=\"gold\">Keep your morals.\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Debrief\u003c/span>\u003cspan>16\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 17 -->\n\u003csection class=\"slide dark\" data-t=\"6\">\n  \u003cdiv class=\"kick\">Exit ticket\u003c/div>\n  \u003ch2>Before the break \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>Enculturation\u003c/b> vs. \u003cb>acculturation\u003c/b>, in your own words.\u003c/li>\n    \u003cli>One difference you'd \u003cb>adapt\u003c/b> to — and one you'd \u003cb>refuse\u003c/b>.\u003c/li>\n    \u003cli>One question you still have.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Exit ticket\u003c/span>\u003cspan>17\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 18 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Break · 10:40–11:10 · Think about this\u003c/div>\n  \u003ch1>New York, 1929.\u003c/h1>\n  \u003cp class=\"big\">Edward Bernays markets Lucky Strike cigarettes to women as \u003cb class=\"gold\">\"torches of freedom.\"\u003c/b>\u003c/p>\n  \u003cp class=\"q\" style=\"margin-top:24px\">Was that wrong \u003cspan class=\"gold\">then\u003c/span> — or only wrong \u003cspan class=\"gold\">now\u003c/span>?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Break · 5.2\u003c/span>\u003cspan>18\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 19 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"brand\">\u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\u003c/div>\n  \u003cdiv class=\"kick\">Class 2 · 11:10–12:50\u003c/div>\n  \u003ch1>Does Ethics Have\u003cbr>an Expiry Date?\u003c/h1>\n  \u003cp class=\"muted\">Then &amp; now · Samsung crisis room · writing workshop · Quiz 2\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5 · Class 2\u003c/span>\u003cspan>19\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 20 -->\n\u003csection class=\"slide\" data-t=\"5\">\n  \u003cspan class=\"tag\">Bridge · 5.2\u003c/span>\n  \u003ch2>When even doctors smoked\u003c/h2>\n  \u003cul>\n    \u003cli>1940s–1970s: judges, factory workers, even \u003cb>pregnant women\u003c/b> and \u003cb>doctors\u003c/b> smoked.\u003c/li>\n    \u003cli class=\"step\">\u003cb>January 11, 1964:\u003c/b> the U.S. Surgeon General's report linked smoking to lung cancer.\u003c/li>\n    \u003cli class=\"step\">Today: smoking has declined in the West but is still promoted elsewhere — especially to \u003cb>young people\u003c/b>.\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"step q\" style=\"margin-top:18px;font-size:28px\">Did the \u003cspan class=\"gold\">facts\u003c/span> change — or the \u003cspan class=\"gold\">ethics\u003c/span>? \u003cspan class=\"timechip\">5 min\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Bridge\u003c/span>\u003cspan>20\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 21 -->\n\u003csection class=\"slide\" data-t=\"8\">\n  \u003cspan class=\"tag s\">Study · 5.2\u003c/span>\n  \u003ch2>Then &amp; now sort \u003cspan class=\"timechip\">8 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>A · Wrong then and now\u003c/h3>\u003cp class=\"big\">We just enforce it better.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>B · The standard changed\u003c/h3>\u003cp class=\"big\">What's acceptable is different now.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:18px\">Mercantilism · fur · Standard Oil · \u003ci>Dodge v. Ford\u003c/i> · LIBOR · \"human capital\" · the UN Global Compact\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Study\u003c/span>\u003cspan>21\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 22 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study · 5.4\u003c/span>\n  \u003ch2>Absolute, relative, universal\u003c/h2>\n  \u003cdiv class=\"cols3\">\n    \u003cdiv class=\"box\">\u003ch3>Absolute\u003c/h3>\u003cp>Close to objective: don't lie, don't defraud customers, don't cheat. Exceptions need strong reasons.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Relative\u003c/h3>\u003cp>Depends on time, place or culture: dress, punctuality, fur.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Universal\u003c/h3>\u003cp>Values all people can accept. Starting point: the UN Universal Declaration of Human Rights (1948).\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:20px;font-size:27px\">The textbook: standards change over time — but that does \u003cspan class=\"gold\">not\u003c/span> make ethics simply relative.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Study\u003c/span>\u003cspan>22\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 23 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Case study · Section 2.5\u003c/div>\n  \u003ch1>Samsung Galaxy Note 7\u003c/h1>\n  \u003cp class=\"big\">Fall 2016. The new phones are \u003cb class=\"gold\">catching fire\u003c/b>. Airlines will soon ban them.\u003c/p>\n  \u003cp class=\"big\">You are Samsung's \u003cb>crisis team\u003c/b>. Three decisions, 4 minutes each.\u003c/p>\n  \u003cp class=\"muted\">The textbook suggests Samsung rushed to launch before Apple's iPhone 7.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>23\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 24 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag a\">Decision 1 · early September 2016\u003c/span>\n  \u003ch2>Reports of phones overheating and catching fire \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:14px\">\n    \u003cdiv class=\"box\">\u003ch3>A\u003c/h3>\u003cp class=\"big\">Say there is no technical problem.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>B\u003c/h3>\u003cp class=\"big\">Blame the suppliers.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>C\u003c/h3>\u003cp class=\"big\">Stop sales and recall all phones now.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:16px\">Choose one. Write one reason.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>24\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 25 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag a\">Decision 2 · October 2016\u003c/span>\n  \u003ch2>The replacement phones are catching fire too \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"margin-top:14px\">\n    \u003cdiv class=\"box\">\u003ch3>A\u003c/h3>\u003cp class=\"big\">Fix it again and keep selling.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>B\u003c/h3>\u003cp class=\"big\">Stop production. Take the phone off the market permanently.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>25\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 26 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag a\">Decision 3 · January 2017\u003c/span>\n  \u003ch2>The investigation is finished. What does your statement say? \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:14px\">\n    \u003cdiv class=\"box\">\u003ch3>A\u003c/h3>\u003cp class=\"big\">\"Our suppliers' batteries were faulty.\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>B\u003c/h3>\u003cp class=\"big\">\"We are responsible. Here's how we'll prevent it.\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>C\u003c/h3>\u003cp class=\"big\">Both.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>26\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 27 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">What actually happened\u003c/div>\n  \u003cul style=\"font-size:24px\">\n    \u003cli class=\"step\">\u003cb class=\"gold\">1\u003c/b> Samsung first denied technical problems, then blamed suppliers. A global recall followed in September. \u003cspan class=\"muted\">(textbook)\u003c/span>\u003c/li>\n    \u003cli class=\"step\">\u003cb class=\"gold\">2\u003c/b> Replacements failed too. Production ended; about 96% of ~3 million phones were returned. \u003cspan class=\"muted\">(PCWorld)\u003c/span>\u003c/li>\n    \u003cli class=\"step\">\u003cb class=\"gold\">3\u003c/b> January 2017: 200,000+ phones tested. Batteries from \u003cb>two suppliers\u003c/b> had different defects. New \u003cb>8-point battery safety check\u003c/b>. \u003cspan class=\"muted\">(PCWorld)\u003c/span>\u003c/li>\n    \u003cli class=\"step\">The textbook: the response limited the damage and even boosted the share price — \"arguably a Kantian motive.\"\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung · 2.5 + outside source\u003c/span>\u003cspan>27\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 28 -->\n\u003csection class=\"slide cream\" data-t=\"5\">\n  \u003cspan class=\"tag a\">Evaluate\u003c/span>\n  \u003ch2>Was Samsung's response ethical? \u003cspan class=\"timechip\">5 min\u003c/span>\u003c/h2>\n  \u003cul>\n    \u003cli>Closer to the ethical \u003cb>minimum\u003c/b> or \u003cb>maximum\u003c/b>?\u003c/li>\n    \u003cli>\u003cb>Kant:\u003c/b> customers as ends — or a launch schedule first?\u003c/li>\n    \u003cli>\u003cb>Utilitarian:\u003c/b> the mobile division's profit fell 95% in one quarter. Worth it — for whom?\u003c/li>\n    \u003cli>Samsung designed and sold the phone. Is it fair to \u003cb>blame the suppliers\u003c/b>?\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"Samsung \u003cb>should have\u003c/b>…\" · \"It \u003cb>could have\u003c/b>…\" · \"Ultimately, ___ is accountable for…\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>28\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 29 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Writing workshop\u003c/span>\n  \u003ch2>The ethical reflection paragraph\u003c/h2>\n  \u003cdiv class=\"six\">\n    \u003cdiv>\u003cb>1 Position\u003c/b>Your answer, in one sentence\u003c/div>\n    \u003cdiv>\u003cb>2 Reason\u003c/b>Why?\u003c/div>\n    \u003cdiv>\u003cb>3 Evidence\u003c/b>A specific fact from the case\u003c/div>\n    \u003cdiv>\u003cb>4 Framework\u003c/b>Named — and \u003cu>applied\u003c/u> to the case\u003c/div>\n    \u003cdiv>\u003cb>5 Counterargument\u003c/b>Stated fairly, then answered\u003c/div>\n    \u003cdiv>\u003cb>6 Conclusion\u003c/b>Back to your position\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q\" style=\"margin-top:18px;font-size:26px\">Don't tell me what Kant said. \u003cspan class=\"gold\">Tell me what Kant would say about this company.\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>29\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 30 -->\n\u003csection class=\"slide\" data-t=\"6\">\n  \u003cspan class=\"tag a\">Weak vs. strong\u003c/span>\n  \u003ch2>Find three differences \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"gap:14px\">\n    \u003cdiv class=\"para bad\">\u003cb>Weak.\u003c/b> Samsung's response was ethical and not ethical. Utilitarianism is the greatest happiness for the greatest number. Kant is about duty. Companies should be responsible. In my opinion they should always think about customers because customers are important. So it is good and bad.\u003c/div>\n    \u003cdiv class=\"para good\" style=\"font-size:15.5px\">\u003cb>Strong.\u003c/b> Samsung's final response was largely ethical, but it came too late. The company first denied any technical problem and blamed its suppliers, while phones were still catching fire. Only later did it stop production and take back about 96% of roughly 3 million phones. From a Kantian perspective, the recall respected customers as ends in themselves; however, the early denial treated their safety as less important than the launch schedule. Some would argue that Samsung needed time to find the cause. That is fair, but when safety is at risk, a company should act first and investigate later. Overall, Samsung reached the ethical maximum only after trying the minimum.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>30\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 31 -->\n\u003csection class=\"slide\" data-t=\"13\">\n  \u003cspan class=\"tag a\">Write\u003c/span>\n  \u003ch2>Your paragraph · 120–170 words \u003cspan class=\"timechip\">13 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>A\u003c/b> · Was Samsung's response to the Note 7 crisis ethical?\u003c/li>\n    \u003cli>\u003cb>B\u003c/b> · Should Siemens have paid bribes where \"everyone expects it\"?\u003c/li>\n    \u003cli>\u003cb>C\u003c/b> · Should Jillian change her behavior during Ramadan?\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"Although…, …\" · \"While it's true that…, …\" · \"That is fair; however, …\" · \"From a ___ perspective, …\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>31\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 32 -->\n\u003csection class=\"slide cream\" data-t=\"6\">\n  \u003cspan class=\"tag a\">Peer review\u003c/span>\n  \u003ch2>Swap and check \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/h2>\n  \u003cul>\n    \u003cli>Tick each of the \u003cb>six parts\u003c/b> you find.\u003c/li>\n    \u003cli>\u003cb>Underline\u003c/b> the framework sentence. Is it \u003ci>applied\u003c/i> to the case?\u003c/li>\n    \u003cli>Write \u003cb>one suggestion\u003c/b> for improvement.\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>32\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 33 -->\n\u003csection class=\"slide dark\" data-t=\"25\">\n  \u003cdiv class=\"kick\">Assessment\u003c/div>\n  \u003ch1>Quiz 2 \u003cspan class=\"timechip\">25 min\u003c/span>\u003c/h1>\n  \u003cp class=\"big\">Chapters 4–5 · 30 points\u003c/p>\n  \u003cul>\n    \u003cli>Part A · Multiple choice (10)\u003c/li>\n    \u003cli>Part B · Matching (8)\u003c/li>\n    \u003cli>Part C · A short case + your reflection paragraph (12)\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"muted\" style=\"margin-top:16px\">Phones away. Work alone. Use the six-part structure in Part C.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Quiz 2\u003c/span>\u003cspan>33\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 34 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Before next week\u003c/div>\n  \u003ch2>Homework\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>Ethics Journal #5\u003c/b> (150–200 words) — choose one: \u003cspan class=\"muted\">Ramadan · Petrobras · Love in business\u003c/span>\u003c/li>\n    \u003cli>Use the \u003cb>six-part paragraph\u003c/b> structure.\u003c/li>\n    \u003cli>\u003cb class=\"gold\">Midterm next week\u003c/b> — review Chapters 1–5, your journals and both quizzes.\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"muted\" style=\"margin-top:20px\">Don't forget: \u003cb>Download\u003c/b> your worksheet.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5 · Homework\u003c/span>\u003cspan>34\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c/div>\u003c/div>\n\u003cdiv id=\"timer\" title=\"Click to pause; double-click to hide\">\u003c/div>\n\u003cdiv id=\"help\">← → or tap · T timer · F fullscreen\u003c/div>\n\u003cscript>\nconst slides=[...document.querySelectorAll('.slide')];\nlet i=0;\nfunction fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('deck').style.transform=`scale(${s})`}\naddEventListener('resize',fit);fit();\nfunction show(n,back){\n  i=Math.max(0,Math.min(slides.length-1,n));\n  slides.forEach((s,k)=>s.classList.toggle('on',k===i));\n  slides[i].querySelectorAll('.step').forEach(e=>e.classList.toggle('shown',!!back));\n  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';\n  try{history.replaceState(null,'','#'+(i+1))}catch(e){}\n}\nfunction next(){const h=slides[i].querySelector('.step:not(.shown)');if(h){h.classList.add('shown');return}if(i\u003cslides.length-1)show(i+1)}\nfunction prev(){const s=[...slides[i].querySelectorAll('.step.shown')];if(s.length){s[s.length-1].classList.remove('shown');return}if(i>0)show(i-1,true)}\naddEventListener('keydown',e=>{\n  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}\n  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}\n  else if(e.key==='t'||e.key==='T')startTimer();\n  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}\n  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);\n});\ndocument.getElementById('stage').addEventListener('click',e=>{if(e.clientX\u003cinnerWidth/3)prev();else next()});\nlet tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});\naddEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx\u003c0?next():prev();e.preventDefault()}tx=null});\n/* timer */\nconst T=document.getElementById('timer');let left=0,run=null,paused=false;\nfunction fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}\nfunction startTimer(){const m=+(slides[i].dataset.t||5);left=m*60;paused=false;T.classList.remove('done');T.style.display='block';T.textContent=fmt(left);clearInterval(run);run=setInterval(()=>{if(paused)return;left--;T.textContent=fmt(Math.max(0,left));if(left\u003c=0){clearInterval(run);T.classList.add('done');T.textContent=\"Time!\"}},1000)}\nT.addEventListener('click',e=>{e.stopPropagation();paused=!paused;T.style.opacity=paused?.6:1});\nT.addEventListener('dblclick',e=>{e.stopPropagation();clearInterval(run);T.style.display='none'});\n/* QR */\ntry{const url=(function(){try{if(parent!==window)return parent.location.href.split('#')[0].replace(/[^\\/]*$/,'students.html')+'#worksheet'}catch(e){}return location.href.split('#')[0].replace(/slides\\.html.*$/,'worksheet.html')})();if(window.QRCode&&/^https?:/.test(url))new QRCode(document.getElementById('qr'),{text:url,width:170,height:170,colorDark:'#143865',colorLight:'#ffffff'});else document.getElementById('qr').closest('div[style]').style.display='none'}catch(e){}\nshow(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "__logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAH0CAIAAABEtEjdAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAFjmlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPD94cGFja2V0IGJlZ2luPSfvu78nIGlkPSdXNU0wTXBDZWhpSHpyZVN6TlRjemtjOWQnPz4KPHg6eG1wbWV0YSB4bWxuczp4PSdhZG9iZTpuczptZXRhLyc+CjxyZGY6UkRGIHhtbG5zOnJkZj0naHR0cDovL3d3dy53My5vcmcvMTk5OS8wMi8yMi1yZGYtc3ludGF4LW5zIyc+CgogPHJkZjpEZXNjcmlwdGlvbiByZGY6YWJvdXQ9JycKICB4bWxuczpBdHRyaWI9J2h0dHA6Ly9ucy5hdHRyaWJ1dGlvbi5jb20vYWRzLzEuMC8nPgogIDxBdHRyaWI6QWRzPgogICA8cmRmOlNlcT4KICAgIDxyZGY6bGkgcmRmOnBhcnNlVHlwZT0nUmVzb3VyY2UnPgogICAgIDxBdHRyaWI6Q3JlYXRlZD4yMDI2LTEwLTA0PC9BdHRyaWI6Q3JlYXRlZD4KICAgICA8QXR0cmliOkRhdGE+eyZxdW90O2RvYyZxdW90OzomcXVvdDtEQUd6ejRXeC04WSZxdW90OywmcXVvdDt1c2VyJnF1b3Q7OiZxdW90O1VBQ1ZiRF9xeUZrJnF1b3Q7LCZxdW90O2JyYW5kJnF1b3Q7OiZxdW90O0FwcHJvYWNodXNhIHRlYW0mcXVvdDt9PC9BdHRyaWI6RGF0YT4KICAgICA8QXR0cmliOkV4dElkPjc0MTg2N2ExLTY1NjgtNDhmNS1hZWI4LTRjYjBlZWU5ODc0MDwvQXR0cmliOkV4dElkPgogICAgIDxBdHRyaWI6RmJJZD41MjUyNjU5MTQxNzk1ODA8L0F0dHJpYjpGYklkPgogICAgIDxBdHRyaWI6VG91Y2hUeXBlPjI8L0F0dHJpYjpUb3VjaFR5cGU+CiAgICA8L3JkZjpsaT4KICAgPC9yZGY6U2VxPgogIDwvQXR0cmliOkFkcz4KIDwvcmRmOkRlc2NyaXB0aW9 <script>
const TABS=[{"id": "worksheet", "label": "Worksheet", "file": "worksheet.html"}, {"id": "notes", "label": "Study Notes", "file": "study-notes.html"}, {"id": "slides", "label": "Slides", "file": "slides.html"}];
const DOCS=JSON.parse(document.getElementById('docs').textContent);
const LOGO=DOCS.__logo||'';
const tabs=document.getElementById('tabs'),panes=document.getElementById('panes');
function html(t){return DOCS[t.id].split('__LOGO__').join(LOGO)}
TABS.forEach(t=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.id='tab-'+t.id;b.textContent=t.label;b.title=t.hint||'';
  b.onclick=()=>go(t.id);tabs.appendChild(b);
});
tabs.insertAdjacentHTML('beforeend','<span class="sp"></span><a id="newtab" href="#">Open in new tab ↗</a>');
let cur=TABS[0];
document.getElementById('newtab').onclick=e=>{e.preventDefault();try{const u=URL.createObjectURL(new Blob([html(cur)],{type:'text/html'}));window.open(u,'_blank')}catch(err){}};
function wire(f){
  try{const d=f.contentDocument;
    d.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');
      if(h==='index.html'){a.style.display='none';return}
      const m=TABS.find(x=>x.file===h.split('#')[0]);
      if(m)a.addEventListener('click',e=>{e.preventDefault();go(m.id)});
      else if(/\.html(#|$)/.test(h)&&!/^https?:/.test(h))a.style.display='none';
    });
  }catch(e){}
}
function go(id,noHash){
  const t=TABS.find(x=>x.id===id)||TABS[0];cur=t;
  TABS.forEach(x=>{document.getElementById('tab-'+x.id).setAttribute('aria-selected',x.id===t.id);const f=document.getElementById('pane-'+x.id);if(f)f.classList.toggle('on',x.id===t.id)});
  let f=document.getElementById('pane-'+t.id);
  if(!f){f=document.createElement('iframe');f.id='pane-'+t.id;f.title=t.label;f.allow='fullscreen';f.allowFullscreen=true;f.className='on';
    f.addEventListener('load',()=>wire(f));f.srcdoc=html(t);panes.appendChild(f)}
  document.title=t.label+' · Week 5 Students';
  if(!noHash){try{history.replaceState(null,'','#'+t.id)}catch(e){}}
  try{document.getElementById('tab-'+t.id).scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
  setTimeout(()=>{try{f.contentWindow.focus()}catch(e){}},50);
}
go(location.hash.slice(1),true);
addEventListener('hashchange',()=>go(location.hash.slice(1),true));
</script>
