003c/span>. \"My boss told me to\" doesn't remove it.\u003c/li>\n\u003cli>\u003cb>Bias\u003c/b> \u003cspan class=\"s\">(a tendency to favor one view without good reason)\u003c/span> can blind people to evidence.\u003c/li>\n\u003cli>\u003cb>\"What's Love Got to Do with It?\"\u003c/b> (box): philosopher Martin Buber said love is a responsibility of one person for another, not just a feeling. Whole Foods founder John Mackey called love the basis of his business.\u003c/li>\n\u003c/ul>\n\n\u003ch2 id=\"p6\">\u003cspan class=\"n\">6\u003c/span>The Samsung Galaxy Note 7 case \u003cspan class=\"src\">(2.5, pp. 50–53, plus outside facts)\u003c/span>\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>When\u003c/th>\u003cth>What happened\u003c/th>\u003cth>Source\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Fall 2016\u003c/td>\u003ctd>Note 7 phones caught fire because of faulty batteries and casings; they were banned on airplanes. The textbook suggests Samsung rushed to launch before Apple's iPhone 7.\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Early response\u003c/td>\u003ctd>Samsung first denied technical problems, then blamed its suppliers.\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>September 2016\u003c/td>\u003ctd>Global recall announced; the U.S. Consumer Product Safety Commission recalled about 1 million phones (September 15).\u003c/td>\u003ctd>Outside (PCWorld)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>October 2016\u003c/td>\u003ctd>Replacement phones also caught fire. Samsung ended production; the recall was expanded (October 13).\u003c/td>\u003ctd>Outside (PCWorld)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Overall\u003c/td>\u003ctd>The textbook says Samsung recalled more than 2 million phones and replaced them, which limited the damage and even boosted its share price. Samsung later said 96% of about 3 million phones sold and activated were returned. The mobile division's operating profit fell 95% in one quarter.\u003c/td>\u003ctd>Textbook + outside\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>January 2017\u003c/td>\u003ctd>After testing over 200,000 phones and 30,000 batteries, Samsung said batteries from \u003cb>two different manufacturers\u003c/b> had different defects. It introduced an \u003cb>8-point battery safety check\u003c/b> and an outside expert advisory group.\u003c/td>\u003ctd>Outside (PCWorld)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>The textbook's view:\u003c/b> whether or not management intended it, the final response focused on customer safety — \"arguably a Kantian motive.\" Others argue Samsung could have acted faster and gone further.\u003c/p>\n\n\u003ch2 id=\"p7\">\u003cspan class=\"n\">7\u003c/span>The ethical reflection paragraph\u003c/h2>\n\u003cp>Six parts, each one sentence or two:\u003c/p>\n\u003col>\n\u003cli>\u003cb>Position\u003c/b> — your answer.\u003c/li>\n\u003cli>\u003cb>Reason\u003c/b> — why.\u003c/li>\n\u003cli>\u003cb>Evidence\u003c/b> — a specific fact from the case.\u003c/li>\n\u003cli>\u003cb>Framework\u003c/b> — named \u003ci>and applied\u003c/i> to the case (not just defined).\u003c/li>\n\u003cli>\u003cb>Counterargument\u003c/b> — the strongest opposing view, answered.\u003c/li>\n\u003cli>\u003cb>Conclusion\u003c/b> — back to your position.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"say\">\u003cb>The most common weakness on Quiz 1:\u003c/b> students \u003ci>defined\u003c/i> utilitarianism or Kant instead of \u003ci>applying\u003c/i> them. Tell them: \"Don't tell me what Kant said. Tell me what Kant would say about \u003ci>this\u003c/i> company.\"\u003c/div>\n\n\u003ch2 id=\"p8\">\u003cspan class=\"n\">8\u003c/span>Questions students may ask you\u003c/h2>\n\u003cdiv class=\"qa\">\u003cp class=\"q\">\"If something is normal in a culture, how can it be unethical?\"\u003c/p>\u003cp>Ask: who is harmed, and would they agree to it if they knew? Bribery may be common, but it still harms the people who lose fair contracts and public services. The textbook calls some values — not lying, not defrauding — close to absolute.\u003c/p>\u003c/div>\n\u003cdiv class=\"qa\">\u003cp class=\"q\">\"Isn't 'universal values' just Western values?\"\u003c/p>\u003cp>A fair challenge, and the textbook itself admits business ethics draws mainly on Western ideas. But values like honesty, fairness and not harming others appear in Confucian, religious and secular traditions alike (Week 2). Invite students to test it with their own examples.\u003c/p>\u003c/div>\n\u003cdiv class=\"qa\">\u003cp class=\"q\">\"Was Samsung unethical, or just unlucky?\"\u003c/p>\u003cp>The defect may have been an accident; the ethical questions are about the response — the early denial, blaming suppliers, and how quickly customers were protected.\u003c/p>\u003c/div>\n\u003cdiv class=\"qa\">\u003cp class=\"q\">\"Is the difference between etiquette and ethics always clear?\"\u003c/p>\u003cp>No — that's the point. Gifts, hiring relatives and indirect \"no\" answers sit on the line. A useful test: does it harm someone, deceive someone, or give an unfair advantage?\u003c/p>\u003c/div>\n\u003cdiv class=\"qa\">\u003cp class=\"q\">\"What happened to the Samsung heir?\"\u003c/p>\u003cp>The textbook mentions his 2017 bribery conviction. He later received a presidential pardon (2022), and in 2025 South Korea's Supreme Court upheld his acquittal in a separate merger case.\u003c/p>\u003c/div>\n\n\u003ch2 id=\"p9\">\u003cspan class=\"n\">9\u003c/span>One-page glossary\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Term\u003c/th>\u003cth>Simple meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>enculturation\u003c/td>\u003ctd>(learning your own society's rules and values)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>acculturation\u003c/td>\u003ctd>(cultural change when two cultures meet)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>etiquette\u003c/td>\u003ctd>(manners; what is polite)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>localization\u003c/td>\u003ctd>(adapting a product or practice to a local culture)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>consumerism\u003c/td>\u003ctd>(a lifestyle focused on buying things)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>mercantilism\u003c/td>\u003ctd>(old idea that wealth is fixed and must be taken from others)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>sweatshop\u003c/td>\u003ctd>(a factory with very low pay and bad conditions)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>kickback\u003c/td>\u003ctd>(an illegal secret payment in return for a contract)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>muckraker\u003c/td>\u003ctd>(a journalist who exposes corruption)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>UN Global Compact\u003c/td>\u003ctd>(voluntary business commitment to ten principles)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>stewardship\u003c/td>\u003ctd>(caring for wealth responsibly)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>secular\u003c/td>\u003ctd>(not religious)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>absolute / relative values\u003c/td>\u003ctd>(values that hold everywhere / that depend on time or place)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>universal values\u003c/td>\u003ctd>(values all people can accept)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>compliance\u003c/td>\u003ctd>(following laws and rules)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>humanistic business model\u003c/td>\u003ctd>(balancing profit with care for people)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>moral agency\u003c/td>\u003ctd>(the freedom and ability to choose right from wrong)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>bias\u003c/td>\u003ctd>(an unfair preference that blinds judgment)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>recall\u003c/td>\u003ctd>(asking customers to return a product)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\n\u003cfooter>Summarized from Byars &amp; Stanberry, \u003cem>Business Ethics\u003c/em>, OpenStax (CC BY-NC-SA 4.0), Chapter 5 and Section 2.5. Outside sources: PCWorld (January 2017) on Samsung's investigation; The Korea Times (July 2025) on the Lee Jae-yong ruling. For teacher use only.\u003c/footer>\n\u003c/main>\n\u003c/body>\n\u003c/html>\n", "slides": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Slides · Week 5 · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js\">\u003c/script>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0b1d36;overflow:hidden;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink)}\n#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n#deck{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}\n.slide{position:absolute;inset:0;background:#fbfaf6;padding:56px 76px 70px;display:none;flex-direction:column;overflow:hidden}\n.slide.on{display:flex}\n.slide.dark{background:var(--navy);color:#fff}\n.slide.cream{background:var(--cream)}\n.slide::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--gold)}\n.foot{position:absolute;left:76px;right:76px;bottom:22px;display:flex;justify-content:space-between;font-size:15px;color:var(--muted);letter-spacing:.04em}\n.dark .foot{color:var(--sky)}\n.kick{font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:10px}\n.dark .kick{color:var(--gold)}\nh1{font-family:\"Libre Baskerville\",serif;font-size:56px;line-height:1.12;margin:0 0 16px;color:var(--navy)}\n.dark h1{color:#fff}\nh2{font-family:\"Libre Baskerville\",serif;font-size:40px;line-height:1.18;margin:0 0 18px;color:var(--navy)}\n.dark h2{color:#fff}\np,li{font-size:27px;line-height:1.4;margin:0 0 10px}\nul,ol{margin:0;padding-left:34px}\n.big{font-size:34px;line-height:1.35}\n.q{font-family:\"Libre Baskerville\",serif;font-size:36px;line-height:1.35;color:var(--navy)}\n.dark .q{color:#fff}\n.muted{color:var(--muted)}.dark .muted{color:var(--sky)}\n.gold{color:var(--gold-d)}.dark .gold{color:var(--gold)}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}\n.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}\n.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}\n.box{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--blue);border-radius:12px;padding:16px 20px}\n.box h3{font-family:\"Libre Baskerville\",serif;margin:0 0 6px;font-size:24px;color:var(--navy)}\n.box p,.box li{font-size:21px}\n.dark .box{background:#1c4673;border-color:#2c5b8c;border-top-color:var(--gold);color:#fff}\n.dark .box h3{color:var(--gold)}\n.lang{margin-top:auto;background:var(--sky3);border-left:6px solid var(--gold);padding:10px 18px;border-radius:8px;font-size:20px;color:var(--navy)}\n.lang b{color:var(--gold-d)}\n.dark .lang{background:#1c4673;color:#fff}\n.dark .lang b{color:var(--gold)}\ntable{border-collapse:collapse;width:100%;font-size:21px;background:#fff}\nth,td{border:2px solid var(--sky);padding:8px 12px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.mean{display:flex;align-items:center;justify-content:center;gap:24px;font-size:34px;margin:24px 0}\n.mean .v{background:var(--navy);color:#fff;padding:12px 26px;border-radius:10px;font-weight:700}\n.mean .x{color:var(--gold-d);font-weight:700}\n.tag{display:inline-block;background:var(--navy);color:#fff;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:5px;margin-bottom:12px}\n.tag.s{background:var(--blue)}.tag.a{background:var(--gold-d)}.tag.b{background:#5a6b84}\n.step{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}\n.step.shown{opacity:1;transform:none}\n.timechip{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:3px 12px;border-radius:20px;font-size:18px;margin-left:10px;vertical-align:middle}\n.brand{display:flex;align-items:center;gap:16px;margin-bottom:auto}\n.brand img{height:74px}\n.brand .w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.14em;font-size:22px;line-height:1.1}\n.brand .w small{display:block;font-size:13px;letter-spacing:.03em;color:#e6d8a8}\n#qr{background:#fff;padding:10px;border-radius:10px;width:max-content}\n#qr img,#qr canvas{display:block;width:170px!important;height:170px!important}\n.warn{background:#fbf1dc;border-left:6px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:20px;margin-bottom:12px}\n#timer{position:fixed;right:18px;top:18px;background:var(--gold);color:var(--navy);font:700 46px \"Source Sans 3\",sans-serif;padding:6px 20px;border-radius:12px;display:none;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}\n#timer.done{background:#a33a2a;color:#fff;animation:pulse 1s infinite}\n@keyframes pulse{50%{opacity:.6}}\n#help{position:fixed;left:14px;bottom:12px;color:#7f93ad;font-size:13px;z-index:10}\n#prog{position:fixed;left:0;top:0;height:4px;background:var(--gold);z-index:11;transition:width .2s}\n@media print{html,body{overflow:visible;background:#fff;height:auto}#stage{position:static;display:block}#deck{transform:none!important;width:auto;height:auto}.slide{display:flex!important;position:relative;width:1280px;height:720px;break-after:page}.step{opacity:1;transform:none}#timer,#help,#prog{display:none}}\n\n.corners{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}\n.corners div{border-radius:12px;padding:18px 22px;font-size:30px;font-weight:700;color:#fff}\n.c1{background:#1c4f8f}.c2{background:#8c3a2a}.c3{background:#8c7535}.c4{background:#4a5f7a}\n.matrix{display:grid;grid-template-columns:60px 1fr 1fr;grid-template-rows:1fr 1fr 40px;gap:8px;height:420px}\n.matrix .q{border-radius:10px;padding:14px 18px;font-size:22px;background:var(--sky3);border:2px solid var(--sky)}\n.matrix .q b{display:block;font-size:24px;color:var(--navy)}\n.matrix .q.key{background:var(--navy);color:#fff;border-color:var(--navy)}\n.matrix .q.key b{color:var(--gold)}\n.matrix .ax{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-d);font-size:18px;letter-spacing:.08em}\n.matrix .ay{writing-mode:vertical-rl;transform:rotate(180deg)}\n.therm{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0;border-radius:10px;overflow:hidden;font-size:22px;font-weight:700;text-align:center}\n.therm div{padding:16px 8px}\n.paper{background:#f8f5ec;border:2px solid #2b2b2b;padding:22px 30px;font-family:\"Libre Baskerville\",serif;color:#1a1a1a;box-shadow:6px 6px 0 rgba(0,0,0,.15)}\n.paper .mast{text-align:center;font-size:44px;font-weight:700;border-bottom:4px double #1a1a1a;padding-bottom:6px;letter-spacing:.04em}\n.paper .date{display:flex;justify-content:space-between;font-family:\"Source Sans 3\",sans-serif;font-size:15px;border-bottom:1px solid #1a1a1a;padding:4px 0;margin-bottom:14px}\n.paper .head{font-size:44px;line-height:1.15;font-weight:700;margin:6px 0 10px}\n.paper p{font-family:\"Source Sans 3\",sans-serif;font-size:22px}\n.lie{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}\n.lie div{background:#fff;border:2px solid var(--sky);border-radius:12px;padding:14px 18px;font-size:23px;line-height:1.35}\n.lie b{color:var(--gold-d);font-size:26px;margin-right:6px}\n.ev{background:#fff;border:3px dashed var(--gold-d);border-radius:14px;padding:30px 36px;font-size:36px;line-height:1.35;font-family:\"Libre Baskerville\",serif;color:var(--navy);margin:12px 0}\n\n.fix{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.fix div{background:#fff;border:2px solid var(--sky);border-left:6px solid #a33a2a;border-radius:10px;padding:12px 16px;font-size:22px}\n.fix div.ok{border-left-color:#2f6b2f}\n.flaglist li{font-size:25px;margin:6px 0}\n.flaglist small{color:var(--gold-d);font-size:18px}\n.stn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.stn div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--blue);border-radius:10px;padding:10px 14px;font-size:20px}\n.stn b{display:block;color:var(--navy);font-family:\"Libre Baskerville\",serif;font-size:21px}\n.verdict{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:4px 14px;border-radius:6px;margin-top:6px}\n.fish{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}\n.fish div{background:var(--sky3);border-radius:10px;padding:12px;text-align:center;font-size:21px}\n.fish b{display:block;font-size:34px;color:var(--navy)}\n\n.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}\n.scale div{border-radius:10px;padding:10px;text-align:center;font-size:21px;font-weight:700;color:#fff}\n.sit li{font-size:26px;margin:10px 0}\n.ee{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.ee div{border-radius:12px;padding:16px 20px;font-size:22px}\n.para{background:#fff;border:2px solid var(--sky);border-radius:10px;padding:12px 16px;font-size:18px;line-height:1.45}\n.para.bad{border-left:8px solid #a33a2a}.para.good{border-left:8px solid #2f6b2f}\n.six{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.six div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:20px}\n.six b{display:block;font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:22px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"prog\">\u003c/div>\n\u003cdiv id=\"stage\">\u003cdiv id=\"deck\">\n\n\u003c!-- 1 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"brand\">\u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px\">\n    \u003cdiv>\u003cdiv class=\"kick\">Ethics in a Global World · Week 5\u003c/div>\n    \u003ch1>The Impact of Culture and\u003cbr>Time on Business Ethics\u003c/h1>\n    \u003cp class=\"muted\">Chapter 5 · Samsung Galaxy Note 7 · Quiz 2\u003c/p>\u003c/div>\n    \u003cdiv style=\"text-align:center\">\u003cdiv id=\"qr\">\u003c/div>\u003cp style=\"font-size:16px;margin-top:8px\" class=\"muted\">Scan for your worksheet\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5\u003c/span>\u003cspan>1\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection class=\"slide\">\n  \u003cdiv class=\"kick\">Today\u003c/div>\n  \u003ch2>Does ethics have a passport — and an expiry date?\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:10px\">\n    \u003cdiv class=\"box\">\u003ch3>Class 1 · 9:00–10:40\u003c/h3>\u003cp>\u003cb>Does Ethics Have a Passport?\u003c/b>\u003c/p>\u003cp>Culture: rude or wrong, a 1626 deal, your workplace norms, dilemmas\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>Break · 10:40–11:10\u003c/h3>\u003cp>A question from 1929\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Class 2 · 11:10–12:50\u003c/h3>\u003cp>\u003cb>Does Ethics Have an Expiry Date?\u003c/b>\u003c/p>\u003cp>Time, Samsung, a writing workshop and \u003cb>Quiz 2\u003c/b>\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:26px\" class=\"muted\">Please hand in \u003cb>Ethics Journal #4\u003c/b>.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5 · Overview\u003c/span>\u003cspan>2\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Rude or wrong?\u003c/h2>\n  \u003cp class=\"big\">For each situation, hold up fingers:\u003c/p>\n  \u003cdiv class=\"scale\">\n    \u003cdiv style=\"background:#2f6b2f\">1 · Fine\u003c/div>\n    \u003cdiv style=\"background:#8c7535\">2 · A bit rude\u003c/div>\n    \u003cdiv style=\"background:#b5651d\">3 · Very rude\u003c/div>\n    \u003cdiv style=\"background:#a33a2a\">4 · Unethical\u003c/div>\n  \u003c/div>\n  \u003cp class=\"muted\">Then discuss with a partner: where did you learn your answer?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>3\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Situations 1–3\u003c/h2>\n  \u003col class=\"sit\">\n    \u003cli>You arrive \u003cb>15 minutes late\u003c/b> to a meeting with a new client.\u003c/li>\n    \u003cli>Before any business talk, your host serves \u003cb>three rounds of tea\u003c/b> and talks about family for 40 minutes.\u003c/li>\n    \u003cli>A new colleague calls the \u003cb>CEO by her first name\u003c/b>.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>4\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Situations 4–6\u003c/h2>\n  \u003col class=\"sit\" start=\"4\">\n    \u003cli>A supplier sends your manager an \u003cb>expensive watch\u003c/b> the week before a contract decision.\u003c/li>\n    \u003cli>Your manager says \u003cb>\"yes, maybe\"\u003c/b> to a client's request, knowing the answer is no.\u003c/li>\n    \u003cli>A company tells an applicant the job is \u003cb>\"flexible\"\u003c/b> but expects 70-hour weeks.\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"muted\">Pairs: discuss the two situations with the most disagreement. \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>5\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Manners or morals?\u003c/div>\n  \u003cdiv class=\"ee\" style=\"margin-top:10px\">\n    \u003cdiv style=\"background:#1c4673\">\u003cb class=\"gold\" style=\"font-size:28px\">Etiquette\u003c/b>\u003cbr>manners · what is polite\u003cbr>\u003cspan class=\"muted\">1 · 2 · 3 — and maybe 5\u003c/span>\u003c/div>\n    \u003cdiv style=\"background:#5a2a22\">\u003cb style=\"color:#f6c9a4;font-size:28px\">Ethics\u003c/b>\u003cbr>morals · what is right or wrong\u003cbr>\u003cspan style=\"color:#e8c3b8\">4 · 6 — and maybe 5\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:26px\">Some answers came from how you were raised. Others would be wrong anywhere.\u003c/p>\n  \u003cp class=\"step big gold\">This week's question: where exactly is the line?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage · 5.3\u003c/span>\u003cspan>6\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study · 5.1\u003c/span>\n  \u003ch2>How do we learn a culture?\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>Enculturation\u003c/h3>\u003cp class=\"big\">Learning \u003cb>your own\u003c/b> society's rules, customs and values. No one is born with a culture.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>Acculturation\u003c/h3>\u003cp class=\"big\">Cultural change when \u003cb>two cultures meet\u003c/b>. It changes both sides.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q\" style=\"margin-top:20px;font-size:28px\">The textbook: business is \u003cspan class=\"gold\">not culturally neutral\u003c/span>.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study\u003c/span>\u003cspan>7\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag s\">Information gap\u003c/span>\n  \u003ch2>Manhattan, May 1626 \u003cspan class=\"timechip\">4 + 4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>Student A\u003c/h3>\u003cp>Read card A — the Dutch side. Don't show it.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Student B\u003c/h3>\u003cp>Read card B — the Lenape side. Don't show it.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"big\" style=\"margin-top:18px\">Explain your side to your partner. Then: What did each side think they agreed to? What assumption caused the problem?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · 5.1\u003c/span>\u003cspan>8\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 9 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">The textbook (5.1)\u003c/span>\n  \u003ch2>One deal, two meanings\u003c/h2>\n  \u003cul>\n    \u003cli class=\"step\">The Dutch paid goods worth \"sixty guilders\" (about $1,000 today). To them, it was a \u003cb>purchase\u003c/b>.\u003c/li>\n    \u003cli class=\"step\">No deed survives. Some historians think the Lenape granted \u003cb>use rights\u003c/b>, not ownership.\u003c/li>\n    \u003cli class=\"step\">The dispute over property later led to \u003cb>war\u003c/b>. (\"$24 in beads\" is a legend.)\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"step q\" style=\"margin-top:18px;font-size:28px\">Where do two sides sign the same contract today — and understand it differently?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · 5.1\u003c/span>\u003cspan>9\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 10 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Cultural consultants · ground rule\u003c/div>\n  \u003ch2>Speak from a workplace you know.\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"margin-top:16px\">\n    \u003cdiv class=\"box\">\u003ch3>Yes\u003c/h3>\u003cp class=\"big\">\"In the hospital where I worked in ___, …\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:#a33a2a\">\u003ch3>No\u003c/h3>\u003cp class=\"big\">\"In my country, everyone…\"\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"big gold\" style=\"margin-top:20px\">One workplace is not a whole nation.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>10\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 11 -->\n\u003csection class=\"slide\" data-t=\"7\">\n  \u003cspan class=\"tag a\">Activate\u003c/span>\n  \u003ch2>Your consultant profile \u003cspan class=\"timechip\">7 min\u003c/span>\u003c/h2>\n  \u003cp>One workplace you know well (country, industry, size). How does it handle…\u003c/p>\n  \u003cdiv class=\"cols3\" style=\"gap:10px 18px;margin-top:6px\">\n    \u003cdiv class=\"box\">\u003cp>\u003cb>1\u003c/b> Time and punctuality\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>2\u003c/b> Gifts and hospitality\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>3\u003c/b> Disagreeing with your boss\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>4\u003c/b> Relationships before business\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>5\u003c/b> Hiring family and friends\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003cp>\u003cb>6\u003c/b> A serious ethical violation\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · 5.3\u003c/span>\u003cspan>11\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 12 -->\n\u003csection class=\"slide cream\" data-t=\"5\">\n  \u003cspan class=\"tag a\">Speed consulting\u003c/span>\n  \u003ch2>Three rounds · 5 minutes each\u003c/h2>\n  \u003cul>\n    \u003cli>Compare \u003cb>two norms\u003c/b> of your choice.\u003c/li>\n    \u003cli>Find \u003cb>one surprising difference\u003c/b> and \u003cb>one similarity\u003c/b>.\u003c/li>\n    \u003cli>Note your partner's examples. Then move.\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"In the company where I worked, it was common to…\" · \"That surprised me, because…\" · \"We do that too, but for a different reason.\" · \"I wouldn't generalize, but…\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>12\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 13 -->\n\u003csection class=\"slide\" data-t=\"10\">\n  \u003cspan class=\"tag a\">Groups of 4\u003c/span>\n  \u003ch2>Sort your differences \u003cspan class=\"timechip\">10 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"ee\">\n    \u003cdiv style=\"background:var(--sky3)\">\u003cb style=\"color:var(--navy);font-size:26px\">Etiquette\u003c/b>\u003cbr>We would \u003cb>adapt\u003c/b> to it.\u003c/div>\n    \u003cdiv style=\"background:#fbefec\">\u003cb style=\"color:#a33a2a;font-size:26px\">Ethics\u003c/b>\u003cbr>We would \u003cb>not compromise\u003c/b>.\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q\" style=\"margin-top:22px\">Then agree on \u003cspan class=\"gold\">one value\u003c/span> that seemed universal across all your workplaces.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · 5.4\u003c/span>\u003cspan>13\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 14 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Activate\u003c/span>\n  \u003ch2>Dilemma cards: adapt or refuse?\u003c/h2>\n  \u003cdiv class=\"cols3\">\n    \u003cdiv class=\"box\">\u003ch3>1 · \"Everyone expects it here\"\u003c/h3>\u003cp>Siemens paid billions in fines for bribing officials in several countries. (5.1)\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>2 · Whose standard?\u003c/h3>\u003cp>Nike's 1990s sweatshop suppliers. Western standards — imperialism or humanity? (5.1)\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>3 · Lunch during Ramadan\u003c/h3>\u003cp>An auditor in Islamabad; her colleagues are fasting. Where should she eat? (5.3)\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:16px\">Triads: choose \u003cb>two\u003c/b> cards.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>14\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 15 -->\n\u003csection class=\"slide cream\" data-t=\"15\">\n  \u003cspan class=\"tag a\">For each card\u003c/span>\n  \u003ch2>Three questions \u003cspan class=\"timechip\">15 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>Etiquette, ethics,\u003c/b> or both?\u003c/li>\n    \u003cli>\u003cb>Adapt\u003c/b> to the local norm, or \u003cb>keep\u003c/b> your own standard?\u003c/li>\n    \u003cli>Which \u003cb>framework\u003c/b> supports your answer? \u003cspan class=\"muted\">virtue · utilitarian · Kantian · Rawlsian · stakeholder\u003c/span>\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"That's a matter of manners rather than morals.\" · \"I'd adapt to that, but I'd draw the line at…\" · \"From a Kantian standpoint, …\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>15\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 16 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Debrief · 5.3\u003c/span>\n  \u003ch2>Where does localization stop?\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>Localization\u003c/h3>\u003cp>Adapting a product or practice to a local culture — e.g., McDonald's serving \u003cb>sambal\u003c/b> chili sauce in Indonesia.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>The GLOBE study\u003c/h3>\u003cp>Good leaders must \u003cb>\"understand and exceed\"\u003c/b> the expectations of the cultures they work in.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:20px;font-size:28px\">Adapt your manners. \u003cspan class=\"gold\">Keep your morals.\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Debrief\u003c/span>\u003cspan>16\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 17 -->\n\u003csection class=\"slide dark\" data-t=\"6\">\n  \u003cdiv class=\"kick\">Exit ticket\u003c/div>\n  \u003ch2>Before the break \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>Enculturation\u003c/b> vs. \u003cb>acculturation\u003c/b>, in your own words.\u003c/li>\n    \u003cli>One difference you'd \u003cb>adapt\u003c/b> to — and one you'd \u003cb>refuse\u003c/b>.\u003c/li>\n    \u003cli>One question you still have.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Exit ticket\u003c/span>\u003cspan>17\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 18 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Break · 10:40–11:10 · Think about this\u003c/div>\n  \u003ch1>New York, 1929.\u003c/h1>\n  \u003cp class=\"big\">Edward Bernays markets Lucky Strike cigarettes to women as \u003cb class=\"gold\">\"torches of freedom.\"\u003c/b>\u003c/p>\n  \u003cp class=\"q\" style=\"margin-top:24px\">Was that wrong \u003cspan class=\"gold\">then\u003c/span> — or only wrong \u003cspan class=\"gold\">now\u003c/span>?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Break · 5.2\u003c/span>\u003cspan>18\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 19 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"brand\">\u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\u003c/div>\n  \u003cdiv class=\"kick\">Class 2 · 11:10–12:50\u003c/div>\n  \u003ch1>Does Ethics Have\u003cbr>an Expiry Date?\u003c/h1>\n  \u003cp class=\"muted\">Then &amp; now · Samsung crisis room · writing workshop · Quiz 2\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5 · Class 2\u003c/span>\u003cspan>19\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 20 -->\n\u003csection class=\"slide\" data-t=\"5\">\n  \u003cspan class=\"tag\">Bridge · 5.2\u003c/span>\n  \u003ch2>When even doctors smoked\u003c/h2>\n  \u003cul>\n    \u003cli>1940s–1970s: judges, factory workers, even \u003cb>pregnant women\u003c/b> and \u003cb>doctors\u003c/b> smoked.\u003c/li>\n    \u003cli class=\"step\">\u003cb>January 11, 1964:\u003c/b> the U.S. Surgeon General's report linked smoking to lung cancer.\u003c/li>\n    \u003cli class=\"step\">Today: smoking has declined in the West but is still promoted elsewhere — especially to \u003cb>young people\u003c/b>.\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"step q\" style=\"margin-top:18px;font-size:28px\">Did the \u003cspan class=\"gold\">facts\u003c/span> change — or the \u003cspan class=\"gold\">ethics\u003c/span>? \u003cspan class=\"timechip\">5 min\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Bridge\u003c/span>\u003cspan>20\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 21 -->\n\u003csection class=\"slide\" data-t=\"8\">\n  \u003cspan class=\"tag s\">Study · 5.2\u003c/span>\n  \u003ch2>Then &amp; now sort \u003cspan class=\"timechip\">8 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box\">\u003ch3>A · Wrong then and now\u003c/h3>\u003cp class=\"big\">We just enforce it better.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>B · The standard changed\u003c/h3>\u003cp class=\"big\">What's acceptable is different now.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:18px\">Mercantilism · fur · Standard Oil · \u003ci>Dodge v. Ford\u003c/i> · LIBOR · \"human capital\" · the UN Global Compact\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Study\u003c/span>\u003cspan>21\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 22 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study · 5.4\u003c/span>\n  \u003ch2>Absolute, relative, universal\u003c/h2>\n  \u003cdiv class=\"cols3\">\n    \u003cdiv class=\"box\">\u003ch3>Absolute\u003c/h3>\u003cp>Close to objective: don't lie, don't defraud customers, don't cheat. Exceptions need strong reasons.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Relative\u003c/h3>\u003cp>Depends on time, place or culture: dress, punctuality, fur.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Universal\u003c/h3>\u003cp>Values all people can accept. Starting point: the UN Universal Declaration of Human Rights (1948).\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:20px;font-size:27px\">The textbook: standards change over time — but that does \u003cspan class=\"gold\">not\u003c/span> make ethics simply relative.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Study\u003c/span>\u003cspan>22\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 23 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Case study · Section 2.5\u003c/div>\n  \u003ch1>Samsung Galaxy Note 7\u003c/h1>\n  \u003cp class=\"big\">Fall 2016. The new phones are \u003cb class=\"gold\">catching fire\u003c/b>. Airlines will soon ban them.\u003c/p>\n  \u003cp class=\"big\">You are Samsung's \u003cb>crisis team\u003c/b>. Three decisions, 4 minutes each.\u003c/p>\n  \u003cp class=\"muted\">The textbook suggests Samsung rushed to launch before Apple's iPhone 7.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>23\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 24 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag a\">Decision 1 · early September 2016\u003c/span>\n  \u003ch2>Reports of phones overheating and catching fire \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:14px\">\n    \u003cdiv class=\"box\">\u003ch3>A\u003c/h3>\u003cp class=\"big\">Say there is no technical problem.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>B\u003c/h3>\u003cp class=\"big\">Blame the suppliers.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>C\u003c/h3>\u003cp class=\"big\">Stop sales and recall all phones now.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:16px\">Choose one. Write one reason.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>24\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 25 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag a\">Decision 2 · October 2016\u003c/span>\n  \u003ch2>The replacement phones are catching fire too \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"margin-top:14px\">\n    \u003cdiv class=\"box\">\u003ch3>A\u003c/h3>\u003cp class=\"big\">Fix it again and keep selling.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>B\u003c/h3>\u003cp class=\"big\">Stop production. Take the phone off the market permanently.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>25\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 26 -->\n\u003csection class=\"slide\" data-t=\"4\">\n  \u003cspan class=\"tag a\">Decision 3 · January 2017\u003c/span>\n  \u003ch2>The investigation is finished. What does your statement say? \u003cspan class=\"timechip\">4 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:14px\">\n    \u003cdiv class=\"box\">\u003ch3>A\u003c/h3>\u003cp class=\"big\">\"Our suppliers' batteries were faulty.\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>B\u003c/h3>\u003cp class=\"big\">\"We are responsible. Here's how we'll prevent it.\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>C\u003c/h3>\u003cp class=\"big\">Both.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>26\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 27 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">What actually happened\u003c/div>\n  \u003cul style=\"font-size:24px\">\n    \u003cli class=\"step\">\u003cb class=\"gold\">1\u003c/b> Samsung first denied technical problems, then blamed suppliers. A global recall followed in September. \u003cspan class=\"muted\">(textbook)\u003c/span>\u003c/li>\n    \u003cli class=\"step\">\u003cb class=\"gold\">2\u003c/b> Replacements failed too. Production ended; about 96% of ~3 million phones were returned. \u003cspan class=\"muted\">(PCWorld)\u003c/span>\u003c/li>\n    \u003cli class=\"step\">\u003cb class=\"gold\">3\u003c/b> January 2017: 200,000+ phones tested. Batteries from \u003cb>two suppliers\u003c/b> had different defects. New \u003cb>8-point battery safety check\u003c/b>. \u003cspan class=\"muted\">(PCWorld)\u003c/span>\u003c/li>\n    \u003cli class=\"step\">The textbook: the response limited the damage and even boosted the share price — \"arguably a Kantian motive.\"\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung · 2.5 + outside source\u003c/span>\u003cspan>27\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 28 -->\n\u003csection class=\"slide cream\" data-t=\"5\">\n  \u003cspan class=\"tag a\">Evaluate\u003c/span>\n  \u003ch2>Was Samsung's response ethical? \u003cspan class=\"timechip\">5 min\u003c/span>\u003c/h2>\n  \u003cul>\n    \u003cli>Closer to the ethical \u003cb>minimum\u003c/b> or \u003cb>maximum\u003c/b>?\u003c/li>\n    \u003cli>\u003cb>Kant:\u003c/b> customers as ends — or a launch schedule first?\u003c/li>\n    \u003cli>\u003cb>Utilitarian:\u003c/b> the mobile division's profit fell 95% in one quarter. Worth it — for whom?\u003c/li>\n    \u003cli>Samsung designed and sold the phone. Is it fair to \u003cb>blame the suppliers\u003c/b>?\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"Samsung \u003cb>should have\u003c/b>…\" · \"It \u003cb>could have\u003c/b>…\" · \"Ultimately, ___ is accountable for…\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Samsung\u003c/span>\u003cspan>28\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 29 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Writing workshop\u003c/span>\n  \u003ch2>The ethical reflection paragraph\u003c/h2>\n  \u003cdiv class=\"six\">\n    \u003cdiv>\u003cb>1 Position\u003c/b>Your answer, in one sentence\u003c/div>\n    \u003cdiv>\u003cb>2 Reason\u003c/b>Why?\u003c/div>\n    \u003cdiv>\u003cb>3 Evidence\u003c/b>A specific fact from the case\u003c/div>\n    \u003cdiv>\u003cb>4 Framework\u003c/b>Named — and \u003cu>applied\u003c/u> to the case\u003c/div>\n    \u003cdiv>\u003cb>5 Counterargument\u003c/b>Stated fairly, then answered\u003c/div>\n    \u003cdiv>\u003cb>6 Conclusion\u003c/b>Back to your position\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q\" style=\"margin-top:18px;font-size:26px\">Don't tell me what Kant said. \u003cspan class=\"gold\">Tell me what Kant would say about this company.\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>29\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 30 -->\n\u003csection class=\"slide\" data-t=\"6\">\n  \u003cspan class=\"tag a\">Weak vs. strong\u003c/span>\n  \u003ch2>Find three differences \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"gap:14px\">\n    \u003cdiv class=\"para bad\">\u003cb>Weak.\u003c/b> Samsung's response was ethical and not ethical. Utilitarianism is the greatest happiness for the greatest number. Kant is about duty. Companies should be responsible. In my opinion they should always think about customers because customers are important. So it is good and bad.\u003c/div>\n    \u003cdiv class=\"para good\" style=\"font-size:15.5px\">\u003cb>Strong.\u003c/b> Samsung's final response was largely ethical, but it came too late. The company first denied any technical problem and blamed its suppliers, while phones were still catching fire. Only later did it stop production and take back about 96% of roughly 3 million phones. From a Kantian perspective, the recall respected customers as ends in themselves; however, the early denial treated their safety as less important than the launch schedule. Some would argue that Samsung needed time to find the cause. That is fair, but when safety is at risk, a company should act first and investigate later. Overall, Samsung reached the ethical maximum only after trying the minimum.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>30\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 31 -->\n\u003csection class=\"slide\" data-t=\"13\">\n  \u003cspan class=\"tag a\">Write\u003c/span>\n  \u003ch2>Your paragraph · 120–170 words \u003cspan class=\"timechip\">13 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>A\u003c/b> · Was Samsung's response to the Note 7 crisis ethical?\u003c/li>\n    \u003cli>\u003cb>B\u003c/b> · Should Siemens have paid bribes where \"everyone expects it\"?\u003c/li>\n    \u003cli>\u003cb>C\u003c/b> · Should Jillian change her behavior during Ramadan?\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"Although…, …\" · \"While it's true that…, …\" · \"That is fair; however, …\" · \"From a ___ perspective, …\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>31\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 32 -->\n\u003csection class=\"slide cream\" data-t=\"6\">\n  \u003cspan class=\"tag a\">Peer review\u003c/span>\n  \u003ch2>Swap and check \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/h2>\n  \u003cul>\n    \u003cli>Tick each of the \u003cb>six parts\u003c/b> you find.\u003c/li>\n    \u003cli>\u003cb>Underline\u003c/b> the framework sentence. Is it \u003ci>applied\u003c/i> to the case?\u003c/li>\n    \u003cli>Write \u003cb>one suggestion\u003c/b> for improvement.\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Writing workshop\u003c/span>\u003cspan>32\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 33 -->\n\u003csection class=\"slide dark\" data-t=\"25\">\n  \u003cdiv class=\"kick\">Assessment\u003c/div>\n  \u003ch1>Quiz 2 \u003cspan class=\"timechip\">25 min\u003c/span>\u003c/h1>\n  \u003cp class=\"big\">Chapters 4–5 · 30 points\u003c/p>\n  \u003cul>\n    \u003cli>Part A · Multiple choice (10)\u003c/li>\n    \u003cli>Part B · Matching (8)\u003c/li>\n    \u003cli>Part C · A short case + your reflection paragraph (12)\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"muted\" style=\"margin-top:16px\">Phones away. Work alone. Use the six-part structure in Part C.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 2 · Quiz 2\u003c/span>\u003cspan>33\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 34 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Before next week\u003c/div>\n  \u003ch2>Homework\u003c/h2>\n  \u003col>\n    \u003cli>\u003cb>Ethics Journal #5\u003c/b> (150–200 words) — choose one: \u003cspan class=\"muted\">Ramadan · Petrobras · Love in business\u003c/span>\u003c/li>\n    \u003cli>Use the \u003cb>six-part paragraph\u003c/b> structure.\u003c/li>\n    \u003cli>\u003cb class=\"gold\">Midterm next week\u003c/b> — review Chapters 1–5, your journals and both quizzes.\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"muted\" style=\"margin-top:20px\">Don't forget: \u003cb>Download\u003c/b> your worksheet.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 5 · Homework\u003c/span>\u003cspan>34\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c/div>\u003c/div>\n\u003cdiv id=\"timer\" title=\"Click to pause; double-click to hide\">\u003c/div>\n\u003cdiv id=\"help\">← → or tap · T timer · F fullscreen\u003c/div>\n\u003cscript>\nconst slides=[...document.querySelectorAll('.slide')];\nlet i=0;\nfunction fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('deck').style.transform=`scale(${s})`}\naddEventListener('resize',fit);fit();\nfunction show(n,back){\n  i=Math.max(0,Math.min(slides.length-1,n));\n  slides.forEach((s,k)=>s.classList.toggle('on',k===i));\n  slides[i].querySelectorAll('.step').forEach(e=>e.classList.toggle('shown',!!back));\n  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';\n  try{history.replaceState(null,'','#'+(i+1))}catch(e){}\n}\nfunction next(){const h=slides[i].querySelector('.step:not(.shown)');if(h){h.classList.add('shown');return}if(i\u003cslides.length-1)show(i+1)}\nfunction prev(){const s=[...slides[i].querySelectorAll('.step.shown')];if(s.length){s[s.length-1].classList.remove('shown');return}if(i>0)show(i-1,true)}\naddEventListener('keydown',e=>{\n  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}\n  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}\n  else if(e.key==='t'||e.key==='T')startTimer();\n  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}\n  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);\n});\ndocument.getElementById('stage').addEventListener('click',e=>{if(e.clientX\u003cinnerWidth/3)prev();else next()});\nlet tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});\naddEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx\u003c0?next():prev();e.preventDefault()}tx=null});\n/* timer */\nconst T=document.getElementById('timer');let left=0,run=null,paused=false;\nfunction fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}\nfunction startTimer(){const m=+(slides[i].dataset.t||5);left=m*60;paused=false;T.classList.remove('done');T.style.display='block';T.textContent=fmt(left);clearInterval(run);run=setInterval(()=>{if(paused)return;left--;T.textContent=fmt(Math.max(0,left));if(left\u003c=0){clearInterval(run);T.classList.add('done');T.textContent=\"Time!\"}},1000)}\nT.addEventListener('click',e=>{e.stopPropagation();paused=!paused;T.style.opacity=paused?.6:1});\nT.addEventListener('dblclick',e=>{e.stopPropagation();clearInterval(run);T.style.display='none'});\n/* QR */\ntry{const url=(function(){try{if(parent!==window)return parent.location.href.split('#')[0].replace(/[^\\/]*$/,'students.html')+'#worksheet'}catch(e){}return location.href.split('#')[0].replace(/slides\\.html.*$/,'worksheet.html')})();if(window.QRCode&&/^https?:/.test(url))new QRCode(document.getElementById('qr'),{text:url,width:170,height:170,colorDark:'#143865',colorLight:'#ffffff'});else document.getElementById('qr').closest('div[style]').style.display='none'}catch(e){}\nshow(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "handouts": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Week 5 Handouts · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:#e9ecf1}\n.ctl{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:12px 16px}\n.ctl .in{max-width:8.5in;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.ctl h1{font-family:\"Libre Baskerville\",serif;font-size:18px;margin:0;flex-basis:100%}\n.ctl label{font-size:14px;display:flex;gap:5px;align-items:center}\n.btn{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}\n.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}\n.page{width:8.5in;min-height:11in;margin:18px auto;background:#fff;padding:.45in .5in;box-shadow:0 4px 16px rgba(0,0,0,.12);position:relative;font-size:12.5pt;line-height:1.38}\n.page.off{display:none}\n.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--gold);padding-bottom:5px;margin-bottom:12px}\n.ph b{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:15pt}\n.ph span{font-size:9.5pt;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}\n.pf{position:absolute;bottom:.25in;left:.5in;right:.5in;font-size:8pt;color:#7a8597;display:flex;justify-content:space-between}\n.cut{border:1.5px dashed #9aa8bb;border-radius:6px}\n.grid{display:grid;gap:8px}\n.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}\n.card{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:1.05in}\n.card.v{background:var(--navy);color:#fff;font-weight:700;font-size:16pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.card.x{font-size:14pt;font-weight:600;color:var(--navy)}\n.half{padding:12px 16px;margin-bottom:12px}\nh3{font-family:\"Libre Baskerville\",serif;color:var(--navy);margin:0 0 6px;font-size:13.5pt}\n.line{border-bottom:1px solid #aab4c3;height:24px}\n.lbl{font-weight:700;color:var(--navy);font-size:11pt;margin-top:6px}\n.small{font-size:10.5pt}\n.tiny{font-size:9.5pt;color:var(--muted)}\n.box{background:var(--sky3);border-left:4px solid var(--gold);padding:7px 11px;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.fw{border:1.5px solid var(--sky);border-top:5px solid var(--blue);border-radius:8px;padding:8px 12px;margin-bottom:9px;font-size:10.5pt;line-height:1.32}\n.fw p{margin:3px 0}\n.id{padding:10px 12px;min-height:2.2in;display:flex;flex-direction:column}\n.id .who{font-family:\"Libre Baskerville\",serif;font-weight:700;color:var(--navy);font-size:13pt;margin-bottom:6px}\n.id .q{margin-top:auto;font-size:10pt;color:var(--gold-d);font-weight:700}\n.tc{min-height:.95in;padding:8px 10px;display:flex;align-items:center;justify-content:center;text-align:center}\n.tc.n{font-family:\"Libre Baskerville\",serif;font-weight:700;color:var(--navy);font-size:15pt;background:var(--cream);-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.tc.i{font-size:11.5pt}\n.ev{padding:8px 11px;min-height:1.25in;font-size:11pt}\n.ev .s{font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}\nul{margin:4px 0;padding-left:20px}\n@media print{\n  @page{size:letter;margin:0}\n  body{background:#fff}\n  .ctl{display:none}\n  .page{margin:0;box-shadow:none;break-after:page;width:8.5in;height:11in;min-height:0;overflow:hidden}\n  .page.off{display:none}\n}\n@media (max-width:8.7in){.page{transform-origin:top left}}\n\n.sign{height:4.7in;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:14px;color:#fff;margin-bottom:.25in;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.sign b{font-family:\"Libre Baskerville\",serif;font-size:58pt;line-height:1.05}\n.sign span{font-size:16pt;margin-top:10px;opacity:.9}\n.case{padding:10px 12px;min-height:2.05in;font-size:11pt;line-height:1.35}\n.case h3{font-size:12.5pt}\n.case .mm{margin-top:6px;font-size:9.5pt;color:var(--gold-d);font-weight:700}\n.strip{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-weight:700;font-size:12pt;border-radius:6px;overflow:hidden;margin-top:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.strip div{padding:12px 4px}\n.mxp{display:grid;grid-template-columns:.35in 1fr 1fr;grid-template-rows:4.1in 4.1in .35in;gap:6px}\n.mxp .q{border:2px solid var(--navy);border-radius:8px;padding:8px 10px;font-size:11pt;color:var(--navy)}\n.mxp .q b{display:block;font-size:13pt}\n.mxp .k{background:#eef2f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.mxp .ax{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-d);letter-spacing:.1em}\n.mxp .ay{writing-mode:vertical-rl;transform:rotate(180deg)}\n.brief{padding:12px 16px;font-size:11pt;line-height:1.4;margin-bottom:10px}\n.evc{min-height:1.55in;padding:12px 14px;font-size:13pt;line-height:1.35;display:flex;flex-direction:column;justify-content:center}\n.evc .n{font-size:9pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d)}\n.role{padding:9px 12px;min-height:1.92in;font-size:10.3pt;line-height:1.32;margin-bottom:8px}\n.role h3{font-size:12.5pt;margin:0 0 2px}\n.role .cat{font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}\n.role .sec{background:#fbf1dc;border-left:3px solid var(--gold);padding:4px 8px;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.slip{padding:8px 12px;font-size:10.5pt}\n\n.slip{padding:10px 12px;font-size:10.5pt}\n.slip table{width:100%;border-collapse:collapse;margin-top:4px}\n.slip td,.slip th{border:1px solid #aab4c3;padding:4px;text-align:center;font-size:10pt}\n.judge{padding:12px 16px;margin-bottom:10px;font-size:11.5pt;line-height:1.4}\n.poster{height:4.8in;padding:16px 20px;margin-bottom:.15in;display:flex;flex-direction:column;border:2px solid var(--navy);border-top:10px solid var(--navy);border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.poster .loc{font-family:\"Libre Baskerville\",serif;font-size:22pt;color:var(--navy);font-weight:700}\n.poster .yr{font-size:11pt;color:var(--gold-d);font-weight:700;letter-spacing:.1em;text-transform:uppercase}\n.poster p{font-size:13pt;line-height:1.4;margin:8px 0}\n.poster .qs{margin-top:auto;background:var(--sky3);border-radius:6px;padding:8px 12px;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.poster .src{font-size:9pt;color:var(--muted)}\n.flagstrip{padding:10px 14px;font-size:10.5pt;margin-bottom:8px}\n.flagstrip ol{margin:4px 0;padding-left:20px}\n.pile{height:1.4in;display:flex;align-items:center;justify-content:center;font-family:\"Libre Baskerville\",serif;font-size:20pt;font-weight:700;color:#fff;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.cc{min-height:1.95in;padding:10px 12px;font-size:11pt;line-height:1.35;display:flex;flex-direction:column}\n.cc .n{font-size:9pt;font-weight:700;color:var(--gold-d);letter-spacing:.08em;text-transform:uppercase}\n.cc .tb{margin-top:auto;font-size:8.5pt;color:var(--muted)}\n.tool{padding:8px 12px;font-size:10.5pt}\n.ev{min-height:1.15in;padding:8px 11px;font-size:10.5pt}\n.ev .s{font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}\n\n.ig{padding:10px 16px;font-size:11pt;line-height:1.38;margin-bottom:9px}\n.ig .who{font-family:\"Libre Baskerville\",serif;font-size:15pt;color:var(--navy);font-weight:700}\n.prof{padding:10px 14px;font-size:10.5pt;margin-bottom:10px}\n.prof .row{display:grid;grid-template-columns:2.1in 1fr;gap:6px;align-items:end;margin:5px 0}\n.prof .row span{font-weight:700;color:var(--navy);font-size:10pt}\n.dl{padding:12px 16px;font-size:11.5pt;line-height:1.4;margin-bottom:10px}\n.tn{min-height:1.5in;padding:10px 12px;font-size:11.5pt;line-height:1.35;display:flex;flex-direction:column;justify-content:center}\n.pile2{height:1.1in;display:flex;align-items:center;justify-content:center;text-align:center;font-family:\"Libre Baskerville\",serif;font-size:15pt;font-weight:700;color:#fff;border-radius:8px;padding:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.dec{padding:12px 16px;font-size:11.5pt;margin-bottom:10px}\n.dec h3{margin-bottom:4px}\n.mp{padding:12px 16px;font-size:11pt;line-height:1.45;margin-bottom:10px}\n.pr{padding:10px 14px;font-size:10.5pt}\n.pr li{margin:4px 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"ctl\">\u003cdiv class=\"in\">\n  \u003ch1>Week 5 Handouts · untick pages you don't need, then print (Letter, 100%, no margins)\u003c/h1>\n  \u003cdiv id=\"toggles\" style=\"display:contents\">\u003c/div>\n  \u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\n  \u003ca class=\"btn ghost\" href=\"index.html\">All files\u003c/a>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"1 Manhattan info-gap cards\">\n  \u003cdiv class=\"ph\">\u003cb>Two sides of a deal · Manhattan, 1626\u003c/b>\u003cspan>Class 1 · half the class A, half B · cut\u003c/span>\u003c/div>\n  \u003cdiv id=\"ig\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Based on OpenStax Business Ethics 5.1 (CC BY-NC-SA 4.0)\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"2 Consultant profiles (×2)\">\n  \u003cdiv class=\"ph\">\u003cb>Cultural consultant profile\u003c/b>\u003cspan>Class 1 · 1 per student · cut in half\u003c/span>\u003c/div>\n  \u003cdiv id=\"prof\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Ethics in a Global World · Week 5\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"3 Dilemma cards\">\n  \u003cdiv class=\"ph\">\u003cb>Dilemma cards · adapt or refuse?\u003c/b>\u003cspan>Class 1 · 1 set per triad · cut\u003c/span>\u003c/div>\n  \u003cdiv id=\"dl\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Cases from OpenStax Business Ethics 5.1 and 5.3 (CC BY-NC-SA 4.0)\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"4 Then & now cards\">\n  \u003cdiv class=\"ph\">\u003cb>Then &amp; now · sort the cards\u003c/b>\u003cspan>Class 2 · 1 set per pair · cut\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid g2\" id=\"tn\">\u003c/div>\n  \u003cdiv class=\"grid g2\" style=\"margin-top:10px\">\n    \u003cdiv class=\"pile2\" style=\"background:#a33a2a\">A · Wrong then and now\u003cbr>(we just enforce it better)\u003c/div>\n    \u003cdiv class=\"pile2\" style=\"background:#1c4f8f\">B · The standard itself has changed\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>OpenStax Business Ethics 5.2 and 5.4 (CC BY-NC-SA 4.0)\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"5 Samsung decision cards\">\n  \u003cdiv class=\"ph\">\u003cb>Samsung Galaxy Note 7 · crisis room\u003c/b>\u003cspan>Class 2 · 1 set per group\u003c/span>\u003c/div>\n  \u003cp class=\"small\" style=\"margin:0 0 10px\">\u003cb>Fall 2016.\u003c/b> Samsung's new Galaxy Note 7 phones are catching fire. You are the crisis team. For each decision, choose an option and write one reason. \u003ci>(Textbook 2.5; the textbook suggests Samsung rushed to launch before Apple's iPhone 7.)\u003c/i>\u003c/p>\n  \u003cdiv id=\"dec\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Case: OpenStax Business Ethics 2.5 (CC BY-NC-SA 4.0)\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"6 Model paragraphs\">\n  \u003cdiv class=\"ph\">\u003cb>Writing workshop · weak vs. strong\u003c/b>\u003cspan>Class 2 · 1 per pair\u003c/span>\u003c/div>\n  \u003cp class=\"small\" style=\"margin:0 0 8px\">\u003cb>Question:\u003c/b> Was Samsung's response to the Note 7 crisis ethical?\u003c/p>\n  \u003cdiv class=\"cut mp\" style=\"border-left:6px solid #a33a2a\">\u003cb>Paragraph 1\u003c/b>\u003cbr>Samsung's response was ethical and not ethical. Utilitarianism is the greatest happiness for the greatest number. Kant is about duty. Companies should be responsible. In my opinion they should always think about customers because customers are important. So it is good and bad.\u003c/div>\n  \u003cdiv class=\"cut mp\" style=\"border-left:6px solid #2f6b2f\">\u003cb>Paragraph 2\u003c/b>\u003cbr>Samsung's final response was largely ethical, but it came too late. The company first denied any technical problem and blamed its suppliers, while phones were still catching fire. Only later did it stop production and take back about 96% of roughly 3 million phones. From a Kantian perspective, the recall respected customers as ends in themselves, not merely as sources of profit; however, the early denial treated their safety as less important than the launch schedule. Some would argue that Samsung acted reasonably, since it needed time to find the cause. That is fair, but when people's safety is at risk, a company should act first and investigate later. Overall, Samsung reached the ethical maximum only after trying the minimum.\u003c/div>\n  \u003cdiv class=\"lbl\">Three differences between Paragraph 1 and Paragraph 2:\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n  \u003cdiv class=\"box small\" style=\"margin-top:10px\">\u003cb>The six parts:\u003c/b> 1 Position · 2 Reason · 3 Evidence (a fact from the case) · 4 Framework (named \u003cb>and applied\u003c/b>) · 5 Counterargument (stated fairly, then answered) · 6 Conclusion\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Teacher-made models · Samsung facts: textbook 2.5 and PCWorld (January 2017)\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"7 Peer review checklists\">\n  \u003cdiv class=\"ph\">\u003cb>Peer review checklist\u003c/b>\u003cspan>Class 2 · 1 per student · cut\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid g2\" id=\"pr\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Ethics in a Global World · Week 5\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"8 Exit tickets\">\n  \u003cdiv class=\"ph\">\u003cb>Exit tickets · Class 1\u003c/b>\u003cspan>cut\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid g2\" id=\"exits\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Ethics in a Global World · Week 5\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.getElementById(s);\nconst A=`\u003cdiv class=\"cut ig\">\u003cdiv class=\"small\" style=\"color:#8c7535;font-weight:700;letter-spacing:.08em\">CARD A · DON'T SHOW YOUR PARTNER\u003c/div>\u003cdiv class=\"who\">The Dutch side\u003c/div>May 1626. Peter Minuit, the new director of the Dutch West India Company's colony of New Netherland, made a deal with a group of Lenape people for the island of Manhattan. The Dutch paid goods worth \"sixty guilders\" (about $1,000 today) — possibly tools, kettles, axes, knives, clothing, muskets and gunpowder.\u003cbr>\u003cbr>To the Dutch, this was a \u003cb>purchase\u003c/b>: they now owned the land and could use it as they wished.\u003cdiv class=\"tiny\" style=\"margin-top:6px\">Explain your side. Then ask: what did your partner's side think the deal meant?\u003c/div>\u003c/div>`;\nconst B=`\u003cdiv class=\"cut ig\">\u003cdiv class=\"small\" style=\"color:#8c7535;font-weight:700;letter-spacing:.08em\">CARD B · DON'T SHOW YOUR PARTNER\u003c/div>\u003cdiv class=\"who\">The Lenape side\u003c/div>May 1626. A group of Lenape people made an agreement with Dutch colonists about the island of Manhattan and received goods in exchange. \u003cb>No written deed survives.\u003c/b>\u003cbr>\u003cbr>Some historians think the Lenape believed they were granting \u003cb>use rights\u003c/b> — permission to share and use the land — not selling it forever. The disagreement over property later led to war. The famous story of \"$24 in beads\" is a legend.\u003cdiv class=\"tiny\" style=\"margin-top:6px\">Explain your side. Then ask: what did your partner's side think the deal meant?\u003c/div>\u003c/div>`;\n$('ig').innerHTML=A+B+A.replace('margin-bottom:12px','')+B;\nconst prof=`\u003cdiv class=\"cut prof\">\u003cb style=\"color:#143865;font-size:12pt\">Cultural consultant profile\u003c/b> &nbsp; Name: ______________\u003cdiv class=\"tiny\">Speak from a workplace you know — not for a whole country.\u003c/div>\u003cdiv class=\"row\">\u003cspan>Workplace (country, industry, size)\u003c/span>\u003cdiv class=\"line\">\u003c/div>\u003c/div>${[\"1 · Time and punctuality\",\"2 · Gifts and hospitality\",\"3 · Disagreeing with your boss\",\"4 · Relationships before business\",\"5 · Hiring family and friends\",\"6 · A serious ethical violation there\"].map(n=>`\u003cdiv class=\"row\">\u003cspan>${n}\u003c/span>\u003cdiv class=\"line\">\u003c/div>\u003c/div>`).join('')}\u003cdiv class=\"row\">\u003cspan>Partner notes (difference / similarity)\u003c/span>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\u003cdiv class=\"row\">\u003cspan>\u003c/span>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\u003c/div>`;\n$('prof').innerHTML=prof+prof;\nconst D=[[\"Card 1 · “Everyone expects it here”\",\"Siemens, the German technology company, paid billions in fines and judgments for bribing officials in several countries. Local officials may have expected bribes, but Siemens was bound by national and international law and its own code of ethics. (5.1)\"],[\"Card 2 · Whose standard?\",\"In the 1990s, Nike was criticized for using sweatshop-like factories in China and Southeast Asia. After demanding improvements from its suppliers, it came to be seen as a model of business ethics. Is imposing Western workplace standards “capitalist imperialism” — or a universal standard of humane treatment? Western consumers might have to pay more. (5.1)\"],[\"Card 3 · Lunch during Ramadan\",\"Jillian leads an audit team at a bank in Islamabad, Pakistan, during Ramadan. Her Muslim colleagues fast until sundown. She has never fasted and worries it is unhealthy in the heat; she suggests water or tea — they are silent. Where should she eat lunch: alone in her office, at a restaurant for Westerners, or should she fast with the team? (5.3)\"]];\n$('dl').innerHTML=D.map(d=>`\u003cdiv class=\"cut dl\">\u003ch3>${d[0]}\u003c/h3>${d[1]}\u003cdiv class=\"lbl\" style=\"margin-top:6px\">Etiquette ☐ Ethics ☐ Both ☐ &nbsp;&nbsp; Adapt ☐ Keep my standard ☐ Middle way ☐ &nbsp;&nbsp; Framework: __________\u003c/div>\u003c/div>`).join('');\nconst T=[\"Mercantilism (1500s–1700s): colonial powers took cotton, silk, diamonds, tea and tobacco; business ethics mainly protected owners.\",\"Wealthy women wore fur as a status symbol (about 1915). Today many brands ban fur.\",\"Standard Oil's ruthless practices, exposed by journalist Ida Tarbell (early 1900s).\",\"A court ruled Ford must be run mainly for shareholders (1919). Later courts gave managers more freedom to consider other stakeholders.\",\"Banks manipulated the LIBOR interest rate to profit from trades; several traders were convicted.\",\"Calling HR “human capital” or “human assets” — people as valued resources, not tools.\",\"Companies sign the UN Global Compact's Ten Principles on human rights, labor, environment and anticorruption — voluntarily.\"];\n$('tn').innerHTML=T.map(t=>`\u003cdiv class=\"cut tn\">${t}\u003c/div>`).join('');\nconst DEC=[[\"Decision 1 · Early September 2016\",\"Reports of phones overheating and catching fire.\",\"☐ A · Say there is no technical problem &nbsp; ☐ B · Blame the suppliers &nbsp; ☐ C · Stop sales and recall all phones now\"],[\"Decision 2 · October 2016\",\"Some replacement phones also catch fire. Airlines ban the phone.\",\"☐ A · Fix it again and keep selling &nbsp; ☐ B · Stop production and take the phone off the market permanently\"],[\"Decision 3 · January 2017\",\"The investigation is finished. What should the public statement say?\",\"☐ A · “Our suppliers' batteries were faulty.” &nbsp; ☐ B · “We are responsible; here is how we will prevent it.” &nbsp; ☐ C · Both\"]];\n$('dec').innerHTML=DEC.map(d=>`\u003cdiv class=\"cut dec\">\u003ch3>${d[0]}\u003c/h3>${d[1]}\u003cdiv class=\"lbl\" style=\"margin-top:6px\">${d[2]}\u003c/div>\u003cdiv class=\"lbl\">Our reason:\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>`).join('');\nconst pr=`\u003cdiv class=\"cut pr\">\u003cb style=\"color:#143865\">Peer review\u003c/b> &nbsp; Writer: ___________ &nbsp; Reviewer: ___________\u003col style=\"padding-left:18px\">\u003cli>☐ \u003cb>Position\u003c/b> — a clear answer\u003c/li>\u003cli>☐ \u003cb>Reason\u003c/b>\u003c/li>\u003cli>☐ \u003cb>Evidence\u003c/b> — a specific fact from the case\u003c/li>\u003cli>☐ \u003cb>Framework\u003c/b> — named \u003ci>and applied\u003c/i> (underline it)\u003c/li>\u003cli>☐ \u003cb>Counterargument\u003c/b> — stated fairly and answered\u003c/li>\u003cli>☐ \u003cb>Conclusion\u003c/b>\u003c/li>\u003c/ol>\u003cdiv class=\"lbl\">One suggestion:\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>`;\n$('pr').innerHTML=pr.repeat(4);\n$('exits').innerHTML=`\u003cdiv class=\"cut\" style=\"padding:8px 11px;font-size:10.5pt\">\u003cb style=\"color:#143865\">Exit ticket · Class 1\u003c/b> &nbsp;Name: ________________\u003cdiv class=\"lbl\" style=\"font-size:10pt\">1. Enculturation vs. acculturation, in my own words\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"lbl\" style=\"font-size:10pt\">2. One difference I'd adapt to — and one I'd refuse\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"lbl\" style=\"font-size:10pt\">3. One question I still have\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>`.repeat(6);\nconst pages=[...document.querySelectorAll('.page')];\n$('toggles').innerHTML=pages.map((p,k)=>`\u003clabel>\u003cinput type=\"checkbox\" checked data-p=\"${k}\"> ${p.dataset.name}\u003c/label>`).join('');\ndocument.querySelectorAll('[data-p]').forEach(c=>c.addEventListener('change',()=>pages[c.dataset.p].classList.toggle('off',!c.checked)));\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "quiz": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Quiz 2 · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568;--ok:#2f6b2f}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:#e9ecf1;font-size:16px;line-height:1.45}\n.ctl{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:10px 16px}\n.ctl .in{max-width:8.5in;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}\n.ctl b{font-family:\"Libre Baskerville\",serif;flex:1;min-width:200px}\n.btn{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}\n.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}\n.sheet{max-width:8.5in;margin:16px auto;background:#fff;padding:.5in .6in;box-shadow:0 4px 16px rgba(0,0,0,.12)}\n.hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);padding-bottom:8px;margin-bottom:10px}\n.hd img{width:46px;height:46px;border-radius:6px}\n.hd h1{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:21px;margin:0}\n.hd p{margin:0;color:var(--muted);font-size:13.5px}\n.namebar{display:flex;gap:20px;flex-wrap:wrap;font-size:14.5px;margin:6px 0 12px}\n.namebar span{flex:1;min-width:180px;border-bottom:1px solid #999;padding-bottom:2px}\nh2{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:17px;margin:20px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--sky2)}\n.ins{font-size:14px;color:var(--muted);margin:0 0 8px}\nol.q>li{margin:0 0 10px;break-inside:avoid}\nol.opts{list-style:lower-alpha;margin:3px 0 0;padding-left:24px;columns:2;column-gap:24px}\nol.opts li{margin:1px 0;break-inside:avoid}\n.match{display:grid;grid-template-columns:1fr 1.6fr;gap:4px 20px;font-size:15px}\n.match ol{margin:0;padding-left:22px}\n.match ol li{margin:0 0 6px}\n.match ol.d{list-style:upper-alpha}\n.case{background:var(--sky3);border-left:4px solid var(--gold);padding:10px 14px;border-radius:4px;margin:8px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.lines{border-bottom:1px solid #aab4c3;height:26px}\n.pts{float:right;color:var(--gold-d);font-weight:700;font-size:13.5px}\n.key{display:none;background:#eef6ec;border:1px solid #b9d3b1;border-radius:6px;padding:6px 10px;margin-top:4px;font-size:14px;color:var(--ok)}\nbody.showkey .key{display:block}\nbody.showkey .lines{display:none}\n.keyonly{display:none}\nbody.showkey .keyonly{display:block}\n.kin{display:none;color:var(--ok);font-weight:700;margin-left:6px}\nbody.showkey .kin{display:inline}\ntable{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}\nth,td{border:1px solid var(--sky);padding:5px 7px;text-align:left;vertical-align:top}\nth{background:var(--sky2)}\n.total{text-align:right;font-weight:700;color:var(--navy);margin-top:14px}\n@media (max-width:640px){.sheet{padding:18px 16px}ol.opts{columns:1}.match{grid-template-columns:1fr}}\n@media print{@page{size:letter;margin:.45in}body{background:#fff;font-size:11pt}.ctl{display:none}.sheet{box-shadow:none;margin:0;padding:0;max-width:none}h2{break-after:avoid}.pagebreak{break-before:page}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"ctl\">\u003cdiv class=\"in\">\n  \u003cb>Quiz 2 · Chapters 4–5\u003c/b>\n  \u003cbutton class=\"btn\" id=\"kb\" onclick=\"document.body.classList.toggle('showkey');this.textContent=document.body.classList.contains('showkey')?'Hide teacher key':'Show teacher key'\">Show teacher key\u003c/button>\n  \u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\n  \u003ca class=\"btn ghost\" href=\"index.html\">All files\u003c/a>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"sheet\">\n\u003cdiv class=\"hd\">\u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\u003cdiv>\u003ch1>Quiz 2 · Ethics in a Global World\u003c/h1>\u003cp>Chapters 4–5 · 25 minutes · 30 points · no phones or notes\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"namebar\">\u003cspan>Name:\u003c/span>\u003cspan>Date:\u003c/span>\u003cspan style=\"flex:.4;min-width:110px\">Score: &nbsp;&nbsp;&nbsp;&nbsp; / 30\u003c/span>\u003c/div>\n\n\u003ch2>Part A · Multiple choice \u003cspan class=\"pts\">10 points\u003c/span>\u003c/h2>\n\u003cp class=\"ins\">Circle the best answer.\u003c/p>\n\u003col class=\"q\">\n\u003cli>In \u003ci>Dodge v. Ford\u003c/i> (1919), the court supported the idea that a company should be run mainly for…\n\u003col class=\"opts\">\u003cli>its customers.\u003c/li>\u003cli>its employees.\u003c/li>\u003cli>its shareholders.\u003c/li>\u003cli>the government.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">c\u003c/div>\u003c/li>\n\u003cli>The \u003ci>tragedy of the commons\u003c/i> describes…\n\u003col class=\"opts\">\u003cli>a shared, free resource that gets overused.\u003c/li>\u003cli>a company that
