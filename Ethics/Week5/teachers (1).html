loses money on CSR.\u003c/li>\u003cli>a law that protects nature.\u003c/li>\u003cli>a conflict between two cultures.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">a\u003c/div>\u003c/li>\n\u003cli>Which country was the first to recognize \"Rights for Nature\" in its constitution?\n\u003col class=\"opts\">\u003cli>Norway\u003c/li>\u003cli>Brazil\u003c/li>\u003cli>Ecuador\u003c/li>\u003cli>Japan\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">c\u003c/div>\u003c/li>\n\u003cli>A detergent labeled \"Eco-friendly!\" with no evidence is an example of…\n\u003col class=\"opts\">\u003cli>cap and trade.\u003c/li>\u003cli>greenwashing.\u003c/li>\u003cli>localization.\u003c/li>\u003cli>a carbon tax.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">b\u003c/div>\u003c/li>\n\u003cli>The \"revolving door\" refers to people who…\n\u003col class=\"opts\">\u003cli>change jobs often within one company.\u003c/li>\u003cli>move between an industry and the government agency that regulates it.\u003c/li>\u003cli>work in many countries.\u003c/li>\u003cli>leave a company and return as customers.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">b\u003c/div>\u003c/li>\n\u003cli>\u003ci>Enculturation\u003c/i> means…\n\u003col class=\"opts\">\u003cli>changing your culture after moving abroad.\u003c/li>\u003cli>learning your own society's rules, customs and values.\u003c/li>\u003cli>adapting a product to a local market.\u003c/li>\u003cli>forcing your culture on others.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">b\u003c/div>\u003c/li>\n\u003cli>McDonald's serving sambal chili sauce in Indonesia is an example of…\n\u003col class=\"opts\">\u003cli>localization.\u003c/li>\u003cli>mercantilism.\u003c/li>\u003cli>acculturation only.\u003c/li>\u003cli>greenwashing.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">a\u003c/div>\u003c/li>\n\u003cli>Which is closest to an \u003ci>absolute\u003c/i> value, according to the textbook?\n\u003col class=\"opts\">\u003cli>Wearing formal clothes at work.\u003c/li>\u003cli>Arriving exactly on time.\u003c/li>\u003cli>Not defrauding customers.\u003c/li>\u003cli>Serving tea before a meeting.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">c\u003c/div>\u003c/li>\n\u003cli>The UN Global Compact is…\n\u003col class=\"opts\">\u003cli>a law that fines companies for pollution.\u003c/li>\u003cli>a voluntary set of ten principles for business.\u003c/li>\u003cli>a court ruling on corporate personhood.\u003c/li>\u003cli>a trade agreement between countries.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">b\u003c/div>\u003c/li>\n\u003cli>According to the textbook, what did Samsung do \u003cb>first\u003c/b> when Note 7 phones caught fire?\n\u003col class=\"opts\">\u003cli>Recalled all phones immediately.\u003c/li>\u003cli>Denied technical problems, then blamed its suppliers.\u003c/li>\u003cli>Lowered the price.\u003c/li>\u003cli>Asked the government to investigate.\u003c/li>\u003c/ol>\n\u003cdiv class=\"key\">b\u003c/div>\u003c/li>\n\u003c/ol>\n\n\u003ch2>Part B · Matching \u003cspan class=\"pts\">8 points\u003c/span>\u003c/h2>\n\u003cp class=\"ins\">Write the letter of the correct definition next to each term. Two definitions are not used.\u003c/p>\n\u003cdiv class=\"match\">\n\u003col>\n\u003cli>limited liability ____ \u003cspan class=\"kin\">D\u003c/span>\u003c/li>\n\u003cli>fiduciary duty ____ \u003cspan class=\"kin\">G\u003c/span>\u003c/li>\n\u003cli>sustainability ____ \u003cspan class=\"kin\">A\u003c/span>\u003c/li>\n\u003cli>carbon tax ____ \u003cspan class=\"kin\">J\u003c/span>\u003c/li>\n\u003cli>acculturation ____ \u003cspan class=\"kin\">C\u003c/span>\u003c/li>\n\u003cli>mercantilism ____ \u003cspan class=\"kin\">H\u003c/span>\u003c/li>\n\u003cli>humanistic business model ____ \u003cspan class=\"kin\">E\u003c/span>\u003c/li>\n\u003cli>moral agency ____ \u003cspan class=\"kin\">B\u003c/span>\u003c/li>\n\u003c/ol>\n\u003col class=\"d\">\n\u003cli>a long-term approach to how business affects the environment and people\u003c/li>\n\u003cli>the freedom and ability to choose between right and wrong\u003c/li>\n\u003cli>cultural change that happens when two cultures meet\u003c/li>\n\u003cli>owners can lose only the money they invested\u003c/li>\n\u003cli>a business approach that balances profit with care for employees and stakeholders\u003c/li>\n\u003cli>courts don't second-guess reasonable, honest business decisions\u003c/li>\n\u003cli>a legal duty to act in the best interest of the people whose money you manage\u003c/li>\n\u003cli>the old idea that the world's wealth is fixed, so it must be taken from others\u003c/li>\n\u003cli>a lifestyle focused on buying goods and services\u003c/li>\n\u003cli>a fee companies pay for each unit of carbon they release\u003c/li>\n\u003c/ol>\n\u003c/div>\n\n\u003ch2 class=\"pagebreak\">Part C · Short case and reflection paragraph \u003cspan class=\"pts\">12 points\u003c/span>\u003c/h2>\n\u003cdiv class=\"case\">\u003cb>Nordvik Engineering\u003c/b> \u003ci>(fictional)\u003c/i> is opening an office in a country where it is common to give expensive gifts — watches, travel, cash in envelopes — to government officials before they decide on public contracts. The local manager says: \"Everyone does it here. It's part of our culture. If we don't, we'll lose the contract, and 200 local people won't get jobs.\" Nordvik's home country bans bribery of foreign officials.\u003c/div>\n\u003col class=\"q\">\n\u003cli>\u003cspan class=\"pts\">4 points\u003c/span>Is the gift-giving here a matter of \u003cb>etiquette\u003c/b> or \u003cb>ethics\u003c/b>? Explain, and name \u003cb>two stakeholders\u003c/b> who are affected (one may be society, the environment or government from Chapter 4).\n\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\n\u003cdiv class=\"key\">Ethics (2): expensive gifts and cash before a contract decision are bribery, not politeness — they give an unfair advantage and harm others, whatever the local custom (Siemens example, 5.1; corruption hurts the poor most, 5.4). A small, open gift of hospitality could be etiquette; accept a nuanced answer that draws this line. Stakeholders (1 each, any two): government/public officials (enabling), the public/taxpayers (society), local workers, competitors (normative), Nordvik's shareholders, the home-country government/regulators.\u003c/div>\u003c/li>\n\u003cli>\u003cspan class=\"pts\">8 points\u003c/span>Write an \u003cb>ethical reflection paragraph\u003c/b> (100–150 words): Should Nordvik give the gifts? Include a clear position, a reason, evidence from the case, one framework \u003cb>applied\u003c/b> to the case, a counterargument, and a conclusion.\n\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\u003cdiv class=\"lines\">\u003c/div>\n\u003cdiv class=\"key\">\u003cb>Rubric (8):\u003c/b> Position (1) · Reason (1) · Evidence from the case, e.g., 200 jobs, the home-country ban, \"everyone does it\" (1) · Framework applied, not just defined (2) — e.g., Kant: bribery couldn't be a universal rule and treats officials and the public as means; utilitarian: weigh 200 jobs against the harm of corruption to many citizens and to trust; virtue: honesty and integrity; Rawls: behind the veil you might be a citizen paying for corrupt contracts · Counterargument stated fairly and answered (2), e.g., the jobs argument · Conclusion (1). Language errors don't lose points unless meaning is unclear.\u003cbr>\u003cb>Model:\u003c/b> Nordvik should not give the gifts, even if it loses the contract. Cash and expensive gifts before a contract decision are bribery, not etiquette, and the company's home country bans them. From a Kantian perspective, bribery could not become a universal rule: if every company bribed officials, contracts would go to the richest, not the best, and citizens would pay the price. The manager argues that 200 local people need the jobs, and that is a serious point. However, the same jobs could come from honest competition, and a reputation for bribery could cost far more later, as Siemens learned. Therefore, Nordvik should respect local customs of hospitality but refuse anything that buys a decision.\u003c/div>\u003c/li>\n\u003c/ol>\n\u003cp class=\"total\">Total: ______ / 30\u003c/p>\n\u003cdiv class=\"keyonly\" style=\"margin-top:14px\">\n\u003ctable>\u003ctr>\u003cth>Score band\u003c/th>\u003cth>Suggested meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>27–30\u003c/td>\u003ctd>Excellent command of Chapters 4–5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21–26\u003c/td>\u003ctd>Good; review items missed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15–20\u003c/td>\u003ctd>Developing; review key terms and the paragraph structure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>below 15\u003c/td>\u003ctd>Needs support before the midterm\u003c/td>\u003c/tr>\u003c/table>\n\u003cp style=\"font-size:13px;color:#4a5568\">Sources: Byars &amp; Stanberry, \u003ci>Business Ethics\u003c/i>, OpenStax (CC BY-NC-SA 4.0), Chapters 2.5, 4 and 5. Nordvik Engineering is fictional.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "notes": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Week 5 Study Notes · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568;--bg:#fbfaf6}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5}\nheader{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}\nheader .in{max-width:860px;margin:0 auto;padding:18px 16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}\nheader img{width:54px;height:54px;border-radius:8px}\n.w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.12em;font-size:15px;line-height:1.1}\n.w small{display:block;letter-spacing:.02em;font-size:10px;color:#e6d8a8}\nheader h1{font-family:\"Libre Baskerville\",serif;margin:0;font-size:clamp(20px,4vw,26px)}\nheader p{margin:2px 0 0;color:var(--sky);font-size:14px}\n.grow{flex:1;min-width:200px}\n.btn{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}\nmain{max-width:860px;margin:0 auto;padding:6px 16px 50px}\nh2{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:22px;margin:28px 0 8px;padding-bottom:5px;border-bottom:3px solid var(--gold)}\nh3{color:var(--blue);margin:18px 0 4px;font-size:18px}\n.one{background:var(--cream);border-left:5px solid var(--gold-d);padding:9px 14px;border-radius:6px;margin:10px 0;font-size:17.5px}\n.say{background:var(--sky3);border-left:5px solid var(--blue);padding:9px 14px;border-radius:6px;margin:10px 0;font-style:italic}\ntable{width:100%;border-collapse:collapse;background:#fff;font-size:15.5px;margin:8px 0}\nth,td{border:1px solid var(--sky);padding:6px 8px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.tw{overflow-x:auto}\nul{margin:4px 0;padding-left:22px}li{margin:2px 0}\n.trap{font-size:15px;color:#7a3a2a}\nfooter{font-size:12.5px;color:#6b7280;margin-top:30px}\n@media print{body{background:#fff;font-size:11pt}.noprint{display:none}h2{break-before:page}h2.first{break-before:auto}table,.one,.say{break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"in\">\n  \u003cimg src=\"__LOGO__\" alt=\"Approach International Student Center\" onload=\"this.nextElementSibling.remove()\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\n  \u003cdiv class=\"grow\">\u003ch1>Week 5 Study Notes\u003c/h1>\u003cp>Key ideas in plain words · Chapter 5 (pp. 131–158) and the Samsung case (2.5)\u003c/p>\u003c/div>\n  \u003cdiv class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button> \u003ca class=\"btn\" style=\"background:transparent;color:#fff;border:1px solid #c1cddd\" href=\"index.html\">All files\u003c/a>\u003c/div>\n\u003c/div>\u003c/header>\n\u003cmain>\n\n\u003ch2 class=\"first\">Part 1 · Does ethics have a passport? (Class 1)\u003c/h2>\n\u003cdiv class=\"one\">\u003cb>In one line:\u003c/b> Cultures differ in manners and customs (etiquette), but some ethical standards — like not cheating or bribing — hold across borders.\u003c/div>\n\n\u003ch3>How we learn a culture (5.1, pp. 132–138)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Term\u003c/th>\u003cth>Plain meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Enculturation\u003c/td>\u003ctd>Learning your \u003cb>own\u003c/b> society's rules, customs and values as you grow up\u003c/td>\u003ctd>A child learns how to greet elders\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Acculturation\u003c/td>\u003ctd>Cultural change when \u003cb>two cultures meet\u003c/b>\u003c/td>\u003ctd>The Dutch and the Lenape, 1626\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Localization\u003c/td>\u003ctd>Adapting a product or practice to a local market (5.3)\u003c/td>\u003ctd>McDonald's sambal sauce in Indonesia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Consumerism\u003c/td>\u003ctd>A lifestyle focused on buying goods and services\u003c/td>\u003ctd>Global brands spreading one way of life\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Manhattan, 1626:\u003c/b> the Dutch saw a \u003cb>purchase\u003c/b>; the Lenape may have seen \u003cb>shared use rights\u003c/b>. No written deed survives, and the \"$24 in beads\" story is a legend. Lesson: a deal can mean different things to each side.\u003c/p>\n\n\u003ch3>Etiquette or ethics?\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Etiquette\u003c/b> = manners: punctuality, dress, gifts of hospitality, how to greet. Adapting is usually respectful.\u003c/li>\n\u003cli>\u003cb>Ethics\u003c/b> = right and wrong that affects others: bribery, fraud, unsafe work. \"Everyone does it here\" is not a justification.\u003c/li>\n\u003cli>\u003cb>Siemens\u003c/b> paid billions for bribing officials in several countries — local expectations did not override the law or its code of ethics.\u003c/li>\n\u003cli>\u003cb>Nike\u003c/b> (1990s): criticized for sweatshop-like factories; later improved standards. Question: universal humane treatment, or \"capitalist imperialism\"?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"say\">\"Adapt your manners, keep your morals — but first be sure which one you're looking at.\"\u003c/div>\n\n\u003ch3>Geography and religion (5.3, pp. 144–148)\u003c/h3>\n\u003cul>\n\u003cli>Cultures differ in \u003cb>time\u003c/b> (strict schedules vs. flexible), \u003cb>personal space\u003c/b>, dress and relationship-building (GLOBE research).\u003c/li>\n\u003cli>Many religions share ideas such as \u003cb>stewardship\u003c/b> (caring for what we're given) and human dignity; the Universal Declaration of Human Rights expresses shared values.\u003c/li>\n\u003cli>\u003cb>Ramadan case:\u003c/b> Jillian in Islamabad — respect without pretending; a \"middle way\" can be best.\u003c/li>\n\u003c/ul>\n\u003cp class=\"trap\">Remember: speak from a workplace you know, not for a whole country.\u003c/p>\n\n\u003ch2>Part 2 · Does ethics have an expiry date? (Class 2)\u003c/h2>\n\u003cdiv class=\"one\">\u003cb>In one line:\u003c/b> Standards change over time, but that doesn't make ethics simply relative — some values are close to absolute.\u003c/div>\n\n\u003ch3>Ethics over time (5.2, pp. 139–143)\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Mercantilism\u003c/b> (1500s–1700s): the idea that wealth is fixed, so colonial powers took it from others.\u003c/li>\n\u003cli>\u003cb>When even doctors smoked:\u003c/b> 1929 \"torches of freedom\" ads; 1964 Surgeon General's report linked smoking to lung cancer.\u003c/li>\n\u003cli>Fur, \u003ci>Dodge v. Ford\u003c/i> (1919), Ida Tarbell and Standard Oil, \"human capital,\" the \u003cb>UN Global Compact\u003c/b> (ten voluntary principles).\u003c/li>\n\u003c/ul>\n\n\u003ch3>Absolute, relative, universal (5.4, pp. 149–158)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Type\u003c/th>\u003cth>Plain meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Absolute value\u003c/td>\u003ctd>Holds everywhere; exceptions need a very strong reason\u003c/td>\u003ctd>Don't defraud customers; don't lie\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Relative value\u003c/td>\u003ctd>Depends on time, place or culture\u003c/td>\u003ctd>Dress codes; fur as status\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Universal value\u003c/td>\u003ctd>Shared by most cultures\u003c/td>\u003ctd>Honesty, fairness, human dignity\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Then &amp; now sort key:\u003c/b> A (wrong then and now) — mercantilism, Standard Oil, LIBOR · B (standard changed) — fur, \u003ci>Dodge v. Ford\u003c/i>, \"human capital,\" UN Global Compact.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Compliance:\u003c/b> the U.S. Federal Sentencing Guidelines reward companies with real ethics programs. Cases: FIFA, VW emissions, LIBOR, the Samsung heir.\u003c/li>\n\u003cli>\u003cb>Humanistic business model:\u003c/b> balances profit with care for employees and stakeholders. \u003cb>Moral agency:\u003c/b> the freedom and ability to choose right from wrong.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Samsung Galaxy Note 7 (2.5, pp. 50–53)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>When\u003c/th>\u003cth>What happened\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Aug–Sept 2016\u003c/td>\u003ctd>Phones overheat and catch fire. The textbook says Samsung first denied a technical problem, then blamed suppliers.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sept–Oct 2016\u003c/td>\u003ctd>First recall; replacement phones also catch fire; airlines ban the phone; production stopped permanently.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Jan 2017\u003c/td>\u003ctd>Investigation: two different battery faults. Samsung took responsibility and announced new safety checks.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Numbers:\u003c/b> the textbook says \"more than 2 million\" phones; later reporting says about 3 million sold and about 96% returned. \u003cb>Textbook view:\u003c/b> the final response was \"arguably\" Kantian — customer safety first.\u003c/p>\n\n\u003ch3>The ethical reflection paragraph (Quiz 2 Part C and the midterm)\u003c/h3>\n\u003col>\n\u003cli>\u003cb>Position\u003c/b> — a clear answer\u003c/li>\n\u003cli>\u003cb>Reason\u003c/b>\u003c/li>\n\u003cli>\u003cb>Evidence\u003c/b> — a specific fact from the case\u003c/li>\n\u003cli>\u003cb>Framework\u003c/b> — named \u003ci>and applied\u003c/i>\u003c/li>\n\u003cli>\u003cb>Counterargument\u003c/b> — stated fairly, then answered\u003c/li>\n\u003cli>\u003cb>Conclusion\u003c/b>\u003c/li>\n\u003c/ol>\n\u003cp class=\"trap\">Most common weakness: defining a framework (\"Kant is about duty\") instead of applying it to the case.\u003c/p>\n\n\u003ch3>Useful language\u003c/h3>\n\u003cul>\n\u003cli>\"In my culture this would be seen as ___, but I'd distinguish between manners and ethics.\"\u003c/li>\n\u003cli>\"That was accepted then; the question is whether it was ever right.\"\u003c/li>\n\u003cli>\"Some would argue that ___. That is fair, but ___.\"\u003c/li>\n\u003cli>Past habits: \"Doctors \u003ci>used to\u003c/i> smoke in their offices.\" · \"People \u003ci>would\u003c/i> wear fur as a status symbol.\"\u003c/li>\n\u003c/ul>\n\n\u003cfooter>Textbook content from Byars &amp; Stanberry, \u003cem>Business Ethics\u003c/em>, OpenStax (CC BY-NC-SA 4.0), Chapters 2.5 and 5. Samsung investigation details: PCWorld (January 2017). Activities are teacher-made.\u003c/footer>\n\u003c/main>\n\u003c/body>\n\u003c/html>\n", "worksheet": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Week 5 Worksheet · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568;--bg:#f6f4ee;--ok:#2f6b2f;--no:#a33a2a}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55}\nheader.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}\n.top .in{max-width:860px;margin:0 auto;padding:20px 16px 24px;display:flex;gap:14px;align-items:center}\n.top img{width:60px;height:60px;border-radius:8px;flex:none}\n.top .w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.12em;font-size:16px;line-height:1.1;flex:none}\n.top .w small{display:block;letter-spacing:.02em;font-size:10px;color:#e6d8a8}\n.top h1{font-family:\"Libre Baskerville\",serif;margin:0;font-size:clamp(20px,4.5vw,28px);line-height:1.2}\n.top p{margin:3px 0 0;color:var(--sky);font-size:14.5px}\n.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--sky);box-shadow:0 2px 8px rgba(20,56,101,.06)}\n.bar .in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.bar input{flex:1;min-width:160px}\n.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 13px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}\n.btn.gold{background:var(--gold);color:var(--navy)}\n.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--sky)}\n.btn.sm{padding:6px 11px;font-size:14px}\n#saved{font-size:13px;color:var(--muted);min-width:70px}\nmain{max-width:860px;margin:0 auto;padding:10px 16px 60px}\n.part{font-family:\"Libre Baskerville\",serif;color:var(--gold-d);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:34px 0 0;border-top:2px solid var(--gold);padding-top:12px}\nsection.card{background:#fff;border:1px solid var(--sky);border-radius:12px;padding:16px 18px 18px;margin:16px 0}\nsection.card h2{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:21px;margin:0 0 4px}\n.sub{color:var(--muted);font-size:14.5px;margin:0 0 10px}\nlabel{display:block;font-weight:600;margin:12px 0 4px;color:var(--navy)}\ninput[type=text],textarea,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--sky);border-radius:7px;padding:8px 10px;background:#fbfcfe;color:var(--ink)}\ntextarea{min-height:64px;resize:vertical}\ntextarea.big{min-height:180px}\ninput:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}\n.opts label{display:flex;gap:6px;align-items:center;font-weight:400;margin:0;color:var(--ink)}\ndetails{border:1px solid var(--sky);border-radius:9px;margin:10px 0;background:var(--sky3)}\ndetails>summary{cursor:pointer;padding:9px 12px;font-weight:700;color:var(--navy);list-style:none}\ndetails>summary::before{content:\"▸ \";color:var(--gold-d)}\ndetails[open]>summary::before{content:\"▾ \"}\ndetails>div{padding:2px 14px 12px;background:#fff;border-radius:0 0 9px 9px}\n.box{background:var(--cream);border-left:4px solid var(--gold-d);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:16px}\n.tip{background:var(--sky3);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:15px}\ntable{width:100%;border-collapse:collapse;font-size:15.5px;margin:8px 0}\nth,td{border:1px solid var(--sky);padding:6px 8px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.gm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}\n.gm .v{font-weight:700;color:var(--navy);text-align:center;background:var(--cream);border-radius:6px;padding:6px 10px;min-width:110px}\n.fb{font-size:14.5px;margin-top:6px;font-weight:600}\n.ok{color:var(--ok)}.no{color:var(--no)}\nselect.ok{border-color:var(--ok);background:#eef6ec}select.no{border-color:var(--no);background:#fbefec}\n.hidden{display:none}\n.key{background:#eef6ec;border:1px solid #b9d3b1;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:15px}\n.grid3{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:6px;align-items:start}\n.grid3 .h{font-weight:700;color:var(--navy);font-size:14.5px;background:var(--sky2);border-radius:5px;padding:5px 7px}\n.grid3 textarea{min-height:58px;font-size:15px}\n.grid2{display:grid;grid-template-columns:140px 1fr 1fr;gap:6px;align-items:start}\n.grid2 .h{font-weight:700;color:var(--navy);font-size:14.5px;background:var(--sky2);border-radius:5px;padding:5px 7px}\n.grid2 textarea{min-height:58px;font-size:15px}\n.tl{display:grid;grid-template-columns:150px 90px 1fr;gap:6px;align-items:center;margin:6px 0}\n.tl b{color:var(--navy)}\n.wc{font-size:14px;color:var(--muted);margin-top:4px}\n.slider{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;margin:6px 0}\n.slider input{width:100%}\nul.lb li{margin:3px 0}\nfooter{max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:#6b7280}\n@media (max-width:640px){\n  .row2{grid-template-columns:1fr}\n  .gm{grid-template-columns:1fr}.gm .v{order:-1}\n  .grid3,.grid2{grid-template-columns:1fr}\n  .grid3 .h.c,.grid2 .h.c,.hdr{display:none}\n  .grid3 textarea::placeholder,.grid2 textarea::placeholder{color:#7a8597}\n  .tl{grid-template-columns:1fr 80px}.tl select.idea{grid-column:1/-1}\n  .slider{grid-template-columns:90px 1fr 30px}\n}\n@media print{\n  body{background:#fff;font-size:11.5pt}\n  .bar,.noprint,button{display:none!important}\n  section.card{break-inside:avoid;border-color:#bbb}\n  details>div{display:block!important}\n  details{background:#fff}\n  textarea{border:1px solid #bbb;overflow:hidden}\n  header.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n}\n\n.pick{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:center;margin:6px 0;padding:4px 0;border-bottom:1px dashed var(--sky2)}\n.thermo{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--navy);background:linear-gradient(90deg,#cfe0f3,#fbf1dc,#f6c9a4);border-radius:6px;padding:6px 10px;margin:6px 0}\n.case{border:1px solid var(--sky);border-radius:9px;padding:10px 12px;margin:10px 0;background:#fff}\n.case h3{margin:0 0 4px;font-size:16.5px;color:var(--navy)}\n.case p{margin:0 0 6px;font-size:15.5px}\n.case .row2 select{font-size:15px}\n.map{width:100%;border-collapse:collapse;font-size:14.5px}\n.map td,.map th{padding:4px}\n.map input[type=text]{font-size:15px;padding:6px}\n.map select{font-size:14.5px;padding:6px 4px}\n.mx{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13.5px;text-align:center;margin:8px 0}\n.mx div{background:var(--sky3);border-radius:6px;padding:8px}\n.mx .k{background:var(--navy);color:#fff}\ndetails.book{border-color:var(--gold-d);background:var(--cream)}\ndetails.book>summary::before{content:\"\\25B8  Book · \"}\ndetails.book[open]>summary::before{content:\"\\25BE  Book · \"}\n.pg{display:inline-block;background:var(--navy);color:#fff;border-radius:4px;padding:0 6px;font-size:13px;font-weight:700;margin-left:4px}\n@media (max-width:640px){.pick{grid-template-columns:1fr}.map thead{display:none}.map tr{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-bottom:2px solid var(--sky);padding:6px 0}.map td{border:0}.map td:first-child{grid-column:1/-1}}\n\n.flags li{margin:4px 0}\n.score{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:center;font-size:15px}\n.score input{text-align:center}\n.score b{color:var(--navy)}\n.slider{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:6px 0}\n@media (max-width:640px){.score{grid-template-columns:repeat(3,1fr)}.slider{grid-template-columns:1fr 1fr 30px}}\n\n.chk label{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);margin:4px 0}\n.ptable{width:100%;border-collapse:collapse;font-size:14.5px}\n.ptable td,.ptable th{padding:4px;border:1px solid var(--sky)}\n.ptable textarea{min-height:44px;font-size:14.5px}\n@media (max-width:640px){.ptable thead{display:none}.ptable tr{display:grid;grid-template-columns:1fr;border-bottom:2px solid var(--sky)}.ptable td{border:0}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"in\">\n  \u003cimg src=\"__LOGO__\" alt=\"Approach International Student Center\" onload=\"this.nextElementSibling.remove()\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\n  \u003cdiv>\u003ch1>Week 5 Worksheet · Culture and Time\u003c/h1>\u003cp>Ethics in a Global World · Chapter 5 · Class 1 and Class 2\u003c/p>\u003c/div>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"in\">\n  \u003cinput type=\"text\" id=\"sname\" data-k=\"name\" placeholder=\"Your name\" aria-label=\"Your name\">\n  \u003cspan id=\"saved\">Saved\u003c/span>\n  \u003cbutton class=\"btn gold\" onclick=\"downloadAnswers()\">Download\u003c/button>\n  \u003cbutton class=\"btn\" onclick=\"window.print()\">Print / PDF\u003c/button>\n  \u003cbutton class=\"btn ghost sm\" onclick=\"clearAll()\">Clear\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cmain>\n\u003cp class=\"tip\">Your answers save automatically \u003cb>on this device\u003c/b>. Before you leave class, tap \u003cb>Download\u003c/b> to keep a copy.\u003c/p>\n\n\u003csection class=\"card\">\n\u003ch2>This week's reading · Chapter 5\u003c/h2>\n\u003cp class=\"sub\">\u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 5: The Impact of Culture and Time on Business Ethics. Page numbers are the printed page numbers in the OpenStax PDF. Tap a section to read it online.\u003c/p>\n\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>We use it in\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 5 introduction\u003c/a>\u003c/td>\u003ctd>p. 131\u003c/td>\u003ctd>§1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\" target=\"_blank\" rel=\"noopener\">5.1 The Relationship between Business Ethics and Culture\u003c/a>\u003c/td>\u003ctd>pp. 132–138\u003c/td>\u003ctd>§2, §4 · Journal B\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-2-business-ethics-over-time\" target=\"_blank\" rel=\"noopener\">5.2 Business Ethics over Time\u003c/a>\u003c/td>\u003ctd>pp. 139–143\u003c/td>\u003ctd>§6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\" target=\"_blank\" rel=\"noopener\">5.3 The Influence of Geography and Religion\u003c/a>\u003c/td>\u003ctd>pp. 144–148\u003c/td>\u003ctd>§1, §3, §4 · Journal A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\" target=\"_blank\" rel=\"noopener\">5.4 Are the Values Central to Business Ethics Universal?\u003c/a>\u003c/td>\u003ctd>pp. 149–158\u003c/td>\u003ctd>§6, §8 · Journal C\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/2-5-deontology-ethics-as-duty\" target=\"_blank\" rel=\"noopener\">2.5 Deontology\u003c/a> — the Samsung box\u003c/td>\u003ctd>pp. 50–53\u003c/td>\u003ctd>§7\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp class=\"tip\" style=\"margin-bottom:0\">\u003cb>Quiz 2 is at the end of Class 2.\u003c/b> It covers Chapter 4 (pp. 93–130) and Chapter 5 (pp. 131–158).\u003c/p>\n\u003c/section>\n\n\u003cdiv class=\"part\">Class 1 · Does Ethics Have a Passport?\u003c/div>\n\n\u003c!-- 1 -->\n\u003csection class=\"card\">\n\u003ch2>1 · Rude or wrong?\u003c/h2>\n\u003cp class=\"sub\">For each situation, choose: fine · a bit rude · very rude · unethical. Then decide: is it a question of \u003cb>etiquette\u003c/b> (manners) or \u003cb>ethics\u003c/b> (right and wrong)?\u003c/p>\n\u003cdetails class=\"book\">\u003csummary>Chapter 5 intro and 5.3 \u003cspan class=\"pg\">p. 131 · pp. 144–148\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Read:\u003c/b> the \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 5 introduction\u003c/a> and \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\" target=\"_blank\" rel=\"noopener\">5.3\u003c/a> \"Business as Global Relationships\" — time and punctuality (the Tuareg's three cups of tea; \u003ci>subito\u003c/i> and \u003ci>sofort\u003c/i>), personal space, handshakes. The six situations are teacher-made.\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>etiquette\u003c/i> — manners; what is polite · \u003ci>norm\u003c/i> — what most people in a group consider normal · \u003ci>punctuality\u003c/i> — being on time\u003c/p>\n\u003c/div>\u003c/details>\n\u003cdiv id=\"rude\">\u003c/div>\n\u003clabel>Which situation did you and your partner disagree about most? Where did you each learn your view?\u003c/label>\n\u003ctextarea data-k=\"s1_dis\">\u003c/textarea>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection class=\"card\">\n\u003ch2>2 · Two sides of a deal: Manhattan, 1626\u003c/h2>\n\u003cdetails class=\"book\">\u003csummary>5.1 \u003cspan class=\"pg\">pp. 132–138\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Read:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\" target=\"_blank\" rel=\"noopener\">5.1\u003c/a> \"Business Encounters Culture\" and Figure 5.2.\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>enculturation\u003c/i> — learning your own society's rules, customs and values · \u003ci>acculturation\u003c/i> — cultural change when two cultures meet · \u003ci>deed\u003c/i> — a legal document proving ownership · \u003ci>use rights\u003c/i> — permission to use land, not ownership\u003c/p>\n\u003cp>\u003cb>Look for:\u003c/b> Why does the textbook say business is \"not culturally neutral\"? What two conditions link business and culture?\u003c/p>\n\u003c/div>\u003c/details>\n\u003clabel>My card\u003c/label>\n\u003cdiv class=\"opts\">\n  \u003clabel>\u003cinput type=\"radio\" name=\"s2_card\" data-k=\"s2_card\" value=\"A (the Dutch side)\"> A — the Dutch side\u003c/label>\n  \u003clabel>\u003cinput type=\"radio\" name=\"s2_card\" data-k=\"s2_card\" value=\"B (the Lenape side)\"> B — the Lenape side\u003c/label>\n\u003c/div>\n\u003cdiv class=\"row2\">\n\u003cdiv>\u003clabel>What my side probably thought the deal meant\u003c/label>\u003ctextarea data-k=\"s2_mine\">\u003c/textarea>\u003c/div>\n\u003cdiv>\u003clabel>What the other side probably thought\u003c/label>\u003ctextarea data-k=\"s2_other\">\u003c/textarea>\u003c/div>\n\u003c/div>\n\u003clabel>What assumption caused the problem?\u003c/label>\n\u003ctextarea data-k=\"s2_assume\">\u003c/textarea>\n\u003cp class=\"sub\" style=\"margin-top:10px\">\u003cb>Match the terms.\u003c/b>\u003c/p>\n\u003cdiv id=\"termRows\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"checkTerms()\">Check\u003c/button>\n\u003cdiv id=\"termFb\" class=\"fb\">\u003c/div>\n\u003clabel>Where in modern business do two sides sign the same contract but understand it differently?\u003c/label>\n\u003ctextarea data-k=\"s2_modern\">\u003c/textarea>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection class=\"card\">\n\u003ch2>3 · Cultural consultants\u003c/h2>\n\u003cdiv class=\"box\">\u003cb>Ground rule:\u003c/b> Speak from \u003cb>a workplace you know\u003c/b> — \"In the hospital where I worked in ___…\" — not \"In my country, everyone…\". One workplace is not a whole nation.\u003c/div>\n\u003cdetails class=\"book\">\u003csummary>5.3 and 5.4 \u003cspan class=\"pg\">pp. 144–158\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Read:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\" target=\"_blank\" rel=\"noopener\">5.3\u003c/a> \"Business as Global Relationships\" (localization; the GLOBE project: leaders must \"understand and exceed\" local expectations) and \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\" target=\"_blank\" rel=\"noopener\">5.4\u003c/a> \"Absolute Values versus Relative Values.\"\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>localization\u003c/i> — adapting a product or practice to a local culture · \u003ci>hierarchy\u003c/i> — levels of power and rank · \u003ci>nepotism\u003c/i> — giving jobs to family members\u003c/p>\n\u003c/div>\u003c/details>\n\u003clabel>The workplace I'm describing (country, industry, size)\u003c/label>\n\u003cinput type=\"text\" data-k=\"s3_where\" placeholder=\"e.g., a private hospital in ___, about 300 staff\">\n\u003cdiv id=\"profile\">\u003c/div>\n\u003cp class=\"sub\" style=\"margin-top:12px\">\u003cb>Speed consulting:\u003c/b> notes from three partners — one surprising difference and one similarity each.\u003c/p>\n\u003ctable class=\"ptable\">\u003cthead>\u003ctr>\u003cth>Partner (workplace)\u003c/th>\u003cth>A surprising difference\u003c/th>\u003cth>A similarity\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"partners\">\u003c/tbody>\u003c/table>\n\u003clabel>Our group sort — differences we would \u003cb>adapt to\u003c/b> (etiquette)\u003c/label>\n\u003ctextarea data-k=\"s3_adapt\">\u003c/textarea>\n\u003clabel>Differences where we would \u003cb>not compromise\u003c/b> (ethics)\u003c/label>\n\u003ctextarea data-k=\"s3_ethics\">\u003c/textarea>\n\u003clabel>One value that seemed universal across all our workplaces\u003c/label>\n\u003cinput type=\"text\" data-k=\"s3_univ\">\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection class=\"card\">\n\u003ch2>4 · Dilemma cards: adapt or refuse?\u003c/h2>\n\u003cp class=\"sub\">Choose two cards with your group. For each: etiquette or ethics? Adapt or keep your standard? Which framework supports your answer?\u003c/p>\n\u003cdetails class=\"book\">\u003csummary>5.1 and 5.3 \u003cspan class=\"pg\">pp. 132–138 · 144–148\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Card 1:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\" target=\"_blank\" rel=\"noopener\">5.1\u003c/a> \"Balancing Beliefs\" (Siemens). \u003cb>Card 2:\u003c/b> 5.1, \u003ci>Cases from the Real World: Overseas Manufacturing\u003c/i> (Nike). \u003cb>Card 3:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\" target=\"_blank\" rel=\"noopener\">5.3\u003c/a>, \u003ci>What Would You Do?: Ramadan\u003c/i>.\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>bribe\u003c/i> — money or gifts given to influence a decision · \u003ci>sweatshop\u003c/i> — a factory with very low pay and bad conditions · \u003ci>imperialism\u003c/i> — one country forcing its power or values on others · \u003ci>fast\u003c/i> — to not eat or drink for a period of time\u003c/p>\n\u003c/div>\u003c/details>\n\u003cdiv id=\"dilemmas\">\u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection class=\"card\">\n\u003ch2>5 · Exit ticket\u003c/h2>\n\u003clabel>1. Enculturation vs. acculturation, in my own words\u003c/label>\n\u003ctextarea data-k=\"s5_1\">\u003c/textarea>\n\u003clabel>2. One difference I'd adapt to — and one I'd refuse\u003c/label>\n\u003ctextarea data-k=\"s5_2\">\u003c/textarea>\n\u003clabel>3. One question I still have\u003c/label>\n\u003cinput type=\"text\" data-k=\"s5_3\">\n\u003c/section>\n\n\u003cdiv class=\"part\">Class 2 · Does Ethics Have an Expiry Date?\u003c/div>\n\n\u003c!-- 6 -->\n\u003csection class=\"card\">\n\u003ch2>6 · When even doctors smoked · Then &amp; now\u003c/h2>\n\u003cdiv class=\"box\">From the 1940s to the 1970s, smoking was almost everywhere — even doctors and pregnant women smoked. In \u003cb>1929\u003c/b>, Edward Bernays marketed Lucky Strike cigarettes to women as \"torches of freedom.\" On \u003cb>January 11, 1964\u003c/b>, the U.S. Surgeon General's report linked smoking to lung cancer. Today, smoking has declined in Western countries but is still promoted in other parts of the world, especially to young people. \u003ci>(5.2)\u003c/i>\u003c/div>\n\u003cdetails class=\"book\">\u003csummary>5.2 and 5.4 \u003cspan class=\"pg\">pp. 139–143 · 149–158\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Read:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-2-business-ethics-over-time\" target=\"_blank\" rel=\"noopener\">5.2\u003c/a> \"Shifts in Cultural and Ethical Standards,\" the box \u003ci>Ethics Across Time and Cultures: When Even Doctors Smoked\u003c/i>, and \"A Matter of Time\"; \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\" target=\"_blank\" rel=\"noopener\">5.4\u003c/a> \"Absolute Values versus Relative Values.\"\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>absolute value\u003c/i> — a value that holds everywhere (don't lie, don't defraud) · \u003ci>relative value\u003c/i> — a value that depends on time, place or culture · \u003ci>universal values\u003c/i> — values all people can accept · \u003ci>mercantilism\u003c/i> — the old idea that wealth is fixed, so you must take it from others · \u003ci>muckraker\u003c/i> — a journalist who exposes corruption\u003c/p>\n\u003c/div>\u003c/details>\n\u003clabel>Was the 1929 campaign wrong then — or only wrong now? Did the facts change, or the ethics?\u003c/label>\n\u003ctextarea data-k=\"s6_smoke\">\u003c/textarea>\n\u003cp class=\"sub\" style=\"margin-top:12px\">\u003cb>Sort:\u003c/b> A = wrong then and now (we just enforce it better) · B = the standard itself has changed\u003c/p>\n\u003cdiv id=\"sortRows\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"checkSort()\">Compare with suggested answers\u003c/button>\n\u003cdiv id=\"sortFb\" class=\"fb\">\u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection class=\"card\">\n\u003ch2>7 · Samsung Galaxy Note 7 crisis room\u003c/h2>\n\u003cdiv class=\"box\">Fall 2016. Samsung's new Galaxy Note 7 phones are catching fire. You are Samsung's crisis team. \u003ci>(The textbook suggests the company may have rushed to launch before Apple's iPhone 7.)\u003c/i>\u003c/div>\n\u003cdetails class=\"book\">\u003csummary>2.5 \u003cspan class=\"pg\">pp. 50–53\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Read:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/2-5-deontology-ethics-as-duty\" target=\"_blank\" rel=\"noopener\">2.5\u003c/a>, the box \u003ci>Cases from the Real World: Samsung\u003c/i>. Some facts below (dates, numbers, the investigation in January 2017) come from an \u003cb>outside source\u003c/b> (PCWorld, January 2017), not the textbook.\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>recall\u003c/i> — when a company asks customers to return a product · \u003ci>supplier\u003c/i> — a company that makes parts for another company · \u003ci>defect\u003c/i> — a fault · \u003ci>accountable\u003c/i> — responsible and expected to explain your actions\u003c/p>\n\u003c/div>\u003c/details>\n\u003cdiv id=\"decisions\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"toggle('samKey')\">What happened? (open when your teacher says)\u003c/button>\n\u003cdiv id=\"samKey\" class=\"key hidden\">\n\u003cp>\u003cb>Decision 1 · Textbook:\u003c/b> Samsung first denied technical problems, then blamed its suppliers. A global recall was announced in early September 2016; the U.S. safety regulator recalled about 1 million phones on September 15.\u003cbr>\n\u003cb>Decision 2 ·\u003c/b> Replacement phones also caught fire. Samsung ended production, and the recall was expanded (October 13). Samsung later said 96% of about 3 million phones sold and activated were returned. The textbook says Samsung recalled more than 2 million phones and replaced them.\u003cbr>\n\u003cb>Decision 3 ·\u003c/b> In January 2017, after testing over 200,000 phones and 30,000 batteries, Samsung said batteries from \u003cb>two different manufacturers\u003c/b> had different defects. It introduced an \u003cb>8-point battery safety check\u003c/b> and an outside expert advisory group. Reporting noted that Samsung attributed the problems to its suppliers.\u003cbr>\n\u003cb>The textbook's view:\u003c/b> the final response focused on customer safety — \"arguably a Kantian motive\" — and limited the damage, even boosting the share price. Others argue Samsung could have acted faster and further.\u003c/p>\n\u003cp class=\"tiny\">Outside source: PCWorld, \"Samsung blames batteries from two makers for Note7 explosions\" (January 2017).\u003c/p>\n\u003c/div>\n\u003clabel>Minimum or maximum? Was Samsung's final response closer to the ethical minimum or maximum?\u003c/label>\n\u003ctextarea data-k=\"s7_mm\">\u003c/textarea>\n\u003clabel>Kantian or utilitarian view: was the response ethical? (Apply the framework to Samsung.)\u003c/label>\n\u003ctextarea data-k=\"s7_fw\">\u003c/textarea>\n\u003clabel>Samsung designed and sold the phone. Is it fair to blame the suppliers?\u003c/label>\n\u003ctextarea data-k=\"s7_blame\">\u003c/textarea>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection class=\"card\">\n\u003ch2>8 · Writing workshop: the ethical reflection paragraph\u003c/h2>\n\u003cdiv class=\"box\">\u003cb>Six parts:\u003c/b> 1 Position · 2 Reason · 3 Evidence (a fact from the case) · 4 Framework (named \u003cb>and applied\u003c/b>) · 5 Counterargument (stated fairly, then answered) · 6 Conclusion\u003c/div>\n\u003cdetails>\u003csummary>Weak vs. strong model\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Question:\u003c/b> Was Samsung's response to the Note 7 crisis ethical?\u003c/p>\n\u003cp>\u003cb>Weak:\u003c/b> Samsung's response was ethical and not ethical. Utilitarianism is the greatest happiness for the greatest number. Kant is about duty. Companies should be responsible. In my opinion they should always think about customers because customers are important. So it is good and bad.\u003c/p>\n\u003cp>\u003cb>Strong:\u003c/b> Samsung's final response was largely ethical, but it came too late. The company first denied any technical problem and blamed its suppliers, while phones were still catching fire. Only later did it stop production and take back about 96% of roughly 3 million phones. From a Kantian perspective, the recall respected customers as ends in themselves, not merely as sources of profit; however, the early denial treated their safety as less important than the launch schedule. Some would argue that Samsung acted reasonably, since it needed time to find the cause. That is fair, but when people's safety is at risk, a company should act first and investigate later. Overall, Samsung reached the ethical maximum only after trying the minimum.\u003c/p>\n\u003c/div>\u003c/details>\n\u003clabel>Three differences between the weak and strong paragraphs\u003c/label>\n\u003ctextarea data-k=\"s8_diff\">\u003c/textarea>\n\u003clabel>My prompt\u003c/label>\n\u003cselect data-k=\"s8_prompt\">\u003coption value=\"\">— choose —\u003c/option>\u003coption>A · Was Samsung's response to the Note 7 crisis ethical?\u003c/option>\u003coption>B · Should Siemens have paid bribes where \"everyone expects it\"?\u003c/option>\u003coption>C · Should Jillian change her behavior during Ramadan?\u003c/option>\u003c/select>\n\u003clabel>My paragraph (120–170 words)\u003c/label>\n\u003ctextarea class=\"big\" id=\"para\" data-k=\"s8_para\" placeholder=\"Position… Reason… Evidence… Framework… Counterargument… Conclusion…\">\u003c/textarea>\n\u003cdiv class=\"wc\" id=\"pwc\">0 words · target 120–170\u003c/div>\n\u003cp class=\"sub\" style=\"margin-top:12px\">\u003cb>Peer review\u003c/b> — your partner ticks what they find in your paragraph:\u003c/p>\n\u003cdiv class=\"chk\" id=\"checks\">\u003c/div>\n\u003clabel>Partner's suggestion for improvement\u003c/label>\n\u003ctextarea data-k=\"s8_tip\">\u003c/textarea>\n\u003c/section>\n\n\u003cdiv class=\"part\">Homework\u003c/div>\n\n\u003csection class=\"card\">\n\u003ch2>Ethics Journal #5\u003c/h2>\n\u003cp class=\"sub\">150–200 words. Choose one prompt. Use the six-part structure from today.\u003c/p>\n\u003cselect data-k=\"j_prompt\">\u003coption value=\"\">— choose a prompt —\u003c/option>\n\u003coption>A · Ramadan: can two ways of life exist side by side at work?\u003c/option>\n\u003coption>B · Petrobras: could the scandal have been prevented?\u003c/option>\n\u003coption>C · Love in business: can Buber's idea of love play a role in business?\u003c/option>\u003c/select>\n\u003cdetails>\u003csummary>The three cases\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>A · Ramadan\u003c/b> — \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\" target=\"_blank\" rel=\"noopener\">5.3\u003c/a>, box \u003ci>What Would You Do?\u003c/i> \u003cspan class=\"pg\">pp. 144–148\u003c/span>\u003cbr>Jillian Armstrong leads an audit team at a bank in Islamabad, Pakistan, during Ramadan. Her Muslim colleagues fast from dawn until sundown. Jillian has never fasted and worries it's unhealthy in the summer heat; her suggestions to drink water or tea are met with silence. She must decide where to eat lunch. What would happen if she accepted the local custom but kept her own habits at mealtimes? Can two ways of life exist side by side at work?\u003c/p>\n\u003cp>\u003cb>B · Petrobras\u003c/b> — \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\" target=\"_blank\" rel=\"noopener\">5.1\u003c/a>, box \u003ci>Cases from the Real World\u003c/i> \u003cspan class=\"pg\">pp. 132–138\u003c/span>\u003cbr>Executives at Brazil's majority state-owned oil company took bribes and kickbacks from contractors — often more than 5% of the contract value. The money funded political campaigns and luxury goods. The investigation, \"Operation Car Wash\" (from 2014), reached senators and a former president. Could management or government have prevented it? How? Does this case reflect business ethics different from those in other countries?\u003c/p>\n\u003cp>\u003cb>C · Love in business\u003c/b> — \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\" target=\"_blank\" rel=\"noopener\">5.4\u003c/a>, box \u003ci>Ethics Across Time and Cultures\u003c/i> \u003cspan class=\"pg\">pp. 149–158\u003c/span>\u003cbr>Philosopher Martin Buber taught that love is not a feeling but a responsibility of one person for another. Whole Foods founder John Mackey said love was the basis of his business success. Can Buber's idea of love play a role in business? What would it look like? Should business ethics be based only on more concrete rules?\u003c/p>\n\u003c/div>\u003c/details>\n\u003ctextarea class=\"big\" id=\"journal\" data-k=\"journal\" placeholder=\"Position…\">\u003c/textarea>\n\u003cdiv class=\"wc\" id=\"wc\">0 words · target 150–200\u003c/div>\n\u003cp class=\"tip\">\u003cb>Also:\u003c/b> prepare for the \u003cb>midterm in Week 6\u003c/b>. Review Chapters 1–5, your journals and both quizzes.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>Language bank\u003c/h2>\n\u003cdetails>\u003csummary>Key words in simple English\u003c/summary>\u003cdiv>\n\u003cul class=\"lb\">\n\u003cli>\u003cb>enculturation\u003c/b> — learning your own society's rules and values\u003c/li>\n\u003cli>\u003cb>acculturation\u003c/b> — cultural change when two cultures meet\u003c/li>\n\u003cli>\u003cb>etiquette\u003c/b> — manners (≠ ethics!)\u003c/li>\n\u003cli>\u003cb>localization\u003c/b> — adapting a product or practice to a local culture\u003c/li>\n\u003cli>\u003cb>absolute / relative values\u003c/b> — values that hold everywhere / that depend on time or place\u003c/li>\n\u003cli>\u003cb>compliance\u003c/b> — following laws and rules (≠ complaints)\u003c/li>\n\u003cli>\u003cb>moral agency\u003c/b> — the freedom and ability to choose right from wrong\u003c/li>\n\u003cli>\u003cb>recall\u003c/b> — asking customers to return a product (≠ remember)\u003c/li>\n\u003cli>\u003cb>accountable\u003c/b> — responsible and expected to explain\u003c/li>\n\u003c/ul>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Phrases for comparing cultures\u003c/summary>\u003cdiv>\n\u003cul class=\"lb\">\n\u003cli>In the company where I worked, it was common to…\u003c/li>\n\u003cli>In my experience, … · I wouldn't generalize, but…\u003c/li>\n\u003cli>That's a matter of manners rather than morals.\u003c/li>\n\u003cli>I'd adapt to that, but I'd draw the line at…\u003c/li>\n\u003c/ul>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Phrases for judging past decisions\u003c/summary>\u003cdiv>\n\u003cul class=\"lb\">\n\u003cli>Samsung \u003ci>should have\u003c/i> recalled the phones sooner.\u003c/li>\n\u003cli>It \u003ci>could have\u003c/i> admitted responsibility.\u003c/li>\n\u003cli>With hindsight, … · At the time, they couldn't have known…, but…\u003c/li>\n\u003cli>Doctors \u003ci>used to\u003c/i> smoke in their offices.\u003c/li>\n\u003cli>Although…, … · While it's true that…, … · That is fair; however, …\u003c/li>\n\u003c/ul>\u003c/div>\u003c/details>\n\u003c/section>\n\u003c/main>\n\u003cfooter>Textbook content summarized from Byars &amp; Stanberry, \u003cem>Business Ethics\u003c/em>, OpenStax (CC BY-NC-SA 4.0), Chapter 5 and Section 2.5. Outside source: PCWorld (January 2017) on Samsung's investigation. Rude-or-wrong situations and decision options are teacher-made.\u003c/footer>\n\n\u003cscript>\nconst KEY='ethics-w5-worksheet-v1';\nlet data={};\ntry{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){data={}}\nconst $=s=>document.querySelector(s);\n\nconst RUDE=[\"You arrive 15 minutes late to a meeting with a new client.\",\"Before any business talk, your host serves three rounds of tea and talks about family for 40 minutes.\",\"A new colleague calls the CEO by her first name.\",\"A supplier sends your manager an expensive watch the week before a contract decision.\",\"Your manager says “yes, maybe” to a client's request, knowing the answer is no.\",\"A company tells a job applicant the role is “flexible” but expects 70-hour weeks.\"];\nconst R1='\u003coption value=\"\">— my reaction —\u003c/option>\u003coption>Fine\u003c/option>\u003coption>A bit rude\u003c/option>\u003coption>Very rude\u003c/option>\u003coption>Unethical\u003c/option>';\nconst R2='\u003coption value=\"\">— etiquette or ethics? —\u003c/option>\u003coption>Etiquette\u003c/option>\u003coption>Ethics\u003c/option>\u003coption>It depends\u003c/option>';\n$('#rude').innerHTML=RUDE.map((r,i)=>`\u003cdiv class=\"case\">\u003cp>\u003cb>${i+1}.\u003c/b> ${r}\u003c/p>\u003cdiv class=\"row2\">\u003cselect data-k=\"r${i}a\" aria-label=\"Situation ${i+1} — my reaction\">${R1}\u003c/select>\u003cselect data-k=\"r${i}b\" aria-label=\"Situation ${i+1} — etiquette or ethics\">${R2}\u003c/select>\u003c/div>\u003c/div>`).join('');\n\nconst TERMS=[[\"Enculturation\",\"B\"],[\"Acculturation\",\"A\"],[\"Localization\",\"D\"],[\"Consumerism\",\"C\"]];\nconst TDEF='\u003coption value=\"\">—\u003c/option>\u003coption value=\"A\">Cultural change when two cultures meet\u003c/option>\u003coption value=\"B\">Learning your own society\\'s rules, customs and values\u003c/option>\u003coption value=\"C\">A lifestyle focused on buying goods and services\u003c/option>\u003coption value=\"D\">Adapting a product or practice to a local culture\u003c/option>';\n$('#termRows').innerHTML=TERMS.map((t,i)=>`\u003cdiv class=\"pick\" style=\"grid-template-columns:150px 1fr\">\u003cspan>\u003cb>${t[0]}\u003c/b>\u003c/span>\u003cselect data-k=\"tm${i}\" aria-label=\"Meaning of ${t[0]}\">${TDEF}\u003c/select>\u003c/div>`).join('');\n\nconst NORMS=[\"Time and punctuality\",\"Gifts and hospitality\",\"Disagreeing with your boss\",\"Relationships before business\",\"Hiring family and friends\",\"What counts as a serious ethical violation there\"];\n$('#profile').innerHTML=NORMS.map((n,i)=>`\u003clabel>${i+1}. ${n}\u003c/label>\u003ctextarea data-k=\"pn${i}\" style=\"min-height:48px\">\u003c/textarea>`).join('');\nlet pr='';for(let i=0;i\u003c3;i++)pr+=`\u003ctr>\u003ctd>\u003ctextarea data-k=\"pp${i}a\" aria-label=\"Partner ${i+1} — workplace\" placeholder=\"Partner ${i+1} — workplace\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"pp${i}b\" aria-label=\"Partner ${i+1} — a surprising difference\" placeholder=\"A surprising difference\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"pp${i}c\" aria-label=\"Partner ${i+1} — a similarity\" placeholder=\"A similarity\">\u003c/textarea>\u003c/td>\u003c/tr>`;\n$('#partners').innerHTML=pr;\n\nconst DIL=[[\"Card 1 · “Everyone expects it here”\",\"Siemens, the German technology company, paid billions in fines and judgments for bribing officials in several countries. Local officials may have expected bribes, but Siemens was bound by national and international law and its own code of ethics. (5.1)\"],[\"Card 2 · Whose standard?\",\"In the 1990s, Nike was criticized for using sweatshop-like factories in China and Southeast Asia. After demanding improvements from suppliers, it came to be seen as a model. Is imposing Western workplace standards “capitalist imperialism” — or a universal standard of humane treatment? Western consumers might have to pay more. (5.1)\"],[\"Card 3 · Lunch during Ramadan\",\"Jillian leads an audit team at a bank in Islamabad, Pakistan, during Ramadan. Her Muslim colleagues fast until sundown. She worries fasting in the heat is unhealthy and suggests water or tea — they are silent. Where should she eat lunch: alone in her office, at a restaurant for Westerners, or should she fast with the team? (5.3)\"]];\nconst EE='\u003coption value=\"\">— etiquette or ethics? —\u003c/option>\u003coption>Etiquette\u003c/option>\u003coption>Ethics\u003c/option>\u003coption>Both\u003c/option>';\nconst AK='\u003coption value=\"\">— adapt or keep? —\u003c/option>\u003coption>Adapt to the local norm\u003c/option>\u003coption>Keep my own standard\u003c/option>\u003coption>A middle way\u003c/option>';\n$('#dilemmas').innerHTML=DIL.map((d,i)=>`\u003cdiv class=\"case\">\u003ch3>${d[0]}\u003c/h3>\u003cp>${d[1]}\u003c/p>\u003cdiv class=\"row2\">\u003cselect data-k=\"d${i}a\" aria-label=\"${d[0]} — etiquette or ethics\">${EE}\u003c/select>\u003cselect data-k=\"d${i}b\" aria-label=\"${d[0]} — adapt or keep\">${AK}\u003c/select>\u003c/div>\u003ctextarea data-k=\"d${i}c\" aria-label=\"${d[0]} — framework and reason\" placeholder=\"Framework and reason…\" style=\"margin-top:6px;min-height:50px\">\u003c/textarea>\u003c/div>`).join('');\n\nconst SORT=[[\"Mercantilism (1500s–1700s): colonial powers took cotton, silk, diamonds, tea and tobacco; business ethics mainly protected owners.\",\"A\"],[\"Wealthy women wore fur as a status symbol (about 1915). Today many brands ban fur.\",\"B\"],[\"Standard Oil's ruthless practices, exposed by journalist Ida Tarbell (early 1900s).\",\"A\"],[\"A court ruled Ford must be run mainly for shareholders (1919). Later courts gave managers more freedom to consider other stakeholders.\",\"B\"],[\"Banks manipulated the LIBOR interest rate to profit from trades; several traders were convicted.\",\"A\"],[\"Calling HR “human capital” — people as valued resources, not tools.\",\"B\"],[\"Companies sign the UN Global Compact's Ten Principles — voluntarily.\",\"B\"]];\nconst PILE='\u003coption value=\"\">—\u003c/option>\u003coption value=\"A\">A · wrong then and now\u003c/option>\u003coption value=\"B\">B · the standard changed\u003c/option>';\n$('#sortRows').innerHTML=SORT.map((s,i)=>`\u003cdiv class=\"pick\" style=\"grid-template-columns:1fr 210px\">\u003cspan>${s[0]}\u003c/span>\u003cselect data-k=\"so${i}\" aria-label=\"Then and now card ${i+1}\">${PILE}\u003c/select>\u003c/div>`).join('');\n\nconst DEC=[[\"Decision 1 · Early September 2016\",\"Reports of phones overheating and catching fire.\",[\"Say there is no technical problem\",\"Blame the suppliers\",\"Stop sales and recall all phones now\"]],[\"Decision 2 · October 2016\",\"Some replacement phones also catch fire. Airlines ban the phone.\",[\"Fix it again and keep selling\",\"Stop production and take the phone off the market permanently\"]],[\"Decision 3 · January 2017\",\"The investigation is finished. What should the public statement say?\",[\"“Our suppliers' batteries were faulty.”\",\"“We are responsible; here is how we will prevent it.”\",\"Both\"]]];\n$('#decisions').innerHTML=DEC.map((d,i)=>`\u003cdiv class=\"case\">\u003ch3>${d[0]}\u003c/h3>\u003cp>${d[1]}\u003c/p>\u003cdiv class=\"opts\">${d[2].map(o=>`\u003clabel>\u003cinput type=\"radio\" name=\"dc${i}\" data-k=\"dc${i}\" value=\"${o.replace(/\"/g,'&quot;')}\"> ${o}\u003c/label>`).join('')}\u003c/div>\u003ctextarea data-k=\"dr${i}\" aria-label=\"${d[0]} — our reason\" placeholder=\"Our reason…\" style=\"min-height:48px\">\u003c/textarea>\u003c/div>`).join('');\n\nconst CHECKS=[\"Position — a clear answer\",\"Reason\",\"Evidence — a specific fact from the case\",\"Framework — named and applied to the case\",\"Counterargument — stated fairly and answered\",\"Conclusion\"];\n$('#checks').innerHTML=CHECKS.map((c,i)=>`\u003clabel>\u003cinput type=\"checkbox\" data-k=\"pc${i}\" value=\"Yes\"> ${c}\u003c/label>`).join('');\n\n/* save / load */\nconst status=$('#saved');let tmr;\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(data));status.textContent='Saved ✓'}catch(e){status.textContent='Not saved — use Download'}}\nfunction bind(el){\n  const k=el.dataset.k;\n  if(el.type==='radio'){if(data[k]===el.value)el.checked=true;el.addEventListener('change',()=>{data[k]=el.value;save()});return}\n  if(el.type==='checkbox'){if(data[k])el.checked=true;el.addEventListener('change',()=>{if(el.checked)data[k]=el.value;else delete data[k];save()});return}\n  if(data[k]!==undefined)el.value=data[k];\n  el.addEventListener('input',()=>{data[k]=el.value;status.textContent='Saving…';clearTimeout(tmr);tmr=setTimeout(save,400);if(el.id==='journal'||el.id==='para')wc()});\n  if(el.tagName==='SELECT')el.addEventListener('change',()=>{data[k]=el.value;save()});\n}\ndocument.querySelectorAll('[data-k]').forEach(bind);\nfunction count(id,out,lo,hi){const n=($(id).value.trim().match(/\\S+/g)||[]).length;const w=$(out);w.textContent=n+' words · target '+ <script>
const TABS=[{"id": "guide", "label": "Teacher Guide", "file": "teacher-guide.html"}, {"id": "briefing", "label": "Briefing", "file": "teacher-briefing.html"}, {"id": "slides", "label": "Slides", "file": "slides.html"}, {"id": "handouts", "label": "Handouts", "file": "handouts.html"}, {"id": "quiz", "label": "Quiz 2", "file": "quiz.html"}, {"id": "notes", "label": "Study Notes", "file": "study-notes.html"}, {"id": "worksheet", "label": "Student Worksheet", "file": "worksheet.html"}];
const DOCS=JSON.parse(document.getElementById('docs').textContent);
const LOGO=DOCS.__logo||'';
const tabs=document.getElementById('tabs'),panes=document.getElementById('panes');
function html(t){return DOCS[t.id].split('__LOGO__').join(LOGO)}
TABS.forEach(t=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.id='tab-'+t.id;b.textContent=t.label;b.title=t.hint||'';
  b.onclick=()=>go(t.id);tabs.appendChild(b);
});
tabs.insertAdjacentHTML('beforeend','<span class="sp"></span><a id="newtab" href="#">Open in new tab ↗</a>');
let cur=TABS[0];
document.getElementById('newtab').onclick=e=>{e.preventDefault();try{const u=URL.createObjectURL(new Blob([html(cur)],{type:'text/html'}));window.open(u,'_blank')}catch(err){}};
function wire(f){
  try{const d=f.contentDocument;
    d.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');
      if(h==='index.html'){a.style.display='none';return}
      const m=TABS.find(x=>x.file===h.split('#')[0]);
      if(m)a.addEventListener('click',e=>{e.preventDefault();go(m.id)});
      else if(/\.html(#|$)/.test(h)&&!/^https?:/.test(h))a.style.display='none';
    });
  }catch(e){}
}
function go(id,noHash){
  const t=TABS.find(x=>x.id===id)||TABS[0];cur=t;
  TABS.forEach(x=>{document.getElementById('tab-'+x.id).setAttribute('aria-selected',x.id===t.id);const f=document.getElementById('pane-'+x.id);if(f)f.classList.toggle('on',x.id===t.id)});
  let f=document.getElementById('pane-'+t.id);
  if(!f){f=document.createElement('iframe');f.id='pane-'+t.id;f.title=t.label;f.allow='fullscreen';f.allowFullscreen=true;f.className='on';
    f.addEventListener('load',()=>wire(f));f.srcdoc=html(t);panes.appendChild(f)}
  document.title=t.label+' · Week 5 Teachers';
  if(!noHash){try{history.replaceState(null,'','#'+t.id)}catch(e){}}
  try{document.getElementById('tab-'+t.id).scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
  setTimeout(()=>{try{f.contentWindow.focus()}catch(e){}},50);
}
go(location.hash.slice(1),true);
addEventListener('hashchange',()=>go(location.hash.slice(1),true));
</script>
