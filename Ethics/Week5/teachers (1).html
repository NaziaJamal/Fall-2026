<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 5 Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--bg:#fbfaf6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Source Sans 3",system-ui,sans-serif;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);flex:none}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 0}
.top img{height:34px;border-radius:4px}
.top .t{font-family:"Libre Baskerville",serif;font-size:16px;line-height:1.2}
.top .t small{display:block;font-family:"Source Sans 3",sans-serif;font-size:12.5px;color:var(--sky);font-weight:600;letter-spacing:.04em}
.top .who{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:3px 10px;white-space:nowrap}
nav{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;font:600 15px "Source Sans 3",sans-serif;color:#dbe4f0;background:rgba(255,255,255,.08);border:0;border-radius:8px 8px 0 0;padding:9px 16px;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.16);color:#fff}
nav button[aria-selected="true"]{background:var(--bg);color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
nav .sp{flex:1}
nav a{flex:none;align-self:center;font-size:13.5px;color:var(--sky);text-decoration:none;padding:6px 8px;white-space:nowrap}
nav a:hover{color:#fff;text-decoration:underline}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
@media (max-width:600px){.top .t small{display:none}.top .t{font-size:14px}.top img{height:28px}nav button{font-size:14px;padding:8px 12px}}
@media print{.bar{display:none}}
</style>
</head>

px;border-radius:6px;margin:10px 0;font-size:15px}\n.warn{background:#fbf1dc;border-left:4px solid var(--gold);padding:9px 14px;border-radius:6px;margin:10px 0;font-size:15px}\n.lang{background:#fff;border:1px dashed var(--gold-d);border-radius:8px;padding:8px 14px;margin:10px 0;font-size:15px}\n.lang b{color:var(--gold-d)}\nol li,ul li{margin:3px 0}\n.time{font-weight:700;color:var(--gold-d)}\nfooter{font-size:13px;color:#6b7280;border-top:1px solid var(--sky);margin-top:40px;padding-top:12px}\n@media (max-width:860px){.layout{grid-template-columns:1fr}.toc{position:static;max-height:none;padding:10px 0 0;columns:2}.kv{grid-template-columns:1fr}}\n@media print{\n  body{font-size:11.5pt;background:#fff}\n  .noprint,.toc{display:none!important}\n  .layout{display:block;padding:0}\n  header.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .act,table,.say,.note,.warn,.lang{break-inside:avoid}\n  h2{break-before:page}\n  section:first-of-type h2{break-before:auto}\n  a{color:inherit;text-decoration:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"in\">\n  \u003cimg src=\"__LOGO__\" alt=\"Approach International Student Center\" onload=\"this.nextElementSibling.remove()\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\n  \u003cdiv class=\"grow\">\u003ch1>Week 5 Teacher Guide · The Impact of Culture and Time on Business Ethics\u003c/h1>\u003cp>Ethics in a Global World · Chapter 5 (pp. 131–158) · Samsung Note 7 (Section 2.5) · Quiz 2 · 9:00 am–12:50 pm\u003c/p>\u003c/div>\n  \u003cdiv class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print / Save PDF\u003c/button> \u003ca class=\"btn ghost\" href=\"index.html\">All files\u003c/a>\u003c/div>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"layout\">\n\u003cnav class=\"toc\" aria-label=\"Contents\">\n  \u003cb>Overview\u003c/b>\n  \u003ca href=\"#overview\">Goals &amp; concepts\u003c/a>\n  \u003ca href=\"#materials\">Materials &amp; sources\u003c/a>\n  \u003ca href=\"#book\">Textbook map\u003c/a>\n  \u003ca href=\"#prep\">Prep checklist\u003c/a>\n  \u003cb>Class 1 · 9:00–10:40\u003c/b>\n  \u003ca href=\"#c1\">Timing\u003c/a>\n  \u003ca href=\"#c1-a\">Rude or wrong?\u003c/a>\n  \u003ca href=\"#c1-b\">Two sides of a deal (1626)\u003c/a>\n  \u003ca href=\"#c1-c\">Cultural consultants\u003c/a>\n  \u003ca href=\"#c1-d\">Dilemma cards\u003c/a>\n  \u003ca href=\"#c1-e\">Exit ticket &amp; bridge\u003c/a>\n  \u003cb>Class 2 · 11:10–12:50\u003c/b>\n  \u003ca href=\"#c2\">Timing\u003c/a>\n  \u003ca href=\"#c2-a\">Bridge: when even doctors smoked\u003c/a>\n  \u003ca href=\"#c2-b\">Then &amp; now sort\u003c/a>\n  \u003ca href=\"#c2-c\">Samsung Note 7 crisis room\u003c/a>\n  \u003ca href=\"#c2-d\">Writing workshop\u003c/a>\n  \u003ca href=\"#c2-e\">Quiz 2\u003c/a>\n  \u003cb>Support\u003c/b>\n  \u003ca href=\"#lang\">Language support\u003c/a>\n  \u003ca href=\"#hw\">Homework &amp; rubric\u003c/a>\n  \u003ca href=\"#assess\">Checks for understanding\u003c/a>\n  \u003ca href=\"#align\">Assessment links\u003c/a>\n  \u003ca href=\"#flags\">Open questions\u003c/a>\n\u003c/nav>\n\n\u003cmain>\n\n\u003csection id=\"overview\">\n\u003ch2>Week 5 at a glance\u003c/h2>\n\u003cp class=\"lead\">Week 1 asked whether we need one ethical standard everywhere. Week 5 tests that question with real experience: students compare workplace norms they know, separate \u003cem>etiquette\u003c/em> (what's polite) from \u003cem>ethics\u003c/em> (what's right), and ask which values survive across cultures and across time. They leave able to write one strong ethical reflection paragraph — the core skill for the midterm.\u003c/p>\n\u003cdiv class=\"meta\">\n  \u003cdiv>\u003cb>Class 1 · \"Does Ethics Have a Passport?\"\u003c/b>Culture and geography (5.1, 5.3): Rude or wrong? → the 1626 Manhattan deal → cultural consultants (students' own workplace norms) → dilemma cards.\u003c/div>\n  \u003cdiv>\u003cb>Class 2 · \"Does Ethics Have an Expiry Date?\"\u003c/b>Time and universal values (5.2, 5.4): when doctors smoked → then &amp; now sort → Samsung Note 7 crisis room → writing workshop → Quiz 2.\u003c/div>\n  \u003cdiv>\u003cb>The thread\u003c/b>Class 1 asks what changes from place to place; Class 2 asks what changes over time. Both end at the same question: which values never change?\u003c/div>\n\u003c/div>\n\n\u003ch3>Learning goals\u003c/h3>\n\u003cp>By the end of Week 5, students can:\u003c/p>\n\u003col>\n\u003cli>Explain \u003cstrong>enculturation\u003c/strong> and \u003cstrong>acculturation\u003c/strong>, and how culture shapes business ethics.\u003c/li>\n\u003cli>Distinguish \u003cstrong>etiquette\u003c/strong> (cultural manners) from \u003cstrong>ethics\u003c/strong> (right and wrong), using examples from their own professional experience.\u003c/li>\n\u003cli>Explain how ethical standards change over time, and distinguish \u003cstrong>absolute\u003c/strong> from \u003cstrong>relative\u003c/strong> values.\u003c/li>\n\u003cli>Evaluate a company's crisis response (Samsung Note 7) using stakeholders, the ethical minimum/maximum and two frameworks.\u003c/li>\n\u003cli>Write a clear ethical reflection paragraph: position → reason → evidence → framework → counterargument → conclusion.\u003c/li>\n\u003c/ol>\n\n\u003ch3>Key concepts\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>Core ideas students need\u003c/th>\u003cth>Examples in the text\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Ch. 5 intro (p. 131)\u003c/td>\u003ctd>Business ethics reflects a society's values: culture, language, religion. Are some values beyond time and place?\u003c/td>\u003ctd>Respect in business protocols across cultures\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5.1 Ethics and culture (pp. 132–138)\u003c/td>\u003ctd>\u003cstrong>Enculturation\u003c/strong> (learning your own society's rules and values); \u003cstrong>acculturation\u003c/strong> (cultural change from contact with another culture); business is not culturally neutral; balancing purpose, mission and personal beliefs; \u003cstrong>consumerism\u003c/strong>; global supply chains\u003c/td>\u003ctd>The 1626 Manhattan purchase; McDonald's sambal in Indonesia; Petrobras (Operation Car Wash); IBM's beliefs; Merck; Siemens bribery; Nike's overseas factories\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5.2 Ethics over time (pp. 139–143)\u003c/td>\u003ctd>Standards change as situations change — but that doesn't make ethics simply relative; \u003cstrong>mercantilism\u003c/strong>; Industrial Revolution → Information Age; regulation and consumer pressure drive change; \u003cstrong>UN Global Compact\u003c/strong> (voluntary)\u003c/td>\u003ctd>Fur (Anne Morgan, 1915); \"When Even Doctors Smoked\" (Bernays, 1929; Surgeon General, 1964); Tarbell vs. Rockefeller; \u003cem>Dodge v. Ford\u003c/em>; 2008 crisis and Dodd-Frank\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5.3 Geography and religion (pp. 144–148)\u003c/td>\u003ctd>\u003cstrong>Localization\u003c/strong>; the GLOBE project: leaders must \"understand and exceed\" local expectations; time and punctuality; contact vs. noncontact cultures; religion and ethics; stewardship; the Universal Declaration of Human Rights\u003c/td>\u003ctd>Tuareg tea; \u003cem>subito\u003c/em>/\u003cem>sofort\u003c/em>; Matteo Ricci; Rockefeller's faith and philanthropy; \u003cem>What Would You Do?\u003c/em>: dress codes; Ramadan audit in Islamabad\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5.4 Universal values? (pp. 149–158)\u003c/td>\u003ctd>\u003cstrong>Absolute\u003c/strong> vs. \u003cstrong>relative\u003c/strong> values; three levels (individual, organizational, societal); compliance vs. conscience; Federal Sentencing Guidelines (7 steps); the \u003cstrong>humanistic business model\u003c/strong>; \u003cstrong>moral agency\u003c/strong>; bias\u003c/td>\u003ctd>Corruption costs about $2 trillion a year (WEF); Samsung heir Lee Jae-yong (2017); FIFA; VW; LIBOR; Buber and \"love\" in business; Whole Foods\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2.5 Deontology (pp. 50–53)\u003c/td>\u003ctd>Samsung Galaxy Note 7 (\u003cem>Cases from the Real World\u003c/em>): a Kantian motive?\u003c/td>\u003ctd>Fall 2016: phones caught fire; denial, blame on suppliers, then a recall of more than 2 million phones\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\n\u003ch3>Big ethical questions\u003c/h3>\n\u003cul>\n\u003cli>When you work in another culture, when should you adapt — and when should you refuse?\u003c/li>\n\u003cli>Is \"everyone does it here\" ever an ethical reason?\u003c/li>\n\u003cli>Was smoking advertising wrong in 1929, or only wrong now that we know more?\u003c/li>\n\u003cli>Are there values every culture shares? Which ones?\u003c/li>\n\u003cli>When a product fails, what does a company owe its customers — and who should take the blame?\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"materials\">\n\u003ch2>Materials &amp; sources\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Source\u003c/th>\u003cth>What we use\u003c/th>\u003cth>Type\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\">OpenStax 5.1\u003c/a> · pp. 132–138\u003c/td>\u003ctd>Enculturation/acculturation; the Manhattan purchase; Siemens and Nike dilemma cards; Petrobras (journal)\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-2-business-ethics-over-time\">OpenStax 5.2\u003c/a> · pp. 139–143\u003c/td>\u003ctd>When even doctors smoked; then &amp; now sort\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\">OpenStax 5.3\u003c/a> · pp. 144–148\u003c/td>\u003ctd>Rude or wrong? (time, touch, dress); localization; GLOBE; Ramadan dilemma card\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\">OpenStax 5.4\u003c/a> · pp. 149–158\u003c/td>\u003ctd>Absolute vs. relative; compliance; humanistic model; writing workshop\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/2-5-deontology-ethics-as-duty\">OpenStax 2.5\u003c/a> · pp. 50–53\u003c/td>\u003ctd>Samsung Galaxy Note 7 case\u003c/td>\u003ctd>Textbook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://www.pcworld.com/article/3160251/mobile/samsung-blames-batteries-from-two-makers-for-note7-explosions.html\">PCWorld, January 2017\u003c/a>\u003c/td>\u003ctd>Samsung's own investigation (January 2017): batteries from two suppliers; new 8-point battery safety check\u003c/td>\u003ctd>Outside source\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rude or wrong? scenarios; cultural consultant profile; Samsung decision points; model paragraphs; Quiz 2 case\u003c/td>\u003ctd>Class 1 and 2 activities\u003c/td>\u003ctd>Teacher-made\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Adapting the textbook:\u003c/b> Chapter 5 is abstract and essay-like. Instead of reading it straight through, students meet its ideas through their own experience (Class 1) and through change over time (Class 2). The Samsung case from Chapter 2, held back until now, gives the week one concrete business story to analyze and write about.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"book\">\n\u003ch2>Textbook map\u003c/h2>\n\u003cp>\u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 5: The Impact of Culture and Time on Business Ethics, \u003cb>pp. 131–158\u003c/b> (Chapter 6 starts on p. 159). Page numbers are the printed numbers in the OpenStax PDF.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>Parts we use (subheading or box)\u003c/th>\u003cth>Activity\u003c/th>\u003cth>Worksheet\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-introduction\">Chapter 5 introduction\u003c/a>\u003c/td>\u003ctd>p. 131\u003c/td>\u003ctd>Ethics reflects a society's values; are some values universal?\u003c/td>\u003ctd>Rude or wrong?\u003c/td>\u003ctd>§1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\">5.1 The Relationship between Business Ethics and Culture\u003c/a>\u003c/td>\u003ctd>pp. 132–138\u003c/td>\u003ctd>\"Business Encounters Culture\" (enculturation, acculturation, the 1626 Manhattan purchase); \"Balancing Beliefs\" (IBM, Merck, Siemens); \"Consumerism and the Global Marketplace\"; \u003cem>Cases from the Real World\u003c/em>: Petrobras; Overseas Manufacturing (Nike)\u003c/td>\u003ctd>Two sides of a deal; dilemma cards; Journal B\u003c/td>\u003ctd>§2, §4, Journal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-2-business-ethics-over-time\">5.2 Business Ethics over Time\u003c/a>\u003c/td>\u003ctd>pp. 139–143\u003c/td>\u003ctd>\"Shifts in Cultural and Ethical Standards\" (mercantilism, fur, \u003cem>Dodge v. Ford\u003c/em>, Tarbell); \u003cem>Ethics Across Time and Cultures\u003c/em>: When Even Doctors Smoked; \"A Matter of Time\" (UN Global Compact)\u003c/td>\u003ctd>Bridge; then &amp; now sort\u003c/td>\u003ctd>§6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\">5.3 The Influence of Geography and Religion\u003c/a>\u003c/td>\u003ctd>pp. 144–148\u003c/td>\u003ctd>\"Business as Global Relationships\" (localization, GLOBE, time, personal space); \u003cem>What Would You Do?\u003c/em>: Tucked In, Tucked Out; \"Religion and Ethics\" (stewardship, the Universal Declaration of Human Rights); \u003cem>What Would You Do?\u003c/em>: Ramadan\u003c/td>\u003ctd>Rude or wrong?; cultural consultants; dilemma cards; Journal A\u003c/td>\u003ctd>§1, §3, §4, Journal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\">5.4 Are the Values Central to Business Ethics Universal?\u003c/a>\u003c/td>\u003ctd>pp. 149–158\u003c/td>\u003ctd>\"Absolute Values versus Relative Values\"; \"Business Ethics and Compliance\" (Federal Sentencing Guidelines; Samsung heir, FIFA, VW, LIBOR); \"Normative Business Ethics\" (humanistic model, moral agency, bias); \u003cem>Ethics Across Time and Cultures\u003c/em>: What's Love Got to Do with It?; chapter review\u003c/td>\u003ctd>Then &amp; now sort; Samsung; writing workshop; Journal C\u003c/td>\u003ctd>§6, §7, §8, Journal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/2-5-deontology-ethics-as-duty\">2.5 Deontology: Ethics as Duty\u003c/a>\u003c/td>\u003ctd>pp. 50–53\u003c/td>\u003ctd>\u003cem>Cases from the Real World\u003c/em>: Samsung (Galaxy Note 7)\u003c/td>\u003ctd>Samsung crisis room\u003c/td>\u003ctd>§7\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Outside the textbook\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Samsung's January 2017 investigation results (PCWorld); Rude or wrong? scenarios and the Quiz 2 case (teacher-made)\u003c/td>\u003ctd>Samsung reveal; Engage; Quiz 2\u003c/td>\u003ctd>§1, §7\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp class=\"note\">\u003cb>Quiz 2\u003c/b> covers Chapter 4 (pp. 93–130) and Chapter 5 (pp. 131–158). Page ranges come from the PDF's table of contents.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"prep\">\n\u003ch2>Prep checklist\u003c/h2>\n\u003cul>\n\u003cli>☐ Upload the \u003ccode>week5\u003c/code> folder to GitHub; check the worksheet QR code on slide 1.\u003c/li>\n\u003cli>☐ Print from \u003cstrong>handouts.html\u003c/strong>: Manhattan info-gap cards A and B (half the class each), cultural consultant profiles (1 per student), dilemma cards (1 set per triad), then &amp; now cards (1 set per pair, cut), Samsung decision cards (1 set per group), model paragraphs and peer-review checklists (1 per student), exit tickets.\u003c/li>\n\u003cli>☐ Print \u003cstrong>quiz.html\u003c/strong> (student version, 1 per student) and keep the teacher key.\u003c/li>\n\u003cli>☐ Room: Class 1 speed rounds need two lines of chairs facing each other (or pairs that can rotate).\u003c/li>\n\u003cli>☐ Collect Ethics Journal #4. Return Quiz 1 corrections if not done.\u003c/li>\n\u003cli>☐ Optional: tea for the room — the Tuareg \"three cups of tea\" (5.3) makes a memorable opener.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003c!-- CLASS 1 -->\n\u003csection id=\"c1\">\n\u003ch2>Class 1 · \"Does Ethics Have a Passport?\" · 9:00–10:40\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clock\u003c/th>\u003cth>Min\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Activity\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>9:00–9:12\u003c/td>\u003ctd>12\u003c/td>\u003ctd>\u003cspan class=\"tag\">Engage\u003c/span>\u003c/td>\u003ctd>Rude or wrong? (etiquette vs. ethics)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:12–9:27\u003c/td>\u003ctd>15\u003c/td>\u003ctd>\u003cspan class=\"tag s\">Study\u003c/span>\u003c/td>\u003ctd>Two sides of a deal: Manhattan, 1626 (information gap)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:27–10:07\u003c/td>\u003ctd>40\u003c/td>\u003ctd>\u003cspan class=\"tag a\">Activate\u003c/span>\u003c/td>\u003ctd>Cultural consultants: comparing workplace norms\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:07–10:30\u003c/td>\u003ctd>23\u003c/td>\u003ctd>\u003cspan class=\"tag a\">Activate\u003c/span>\u003c/td>\u003ctd>Dilemma cards: adapt or refuse?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:30–10:40\u003c/td>\u003ctd>10\u003c/td>\u003ctd>\u003cspan class=\"tag b\">Reflect\u003c/span>\u003c/td>\u003ctd>Exit ticket + bridge\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"act\" id=\"c1-a\">\n\u003ch3>\u003cspan class=\"tag\">Engage\u003c/span> 9:00–9:12 · Rude or wrong?\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Students discover the week's key distinction from their own reactions: some cultural differences are \u003cem>etiquette\u003c/em> (manners), and some are \u003cem>ethics\u003c/em> (right and wrong).\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Individual → pairs → whole class\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Slides 3–6; worksheet §1\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\">5.3\u003c/a> \"Business as Global Relationships\" (time, personal space, handshakes) (pp. 144–148)\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Six situations on slides 4–5. For each, students hold up fingers: \u003cb>1 = fine\u003c/b> · \u003cb>2 = a bit rude\u003c/b> · \u003cb>3 = very rude\u003c/b> · \u003cb>4 = unethical\u003c/b>. Note the spread.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Pairs discuss the two situations with the most disagreement: \"Why did you choose that number? Where did you learn it?\"\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Reveal (slide 6) and name the distinction.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>#\u003c/th>\u003cth>Situation\u003c/th>\u003cth>Suggested answer\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>You arrive 15 minutes late to a meeting with a new client.\u003c/td>\u003ctd>Etiquette — varies widely by culture (5.3: \u003cem>subito\u003c/em> vs. \u003cem>sofort\u003c/em>; \"time is money\" vs. relational time)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Before any business talk, your host serves three rounds of tea and talks about family for 40 minutes.\u003c/td>\u003ctd>Etiquette — a sign of respect in many cultures (5.3: the Tuareg's three cups of tea)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>A new colleague calls the CEO by her first name.\u003c/td>\u003ctd>Etiquette (hierarchy norms)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>A supplier sends your manager an expensive watch the week before a contract decision.\u003c/td>\u003ctd>\u003cb>Ethics\u003c/b> — a potential bribe or conflict of interest (link: Week 1 gift vs. bribe)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Your manager says \"yes, maybe\" to a client's request, knowing the answer is no.\u003c/td>\u003ctd>Etiquette or ethics — it depends: indirect \"no\" can be politeness, or it can mislead\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>A company tells a job applicant the role is \"flexible\" but expects 70-hour weeks.\u003c/td>\u003ctd>\u003cb>Ethics\u003c/b> — deception\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"say\">\"Some of these made you uncomfortable because of how you were raised — that's \u003cstrong>etiquette\u003c/strong>. Others would be wrong anywhere — that's \u003cstrong>ethics\u003c/strong>. This week's question: where exactly is the line?\"\u003c/div>\n\u003cdiv class=\"lang\">\u003cb>Language:\u003c/b> \"Where I've worked, that would be considered…\" · \"That's a matter of manners rather than morals.\" · \"It depends on whether…\" · \"I'd find that rude, but not unethical.\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c1-b\">\n\u003ch3>\u003cspan class=\"tag s\">Study\u003c/span> 9:12–9:27 · Two sides of a deal: Manhattan, 1626\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Teach \u003cstrong>enculturation\u003c/strong> and \u003cstrong>acculturation\u003c/strong> through an information gap: two sides of the same deal understood it differently because of their cultures.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Pairs: A and B\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Info-gap cards A and B (handouts p.1); slides 7–9; worksheet §2\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\">5.1\u003c/a> \"Business Encounters Culture\" and Figure 5.2 (pp. 132–138)\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Mini-input (slide 7): \u003cstrong>enculturation\u003c/strong> = how you learn your own society's rules, customs and values — no one is born with a culture. \u003cstrong>Acculturation\u003c/strong> = how cultures change when they meet; it affects both sides.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Student A reads card A; student B reads card B. No showing.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Pairs explain their side to each other and answer: What did each side probably think they agreed to? What assumption caused the problem?\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Reveal (slide 9) and debrief.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Card A (what the textbook says about the Dutch side)\u003c/th>\u003cth>Card B (what the textbook says about the Lenape side)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>May 1626. Peter Minuit, the new director of the Dutch West India Company's colony, made a deal with a group of Lenape people for the island of Manhattan. The Dutch paid goods worth \"sixty guilders\" (about $1,000 today) — possibly tools, kettles, axes, knives, clothing, muskets and gunpowder. To the Dutch, this was a purchase: they now owned the land.\u003c/td>\u003ctd>No written deed survives. Some historians think the Lenape believed they were granting \u003cem>use rights\u003c/em> — permission to share and use the land — not selling it forever. The disagreement over property later led to war. The famous story of \"$24 in beads\" is a legend.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Debrief questions:\u003c/b>\u003c/p>\n\u003cul>\n\u003cli>Was anyone lying? Or did each side honestly understand \"a deal\" differently?\u003c/li>\n\u003cli>What did each side's enculturation teach them about land and ownership?\u003c/li>\n\u003cli>Where in modern business do two sides sign the same contract but understand it differently? (Ask for professional examples.)\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"say\">\"The textbook says business itself is not culturally neutral — it often reflects a Western, English-speaking mindset: individualism, competition, private property. When you do business across cultures, you are translating more than words.\"\u003c/div>\n\u003cdiv class=\"warn\">\u003cb>Sensitivity:\u003c/b> This is a story of colonization and later violence. Keep the focus on misunderstanding and power, not on blaming individual students' backgrounds.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c1-c\">\n\u003ch3>\u003cspan class=\"tag a\">Activate\u003c/span> 9:27–10:07 · Cultural consultants\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Syllabus cross-cultural comparison. Students use their professional experience as expertise, compare norms in speed rounds, and sort differences into etiquette vs. ethics — without anyone speaking for a whole country.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Individual → speed pairs (3 rounds) → groups of 4\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Consultant profiles (handouts p.2); slides 10–13; worksheet §3\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\">5.3\u003c/a> localization; the GLOBE project (pp. 144–148); \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\">5.4\u003c/a> universal values (pp. 149–158)\u003c/span>\u003c/div>\n\u003cdiv class=\"warn\">\u003cb>Ground rule (say it explicitly, slide 10):\u003c/b> \"Speak from \u003cem>a workplace you know\u003c/em> — 'In the hospital where I worked in ___…' — not 'In my country, everyone…'. One workplace is not a whole nation.\" This prevents stereotyping and gives quieter students a safe frame.\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(7 min)\u003c/span> \u003cb>Profile.\u003c/b> Each student completes a profile of one workplace they know well (country, industry, size). Six norms: (1) time and punctuality; (2) gifts and hospitality; (3) disagreeing with your boss; (4) relationships before business; (5) hiring family and friends; (6) what is considered a serious ethical violation there.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(18 min)\u003c/span> \u003cb>Speed consulting.\u003c/b> Three rounds of 5 minutes (plus 1 minute to change). In each round, partners compare two norms of their choice and find one surprising difference and one similarity. Partners note each other's examples in worksheet §3.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(10 min)\u003c/span> \u003cb>Group sort (groups of 4).\u003c/b> List the differences you found. Sort them: \u003cb>etiquette\u003c/b> (adapt to it) or \u003cb>ethics\u003c/b> (don't compromise). Then agree on \u003cb>one value that seemed universal\u003c/b> across all your workplaces.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(5 min)\u003c/span> Each group shares its universal value. Write them on the board — you'll use them in Class 2.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Expected outcome:\u003c/b> Groups usually find that punctuality, dress, hierarchy and hospitality are etiquette, while honesty with customers, not stealing, not taking bribes and safety are treated as ethics almost everywhere — even if enforcement differs. Hiring family and friends is often the most debated.\u003c/p>\n\u003cdiv class=\"say\">\"The textbook cites the GLOBE leadership study: effective leaders need to \u003cem>understand and exceed\u003c/em> the expectations of the cultures they work in. Adapting to etiquette shows respect. But the textbook also says some values — not lying, not defrauding customers — are close to absolute.\"\u003c/div>\n\u003cdiv class=\"lang\">\u003cb>Language:\u003c/b> \"In the company where I worked, it was common to…\" · \"That surprised me, because where I've worked…\" · \"We do that too, but for a different reason.\" · \"I'd call that etiquette rather than ethics, because…\" · \"That's not universal, in my experience.\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c1-d\">\n\u003ch3>\u003cspan class=\"tag a\">Activate\u003c/span> 10:07–10:30 · Dilemma cards: adapt or refuse?\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Apply the etiquette/ethics line to three textbook dilemmas where adapting to local culture has real costs.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Triads; each triad chooses 2 of 3 cards\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Dilemma cards (handouts p.3); slides 14–16; worksheet §4\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-1-the-relationship-between-business-ethics-and-culture\">5.1\u003c/a> Siemens; \u003cem>Cases from the Real World\u003c/em>: Overseas Manufacturing (pp. 132–138); \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-3-the-influence-of-geography-and-religion\">5.3\u003c/a> \u003cem>What Would You Do?\u003c/em>: Ramadan (pp. 144–148)\u003c/span>\u003c/div>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Card\u003c/th>\u003cth>Case (textbook facts)\u003c/th>\u003cth>Points to draw out\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 · \"Everyone expects it here\"\u003c/td>\u003ctd>Siemens, the German technology company, paid billions in fines and judgments for bribing officials in several countries. Local officials may have expected bribes, but Siemens was bound by national and international law and its own code of ethics.\u003c/td>\u003ctd>Ethics, not etiquette. \"Everyone does it\" doesn't change the harm. The textbook: corruption costs about $2 trillion a year (WEF) and hurts the poor most.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 · Whose standard?\u003c/td>\u003ctd>In the 1990s, Nike was criticized for using sweatshop-like factories in China and Southeast Asia. After demanding improvements from suppliers, it came to be seen as a model. Is imposing Western workplace standards \"capitalist imperialism\" — or a universal standard of humane treatment? Western consumers might pay more.\u003c/td>\u003ctd>Safety and dignity vs. local wage levels; the consumer's responsibility.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 · Lunch during Ramadan\u003c/td>\u003ctd>Jillian leads an audit team at a bank in Islamabad, Pakistan, during Ramadan. Her Muslim colleagues fast until sundown. She worries fasting in the heat is unhealthy and suggests water or tea — they are silent. Where should she eat lunch: alone in her office, at a restaurant for Westerners, or should she fast with the team?\u003c/td>\u003ctd>Mostly etiquette and respect — and her suggestions were unwelcome. Can two ways of life exist side by side at work?\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>For each card, triads answer:\u003c/b> (1) Etiquette, ethics, or both? (2) Adapt to the local norm, or keep your own standard? (3) Which framework supports your answer — virtue, utilitarian, Kantian, Rawlsian, or stakeholder thinking?\u003c/p>\n\u003cp>\u003cb>Debrief (5 min):\u003c/b> Ask one triad per card to report. Finish with the textbook's idea of \u003cstrong>localization\u003c/strong> — adapting products and practices to local languages and cultures (e.g., McDonald's serving sambal chili sauce in Indonesia) — and ask: where does localization stop?\u003c/p>\n\u003cdiv class=\"warn\">\u003cb>Sensitivity:\u003c/b> Card 3 involves religious practice. Students who fast may want to share; don't ask them to explain or represent their religion. Card 2 can touch on students' home economies — keep it about companies and consumers.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c1-e\">\n\u003ch3>\u003cspan class=\"tag b\">Reflect\u003c/span> 10:30–10:40 · Exit ticket &amp; bridge\u003c/h3>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(6 min)\u003c/span> Exit ticket (worksheet §5): (1) Enculturation vs. acculturation in your own words. (2) One difference you'd adapt to, and one you'd refuse. (3) One question.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Bridge (slide 18): show the 1929 \"torches of freedom\" story — Edward Bernays marketed Lucky Strike cigarettes to women as a symbol of freedom. \"Over the break: was that wrong in 1929, or only wrong now?\"\u003c/li>\n\u003c/ol>\n\u003c/div>\n\n\u003c!-- CLASS 2 -->\n\u003csection id=\"c2\">\n\u003ch2>Class 2 · \"Does Ethics Have an Expiry Date?\" · 11:10–12:50\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clock\u003c/th>\u003cth>Min\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Activity\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>11:10–11:17\u003c/td>\u003ctd>7\u003c/td>\u003ctd>\u003cspan class=\"tag\">Engage\u003c/span>\u003c/td>\u003ctd>Bridge: when even doctors smoked\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:17–11:32\u003c/td>\u003ctd>15\u003c/td>\u003ctd>\u003cspan class=\"tag s\">Study\u003c/span>\u003c/td>\u003ctd>Then &amp; now sort: absolute vs. relative values\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:32–11:55\u003c/td>\u003ctd>23\u003c/td>\u003ctd>\u003cspan class=\"tag a\">Activate\u003c/span>\u003c/td>\u003ctd>Samsung Galaxy Note 7 crisis room\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:55–12:23\u003c/td>\u003ctd>28\u003c/td>\u003ctd>\u003cspan class=\"tag a\">Activate\u003c/span>\u003c/td>\u003ctd>Writing workshop: the ethical reflection paragraph\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:23–12:48\u003c/td>\u003ctd>25\u003c/td>\u003ctd>\u003cspan class=\"tag b\">Assess\u003c/span>\u003c/td>\u003ctd>Quiz 2 (Chapters 4–5)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:48–12:50\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\u003cspan class=\"tag b\">Close\u003c/span>\u003c/td>\u003ctd>Homework (on slide)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"act\" id=\"c2-a\">\n\u003ch3>\u003cspan class=\"tag\">Engage\u003c/span> 11:10–11:17 · When even doctors smoked\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Make \"ethics changes over time\" concrete and slightly uncomfortable.\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Slide 20; worksheet §6\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-2-business-ethics-over-time\">5.2\u003c/a> \u003cem>Ethics Across Time and Cultures\u003c/em>: \"When Even Doctors Smoked\" (pp. 139–143)\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(2 min)\u003c/span> Facts from the textbook: from the 1940s to the 1970s, cigarettes were nearly everywhere — judges, factory workers, even pregnant women smoked. In 1929, Edward Bernays marketed Lucky Strikes as \"torches of freedom.\" On January 11, 1964, the U.S. Surgeon General's report linked smoking to lung cancer. Smoking has since declined in Western countries but remains common in parts of the global East and South, where manufacturers promote it — especially to young people.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(5 min)\u003c/span> Vote, then pairs: Was the 1929 campaign wrong \u003cb>then\u003c/b>? Is selling cigarettes to young people in other countries \u003cb>today\u003c/b> wrong? Did the facts change, or the ethics?\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"say\">\"The textbook makes a careful point: ethical standards change over time — but that does \u003cem>not\u003c/em> mean ethics is simply relative. Sometimes the values stay the same and our \u003cem>knowledge\u003c/em> changes.\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c2-b\">\n\u003ch3>\u003cspan class=\"tag s\">Study\u003c/span> 11:17–11:32 · Then &amp; now sort\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Teach absolute vs. relative values (5.4) by sorting historical practices (5.2).\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Pairs\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Then &amp; now cards (handouts p.4); slides 21–22; worksheet §6 (self-check)\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-2-business-ethics-over-time\">5.2\u003c/a> (pp. 139–143); \u003ca href=\"https://openstax.org/books/business-ethics/pages/5-4-are-the-values-central-to-business-ethics-universal\">5.4\u003c/a> \"Absolute Values versus Relative Values\" (pp. 149–158)\u003c/span>\u003c/div>\n\u003cp>\u003cb>Mini-input (3 min, slide 22):\u003c/b> \u003cstrong>Absolute values\u003c/strong> are close to objective: don't lie, don't defraud customers, don't cheat, don't kill — any exception needs a very strong justification. \u003cstrong>Relative values\u003c/strong> depend on time, place or culture. \u003cstrong>Universal values\u003c/strong> are values all people can endorse; the textbook suggests the UN Universal Declaration of Human Rights (1948) as a starting point.\u003c/p>\n\u003cp>\u003cb>Sort (8 min):\u003c/b> Pairs place each card in one of two piles: \u003cb>A — wrong then and now; we just enforce it better\u003c/b> (an absolute value) or \u003cb>B — the standard itself has changed\u003c/b> (a relative value or new knowledge). Then compare (4 min).\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Card (textbook)\u003c/th>\u003cth>Suggested pile\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Mercantilism (16th–18th centuries): colonial powers extracted cotton, silk, diamonds, tea and tobacco; business ethics mainly protected owners. (5.2)\u003c/td>\u003ctd>A — exploitation was always wrong to those exploited\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Wealthy women wore fur as a symbol of status (Anne Morgan, about 1915). Today many brands ban fur. (5.2; link: Net-a-Porter, Week 4)\u003c/td>\u003ctd>B — the standard has changed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Standard Oil's ruthless practices, exposed by journalist Ida Tarbell (early 1900s). (5.2)\u003c/td>\u003ctd>A — fraud and abuse of power\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>A court ruled that Ford must run the company mainly for shareholders (\u003cem>Dodge v. Ford\u003c/em>, 1919). Later courts gave managers more freedom to consider other stakeholders. (5.2)\u003c/td>\u003ctd>B — the standard has changed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Banks manipulated the LIBOR interest rate to profit from trades; several traders were convicted. (5.4)\u003c/td>\u003ctd>A — dishonesty\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Calling HR \"human capital\" or \"human assets\" — people as valued resources, not tools. (5.2)\u003c/td>\u003ctd>B — the standard has changed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Companies sign the UN Global Compact's Ten Principles on human rights, labor, environment and anticorruption — voluntarily. (5.2)\u003c/td>\u003ctd>B — new expectations, based on lasting values\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"note\">Accept well-argued alternatives. The key insight: most \"changes over time\" are changes in \u003cem>knowledge, enforcement or who counts\u003c/em>, not in the core values of honesty and fairness.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c2-c\">\n\u003ch3>\u003cspan class=\"tag a\">Activate\u003c/span> 11:32–11:55 · Samsung Galaxy Note 7 crisis room\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Syllabus case study. Students make the company's decisions at three moments before learning what happened, then evaluate the response.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Groups of 4 (\"Samsung crisis teams\")\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Decision cards (handouts p.5); slides 23–28; worksheet §7\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/2-5-deontology-ethics-as-duty\">2.5\u003c/a> \u003cem>Cases from the Real World\u003c/em>: Samsung (pp. 50–53). Outside source for the investigation results: PCWorld (January 2017).\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(2 min)\u003c/span> Set the scene (slide 23): Fall 2016. Samsung's new Galaxy Note 7 phones are catching fire. The textbook says the company was likely rushing to launch before Apple's iPhone 7.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(12 min)\u003c/span> Three decision points, 4 minutes each. Groups choose an option and write one reason.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Reveal what happened (slide 27).\u003c/li>\n\u003cli>\u003cspan class=\"time\">(5 min)\u003c/span> Evaluate (slide 28).\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Decision point\u003c/th>\u003cth>Options\u003c/th>\u003cth>What happened\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>1 · Early September 2016.\u003c/b> Reports of phones overheating and catching fire.\u003c/td>\u003ctd>A · Say there is no technical problem · B · Blame the suppliers · C · Stop sales and recall all phones now\u003c/td>\u003ctd>Textbook: Samsung first denied technical problems, then blamed suppliers. It announced a global recall in early September; the U.S. safety regulator recalled about 1 million phones on September 15.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>2 · October 2016.\u003c/b> Some \u003cem>replacement\u003c/em> phones also catch fire. Airlines ban the phone.\u003c/td>\u003ctd>A · Fix it again and keep selling · B · Stop production and take the phone off the market permanently\u003c/td>\u003ctd>Samsung ended production; the recall was expanded to replacement phones (October 13). Samsung said 96% of about 3 million phones sold and activated were returned.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>3 · January 2017.\u003c/b> The investigation is finished. What does the public statement say?\u003c/td>\u003ctd>A · \"Our suppliers' batteries were faulty.\" · B · \"We are responsible; here is how we will prevent it.\" · C · Both\u003c/td>\u003ctd>More than 700 researchers tested over 200,000 phones and 30,000 batteries. Samsung said batteries from \u003cb>two different manufacturers\u003c/b> had different defects, and introduced an \u003cb>8-point battery safety check\u003c/b> and an outside expert advisory group. Reporting noted that Samsung attributed the problems to its suppliers.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch4>Evaluate (questions on slide 28)\u003c/h4>\n\u003cul>\n\u003cli>\u003cb>Minimum or maximum?\u003c/b> Was the final response closer to the ethical minimum or maximum? (Link: Week 3 — Samsung's washer recall.)\u003c/li>\n\u003cli>\u003cb>Kant:\u003c/b> The textbook says the response \"focused on customer safety and satisfaction, arguably a Kantian motive\" — but some argue Samsung could have acted faster and further. Do you agree?\u003c/li>\n\u003cli>\u003cb>Utilitarian:\u003c/b> The mobile division's operating profit fell 95% in one quarter. Was the cost worth it — for whom?\u003c/li>\n\u003cli>\u003cb>Responsibility:\u003c/b> Samsung designed and sold the phone. Is it fair to blame the suppliers?\u003c/li>\n\u003cli>\u003cb>The textbook's outcome:\u003c/b> it says the response limited the damage and even boosted the share price. Does a good outcome make it ethical?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"lang\">\u003cb>Language:\u003c/b> \"We'd recommend recalling, even though…\" · \"Blaming the suppliers would…\" · \"From a Kantian standpoint, the motive matters because…\" · \"Ultimately, the company is accountable for…\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c2-d\">\n\u003ch3>\u003cspan class=\"tag a\">Activate\u003c/span> 11:55–12:23 · Writing workshop: the ethical reflection paragraph\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Syllabus writing workshop. Fix the patterns seen on Quiz 1 — definitions without application, opinion without reasons — and practice the paragraph structure needed for the midterm.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Pairs → individual → peer review\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Model paragraphs and checklist (handouts p.6–7); slides 29–32; worksheet §8 (with word counter)\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>Uses the Samsung case (2.5, pp. 50–53) or a Class 1 dilemma (5.1, 5.3)\u003c/span>\u003c/div>\n\u003ch4>The structure (slide 29)\u003c/h4>\n\u003col>\n\u003cli>\u003cb>Position\u003c/b> — answer the question in one clear sentence.\u003c/li>\n\u003cli>\u003cb>Reason\u003c/b> — why?\u003c/li>\n\u003cli>\u003cb>Evidence\u003c/b> — a fact from the case (numbers, names, what happened).\u003c/li>\n\u003cli>\u003cb>Framework\u003c/b> — name it and \u003cem>apply\u003c/em> it to this case.\u003c/li>\n\u003cli>\u003cb>Counterargument\u003c/b> — the strongest opposing view, stated fairly, then answered.\u003c/li>\n\u003cli>\u003cb>Conclusion\u003c/b> — return to your position, perhaps refined.\u003c/li>\n\u003c/ol>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(6 min)\u003c/span> \u003cb>Weak vs. strong.\u003c/b> Pairs compare two paragraphs on the same question (below) and list three differences.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Elicit: the strong one applies the framework to the case, uses a specific fact, and answers a counterargument.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(13 min)\u003c/span> \u003cb>Write.\u003c/b> Students write one paragraph (120–170 words) on one prompt:\n  \u003cul>\u003cli>A · Was Samsung's response to the Note 7 crisis ethical?\u003c/li>\u003cli>B · Should Siemens have paid bribes where \"everyone expects it\"?\u003c/li>\u003cli>C · Should Jillian change her behavior during Ramadan?\u003c/li>\u003c/ul>\u003c/li>\n\u003cli>\u003cspan class=\"time\">(6 min)\u003c/span> \u003cb>Peer review\u003c/b> with the six-point checklist: tick each element present; underline the framework sentence; suggest one improvement.\u003c/li>\n\u003c/ol>\n\u003ch4>Model paragraphs (question: \"Was Samsung's response to the Note 7 crisis ethical?\")\u003c/h4>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Weak\u003c/th>\u003cth>Strong\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Samsung's response was ethical and not ethical. Utilitarianism is the greatest happiness for the greatest number. Kant is about duty. Companies should be responsible. In my opinion they should always think about customers because customers are important. So it is good and bad.\u003c/td>\u003ctd>Samsung's final response was largely ethical, but it came too late. The company first denied any technical problem and blamed its suppliers, while phones were still catching fire. Only later did it stop production and take back about 96% of roughly 3 million phones. From a Kantian perspective, the recall respected customers as ends in themselves, not merely as sources of profit; however, the early denial treated their safety as less important than the launch schedule. Some would argue that Samsung acted reasonably, since it needed time to find the cause. That is fair, but when people's safety is at risk, a company should act first and investigate later. Overall, Samsung reached the ethical maximum only after trying the minimum.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Point out:\u003c/b> The weak paragraph \u003cem>defines\u003c/em> frameworks; the strong one \u003cem>applies\u003c/em> one. The weak one has no facts; the strong one has three. The weak one ends without a position.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c2-e\">\n\u003ch3>\u003cspan class=\"tag b\">Assess\u003c/span> 12:23–12:48 · Quiz 2 (Chapters 4–5)\u003c/h3>\n\u003cul>\n\u003cli>Print \u003cstrong>quiz.html\u003c/strong> (student version). 30 points: Part A multiple choice (10), Part B matching (8), Part C a short case with an ethical reflection paragraph (12) — directly practiced in the writing workshop.\u003c/li>\n\u003cli>No phones or notes. 5-minute warning at 12:43.\u003c/li>\n\u003cli>Key and Part C rubric: tap \u003cstrong>Show teacher key\u003c/strong> in quiz.html.\u003c/li>\n\u003cli>Homework is on slide 34 — leave it up as students finish.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cb>Why today?\u003c/b> Week 6 is the midterm, so Quiz 2 can't move to next week. If time is short, cut the writing workshop's peer review (6 min) — students can peer-review at the start of Week 6 instead.\u003c/div>\n\u003c/div>\n\n\u003csection id=\"lang\">\n\u003ch2>Language support\u003c/h2>\n\u003ch3>Essential vocabulary\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Word\u003c/th>\u003cth>Simple meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>enculturation\u003c/td>\u003ctd>learning your own society's rules, customs and values\u003c/td>\u003ctd>Our sense of punctuality comes from enculturation.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>acculturation\u003c/td>\u003ctd>cultural change when two cultures meet\u003c/td>\u003ctd>Global business speeds up acculturation.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>etiquette\u003c/td>\u003ctd>polite behavior; manners\u003c/td>\u003ctd>Bowing is etiquette, not ethics.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>localization\u003c/td>\u003ctd>adapting a product or practice to a local culture\u003c/td>\u003ctd>Sambal at McDonald's in Indonesia is localization.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>consumerism\u003c/td>\u003ctd>a lifestyle focused on buying things\u003c/td>\u003ctd>Consumerism drives global supply chains.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>mercantilism\u003c/td>\u003ctd>an old economic idea that wealth is fixed, so you must take it from others\u003c/td>\u003ctd>Colonial trade was based on mercantilism.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>absolute / relative values\u003c/td>\u003ctd>values that hold everywhere / values that depend on time or place\u003c/td>\u003ctd>Honesty is close to an absolute value.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>universal values\u003c/td>\u003ctd>values all people can accept\u003c/td>\u003ctd>The UN Declaration lists universal rights.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>compliance\u003c/td>\u003ctd>following laws and rules\u003c/td>\u003ctd>Compliance is not the same as conscience.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>moral agency\u003c/td>\u003ctd>the ability and freedom to choose right from wrong\u003c/td>\u003ctd>\"My boss told me to\" doesn't remove moral agency.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>humanistic business model\u003c/td>\u003ctd>a business that balances profit with care for people\u003c/td>\u003ctd>Training and health care reflect a humanistic model.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>recall\u003c/td>\u003ctd>when a company asks customers to return a product\u003c/td>\u003ctd>Samsung recalled the Note 7.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>accountable\u003c/td>\u003ctd>responsible and expected to explain your actions\u003c/td>\u003ctd>The CEO is accountable to customers.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Useful collocations\u003c/h3>\n\u003cp>cultural norms · cross-cultural misunderstanding · adapt to local customs · draw the line at · a matter of manners · a matter of principle · take responsibility for · shift the blame onto · issue a recall · restore trust · a lapse in judgment · stand by your values\u003c/p>\n\u003ch3>Words students may misunderstand\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>ethics / etiquette\u003c/b> — look similar, mean different things (morals vs. manners).\u003c/li>\n\u003cli>\u003cb>custom / costume\u003c/b> — a tradition vs. clothes for a performance.\u003c/li>\n\u003cli>\u003cb>relative\u003c/b> — here \"depending on circumstances,\" not \"a family member.\"\u003c/li>\n\u003cli>\u003cb>recall\u003c/b> — return a product, not \"remember.\"\u003c/li>\n\u003cli>\u003cb>compliance\u003c/b> — following rules, not \"complaints.\"\u003c/li>\n\u003c/ul>\n\u003ch3>Pronunciation\u003c/h3>\n\u003cp>en·cul·tur·A·tion · ac·cul·tur·A·tion · e·TI·quette (US /ˈet.ɪ.kət/) · lo·cal·i·ZA·tion · MER·can·til·ism · ab·so·LUTE (US /ˈæb.sə.luːt/) · com·PLI·ance · ac·COUN·ta·ble\u003c/p>\n\u003ch3>Grammar in use\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Past habits (used to / would):\u003c/b> \"Doctors \u003cem>used to\u003c/em> smoke in their offices.\" · \"People \u003cem>would\u003c/em> wear fur as a status symbol.\"\u003c/li>\n\u003cli>\u003cb>Past modals for judging decisions:\u003c/b> \"Samsung \u003cem>should have\u003c/em> recalled the phones sooner.\" · \"It \u003cem>could have\u003c/em> admitted responsibility.\"\u003c/li>\n\u003cli>\u003cb>Contrast for counterarguments:\u003c/b> \"\u003cem>Although\u003c/em> it needed time to investigate, …\" · \"\u003cem>While\u003c/em> it's true that…, …\" · \"That is fair; \u003cem>however\u003c/em>, …\"\u003c/li>\n\u003cli>\u003cb>Generalizing carefully:\u003c/b> \"\u003cem>In the company where I worked\u003c/em>, …\" rather than \"\u003cem>In my country, everyone\u003c/em>…\"\u003c/li>\n\u003c/ul>\n\u003ch3>Discussion language (B2+)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Function\u003c/th>\u003cth>Language\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Comparing cultures carefully\u003c/td>\u003ctd>In my experience, … · That may vary from company to company. · I wouldn't generalize, but…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Separating etiquette from ethics\u003c/td>\u003ctd>That's a matter of manners rather than morals. · I'd adapt to that, but I'd draw the line at…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Judging past decisions\u003c/td>\u003ctd>With hindsight, … · At the time, they couldn't have known…, but…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Assigning responsibility\u003c/td>\u003ctd>Ultimately, ___ is accountable for… · Shifting the blame onto ___ doesn't…\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"hw\">\n\u003ch2>Homework\u003c/h2>\n\u003ch3>1 · Ethics Journal #5 (150–200 words)\u003c/h3>\n\u003cp>Choose \u003cstrong>one\u003c/strong> prompt. Use today's paragraph structure: \u003cem>Position → Reason → Evidence → Framework → Counterargument → Conclusion\u003c/em>.\u003c/p>\n\u003col type=\"A\">\n\u003cli>\u003cb>Ramadan (5.3, \u003cem>What Would You Do?\u003c/em>):\u003c/b> What would happen if Jillian accepted the local custom but kept her own habits at lunch? Can two ways of life exist side by side at work?\u003c/li>\n\u003cli>\u003cb>Petrobras (5.1, \u003cem>Cases from the Real World\u003c/em>):\u003c/b> Could management or government have prevented the bribery scandal? How? Does this case reflect business ethics different from those in other countries?\u003c/li>\n\u003cli>\u003cb>Love in business (5.4, \u003cem>Ethics Across Time and Cultures\u003c/em>):\u003c/b> Philosopher Martin Buber said love is a responsibility of one person for another. Can that idea play a role in business? What would it look like?\u003c/li>\n\u003c/ol>\n\u003ch3>2 · Midterm preparation\u003c/h3>\n\u003cp>Week 6 includes the midterm. Review Chapters 1–5, your journals and both quizzes. Bring questions.\u003c/p>\n\u003ch3>Journal rubric (4 × 3 = 12 points)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>3\u003c/th>\u003cth>2\u003c/th>\u003cth>1\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Position\u003c/td>\u003ctd>Clear, specific answer to the prompt\u003c/td>\u003ctd>Present but vague\u003c/td>\u003ctd>No clear position\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Evidence &amp; framework\u003c/td>\u003ctd>Specific facts from the case, and a framework \u003cem>applied\u003c/em> to them\u003c/td>\u003ctd>Facts or framework, but not both\u003c/td>\u003ctd>Framework only defined\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Counterargument\u003c/td>\u003ctd>Stated fairly and answered\u003c/td>\u003ctd>Mentioned, not answered\u003c/td>\u003ctd>Missing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Language\u003c/td>\u003ctd>Past modals, contrast language and course vocabulary mostly accurate\u003c/td>\u003ctd>Some; errors rarely block meaning\u003c/td>\u003ctd>Errors often block meaning\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"assess\">\n\u003ch2>Checks for understanding\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Rude or wrong?\u003c/b> — can students articulate the etiquette/ethics line?\u003c/li>\n\u003cli>\u003cb>Manhattan info gap\u003c/b> — enculturation/acculturation used correctly in the debrief.\u003c/li>\n\u003cli>\u003cb>Consultant profiles and group sort\u003c/b> — collect; strong evidence of cross-cultural reasoning and professional language.\u003c/li>\n\u003cli>\u003cb>Dilemma cards\u003c/b> — triads name a framework for each decision.\u003c/li>\n\u003cli>\u003cb>Then &amp; now sort\u003c/b> (self-check) — absolute vs. relative.\u003c/li>\n\u003cli>\u003cb>Samsung decisions\u003c/b> — reasons given, not just choices.\u003c/li>\n\u003cli>\u003cb>Paragraph + peer checklist\u003c/b> — collect; preview for the midterm.\u003c/li>\n\u003cli>\u003cb>Quiz 2\u003c/b> — formal individual assessment.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection id=\"align\">\n\u003ch2>How Week 5 builds toward the assessments\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>This week's practice\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Quiz 2 (this week)\u003c/td>\u003ctd>Then &amp; now sort; quiz Part C mirrors the writing workshop\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Midterm (Week 6)\u003c/td>\u003ctd>The ethical reflection paragraph; case analysis (Samsung)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Written assignments\u003c/td>\u003ctd>Journal #5 with the six-part structure\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Personal Code of Ethics (Weeks 8–9)\u003c/td>\u003ctd>\"What I'd adapt to, and where I'd draw the line\" — a ready-made section for the code\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Final assessment\u003c/td>\u003ctd>Cross-cultural comparison; universal vs. relative values\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Participation\u003c/td>\u003ctd>Speed consulting, triad dilemmas, crisis room\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"flags\">\n\u003ch2>Open questions &amp; flags\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Quiz 2 timing:\u003c/strong> placed at the end of Class 2 because Week 6 is the midterm. Chapter 5 is taught the same day, so the quiz focuses on concepts practiced in class.\u003c/li>\n\u003cli>\u003cstrong>What does the midterm cover?\u003c/strong> The syllabus lists \"Midterm review and discussion\" and a midterm assessment in Week 6 but doesn't say which chapters or what format. Tell me and I'll build the review and the midterm.\u003c/li>\n\u003cli>\u003cstrong>Samsung facts:\u003c/strong> the textbook says Samsung recalled \"more than two million phones\"; Samsung later said about 3 million had been sold and activated, and 96% were returned. The materials use both, labeled.\u003c/li>\n\u003cli>\u003cstrong>Samsung heir (5.4):\u003c/strong> the textbook mentions Lee Jae-yong's 2017 bribery conviction. Since then, he received a presidential pardon (2022), and in July 2025 South Korea's Supreme Court upheld his acquittal in a separate merger case. Not used in class; know it if asked.\u003c/li>\n\u003cli>\u003cstrong>Religion:\u003c/strong> 5.3 discusses religion and ethics, including Ramadan. The materials keep this respectful and optional; no student is asked to explain their faith.\u003c/li>\n\u003cli>\u003cstrong>Dated textbook examples:\u003c/strong> Petrobras (2014–2017), IBM's CEO quote and some figures are several years old; present them as \"the textbook reports…\"\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003cfooter>Textbook content summarized from Byars &amp; Stanberry, \u003cem>Business Ethics\u003c/em>, OpenStax (CC BY-NC-SA 4.0), Chapter 5 and Section 2.5. Outside source: PCWorld, \"Samsung blames batteries from two makers for Note7 explosions\" (January 2017). Rude-or-wrong scenarios, decision options and the Quiz 2 case are teacher-made.\u003c/footer>\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "briefing": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Week 5 Teacher Briefing · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568;--bg:#fbfaf6}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55}\nheader{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}\nheader .in{max-width:900px;margin:0 auto;padding:18px 16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}\nheader img{width:54px;height:54px;border-radius:8px}\n.w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.12em;font-size:15px;line-height:1.1}\n.w small{display:block;letter-spacing:.02em;font-size:10px;color:#e6d8a8}\nheader h1{font-family:\"Libre Baskerville\",serif;margin:0;font-size:clamp(20px,4vw,26px)}\nheader p{margin:2px 0 0;color:var(--sky);font-size:14px}\n.grow{flex:1;min-width:200px}\n.btn{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}\n.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}\nmain{max-width:900px;margin:0 auto;padding:6px 16px 50px}\n.toc{background:#fff;border:1px solid var(--sky);border-radius:10px;padding:12px 18px;margin:18px 0;columns:2;column-gap:30px;font-size:15px}\n.toc b{display:block;color:var(--gold-d);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;column-span:all}\n.toc a{display:block;color:var(--navy);text-decoration:none;padding:2px 0;break-inside:avoid}\n.toc a:hover{text-decoration:underline}\nh2{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:22px;margin:34px 0 8px;padding-bottom:5px;border-bottom:3px solid var(--gold)}\nh2 .n{color:var(--gold-d);margin-right:6px}\nh3{color:var(--blue);margin:20px 0 6px;font-size:18px}\np{margin:6px 0 10px}\nul,ol{margin:4px 0 10px;padding-left:22px}li{margin:3px 0}\n.s{color:var(--gold-d);font-style:italic;font-weight:600}\n.big{background:var(--cream);border-left:5px solid var(--gold-d);padding:10px 15px;border-radius:6px;margin:12px 0;font-size:17.5px}\n.say{background:var(--sky3);border-left:5px solid var(--blue);padding:9px 14px;border-radius:6px;margin:10px 0}\n.say b:first-child{color:var(--blue)}\n.watch{background:#fbf1dc;border-left:5px solid var(--gold);padding:9px 14px;border-radius:6px;margin:10px 0;font-size:16px}\n.src{font-size:13.5px;color:var(--muted)}\ntable{width:100%;border-collapse:collapse;background:#fff;font-size:15.5px;margin:8px 0 12px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.tw{overflow-x:auto}\n.qa{background:#fff;border:1px solid var(--sky);border-radius:8px;padding:8px 14px;margin:8px 0}\n.qa p{margin:4px 0}\n.qa .q{font-weight:700;color:var(--navy)}\nfooter{font-size:12.5px;color:#6b7280;margin-top:34px;border-top:1px solid var(--sky);padding-top:10px}\n@media (max-width:640px){.toc{columns:1}}\n@media print{body{background:#fff;font-size:11pt}.noprint{display:none}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}h2{break-after:avoid}table,.big,.say,.watch,.qa{break-inside:avoid}a{color:inherit;text-decoration:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"in\">\n  \u003cimg src=\"__LOGO__\" alt=\"Approach International Student Center\" onload=\"this.nextElementSibling.remove()\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\n  \u003cdiv class=\"grow\">\u003ch1>Week 5 Teacher Briefing · Culture and Time\u003c/h1>\u003cp>For the teacher only · background reading before class · Chapter 5 (pp. 131–158) and the Samsung case (2.5)\u003c/p>\u003c/div>\n  \u003cdiv class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button> \u003ca class=\"btn ghost\" href=\"index.html\">All files\u003c/a>\u003c/div>\n\u003c/div>\u003c/header>\n\u003cmain>\n\n\u003cp class=\"big\">\u003cb>How to read this:\u003c/b> Every technical term is followed by a \u003cspan class=\"s\">(simple meaning in brackets)\u003c/span>. Parts 1–5 explain the ideas, Part 6 the Samsung case, Part 7 the writing skill, and Part 8 questions students may ask.\u003c/p>\n\n\u003cnav class=\"toc\" aria-label=\"Contents\">\n\u003cb>Contents\u003c/b>\n\u003ca href=\"#p1\">1 · The big picture in five sentences\u003c/a>\n\u003ca href=\"#p2\">2 · Culture and business ethics (5.1)\u003c/a>\n\u003ca href=\"#p3\">3 · Ethics over time (5.2)\u003c/a>\n\u003ca href=\"#p4\">4 · Geography and religion (5.3)\u003c/a>\n\u003ca href=\"#p5\">5 · Are some values universal? (5.4)\u003c/a>\n\u003ca href=\"#p6\">6 · The Samsung Galaxy Note 7 case (2.5)\u003c/a>\n\u003ca href=\"#p7\">7 · The ethical reflection paragraph\u003c/a>\n\u003ca href=\"#p8\">8 · Questions students may ask you\u003c/a>\n\u003ca href=\"#p9\">9 · One-page glossary\u003c/a>\n\u003c/nav>\n\n\u003ch2 id=\"p1\">\u003cspan class=\"n\">1\u003c/span>The big picture in five sentences\u003c/h2>\n\u003col>\n\u003cli>What people think is \"right in business\" is partly learned from their culture — their language, customs, religion and history.\u003c/li>\n\u003cli>Many cultural differences are about \u003cb>etiquette\u003c/b> \u003cspan class=\"s\">(manners: what is polite)\u003c/span>, not \u003cb>ethics\u003c/b> \u003cspan class=\"s\">(morals: what is right or wrong)\u003c/span>.\u003c/li>\n\u003cli>Ethical standards also change over time — fur, smoking and child labor were once normal.\u003c/li>\n\u003cli>But the textbook argues this doesn't make ethics simply \u003cb>relative\u003c/b> \u003cspan class=\"s\">(different for everyone, with no shared standard)\u003c/span>: some values, like honesty and not cheating customers, seem close to universal.\u003c/li>\n\u003cli>A good international business adapts to local manners but keeps its core values everywhere.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"say\">\u003cb>Say it in class:\u003c/b> \"Adapt your manners. Keep your morals.\"\u003c/div>\n\n\u003ch2 id=\"p2\">\u003cspan class=\"n\">2\u003c/span>Culture and business ethics \u003cspan class=\"src\">(5.1, pp. 132–138)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Enculturation\u003c/b> \u003cspan class=\"s\">(the process of learning your own society's rules, customs, skills and values — no one is born with a culture)\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Acculturation\u003c/b> \u003cspan class=\"s\">(cultural change that happens when two cultures meet; it changes both of them)\u003c/span>. In the past it came mostly from conquest; today it also comes from business and media.\u003c/li>\n\u003cli>The textbook says \u003cb>business is not culturally neutral\u003c/b> \u003cspan class=\"s\">(it is not free of cultural assumptions)\u003c/span>: modern business often reflects a Western, English-speaking way of thinking — individualism, competition, private property.\u003c/li>\n\u003cli>\u003cb>The Manhattan purchase (1626):\u003c/b> Peter Minuit of the Dutch West India Company made a deal with a Lenape group for Manhattan, paying goods worth \"sixty guilders\" (about $1,000 today). No deed survives. Some historians think the Lenape believed they were granting \u003cb>use rights\u003c/b> \u003cspan class=\"s\">(permission to use land, not ownership)\u003c/span>. The famous \"$24 in beads\" is a legend.\u003c/li>\n\u003cli>Three kinds of beliefs a company must balance: its \u003cb>purpose\u003c/b> \u003cspan class=\"s\">(why it exists)\u003c/span>, its \u003cb>mission\u003c/b> \u003cspan class=\"s\">(how it expresses that purpose)\u003c/span>, and its people's personal beliefs from their culture.\u003c/li>\n\u003cli>\u003cb>Consumerism\u003c/b> \u003cspan class=\"s\">(a lifestyle focused on buying goods and services)\u003c/span> drives global supply chains, which raises questions about wages, working conditions and child labor abroad.\u003c/li>\n\u003cli>Examples: \u003cb>Siemens\u003c/b> paid billions in fines for bribing officials in several countries; \u003cb>Nike\u003c/b> was criticized in the 1990s for \u003cb>sweatshop\u003c/b> \u003cspan class=\"s\">(a factory with very low pay and bad conditions)\u003c/span> suppliers, then improved; \u003cb>Petrobras\u003c/b>, Brazil's state oil company, was at the center of a huge \u003cb>kickback\u003c/b> \u003cspan class=\"s\">(an illegal secret payment in return for a contract)\u003c/span> scandal investigated as \"Operation Car Wash\" from 2014.\u003c/li>\n\u003c/ul>\n\n\u003ch2 id=\"p3\">\u003cspan class=\"n\">3\u003c/span>Ethics over time \u003cspan class=\"src\">(5.2, pp. 139–143)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>Standards change as situations, knowledge and technology change — but the textbook says this \u003cb>does not make ethics relative\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Mercantilism\u003c/b> \u003cspan class=\"s\">(an economic idea of the 1500s–1700s: the world's wealth is fixed, so a nation gets rich by taking resources from others, e.g., through colonies)\u003c/span>.\u003c/li>\n\u003cli>Eras: mercantilism → Industrial Revolution → postindustrial era → Information Age → globalization.\u003c/li>\n\u003cli>\u003cb>\"When Even Doctors Smoked\"\u003c/b> (box): from the 1940s to the 1970s, smoking was everywhere. In 1929, Edward Bernays — the founder of \u003cb>public relations\u003c/b> \u003cspan class=\"s\">(managing a company's public image)\u003c/span> — marketed Lucky Strike cigarettes to women as \"torches of freedom.\" On January 11, 1964, the U.S. Surgeon General's report linked smoking to lung cancer.\u003c/li>\n\u003cli>\u003cb>Muckrakers\u003c/b> \u003cspan class=\"s\">(journalists who expose corruption)\u003c/span> like Ida Tarbell exposed Standard Oil and John D. Rockefeller.\u003c/li>\n\u003cli>Recent change often comes from \u003cb>regulation\u003c/b> \u003cspan class=\"s\">(government rules)\u003c/span> and \u003cb>consumer pressure\u003c/b> — e.g., the Dodd-Frank Act after the 2008 financial crisis.\u003c/li>\n\u003cli>\u003cb>UN Global Compact\u003c/b> \u003cspan class=\"s\">(a voluntary agreement in which companies commit to ten principles on human rights, labor, the environment and anticorruption)\u003c/span>. It is not legally binding.\u003c/li>\n\u003c/ul>\n\n\u003ch2 id=\"p4\">\u003cspan class=\"n\">4\u003c/span>Geography and religion \u003cspan class=\"src\">(5.3, pp. 144–148)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Localization\u003c/b> \u003cspan class=\"s\">(adapting a product or practice to a local language and culture — e.g., McDonald's offering sambal chili sauce in Indonesia)\u003c/span>.\u003c/li>\n\u003cli>\u003cb>The GLOBE project\u003c/b> \u003cspan class=\"s\">(a large international study of leadership)\u003c/span> found that good leadership depends on context: leaders must \"understand and exceed\" local expectations.\u003c/li>\n\u003cli>\u003cb>Time:\u003c/b> some cultures treat time as fixed and precise; others as flexible and relationship-based. Example: among the Tuareg of North Africa, three cups of tea come before business.\u003c/li>\n\u003cli>\u003cb>Contact vs. noncontact cultures\u003c/b> \u003cspan class=\"s\">(cultures where people stand closer and touch more vs. cultures with more personal space)\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Religion and ethics:\u003c/b> closely linked for most of history. The \u003cb>Protestant ethic\u003c/b> \u003cspan class=\"s\">(values of hard work, saving and simplicity, linked to the rise of capitalism in Britain and the U.S.)\u003c/span>. \u003cb>Stewardship\u003c/b> \u003cspan class=\"s\">(treating wealth as something you care for responsibly, not just use)\u003c/span>. Judaism, Christianity and Islam all teach that people must not be treated merely as means to wealth.\u003c/li>\n\u003cli>Could a shared \u003cb>secular\u003c/b> \u003cspan class=\"s\">(non-religious)\u003c/span> code emerge? The textbook points to the \u003cb>Universal Declaration of Human Rights\u003c/b> \u003cspan class=\"s\">(a 1948 UN statement of basic rights for all people)\u003c/span>.\u003c/li>\n\u003cli>Two \u003ci>What Would You Do?\u003c/i> boxes: \u003cb>dress codes\u003c/b> (\"Tucked In, Tucked Out\") and \u003cb>Ramadan\u003c/b> \u003cspan class=\"s\">(the Islamic month of fasting from dawn to sunset)\u003c/span> — an auditor, Jillian, working in Islamabad while her Muslim colleagues fast.\u003c/li>\n\u003c/ul>\n\n\u003ch2 id=\"p5\">\u003cspan class=\"n\">5\u003c/span>Are some values universal? \u003cspan class=\"src\">(5.4, pp. 149–158)\u003c/span>\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Absolute values\u003c/b> \u003cspan class=\"s\">(values that are close to objective and hold everywhere — e.g., don't lie, don't defraud customers, don't murder)\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Relative values\u003c/b> \u003cspan class=\"s\">(values that depend on the time, place or culture)\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Universal values\u003c/b> \u003cspan class=\"s\">(values that all people can accept)\u003c/span>.\u003c/li>\n\u003cli>Three levels of ethics: \u003cb>individual\u003c/b> (conscience), \u003cb>organizational\u003c/b> and \u003cb>societal\u003c/b> (laws and regulation).\u003c/li>\n\u003cli>\u003cb>Compliance\u003c/b> \u003cspan class=\"s\">(following laws and rules)\u003c/span> vs. \u003cb>conscience\u003c/b> \u003cspan class=\"s\">(your inner sense of right and wrong)\u003c/span>. U.S. companies spend more than $70 billion a year on ethics training, often just to meet minimum legal requirements. The \u003cb>Federal Sentencing Guidelines\u003c/b> \u003cspan class=\"s\">(U.S. rules that reward companies with good ethics programs)\u003c/span> list seven steps, starting with a code of ethics.\u003c/li>\n\u003cli>Scandals cited: Samsung heir Lee Jae-yong (bribery conviction, 2017); FIFA (2015); Volkswagen (2015); \u003cb>LIBOR\u003c/b> \u003cspan class=\"s\">(a key interest rate that banks manipulated for profit)\u003c/span>.\u003c/li>\n\u003cli>Corruption costs the world about $2 trillion a year (World Economic Forum estimate in the textbook).\u003c/li>\n\u003cli>\u003cb>Humanistic business model\u003c/b> \u003cspan class=\"s\">(a business that balances profit and responsibility, treating employees as whole people — supporting their training, health and families)\u003c/span>.\u003c/li>\n\u003cli>\u003cb>Moral agency\u003c/b> \u003cspan class=\"s\">(the awareness, freedom and ability to choose right from wrong)\u
