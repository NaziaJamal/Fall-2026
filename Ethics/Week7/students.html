12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\n.sec{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}\n.sec a{font-size:14px}\n.big{font-size:17px}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 7 · Chapter 7: What Employees Owe Employers\u003c/small>\u003c/div>\u003cspan class=\"who\">Summary\u003c/span>\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\u003ch1>Chapter 7 Summary: What Employees Owe Employers\u003c/h1>\n\u003cp class=\"lead\">\u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 7, from p. 195 · \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-introduction\" target=\"_blank\" rel=\"noopener\">Open Chapter 7 online\u003c/a>\u003c/p>\n\u003cp class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\u003c/p>\n\n\u003csection>\n\u003ch2>The chapter in one paragraph\u003c/h2>\n\u003cp class=\"big\">Chapter 6 looked at what employers owe employees. Chapter 7 looks at the other side. Employees owe their employers hard work, loyalty, confidentiality, respect for the brand and customers, a positive attitude toward coworkers, and honesty with money. But the book argues that loyalty must be a \u003cb>two-way street\u003c/b>: companies earn loyalty by how they treat people. Employees may criticize their employer in some situations, and when the company breaks the law, they may become \u003cb>whistleblowers\u003c/b>, which can be both protected and risky.\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.1 · Loyalty to the company\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-1-loyalty-to-the-company\" target=\"_blank\" rel=\"noopener\">Read 7.1 (pp. 196–202)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>In the U.S., employees have a \u003cb>duty of loyalty\u003c/b>: they must not act against their employer's interests. They should work in good faith, avoid \u003cb>conflicts of interest\u003c/b>, and not take a competing second job (\u003cb>moonlighting\u003c/b>) without permission. People with more authority owe a higher \u003cb>fiduciary duty\u003c/b>.\u003c/li>\n\u003cli>Professor Matthew Bidwell says loyalty has two parts: caring about the employer's interests, and staying with the employer. The second part has weakened: younger workers change jobs much more often.\u003c/li>\n\u003cli>Reasons include \u003cb>at-will employment\u003c/b> (either side can end the job at any time), leaders who move for more money, retirement plans that move with the worker, and better pay elsewhere. The book says employers must also earn loyalty.\u003c/li>\n\u003cli>Employees must protect \u003cb>confidential\u003c/b> information. Companies use \u003cb>trade secrets\u003c/b>, \u003cb>nondisclosure agreements\u003c/b>, patents, copyrights and trademarks to protect their ideas.\u003c/li>\n\u003cli>\u003cb>Non-compete agreements\u003c/b> stop people from working for competitors. They are controversial, especially for low-wage workers: Jimmy John's agreed in 2016 to stop using them for sandwich makers, and California makes most of them void. Contracts may also include \u003cb>nonsolicitation\u003c/b> and \u003cb>nondisparagement\u003c/b> clauses.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.2 · Loyalty to the brand and to customers\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-2-loyalty-to-the-brand-and-to-customers\" target=\"_blank\" rel=\"noopener\">Read 7.2 (pp. 203–206)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>A \u003cb>brand\u003c/b> is valuable, and employees can protect it or damage it. Employees at Taco Bell, Domino's and Burger King Japan hurt their companies with videos and photos online.\u003c/li>\n\u003cli>Companies use \u003cb>internal marketing\u003c/b> to help employees believe in the product.\u003c/li>\n\u003cli>Employees owe customers respect and good service. A school custodian, Kathy Fryman, is the book's example of going far beyond the job.\u003c/li>\n\u003cli>But good service does not mean accepting harassment. In a Pizza Hut case, a jury awarded $360,000 to a server whose manager made her serve customers who harassed her.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.3 · Contributing to a positive work atmosphere\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-3-contributing-to-a-positive-work-atmosphere\" target=\"_blank\" rel=\"noopener\">Read 7.3 (pp. 207–211)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>Employees should treat coworkers with courtesy and respect, and disagree about \u003cb>\"principles, not personalities.\"\u003c/b>\u003c/li>\n\u003cli>People have different \u003cb>work styles\u003c/b> and \u003cb>workplace personalities\u003c/b>; understanding them helps teams work well.\u003c/li>\n\u003cli>The book describes four types of \u003cb>workplace violence\u003c/b>: criminal intent, worker against worker, personal relationships, and customers.\u003c/li>\n\u003cli>Companies write \u003cb>codes of conduct\u003c/b> about laws, gifts, conflicts of interest, company property, cybersecurity, social media and harassment.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.4 · Financial integrity\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-4-financial-integrity\" target=\"_blank\" rel=\"noopener\">Read 7.4 (pp. 212–217)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Insider trading\u003c/b> means trading shares using important information the public doesn't have. It is illegal for insiders, for outsiders who receive a tip, and for the person who passes the tip on. Examples: Texas Gulf Sulphur and Drexel Burnham Lambert.\u003c/li>\n\u003cli>A \u003cb>bribe\u003c/b> is something of value given to get someone to break the rules. Gifts can be a gray area; it depends on value, purpose, timing and company policy.\u003c/li>\n\u003cli>The \u003cb>Foreign Corrupt Practices Act (FCPA)\u003c/b> bans U.S. companies and citizens from bribing foreign officials. It allows small \u003cb>\"grease\" payments\u003c/b> for routine tasks. Companies such as Telia have paid large fines.\u003c/li>\n\u003cli>Some actions are legal but still unethical. Ethical leaders think about more than the law.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003cdiv class=\"sec\">\u003ch2 style=\"flex:1;margin-bottom:4px\">7.5 · Criticism of the company and whistleblowing\u003c/h2>\u003ca href=\"https://openstax.org/books/business-ethics/pages/7-5-criticism-of-the-company-and-whistleblowing\" target=\"_blank\" rel=\"noopener\">Read 7.5 (p. 218 onward)\u003c/a>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Pay secrecy:\u003c/b> under the National Labor Relations Act, employees may usually talk together about pay, hours and working conditions (\u003cb>concerted activity\u003c/b>). Most rules against discussing pay are unenforceable.\u003c/li>\n\u003cli>\u003cb>Criticism online:\u003c/b> free speech rights limit the government, not private employers. Purely personal criticism (like Adrian Duane's review of his manager) is usually not protected.\u003c/li>\n\u003cli>\u003cb>Whistleblowing\u003c/b> means reporting your employer's illegal conduct to a government agency. Whistleblowers can lose their careers or face \u003cb>retaliation\u003c/b>.\u003c/li>\n\u003cli>The book's advice: act from a good motive, usually try \u003cb>internal channels\u003c/b> first, have \u003cb>hard evidence\u003c/b>, and report \u003cb>serious\u003c/b> problems that can realistically be stopped.\u003c/li>\n\u003cli>U.S. legal protection comes from \u003cb>specific laws\u003c/b>, starting with OSHA (1970). The \u003cb>False Claims Act\u003c/b> lets whistleblowers share in money recovered (\u003cb>qui tam\u003c/b>). Some received very large rewards (Birkenfeld, Kopchinski).\u003c/li>\n\u003cli>Two stories show the cost: \u003cb>Sherron Watkins\u003c/b> (Enron) went to the press, not the SEC, and had no legal protection. \u003cb>Sallie Krawcheck\u003c/b> (Merrill Lynch) got investors repaid and later lost her job.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Key terms\u003c/h2>\n\u003cdiv class=\"phr\">\u003cspan>duty of loyalty\u003c/span>\u003cspan>conflict of interest\u003c/span>\u003cspan>moonlighting\u003c/span>\u003cspan>fiduciary duty\u003c/span>\u003cspan>at-will employment\u003c/span>\u003cspan>confidentiality\u003c/span>\u003cspan>trade secret\u003c/span>\u003cspan>intellectual property\u003c/span>\u003cspan>non-compete agreement\u003c/span>\u003cspan>nonsolicitation\u003c/span>\u003cspan>nondisparagement\u003c/span>\u003cspan>brand\u003c/span>\u003cspan>internal marketing\u003c/span>\u003cspan>code of conduct\u003c/span>\u003cspan>insider trading\u003c/span>\u003cspan>bribe\u003c/span>\u003cspan>FCPA\u003c/span>\u003cspan>grease payment\u003c/span>\u003cspan>pay secrecy\u003c/span>\u003cspan>concerted activity\u003c/span>\u003cspan>whistleblowing\u003c/span>\u003cspan>retaliation\u003c/span>\u003cspan>qui tam\u003c/span>\u003c/div>\n\u003cp class=\"src\">Full list with definitions: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-key-terms\" target=\"_blank\" rel=\"noopener\">Chapter 7 key terms\u003c/a> · The book's own summary: \u003ca href=\"https://openstax.org/books/business-ethics/pages/7-summary\" target=\"_blank\" rel=\"noopener\">Chapter 7 summary\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Updates since the book (outside sources)\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Non-competes:\u003c/b> the U.S. Federal Trade Commission's 2024 national ban never took effect. The FTC dropped its appeal in September 2025, so state law now decides.\u003c/li>\n\u003cli>\u003cb>Whistleblower rewards:\u003c/b> in fiscal year 2025, the SEC paid about $60 million to 48 whistleblowers.\u003c/li>\n\u003cli>\u003cb>Around the world:\u003c/b> the EU Whistleblower Directive (2019) protects reporting inside the company, to a regulator, or to the public. Japan's amended law adds criminal penalties for retaliation from December 1, 2026.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003cp class=\"src\">Textbook: Byars & Stanberr const nav=document.getElementById('nav'),main=document.getElementById('main');
TABS.forEach(t=>{const b=document.createElement('button');b.textContent=t.label;b.dataset.id=t.id;b.onclick=()=>open(t.id);nav.appendChild(b)});
const ext=document.createElement('a');ext.target='_blank';ext.rel='noopener';ext.textContent='Open in new tab';nav.appendChild(ext);
function open(id){const t=TABS.find(x=>x.id===id)||TABS[0];let f=document.getElementById('f-'+t.id);
 if(!f){f=document.createElement('iframe');f.id='f-'+t.id;f.title=t.label;f.srcdoc=DOCS[t.id].split('src="logo.png"').join('src="'+DOCS.__logo+'"');main.appendChild(f)}
 document.querySelectorAll('iframe').forEach(x=>x.classList.toggle('on',x===f));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===t.id));
 ext.href=t.file;try{history.replaceState(null,'','#'+t.id)}catch(e){}}
open(location.hash.slice(1)||TABS[0].id);
</script></body></html>
