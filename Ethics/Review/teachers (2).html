contract\u003c/b>.\"],\n  [\"What do the letters CSR stand for?\",\"\u003cb>Corporate social responsibility\u003c/b>: a company sees itself as a member of society, with duties beyond profit.\"],\n  [\"Name the three normative theories that Chapter 1 introduces.\",\"\u003cb>Utilitarianism\u003c/b> (results), \u003cb>deontology\u003c/b> (duties and rights) and \u003cb>virtue ethics\u003c/b> (character).\"],\n  [\"Why is \\\"It's legal\\\" not the same as \\\"It's ethical\\\"? Give a workplace example.\",\"The law is only the \u003cb>minimum\u003c/b>; it can't cover every situation, and laws change. Example: it may be legal to lay off staff by text message with no warning, but it isn't respectful or fair. Accept any clear example.\"]]},\n {t:\"Ancient to Modern\",c:\"Chapter 2\",q:[\n  [\"Who wrote \u003ci>A Theory of Justice\u003c/i> (1971)?\",\"\u003cb>John Rawls\u003c/b>.\"],\n  [\"Aristotle's name for virtue as the balance between too much and too little.\",\"\u003cb>The golden mean\u003c/b>. Example: courage sits between cowardice and recklessness.\"],\n  [\"In Confucian ethics, the name for the exemplary, humane person.\",\"\u003cb>Junzi\u003c/b>.\"],\n  [\"Which philosopher answered Rawls, saying the state may not take legally earned property to give to others?\",\"\u003cb>Robert Nozick\u003c/b> (\u003ci>Anarchy, State, and Utopia\u003c/i>, 1974).\"],\n  [\"A company tells job applicants the pay is \\\"competitive,\\\" but it is the lowest in the city. What would Kant say?\",\"It is \u003cb>deception\u003c/b>. Kant: lying could not be a universal rule, and it treats applicants \u003cb>merely as a means\u003c/b> to cheap hiring. Wrong whatever the result.\"]]},\n {t:\"Stakeholders\",c:\"Chapter 3\",q:[\n  [\"Competitors and industry associations are this type of stakeholder.\",\"\u003cb>Normative\u003c/b> stakeholders.\"],\n  [\"In the power–interest matrix, what should a company do with stakeholders who have high power and high interest?\",\"\u003cb>Manage them closely\u003c/b>: they are the key stakeholders.\"],\n  [\"The word for how urgent a stakeholder's claim is right now.\",\"\u003cb>Exigency\u003c/b>.\"],\n  [\"In 1982, J&amp;J removed all Tylenol from U.S. stores. About how many bottles, and what guided the decision?\",\"About \u003cb>30 million bottles\u003c/b> (over $100 million), guided by the company's \u003cb>credo\u003c/b>.\"],\n  [\"Name two stakeholders that cannot speak for themselves. Who might speak for them?\",\"E.g., \u003cb>the environment, future generations, young children, animals\u003c/b>. Spoken for by \u003cb>NGOs, the media, government, community groups\u003c/b>.\"]]},\n {t:\"Society, Planet, Government\",c:\"Chapter 4\",q:[\n  [\"A fee a company pays for every unit of carbon it releases.\",\"\u003cb>A carbon tax\u003c/b>.\"],\n  [\"A system with an overall pollution limit, where companies can buy and sell permits.\",\"\u003cb>Cap and trade\u003c/b>.\"],\n  [\"The triple bottom line measures which three things?\",\"\u003cb>People, planet and profit\u003c/b>.\"],\n  [\"The U.S. law passed in 2002, after Enron and WorldCom, to make company finances more transparent.\",\"\u003cb>The Sarbanes-Oxley Act\u003c/b>.\"],\n  [\"What is the \\\"revolving door,\\\" and why is it an ethical problem?\",\"People move \u003cb>between an industry and the government agency that regulates it\u003c/b>. It creates \u003cb>conflicts of interest\u003c/b> and can lead to weak regulation.\"]]},\n {t:\"Culture and Time\",c:\"Chapter 5\",q:[\n  [\"McDonald's adapting its menu to local tastes is an example of this.\",\"\u003cb>Localization\u003c/b>.\"],\n  [\"The old idea that the world's wealth is fixed, so one nation must take it from others.\",\"\u003cb>Mercantilism\u003c/b>.\"],\n  [\"Which journalist exposed Standard Oil's practices in the early 1900s?\",\"\u003cb>Ida Tarbell\u003c/b>.\"],\n  [\"The voluntary United Nations framework of ten principles for business.\",\"\u003cb>The UN Global Compact\u003c/b> (human rights, labor, environment, anticorruption).\"],\n  [\"Manhattan, 1626: what did the Dutch think they were getting, and what may the Lenape have thought they were giving?\",\"The Dutch: \u003cb>ownership\u003c/b> (a purchase). The Lenape: possibly \u003cb>use rights\u003c/b>, permission to share the land. One deal, two cultural meanings.\"]]},\n {t:\"Employers and Employees\",c:\"Chapter 6\",q:[\n  [\"The U.S. law and federal agency for workplace safety.\",\"\u003cb>OSHA\u003c/b> (the Occupational Safety and Health Act / Administration).\"],\n  [\"A state law saying no worker can be required to join a union.\",\"\u003cb>A right-to-work law\u003c/b>.\"],\n  [\"The European practice of giving workers a seat on the company's board of directors.\",\"\u003cb>Codetermination\u003c/b>.\"],\n  [\"Name the two exceptions in the U.S. Electronic Communications Privacy Act (1986) that let employers monitor communications.\",\"The \u003cb>business purpose exception\u003c/b> and the \u003cb>consent exception\u003c/b>.\"],\n  [\"The principle that pay should reflect how much a job is worth to the organization, not what the person earned before.\",\"\u003cb>Comparable worth\u003c/b>.\"]]}\n];\nconst VALS=[100,200,300,400,500];\nconst DD=[[1,3],[3,2]]; // Daily Doubles: Chapter 2 · 400 and Chapter 4 · 300\nconst FINAL={cat:\"Final round · Any framework\",q:\"A hospital uses an AI system to decide which patients see a doctor first, to save money. Choose one framework and use it in one or two sentences to judge this decision.\",a:\"Teacher judges. A strong answer \u003cb>names a framework and applies it to the facts\u003c/b>. E.g., Rawls: behind the veil you might be the patient the AI ranks last, so the system must protect the most vulnerable. Utilitarian: count lives saved and money saved against harm to patients who wait. Kant: patients must not be treated merely as costs.\"};\nconst SKEY='ethics-jeopardy-w6';\nlet S={teams:[{n:\"Team 1\",s:0},{n:\"Team 2\",s:0},{n:\"Team 3\",s:0}],used:[]};\ntry{const x=JSON.parse(localStorage.getItem(SKEY)||'null');if(x&&x.teams)S=x}catch(e){}\nfunction save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}\nconst $=id=>document.getElementById(id);\n\nfunction drawBoard(){\n  let h=CATS.map(c=>`\u003cdiv class=\"cat\">\u003cdiv>\u003csmall>${c.c}\u003c/small>${c.t}\u003c/div>\u003c/div>`).join('');\n  VALS.forEach((v,r)=>CATS.forEach((c,k)=>{const id=k+'-'+r;const u=S.used.includes(id);h+=`\u003cbutton class=\"cell${u?' used':''}\" ${u?'disabled':''} onclick=\"openQ(${k},${r})\" aria-label=\"${c.t} for ${v}\">${u?'':v}\u003c/button>`}));\n  $('board').innerHTML=h;\n}\nfunction drawScores(){\n  $('scores').innerHTML=S.teams.map((t,i)=>`\u003cdiv class=\"team\">\u003cinput class=\"nm\" value=\"${t.n.replace(/\"/g,'&quot;')}\" aria-label=\"Team name\" onchange=\"S.teams[${i}].n=this.value;save()\">\u003cbutton onclick=\"add(${i},-100)\" aria-label=\"minus 100\">−\u003c/button>\u003cdiv class=\"sc${t.s\u003c0?' neg':''}\">${t.s}\u003c/div>\u003cbutton onclick=\"add(${i},100)\" aria-label=\"plus 100\">+\u003c/button>\u003c/div>`).join('');\n}\nfunction add(i,v){S.teams[i].s+=v;save();drawScores();if($('ov').classList.contains('on'))drawAward()}\n\nlet cur=null,wager=null;\nfunction openQ(k,r){\n  cur={k,r,id:k+'-'+r};const c=CATS[k];const isDD=DD.some(d=>d[0]===k&&d[1]===r);\n  wager=null;\n  $('qcard').classList.remove('reveal');\n  $('qcat').textContent=c.c+' · '+c.t;$('qval').textContent=VALS[r];\n  $('qtext').innerHTML=c.q[r][0];$('atext').innerHTML=c.q[r][1];\n  if(isDD){\n    $('qtext').style.display='none';$('ctrl').style.display='none';\n    $('ddbox').innerHTML=`\u003cdiv class=\"dd\">Daily Double\u003c/div>\u003cdiv class=\"wager\">\u003cselect id=\"ddteam\">${S.teams.map((t,i)=>`\u003coption value=\"${i}\">${t.n}\u003c/option>`).join('')}\u003c/select>\u003cspan>bets\u003c/span>\u003cinput id=\"ddbet\" type=\"number\" min=\"5\" step=\"50\" value=\"${VALS[r]}\">\u003cbutton class=\"btn\" onclick=\"setWager()\">Show the question\u003c/button>\u003c/div>\u003cp class=\"help\" style=\"text-align:center;margin-top:8px\">Bet up to the team's score, or up to 500 if the score is lower.\u003c/p>`;\n  }else{$('ddbox').innerHTML='';$('qtext').style.display='';$('ctrl').style.display=''}\n  stopTimer();$('timer').textContent='0:30';$('timer').classList.remove('done');\n  drawAward();$('ov').classList.add('on');\n}\nfunction setWager(){\n  const t=+$('ddteam').value;const max=Math.max(500,S.teams[t].s);let b=Math.round(+$('ddbet').value||0);b=Math.max(5,Math.min(max,b));\n  wager={t,b};$('ddbox').innerHTML=`\u003cdiv class=\"help\" style=\"text-align:center;color:var(--gold);font-weight:700;font-size:18px\">${S.teams[t].n} bets ${b}\u003c/div>`;\n  $('qval').textContent='Daily Double · '+b;$('qtext').style.display='';$('ctrl').style.display='';drawAward();startTimer(30);\n}\nfunction val(){return wager?wager.b:(cur&&cur.final?0:VALS[cur.r])}\nfunction drawAward(){\n  if(!cur)return;\n  $('award').style.gridTemplateColumns=cur.final?'repeat(auto-fit,minmax(300px,1fr))':'';$('ahelp').textContent=cur.final?'Type each team\\'s bet, then click Right or Wrong.':'Wrong answer? Take points away, then let another team steal.';\n  if(cur.final){$('award').innerHTML=S.teams.map((t,i)=>`\u003cdiv class=\"t\">\u003cspan>${t.n} · ${t.s}\u003c/span>\u003cinput type=\"number\" min=\"0\" step=\"50\" id=\"fw${i}\" placeholder=\"bet\" style=\"width:80px;padding:6px;border-radius:6px;border:0\">\u003cbutton class=\"btn ok\" onclick=\"fin(${i},1)\">Right\u003c/button>\u003cbutton class=\"btn no\" onclick=\"fin(${i},-1)\">Wrong\u003c/button>\u003c/div>`).join('');return}\n  const v=val();const teams=wager?[wager.t]:S.teams.map((_,i)=>i);\n  $('award').innerHTML=teams.map(i=>`\u003cdiv class=\"t\">\u003cspan>${S.teams[i].n} · ${S.teams[i].s}\u003c/span>\u003cbutton class=\"btn ok\" onclick=\"add(${i},${v})\">+${v}\u003c/button>\u003cbutton class=\"btn no\" onclick=\"add(${i},-${v})\">−${v}\u003c/button>\u003c/div>`).join('');\n}\nfunction fin(i,sign){const b=Math.max(0,Math.min(Math.max(S.teams[i].s,0),+$('fw'+i).value||0));add(i,sign*b);$('fw'+i)&&($('fw'+i).value='')}\nfunction reveal(){$('qcard').classList.add('reveal');stopTimer()}\nfunction closeQ(done){\n  if(done&&cur&&!cur.final&&!S.used.includes(cur.id)){S.used.push(cur.id);save()}\n  $('ov').classList.remove('on');stopTimer();cur=null;wager=null;drawBoard();drawScores();\n}\nfunction openFinal(){\n  cur={final:true};wager=null;$('qcard').classList.remove('reveal');$('ddbox').innerHTML='\u003cp class=\"help\" style=\"text-align:center;color:var(--gold);font-weight:700;font-size:18px\">Each team writes a secret bet (up to its score) before you show the question.\u003c/p>';\n  $('qcat').textContent=FINAL.cat;$('qval').textContent='Final';$('qtext').innerHTML=FINAL.q;$('atext').innerHTML=FINAL.a;$('qtext').style.display='';$('ctrl').style.display='';\n  stopTimer();$('timer').textContent='1:00';$('timer').classList.remove('done');drawAward();$('ov').classList.add('on');\n}\nlet run=null;\nfunction startTimer(sec){stopTimer();let left=sec;const T=$('timer');T.classList.remove('done');const f=()=>T.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');f();run=setInterval(()=>{left--;f();if(left\u003c=0){stopTimer();T.classList.add('done');T.textContent='Time!'}},1000)}\nfunction stopTimer(){clearInterval(run);run=null}\naddEventListener('keydown',e=>{if(!$('ov').classList.contains('on'))return;if(e.key==='Escape')closeQ(false);else if(e.key===' '&&e.target.tagName!=='INPUT'){e.preventDefault();reveal()}});\n\nfunction openSetup(){$('nteams').value=String(S.teams.length);drawNames();$('setup').style.display='flex'}\nfunction drawNames(){const n=+$('nteams').value;let h='';for(let i=0;i\u003cn;i++)h+=`\u003cinput id=\"tn${i}\" value=\"${(S.teams[i]?S.teams[i].n:'Team '+(i+1)).replace(/\"/g,'&quot;')}\" aria-label=\"Team ${i+1} name\">`;$('names').innerHTML=h}\nfunction saveSetup(){const n=+$('nteams').value;const t=[];for(let i=0;i\u003cn;i++)t.push({n:$('tn'+i).value||('Team '+(i+1)),s:S.teams[i]?S.teams[i].s:0});S.teams=t;save();$('setup').style.display='none';drawScores()}\nfunction resetGame(){if(!confirm('Start a new game? Scores and used squares will be cleared.'))return;S.used=[];S.teams.forEach(t=>t.s=0);save();drawBoard();drawScores()}\n\ndrawBoard();drawScores();\nif(!localStorage.getItem||(()=>{try{return !localStorage.getItem(SKEY)}catch(e){return true}})())openSetup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "handouts": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Midterm Review Handouts · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:#e9ecf1}\n.ctl{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:12px 16px}\n.ctl .in{max-width:8.5in;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.ctl h1{font-family:\"Libre Baskerville\",serif;font-size:18px;margin:0;flex-basis:100%}\n.ctl label{font-size:14px;display:flex;gap:5px;align-items:center}\n.btn{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}\n.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}\n.page{width:8.5in;min-height:11in;margin:18px auto;background:#fff;padding:.45in .5in;box-shadow:0 4px 16px rgba(0,0,0,.12);position:relative;font-size:12.5pt;line-height:1.38}\n.page.off{display:none}\n.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--gold);padding-bottom:5px;margin-bottom:12px}\n.ph b{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:15pt}\n.ph span{font-size:9.5pt;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}\n.pf{position:absolute;bottom:.25in;left:.5in;right:.5in;font-size:8pt;color:#7a8597;display:flex;justify-content:space-between}\n.cut{border:1.5px dashed #9aa8bb;border-radius:6px}\n.grid{display:grid;gap:8px}\n.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}\n.card{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:1.05in}\n.card.v{background:var(--navy);color:#fff;font-weight:700;font-size:16pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.card.x{font-size:14pt;font-weight:600;color:var(--navy)}\n.half{padding:12px 16px;margin-bottom:12px}\nh3{font-family:\"Libre Baskerville\",serif;color:var(--navy);margin:0 0 6px;font-size:13.5pt}\n.line{border-bottom:1px solid #aab4c3;height:24px}\n.lbl{font-weight:700;color:var(--navy);font-size:11pt;margin-top:6px}\n.small{font-size:10.5pt}\n.tiny{font-size:9.5pt;color:var(--muted)}\n.box{background:var(--sky3);border-left:4px solid var(--gold);padding:7px 11px;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.fw{border:1.5px solid var(--sky);border-top:5px solid var(--blue);border-radius:8px;padding:8px 12px;margin-bottom:9px;font-size:10.5pt;line-height:1.32}\n.fw p{margin:3px 0}\n.id{padding:10px 12px;min-height:2.2in;display:flex;flex-direction:column}\n.id .who{font-family:\"Libre Baskerville\",serif;font-weight:700;color:var(--navy);font-size:13pt;margin-bottom:6px}\n.id .q{margin-top:auto;font-size:10pt;color:var(--gold-d);font-weight:700}\n.tc{min-height:.95in;padding:8px 10px;display:flex;align-items:center;justify-content:center;text-align:center}\n.tc.n{font-family:\"Libre Baskerville\",serif;font-weight:700;color:var(--navy);font-size:15pt;background:var(--cream);-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.tc.i{font-size:11.5pt}\n.ev{padding:8px 11px;min-height:1.25in;font-size:11pt}\n.ev .s{font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}\nul{margin:4px 0;padding-left:20px}\n@media print{\n  @page{size:letter;margin:0}\n  body{background:#fff}\n  .ctl{display:none}\n  .page{margin:0;box-shadow:none;break-after:page;width:8.5in;height:11in;min-height:0;overflow:hidden}\n  .page.off{display:none}\n}\n@media (max-width:8.7in){.page{transform-origin:top left}}\n\n.sign{height:4.7in;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:14px;color:#fff;margin-bottom:.25in;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.sign b{font-family:\"Libre Baskerville\",serif;font-size:58pt;line-height:1.05}\n.sign span{font-size:16pt;margin-top:10px;opacity:.9}\n.case{padding:10px 12px;min-height:2.05in;font-size:11pt;line-height:1.35}\n.case h3{font-size:12.5pt}\n.case .mm{margin-top:6px;font-size:9.5pt;color:var(--gold-d);font-weight:700}\n.strip{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-weight:700;font-size:12pt;border-radius:6px;overflow:hidden;margin-top:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.strip div{padding:12px 4px}\n.mxp{display:grid;grid-template-columns:.35in 1fr 1fr;grid-template-rows:4.1in 4.1in .35in;gap:6px}\n.mxp .q{border:2px solid var(--navy);border-radius:8px;padding:8px 10px;font-size:11pt;color:var(--navy)}\n.mxp .q b{display:block;font-size:13pt}\n.mxp .k{background:#eef2f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.mxp .ax{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-d);letter-spacing:.1em}\n.mxp .ay{writing-mode:vertical-rl;transform:rotate(180deg)}\n.brief{padding:12px 16px;font-size:11pt;line-height:1.4;margin-bottom:10px}\n.evc{min-height:1.55in;padding:12px 14px;font-size:13pt;line-height:1.35;display:flex;flex-direction:column;justify-content:center}\n.evc .n{font-size:9pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d)}\n.role{padding:9px 12px;min-height:1.92in;font-size:10.3pt;line-height:1.32;margin-bottom:8px}\n.role h3{font-size:12.5pt;margin:0 0 2px}\n.role .cat{font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}\n.role .sec{background:#fbf1dc;border-left:3px solid var(--gold);padding:4px 8px;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.slip{padding:8px 12px;font-size:10.5pt}\n\n.slip{padding:10px 12px;font-size:10.5pt}\n.slip table{width:100%;border-collapse:collapse;margin-top:4px}\n.slip td,.slip th{border:1px solid #aab4c3;padding:4px;text-align:center;font-size:10pt}\n.judge{padding:12px 16px;margin-bottom:10px;font-size:11.5pt;line-height:1.4}\n.poster{height:4.8in;padding:16px 20px;margin-bottom:.15in;display:flex;flex-direction:column;border:2px solid var(--navy);border-top:10px solid var(--navy);border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.poster .loc{font-family:\"Libre Baskerville\",serif;font-size:22pt;color:var(--navy);font-weight:700}\n.poster .yr{font-size:11pt;color:var(--gold-d);font-weight:700;letter-spacing:.1em;text-transform:uppercase}\n.poster p{font-size:13pt;line-height:1.4;margin:8px 0}\n.poster .qs{margin-top:auto;background:var(--sky3);border-radius:6px;padding:8px 12px;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.poster .src{font-size:9pt;color:var(--muted)}\n.flagstrip{padding:10px 14px;font-size:10.5pt;margin-bottom:8px}\n.flagstrip ol{margin:4px 0;padding-left:20px}\n.pile{height:1.4in;display:flex;align-items:center;justify-content:center;font-family:\"Libre Baskerville\",serif;font-size:20pt;font-weight:700;color:#fff;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.cc{min-height:1.95in;padding:10px 12px;font-size:11pt;line-height:1.35;display:flex;flex-direction:column}\n.cc .n{font-size:9pt;font-weight:700;color:var(--gold-d);letter-spacing:.08em;text-transform:uppercase}\n.cc .tb{margin-top:auto;font-size:8.5pt;color:var(--muted)}\n.tool{padding:8px 12px;font-size:10.5pt}\n.ev{min-height:1.15in;padding:8px 11px;font-size:10.5pt}\n.ev .s{font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}\n\n.ig{padding:10px 16px;font-size:11pt;line-height:1.38;margin-bottom:9px}\n.ig .who{font-family:\"Libre Baskerville\",serif;font-size:15pt;color:var(--navy);font-weight:700}\n.prof{padding:10px 14px;font-size:10.5pt;margin-bottom:10px}\n.prof .row{display:grid;grid-template-columns:2.1in 1fr;gap:6px;align-items:end;margin:5px 0}\n.prof .row span{font-weight:700;color:var(--navy);font-size:10pt}\n.dl{padding:12px 16px;font-size:11.5pt;line-height:1.4;margin-bottom:10px}\n.tn{min-height:1.5in;padding:10px 12px;font-size:11.5pt;line-height:1.35;display:flex;flex-direction:column;justify-content:center}\n.pile2{height:1.1in;display:flex;align-items:center;justify-content:center;text-align:center;font-family:\"Libre Baskerville\",serif;font-size:15pt;font-weight:700;color:#fff;border-radius:8px;padding:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.dec{padding:12px 16px;font-size:11.5pt;margin-bottom:10px}\n.dec h3{margin-bottom:4px}\n.mp{padding:12px 16px;font-size:11pt;line-height:1.45;margin-bottom:10px}\n.pr{padding:10px 14px;font-size:10.5pt}\n.pr li{margin:4px 0}\n\n.tb{height:1.35in;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;text-align:center}\n.tb .t{font-family:\"Libre Baskerville\",serif;font-size:14.5pt;font-weight:700;color:var(--navy);line-height:1.15}\n.tb .f{margin-top:6px;font-size:10pt;color:#a33a2a;font-weight:700;letter-spacing:.02em}\n.tb .f span{color:#555;font-weight:400}\n.let{height:2.3in;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);color:#fff;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.let b{font-family:\"Libre Baskerville\",serif;font-size:66pt;color:var(--gold);line-height:1}\n.let span{font-size:13pt;margin-top:4px}\n.vote{height:1.2in;display:flex;align-items:center;justify-content:center;font-family:\"Libre Baskerville\",serif;font-size:19pt;font-weight:700;color:#fff;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.qr{padding:12px 16px;font-size:11pt;line-height:1.4}\n.qr ol{margin:4px 0;padding-left:20px}\n.qr li{margin:3px 0}\n.role{padding:10px 14px;font-size:11pt;min-height:1.9in}\n.role h3{margin:0 0 4px}\n.mp{padding:10px 14px;font-size:11pt;line-height:1.45;margin-bottom:8px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"ctl\">\u003cdiv class=\"in\">\n  \u003ch1>Midterm Review Handouts · untick pages you don't need, then print (Letter, 100%)\u003c/h1>\n  \u003cdiv id=\"toggles\" style=\"display:contents\">\u003c/div>\n  \u003cbutton class=\"btn\" onclick=\"print()\">Print\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"1 Explain it! cards\">\n  \u003cdiv class=\"ph\">\u003cb>Explain it! · vocabulary cards\u003c/b>\u003cspan>1 set per group of 3 · cut\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid\" style=\"grid-template-columns:repeat(4,1fr)\" id=\"tb1\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Terms from OpenStax Business Ethics, Chapters 1–6 (CC BY-NC-SA 4.0)\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"2 Framework letter cards\">\n  \u003cdiv class=\"ph\">\u003cb>Framework voices · letter cards\u003c/b>\u003cspan>1 set per team · cut\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid g3\" id=\"lets\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Ethics in a Global World · Week 6 review\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"3 Legal? Fair? vote cards\">\n  \u003cdiv class=\"ph\">\u003cb>Legal? Fair? · vote cards\u003c/b>\u003cspan>1 set per pair · cut\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid g3\" id=\"votes\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Ethics in a Global World · Week 6 review\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"4 QuickRoute case + role cards\">\n  \u003cdiv class=\"ph\">\u003cb>Case clinic · QuickRoute\u003c/b>\u003cspan>1 per group of 4 · cut the role cards\u003c/span>\u003c/div>\n  \u003cdiv class=\"cut qr\">\u003cb style=\"font-size:13pt;color:var(--navy)\">QuickRoute\u003c/b> \u003ci>(a fictional company)\u003c/i> is a food-delivery app in six countries. It employs 40,000 delivery drivers. It has never made a profit, and its investors want a profit \u003cb>this year\u003c/b>. The CEO announces four changes:\n  \u003col>\n  \u003cli>\u003cb>SmartTrack:\u003c/b> the app records every driver's location, speed and break times, and keeps recording for 30 minutes after a driver logs off \"for safety.\" Drivers' contracts allow monitoring.\u003c/li>\n  \u003cli>\u003cb>New pay:\u003c/b> drivers move from $18 an hour to $4 per delivery. Average pay falls about 12%, but the fastest drivers earn more.\u003c/li>\n  \u003cli>\u003cb>Tipping:\u003c/b> in Country Y, where tipping is unusual, the app now asks every customer for a 15% tip. Many customers say it feels pushy.\u003c/li>\n  \u003cli>\u003cb>Organizing:\u003c/b> in two cities, drivers are organizing to negotiate as a group. One manager suggests removing the \"troublemakers\" from the app.\u003c/li>\n  \u003c/ol>\n  City councils are discussing new rules for delivery apps.\u003c/div>\n  \u003cdiv class=\"grid g2\" style=\"margin-top:10px\" id=\"roles\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Teacher-made case for review · QuickRoute is fictional\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\" data-name=\"5 Paragraph doctor\">\n  \u003cdiv class=\"ph\">\u003cb>Paragraph doctor\u003c/b>\u003cspan>1 per pair\u003c/span>\u003c/div>\n  \u003cp class=\"small\" style=\"margin:0 0 8px\">\u003cb>Question:\u003c/b> Should QuickRoute keep tracking drivers after they log off? Tick the parts each paragraph \u003cb>really\u003c/b> has.\u003c/p>\n  \u003cdiv class=\"cut mp\" style=\"border-left:6px solid #a33a2a\">\u003cb>Paragraph A.\u003c/b> QuickRoute should stop tracking drivers after they log off. Drivers are not working at that time, so their time belongs to them. The case says the app keeps recording for 30 minutes after a driver logs off. Kant's ethics is about duty and the categorical imperative. Therefore, QuickRoute should change the app.\n  \u003cdiv class=\"lbl\" style=\"margin-top:6px\">☐ Position ☐ Reason ☐ Evidence ☐ Framework applied ☐ Counterargument ☐ Conclusion\u003c/div>\u003c/div>\n  \u003cdiv class=\"cut mp\" style=\"border-left:6px solid #a33a2a\">\u003cb>Paragraph B.\u003c/b> Tracking can be good and bad. Some people think safety is important, but other people think privacy is important. From a utilitarian perspective, we should think about the most good for the most people. Some people may say the company needs data. However, drivers also have rights. In conclusion, it depends.\n  \u003cdiv class=\"lbl\" style=\"margin-top:6px\">☐ Position ☐ Reason ☐ Evidence ☐ Framework applied ☐ Counterargument ☐ Conclusion\u003c/div>\u003c/div>\n  \u003cdiv class=\"lbl\">Rewrite one missing or weak part:\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n  \u003cdiv class=\"lbl\" style=\"margin-top:10px\">Apply, don't define. Rewrite each sentence so it is applied to QuickRoute:\u003c/div>\n  \u003cdiv class=\"small\">1. \"Rawls says we should choose rules behind a veil of ignorance.\"\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n  \u003cdiv class=\"small\">2. \"Utilitarianism means the greatest good for the greatest number.\"\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n  \u003cdiv class=\"small\">3. \"Aristotle says a good person has virtues like justice and courage.\"\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n  \u003cdiv class=\"pf\">\u003cspan>Ethics in a Global World · Week 6 review\u003c/span>\u003cspan>Approach International Student Center\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.getElementById(s);\nconst TB=[[\"integrity\",\"honest\",\"say\"],[\"stakeholder\",\"affected\",\"company\"],[\"goodwill\",\"reputation\",\"value\"],[\"CSR\",\"social\",\"responsibility\"],[\"utilitarianism\",\"greatest\",\"happiness\"],[\"categorical imperative\",\"Kant\",\"rule\"],[\"veil of ignorance\",\"Rawls\",\"fair\"],[\"golden mean\",\"Aristotle\",\"middle\"],[\"junzi\",\"Confucius\",\"person\"],[\"ethical minimum\",\"law\",\"least\"],[\"ethical maximum\",\"best\",\"most\"],[\"greenwashing\",\"green\",\"lie\"],[\"externality\",\"cost\",\"outside\"],[\"tragedy of the commons\",\"shared\",\"overuse\"],[\"triple bottom line\",\"people\",\"planet\"],[\"carbon tax\",\"pay\",\"pollution\"],[\"enculturation\",\"learn\",\"own\"],[\"acculturation\",\"two\",\"cultures\"],[\"localization\",\"local\",\"adapt\"],[\"ethical relativism\",\"culture\",\"depends\"],[\"pay ratio\",\"CEO\",\"worker\"],[\"collective bargaining\",\"union\",\"negotiate\"],[\"employment at will\",\"fire\",\"reason\"],[\"exigency\",\"urgent\",\"now\"]];\nconst card=t=>`\u003cdiv class=\"cut tb\">\u003cdiv class=\"t\">${t[0]}\u003c/div>\u003cdiv class=\"f\">Don't say: ${t[1]} \u003cspan>·\u003c/span> ${t[2]}\u003c/div>\u003c/div>`;\n$('tb1').innerHTML=TB.map(card).join('');\n$('lets').innerHTML=[[\"U\",\"Utilitarian\"],[\"K\",\"Kant\"],[\"R\",\"Rawls\"],[\"A\",\"Aristotle\"],[\"C\",\"Confucius\"],[\"S\",\"Stakeholder analysis\"]].map(l=>`\u003cdiv class=\"cut let\">\u003cb>${l[0]}\u003c/b>\u003cspan>${l[1]}\u003c/span>\u003c/div>`).join('');\nconst V=[[\"Legal\",\"#2f6b2f\"],[\"Not legal\",\"#a33a2a\"],[\"It depends\",\"#8c7535\"],[\"Fair\",\"#1c4f8f\"],[\"Not fair\",\"#5a2a22\"],[\"Debatable\",\"#4a5f7a\"]];\n$('votes').innerHTML=V.concat(V).map(v=>`\u003cdiv class=\"cut vote\" style=\"background:${v[1]}\">${v[0]}\u003c/div>`).join('');\nconst R=[[\"Role 1 · Stakeholder mapper\",\"Name five stakeholders. Give each one a type: enabling (owners, government), functional (employees, suppliers, customers), normative (competitors, industry groups) or diffused (media, community, environment). Who has high power and high interest?\"],[\"Role 2 · Minimum and maximum\",\"What is the ethical minimum for QuickRoute? What is the ethical maximum? What happens in the short term, and in the long term?\"],[\"Role 3 · Culture and workplace checker\",\"Is the 15% tipping prompt a question of etiquette or ethics? Which changes raise Chapter 6 issues: privacy, fair pay, the right to organize?\"],[\"Role 4 · Framework judge\",\"Choose one of the four changes. Apply two frameworks to it. What does each one conclude? Do they agree?\"]];\n$('roles').innerHTML=R.map(r=>`\u003cdiv class=\"cut role\">\u003ch3>${r[0]}\u003c/h3>${r[1]}\u003c/div>`).join('');\nconst pages=[...document.querySelectorAll('.page')];\n$('toggles').innerHTML=pages.map((p,k)=>`\u003clabel>\u003cinput type=\"checkbox\" checked data-p=\"${k}\"> ${p.dataset.name}\u003c/label>`).join('');\ndocument.querySelectorAll('[data-p]').forEach(c=>c.addEventListener('change',()=>pages[c.dataset.p].classList.toggle('off',!c.checked)));\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "worksheet": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Midterm Review Worksheet · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568;--bg:#f6f4ee;--ok:#2f6b2f;--no:#a33a2a}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55}\nheader.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}\n.top .in{max-width:860px;margin:0 auto;padding:20px 16px 24px;display:flex;gap:14px;align-items:center}\n.top img{width:60px;height:60px;border-radius:8px;flex:none}\n.top .w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.12em;font-size:16px;line-height:1.1;flex:none}\n.top .w small{display:block;letter-spacing:.02em;font-size:10px;color:#e6d8a8}\n.top h1{font-family:\"Libre Baskerville\",serif;margin:0;font-size:clamp(20px,4.5vw,28px);line-height:1.2}\n.top p{margin:3px 0 0;color:var(--sky);font-size:14.5px}\n.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--sky);box-shadow:0 2px 8px rgba(20,56,101,.06)}\n.bar .in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.bar input{flex:1;min-width:160px}\n.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 13px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}\n.btn.gold{background:var(--gold);color:var(--navy)}\n.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--sky)}\n.btn.sm{padding:6px 11px;font-size:14px}\n#saved{font-size:13px;color:var(--muted);min-width:70px}\nmain{max-width:860px;margin:0 auto;padding:10px 16px 60px}\n.part{font-family:\"Libre Baskerville\",serif;color:var(--gold-d);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:34px 0 0;border-top:2px solid var(--gold);padding-top:12px}\nsection.card{background:#fff;border:1px solid var(--sky);border-radius:12px;padding:16px 18px 18px;margin:16px 0}\nsection.card h2{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:21px;margin:0 0 4px}\n.sub{color:var(--muted);font-size:14.5px;margin:0 0 10px}\nlabel{display:block;font-weight:600;margin:12px 0 4px;color:var(--navy)}\ninput[type=text],textarea,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--sky);border-radius:7px;padding:8px 10px;background:#fbfcfe;color:var(--ink)}\ntextarea{min-height:64px;resize:vertical}\ntextarea.big{min-height:180px}\ninput:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}\n.opts label{display:flex;gap:6px;align-items:center;font-weight:400;margin:0;color:var(--ink)}\ndetails{border:1px solid var(--sky);border-radius:9px;margin:10px 0;background:var(--sky3)}\ndetails>summary{cursor:pointer;padding:9px 12px;font-weight:700;color:var(--navy);list-style:none}\ndetails>summary::before{content:\"▸ \";color:var(--gold-d)}\ndetails[open]>summary::before{content:\"▾ \"}\ndetails>div{padding:2px 14px 12px;background:#fff;border-radius:0 0 9px 9px}\n.box{background:var(--cream);border-left:4px solid var(--gold-d);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:16px}\n.tip{background:var(--sky3);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:15px}\ntable{width:100%;border-collapse:collapse;font-size:15.5px;margin:8px 0}\nth,td{border:1px solid var(--sky);padding:6px 8px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.gm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}\n.gm .v{font-weight:700;color:var(--navy);text-align:center;background:var(--cream);border-radius:6px;padding:6px 10px;min-width:110px}\n.fb{font-size:14.5px;margin-top:6px;font-weight:600}\n.ok{color:var(--ok)}.no{color:var(--no)}\nselect.ok{border-color:var(--ok);background:#eef6ec}select.no{border-color:var(--no);background:#fbefec}\n.hidden{display:none}\n.key{background:#eef6ec;border:1px solid #b9d3b1;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:15px}\n.grid3{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:6px;align-items:start}\n.grid3 .h{font-weight:700;color:var(--navy);font-size:14.5px;background:var(--sky2);border-radius:5px;padding:5px 7px}\n.grid3 textarea{min-height:58px;font-size:15px}\n.grid2{display:grid;grid-template-columns:140px 1fr 1fr;gap:6px;align-items:start}\n.grid2 .h{font-weight:700;color:var(--navy);font-size:14.5px;background:var(--sky2);border-radius:5px;padding:5px 7px}\n.grid2 textarea{min-height:58px;font-size:15px}\n.tl{display:grid;grid-template-columns:150px 90px 1fr;gap:6px;align-items:center;margin:6px 0}\n.tl b{color:var(--navy)}\n.wc{font-size:14px;color:var(--muted);margin-top:4px}\n.slider{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;margin:6px 0}\n.slider input{width:100%}\nul.lb li{margin:3px 0}\nfooter{max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:#6b7280}\n@media (max-width:640px){\n  .row2{grid-template-columns:1fr}\n  .gm{grid-template-columns:1fr}.gm .v{order:-1}\n  .grid3,.grid2{grid-template-columns:1fr}\n  .grid3 .h.c,.grid2 .h.c,.hdr{display:none}\n  .grid3 textarea::placeholder,.grid2 textarea::placeholder{color:#7a8597}\n  .tl{grid-template-columns:1fr 80px}.tl select.idea{grid-column:1/-1}\n  .slider{grid-template-columns:90px 1fr 30px}\n}\n@media print{\n  body{background:#fff;font-size:11.5pt}\n  .bar,.noprint,button{display:none!important}\n  section.card{break-inside:avoid;border-color:#bbb}\n  details>div{display:block!important}\n  details{background:#fff}\n  textarea{border:1px solid #bbb;overflow:hidden}\n  header.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n}\n\n.pick{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:center;margin:6px 0;padding:4px 0;border-bottom:1px dashed var(--sky2)}\n.thermo{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--navy);background:linear-gradient(90deg,#cfe0f3,#fbf1dc,#f6c9a4);border-radius:6px;padding:6px 10px;margin:6px 0}\n.case{border:1px solid var(--sky);border-radius:9px;padding:10px 12px;margin:10px 0;background:#fff}\n.case h3{margin:0 0 4px;font-size:16.5px;color:var(--navy)}\n.case p{margin:0 0 6px;font-size:15.5px}\n.case .row2 select{font-size:15px}\n.map{width:100%;border-collapse:collapse;font-size:14.5px}\n.map td,.map th{padding:4px}\n.map input[type=text]{font-size:15px;padding:6px}\n.map select{font-size:14.5px;padding:6px 4px}\n.mx{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13.5px;text-align:center;margin:8px 0}\n.mx div{background:var(--sky3);border-radius:6px;padding:8px}\n.mx .k{background:var(--navy);color:#fff}\ndetails.book{border-color:var(--gold-d);background:var(--cream)}\ndetails.book>summary::before{content:\"\\25B8  Book · \"}\ndetails.book[open]>summary::before{content:\"\\25BE  Book · \"}\n.pg{display:inline-block;background:var(--navy);color:#fff;border-radius:4px;padding:0 6px;font-size:13px;font-weight:700;margin-left:4px}\n@media (max-width:640px){.pick{grid-template-columns:1fr}.map thead{display:none}.map tr{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-bottom:2px solid var(--sky);padding:6px 0}.map td{border:0}.map td:first-child{grid-column:1/-1}}\n\n.flags li{margin:4px 0}\n.score{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:center;font-size:15px}\n.score input{text-align:center}\n.score b{color:var(--navy)}\n.slider{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:6px 0}\n@media (max-width:640px){.score{grid-template-columns:repeat(3,1fr)}.slider{grid-template-columns:1fr 1fr 30px}}\n\n.chk label{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);margin:4px 0}\n.ptable{width:100%;border-collapse:collapse;font-size:14.5px}\n.ptable td,.ptable th{padding:4px;border:1px solid var(--sky)}\n.ptable textarea{min-height:44px;font-size:14.5px}\n@media (max-width:640px){.ptable thead{display:none}.ptable tr{display:grid;grid-template-columns:1fr;border-bottom:2px solid var(--sky)}.ptable td{border:0}}\n\n.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.roles .case{margin:0}\n.conf{display:grid;grid-template-columns:1fr 200px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--sky2)}\n.para{background:#fbfcfe;border:1px solid var(--sky);border-left:5px solid var(--gold-d);border-radius:7px;padding:10px 12px;font-size:15.5px;margin:6px 0}\n.chk label{display:flex;gap:6px;align-items:center;font-weight:400;margin:3px 0;color:var(--ink)}\n@media (max-width:640px){table{font-size:14px}th,td{padding:5px 6px}.roles{grid-template-columns:1fr}.conf{grid-template-columns:1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"in\">\n  \u003cimg src=\"__LOGO__\" alt=\"Approach International Student Center\" onload=\"this.nextElementSibling.remove()\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\n  \u003cdiv>\u003ch1>Midterm Review Worksheet\u003c/h1>\u003cp>Ethics in a Global World · Week 6 · Class 1 (9:00–10:40) · Chapters 1–6\u003c/p>\u003c/div>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"in\">\n  \u003cinput type=\"text\" id=\"sname\" data-k=\"name\" placeholder=\"Your name\" aria-label=\"Your name\">\n  \u003cspan id=\"saved\">Saved\u003c/span>\n  \u003cbutton class=\"btn gold\" onclick=\"downloadAnswers()\">Download\u003c/button>\n  \u003cbutton class=\"btn\" onclick=\"window.print()\">Print / PDF\u003c/button>\n  \u003cbutton class=\"btn ghost sm\" onclick=\"clearAll()\">Clear\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cmain>\n\u003cp class=\"tip\">Your answers save automatically \u003cb>on this device\u003c/b>. Tap \u003cb>Download\u003c/b> to keep a copy. \u003cb>The midterm is after the break (11:10).\u003c/b>\u003c/p>\n\n\u003csection class=\"card\">\n\u003ch2>Chapters 1–6 at a glance\u003c/h2>\n\u003cp class=\"sub\">\u003ci>Business Ethics\u003c/i> (OpenStax). Use this map to decide what to look at again during the break.\u003c/p>\n\u003ctable>\n\u003ctr>\u003cth>Chapter\u003c/th>\u003cth>Big idea\u003c/th>\u003cth>Key words\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/1-introduction\" target=\"_blank\" rel=\"noopener\">1 · Why Ethics Matter\u003c/a>\u003c/td>\u003ctd>Ethics is more than obeying the law; it pays in the long term.\u003c/td>\u003ctd>integrity, goodwill, compliance, CSR, short-term vs. long-term, ethical relativism\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/2-introduction\" target=\"_blank\" rel=\"noopener\">2 · Ethics from Antiquity to the Present\u003c/a>\u003c/td>\u003ctd>Five thinkers, five questions to ask about any decision.\u003c/td>\u003ctd>Aristotle (golden mean), Confucius (junzi), Bentham and Mill (utilitarianism), Kant (categorical imperative), Rawls (veil of ignorance)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/3-introduction\" target=\"_blank\" rel=\"noopener\">3 · Stakeholders\u003c/a> (pp. 67–92)\u003c/td>\u003ctd>Who is affected, and who matters most right now?\u003c/td>\u003ctd>stakeholder, enabling / functional / normative / diffused, power–interest, exigency, ethical minimum / maximum\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/4-introduction\" target=\"_blank\" rel=\"noopener\">4 · Society, the Environment, Government\u003c/a> (pp. 93–130)\u003c/td>\u003ctd>Business affects people outside the deal; government sets limits.\u003c/td>\u003ctd>externality, tragedy of the commons, sustainability, triple bottom line, greenwashing, carbon tax, cap and trade\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/5-introduction\" target=\"_blank\" rel=\"noopener\">5 · Culture and Time\u003c/a> (pp. 131–158)\u003c/td>\u003ctd>Manners change by place and time; some values don't.\u003c/td>\u003ctd>enculturation, acculturation, localization, etiquette vs. ethics, absolute / relative / universal values\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/6-introduction\" target=\"_blank\" rel=\"noopener\">6 · What Employers Owe Employees\u003c/a> (from p. 159)\u003c/td>\u003ctd>A safe workplace, fair pay, a voice and privacy.\u003c/td>\u003ctd>OSHA, fair wage, pay ratio, union, collective bargaining, employment at will, monitoring\u003c/td>\u003c/tr>\n\u003c/table>\n\u003c/section>\n\n\u003c!-- 1 -->\n\u003csection class=\"card\">\n\u003ch2>1 · Framework voices\u003c/h2>\n\u003cp class=\"sub\">Six managers are speaking. Which framework is each one using? Choose, then write the words that told you.\u003c/p>\n\u003cdiv id=\"voices\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"checkVoices()\">Check my answers\u003c/button>\n\u003cdiv id=\"voiceFb\" class=\"fb\">\u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection class=\"card\">\n\u003ch2>2 · Explain it! (vocabulary game)\u003c/h2>\n\u003cp class=\"sub\">In your group, explain the word on your card \u003cb>without\u003c/b> saying the word or the two forbidden words. Afterwards, write down the three words that were hardest for your group, and explain each one in your own words with a short example.\u003c/p>\n\u003cdiv id=\"hard\">\u003c/div>\n\u003cp class=\"sub\" style=\"margin-top:14px\">\u003cb>Odd one out.\u003c/b> In each group of four, which one doesn't belong? Choose it, then say why.\u003c/p>\n\u003cdiv id=\"odd\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"checkOdd()\">Check my answers\u003c/button>\n\u003cdiv id=\"oddFb\" class=\"fb\">\u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection class=\"card\">\n\u003ch2>3 · Chapter 6 in 15 minutes: legal? fair?\u003c/h2>\n\u003cp class=\"sub\">For each workplace situation in the United States, decide: Is it \u003cb>legal\u003c/b>? Is it \u003cb>fair\u003c/b>? Then write the Chapter 6 term that fits.\u003c/p>\n\u003cdetails class=\"book\">\u003csummary>Chapter 6 \u003cspan class=\"pg\">from p. 159\u003c/span>\u003c/summary>\u003cdiv>\n\u003cp>\u003cb>Read:\u003c/b> \u003ca href=\"https://openstax.org/books/business-ethics/pages/6-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 6\u003c/a>: 6.1 The Workplace Environment and Working Conditions · 6.2 What Constitutes a Fair Wage? · 6.3 An Organized Workforce · 6.4 Privacy in the Workplace.\u003c/p>\n\u003cp>\u003cb>Glossary:\u003c/b> \u003ci>OSHA\u003c/i> — the U.S. law and agency for workplace safety · \u003ci>pay ratio\u003c/i> — how many times more the top executive earns than the average worker · \u003ci>union\u003c/i> — an organization of workers · \u003ci>collective bargaining\u003c/i> — a union and an employer negotiating together · \u003ci>employment at will\u003c/i> — either side can end the job at any time, without a reason, unless a contract says otherwise · \u003ci>monitoring\u003c/i> — watching or recording employees' work\u003c/p>\n\u003c/div>\u003c/details>\n\u003cdiv id=\"lf\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"toggle('lfKey')\">Show suggested answers\u003c/button>\n\u003cdiv id=\"lfKey\" class=\"key hidden\">\u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection class=\"card\">\n\u003ch2>4 · Case clinic: QuickRoute\u003c/h2>\n\u003cdiv class=\"case\">\n\u003cp>\u003cb>QuickRoute\u003c/b> \u003ci>(a fictional company)\u003c/i> is a food-delivery app in six countries. It employs 40,000 delivery drivers. It has never made a profit, and its investors want a profit \u003cb>this year\u003c/b>. The CEO announces four changes:\u003c/p>\n\u003col style=\"margin:4px 0 6px;padding-left:22px;font-size:15.5px\">\n\u003cli>\u003cb>SmartTrack:\u003c/b> the app records every driver's location, speed and break times, and keeps recording for 30 minutes after a driver logs off \"for safety.\" Drivers' contracts allow monitoring.\u003c/li>\n\u003cli>\u003cb>New pay:\u003c/b> drivers move from $18 an hour to $4 per delivery. Average pay falls about 12%, but the fastest drivers earn more.\u003c/li>\n\u003cli>\u003cb>Tipping:\u003c/b> in Country Y, where tipping is unusual, the app now asks every customer for a 15% tip. Many customers say it feels pushy.\u003c/li>\n\u003cli>\u003cb>Organizing:\u003c/b> in two cities, drivers are organizing to negotiate as a group. One manager suggests removing the \"troublemakers\" from the app.\u003c/li>\n\u003c/ol>\n\u003cp style=\"margin:0\">City councils are discussing new rules for delivery apps.\u003c/p>\n\u003c/div>\n\u003cp class=\"sub\">Your group has four \u003cb>tools\u003c/b>. Each person takes one role. Fill in \u003cb>your\u003c/b> role; add your group's ideas to the others if you have time.\u003c/p>\n\u003cdiv class=\"roles\">\n\u003cdiv class=\"case\">\u003ch3>Role 1 · Stakeholder mapper\u003c/h3>\u003cp>Name five stakeholders. Give each one a type (enabling, functional, normative, diffused) and say who has \u003cb>high power and high interest\u003c/b>.\u003c/p>\u003ctextarea data-k=\"r1\" aria-label=\"Role 1 · Stakeholder mapper\" style=\"min-height:110px\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"case\">\u003ch3>Role 2 · Minimum and maximum\u003c/h3>\u003cp>What is the ethical minimum? The ethical maximum? What happens in the \u003cb>short term\u003c/b> and the \u003cb>long term\u003c/b>?\u003c/p>\u003ctextarea data-k=\"r2\" aria-label=\"Role 2 · Minimum and maximum\" style=\"min-height:110px\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"case\">\u003ch3>Role 3 · Culture and workplace checker\u003c/h3>\u003cp>Is the tipping prompt etiquette or ethics? Which changes raise Chapter 6 issues (privacy, fair pay, the right to organize)?\u003c/p>\u003ctextarea data-k=\"r3\" aria-label=\"Role 3 · Culture and workplace checker\" style=\"min-height:110px\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"case\">\u003ch3>Role 4 · Framework judge\u003c/h3>\u003cp>Apply \u003cb>two\u003c/b> frameworks to \u003cb>one\u003c/b> of the four changes. What does each conclude? Do they agree?\u003c/p>\u003ctextarea data-k=\"r4\" aria-label=\"Role 4 · Framework judge\" style=\"min-height:110px\">\u003c/textarea>\u003c/div>\n\u003c/div>\n\u003clabel>Our group's verdict (2 sentences): Which change should QuickRoute drop or fix first, and why?\u003c/label>\n\u003ctextarea data-k=\"verdict\">\u003c/textarea>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection class=\"card\">\n\u003ch2>5 · Paragraph doctor\u003c/h2>\n\u003cp class=\"sub\">Two students answered: \u003cb>\"Should QuickRoute keep tracking drivers after they log off?\"\u003c/b> Tick the parts each paragraph \u003cb>really\u003c/b> has. Then fix it.\u003c/p>\n\u003cdiv class=\"para\">\u003cb>Paragraph A.\u003c/b> QuickRoute should stop tracking drivers after they log off. Drivers are not working at that time, so their time belongs to them. The case says the app keeps recording for 30 minutes after a driver logs off. Kant's ethics is about duty and the categorical imperative. Therefore, QuickRoute should change the app.\u003c/div>\n\u003cdiv class=\"chk\" id=\"chkA\">\u003c/div>\n\u003cdiv class=\"para\">\u003cb>Paragraph B.\u003c/b> Tracking can be good and bad. Some people think safety is important, but other people think privacy is important. From a utilitarian perspective, we should think about the most good for the most people. Some people may say the company needs data. However, drivers also have rights. In conclusion, it depends.\u003c/div>\n\u003cdiv class=\"chk\" id=\"chkB\">\u003c/div>\n\u003clabel>Choose one paragraph. Rewrite \u003cb>one\u003c/b> missing or weak part so the paragraph is stronger.\u003c/label>\n\u003ctextarea data-k=\"fix\" style=\"min-height:90px\">\u003c/textarea>\n\u003cp class=\"sub\" style=\"margin-top:14px\">\u003cb>Apply, don't define.\u003c/b> Each sentence only \u003cb>defines\u003c/b> a framework. Rewrite it so it is \u003cb>applied\u003c/b> to QuickRoute.\u003c/p>\n\u003cdiv id=\"apply\">\u003c/div>\n\u003cbutton class=\"btn sm\" onclick=\"toggle('docKey')\">Show suggested answers\u003c/button>\n\u003cdiv id=\"docKey\" class=\"key hidden\">\n\u003cp>\u003cb>Paragraph A\u003c/b> has: position, reason, evidence, conclusion. \u003cb>Missing:\u003c/b> the framework is only defined, not applied; there is no counterargument. \u003ci>Fix:\u003c/i> \"From a Kantian perspective, recording drivers in their free time treats them only as tools for the company's data. Some people may say tracking keeps drivers safe; however, drivers can choose to share their location if they want help.\"\u003c/p>\n\u003cp>\u003cb>Paragraph B\u003c/b> has: a counterargument (weak). \u003cb>Missing:\u003c/b> a clear position, evidence from the case, a framework applied, a real conclusion. \"It depends\" is not a conclusion. \u003ci>Fix:\u003c/i> start with \"QuickRoute should stop tracking drivers after they log off\" and end with \"Therefore, QuickRoute should only track drivers during their shifts.\"\u003c/p>\n\u003cp>\u003cb>Apply, don't define (examples):\u003c/b> (1) \"Behind the veil of ignorance, a manager wouldn't know whether she would be a fast driver or a slow one, so she would not accept a pay system that cuts average pay by 12%.\" (2) \"A utilitarian would count 40,000 drivers who lose pay against the investors who gain profit, and would likely say the new pay system creates more harm than good.\" (3) \"A person with Aristotle's virtues would not remove drivers for organizing; that would be unjust, and a good leader listens even to criticism.\"\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection class=\"card\">\n\u003ch2>6 · My midterm game plan\u003c/h2>\n\u003ctable>\n\u003ctr>\u003cth>Part\u003c/th>\u003cth>Pts\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Time\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A · Vocabulary\u003c/td>\u003ctd>12\u003c/td>\u003ctd>Match words and meanings; complete sentences from a box\u003c/td>\u003ctd>10 min\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B · Short answer\u003c/td>\u003ctd>15\u003c/td>\u003ctd>Five questions, 2–3 sentences each: explain + give an example\u003c/td>\u003ctd>20 min\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C · Case analysis\u003c/td>\u003ctd>23\u003c/td>\u003ctd>Read a new case; stakeholders, minimum/maximum, culture, frameworks, and one paragraph (120–150 words)\u003c/td>\u003ctd>50 min\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp class=\"sub\">How confident do you feel? Be honest. Use the break to look again at your lowest one or two.\u003c/p>\n\u003cdiv id=\"conf\">\u003c/div>\n\u003clabel>The two things I will review in the break:\u003c/label>\n\u003ctextarea data-k=\"plan\" style=\"min-height:52px\">\u003c/textarea>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>Language bank\u003c/h2>\n\u003cul class=\"lb\">\n\u003cli>\u003cb>Explaining:\u003c/b> \"In other words, …\" · \"It means that …\" · \"For example, …\" · \"This is different from ___ because …\"\u003c/li>\n\u003cli>\u003cb>Applying a framework:\u003c/b> \"From a ___ perspective, this decision …\" · \"A utilitarian would count …\" · \"Kant would ask whether …\" · \"Behind the veil of ignorance, …\"\u003c/li>\n\u003cli>\u003cb>The other side:\u003c/b> \"Some people may argue that … However, …\" · \"That is a fair point, but …\"\u003c/li>\n\u003cli>\u003cb>Concluding:\u003c/b> \"Therefore, …\" · \"For these reasons, QuickRoute should …\"\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003c/main>\n\u003cfooter>Textbook content from Byars &amp; Stanberry, \u003cem>Business Ethics\u003c/em>, OpenStax (CC BY-NC-SA 4.0), Chapters 1–6. QuickRoute is a fictional case written for this review.\u003c/footer>\n\n\u003cscript>\nconst KEY='ethics-w6-review-v1';\nlet data={};\ntry{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){data={}}\nconst $=s=>document.querySelector(s);\n\nconst FW=['Utilitarianism','Kant (duty)','Rawls (fairness)','Aristotle (virtue)','Confucius (relationships)','Stakeholder analysis'];\nconst VOICES=[[\"“We'll release the update now. A few hundred users may lose some data, but millions will get a faster phone.”\",0],[\"“I won't tell customers the product is ‘almost ready’ when it isn't. Lying is wrong, even if it helps sales.”\",1],[\"“Before we choose the new bonus rules, imagine you don't know if you'll be a cleaner or a director.”\",2],[\"“A good leader is brave but not reckless, generous but not wasteful.”\",3],[\"“I respect my manager like an older brother, but I owe him honest advice when he is wrong.”\",4],[\"“First, let's list everyone this decision affects, and who has the most power and interest.”\",5]];\nconst FWO='\u003coption value=\"\">— which framework? —\u003c/option>'+FW.map((f,i)=>`\u003coption value=\"${i}\">${f}\u003c/option>`).join('');\n$('#voices').innerHTML=VOICES.map((v,i)=>`\u003cdiv class=\"case\">\u003cp>\u003cb>${i+1}.\u003c/b> ${v[0]}\u003c/p>\u003cdiv class=\"row2\">\u003cselect data-k=\"v${i}\" aria-label=\"Voice ${i+1} — framework\">${FWO}\u003c/select>\u003cinput type=\"text\" data-k=\"v${i}w\" aria-label=\"Voice ${i+1} — words that told me\" placeholder=\"The words that told me…\">\u003c/div>\u003c/div>`).join('');\n\n$('#hard').innerHTML=[0,1,2].map(i=>`\u003cdiv class=\"row2\" style=\"margin:6px 0\">\u003cinput type=\"text\" data-k=\"h${i}a\" aria-label=\"Hard word ${i+1}\" placeholder=\"Hard word ${i+1}\">\u003cinput type=\"text\" data-k=\"h${i}b\" aria-label=\"Hard word ${i+1} — my explanation and example\" placeholder=\"My explanation + a short example\">\u003c/div>`).join('');\n\nconst ODD=[[\"utilitarianism\",\"the categorical imperative\",\"the veil of ignorance\",\"cap and trade\",3],[\"enabling\",\"functional\",\"normative\",\"sustainable\",3],[\"Aristotle\",\"Confucius\",\"Bentham\",\"Ida Tarbell\",3],[\"carbon tax\",\"direct regulation\",\"cap and trade\",\"localization\",3],[\"OSHA\",\"collective bargaining\",\"right-to-work law\",\"the golden mean\",3],[\"absolute value\",\"universal value\",\"relative value\",\"goodwill\",3]];\nconst order=[[2,0,3,1],[0,3,1,2],[1,3,0,2],[3,1,2,0],[2,3,0,1],[0,2,3,1]];\n$('#odd').innerHTML=ODD.map((o,i)=>`\u003cdiv class=\"case\">\u003cp>\u003cb>${i+1}.\u003c/b> ${order[i].map(j=>o[j]).join(' · ')}\u003c/p>\u003cdiv class=\"row2\">\u003cselect data-k=\"o${i}\" aria-label=\"Odd one out ${i+1}\">\u003coption value=\"\">— odd one out —\u003c/option>${order[i].map(j=>`\u003coption value=\"${j}\">${o[j]}\u003c/option>`).join('')}\u003c/select>\u003cinput type=\"text\" data-k=\"o${i}w\" aria-label=\"Odd one out ${i+1} — why\" placeholder=\"Why?\">\u003c/div>\u003c/div>`).join('');\n\nconst LF=[[\"A warehouse records every minute a worker is away from their station, including bathroom breaks. Workers signed a form agreeing to monitoring.\",\"Usually legal: workers agreed (the consent exception). Fair? Debatable: it can damage dignity and trust. Term: monitoring / privacy (6.4).\"],[\"A manager fires an employee without giving any reason. There is no contract.\",\"Usually legal in most U.S. states: employment at will, unless the reason is discrimination. Fair? Often not, especially without warning. Term: employment at will.\"],[\"Two engineers do the same job. The woman earns 18% less than the man.\",\"Not legal: equal pay for equal work is required by U.S. law. Not fair. Term: fair wage / gender pay gap (6.2).\"],[\"A factory has no safety guards on its cutting machines. Two workers were hurt this year.\",\"Not legal: employers must provide a safe workplace. Not fair. Term: OSHA (6.1).\"],[\"Workers vote to form a union. The company holds meetings and tells them a union is a bad idea.\",\"It depends: a company may share its opinion, but it may not threaten or fire workers for organizing. Term: union / collective bargaining (6.3).\"],[\"A CEO earns $9 million a year. The average worker earns $45,000. What is the pay ratio?\",\"The pay ratio is 200 to 1 ($9,000,000 ÷ $45,000). Legal. Fair? Debatable: compare it with the workers' pay and the company's results. Term: pay ratio (6.2).\"]];\nconst YN1='\u003coption value=\"\">— legal? —\u003c/option>\u003coption>Legal\u003c/option>\u003coption>Not legal\u003c/option>\u003coption>It depends\u003c/option>';\nconst YN2='\u003coption value=\"\">— fair? —\u003c/option>\u003coption>Fair\u003c/option>\u003coption>Not fair\u003c/option>\u003coption>Debatable\u003c/option>';\n$('#lf').innerHTML=LF.map((s,i)=>`\u003cdiv class=\"case\">\u003cp>\u003cb>${i+1}.\u003c/b> ${s[0]}\u003c/p>\u003cdiv class=\"row2\">\u003cselect data-k=\"l${i}a\" aria-label=\"Situation ${i+1} — legal\">${YN1}\u003c/select>\u003cselect data-k=\"l${i}b\" aria-label=\"Situation ${i+1} — fair\">${YN2}\u003c/select>\u003c/div>\u003cinput type=\"text\" data-k=\"l${i}c\" aria-label=\"Situation ${i+1} — Chapter 6 term\" placeholder=\"Chapter 6 term…\" style=\"margin-top:6px\">\u003c/div>`).join('');\n$('#lfKey').innerHTML=LF.map((s,i)=>`\u003cp>\u003cb>${i+1}.\u003c/b> ${s[1]}\u003c/p>`).join('')+'\u003cp style=\"margin:0\">\u003ci>These answers describe U.S. law in general terms, as the textbook does. Rules differ by state and by country.\u003c/i>\u003c/p>';\n\nconst PARTS=[\"Position\",\"Reason\",\"Evidence from the case\",\"Framework applied\",\"Counterargument\",\"Conclusion\"];\n['A','B'].forEach(p=>{$('#chk'+p).innerHTML='\u003cdiv class=\"opts\">'+PARTS.map((c,i)=>`\u003clabel>\u003cinput type=\"checkbox\" data-k=\"p${p}${i}\" value=\"Yes\"> ${c}\u003c/label>`).join('')+'\u003c/div>'});\n\nconst APPLY=[\"Rawls says we should choose rules behind a veil of ignorance.\",\"Utilitarianism means the greatest good for the greatest number.\",\"Aristotle says a good person has virtues like justice and courage.\"];\n$('#apply').innerHTML=APPLY.map((a,i)=>`\u003clabel>${i+1}. “${a}”\u003c/label>\u003ctextarea data-k=\"ap${i}\" aria-label=\"Apply, don't define ${i+1}\" style=\"min-height:52px\" placeholder=\"Applied to QuickRoute…\">\u003c/textarea>`).join('');\n\nconst CONF=[\"Ch. 1 · integrity, goodwill, short-term vs. long-term\",\"Ch. 2 · the five thinkers and how to apply them\",\"Ch. 3 · stakeholder types and minimum vs. maximum\",\"Ch. 4 · externality, sustainability, greenwashing, government tools\",\"Ch. 5 · enculturation, acculturation, etiquette vs. ethics, values\",\"Ch. 6 · safety, fair pay, unions, privacy\",\"Writing the six-part paragraph\"];\nconst CO='\u003coption value=\"\">— my confidence —\u003c/option>\u003coption>3 · I’m ready\u003c/option>\u003coption>2 · Mostly OK\u003c/option>\u003coption>1 · I need to review\u003c/option>';\n$('#conf').innerHTML=CONF.map((c,i)=>`\u003cdiv class=\"conf\">\u003cspan>${c}\u003c/span>\u003cselect data-k=\"c${i}\" aria-label=\"${c} — confidence\">${CO}\u003c/select>\u003c/div>`).join('');\n\n/* save / load */\nconst status=$('#saved');let tmr;\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(data));status.textContent='Saved ✓'}catch(e){status.textContent='Not saved — use Download'}}\nfunction bind(el){\n  const k=el.dataset.k;\n  if(el.type==='checkbox'){if(data[k])el.checked=true;el.addEventListener('change',()=>{if(el.checked)data[k]=el.value;else delete data[k];save()});return}\n  if(data[k]!==undefined)el.value=data[k];\n  el.addEventListener('input',()=>{data[k]=el.value;status.textContent='Saving…';clearTimeout(tmr);tmr=setTimeout(save,400)});\n  if(el.tagName==='SELECT')el.addEventListener('change',()=>{data[k]=el.value;save()});\n}\ndocument.querySelectorAll('[data-k]').forEach(bind);\nfunction toggle(id){document.getElementById(id).classList.toggle('hidden')}\nfunction mark(el,ok){el.classList.remove('ok','no');if(el.value)el.classList.add(ok?'ok':'no')}\nfunction checkVoices(){let c=0;VOICES.forEach((v,i)=>{const e=$(`[data-k=\"v${i}\"]`);const ok=e.value===String(v[1]);mark(e,ok);if(ok)c++});$('#voiceFb').innerHTML=`${c} / ${VOICES.length} correct.`+(c===VOICES.length?' \u003cspan class=\"ok\">Excellent!\u003c/span>':' Red boxes need another look.')}\nfunction checkOdd(){let c=0;ODD.forEach((o,i)=>{const e=$(`[data-k=\"o${i}\"]`);const ok=e.value===String(o[4]);mark(e,ok);if(ok)c++});$('#oddFb').innerHTML=`${c} / ${ODD.length} correct. Now check your reasons with a partner.`}\n\n/* download / clear / print */\nfunction esc(s){return String(s).replace(/[&\u003c>]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;'}[c]))}\nfunction labelFor(el){\n  if(el.type==='checkbox'){const p=el.closest('.chk');const para=p&&p.previousElementSibling;return (para?para.querySelector('b').textContent+' has: ':'')+el.parentElement.textContent.trim()}\n  if(el.getAttribute('aria-label'))return el.getAttribute('aria-label');\n  const p=el.previousElementSibling;if(p&&p.tagName==='LABEL')return p.textContent;\n  return el.placeholder||el.dataset.k;\n}\nfunction valueFor(el){if(el.tagName==='SELECT'){const o=el.options[el.selectedIndex];return o?o.text:el.value}return el.value}\nfunction downloadAnswers(){\n  let html='';\n  document.querySelectorAll('section.card').forEach(sec=>{\n    let body='';\n    sec.querySelectorAll('[data-k]').forEach(el=>{\n      if(el.type==='checkbox'&&!el.checked)return;\n      if(!el.value)return;const v=valueFor(el);\n      body+=`\u003cp>\u003cb>${esc(labelFor(el))}\u003c/b>\u003cbr>${esc(v).replace(/\\n/g,'\u003cbr>')}\u003c/p>`;\n    });\n    if(body)html+=`\u003ch2>${esc(sec.querySelector('h2').textContent)}\u003c/h2>${body}`;\n  });\n  const name=$('#sname').value||'student';\n  const doc=`\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003ctitle>Midterm review answers · ${esc(name)}\u003c/title>\u003cbody style=\"font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;line-height:1.5\">\u003ch1 style=\"color:#143865\">Ethics in a Global World · Midterm review answers\u003c/h1>\u003cp>\u003cb>Name:\u003c/b> ${esc(name)} · ${new Date().toLocaleString()}\u003c/p>${html||'\u003cp>No answers yet.\u003c/p>'}\u003c/body>`;\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download='midterm-review-'+name.replace(/\\W+/g,'-').toLowerCase()+'.html';document.body.appendChild(a);a.click();a.remove();\n}\nfunction clearAll(){if(!confirm('Clear ALL your answers on this device? This cannot be undone.'))return;data={};try{localStorage.removeItem(KEY)}catch(e){}location.reload()}\nwindow.addEventListener('beforeprint',()=>{document.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px'});document.querySelectorAll('details').forEach(d=>d.setAttribute('open',''))});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "__logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAH0CAIAAABEtEjdAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAFjmlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPD94cGFja2V0IGJlZ2luPSfvu78nIGlkPSdXNU0wTXBDZWhpSHpyZVN6TlRjemtjOWQnPz4KPHg6eG1wbWV0Y <script>
const TABS=[{"id": "guide", "label": "Teacher Guide", "file": "review-teacher-guide.html"}, {"id": "slides", "label": "Slides", "file": "review-slides.html"}, {"id": "jeopardy", "label": "Jeopardy", "file": "review-jeopardy.html"}, {"id": "handouts", "label": "Handouts", "file": "review-handouts.html"}, {"id": "worksheet", "label": "Student Worksheet", "file": "review-worksheet.html"}];
const DOCS=JSON.parse(document.getElementById('docs').textContent);
const LOGO=DOCS.__logo||'';
const tabs=document.getElementById('tabs'),panes=document.getElementById('panes');
function html(t){return DOCS[t.id].split('__LOGO__').join(LOGO)}
TABS.forEach(t=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.id='tab-'+t.id;b.textContent=t.label;b.title=t.hint||'';
  b.onclick=()=>go(t.id);tabs.appendChild(b);
});
tabs.insertAdjacentHTML('beforeend','<span class="sp"></span><a id="newtab" href="#">Open in new tab ↗</a>');
let cur=TABS[0];
document.getElementById('newtab').onclick=e=>{e.preventDefault();try{const u=URL.createObjectURL(new Blob([html(cur)],{type:'text/html'}));window.open(u,'_blank')}catch(err){}};
function wire(f){
  try{const d=f.contentDocument;
    d.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');
      if(h==='index.html'){a.style.display='none';return}
      const m=TABS.find(x=>x.file===h.split('#')[0]);
      if(m)a.addEventListener('click',e=>{e.preventDefault();go(m.id)});
      else if(/\.html(#|$)/.test(h)&&!/^https?:/.test(h))a.style.display='none';
    });
  }catch(e){}
}
function go(id,noHash){
  const t=TABS.find(x=>x.id===id)||TABS[0];cur=t;
  TABS.forEach(x=>{document.getElementById('tab-'+x.id).setAttribute('aria-selected',x.id===t.id);const f=document.getElementById('pane-'+x.id);if(f)f.classList.toggle('on',x.id===t.id)});
  let f=document.getElementById('pane-'+t.id);
  if(!f){f=document.createElement('iframe');f.id='pane-'+t.id;f.title=t.label;f.allow='fullscreen';f.allowFullscreen=true;f.className='on';
    f.addEventListener('load',()=>wire(f));f.srcdoc=html(t);panes.appendChild(f)}
  document.title=t.label+' · Week 6 Teachers';
  if(!noHash){try{history.replaceState(null,'','#'+t.id)}catch(e){}}
  try{document.getElementById('tab-'+t.id).scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
  setTimeout(()=>{try{f.contentWindow.focus()}catch(e){}},50);
}
go(location.hash.slice(1),true);
addEventListener('hashchange',()=>go(location.hash.slice(1),true));
</script>
