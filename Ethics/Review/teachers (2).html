<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 6 Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--bg:#fbfaf6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Source Sans 3",system-ui,sans-serif;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);flex:none}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 0}
.top img{height:34px;border-radius:4px}
.top .t{font-family:"Libre Baskerville",serif;font-size:16px;line-height:1.2}
.top .t small{display:block;font-family:"Source Sans 3",sans-serif;font-size:12.5px;color:var(--sky);font-weight:600;letter-spacing:.04em}
.top .who{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:3px 10px;white-space:nowrap}
nav{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;font:600 15px "Source Sans 3",sans-serif;color:#dbe4f0;background:rgba(255,255,255,.08);border:0;border-radius:8px 8px 0 0;padding:9px 16px;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.16);color:#fff}
nav button[aria-selected="true"]{background:var(--bg);color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
nav .sp{flex:1}
nav a{flex:none;align-self:center;font-size:13.5px;color:var(--sky);text-decoration:none;padding:6px 8px;white-space:nowrap}
nav a:hover{color:#fff;text-decoration:underline}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
@media (max-width:600px){.top .t small{display:none}.top .t{font-size:14px}.top img{height:28px}nav button{font-size:14px;padding:8px 12px}}
@media print{.bar{display:none}}
</style>
</head>

<script type="application/json" id="docs">{"guide": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Midterm Review Teacher Guide · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--cream:#efe9d9;--ink:#1a2233;--muted:#4a5568;--bg:#fbfaf6}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Source Sans 3\",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16.5px;line-height:1.55}\nheader.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}\n.top .in{max-width:1180px;margin:0 auto;padding:18px 16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}\n.top img{width:56px;height:56px;border-radius:8px;flex:none}\n.top .w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.12em;font-size:16px;line-height:1.1;flex:none}\n.top .w small{display:block;letter-spacing:.02em;font-size:10px;color:#e6d8a8}\n.top .grow{flex:1;min-width:220px}\n.top h1{font-family:\"Libre Baskerville\",serif;margin:0;font-size:clamp(19px,3.6vw,26px);line-height:1.2}\n.top p{margin:3px 0 0;color:var(--sky);font-size:14.5px}\n.btn{display:inline-block;background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}\n.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}\n.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:28px;padding:0 16px}\n.toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:22px 0;font-size:14px}\n.toc b{display:block;margin:14px 0 4px;color:var(--gold-d);font-size:12px;letter-spacing:.08em;text-transform:uppercase}\n.toc a{display:block;color:var(--navy);text-decoration:none;padding:2px 0}\n.toc a:hover{text-decoration:underline}\nmain{padding:10px 0 60px;min-width:0}\nsection{padding-top:8px}\nh2{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:24px;margin:34px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--gold)}\nh3{font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:19px;margin:28px 0 8px}\nh4{margin:18px 0 6px;color:var(--blue);font-size:16.5px}\n.lead{font-size:18.5px;color:var(--navy)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}\n.meta>div{background:#fff;border:1px solid var(--sky);border-left:5px solid var(--gold);border-radius:8px;padding:12px 14px}\n.meta b{display:block;color:var(--navy)}\ntable{width:100%;border-collapse:collapse;margin:10px 0 16px;background:#fff;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.tw{overflow-x:auto}\n.act{background:#fff;border:1px solid var(--sky);border-radius:10px;padding:4px 18px 14px;margin:18px 0}\n.act h3{margin-top:14px}\n.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--navy);color:#fff;margin-right:6px;vertical-align:middle}\n.tag.s{background:var(--blue)}.tag.a{background:var(--gold-d)}.tag.b{background:#5a6b84}\n.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:15px;margin:8px 0 10px}\n.kv b{color:var(--navy)}\n.say{background:var(--cream);border-left:4px solid var(--gold-d);padding:9px 14px;border-radius:6px;margin:10px 0;font-style:italic}\n.note{background:var(--sky3);border-left:4px solid var(--blue);padding:9px 14px;border-radius:6px;margin:10px 0;font-size:15px}\n.warn{background:#fbf1dc;border-left:4px solid var(--gold);padding:9px 14px;border-radius:6px;margin:10px 0;font-size:15px}\n.lang{background:#fff;border:1px dashed var(--gold-d);border-radius:8px;padding:8px 14px;margin:10px 0;font-size:15px}\n.lang b{color:var(--gold-d)}\nol li,ul li{margin:3px 0}\n.time{font-weight:700;color:var(--gold-d)}\nfooter{font-size:13px;color:#6b7280;border-top:1px solid var(--sky);margin-top:40px;padding-top:12px}\n@media (max-width:860px){.layout{grid-template-columns:1fr}.toc{position:static;max-height:none;padding:10px 0 0;columns:2}.kv{grid-template-columns:1fr}}\n@media print{\n  body{font-size:11.5pt;background:#fff}\n  .noprint,.toc{display:none!important}\n  .layout{display:block;padding:0}\n  header.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .act,table,.say,.note,.warn,.lang{break-inside:avoid}\n  h2{break-before:page}\n  section:first-of-type h2{break-before:auto}\n  a{color:inherit;text-decoration:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"in\">\n  \u003cimg src=\"__LOGO__\" alt=\"Approach International Student Center\" onload=\"this.nextElementSibling.remove()\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\n  \u003cdiv class=\"grow\">\u003ch1>Week 6 Teacher Guide · Midterm Review\u003c/h1>\u003cp>Ethics in a Global World · Chapters 1–6 · Class 1 review 9:00–10:40 · Midterm 11:10–12:50\u003c/p>\u003c/div>\n  \u003cdiv class=\"noprint\">\u003cbutton class=\"btn\" onclick=\"print()\">Print / Save PDF\u003c/button>\u003c/div>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"layout\">\n\u003cnav class=\"toc\" aria-label=\"Contents\">\n  \u003cb>Overview\u003c/b>\n  \u003ca href=\"#overview\">Goals &amp; design\u003c/a>\n  \u003ca href=\"#prep\">Materials &amp; prep\u003c/a>\n  \u003cb>Class 1 · 9:00–10:40\u003c/b>\n  \u003ca href=\"#c1\">Timing\u003c/a>\n  \u003ca href=\"#a\">Framework voices\u003c/a>\n  \u003ca href=\"#b\">Explain it!\u003c/a>\n  \u003ca href=\"#c\">Chapter 6: legal? fair?\u003c/a>\n  \u003ca href=\"#d\">Case clinic: QuickRoute\u003c/a>\n  \u003ca href=\"#e\">Paragraph doctor\u003c/a>\n  \u003ca href=\"#f\">Game plan &amp; self-check\u003c/a>\n  \u003cb>Class 2 · 11:10–12:50\u003c/b>\n  \u003ca href=\"#c2\">Midterm\u003c/a>\n  \u003cb>Support\u003c/b>\n  \u003ca href=\"#lang\">Language support\u003c/a>\n  \u003ca href=\"#align\">How this prepares the midterm\u003c/a>\n  \u003ca href=\"#flags\">Notes\u003c/a>\n\u003c/nav>\n\n\u003cmain>\n\n\u003csection id=\"overview\">\n\u003ch2>Week 6 at a glance\u003c/h2>\n\u003cp class=\"lead\">Class 1 is an active review of Chapters 1–6, and Class 2 is the midterm. The review practices every skill the midterm needs, but with \u003cstrong>new questions and a new case\u003c/strong>, so nothing gives away the test. It also introduces Chapter 6 in 15 minutes, because the midterm includes a few Chapter 6 items.\u003c/p>\n\u003cdiv class=\"meta\">\n  \u003cdiv>\u003cb>Class 1 · Midterm review\u003c/b>Framework voices → Explain it! → Chapter 6: legal? fair? → QuickRoute case clinic → Paragraph doctor → Game plan.\u003c/div>\n  \u003cdiv>\u003cb>Class 2 · Midterm\u003c/b>80 minutes, 50 points, closed-book. Instructions at 11:10, test 11:15–12:35, collect and close by 12:50.\u003c/div>\n  \u003cdiv>\u003cb>The thread\u003c/b>Every stage moves students from \u003cem>knowing\u003c/em> a term to \u003cem>using\u003c/em> it on a case, the skill the midterm rewards most.\u003c/div>\n\u003c/div>\n\u003ch3>Goals\u003c/h3>\n\u003cp>By the end of Class 1, students can:\u003c/p>\n\u003col>\n\u003cli>Recognize the five thinkers and stakeholder analysis in real workplace language.\u003c/li>\n\u003cli>Explain 24 key terms from Chapters 1–6 in their own words.\u003c/li>\n\u003cli>Name what employers owe employees (Chapter 6) and tell the difference between \u003cem>legal\u003c/em> and \u003cem>fair\u003c/em>.\u003c/li>\n\u003cli>Analyze a new case with four tools: stakeholders, minimum/maximum, culture and workplace, frameworks.\u003c/li>\n\u003cli>Spot the missing parts of a reflection paragraph and turn a definition into an applied argument.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"prep\">\n\u003ch2>Materials &amp; prep\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>File\u003c/th>\u003cth>What to prepare\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>review-slides.html\u003c/td>\u003ctd>Project. Slide 1 shows a QR code to the review worksheet once the files are online.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>review-worksheet.html\u003c/td>\u003ctd>Students open it on phones or laptops (autosaves). Print a few copies for students without devices.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>review-handouts.html\u003c/td>\u003ctd>p.1 Explain it! cards: 1 set per group of 3, cut, in envelopes · p.2 letter cards (U K R A C S): 1 set per team · p.3 vote cards: 1 set per pair · p.4 QuickRoute case + role cards: 1 per group of 4 · p.5 paragraph doctor: 1 per pair (optional if students use the worksheet)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>midterm.html\u003c/td>\u003ctd>Print the \u003cb>student version\u003c/b> (key hidden) for Class 2, one per student, plus 2 spares. Print one marking copy with the key shown.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Room:\u003c/b> teams of 3 for the first two stages, then groups of 4 for the case clinic. Before 9:00, put one envelope of cards on each table.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"c1\">\n\u003ch2>Class 1 · Midterm review · 9:00–10:40\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clock\u003c/th>\u003cth>Min\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Activity\u003c/th>\u003cth>Slides\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>9:00–9:12\u003c/td>\u003ctd>12\u003c/td>\u003ctd>\u003cspan class=\"tag\">Engage\u003c/span>\u003c/td>\u003ctd>Framework voices (team game)\u003c/td>\u003ctd>1–7\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:12–9:27\u003c/td>\u003ctd>15\u003c/td>\u003ctd>\u003cspan class=\"tag s\">Study\u003c/span>\u003c/td>\u003ctd>Explain it! vocabulary game + \"Don't mix them up\"\u003c/td>\u003ctd>8–9\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:27–9:42\u003c/td>\u003ctd>15\u003c/td>\u003ctd>\u003cspan class=\"tag s\">Study\u003c/span>\u003c/td>\u003ctd>Chapter 6 in 15 minutes: legal? fair?\u003c/td>\u003ctd>10–13\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9:42–10:10\u003c/td>\u003ctd>28\u003c/td>\u003ctd>\u003cspan class=\"tag a\">Activate\u003c/span>\u003c/td>\u003ctd>Case clinic: QuickRoute (four roles + verdicts)\u003c/td>\u003ctd>14–16\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:10–10:28\u003c/td>\u003ctd>18\u003c/td>\u003ctd>\u003cspan class=\"tag a\">Activate\u003c/span>\u003c/td>\u003ctd>Paragraph doctor + apply, don't define\u003c/td>\u003ctd>17–19\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10:28–10:40\u003c/td>\u003ctd>12\u003c/td>\u003ctd>\u003cspan class=\"tag b\">Close\u003c/span>\u003c/td>\u003ctd>Midterm game plan, tips, self-check, questions\u003c/td>\u003ctd>20–22\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"act\" id=\"a\">\n\u003ch3>\u003cspan class=\"tag\">Engage\u003c/span> 9:00–9:12 · Framework voices\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Wake up the five frameworks from Chapter 2 and stakeholder analysis from Chapter 3 by recognizing them in everyday workplace language.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Teams of 3\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Letter cards U K R A C S (handouts p.2); slides 3–7; worksheet §1\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(2 min)\u003c/span> Slide 2: today's plan. Slide 3: explain the game. Each team gets a set of letter cards.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(7 min)\u003c/span> Slides 4–6: read each \"voice\" aloud. Teams have 15 seconds to agree and hold up a letter. Tap to reveal. 1 point for the letter; 1 bonus point if a team can say \u003cb>which words\u003c/b> told them.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Slide 7: the five thinkers as five questions. Stress the last line: on the midterm, \u003cb>use\u003c/b> the question on the case, don't just name the thinker.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>#\u003c/th>\u003cth>Voice\u003c/th>\u003cth>Answer\u003c/th>\u003cth>Clue words\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Release the update; a few hundred lose data, millions get a faster phone.\u003c/td>\u003ctd>U · Utilitarian\u003c/td>\u003ctd>\"a few hundred … but millions\": weighing results\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Won't say \"almost ready\"; lying is wrong even if it helps sales.\u003c/td>\u003ctd>K · Kant\u003c/td>\u003ctd>\"wrong, even if it helps\": duty over results\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Imagine you don't know if you'll be a cleaner or a director.\u003c/td>\u003ctd>R · Rawls\u003c/td>\u003ctd>\"you don't know … who you'll be\": veil of ignorance\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Brave but not reckless, generous but not wasteful.\u003c/td>\u003ctd>A · Aristotle\u003c/td>\u003ctd>\"but not\": the golden mean between extremes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Respect him like an older brother, but owe him honest advice.\u003c/td>\u003ctd>C · Confucius\u003c/td>\u003ctd>\"older brother\": relationships; honest advice = loyalty to truth\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>List everyone affected; who has the most power and interest.\u003c/td>\u003ctd>S · Stakeholder analysis\u003c/td>\u003ctd>\"power and interest\": the power–interest matrix\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"say\">\"Notice that every manager used ordinary words, not the philosopher's name. On the midterm, you'll do the opposite: start from the framework and use it on a real case.\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"b\">\n\u003ch3>\u003cspan class=\"tag s\">Study\u003c/span> 9:12–9:27 · Explain it! (vocabulary game)\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Recycle 24 key terms from all six chapters by explaining them, which is harder and more useful than recognizing a definition.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Teams of 3 (same teams)\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Explain it! cards (handouts p.1); slides 8–9; worksheet §2\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(1 min)\u003c/span> Slide 8: rules. The explainer has 60 seconds and may not say the word or the two forbidden words on the card.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(11 min)\u003c/span> Play. Set the timer (T on slide 8). Walk around and note terms that no team can explain; you'll use them in step 3.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Slide 9: \"Don't mix them up\". Tap to reveal the six pairs that students most often confuse. Students write their three hardest words in worksheet §2. The \u003cb>odd one out\u003c/b> task in §2 is for fast finishers or the break.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cb>Odd one out key (worksheet §2):\u003c/b> 1 cap and trade (a government tool, not an ethical framework) · 2 sustainable (not a stakeholder type) · 3 Ida Tarbell (a journalist, not a philosopher) · 4 localization (not a government tool) · 5 the golden mean (Chapter 2, not workplace law) · 6 goodwill (not a type of value).\u003c/p>\n\u003cdiv class=\"lang\">\u003cb>Language:\u003c/b> \"It's a kind of …\" · \"It's the opposite of …\" · \"It's what happens when …\" · \"For example, a company that …\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"c\">\n\u003ch3>\u003cspan class=\"tag s\">Study\u003c/span> 9:27–9:42 · Chapter 6 in 15 minutes: legal? fair?\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Give students the core of Chapter 6 before the midterm, and practice the key idea that \u003cem>legal\u003c/em> and \u003cem>fair\u003c/em> are not the same.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Pairs\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Vote cards (handouts p.3); slides 10–13; worksheet §3\u003c/span>\n\u003cb>Book\u003c/b>\u003cspan>\u003ca href=\"https://openstax.org/books/business-ethics/pages/6-introduction\">Chapter 6\u003c/a>: 6.1 working conditions · 6.2 fair wage · 6.3 an organized workforce · 6.4 privacy (from p. 159)\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Slide 10: the four things employers owe employees, and employment at will. Keep it short; the situations do the teaching.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(10 min)\u003c/span> Slides 12–13: read each situation. Pairs hold up one \"legal\" card and one \"fair\" card. Tap to reveal. Spend your time on the situations where legal and fair are different (1, 2, 5, 6).\u003c/li>\n\u003cli>\u003cspan class=\"time\">(2 min)\u003c/span> Ask: \"Which one surprised you? Is it legal or fair in a country you know?\"\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>#\u003c/th>\u003cth>Situation\u003c/th>\u003cth>Suggested answer\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Warehouse records every minute away from the station; workers signed a monitoring form.\u003c/td>\u003ctd>Usually legal (consent exception, 6.4). Fair: debatable, since it can damage dignity and trust.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Fired without a reason; no contract.\u003c/td>\u003ctd>Usually legal in most U.S. states (employment at will), unless the real reason is discrimination. Fair: often not.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Same job; the woman earns 18% less.\u003c/td>\u003ctd>Not legal (equal pay for equal work) and not fair. Link: the gender pay gap (6.2).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>No machine guards; two workers hurt.\u003c/td>\u003ctd>Not legal (OSHA, 6.1) and not fair.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Company tells workers a union is a bad idea.\u003c/td>\u003ctd>It depends: an employer may share its opinion, but may not threaten, punish or fire workers for organizing (6.3).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>CEO $9 million; average worker $45,000.\u003c/td>\u003ctd>Pay ratio 200 to 1. Legal. Fair: debatable.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"say\">\"Chapter 6's big lesson is the same one we met in Chapter 1: the law is the minimum. A good employer asks what is \u003cem>fair\u003c/em>, not only what is \u003cem>legal\u003c/em>.\"\u003c/div>\n\u003cp class=\"muted\">These answers describe U.S. law in general terms, as the textbook does; rules differ by state and by country. Invite comparisons, but don't let the stage turn into a law lesson.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"d\">\n\u003ch3>\u003cspan class=\"tag a\">Activate\u003c/span> 9:42–10:10 · Case clinic: QuickRoute\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Practice the full case-analysis toolkit on a \u003cstrong>new\u003c/strong> case, with each student responsible for one tool, as in Part C of the midterm.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Groups of 4, one role each (groups of 3: combine roles 2 and 3)\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>QuickRoute case + role cards (handouts p.4); slides 14–16; worksheet §4\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Slide 14: students read the case silently, then underline every number and fact.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(7 min)\u003c/span> Slide 15: each student works alone on their role card and writes notes in worksheet §4.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(5 min)\u003c/span> Each student reports their tool to the group. The group agrees a two-sentence verdict: which change should QuickRoute drop or fix first?\u003c/li>\n\u003cli>\u003cspan class=\"time\">(10 min)\u003c/span> Slide 16: each group gives its verdict in one minute and names the tool that helped most. Other groups give one challenge each.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(2 min)\u003c/span> Debrief: \"Which tool was easiest? Which was hardest? That's the one to review in the break.\"\u003c/li>\n\u003c/ol>\n\u003ch4>Model answers\u003c/h4>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Role\u003c/th>\u003cth>Strong answers include\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 · Stakeholders\u003c/td>\u003ctd>Investors (enabling; high power, high interest) · city councils/government (enabling; high power) · drivers (functional; high interest, low power alone, more power if organized) · customers (functional) · restaurants (functional) · other delivery apps (normative) · media, labor groups (diffused) · drivers' families (diffused). \u003cb>Key stakeholders\u003c/b> (high power, high interest): investors, and city councils now that rules are being discussed.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 · Minimum and maximum\u003c/td>\u003ctd>\u003cb>Minimum:\u003c/b> make the changes that the law and contracts allow, for example monitoring and the new pay. \u003cb>Maximum:\u003c/b> track only during shifts; guarantee a minimum hourly pay; make tipping optional and local; listen to drivers' groups. \u003cb>Short term:\u003c/b> lower costs, maybe a first profit. \u003cb>Long term:\u003c/b> drivers leave, bad publicity, stricter city rules, lost goodwill (Chapter 1).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 · Culture and workplace\u003c/td>\u003ctd>\u003cb>Tipping prompt:\u003c/b> mostly etiquette (it feels pushy and doesn't fit local custom, 5.3 localization), but it becomes an ethical issue if customers are pressured or misled about where the money goes. \u003cb>Chapter 6:\u003c/b> SmartTrack after logging off raises privacy (6.4); per-delivery pay raises fair wage (6.2); removing \"troublemakers\" threatens the right to organize (6.3), and punishing workers for organizing is not legal in the U.S.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 · Frameworks\u003c/td>\u003ctd>E.g., on removing organizers: \u003cb>Kant\u003c/b> says no; it uses drivers only as tools and could not be a universal rule. \u003cb>Rawls\u003c/b> says protect the weakest; behind the veil you might be a driver. \u003cb>Utilitarian\u003c/b>: short-term profit for investors versus harm to 40,000 drivers and trust, so likely no. Here the frameworks \u003cb>agree\u003c/b>. On SmartTrack they may \u003cb>disagree\u003c/b>: a utilitarian might accept tracking during shifts for safety, while Kant objects to tracking free time.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"say\">\"Which change is the worst? There's no single right answer, but there are strong and weak reasons. A strong reason uses a fact from the case and a tool from the course.\"\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"e\">\n\u003ch3>\u003cspan class=\"tag a\">Activate\u003c/span> 10:10–10:28 · Paragraph doctor\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Revise the six-part reflection paragraph by diagnosing weak paragraphs, and practice the most common fix: applying a framework instead of defining it.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Pairs\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Slides 17–19; worksheet §5 (or handouts p.5)\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(6 min)\u003c/span> Slide 17: pairs tick the parts each paragraph \u003cb>really\u003c/b> has.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Slide 18: reveal the diagnosis.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(5 min)\u003c/span> Pairs rewrite one missing part. Two or three pairs read theirs aloud.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Slide 19: apply, don't define. Show the definitions, then tap to reveal the applied versions. Students rewrite the Aristotle sentence themselves (worksheet §5, item 3).\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Paragraph\u003c/th>\u003cth>Has\u003c/th>\u003cth>Missing or weak\u003c/th>\u003cth>Model fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A\u003c/td>\u003ctd>Position, reason, evidence, conclusion\u003c/td>\u003ctd>Framework only defined; no counterargument\u003c/td>\u003ctd>\"From a Kantian perspective, recording drivers in their free time treats them only as tools for the company's data. Some people may say tracking keeps drivers safe; however, drivers can choose to share their location if they need help.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B\u003c/td>\u003ctd>A weak counterargument\u003c/td>\u003ctd>No position, no evidence, framework not applied, \"it depends\" is not a conclusion\u003c/td>\u003ctd>Start: \"QuickRoute should stop tracking drivers after they log off.\" Add the 30-minute fact. End: \"Therefore, QuickRoute should track drivers only during their shifts.\"\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Aristotle model:\u003c/b> \"A person with Aristotle's virtues would not remove drivers for organizing; that would be unjust, and a good leader has the courage to listen to criticism.\"\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"act\" id=\"f\">\n\u003ch3>\u003cspan class=\"tag b\">Close\u003c/span> 10:28–10:40 · Midterm game plan &amp; self-check\u003c/h3>\n\u003cdiv class=\"kv\">\u003cb>Purpose\u003c/b>\u003cspan>Lower anxiety: students know the format, the timing and their own weak spots, and use the break well.\u003c/span>\n\u003cb>Grouping\u003c/b>\u003cspan>Whole class → individual\u003c/span>\n\u003cb>Materials\u003c/b>\u003cspan>Slides 20–22; worksheet §6\u003c/span>\u003c/div>\n\u003col>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Slide 20: the three parts, points and suggested times.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(3 min)\u003c/span> Slide 21: six tips, one at a time.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(4 min)\u003c/span> Slide 22: students rate themselves 1–3 on each chapter in worksheet §6 and choose two topics to look at in the break.\u003c/li>\n\u003cli>\u003cspan class=\"time\">(2 min)\u003c/span> Open questions about the format. Don't answer content questions that would preview the test.\u003c/li>\n\u003c/ol>\n\u003c/div>\n\n\u003csection id=\"c2\">\n\u003ch2>Class 2 · Midterm · 11:10–12:50\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Clock\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>11:10–11:15\u003c/td>\u003ctd>Phones away. Hand out the student version. Read the instructions aloud. Students write their names.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11:15–12:35\u003c/td>\u003ctd>Midterm (80 minutes). Time warnings: at 11:45 (\"You should be starting Part C\") and at 12:25 (\"10 minutes left\").\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12:35–12:50\u003c/td>\u003ctd>Collect papers. Short close: one thing that went well. Preview Week 7: what employees owe employers.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>The answer key, rubrics, a chapter coverage table and the score bands are in \u003cb>midterm.html\u003c/b> (click \"Show teacher key\").\u003c/p>\n\u003c/section>\n\n\u003csection id=\"lang\">\n\u003ch2>Language support\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Function\u003c/th>\u003cth>Language\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Explaining a term\u003c/td>\u003ctd>\"In other words, …\" · \"It means that …\" · \"This is different from ___ because …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Applying a framework\u003c/td>\u003ctd>\"From a ___ perspective, this decision …\" · \"A utilitarian would count …\" · \"Kant would ask whether …\" · \"Behind the veil of ignorance, …\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Legal vs. fair\u003c/td>\u003ctd>\"It may be legal, but it isn't fair, because …\" · \"The law only sets the minimum.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Challenging a group\u003c/td>\u003ctd>\"Have you considered …?\" · \"What about the drivers who …?\" · \"I see your point, but …\"\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Words students may mix up:\u003c/b> \u003ci>legal\u003c/i> vs. \u003ci>fair\u003c/i> · \u003ci>stakeholder\u003c/i> vs. \u003ci>stockholder\u003c/i> · \u003ci>enculturation\u003c/i> vs. \u003ci>acculturation\u003c/i> · \u003ci>employer\u003c/i> (the company) vs. \u003ci>employee\u003c/i> (the worker).\u003c/p>\n\u003cp>\u003cb>Pronunciation:\u003c/b> categorical (cat-uh-GOR-i-cul) · exigency (EK-si-jen-see) · acculturation (uh-kul-chuh-RAY-shun) · Rawls (rhymes with \"calls\").\u003c/p>\n\u003c/section>\n\n\u003csection id=\"align\">\n\u003ch2>How this prepares the midterm\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003ctr>\u003cth>Review stage\u003c/th>\u003cth>Midterm skill\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Framework voices, Explain it!\u003c/td>\u003ctd>Part A (vocabulary) and Part B (explain + example)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chapter 6: legal? fair?\u003c/td>\u003ctd>The Chapter 6 vocabulary and short-answer items, and the workplace facts in Part C\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Case clinic\u003c/td>\u003ctd>Part C: stakeholders and types, minimum and maximum, culture, two frameworks\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Paragraph doctor\u003c/td>\u003ctd>Part C paragraph (six parts; framework applied, not defined)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>No overlap with the test:\u003c/b> the review uses different questions, a different case (a delivery app, not a clothing supplier) and different examples. It reviews the same \u003cem>concepts\u003c/em>, but none of the midterm's sentences, definitions, situations or prompts appear here.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"flags\">\n\u003ch2>Notes\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Chapter 6 on the midterm:\u003c/b> the 15-minute Chapter 6 stage covers the Chapter 6 vocabulary and the short-answer item. If you skip it, use the replacement items in the midterm's teacher notes.\u003c/li>\n\u003cli>\u003cb>Timing is tight.\u003c/b> If you run late, shorten the verdict round (slide 16) to four groups, or skip the odd-one-out task. Protect the game plan: students need it before the test.\u003c/li>\n\u003cli>\u003cb>Legal details:\u003c/b> the Chapter 6 answers describe U.S. law in general terms. Students working in other countries may know different rules; welcome that as a cultural comparison.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003cfooter>Textbook content from Byars &amp; Stanberry, \u003cem>Business Ethics\u003c/em>, OpenStax (CC BY-NC-SA 4.0), Chapters 1–6. QuickRoute and all situations in this review are teacher-made.\u003c/footer>\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "slides": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Midterm Review Slides · Ethics in a Global World\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js\">\u003c/script>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky2:#e1e8f2;--s adius:12px;padding:16px 20px}\n.box h3{font-family:\"Libre Baskerville\",serif;margin:0 0 6px;font-size:24px;color:var(--navy)}\n.box p,.box li{font-size:21px}\n.dark .box{background:#1c4673;border-color:#2c5b8c;border-top-color:var(--gold);color:#fff}\n.dark .box h3{color:var(--gold)}\n.lang{margin-top:auto;background:var(--sky3);border-left:6px solid var(--gold);padding:10px 18px;border-radius:8px;font-size:20px;color:var(--navy)}\n.lang b{color:var(--gold-d)}\n.dark .lang{background:#1c4673;color:#fff}\n.dark .lang b{color:var(--gold)}\ntable{border-collapse:collapse;width:100%;font-size:21px;background:#fff}\nth,td{border:2px solid var(--sky);padding:8px 12px;text-align:left;vertical-align:top}\nth{background:var(--sky2);color:var(--navy)}\n.mean{display:flex;align-items:center;justify-content:center;gap:24px;font-size:34px;margin:24px 0}\n.mean .v{background:var(--navy);color:#fff;padding:12px 26px;border-radius:10px;font-weight:700}\n.mean .x{color:var(--gold-d);font-weight:700}\n.tag{display:inline-block;background:var(--navy);color:#fff;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:5px;margin-bottom:12px}\n.tag.s{background:var(--blue)}.tag.a{background:var(--gold-d)}.tag.b{background:#5a6b84}\n.step{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}\n.step.shown{opacity:1;transform:none}\n.timechip{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:3px 12px;border-radius:20px;font-size:18px;margin-left:10px;vertical-align:middle}\n.brand{display:flex;align-items:center;gap:16px;margin-bottom:auto}\n.brand img{height:74px}\n.brand .w{font-family:\"Libre Baskerville\",serif;color:var(--gold);letter-spacing:.14em;font-size:22px;line-height:1.1}\n.brand .w small{display:block;font-size:13px;letter-spacing:.03em;color:#e6d8a8}\n#qr{background:#fff;padding:10px;border-radius:10px;width:max-content}\n#qr img,#qr canvas{display:block;width:170px!important;height:170px!important}\n.warn{background:#fbf1dc;border-left:6px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:20px;margin-bottom:12px}\n#timer{position:fixed;right:18px;top:18px;background:var(--gold);color:var(--navy);font:700 46px \"Source Sans 3\",sans-serif;padding:6px 20px;border-radius:12px;display:none;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}\n#timer.done{background:#a33a2a;color:#fff;animation:pulse 1s infinite}\n@keyframes pulse{50%{opacity:.6}}\n#help{position:fixed;left:14px;bottom:12px;color:#7f93ad;font-size:13px;z-index:10}\n#prog{position:fixed;left:0;top:0;height:4px;background:var(--gold);z-index:11;transition:width .2s}\n@media print{html,body{overflow:visible;background:#fff;height:auto}#stage{position:static;display:block}#deck{transform:none!important;width:auto;height:auto}.slide{display:flex!important;position:relative;width:1280px;height:720px;break-after:page}.step{opacity:1;transform:none}#timer,#help,#prog{display:none}}\n\n.corners{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}\n.corners div{border-radius:12px;padding:18px 22px;font-size:30px;font-weight:700;color:#fff}\n.c1{background:#1c4f8f}.c2{background:#8c3a2a}.c3{background:#8c7535}.c4{background:#4a5f7a}\n.matrix{display:grid;grid-template-columns:60px 1fr 1fr;grid-template-rows:1fr 1fr 40px;gap:8px;height:420px}\n.matrix .q{border-radius:10px;padding:14px 18px;font-size:22px;background:var(--sky3);border:2px solid var(--sky)}\n.matrix .q b{display:block;font-size:24px;color:var(--navy)}\n.matrix .q.key{background:var(--navy);color:#fff;border-color:var(--navy)}\n.matrix .q.key b{color:var(--gold)}\n.matrix .ax{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-d);font-size:18px;letter-spacing:.08em}\n.matrix .ay{writing-mode:vertical-rl;transform:rotate(180deg)}\n.therm{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0;border-radius:10px;overflow:hidden;font-size:22px;font-weight:700;text-align:center}\n.therm div{padding:16px 8px}\n.paper{background:#f8f5ec;border:2px solid #2b2b2b;padding:22px 30px;font-family:\"Libre Baskerville\",serif;color:#1a1a1a;box-shadow:6px 6px 0 rgba(0,0,0,.15)}\n.paper .mast{text-align:center;font-size:44px;font-weight:700;border-bottom:4px double #1a1a1a;padding-bottom:6px;letter-spacing:.04em}\n.paper .date{display:flex;justify-content:space-between;font-family:\"Source Sans 3\",sans-serif;font-size:15px;border-bottom:1px solid #1a1a1a;padding:4px 0;margin-bottom:14px}\n.paper .head{font-size:44px;line-height:1.15;font-weight:700;margin:6px 0 10px}\n.paper p{font-family:\"Source Sans 3\",sans-serif;font-size:22px}\n.lie{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}\n.lie div{background:#fff;border:2px solid var(--sky);border-radius:12px;padding:14px 18px;font-size:23px;line-height:1.35}\n.lie b{color:var(--gold-d);font-size:26px;margin-right:6px}\n.ev{background:#fff;border:3px dashed var(--gold-d);border-radius:14px;padding:30px 36px;font-size:36px;line-height:1.35;font-family:\"Libre Baskerville\",serif;color:var(--navy);margin:12px 0}\n\n.fix{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.fix div{background:#fff;border:2px solid var(--sky);border-left:6px solid #a33a2a;border-radius:10px;padding:12px 16px;font-size:22px}\n.fix div.ok{border-left-color:#2f6b2f}\n.flaglist li{font-size:25px;margin:6px 0}\n.flaglist small{color:var(--gold-d);font-size:18px}\n.stn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.stn div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--blue);border-radius:10px;padding:10px 14px;font-size:20px}\n.stn b{display:block;color:var(--navy);font-family:\"Libre Baskerville\",serif;font-size:21px}\n.verdict{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;padding:4px 14px;border-radius:6px;margin-top:6px}\n.fish{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}\n.fish div{background:var(--sky3);border-radius:10px;padding:12px;text-align:center;font-size:21px}\n.fish b{display:block;font-size:34px;color:var(--navy)}\n\n.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}\n.scale div{border-radius:10px;padding:10px;text-align:center;font-size:21px;font-weight:700;color:#fff}\n.sit li{font-size:26px;margin:10px 0}\n.ee{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.ee div{border-radius:12px;padding:16px 20px;font-size:22px}\n.para{background:#fff;border:2px solid var(--sky);border-radius:10px;padding:12px 16px;font-size:18px;line-height:1.45}\n.para.bad{border-left:8px solid #a33a2a}.para.good{border-left:8px solid #2f6b2f}\n.six{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.six div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:20px}\n.six b{display:block;font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:22px}\n\n.slide>.tag{align-self:flex-start}\n.voice{background:#fff;border:2px solid var(--sky);border-left:8px solid var(--gold);border-radius:12px;padding:16px 22px;margin:0 0 16px}\n.voice p{font-family:\"Libre Baskerville\",serif;font-size:27px;color:var(--navy);margin:0}\n.voice .ans{display:inline-block;margin-top:10px;background:var(--navy);color:#fff;font-weight:700;font-size:20px;padding:4px 14px;border-radius:6px}\n.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0}\n.letters div{background:var(--navy);color:#fff;border-radius:12px;text-align:center;padding:12px 6px;font-size:18px}\n.letters b{display:block;font-family:\"Libre Baskerville\",serif;font-size:46px;color:var(--gold)}\n.lf{background:#fff;border:2px solid var(--sky);border-radius:12px;padding:12px 18px;margin:0 0 12px}\n.lf p{font-size:24px;margin:0}\n.lf .ans{margin-top:8px;font-size:20px;color:#2f6b2f;font-weight:600}\n.own{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n.own div{background:#fff;border:2px solid var(--sky);border-top:6px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:19px}\n.own b{display:block;font-family:\"Libre Baskerville\",serif;color:var(--navy);font-size:22px;margin-bottom:4px}\n.caselist li{font-size:21px;margin:5px 0}\n.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}\n.pair div{background:#fff;border:2px solid var(--sky);border-radius:10px;padding:10px 14px;font-size:20px}\n.pair b{color:var(--navy)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"prog\">\u003c/div>\n\u003cdiv id=\"stage\">\u003cdiv id=\"deck\">\n\n\u003c!-- 1 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"brand\">\u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\u003cdiv class=\"w\">APPROACH\u003csmall>International Student Center\u003c/small>\u003c/div>\u003c/div>\n  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px\">\n    \u003cdiv>\u003cdiv class=\"kick\">Ethics in a Global World · Week 6\u003c/div>\n    \u003ch1>Midterm Review\u003c/h1>\n    \u003cp class=\"muted\">Chapters 1–6 · Class 1 · 9:00–10:40\u003c/p>\u003c/div>\n    \u003cdiv style=\"text-align:center\">\u003cdiv id=\"qr\">\u003c/div>\u003cp style=\"font-size:16px;margin-top:8px\" class=\"muted\">Scan for your review worksheet\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Week 6\u003c/span>\u003cspan>1\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection class=\"slide\">\n  \u003cdiv class=\"kick\">Today\u003c/div>\n  \u003ch2>Review now, midterm after the break\u003c/h2>\n  \u003cdiv class=\"cols3\" style=\"margin-top:10px\">\n    \u003cdiv class=\"box\">\u003ch3>Class 1 · 9:00–10:40\u003c/h3>\u003cp>\u003cb>Midterm review\u003c/b>\u003c/p>\u003cp>Framework voices · Explain it! · Chapter 6 · Case clinic · Paragraph doctor · Game plan\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>Break · 10:40–11:10\u003c/h3>\u003cp>Look again at your two weakest topics.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>Class 2 · 11:10–12:50\u003c/h3>\u003cp>\u003cb>Midterm\u003c/b>\u003c/p>\u003cp>80 minutes · 50 points · closed-book. Bring a pen.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:26px\" class=\"muted\">Everything today is \u003cb>new\u003c/b>: new questions, a new case. The skills are the ones you'll need after the break.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Week 6 · Overview\u003c/span>\u003cspan>2\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Framework voices\u003c/h2>\n  \u003cp class=\"big\">Six managers are speaking. Which framework is each one using? Teams hold up a letter.\u003c/p>\n  \u003cdiv class=\"letters\">\n    \u003cdiv>\u003cb>U\u003c/b>Utilitarian\u003c/div>\u003cdiv>\u003cb>K\u003c/b>Kant\u003c/div>\u003cdiv>\u003cb>R\u003c/b>Rawls\u003c/div>\u003cdiv>\u003cb>A\u003c/b>Aristotle\u003c/div>\u003cdiv>\u003cb>C\u003c/b>Confucius\u003c/div>\u003cdiv>\u003cb>S\u003c/b>Stakeholder analysis\u003c/div>\n  \u003c/div>\n  \u003cp class=\"muted\">1 point for the right letter · 1 bonus point if you can say \u003cb>which words\u003c/b> told you.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>3\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Voices 1–2\u003c/h2>\n  \u003cdiv class=\"voice\">\u003cp>1. \"We'll release the update now. A few hundred users may lose some data, but millions will get a faster phone.\"\u003c/p>\u003cspan class=\"ans step\">U · Utilitarian: weighs results for the greatest number\u003c/span>\u003c/div>\n  \u003cdiv class=\"voice\">\u003cp>2. \"I won't tell customers the product is 'almost ready' when it isn't. Lying is wrong, even if it helps sales.\"\u003c/p>\u003cspan class=\"ans step\">K · Kant: duty; honesty no matter the result\u003c/span>\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>4\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Voices 3–4\u003c/h2>\n  \u003cdiv class=\"voice\">\u003cp>3. \"Before we choose the new bonus rules, imagine you don't know if you'll be a cleaner or a director.\"\u003c/p>\u003cspan class=\"ans step\">R · Rawls: the veil of ignorance\u003c/span>\u003c/div>\n  \u003cdiv class=\"voice\">\u003cp>4. \"A good leader is brave but not reckless, generous but not wasteful.\"\u003c/p>\u003cspan class=\"ans step\">A · Aristotle: virtues and the golden mean\u003c/span>\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>5\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag\">Engage\u003c/span>\n  \u003ch2>Voices 5–6\u003c/h2>\n  \u003cdiv class=\"voice\">\u003cp>5. \"I respect my manager like an older brother, but I owe him honest advice when he is wrong.\"\u003c/p>\u003cspan class=\"ans step\">C · Confucius: relationships, with loyalty to the truth\u003c/span>\u003c/div>\n  \u003cdiv class=\"voice\">\u003cp>6. \"First, let's list everyone this decision affects, and who has the most power and interest.\"\u003c/p>\u003cspan class=\"ans step\">S · Stakeholder analysis: the power–interest matrix\u003c/span>\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage\u003c/span>\u003cspan>6\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Five thinkers, five questions\u003c/div>\n  \u003ctable style=\"background:transparent;font-size:23px\">\n    \u003ctr>\u003cth style=\"width:30%\">Thinker\u003c/th>\u003cth>The question to ask about any decision\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd style=\"color:#fff\">Bentham and Mill\u003c/td>\u003ctd style=\"color:#fff\">Which choice creates the most good and the least harm, counting \u003cb class=\"gold\">everyone\u003c/b>?\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd style=\"color:#fff\">Kant\u003c/td>\u003ctd style=\"color:#fff\">Could everyone follow my rule? Am I using anyone \u003cb class=\"gold\">only as a tool\u003c/b>?\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd style=\"color:#fff\">Rawls\u003c/td>\u003ctd style=\"color:#fff\">Would I accept this if I didn't know \u003cb class=\"gold\">who I'd be\u003c/b>? Does it protect the weakest?\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd style=\"color:#fff\">Aristotle\u003c/td>\u003ctd style=\"color:#fff\">What would a \u003cb class=\"gold\">wise, honest\u003c/b> person do? Where is the middle way?\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd style=\"color:#fff\">Confucius\u003c/td>\u003ctd style=\"color:#fff\">What do I owe the people in my \u003cb class=\"gold\">relationships\u003c/b>? Am I keeping harmony honestly?\u003c/td>\u003c/tr>\n  \u003c/table>\n  \u003cp class=\"step\" style=\"margin-top:18px\">On the midterm: don't just \u003cb class=\"gold\">name\u003c/b> the thinker. \u003cb class=\"gold\">Use\u003c/b> the question on the case.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Engage · Ch. 2\u003c/span>\u003cspan>7\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection class=\"slide\" data-t=\"12\">\n  \u003cspan class=\"tag s\">Study · vocabulary game\u003c/span>\n  \u003ch2>Explain it! \u003cspan class=\"timechip\">12 min\u003c/span>\u003c/h2>\n  \u003col>\n    \u003cli>Groups of 3. Put the cards face down.\u003c/li>\n    \u003cli>Take a card. Explain the word in \u003cb>60 seconds\u003c/b> without saying the word or the \u003cb>two forbidden words\u003c/b>.\u003c/li>\n    \u003cli>Your group guesses. Correct guess = 1 point. Said a forbidden word = 0.\u003c/li>\n    \u003cli>Take turns. The card goes to the bottom if nobody guesses it.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"lang\">\u003cb>Try:\u003c/b> \"It's a kind of …\" · \"It's the opposite of …\" · \"It's what happens when …\" · \"For example, a company that …\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · Chapters 1–6\u003c/span>\u003cspan>8\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 9 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study\u003c/span>\n  \u003ch2>Don't mix them up\u003c/h2>\n  \u003cdiv class=\"pair\">\n    \u003cdiv class=\"step\">\u003cb>Enculturation\u003c/b> learning \u003ci>your own\u003c/i> culture\u003cbr>\u003cb>Acculturation\u003c/b> change when \u003ci>two\u003c/i> cultures meet\u003c/div>\n    \u003cdiv class=\"step\">\u003cb>Ethical minimum\u003c/b> the least the law allows\u003cbr>\u003cb>Ethical maximum\u003c/b> the best you could do\u003c/div>\n    \u003cdiv class=\"step\">\u003cb>Externality\u003c/b> a cost paid by people outside the deal\u003cbr>\u003cb>Tragedy of the commons\u003c/b> a shared resource used up by everyone\u003c/div>\n    \u003cdiv class=\"step\">\u003cb>CSR\u003c/b> real responsibility to society\u003cbr>\u003cb>Greenwashing\u003c/b> claims of responsibility that hide problems\u003c/div>\n    \u003cdiv class=\"step\">\u003cb>Stakeholder\u003c/b> anyone affected by the company\u003cbr>\u003cb>Stockholder\u003c/b> someone who owns shares\u003c/div>\n    \u003cdiv class=\"step\">\u003cb>Etiquette\u003c/b> manners; changes by culture\u003cbr>\u003cb>Ethics\u003c/b> right and wrong; harm to others\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study\u003c/span>\u003cspan>9\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 10 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study · Chapter 6\u003c/span>\n  \u003ch2>What do employers owe employees?\u003c/h2>\n  \u003cdiv class=\"own\">\n    \u003cdiv>\u003cb>A safe workplace\u003c/b>Safe machines and conditions; no harassment. \u003cspan class=\"muted\">OSHA (6.1)\u003c/span>\u003c/div>\n    \u003cdiv>\u003cb>A fair wage\u003c/b>Pay equity; the gender pay gap; the \u003cb>pay ratio\u003c/b>. \u003cspan class=\"muted\">(6.2)\u003c/span>\u003c/div>\n    \u003cdiv>\u003cb>A voice\u003c/b>The right to join a \u003cb>union\u003c/b>; \u003cb>collective bargaining\u003c/b>. \u003cspan class=\"muted\">(6.3)\u003c/span>\u003c/div>\n    \u003cdiv>\u003cb>Privacy\u003c/b>Limits on \u003cb>monitoring\u003c/b>; legal is not always ethical. \u003cspan class=\"muted\">(6.4)\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"step\" style=\"margin-top:22px\">\u003cb>Employment at will:\u003c/b> in most U.S. states, either side can end a job at any time, without a reason, unless a contract says otherwise. It's still illegal to fire someone for discrimination or for organizing.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · Ch. 6\u003c/span>\u003cspan>10\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 11 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Study · Chapter 6\u003c/span>\n  \u003ch2>Legal? Fair?\u003c/h2>\n  \u003cp class=\"big\">For each situation, hold up two cards:\u003c/p>\n  \u003cdiv class=\"cols\" style=\"margin-top:6px\">\n    \u003cdiv class=\"box\">\u003ch3>Is it legal?\u003c/h3>\u003cp class=\"big\">Legal · Not legal · It depends\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\" style=\"border-top-color:var(--gold)\">\u003ch3>Is it fair?\u003c/h3>\u003cp class=\"big\">Fair · Not fair · Debatable\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"q step\" style=\"margin-top:22px\">Watch for the situations where your two answers are \u003cb>different\u003c/b>.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · Ch. 6\u003c/span>\u003cspan>11\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 12 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Legal? Fair?\u003c/span>\n  \u003ch2>Situations 1–3\u003c/h2>\n  \u003cdiv class=\"lf\">\u003cp>1. A warehouse records every minute a worker is away from their station, including bathroom breaks. Workers signed a form agreeing to monitoring.\u003c/p>\u003cdiv class=\"ans step\">Usually legal (consent) · Fair? Debatable · monitoring / privacy\u003c/div>\u003c/div>\n  \u003cdiv class=\"lf\">\u003cp>2. A manager fires an employee without giving any reason. There is no contract.\u003c/p>\u003cdiv class=\"ans step\">Usually legal · Fair? Often not · employment at will\u003c/div>\u003c/div>\n  \u003cdiv class=\"lf\">\u003cp>3. Two engineers do the same job. The woman earns 18% less than the man.\u003c/p>\u003cdiv class=\"ans step\">Not legal · Not fair · fair wage / pay gap\u003c/div>\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · Ch. 6\u003c/span>\u003cspan>12\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 13 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag s\">Legal? Fair?\u003c/span>\n  \u003ch2>Situations 4–6\u003c/h2>\n  \u003cdiv class=\"lf\">\u003cp>4. A factory has no safety guards on its cutting machines. Two workers were hurt this year.\u003c/p>\u003cdiv class=\"ans step\">Not legal · Not fair · OSHA\u003c/div>\u003c/div>\n  \u003cdiv class=\"lf\">\u003cp>5. Workers vote to form a union. The company holds meetings and tells them a union is a bad idea.\u003c/p>\u003cdiv class=\"ans step\">It depends: opinions are allowed; threats or firing are not · union / collective bargaining\u003c/div>\u003c/div>\n  \u003cdiv class=\"lf\">\u003cp>6. A CEO earns $9 million a year. The average worker earns $45,000. What is the pay ratio?\u003c/p>\u003cdiv class=\"ans step\">200 to 1 · Legal · Fair? Debatable · pay ratio\u003c/div>\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Study · Ch. 6\u003c/span>\u003cspan>13\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 14 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Activate · case clinic\u003c/span>\n  \u003ch2>QuickRoute \u003cspan class=\"muted\" style=\"font-size:22px\">(a fictional company)\u003c/span>\u003c/h2>\n  \u003cp style=\"font-size:22px;margin-bottom:6px\">A food-delivery app in six countries with 40,000 drivers. It has never made a profit; investors want one \u003cb>this year\u003c/b>. The CEO announces:\u003c/p>\n  \u003col class=\"caselist\">\n    \u003cli>\u003cb>SmartTrack:\u003c/b> records drivers' location, speed and breaks, and keeps recording for 30 minutes after they log off. Contracts allow monitoring.\u003c/li>\n    \u003cli>\u003cb>New pay:\u003c/b> from $18 an hour to $4 per delivery. Average pay falls about 12%; the fastest drivers earn more.\u003c/li>\n    \u003cli>\u003cb>Tipping:\u003c/b> in Country Y, where tipping is unusual, the app asks every customer for 15%. Many say it feels pushy.\u003c/li>\n    \u003cli>\u003cb>Organizing:\u003c/b> drivers in two cities are organizing to negotiate together. A manager suggests removing the \"troublemakers.\"\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"muted\" style=\"font-size:20px\">City councils are discussing new rules for delivery apps.\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · Chapters 1–6\u003c/span>\u003cspan>14\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 15 -->\n\u003csection class=\"slide\" data-t=\"12\">\n  \u003cspan class=\"tag a\">Activate · case clinic\u003c/span>\n  \u003ch2>Four tools, four roles \u003cspan class=\"timechip\">12 min\u003c/span>\u003c/h2>\n  \u003cdiv class=\"cols4\" style=\"margin-top:6px\">\n    \u003cdiv class=\"box\">\u003ch3>1 · Stakeholder mapper\u003c/h3>\u003cp>Five stakeholders, their types, and who has high power and high interest\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>2 · Minimum and maximum\u003c/h3>\u003cp>The ethical minimum and maximum; short-term vs. long-term\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>3 · Culture and workplace\u003c/h3>\u003cp>Tipping: etiquette or ethics? Which changes raise Chapter 6 issues?\u003c/p>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>4 · Framework judge\u003c/h3>\u003cp>Two frameworks on one change. Do they agree?\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:20px\">Groups of 4. Work alone on your role (7 min), then share and agree a \u003cb>group verdict\u003c/b> (5 min): which change should QuickRoute drop or fix first?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>15\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 16 -->\n\u003csection class=\"slide\" data-t=\"8\">\n  \u003cspan class=\"tag a\">Activate\u003c/span>\n  \u003ch2>Verdicts \u003cspan class=\"timechip\">1 min per group\u003c/span>\u003c/h2>\n  \u003cp class=\"big\">Each group: your verdict in two sentences, plus \u003cb>one\u003c/b> tool that helped most.\u003c/p>\n  \u003cp class=\"big\">Listeners: one challenge per group.\u003c/p>\n  \u003cdiv class=\"lang\">\u003cb>Challenge politely:\u003c/b> \"Have you considered …?\" · \"What about the drivers who …?\" · \"I see your point, but from a ___ perspective …\"\u003c/div>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate\u003c/span>\u003cspan>16\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 17 -->\n\u003csection class=\"slide\" data-t=\"6\">\n  \u003cspan class=\"tag a\">Activate · paragraph doctor\u003c/span>\n  \u003ch2>\"Should QuickRoute keep tracking drivers after they log off?\"\u003c/h2>\n  \u003cdiv class=\"cols\" style=\"gap:18px\">\n    \u003cdiv class=\"para bad\">\u003cb>A.\u003c/b> QuickRoute should stop tracking drivers after they log off. Drivers are not working at that time, so their time belongs to them. The case says the app keeps recording for 30 minutes after a driver logs off. Kant's ethics is about duty and the categorical imperative. Therefore, QuickRoute should change the app.\u003c/div>\n    \u003cdiv class=\"para bad\">\u003cb>B.\u003c/b> Tracking can be good and bad. Some people think safety is important, but other people think privacy is important. From a utilitarian perspective, we should think about the most good for the most people. Some people may say the company needs data. However, drivers also have rights. In conclusion, it depends.\u003c/div>\n  \u003c/div>\n  \u003cp style=\"margin-top:14px\">Pairs: which of the six parts does each paragraph \u003cb>really\u003c/b> have? \u003cspan class=\"timechip\">6 min\u003c/span>\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · writing\u003c/span>\u003cspan>17\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 18 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Paragraph doctor\u003c/span>\n  \u003ch2>The diagnosis\u003c/h2>\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"box step\">\u003ch3>Paragraph A\u003c/h3>\u003cp>Has: position, reason, evidence, conclusion.\u003c/p>\u003cp>\u003cb>Missing:\u003c/b> the framework is only \u003cb>defined\u003c/b>, not applied. No counterargument.\u003c/p>\u003c/div>\n    \u003cdiv class=\"box step\" style=\"border-top-color:var(--gold)\">\u003ch3>Paragraph B\u003c/h3>\u003cp>Has: a weak counterargument.\u003c/p>\u003cp>\u003cb>Missing:\u003c/b> a position, evidence, a framework applied, a real conclusion. \u003cb>\"It depends\" is not a conclusion.\u003c/b>\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"step\" style=\"margin-top:18px\">Now choose one paragraph and rewrite \u003cb>one\u003c/b> missing part (worksheet §5).\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · writing\u003c/span>\u003cspan>18\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 19 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag a\">Apply, don't define\u003c/span>\n  \u003ch2>From a definition to an argument\u003c/h2>\n  \u003cdiv class=\"fix\">\n    \u003cdiv>\"Rawls says we should choose rules behind a veil of ignorance.\"\u003c/div>\n    \u003cdiv class=\"ok step\">\"Behind the veil of ignorance, a manager wouldn't know if she'd be a fast driver or a slow one, so she wouldn't accept a system that cuts average pay by 12%.\"\u003c/div>\n    \u003cdiv>\"Utilitarianism means the greatest good for the greatest number.\"\u003c/div>\n    \u003cdiv class=\"ok step\">\"A utilitarian would count 40,000 drivers losing pay against investors gaining profit, and would likely say the new pay creates more harm than good.\"\u003c/div>\n  \u003c/div>\n  \u003cp class=\"step\" style=\"margin-top:16px\">The test: does your sentence mention a \u003cb>fact from the case\u003c/b>?\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Activate · writing\u003c/span>\u003cspan>19\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 20 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag b\">Game plan\u003c/span>\n  \u003ch2>The midterm after the break\u003c/h2>\n  \u003ctable>\n    \u003ctr>\u003cth>Part\u003c/th>\u003cth>Points\u003c/th>\u003cth>What you do\u003c/th>\u003cth>Time\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>A · Vocabulary\u003c/td>\u003ctd>12\u003c/td>\u003ctd>Match words and meanings; complete sentences from a box\u003c/td>\u003ctd>10 min\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B · Short answer\u003c/td>\u003ctd>15\u003c/td>\u003ctd>Five questions: explain + give an example (2–3 sentences)\u003c/td>\u003ctd>20 min\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>C · Case analysis\u003c/td>\u003ctd>23\u003c/td>\u003ctd>A new case: stakeholders, minimum/maximum, culture, frameworks, one paragraph (120–150 words)\u003c/td>\u003ctd>50 min\u003c/td>\u003c/tr>\n  \u003c/table>\n  \u003cp class=\"muted\" style=\"margin-top:14px\">80 minutes · 50 points · no phones, notes or translation tools\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Game plan\u003c/span>\u003cspan>20\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 21 -->\n\u003csection class=\"slide\">\n  \u003cspan class=\"tag b\">Game plan\u003c/span>\n  \u003ch2>Six tips\u003c/h2>\n  \u003col>\n    \u003cli class=\"step\">Read the case \u003cb>twice\u003c/b>. Underline numbers and facts.\u003c/li>\n    \u003cli class=\"step\">Answer \u003cb>every part\u003c/b> of each question. Short is fine; empty gets 0.\u003c/li>\n    \u003cli class=\"step\">Every short answer needs an \u003cb>explanation + an example\u003c/b>.\u003c/li>\n    \u003cli class=\"step\">\u003cb>Use\u003c/b> frameworks on the case. Don't only define them.\u003c/li>\n    \u003cli class=\"step\">Paragraph: check all \u003cb>six parts\u003c/b> before you finish.\u003c/li>\n    \u003cli class=\"step\">Watch the clock: start Part C by about \u003cb>11:45\u003c/b>.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Game plan\u003c/span>\u003cspan>21\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c!-- 22 -->\n\u003csection class=\"slide dark\">\n  \u003cdiv class=\"kick\">Before the break\u003c/div>\n  \u003ch2>Rate yourself 1–3 on each chapter\u003c/h2>\n  \u003cp class=\"big\">Worksheet §6. Choose your \u003cb class=\"gold\">two\u003c/b> lowest. Look at them again during the break.\u003c/p>\n  \u003cp class=\"q step\" style=\"margin-top:20px\">Break · 10:40–11:10\u003c/p>\n  \u003cp class=\"step big\">Midterm starts at \u003cb class=\"gold\">11:10\u003c/b>. Phones away, pen ready. Good luck!\u003c/p>\n  \u003cdiv class=\"foot\">\u003cspan>Class 1 · Close\u003c/span>\u003cspan>22\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003c/div>\u003c/div>\n\u003cdiv id=\"timer\" title=\"Click to pause; double-click to hide\">\u003c/div>\n\u003cdiv id=\"help\">← → or tap · T timer · F fullscreen\u003c/div>\n\u003cscript>\nconst slides=[...document.querySelectorAll('.slide')];\nlet i=0;\nfunction fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('deck').style.transform=`scale(${s})`}\naddEventListener('resize',fit);fit();\nfunction show(n,back){\n  i=Math.max(0,Math.min(slides.length-1,n));\n  slides.forEach((s,k)=>s.classList.toggle('on',k===i));\n  slides[i].querySelectorAll('.step').forEach(e=>e.classList.toggle('shown',!!back));\n  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';\n  try{history.replaceState(null,'','#'+(i+1))}catch(e){}\n}\nfunction next(){const h=slides[i].querySelector('.step:not(.shown)');if(h){h.classList.add('shown');return}if(i\u003cslides.length-1)show(i+1)}\nfunction prev(){const s=[...slides[i].querySelectorAll('.step.shown')];if(s.length){s[s.length-1].classList.remove('shown');return}if(i>0)show(i-1,true)}\naddEventListener('keydown',e=>{\n  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}\n  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}\n  else if(e.key==='t'||e.key==='T')startTimer();\n  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}\n  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);\n});\ndocument.getElementById('stage').addEventListener('click',e=>{if(e.clientX\u003cinnerWidth/3)prev();else next()});\nlet tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});\naddEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx\u003c0?next():prev();e.preventDefault()}tx=null});\n/* timer */\nconst T=document.getElementById('timer');let left=0,run=null,paused=false;\nfunction fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}\nfunction startTimer(){const m=+(slides[i].dataset.t||5);left=m*60;paused=false;T.classList.remove('done');T.style.display='block';T.textContent=fmt(left);clearInterval(run);run=setInterval(()=>{if(paused)return;left--;T.textContent=fmt(Math.max(0,left));if(left\u003c=0){clearInterval(run);T.classList.add('done');T.textContent=\"Time!\"}},1000)}\nT.addEventListener('click',e=>{e.stopPropagation();paused=!paused;T.style.opacity=paused?.6:1});\nT.addEventListener('dblclick',e=>{e.stopPropagation();clearInterval(run);T.style.display='none'});\n/* QR */\ntry{const url=(function(){try{if(parent!==window)return parent.location.href.split('#')[0].replace(/[^\\/]*$/,'students.html')+'#worksheet'}catch(e){}return location.href.split('#')[0].replace(/review-slides\\.html.*$/,'review-worksheet.html')})();if(window.QRCode&&/^https?:/.test(url))new QRCode(document.getElementById('qr'),{text:url,width:170,height:170,colorDark:'#143865',colorLight:'#ffffff'});else document.getElementById('qr').closest('div[style]').style.display='none'}catch(e){}\nshow(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "jeopardy": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Ethics Jeopardy · Midterm Review\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-d:#8c7535;--sky:#c1cddd;--sky3:#edf2f9;--ink:#1a2233;--ok:#2f6b2f;--no:#a33a2a}\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%}\nbody{font-family:\"Source Sans 3\",system-ui,sans-serif;background:#0b1d36;color:#fff;display:flex;flex-direction:column;min-height:100vh}\nheader{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);border-bottom:4px solid var(--gold)}\nheader img{height:40px;border-radius:6px}\nheader h1{font-family:\"Libre Baskerville\",serif;font-size:clamp(18px,2.4vw,28px);margin:0;flex:1}\nheader h1 small{display:block;font-family:\"Source Sans 3\",sans-serif;font-size:13px;color:var(--sky);font-weight:600;letter-spacing:.06em}\n.hbtn{background:transparent;color:var(--sky);border:1px solid #3c5f8c;border-radius:6px;padding:6px 12px;font:600 14px \"Source Sans 3\",sans-serif;cursor:pointer}\n.hbtn:hover{color:#fff;border-color:var(--sky)}\nmain{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:12px}\n#board{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:8px;min-height:420px}\n.cat{background:var(--navy);border-bottom:4px solid var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-family:\"Libre Baskerville\",serif;font-weight:700;font-size:clamp(12px,1.35vw,19px);line-height:1.2}\n.cat small{display:block;font-family:\"Source Sans 3\",sans-serif;font-size:.72em;color:var(--gold);letter-spacing:.08em;font-weight:700;margin-bottom:3px}\n.cell{background:var(--blue);border:0;border-radius:8px;color:var(--gold);font:700 clamp(22px,3.4vw,48px) \"Libre Baskerville\",serif;cursor:pointer;transition:transform .12s,background .12s}\n.cell:hover{background:#2560a8;transform:scale(1.03)}\n.cell.used{background:#13284a;color:#2b4366;cursor:default;transform:none}\n#scores{display:flex;gap:10px;flex-wrap:wrap}\n.team{flex:1;min-width:150px;background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;border-top:5px solid var(--gold)}\n.team .nm{flex:1;font-weight:700;font-size:17px;color:var(--navy);border:0;background:transparent;font-family:inherit;min-width:0;width:100%}\n.team .sc{font:700 26px \"Libre Baskerville\",serif;color:var(--navy);min-width:60px;text-align:right}\n.team .sc.neg{color:var(--no)}\n.team button{border:1px solid var(--sky);background:#fff;border-radius:6px;width:30px;height:30px;font-weight:700;cursor:pointer;color:var(--navy)}\n#ov{position:fixed;inset:0;background:rgba(6,16,32,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}\n#ov.on{display:flex}\n.card{background:var(--blue);border:3px solid var(--gold);border-radius:16px;width:min(1100px,100%);min-height:min(560px,90vh);padding:28px 40px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}\n.card .meta{display:flex;justify-content:space-between;color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:16px}\n.card .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:\"Libre Baskerville\",serif;font-size:clamp(22px,3.3vw,44px);line-height:1.3;padding:20px 0}\n.card .a{display:none;background:#fff;color:var(--ink);border-radius:10px;padding:14px 20px;font-size:clamp(17px,2vw,26px);line-height:1.4;margin-bottom:14px}\n.card .a b{color:var(--ok)}\n.card.reveal .a{display:block}\n.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}\n.btn{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:10px 18px;font:700 17px \"Source Sans 3\",sans-serif;cursor:pointer}\n.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}\n.btn.ok{background:#e6f1e3;color:var(--ok)}\n.btn.no{background:#f7e3df;color:var(--no)}\n.award{display:none;flex-direction:column;gap:8px;margin-top:6px}\n.card.reveal .award{display:flex}\n.award .tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}\n.award .t{background:rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px}\n.award .t span{flex:1;font-weight:700}\n.award .t button{padding:6px 10px;font-size:15px}\n#timer{font:700 26px \"Source Sans 3\",sans-serif;color:var(--navy);background:var(--gold);border-radius:8px;padding:2px 12px;min-width:70px;text-align:center}\n#timer.done{background:var(--no);color:#fff}\n.dd{font-family:\"Libre Baskerville\",serif;color:var(--gold);font-size:clamp(34px,5vw,64px);text-align:center;margin:10px 0}\n.wager{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:18px}\n.wager select,.wager input{font:inherit;padding:8px;border-radius:6px;border:0}\n.wager input{width:120px}\n#setup .card{min-height:auto}\n#setup label{display:block;margin:10px 0 4px;font-weight:700}\n#setup input,#setup select{font:inherit;font-size:18px;padding:8px 10px;border-radius:6px;border:0;width:100%}\n#names{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}\n.help{color:var(--sky);font-size:14px;margin:0}\n@media (max-width:700px){header{flex-wrap:wrap}header h1{flex-basis:60%}.hbtn{padding:5px 8px;font-size:13px}#board{grid-template-columns:repeat(3,1fr)}.card{padding:18px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cimg src=\"__LOGO__\" alt=\"\" onerror=\"this.remove()\">\n  \u003ch1>Ethics Jeopardy\u003csmall>MIDTERM REVIEW · CHAPTERS 1–6\u003c/small>\u003c/h1>\n  \u003cbutton class=\"hbtn\" onclick=\"openFinal()\">Final round\u003c/button>\n  \u003cbutton class=\"hbtn\" onclick=\"openSetup()\">Teams\u003c/button>\n  \u003cbutton class=\"hbtn\" onclick=\"resetGame()\">New game\u003c/button>\n  \u003cbutton class=\"hbtn\" onclick=\"document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()\">Fullscreen\u003c/button>\n\u003c/header>\n\u003cmain>\n  \u003cdiv id=\"board\">\u003c/div>\n  \u003cdiv id=\"scores\">\u003c/div>\n\u003c/main>\n\n\u003cdiv id=\"ov\">\u003cdiv class=\"card\" id=\"qcard\">\n  \u003cdiv class=\"meta\">\u003cspan id=\"qcat\">\u003c/span>\u003cspan id=\"timer\">0:30\u003c/span>\u003cspan id=\"qval\">\u003c/span>\u003c/div>\n  \u003cdiv id=\"ddbox\">\u003c/div>\n  \u003cdiv class=\"q\" id=\"qtext\">\u003c/div>\n  \u003cdiv class=\"a\" id=\"atext\">\u003c/div>\n  \u003cdiv class=\"row\" id=\"ctrl\">\n    \u003cbutton class=\"btn ghost\" onclick=\"startTimer(30)\">30 s\u003c/button>\n    \u003cbutton class=\"btn ghost\" onclick=\"startTimer(60)\">60 s\u003c/button>\n    \u003cbutton class=\"btn\" id=\"revealBtn\" onclick=\"reveal()\">Show answer\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"award\">\n    \u003cp class=\"help\" style=\"text-align:center\" id=\"ahelp\">Wrong answer? Take points away, then let another team steal.\u003c/p>\n    \u003cdiv class=\"tl\" id=\"award\">\u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton class=\"btn\" onclick=\"closeQ(true)\">Done · back to board\u003c/button>\u003cbutton class=\"btn ghost\" onclick=\"closeQ(false)\">Cancel (keep square open)\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv id=\"setup\" style=\"position:fixed;inset:0;background:rgba(6,16,32,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:30\">\n  \u003cdiv class=\"card\" style=\"max-width:720px\">\n    \u003cdiv class=\"meta\">\u003cspan>Set up teams\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n    \u003clabel for=\"nteams\">Number of teams\u003c/label>\n    \u003cselect id=\"nteams\" onchange=\"drawNames()\">\u003coption>2\u003c/option>\u003coption selected>3\u003c/option>\u003coption>4\u003c/option>\u003coption>5\u003c/option>\u003coption>6\u003c/option>\u003c/select>\n    \u003clabel>Team names\u003c/label>\n    \u003cdiv id=\"names\">\u003c/div>\n    \u003cp class=\"help\" style=\"margin-top:12px\">Teams take turns choosing a square. The team that chooses answers first (30 seconds to agree). A wrong answer loses the points, and other teams can steal. Two squares are hidden \u003cb>Daily Doubles\u003c/b>: the choosing team bets up to its score (or 500).\u003c/p>\n    \u003cdiv class=\"row\" style=\"margin-top:16px\">\u003cbutton class=\"btn\" onclick=\"saveSetup()\">Start\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst CATS=[\n {t:\"Why Ethics Matter\",c:\"Chapter 1\",q:[\n  [\"The word for how closely a company follows laws and regulations.\",\"\u003cb>Compliance\u003c/b>.\"],\n  [\"The unwritten agreement that a business should give something back to the society that allows it to operate.\",\"\u003cb>The social
