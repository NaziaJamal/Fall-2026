rcles\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p5\">The Accommodation Desk\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p6\">The Payslip\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p7\">Would you rather?\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p8\">Same Job, Four Rulebooks\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p9\">The Board Asks\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p10\">From red lines to a code\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#p11\">Exit ticket and homework\u003c/a>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"read\">\n\u003ch2>What to read in the book\u003c/h2>\n\u003cp>\u003ci>Business Ethics\u003c/i> (OpenStax), Chapter 8. The book is free online; click a section to open it. Page numbers are from the PDF.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Section\u003c/th>\u003cth>Pages\u003c/th>\u003cth>Read for\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-introduction\" target=\"_blank\" rel=\"noopener\">Chapter 8 introduction\u003c/a>\u003c/td>\u003ctd>p. 231\u003c/td>\u003ctd>Before class (short)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-1-diversity-and-inclusion-in-the-workforce\" target=\"_blank\" rel=\"noopener\">8.1 Diversity and Inclusion in the Workforce\u003c/a>\u003c/td>\u003ctd>pp. 232–238\u003c/td>\u003ctd>\u003cb>Before class.\u003c/b> Parts 1–3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-2-accommodating-different-abilities-and-faiths\" target=\"_blank\" rel=\"noopener\">8.2 Accommodating Different Abilities and Faiths\u003c/a>\u003c/td>\u003ctd>pp. 239–243\u003c/td>\u003ctd>The Accommodation Desk (Part 4)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-3-sexual-identification-and-orientation\" target=\"_blank\" rel=\"noopener\">8.3 Sexual Identification and Orientation\u003c/a>\u003c/td>\u003ctd>pp. 244–246\u003c/td>\u003ctd>Discussion circles, round 3. \u003cb>Read the online version\u003c/b>: it includes the 2020 Supreme Court decision.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-4-income-inequalities\" target=\"_blank\" rel=\"noopener\">8.4 Income Inequalities\u003c/a>\u003c/td>\u003ctd>pp. 247–251\u003c/td>\u003ctd>Parts 5–8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-5-animal-rights-and-the-implications-for-business\" target=\"_blank\" rel=\"noopener\">8.5 Animal Rights and the Implications for Business\u003c/a>\u003c/td>\u003ctd>from p. 252\u003c/td>\u003ctd>Would you rather, card 2 (Part 6)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"https://openstax.org/books/business-ethics/pages/8-key-terms\" target=\"_blank\" rel=\"noopener\">Key terms\u003c/a> · \u003ca href=\"https://openstax.org/books/business-ethics/pages/8-summary\" target=\"_blank\" rel=\"noopener\">Summary\u003c/a>\u003c/td>\u003ctd>end of chapter\u003c/td>\u003ctd>Quiz 3 review\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003ch2 style=\"border:0;margin-bottom:0\">Class 1 · Invited is not included\u003c/h2>\n\n\u003csection id=\"p1\">\n\u003ch2>1 · The Meeting Nobody Noticed\u003c/h2>\n\u003cp>Your group is Meridian Freight's planning team (fictional). Choose ONE option for the annual team day: \u003cb>(A)\u003c/b> an evening dinner with drinks downtown; \u003cb>(B)\u003c/b> a Saturday volunteer day at a food bank; \u003cb>(C)\u003c/b> a weekday afternoon workshop with lunch. Follow your secret role card.\u003c/p>\n\u003clabel>Our decision and reason\u003c/label>\u003cinput type=\"text\" data-k=\"p1a\">\n\u003clabel>After the reveal: who was not heard, and what did the group miss?\u003c/label>\u003ctextarea data-k=\"p1b\">\u003c/textarea>\n\u003clabel>One change to the meeting format that would have helped\u003c/label>\u003cinput type=\"text\" data-k=\"p1c\">\n\u003c/section>\n\n\u003csection id=\"p2\">\n\u003ch2>2 · Invited vs. included, and Data Detective\u003c/h2>\n\u003ch3>Invited vs. included\u003c/h3>\n\u003cp class=\"case\">\"Diversity is being invited to the party; inclusion is being asked to dance.\" (Howard J. Ross, quoted in section 8.1)\u003c/p>\n\u003clabel>Diversity means… (your own words)\u003c/label>\u003cinput type=\"text\" data-k=\"p2a\">\n\u003clabel>Inclusion means… (your own words)\u003c/label>\u003cinput type=\"text\" data-k=\"p2b\">\n\u003clabel>An inclusive practice I have seen (or would like to see) in my field\u003c/label>\u003ctextarea data-k=\"p2c\">\u003c/textarea>\n\u003ch3>Data Detective\u003c/h3>\n\u003cp>In the McKinsey study (book, Figure 8.4), companies in the \u003cb>top quarter for gender diversity\u003c/b> were \u003cb>15% more likely\u003c/b> to have financial returns above their industry median. For \u003cb>ethnic diversity\u003c/b>, they were \u003cb>35% more likely\u003c/b>. Companies in the top quarter for executive or board diversity had returns on equity more than 50% higher than the bottom quarter. The book adds: \"positive correlations do not equal causation.\"\u003c/p>\n\u003cp>Judge each headline. Then check.\u003c/p>\n\u003cdiv id=\"dd\">\u003c/div>\n\u003cbutton class=\"btn g noprint\" onclick=\"checkSet('d')\">Check my answers\u003c/button> \u003cspan id=\"d-score\" class=\"res\">\u003c/span>\n\u003clabel>If diversity doesn't directly \u003ci>cause\u003c/i> better results, what else could explain the link?\u003c/label>\u003ctextarea data-k=\"p3x\">\u003c/textarea>\n\u003c/section>\n\n\u003csection id=\"p4\">\n\u003ch2>3 · Discussion circles\u003c/h2>\n\u003cp>\u003cb>Ground rules:\u003c/b> speak from a workplace you know, not for a country or group · no one has to share personal information · challenge ideas, not people · one pass per round.\u003c/p>\n\u003cp>\u003cb>Roles\u003c/b> (rotate each round): Facilitator · Clarifier · Complicator · Book connector · Reporter\u003c/p>\n\u003cdetails>\u003csummary>Round 1 · Speech or conduct? (book, 8.1)\u003c/summary>\n\u003cp>In 2017, a senior Google engineer wrote an internal memo criticizing the company's diversity programs. It said women's underrepresentation in tech had partly \"biological causes\". It leaked and Google fired him. In 2018, the National Labor Relations Board found the firing was lawful: he was dismissed for conduct that demeaned women. The book notes there is no right of free speech in a private-sector workplace.\u003c/p>\n\u003cul>\u003cli>Should employees be free to criticize their company's diversity programs at work?\u003c/li>\u003cli>Where is the line between an opinion and conduct that harms colleagues?\u003c/li>\u003cli>Would it matter if he had sent it only to his manager?\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails>\u003csummary>Round 2 · When the wind changes (book + outside source)\u003c/summary>\n\u003cp>\u003cb>Book:\u003c/b> from 2014, tech companies published diversity numbers; more than 30 signed a diversity pledge, and Google pledged more than $100 million. \u003cb>Outside the book (Feb. 2025):\u003c/b> Google stopped setting hiring targets for representation, citing court decisions and U.S. executive orders. Meta, Amazon and Target also scaled back programs; Costco and Delta said they would continue theirs.\u003c/p>\n\u003cul>\u003cli>Should a company's values change when the law or political pressure changes?\u003c/li>\u003cli>Is a hiring target the same thing as inclusion?\u003c/li>\u003cli>Which stakeholders gain and which lose under each choice?\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails>\u003csummary>Round 3 · Your teacher's card\u003c/summary>\n\u003cp>Your teacher will give you the Round 3 card.\u003c/p>\u003c/details>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Round\u003c/th>\u003cth>My role\u003c/th>\u003cth>Best point I heard\u003c/th>\u003cth>Our \"It depends on…\" sentence\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003cselect data-k=\"p4r1\">\u003coption value=\"\">Role…\u003c/option>\u003coption>Facilitator\u003c/option>\u003coption>Clarifier\u003c/option>\u003coption>Complicator\u003c/option>\u003coption>Book connector\u003c/option>\u003coption>Reporter\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4b1\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4d1\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003cselect data-k=\"p4r2\">\u003coption value=\"\">Role…\u003c/option>\u003coption>Facilitator\u003c/option>\u003coption>Clarifier\u003c/option>\u003coption>Complicator\u003c/option>\u003coption>Book connector\u003c/option>\u003coption>Reporter\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4b2\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4d2\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003cselect data-k=\"p4r3\">\u003coption value=\"\">Role…\u003c/option>\u003coption>Facilitator\u003c/option>\u003coption>Clarifier\u003c/option>\u003coption>Complicator\u003c/option>\u003coption>Book connector\u003c/option>\u003coption>Reporter\u003c/option>\u003c/select>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4b3\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"p4d3\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003clabel>Did you change your mind about anything? What changed it?\u003c/label>\u003cinput type=\"text\" data-k=\"p4m\">\n\u003c/section>\n\n\u003csection id=\"p5\">\n\u003ch2>4 · The Accommodation Desk\u003c/h2>\n\u003ch3>Warm-up: Which rule?\u003c/h3>\n\u003cdiv id=\"wr\">\u003c/div>\n\u003cbutton class=\"btn g noprint\" onclick=\"checkSet('w')\">Check my answers\u003c/button> \u003cspan id=\"w-score\" class=\"res\">\u003c/span>\n\u003ch3>The desk\u003c/h3>\n\u003cp>Roles: \u003cb>Employee\u003c/b> (presents the request) · \u003cb>Operations manager\u003c/b> (raises one practical concern) · \u003cb>HR partner\u003c/b> (asks one question, then decides). Rotate roles after each request.\u003c/p>\n\u003cdiv id=\"desk\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p6\">\n\u003ch2>5 · The Payslip (exit ticket, Class 1)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Dana Reyes\u003c/th>\u003cth>Marco Bianchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Title\u003c/td>\u003ctd>Customer Insights Analyst\u003c/td>\u003ctd>Logistics Data Analyst\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Annual salary\u003c/td>\u003ctd>$68,000\u003c/td>\u003ctd>$76,000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Experience\u003c/td>\u003ctd>4 years\u003c/td>\u003ctd>4 years\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Work\u003c/td>\u003ctd colspan=\"2\">Both build dashboards, present findings to clients and supervise one intern. Different teams, different titles.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003clabel>Is this fair?\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p6a\" data-k=\"p6a\" value=\"Yes\"> Yes\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p6a\" data-k=\"p6a\" value=\"No\"> No\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p6a\" data-k=\"p6a\" value=\"It depends\"> It depends\u003c/label>\u003c/div>\n\u003cinput type=\"text\" data-k=\"p6ar\" placeholder=\"Because…\">\n\u003clabel>Is this legal?\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p6b\" data-k=\"p6b\" value=\"Yes\"> Yes\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p6b\" data-k=\"p6b\" value=\"No\"> No\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p6b\" data-k=\"p6b\" value=\"It depends\"> It depends\u003c/label>\u003c/div>\n\u003cinput type=\"text\" data-k=\"p6br\" placeholder=\"Because…\">\n\u003c/section>\n\n\u003ch2 style=\"border:0;margin-bottom:0\">Class 2 · Rights across borders\u003c/h2>\n\n\u003csection id=\"p7\">\n\u003ch2>6 · Would you rather?\u003c/h2>\n\u003cp>\u003cb>Switch rule:\u003c/b> after each side gives one argument, you may walk to the other side.\u003c/p>\n\u003cdiv id=\"wyr\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p8\">\n\u003ch2>7 · Same Job, Four Rulebooks\u003c/h2>\n\u003cdetails open>\u003csummary>The case: Dana and Marco (fictional)\u003c/summary>\n\u003cp class=\"case\">Meridian Freight hired Dana Reyes three years ago as a Customer Insights Analyst. Her starting offer was based on her previous salary. Marco Bianchi joined a year later as a Logistics Data Analyst. He negotiated a higher starting salary. Both have the same level of degree and four years' experience. Both build dashboards, present findings to clients and supervise one intern. Dana now earns $68,000; Marco earns $76,000. Dana found out when a colleague mentioned Marco's salary. Meridian has offices in New Jersey, Minnesota, Germany and other countries.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Rulebook A · U.S. federal law (book 8.4 + update)\u003c/summary>\u003cdiv class=\"rule\">\n\u003cul>\u003cli>Federal standard: \u003cb>\"equal pay for equal work\"\u003c/b>. The jobs must be equal.\u003c/li>\u003cli>Women are paid about 80% of what men are paid (AAUW and Pew studies, cited in the book).\u003c/li>\u003cli>Federal minimum wage: $7.25 per hour. \u003ci>Update (outside the book):\u003c/i> still $7.25 in 2026, unchanged since 2009; about 30 states and Washington, D.C. set a higher minimum.\u003c/li>\u003c/ul>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Rulebook B · New Jersey: Diane B. Allen Equal Pay Act (book 8.4)\u003c/summary>\u003cdiv class=\"rule\">\n\u003cul>\u003cli>Standard: \u003cb>\"equal pay for substantially similar work\"\u003c/b>, judged by skill, effort and responsibility, not by job title.\u003c/li>\u003cli>An employee can recover up to \u003cb>six years\u003c/b> of underpayment.\u003c/li>\u003cli>A winning employee's damages are \u003cb>tripled\u003c/b>.\u003c/li>\u003cli>Named after a retired New Jersey state senator who experienced pay discrimination.\u003c/li>\u003c/ul>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Rulebook C · Minnesota pay equity (book 8.4 + Chapter 6)\u003c/summary>\u003cdiv class=\"rule\">\n\u003cul>\u003cli>Jobs are evaluated by \u003cb>knowledge, problem solving, responsibility and working conditions\u003c/b>, not by job titles.\u003c/li>\u003cli>Applies \u003cb>only to state government employees\u003c/b>.\u003c/li>\u003cli>Chapter 6 link: \u003cb>comparable worth\u003c/b>, the idea that pay should reflect a job's value to the organization, not the person's salary history.\u003c/li>\u003c/ul>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Rulebook D · EU Pay Transparency Directive (outside the book)\u003c/summary>\u003cdiv class=\"rule\">\n\u003cul>\u003cli>Employers must give the \u003cb>pay range before the interview\u003c/b>.\u003c/li>\u003cli>Employers may \u003cb>not ask about salary history\u003c/b>.\u003c/li>\u003cli>Workers may \u003cb>ask for pay information\u003c/b>, including average pay by sex for the same work or work of equal value.\u003c/li>\u003cli>Employers with 100+ workers \u003cb>report gender pay gaps\u003c/b> (those with 250+ every year from June 2027).\u003c/li>\u003cli>An unexplained gap of \u003cb>5% or more\u003c/b> in a category of workers, not fixed within six months, triggers a \u003cb>joint pay assessment\u003c/b> with worker representatives.\u003c/li>\u003cli>In pay discrimination cases, the \u003cb>burden of proof is on the employer\u003c/b>.\u003c/li>\u003cli>EU countries had to make it national law by \u003cb>7 June 2026\u003c/b>; only four of 27 did so on time.\u003c/li>\u003c/ul>\u003c/div>\u003c/details>\n\u003ch3>Expert group: my rulebook\u003c/h3>\n\u003cselect data-k=\"p8r\">\u003coption value=\"\">Choose…\u003c/option>\u003coption>A · U.S. federal\u003c/option>\u003coption>B · New Jersey\u003c/option>\u003coption>C · Minnesota\u003c/option>\u003coption>D · EU\u003c/option>\u003c/select>\n\u003clabel>1. Is Dana's pay gap likely to be illegal under our rulebook?\u003c/label>\u003ctextarea data-k=\"p8e1\">\u003c/textarea>\n\u003clabel>2. What would Dana need to show?\u003c/label>\u003ctextarea data-k=\"p8e2\">\u003c/textarea>\n\u003clabel>3. What must (or should) Meridian do now?\u003c/label>\u003ctextarea data-k=\"p8e3\">\u003c/textarea>\n\u003clabel>4. One strength and one weakness of our rulebook\u003c/label>\u003ctextarea data-k=\"p8e4\">\u003c/textarea>\n\u003ch3>Home group: comparison grid\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Rulebook\u003c/th>\u003cth>Likely illegal?\u003c/th>\u003cth>What Dana must show\u003c/th>\u003cth>What Meridian must do\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A · U.S. federal\u003c/td>\u003ctd>\u003ctextarea data-k=\"g1a\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g1b\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g1c\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B · New Jersey\u003c/td>\u003ctd>\u003ctextarea data-k=\"g2a\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g2b\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g2c\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C · Minnesota\u003c/td>\u003ctd>\u003ctextarea data-k=\"g3a\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g3b\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g3c\">\u003c/textarea>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D · EU\u003c/td>\u003ctd>\u003ctextarea data-k=\"g4a\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g4b\">\u003c/textarea>\u003c/td>\u003ctd>\u003ctextarea data-k=\"g4c\">\u003c/textarea>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Meridian's global pay policy\u003c/h3>\n\u003clabel>Our approach\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p8a\" data-k=\"p8a\" value=\"Local\"> Local: follow each location's law\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p8a\" data-k=\"p8a\" value=\"Strictest\"> Strictest rule everywhere\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p8a\" data-k=\"p8a\" value=\"Hybrid\"> Hybrid\u003c/label>\u003c/div>\n\u003clabel>Our policy in three lines\u003c/label>\u003ctextarea data-k=\"p8p\">\u003c/textarea>\n\u003clabel>The ethical framework that supports it, and why\u003c/label>\u003cinput type=\"text\" data-k=\"p8f\">\n\u003clabel>One stakeholder who loses under our policy\u003c/label>\u003cinput type=\"text\" data-k=\"p8l\">\n\u003c/section>\n\n\u003csection id=\"p9\">\n\u003ch2>8 · The Board Asks\u003c/h2>\n\u003clabel>The board's question to our group\u003c/label>\u003cinput type=\"text\" data-k=\"p9q\">\n\u003clabel>Our answer (business reason + ethical reason)\u003c/label>\u003ctextarea data-k=\"p9a\">\u003c/textarea>\n\u003clabel>The most convincing answer from another group, and why\u003c/label>\u003cinput type=\"text\" data-k=\"p9v\">\n\u003c/section>\n\n\u003csection id=\"p10\">\n\u003ch2>9 · From red lines to a code\u003c/h2>\n\u003cp>Your Personal Code of Ethics has five parts: \u003cb>(1)\u003c/b> core values · \u003cb>(2)\u003c/b> commitments to stakeholders · \u003cb>(3)\u003c/b> red lines · \u003cb>(4)\u003c/b> a hard case · \u003cb>(5)\u003c/b> how I'll keep my code. Write it in the \u003cb>Code of Ethics Draft\u003c/b> tab.\u003c/p>\n\u003ch3>Vague → specific\u003c/h3>\n\u003cp>Rewrite each promise so someone could check whether you kept it.\u003c/p>\n\u003clabel>\"I will be fair.\" →\u003c/label>\u003cinput type=\"text\" data-k=\"p10a\">\n\u003clabel>\"I will respect diversity.\" →\u003c/label>\u003cinput type=\"text\" data-k=\"p10b\">\n\u003clabel>\"I will be honest.\" →\u003c/label>\u003cinput type=\"text\" data-k=\"p10c\">\n\u003clabel>My rights commitment: \"To respect the rights of everyone I work with, I will…\"\u003c/label>\u003ctextarea data-k=\"p10d\">\u003c/textarea>\n\u003clabel>My partner's question: Could someone check this? My revision:\u003c/label>\u003cinput type=\"text\" data-k=\"p10e\">\n\u003c/section>\n\n\u003csection id=\"p11\">\n\u003ch2>10 · Exit ticket and homework\u003c/h2>\n\u003ch3>Exit ticket\u003c/h3>\n\u003clabel>One difference between diversity and inclusion\u003c/label>\u003cinput type=\"text\" data-k=\"p11a\">\n\u003clabel>One thing a company should do even if the law doesn't require it\u003c/label>\u003cinput type=\"text\" data-k=\"p11b\">\n\u003clabel>My confidence with this week's ideas\u003c/label>\n\u003cdiv class=\"opt\">\u003clabel>\u003cinput type=\"radio\" name=\"p11c\" data-k=\"p11c\" value=\"1\"> 1 · Still confused\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p11c\" data-k=\"p11c\" value=\"2\"> 2\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p11c\" data-k=\"p11c\" value=\"3\"> 3\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"p11c\" data-k=\"p11c\" value=\"4\"> 4 · I could explain it\u003c/label>\u003c/div>\n\u003ch3>Homework\u003c/h3>\n\u003col>\u003cli>\u003cb>Complete your Personal Code of Ethics draft\u003c/b> in the Code of Ethics Draft tab (350–450 words). Bring it to Week 9 for peer review: printed, downloaded or on your device.\u003c/li>\u003cli>Read 8.5 if you haven't yet.\u003c/li>\u003cli>Preview Chapter 9 (from p. 265).\u003c/li>\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"lang\">\n\u003ch2>Language bank\u003c/h2>\n\u003ch3>Collocations\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>make / grant / deny an accommodation\u003c/span>\u003cspan>impose an undue hardship\u003c/span>\u003cspan>a sincerely held belief\u003c/span>\u003cspan>close the pay gap\u003c/span>\u003cspan>meet / exceed the legal minimum\u003c/span>\u003cspan>a level playing field\u003c/span>\u003cspan>feel heard / be left out\u003c/span>\u003cspan>roll back a policy\u003c/span>\u003cspan>bear the burden of proof\u003c/span>\u003c/div>\n\u003ch3>Careful discussion\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>This may be a sensitive point, but…\u003c/span>\u003cspan>Speaking from my last workplace, …\u003c/span>\u003cspan>It could be argued that…\u003c/span>\u003cspan>That may not apply to every workplace.\u003c/span>\u003cspan>So what you're saying is…?\u003c/span>\u003cspan>Would that still hold if…?\u003c/span>\u003cspan>I see your point, but I'd question whether…\u003c/span>\u003cspan>I've changed my mind slightly: …\u003c/span>\u003c/div>\n\u003ch3>Rules and policy\u003c/h3>\n\u003cdiv class=\"phr\">\u003cspan>Employers must…\u003c/span>\u003cspan>They're not allowed to…\u003c/span>\u003cspan>An employer may refuse only if…\u003c/span>\u003cspan>The burden of proof is on…\u003c/span>\u003cspan>We can grant this on the condition that…\u003c/span>\u003cspan>If Meridian applied…, costs would…\u003c/span>\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\n\u003cscript>\nconst DD=[[\"Ethnically diverse companies earn 35% more profit.\",\"O\"],[\"Companies in the top quarter for ethnic diversity were more likely to beat their industry median.\",\"S\"],[\"Hiring more women will make your company more profitable.\",\"N\"],[\"Firms with the most diverse boards and executives had returns on equity more than 50% higher than the least diverse.\",\"S\"],[\"Diversity creates tension, so it hurts performance.\",\"N\"]];\nconst DO={S:\"Supported\",O:\"Overstated\",N:\"Not supported\"};\ndocument.getElementById('dd').innerHTML=DD.map((d,i)=>`\u003cdiv class=\"cardq\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\u003cspan style=\"flex:1 1 280px\">${i+1}. \"${d[0]}\"\u003c/span>\u003cselect data-k=\"dd${i}\" data-ans=\"${d[1]}\" class=\"chk-d\">\u003coption value=\"\">Choose…\u003c/option>${Object.entries(DO).map(([k,v])=>`\u003coption value=\"${k}\">${v}\u003c/option>`).join('')}\u003c/select>\u003cspan class=\"res\">\u003c/span>\u003c/div>`).join('');\nconst WR=[[\"ADA (1990)\",\"a\"],[\"Title VII of the Civil Rights Act (1964)\",\"b\"],[\"Abercrombie & Fitch (2015)\",\"c\"],[\"Groff v. DeJoy (2023, outside the book)\",\"d\"]];\nconst WO={a:\"Protects people with disabilities; requires reasonable accommodation\",b:\"Bans discrimination based on religion (and race, sex); requires religious accommodation\",c:\"An employer may not refuse to hire someone to avoid accommodating a religious practice\",d:\"To deny a religious accommodation, an employer must show substantial increased costs\"};\ndocument.getElementById('wr').innerHTML=WR.map((m,i)=>`\u003cdiv class=\"cardq\">\u003cp>\u003cb>${m[0]}\u003c/b>\u003c/p>\u003cselect data-k=\"w${i}\" data-ans=\"${m[1]}\" class=\"chk-w\">\u003coption value=\"\">Choose…\u003c/option>${Object.entries(WO).map(([k,v])=>`\u003coption value=\"${k}\">${v}\u003c/option>`).join('')}\u003c/select>\u003cspan class=\"res\">\u003c/span>\u003c/div>`).join('');\nconst RQ=[[\"1\",\"Sunday shifts\",\"A warehouse supervisor asks not to work Sundays for religious reasons. Weekend shifts rotate. Two colleagues could swap but say it's unfair to them.\"],\n[\"2\",\"Mornings\",\"A data analyst has been late on Tuesdays and Thursdays six times this month. When warned, she says: \\\"I have hospital appointments early those mornings and the train takes 90 minutes.\\\" Policy: three late arrivals = written warning.\"],\n[\"3\",\"The look policy\",\"A candidate for a customer-facing sales job wears a hijab. The store manager says the brand's \\\"look\\\" means no head coverings, and wants to hire someone else \\\"just to avoid problems\\\".\"],\n[\"4\",\"The kirpan\",\"A Sikh engineer in Meridian's California office wants to wear a kirpan (a small sheathed blade required by his faith) at work. Some colleagues say they feel uncomfortable.\"],\n[\"5\",\"The team reward\",\"The quarterly team reward is always drinks at a bar. Two employees ask for a change: one doesn't drink for religious reasons; the other simply prefers not to.\"],\n[\"6\",\"June 19\",\"The annual summer picnic is booked for June 19. Several Black employees want to mark Juneteenth with family and community events. Catering is already paid for.\"]];\ndocument.getElementById('desk').innerHTML=RQ.map(r=>`\u003cdiv class=\"cardq\">\u003cp>\u003cspan class=\"pill g\">Request ${r[0]}\u003c/span> \u003cb>${r[1]}.\u003c/b> ${r[2]}\u003c/p>\n\u003cdiv class=\"opt\">${['Grant','Grant with changes','Deny (undue hardship)'].map(v=>`\u003clabel>\u003cinput type=\"radio\" name=\"rq${r[0]}\" data-k=\"rq${r[0]}\" value=\"${v}\"> ${v}\u003c/label>`).join('')}\u003c/div>\n\u003cinput type=\"text\" data-k=\"rq${r[0]}r\" placeholder=\"Rule or test, and the conditions or reason…\">\u003c/div>`).join('');\nconst WY=[[\"1\",\"Company A pays everyone at least 40% above the local minimum wage but has a 15% gender pay gap.\",\"Company B pays exactly the legal minimum and has no gender pay gap.\"],\n[\"2\",\"You run a new cosmetics brand: launch in the U.S. this year using ingredients that were tested on animals (legal there).\",\"Wait 18 months to reformulate without animal testing so you can also sell in the EU (which banned animal-tested cosmetics in 2013).\"],\n[\"3\",\"As CEO, raise all entry-level wages above the legal minimum.\",\"Keep wages, and pay the same money as a one-time bonus to top performers.\"]];\ndocument.getElementById('wyr').innerHTML=WY.map(w=>`\u003cdiv class=\"cardq\">\u003cp>\u003cspan class=\"pill g\">Card ${w[0]}\u003c/span>\u003c/p>\u003cp>\u003cb>Left:\u003c/b> ${w[1]}\u003cbr>\u003cb>Right:\u003c/b> ${w[2]}\u003c/p>\n\u003cdiv class=\"opt\">${['Left','Right'].map(v=>`\u003clabel>\u003cinput type=\"radio\" name=\"wy${w[0]}\" data-k=\"wy${w[0]}\" value=\"${v}\"> ${v}\u003c/label>`).join('')}\u003clabel>\u003cinput type=\"checkbox\" data-k=\"wy${w[0]}s\" value=\"switched\"> I switched\u003c/label>\u003c/div>\n\u003cinput type=\"text\" data-k=\"wy${w[0]}a\" placeholder=\"The strongest argument from the OTHER side was…\">\u003c/div>`).join('');\nfunction checkSet(p){let n=0,t=0;document.querySelectorAll('.chk-'+p).forEach(el=>{t++;const r=el.nextElementSibling;if(el.value===el.dataset.ans){n++;r.textContent='✓';r.className='res ok'}else{r.textContent=el.value?'✗':'?';r.className='res no'}});document.getElementById(p+'-score').textContent=n+' / '+t;}\nconst KEY='eth-w8-worksheet';\nlet data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}\nfunction fields(){return document.querySelectorAll('[data-k]')}\nfields().forEach(el=>{const k=el.dataset.k;if(!(k in data))return;if(el.type==='radio'){el.checked=(el.value===data[k])}else if(el.type==='checkbox'){el.checked=!!data[k]}else el.value=data[k]});\nlet t;function save(){fields().forEach(el=>{const k=el.dataset.k;if(el.type==='radio'){if(el.checked)data[k]=el.value}else if(el.type==='checkbox'){data[k]=el.checked?'switched sides':''}else data[k]=el.value});try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saved').textContent='Saved '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch(e){document.getElementById('saved').textContent='Saving is not available here: use Download.'}}\ndocument.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(save,400)});document.addEventListener('change',save);\nfunction dl(){save();const L=[];L.push('Ethics in a Global World · Week 8 Worksheet');L.push('Name: '+(data.name||''));L.push('');\ndocument.querySelectorAll('section').forEach(sec=>{const h=sec.querySelector('h2');if(!h)return;const items=[];const seen=new Set();\nsec.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(seen.has(k))return;seen.add(k);let v=data[k]||'';if(!v)return;\nif(el.tagName==='SELECT'&&el.selectedIndex>0)v=el.options[el.selectedIndex].text;\nlet lab='';const tr=el.closest('tr');let prev=el.previousElementSibling;\nif(prev&&prev.tagName==='LABEL')lab=prev.innerText;else if(el.closest('.cardq'))lab=el.closest('.cardq').querySelector('p').innerText;else if(tr){lab=tr.firstElementChild.innerText+' · '+(sec.querySelectorAll('tr')[0].children[[...tr.children].indexOf(el.closest('td'))]||{innerText:''}).innerText}else if(el.type==='radio'){let p=el.closest('.opt').previousElementSibling;lab=p?p.innerText:k}else lab=el.placeholder||k;\nitems.push('- '+lab.trim()+'\\n  '+String(v).replace(/\\n/g,'\\n  '))});\nif(items.length){L.push('== '+h.innerText+' ==');L.push(...items);L.push('')}});\nconst b=new Blob([L.join('\\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='week8-worksheet-'+((data.name||'answers').replace(/\\W+/g,'-'))+'.txt';document.body.appendChild(a);a.click();a.remove()}\nfunction clr(){if(!confirm('Clear all your answers on this device?'))return;data={};try{localStorage.removeItem(KEY)}catch(e){}fields().forEach(el=>{if(el.type==='radio'||el.type==='checkbox')el.checked=false;else el.value=''})}\n\u003c/script>\n\u003c/body>\u003c/html>", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 · Personal Code of Ethics (Draft)\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-weight:400;color:var(--sky);font-size:13px}\n.top .who{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}\n.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}\nh1{font-size:28px;color:var(--navy);margin:8px 0 4px}\nh2{font-size:22px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:34px 0 12px}\nh3{font-size:18px;color:var(--blue);margin:22px 0 8px}\nh4{font-size:16px;color:var(--navy);margin:16px 0 6px}\n.lead{color:var(--mut);font-size:17px;margin-top:0}\na{color:var(--blue)}\nsection,.card,.activity{background:#fff;border-radius:10px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,56,101,.12)}\nsection>h2:first-child{margin-top:4px}\n.activity{border-left:5px solid var(--gold)}\n.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;background:var(--sky3);border-radius:8px;padding:10px;margin:8px 0 12px;font-size:14px}\n.meta b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}\n.tw{overflow-x:auto;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{border:1px solid var(--sky);padding:7px 9px;text-align:left;vertical-align:top}\nth{background:var(--navy);color:#fff;font-weight:600}\ntr:nth-child(even) td{background:#f7f9fc}\n.say{background:var(--warm);border-left:4px solid var(--dgold);padding:8px 12px;border-radius:6px;margin:10px 0;font-style:italic}\n.say::before{content:\"Say: \";font-style:normal;font-weight:700;color:var(--dgold)}\n.note{background:var(--sky2);border-left:4px solid var(--blue);padding:8px 12px;border-radius:6px;margin:10px 0}\n.flag{background:#fff6e0;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;margin:10px 0}\n.phr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.phr span{background:var(--sky2);border:1px solid var(--sky);border-radius:99px;padding:3px 11px;font-size:14px}\n.key{background:#eef7ee;border-left:4px solid #3c7d3c;padding:8px 12px;border-radius:6px;margin:8px 0}\n.src{font-size:13px;color:var(--mut)}\n.toc{columns:2;column-gap:24px;padding-left:18px}\n.toc li{break-inside:avoid;margin:2px 0}\n.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-right:4px;vertical-align:middle}\n.pill.g{background:var(--gold);color:var(--navy)}\ndetails{background:var(--sky3);border-radius:8px;padding:8px 12px;margin:10px 0;border:1px solid var(--sky)}\ndetails>summary{cursor:pointer;font-weight:700;color:var(--navy)}\ndetails[open]>summary{margin-bottom:8px}\n.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:3px 4px 3px 0}\n.btn.g{background:var(--gold);color:var(--navy);font-weight:700}\n.btn:hover{filter:brightness(1.15)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n@media (max-width:640px){.top .t small{display:none}.top .t{font-size:14px}h1{font-size:23px}h2{font-size:19px}.wrap{padding:12px 10px 50px}section,.card,.activity{padding:12px 13px}.toc{columns:1}}\n@media print{.top{position:static}.noprint{display:none!important}body{background:#fff;font-size:12pt}section,.card,.activity{box-shadow:none;border:1px solid #ccc;break-inside:auto}details{border:0;padding:0}details>summary{list-style:none}.wrap{max-width:none;padding:0}h2{break-after:avoid}h3{break-after:avoid}}\n\ntextarea,input[type=text]{width:100%;font:inherit;border:1px solid var(--sky);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink)}\ntextarea{min-height:60px;resize:vertical}\nlabel{display:block;margin:10px 0 4px;font-weight:600;color:var(--navy)}\n.bar{position:sticky;top:63px;z-index:10;background:#fff;border-bottom:1px solid var(--sky);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}\n.bar .saved{font-size:13px;color:var(--mut);margin-left:auto}\n.count{background:var(--navy);color:#fff;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700}\n.count.ok{background:#2e7d32}.count.hi{background:#b3261e}\n.hint{font-size:14px;color:var(--mut);margin:2px 0 6px}\n.v3{display:grid;grid-template-columns:1fr 2fr;gap:6px 10px;align-items:start}\n.v3 input{margin:0}\n.doc{background:#fff;border:1px solid var(--sky);border-radius:8px;padding:22px 28px;font-family:Georgia,\"Times New Roman\",serif;line-height:1.6}\n.doc h2{font-family:inherit;border:0;text-align:center;margin:0 0 4px}\n.doc .who{text-align:center;color:var(--mut);margin:0 0 14px}\n.doc h3{font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;font-size:16px;color:var(--navy);margin:16px 0 4px}\n.doc p{margin:4px 0}\n.empty{color:#9aa3b2;font-style:italic}\n.chk li{margin:3px 0}\n@media (max-width:640px){.v3{grid-template-columns:1fr}.doc{padding:14px}}\n@media print{body.printdoc .wrap>*:not(#final){display:none!important}body.printdoc #final{box-shadow:none;border:0;padding:0}body.printdoc #final>h2,body.printdoc #final>p.noprint{display:none}.bar,.count{display:none}textarea,input[type=text]{border:0;border-bottom:1px solid #999;border-radius:0}}\n\u003c/style>\u003c/head>\n\u003cbody class=\"\">\n\u003cheader class=\"top\">\u003cimg src=\"logo.png\" alt=\"Approach International Student Center logo\">\u003cdiv class=\"t\">Ethics in a Global World\u003csmall>Week 8 · Chapter 8: Recognizing and Respecting the Rights of All\u003c/small>\u003c/div>\u003cspan class=\"who\">Code draft\u003c/span>\u003c/header>\n\n\u003cdiv class=\"bar noprint\">\n\u003cbutton class=\"btn\" onclick=\"dl()\">Download my code\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"printDoc()\">Print my code\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"print()\" style=\"background:#3d5d86\">Print this page\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"clr()\" style=\"background:#7a8597\">Clear\u003c/button>\n\u003cspan class=\"count\" id=\"count\">0 words\u003c/span>\n\u003cspan class=\"saved\" id=\"saved\">Your draft saves automatically on this device.\u003c/span>\n\u003c/div>\n\u003cdiv class=\"wrap\">\n\u003ch1>My Personal Code of Ethics: Draft\u003c/h1>\n\u003cp class=\"lead\">Start in class (Week 8 worksheet, Part 9) · Finish for homework · Bring to Week 9 for peer review · 350–450 words\u003c/p>\n\n\u003csection>\n\u003ch2>How this works\u003c/h2>\n\u003col>\n\u003cli>Fill in the five parts below. The finished code builds itself at the bottom of the page.\u003c/li>\n\u003cli>Make every commitment \u003cb>specific\u003c/b>: someone should be able to check whether you kept it.\u003c/li>\n\u003cli>Use your Week 7 red lines (Week 7 worksheet, Part 12) and your Week 8 rights commitment (Week 8 worksheet, Part 9).\u003c/li>\n\u003cli>Use at least four course terms, for example: \u003ci>stakeholder, conflict of interest, confidentiality, whistleblowing, retaliation, inclusion, reasonable accommodation, pay equity, fiduciary duty, transparency\u003c/i>.\u003c/li>\n\u003cli>Download or print it, and bring it to Week 9.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection>\n\u003ch2>About me\u003c/h2>\n\u003clabel>Name\u003c/label>\u003cinput type=\"text\" data-k=\"nm\">\n\u003clabel>My profession or field (or the one I'm preparing for)\u003c/label>\u003cinput type=\"text\" data-k=\"prof\" placeholder=\"e.g., civil engineer, accountant, nurse, project manager, teacher…\">\n\u003c/section>\n\n\u003csection>\n\u003ch2>Part 1 · My core values\u003c/h2>\n\u003cp class=\"hint\">Choose three values. For each, say what it means \u003ci>in your work\u003c/i>, in one sentence.\u003c/p>\n\u003cdiv class=\"v3\">\n\u003cinput type=\"text\" data-k=\"v1\" placeholder=\"Value 1 (e.g., honesty)\">\u003cinput type=\"text\" data-k=\"v1m\" placeholder=\"In my work, this means…\">\n\u003cinput type=\"text\" data-k=\"v2\" placeholder=\"Value 2\">\u003cinput type=\"text\" data-k=\"v2m\" placeholder=\"In my work, this means…\">\n\u003cinput type=\"text\" data-k=\"v3\" placeholder=\"Value 3\">\u003cinput type=\"text\" data-k=\"v3m\" placeholder=\"In my work, this means…\">\n\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Part 2 · My commitments\u003c/h2>\n\u003cp class=\"hint\">Begin each with \"I will…\". One or two specific commitments for each stakeholder.\u003c/p>\n\u003clabel>To my employer or organization\u003c/label>\u003ctextarea data-k=\"c1\" placeholder=\"I will…\">\u003c/textarea>\n\u003clabel>To my colleagues\u003c/label>\u003ctextarea data-k=\"c2\" placeholder=\"I will…\">\u003c/textarea>\n\u003clabel>To clients, customers, patients, students or the public\u003c/label>\u003ctextarea data-k=\"c3\" placeholder=\"I will…\">\u003c/textarea>\n\u003clabel>To respect the rights of everyone I work with\u003c/label>\u003ctextarea data-k=\"c4\" placeholder=\"I will…\">\u003c/textarea>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Part 3 · My red lines\u003c/h2>\n\u003cp class=\"hint\">Two or three things you would never do, even if your job depended on it. Begin with \"I will never…\".\u003c/p>\n\u003ctextarea data-k=\"r1\" placeholder=\"I will never…\">\u003c/textarea>\n\u003ctextarea data-k=\"r2\" placeholder=\"I will never…\" style=\"margin-top:6px\">\u003c/textarea>\n\u003ctextarea data-k=\"r3\" placeholder=\"(optional) I will never…\" style=\"margin-top:6px\">\u003c/textarea>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Part 4 · A hard case\u003c/h2>\n\u003cp class=\"hint\">Describe a realistic situation in your field where two of your commitments could conflict. Then explain what you would do, using one ethical framework (utilitarian, Kantian/duty, virtue, Rawls/justice, rights, stakeholder analysis).\u003c/p>\n\u003clabel>The situation\u003c/label>\u003ctextarea data-k=\"h1\">\u003c/textarea>\n\u003clabel>What I would do, and the framework behind it\u003c/label>\u003ctextarea data-k=\"h2\">\u003c/textarea>\n\u003clabel>Someone might disagree because… My response:\u003c/label>\u003ctextarea data-k=\"h3\">\u003c/textarea>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Part 5 · How I will keep my code\u003c/h2>\n\u003cp class=\"hint\">How will you check yourself? Who would you talk to if you weren't sure? When will you review your code?\u003c/p>\n\u003ctextarea data-k=\"k1\">\u003c/textarea>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Before you finish: checklist\u003c/h2>\n\u003cul class=\"chk\">\n\u003cli id=\"ck1\">☐ All five parts are complete\u003c/li>\n\u003cli id=\"ck2\">☐ 350–450 words\u003c/li>\n\u003cli id=\"ck3\">☐ At least four commitments begin with \"I will\"\u003c/li>\n\u003cli id=\"ck4\">☐ At least two red lines begin with \"I will never\"\u003c/li>\n\u003cli>☐ Every commitment is specific enough for someone to check\u003c/li>\n\u003cli>☐ I used at least four course terms correctly\u003c/li>\n\u003cli>☐ My hard case names a framework and considers another view\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003cdetails class=\"noprint\">\u003csummary>See a model code (a different profession)\u003c/summary>\n\u003cdiv class=\"doc\">\n\u003ch2>My Personal Code of Ethics\u003c/h2>\n\u003cp class=\"who\">Model · Logistics project manager\u003c/p>\n\u003ch3>My core values\u003c/h3>\n\u003cp>\u003cb>Fairness:\u003c/b> in my work, this means decisions about people are based on the work, not on who they are or who they know. \u003cb>Transparency:\u003c/b> I explain the reasons for my decisions to the people they affect. \u003cb>Responsibility:\u003c/b> I own my mistakes and fix them quickly.\u003c/p>\n\u003ch3>My commitments\u003c/h3>\n\u003cp>\u003cb>To my organization:\u003c/b> I will declare any conflict of interest, such as a supplier I have a personal connection with, before I take part in a decision. I will keep client data confidential.\u003c/p>\n\u003cp>\u003cb>To my colleagues:\u003c/b> In meetings I lead, I will ask everyone for input before I give my own opinion, and I will read written comments from remote colleagues aloud.\u003c/p>\n\u003cp>\u003cb>To clients and the public:\u003c/b> I will correct an error in a client report within one working day of finding it, even if the client hasn't noticed.\u003c/p>\n\u003cp>\u003cb>To respect the rights of everyone I work with:\u003c/b> I will base pay and promotion recommendations on job content and results, not on salary history. When someone asks for an accommodation, I will start with a conversation, not a rule.\u003c/p>\n\u003ch3>My red lines\u003c/h3>\n\u003cp>I will never falsify delivery or safety records. I will never punish a team member for raising a concern in good faith; retaliation destroys trust.\u003c/p>\n\u003ch3>A hard case\u003c/h3>\n\u003cp>A key client asks me to remove a team member from their project because of her accent. Losing the client would cost my company a lot of money and could cost jobs. A utilitarian might weigh those jobs against one person's disappointment, but a rights-based view says she has a right not to be treated differently because of her national origin. I would keep her on the project, explain our policy to the client and ask my director to support me. Someone might say I am risking other people's jobs. That is a real cost, but if we accept this request, we tell every employee that their position depends on prejudice.\u003c/p>\n\u003ch3>How I will keep my code\u003c/h3>\n\u003cp>I will reread this code at the start of every new project. If I'm unsure, I will talk to our ethics officer or a mentor outside my team before I act, not after.\u003c/p>\n\u003cp class=\"src\">About 360 words.\u003c/p>\n\u003c/div>\u003c/details>\n\n\u003csection id=\"final\">\n\u003ch2>My finished code (builds automatically)\u003c/h2>\n\u003cp class=\"noprint\">This is what you'll download or print with \"Print my code\".\u003c/p>\n\u003cdiv class=\"doc\" id=\"doc\">\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\n\u003cscript>\nconst KEY='eth-w8-code';\nlet data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}\nconst F=()=>document.querySelectorAll('[data-k]');\nF().forEach(el=>{if(el.dataset.k in data)el.value=data[el.dataset.k]});\nconst esc=s=>String(s||'').replace(/[&\u003c>]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;'}[c])).replace(/\\n/g,'\u003cbr>');\nconst g=k=>(data[k]||'').trim();\nfunction para(t){return t?`\u003cp>${esc(t)}\u003c/p>`:'\u003cp class=\"empty\">(not written yet)\u003c/p>'}\nfunction text(){const L=[];L.push('MY PERSONAL CODE OF ETHICS');L.push((g('nm')||'Name')+' · '+(g('prof')||'Profession'));L.push('');\nL.push('MY CORE VALUES');[1,2,3].forEach(i=>{if(g('v'+i)||g('v'+i+'m'))L.push(g('v'+i)+': '+g('v'+i+'m'))});L.push('');\nL.push('MY COMMITMENTS');[['c1','To my organization'],['c2','To my colleagues'],['c3','To clients and the public'],['c4','To respect the rights of everyone I work with']].forEach(([k,l])=>{if(g(k))L.push(l+': '+g(k))});L.push('');\nL.push('MY RED LINES');['r1','r2','r3'].forEach(k=>{if(g(k))L.push(g(k))});L.push('');\nL.push('A HARD CASE');['h1','h2','h3'].forEach(k=>{if(g(k))L.push(g(k))});L.push('');\nL.push('HOW I WILL KEEP MY CODE');if(g('k1'))L.push(g('k1'));return L.join('\\n')}\nfunction words(){let n=0;['v1','v1m','v2','v2m','v3','v3m','c1','c2','c3','c4','r1','r2','r3','h1','h2','h3','k1'].forEach(k=>{n+=(g(k).match(/\\S+/g)||[]).length});return n}\nfunction render(){\nconst vals=[1,2,3].filter(i=>g('v'+i)||g('v'+i+'m')).map(i=>`\u003cb>${esc(g('v'+i))}:\u003c/b> ${esc(g('v'+i+'m'))}`).join(' ');\nconst com=[['c1','To my organization'],['c2','To my colleagues'],['c3','To clients and the public'],['c4','To respect the rights of everyone I work with']].map(([k,l])=>g(k)?`\u003cp>\u003cb>${l}:\u003c/b> ${esc(g(k))}\u003c/p>`:'').join('');\nconst red=['r1','r2','r3'].map(g).filter(Boolean).map(esc).join(' ');\nconst hard=['h1','h2','h3'].map(g).filter(Boolean).map(esc).join(' ');\ndocument.getElementById('doc').innerHTML=`\u003ch2>My Personal Code of Ethics\u003c/h2>\u003cp class=\"who\">${esc(g('nm')||'Your name')} · ${esc(g('prof')||'your profession')}\u003c/p>\n\u003ch3>My core values\u003c/h3>${vals?`\u003cp>${vals}\u003c/p>`:para('')}\u003ch3>My commitments\u003c/h3>${com||para('')}\u003ch3>My red lines\u003c/h3>${para(red)}\u003ch3>A hard case\u003c/h3>${para(hard)}\u003ch3>How I will keep my code\u003c/h3>${para(g('k1'))}`;\nconst n=words();const c=document.getElementById('count');c.textContent=n+' words';c.className='count'+(n>=350&&n\u003c=450?' ok':n>450?' hi':'');\nconst done=[['v1','v2','v3'],['c1','c2','c3','c4'],['r1','r2'],['h1','h2'],['k1']].every(a=>a.every(k=>g(k)));\nconst iw=['c1','c2','c3','c4'].map(k=>(g(k).match(/\\bI will\\b(?! never)/gi)||[]).length).reduce((a,b)=>a+b,0);\nconst nv=['r1','r2','r3'].filter(k=>/\\bI will never\\b/i.test(g(k))).length;\nconst mark=(id,ok)=>{const e=document.getElementById(id);e.textContent=(ok?'☑':'☐')+e.textContent.slice(1);e.style.color=ok?'#2e7d32':''};\nmark('ck1',done);mark('ck2',n>=350&&n\u003c=450);mark('ck3',iw>=4);mark('ck4',nv>=2)}\nlet t;function save(){F().forEach(el=>data[el.dataset.k]=el.value);try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saved').textContent='Saved '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch(e){document.getElementById('saved').textContent='Saving is not available here: use Download.'}render()}\ndocument.addEventListener('input',()=>{F().forEach(el=>data[el.dataset.k]=el.value);render();clearTimeout(t);t=setTimeout(save,400)});\nrender();\nfunction dl(){save();const b=new Blob([text()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='code-of-ethics-'+((g('nm')||'draft').replace(/\\W+/g,'-'))+'.txt';document.body.appendChild(a);a.click();a.remove()}\nfunction printDoc(){document.body.classList.add('printdoc');print();setTimeout(()=>document.body.classList.remove('printdoc'),500)}\nwindow.addEventListener('afterprint',()=>document.body.classList.remove('printdoc'));\nfunction clr(){if(!confirm('Clear your whole draft on this device?'))return;data={};try{localStorage.removeItem(KEY)}catch(e){}F().forEach(el=>el.value='');render()}\n\u003c/script>\n\u003c/body>\u003c/html>", "slides": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 Slides · Recognizing and Respecting the Rights of All\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0d2747;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}\n.deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n.s{display:none;position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#fff;color:#1d2433;padding:4.2% 5.5% 6%;overflow:hidden;font-size:min(2.15vw,3.8vh)}\n.s.on{display:flex;flex-direction:column}\n.s h2{font-size:2.05em;color:var(--navy);margin:0 0 .45em;line-height:1.15;border-bottom:.12em solid var(--gold);padding-bottom:.18em}\n.s .k{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--dgold);font-weight:700;margin-bottom:.25em}\n.s p,.s li{line-height:1.35;margin:.25em 0}\n.s ul,.s ol{margin:.2em 0 .2em 1.2em;padding:0}\n.s .sm{font-size:.82em}.s .xs{font-size:.68em;color:#5b6577}\n.s .two{display:grid;grid-template-columns:1fr 1fr;gap:4%;flex:1;min-height:0}\n.s .box{background:var(--sky3);border-left:.25em solid var(--navy);border-radius:.4em;padding:.6em .8em}\n.s .box.g{border-color:var(--gold);background:#fbf6e8}\n.s table{border-collapse:collapse;width:100%;font-size:.8em}\n.s th,.s td{border:1px solid var(--sky);padding:.28em .5em;text-align:left;vertical-align:top}\n.s th{background:var(--navy);color:#fff}\n.s.dark{background:var(--navy);color:#fff}\n.s.dark h2{color:#fff}\n.s.title{background:var(--navy);color:#fff;justify-content:center;align-items:flex-start}\n.s.title img{width:7.5em;margin-bottom:1em;border-radius:.4em}\n.s.title h1{font-size:2.8em;margin:0;color:#fff}\n.s.title p{color:var(--sky);font-size:1.2em}\n.s.title .q{color:var(--gold);font-size:1.6em;font-weight:700;margin-top:.6em}\n.foot{position:absolute;left:5.5%;right:5.5%;bottom:2.2%;display:flex;align-items:center;gap:.6em;font-size:.6em;color:#5b6577}\n.s.dark .foot,.s.title .foot{color:var(--sky)}\n.foot img{height:1.9em;border-radius:.2em}\n.foot .n{margin-left:auto}\n.timer{position:absolute;right:5.5%;top:4.2%;display:flex;align-items:center;gap:.4em;font-size:.8em}\n.timer b{font-variant-numeric:tabular-nums;font-size:1.5em;color:var(--navy);min-width:3.2em;text-align:right}\n.s.dark .timer b{color:#fff}\n.timer button{font:inherit;font-size:.8em;border:0;border-radius:.3em;background:var(--gold);color:var(--navy);padding:.2em .6em;cursor:pointer;font-weight:700}\n.timer.done b{color:#c0392b}\n.big{font-size:1.25em}\n.tally{display:grid;grid-template-columns:repeat(6,1fr);gap:.4em;margin-top:.4em}\n.tally div{border:2px solid var(--sky);border-radius:.4em;text-align:center;padding:.4em .2em;font-size:.8em}\n.tally div b{display:block;font-size:2em;color:var(--navy);min-height:1.2em}\n.ladder{display:flex;flex-direction:column-reverse;gap:.25em}\n.ladder div{background:var(--sky2);border-radius:.3em;padding:.25em .6em;font-size:.85em}\n.ladder div:nth-child(5){background:#fbf6e8;border:2px solid var(--gold);font-weight:700}\n.nav{position:fixed;bottom:8px;right:10px;z-index:5;display:flex;gap:6px;opacity:.35;transition:opacity .2s}\n.nav:hover{opacity:1}\n.nav button{font:14px sans-serif;border:0;border-radius:6px;padding:6px 10px;background:#fff;color:var(--navy);cursor:pointer}\n@media print{html,body{overflow:visible;height:auto;background:#fff}.deck{position:static;display:block}.s{display:flex!important;flex-direction:column;width:100%;height:auto;aspect-ratio:16/9;page-break-after:always;font-size:12pt;border:1px solid #ccc}.nav,.timer button{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"deck\" id=\"deck\">\n\n\u003cdiv class=\"s title\">\u003cimg src=\"logo.png\" alt=\"Approach logo\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Ethics in a Global World · Week 8\u003c/div>\u003ch1>Recognizing and Respecting the Rights of All\u003c/h1>\u003cp>Chapter 8 · \u003ci>Business Ethics\u003c/i> (OpenStax), pp. 231–264\u003c/p>\u003cdiv class=\"q\">Invited is not the same as included.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Today\u003c/div>\u003ch2>Two classes, one company\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Class 1 · Invited is not included (9:00–10:40)\u003c/b>\u003col class=\"sm\">\u003cli>The Meeting Nobody Noticed\u003c/li>\u003cli>Invited vs. included\u003c/li>\u003cli>Data Detective\u003c/li>\u003cli>Discussion circles\u003c/li>\u003cli>The Accommodation Desk\u003c/li>\u003cli>The Payslip\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Class 2 · Rights across borders (11:10–12:50)\u003c/b>\u003col class=\"sm\">\u003cli>Would you rather?\u003c/li>\u003cli>Same Job, Four Rulebooks\u003c/li>\u003cli>The Board Asks\u003c/li>\u003cli>From red lines to a code\u003c/li>\u003cli>Quiz 3 (Chapters 6–8)\u003c/li>\u003c/ol>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Meridian Freight is fictional. Please hand in Journal #4 now.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"4\">\u003cdiv class=\"k\">Engage · Meridian Freight (fictional)\u003c/div>\u003ch2>The Meeting Nobody Noticed\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>You are Meridian's planning team. Choose \u003cb>ONE\u003c/b> option for this year's team day:\u003c/p>\u003cul>\u003cli>\u003cb>A\u003c/b> · Evening dinner with drinks downtown\u003c/li>\u003cli>\u003cb>B\u003c/b> · Saturday volunteer day at a food bank\u003c/li>\u003cli>\u003cb>C\u003c/b> · Weekday afternoon workshop with lunch\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>Rules\u003c/b>\u003c/p>\u003col class=\"sm\">\u003cli>Read your secret role card. Don't show anyone.\u003c/li>\u003cli>Follow it exactly.\u003c/li>\u003cli>Write your decision and one reason.\u003c/li>\u003c/ol>\u003cp class=\"big\">\u003cb>4 minutes\u003c/b>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Engage · The reveal\u003c/div>\u003ch2>Who was in the room? Who was heard?\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cul>\u003cli>Remote colleagues: \u003cb>did anyone read your notes?\u003c/b>\u003c/li>\u003cli>Newer colleagues: \u003cb>did anyone ask your name?\u003c/b>\u003c/li>\u003cli>Second-language colleagues: \u003cb>how often did you reach five?\u003c/b>\u003c/li>\u003c/ul>\u003cp>Cards 4 and 5: read your hidden constraint aloud.\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003cp>\u003cb>Discuss\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>Who spoke most? Did they have the best ideas?\u003c/li>\u003cli>Was your decision a good one?\u003c/li>\u003cli>What could the senior manager have done differently?\u003c/li>\u003cli>Which of these roles have you seen in real meetings?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · 8.1, pp. 232–238\u003c/div>\u003ch2>Invited vs. included\u003c/h2>\n\u003cp class=\"big\" style=\"color:var(--navy)\">\"Diversity is being invited to the party; inclusion is being asked to dance.\"\u003c/p>\u003cp class=\"xs\">Howard J. Ross, Cook Ross, quoted in section 8.1\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Diversity\u003c/b>\u003cp class=\"sm\">The mix of people and perspectives. SHRM: also thinking styles, personality, physical and cognitive abilities, sexual orientation; the book adds age, experience, country of residence.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Inclusion\u003c/b>\u003cp class=\"sm\">\"The engagement of all employees in the corporate culture.\" People belong, and they are heard.\u003c/p>\u003cb>Diversity dividend\u003c/b>\u003cp class=\"sm\">The financial benefit linked to a diverse workforce.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · Data Detective · Figure 8.4\u003c/div>\u003ch2>What the McKinsey study found\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Companies in the…\u003c/th>\u003cth>Top quarter\u003c/th>\u003cth>Bottom quarter\u003c/th>\u003cth>Difference\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Gender diversity: likelihood of returns above industry median\u003c/td>\u003ctd>54\u003c/td>\u003ctd>47\u003c/td>\u003ctd>\u003cb>15% more likely\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ethnic diversity: likelihood of returns above industry median\u003c/td>\u003ctd>58\u003c/td>\u003ctd>43\u003c/td>\u003ctd>\u003cb>35% more likely\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Executive and/or board diversity: return on equity\u003c/td>\u003ctd colspan=\"3\">Top quarter more than \u003cb>50% higher\u003c/b> than the bottom quarter\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"box g\" style=\"margin-top:.6em\">The book: \u003cb>\"positive correlations do not equal causation.\"\u003c/b>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Study · Data Detective\u003c/div>\u003ch2>Supported, overstated or not supported?\u003c/h2>\n\u003col>\u003cli>\"Ethnically diverse companies earn 35% more profit.\"\u003c/li>\u003cli>\"Companies in the top quarter for ethnic diversity were more likely to beat their industry median.\"\u003c/li>\u003cli>\"Hiring more women will make your company more profitable.\"\u003c/li>\u003cli>\"Firms with the most diverse boards and executives had returns on equity more than 50% higher than the least diverse.\"\u003c/li>\u003cli>\"Diversity creates tension, so it hurts performance.\"\u003c/li>\u003c/ol>\n\u003cp class=\"sm\">Worksheet Part 2 → \u003cb>Check my answers\u003c/b>. Then: if it's not a cause, what explains the link?\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Activate · Discussion circles\u003c/div>\u003ch2>Roles and ground rules\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Roles (rotate each round)\u003c/b>\u003cul class=\"sm\">\u003cli>\u003cb>Facilitator\u003c/b>: everyone speaks once before anyone speaks twice\u003c/li>\u003cli>\u003cb>Clarifier\u003c/b>: \"So what you're saying is…?\"\u003c/li>\u003cli>\u003cb>Complicator\u003c/b>: \"What if…?\"\u003c/li>\u003cli>\u003cb>Book connector\u003c/b>: \"Section 8.1 says…\"\u003c/li>\u003cli>\u003cb>Reporter\u003c/b>: writes the \"It depends on…\" sentence\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Ground rules\u003c/b>\u003col class=\"sm\">\u003cli>Speak from a workplace you know, not for a country or group.\u003c/li>\u003cli>No one has to share personal information.\u003c/li>\u003cli>Challenge ideas, not people.\u003c/li>\u003cli>One pass per round.\u003c/li>\u003cli>Laws differ, and that's the point.\u003c/li>\u003c/ol>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Round 1 · Book, 8.1\u003c/div>\u003ch2>Speech or conduct?\u003c/h2>\n\u003cp class=\"sm\">2017: a senior Google engineer's internal memo criticized the company's diversity programs and said women's underrepresentation in tech had partly \"biological causes\". It leaked; Google fired him. 2018: the National Labor Relations Board found the firing lawful: he was dismissed for conduct that demeaned women. The book notes there is no right of free speech in a private-sector workplace.\u003c/p>\n\u003cul>\u003cli>Should employees be free to criticize their company's diversity programs at work?\u003c/li>\u003cli>Where is the line between an opinion and conduct that harms colleagues?\u003c/li>\u003cli>Would it matter if he had sent it only to his manager?\u003c/li>\u003c/ul>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Round 2 · Book + outside source\u003c/div>\u003ch2>When the wind changes\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>Book (8.1)\u003c/b>\u003cp class=\"sm\">From 2014, tech companies published diversity numbers. More than 30 signed a diversity pledge; Google pledged more than $100 million.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Outside the book · February 2025\u003c/b>\u003cp class=\"sm\">Google stopped setting hiring targets for representation, citing court decisions and U.S. executive orders. Meta, Amazon and Target scaled back programs; Costco and Delta said they would continue theirs.\u003c/p>\u003c/div>\u003c/div>\n\u003cul class=\"sm\">\u003cli>Should a company's values change when the law or political pressure changes?\u003c/li>\u003cli>Is a hiring target the same thing as inclusion?\u003c/li>\u003cli>Which stakeholders gain and which lose under each choice?\u003c/li>\u003c/ul>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Round 3 · Your teacher's card\u003c/div>\u003ch2>One company, many rules\u003c/h2>\n\u003cp>Read the Round 3 card your teacher gives you.\u003c/p>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>The key question for every version:\u003c/b>\u003c/p>\u003cp class=\"big\">Should a global company apply one policy everywhere, or follow each country's law?\u003c/p>\u003c/div>\n\u003cp class=\"xs\">Reporters: be ready to read your best \"It depends on…\" sentence.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Study · 8.2, pp. 239–243\u003c/div>\u003ch2>The Accommodation Desk: the rules\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>What it says\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>ADA\u003c/b> (1990)\u003c/td>\u003ctd>No discrimination against qualified people with disabilities; \u003cb>reasonable accommodation\u003c/b> unless it causes \u003cb>undue hardship\u003c/b>. Employees don't need to use the legal words.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Title VII\u003c/b> (1964)\u003c/td>\u003ctd>Religion: nondiscrimination, nonharassment, nonretaliation, reasonable accommodation. Nontraditional, sincere beliefs count (\u003ci>Welsh\u003c/i>, 1970).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Abercrombie\u003c/b> (2015)\u003c/td>\u003ctd>An employer may not refuse to hire someone to avoid accommodating a religious practice.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>\u003ci>Groff v. DeJoy\u003c/i>\u003c/b> (2023) \u003cspan class=\"xs\">outside the book\u003c/span>\u003c/td>\u003ctd>To deny a religious accommodation, the employer must show \u003cb>substantial increased costs\u003c/b> for its business.\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"xs\">Book example: Verizon paid $20 million over a rigid \"no-fault\" attendance policy.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"22\">\u003cdiv class=\"k\">Activate · Groups of 3\u003c/div>\u003ch2>How the desk works\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col>\u003cli>\u003cb>Employee\u003c/b> presents the request in their own words.\u003c/li>\u003cli>\u003cb>Operations manager\u003c/b> raises one practical concern.\u003c/li>\u003cli>\u003cb>HR partner\u003c/b> asks one question, then decides:\u003cbr>\u003cspan class=\"pill\">Grant\u003c/span> \u003cspan class=\"pill\">Grant with changes\u003c/span> \u003cspan class=\"pill\">Deny (undue hardship)\u003c/span>\u003c/li>\u003cli>Everyone records the decision and the test in Part 4.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Then rotate roles.\u003c/b>\u003cp class=\"sm\">About 3½ minutes per request. Do at least four of the six.\u003c/p>\u003cp class=\"sm\">HR: \"Is the cost or difficulty \u003ci>substantial\u003c/i>, or just inconvenient?\"\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s dark\" data-min=\"4\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Bridge · Meridian Freight (fictional)\u003c/div>\u003ch2>The Payslip\u003c/h2>\n\u003ctable style=\"color:#1d2433;background:#fff\">\u003ctr>\u003cth>\u003c/th>\u003cth>Dana Reyes\u003c/th>\u003cth>Marco Bianchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Title\u003c/td>\u003ctd>Customer Insights Analyst\u003c/td>\u003ctd>Logistics Data Analyst\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Salary\u003c/td>\u003ctd>\u003cb>$68,000\u003c/b>\u003c/td>\u003ctd>\u003cb>$76,000\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Experience\u003c/td>\u003ctd>4 years\u003c/td>\u003ctd>4 years\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Work\u003c/td>\u003ctd colspan=\"2\">Both build dashboards, present findings to clients and supervise one intern.\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Worksheet Part 5: \u003cb>Fair?\u003c/b> \u003cb>Legal?\u003c/b> Yes / No / It depends, with one reason each.\u003c/p>\n\u003cp style=\"color:var(--gold)\">After the break: the answer depends on where Meridian is.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s title\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Break · 10:40–11:10\u003c/div>\u003ch1>Back at 11:10\u003c/h1>\u003cp>Before you go: show your Payslip votes.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s title\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Class 2 · 11:10–12:50\u003c/div>\u003ch1>Rights across borders\u003c/h1>\u003cp>Same company. Same job. Different rules.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Engage · 8.4 · Switch rule\u003c/div>\u003ch2>Would you rather? 1\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>LEFT · Company A\u003c/b>\u003cp>Pays everyone at least \u003cb>40% above\u003c/b> the local minimum wage, but has a \u003cb>15% gender pay gap\u003c/b>.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>RIGHT · Company B\u003c/b>\u003cp>Pays \u003cb>exactly the legal minimum\u003c/b> and has \u003cb>no gender pay gap\u003c/b>.\u003c/p>\u003c/div>\u003c/div>\n\u003cp class=\"sm\">One argument from each side. Then anyone convinced may switch sides.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Engage · 8.5 · Switch rule\u003c/div>\u003ch2>Would you rather? 2\u003c/h2>\n\u003cp>You run a new cosmetics brand.\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>LEFT\u003c/b>\u003cp>Launch in the U.S. \u003cb>this year\u003c/b> using ingredients that were tested on animals (legal there).\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>RIGHT\u003c/b>\u003cp>\u003cb>Wait 18 months\u003c/b> to reformulate without animal testing, so you can also sell in the EU.\u003c/p>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Book (8.5): the EU banned animal testing for cosmetics and the sale of animal-tested cosmetics in 2013; about forty nations have acted.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"3\">\u003cdiv class=\"k\">Engage · 8.4 · Switch rule\u003c/div>\u003ch2>Would you rather? 3\u003c/h2>\n\u003cp>You're the CEO, with a fixed amount of money.\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003cb>LEFT\u003c/b>\u003cp>\u003cb>Raise all entry-level wages\u003c/b> above the legal minimum.\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>RIGHT\u003c/b>\u003cp>Keep wages, and pay the same money as a \u003cb>one-time bonus to top performers\u003c/b>.\u003c/p>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Book (8.4): \"How would you explain to a board of directors your decision to pay entry-level workers more than the law requires?\"\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Your votes from the break\u003c/div>\u003ch2>Dana and Marco: fair? legal?\u003c/h2>\n\u003cp>\u003cb>Fair?\u003c/b>\u003c/p>\u003cdiv class=\"tally\" style=\"grid-template-columns:repeat(3,1fr)\">\u003cdiv>Yes\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>No\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>It depends\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003c/div>\n\u003cp>\u003cb>Legal?\u003c/b>\u003c/p>\u003cdiv class=\"tally\" style=\"grid-template-columns:repeat(3,1fr)\">\u003cdiv>Yes\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>No\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003cdiv>It depends\u003cb contenteditable=\"true\">\u003c/b>\u003c/div>\u003c/div>\n\u003cp class=\"xs\">Teacher: click a box to type the count.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"12\">\u003cdiv class=\"k\">Case study · jigsaw · 8.4 + outside source\u003c/div>\u003ch2>Same Job, Four Rulebooks\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>\u003cb>Read the case\u003c/b> (Handout 5 / Part 7): 3 min.\u003c/li>\u003cli>\u003cb>Expert groups\u003c/b>: 12 min. Under your rulebook:\u003cul>\u003cli>Is Dana's gap likely illegal?\u003c/li>\u003cli>What would Dana need to show?\u003c/li>\u003cli>What must Meridian do now?\u003c/li>\u003cli>One strength, one weakness.\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cul class=\"sm\">\u003cli>\u003cb>A\u003c/b> · U.S. federal law\u003c/li>\u003cli>\u003cb>B\u003c/b> · New Jersey: Diane B. Allen Equal Pay Act\u003c/li>\u003cli>\u003cb>C\u003c/b> · Minnesota pay equity\u003c/li>\u003cli>\u003cb>D\u003c/b> · EU Pay Transparency Directive \u003cspan class=\"xs\">(outside the book)\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"14\">\u003cdiv class=\"k\">Case study · home groups\u003c/div>\u003ch2>Teach, compare, decide\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>Each expert teaches their rulebook in \u003cb>90 seconds\u003c/b>. Others fill in the grid.\u003c/li>\u003cli>Write Meridian's \u003cb>global pay policy\u003c/b> in three lines:\u003cul>\u003cli>\u003cb>Local\u003c/b>: follow each location's law\u003c/li>\u003cli>\u003cb>Strictest\u003c/b>: strictest rule everywhere\u003c/li>\u003cli>\u003cb>Hybrid\u003c/b>: explain\u003c/li>\u003c/ul>\u003c/li>\u003cli>Name one \u003cb>framework\u003c/b> that supports it and one \u003cb>stakeholder who loses\u003c/b>.\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cb>Then think like Rawls\u003c/b>\u003cp class=\"sm\">Which rulebook would you choose if you didn't know whether you'd be Dana, Marco or Meridian's finance director?\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"15\">\u003cdiv class=\"k\">Activate · pitch and challenge\u003c/div>\u003ch2>The Board Asks\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003col class=\"sm\">\u003cli>Presenter pitches your policy: \u003cb>60 seconds\u003c/b>.\u003c/li>\u003cli>The board draws one question card.\u003c/li>\u003cli>Presenter answers: \u003cb>30 seconds\u003c/b> (+ one sentence from a teammate).\u003c/li>\u003c/ol>\n\u003cp class=\"sm\">\u003cb>Vote for the best answer\u003c/b>, not the policy you like:\u003cbr>✓ names a framework ✓ gives evidence ✓ answers the cost question\u003c/p>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp class=\"sm\">\u003ci>\"Why should we pay more than the law requires?\"\u003c/i>\u003c/p>\u003cp class=\"sm\">\u003ci>\"How much will this cost us, and who pays?\"\u003c/i>\u003c/p>\u003cp class=\"sm\">\u003ci>\"Marco negotiated better. Isn't that fair?\"\u003c/i>\u003c/p>\u003cp class=\"sm\">\u003ci>\"What do we do where the law is weaker?\"\u003c/i>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\">\u003cdiv class=\"k\">Personal Code of Ethics · draft\u003c/div>\u003ch2>From red lines to a code\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv class=\"box\">\u003col>\u003cli>\u003cb>My core values\u003c/b> (3)\u003c/li>\u003cli>\u003cb>My commitments\u003c/b> to my organization, colleagues, clients/public, and the rights of everyone I work with\u003c/li>\u003cli>\u003cb>My red lines\u003c/b> ← Week 7, Part 12\u003c/li>\u003cli>\u003cb>A hard case\u003c/b> + a framework\u003c/li>\u003cli>\u003cb>How I'll keep my code\u003c/b>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"box g\">\u003cp>\u003cb>350–450 words\u003c/b>\u003c/p>\u003cp class=\"sm\">Write it in the \u003cb>Code of Ethics Draft\u003c/b> tab. It saves, counts words and builds your finished code.\u003c/p>\u003cp class=\"sm\">Bring it to \u003cb>Week 9\u003c/b> for peer review.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"s\" data-min=\"8\">\u003cdiv class=\"k\">Personal Code of Ethics · the specific test\u003c/div>\u003ch2>Could someone check it?\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Vague\u003c/th>\u003cth>Specific\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\"I will be fair.\"\u003c/td>\u003ctd>\"I will base pay recommendations on job content, not on a person's salary history.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"I will respect diversity.\"\u003c/td>\u003ctd>\"In meetings I lead, I will ask everyone for input before I give my opinion.\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\"I will be honest.\"\u003c/td>\u003ctd>\"I will correct a mistake in a client report within one working day of finding it.\"\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sm\">Now write yours: \u003cb>\"To respect the rights of everyone I work with, I will…\"\u003c/b> Then ask your partner: \u003ci>Could someone check this?\u003c/i>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s dark\" data-min=\"25\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Assess\u003c/div>\u003ch2>Quiz 3 · Chapters 6–8\u003c/h2>\n\u003cul>\u003cli>Part A · Multiple choice (10)\u003c/li>\u003cli>Part B · Matching (8)\u003c/li>\u003cli>Part C · Short case response (12)\u003c/li>\u003c/ul>\n\u003cp>30 points · 25 minutes · no phones or notes\u003c/p>\u003c/div>\n\n\u003cdiv class=\"s dark\">\u003cdiv class=\"k\" style=\"color:var(--gold)\">Close\u003c/div>\u003ch2>Exit ticket and homework\u003c/h2>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>\u003cb>Exit ticket (Part 10)\u003c/b>\u003c/p>\u003col class=\"sm\">\u003cli>One difference between diversity and inclusion\u003c/li>\u003cli>One thing a company should do even if the law doesn't require it\u003c/li>\u003cli>Confidence today, 1–4\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv>\u003cp>\u003cb>Homework\u003c/b>\u003c/p>\u003cul class=\"sm\">\u003cli>Finish your \u003cb>Personal Code of Ethics\u003c/b> draft (350–450 words). Bring it to Week 9 for peer review.\u003c/li>\u003cli>Read 8.5 if you haven't.\u003c/li>\u003cli>Preview Chapter 9 (from p. 265).\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\n\n\u003c/div>\n\u003cdiv class=\"nav\">\u003cbutton onclick=\"go(-1)\" aria-label=\"Previous\">‹\u003c/button>\u003cbutton onclick=\"fs()\">Full screen\u003c/button>\u003cbutton onclick=\"go(1)\" aria-label=\"Next\">›\u003c/button>\u003c/div>\n\u003cscript>\nconst S=[...document.querySelectorAll('.s')];let i=0,iv=null;\nS.forEach((s,n)=>{if(!s.classList.contains('title')){const f=document.createElement('div');f.className='foot';f.innerHTML='\u003cimg src=\"logo.png\" alt=\"\">\u003cspan>Ethics in a Global World · Week 8\u003c/span>\u003cspan class=\"n\">'+(n+1)+' / '+S.length+'\u003c/span>';s.appendChild(f)}\n if(s.dataset.min){const t=document.createElement('div');t.className='timer';const sec=s.dataset.min*60;t.innerHTML='\u003cb>'+fmt(sec)+'\u003c/b>\u003cbutton>Start\u003c/button>\u003cbutton>Reset\u003c/button>';s.appendChild(t);let left=sec;const [b,st,rs]=t.children;\n st.onclick=e=>{e.stopPropagation();if(iv){clearInterval(iv);iv=null;st.textContent='Start';return}st.textContent='Pause';iv=setInterval(()=>{left--;b.textContent=fmt(Math.max(left,0));if(left\u003c=0){clearInterval(iv);iv=null;t.classList.add('done');st.textContent='Start'}},1000)};\n rs.onclick=e=>{e.stopPropagation();clearInterval(iv);iv=null;left=sec;b.textContent=fmt(sec);t.classList.remove('done');st.textContent='Start'}}});\nfunction fmt(x){return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}\nfunction show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k===i));try{history.replaceState(null,'','#'+(i+1))}catch(e){}}\nfunction go(d){show(i+d)}\nfunction fs(){const d=document.documentElement;if(!document.fullscreenElement){d.requestFullscreen&&d.requestFullscreen()}else document.exitFullscreen()}\ndocument.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='f')fs()});\ndocument.getElementById('deck').addEventListener('click',e=>{if(e.target.closest('button,[contenteditable],a'))return;const x=e.clientX/innerWidth;go(x\u003c0.3?-1:1)});\nlet tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d\u003c0?1:-1);tx=null});\nshow(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));\n\u003c/script>\n\u003c/body>\u003c/html>\n", "summary": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Week 8 · Chapter 8 Summary\u003c/title>\n\u003cstyle>\n:root{--navy:#143865;--blue:#1c4f8f;--dgold:#8c7535;--gold:#d39f10;--sky:#c1cddd;--sky2:#e1e8f2;--sky3:#edf2f9;--warm:#efe9d9;--ink:#1d2433;--mut:#5b6577}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sky3);line-height:1.55;font-size:16px}\n.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 16px;border-bottom:3px solid var(--gold)}\n.top img{width:44px;height:44px;border-radius:6px}\n.top .t{font-weight:700;font-size:17px;line-height:1.2}\n.top .t small{display:block;font-w
