<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 4 Vocabulary Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#143865; --blue:#1c4f8f; --gold-dk:#8c7535; --gold:#d39f10;
    --sky-dk:#c1cddd; --sky-md:#e1e8f2; --sky-lt:#edf2f9; --warm:#efe9d9;
    --ink:#1b2430; --muted:#55606e; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Source Sans 3",Arial,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--navy) 0%,#0f2b4f 100%);
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 24px;color:#fff;flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column;line-height:1.05}
  .brand b{font-family:"Libre Baskerville",Georgia,serif;letter-spacing:.12em;color:var(--gold);font-size:1.1rem}
  .brand span{font-family:"Libre Baskerville",Georgia,serif;font-size:.72rem;color:var(--warm);letter-spacing:.04em}
  .topinfo{font-size:.9rem;color:var(--sky-dk);text-align:right}
  .toggles{display:flex;gap:8px;align-items:center}
  .tbtn{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 14px;font:600 .85rem "Source Sans 3",sans-serif;cursor:pointer}
  .tbtn[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 0}
  .slide{
    display:none;width:min(1100px,100%);min-height:560px;background:var(--card);
    border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;
    border-top:10px solid var(--gold);
  }
  .slide.active{display:grid;grid-template-columns:1.05fr 1fr}
  .left{background:var(--sky-lt);padding:36px 36px 28px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--sky-dk)}
  .right{padding:36px 36px 28px;display:flex;flex-direction:column;gap:16px}
  .num{font-weight:700;color:var(--gold-dk);letter-spacing:.1em;text-transform:uppercase;font-size:.85rem}
  .group{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:600;margin-left:8px;letter-spacing:.04em;text-transform:none}
  .word{font-family:"Libre Baskerville",Georgia,serif;font-size:clamp(2.4rem,5vw,3.6rem);color:var(--navy);margin:0;line-height:1.1}
  .pos{font-style:italic;color:var(--muted);font-size:1.15rem}
  .ipa{font-size:1.35rem;color:var(--blue);font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif}
  .stress{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .syl{padding:6px 12px;border-radius:8px;background:#fff;border:1px solid var(--sky-dk);font-size:1.25rem;color:var(--muted)}
  .syl.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;font-size:1.5rem;text-transform:uppercase}
  .dot{color:var(--sky-dk);font-weight:700}
  .label{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dk)}
  .audio{display:flex;flex-wrap:wrap;gap:8px}
  .abtn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:9px 14px;background:var(--blue);color:#fff;font:600 .95rem "Source Sans 3",sans-serif;cursor:pointer}
  .abtn.alt{background:var(--navy)}
  .abtn:hover{filter:brightness(1.12)}
  .abtn svg{width:16px;height:16px;fill:currentColor}
  .links{display:flex;flex-wrap:wrap;gap:12px;font-size:.92rem;margin-top:auto}
  .links a{color:var(--blue);font-weight:600}
  .def{font-size:1.3rem;line-height:1.45;margin:0}
  .ex{margin:0;padding:12px 14px;border-left:5px solid var(--gold);background:var(--warm);border-radius:6px;font-size:1.12rem;line-height:1.45;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .ex .play{flex:none;border:none;background:var(--navy);color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
  .ex .play svg{width:14px;height:14px;fill:#fff}
  .story{font-size:1rem;color:var(--muted);background:var(--sky-md);border-radius:8px;padding:10px 12px}
  .story b{color:var(--navy)}
  .extra{font-size:.98rem;color:var(--ink)}
  .hideable.hidden{filter:blur(7px);user-select:none;cursor:pointer}
  .reveal-hint{display:none;font-size:.85rem;color:var(--gold-dk);font-weight:600}
  .quiz .reveal-hint{display:block}
  /* title slide */
  .slide.title.active{display:flex;flex-direction:column;justify-content:center;padding:56px;background:var(--navy);color:#fff;border-top-color:var(--gold)}
  .title h1{font-family:"Libre Baskerville",Georgia,serif;font-size:clamp(2rem,4.5vw,3.2rem);margin:.2em 0;color:#fff}
  .title h2{font-weight:400;color:var(--warm);margin:0 0 24px;font-size:1.3rem}
  .title .gold{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:.9rem}
  .title ul{line-height:1.7;font-size:1.08rem;color:var(--sky-md);max-width:760px}
  .title a{color:var(--gold)}
  .wordgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .wordgrid button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;font:600 .95rem "Source Sans 3",sans-serif;cursor:pointer}
  .wordgrid button:hover{background:var(--gold);color:var(--navy)}
  nav.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;color:#fff}
  nav.controls button{background:var(--gold);color:var(--navy);border:none;border-radius:999px;padding:10px 22px;font:700 1rem "Source Sans 3",sans-serif;cursor:pointer}
  nav.controls button:disabled{opacity:.4;cursor:default}
  #counter{min-width:90px;text-align:center;font-weight:600;color:var(--sky-md)}
  .warn{color:#fff;background:#8a2d2d;padding:6px 12px;border-radius:8px;font-size:.85rem;display:none}
  @media (max-width:820px){
    .slide.active{grid-template-columns:1fr}
    .left{border-right:none;border-bottom:1px solid var(--sky-dk)}
    .slide{min-height:auto}
  }
  @media print{
    body{background:#fff}
    header .toggles,nav.controls{display:none}
    header{color:var(--navy)}
    .slide,.slide.title{display:grid!important;grid-template-columns:1fr 1fr;page-break-after:always;box-shadow:none;border:1px solid #999;margin:0 auto 12px;min-height:auto}
    .slide.title{display:none!important}
    .audio,.ex .play{display:none}
    .hideable.hidden{filter:none}
  }
.logo{width:56px;height:56px;border-radius:6px;display:block}
</style>
</head>

const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const spkIcon = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const deck = document.getElementById('deck');

// Title slide
let html = `<section class="slide title">
  <div class="gold">Week 4 · Vocabulary in Context</div>
  <h1>“The Wife of His Youth”</h1>
  <h2>Charles W. Chesnutt (1898) · 12 key words + 3 literary terms</h2>
  <ul>
    <li>Each card shows the <b>pronunciation</b>, <b>stressed syllable</b>, <b>meaning</b>, where the word appears in the adapted reading (§ = section), and <b>two examples</b>.</li>
    <li>Press the blue buttons to hear the word and the examples (American English voice). Use the “Slow” button for careful listening.</li>
    <li>Use <b>Guess-first mode</b> to blur meanings and examples so students predict before you reveal.</li>
    <li>Keyboard: ← → to move between cards.</li>
    <li>Words 1–7 are for Class A (Parts I–II). Words 8–12 are for Class B (Part III): show them only after the Ball simulation, because they hint at the ending. Cards 13–15 are the Literary Lens and Author’s Style terms.</li>
    <li>Original text (public domain): <a href="https://www.gutenberg.org/cache/epub/11057/pg11057.html" target="_blank" rel="noopener">Project Gutenberg (original text)</a> · <a href="https://en.wikipedia.org/wiki/The_Wife_of_His_Youth" target="_blank" rel="noopener">about the story</a></li>
  </ul>
  <div class="wordgrid">${WORDS.map((o,i)=>`<button data-go="${i+1}">${o.w}</button>`).join('')}</div>
</section>`;

WORDS.forEach((o,i)=>{
  const syl = o.syl.map((x,j)=>`<span class="syl ${j===o.s?'on':''}">${x}</span>`).join('<span class="dot">·</span>');
  html += `<section class="slide" data-i="${i}">
    <div class="left">
      <div class="num">Word ${i+1} of ${WORDS.length}<span class="group">${o.group}</span></div>
      <h2 class="word">${o.w}</h2>
      <div class="pos">${o.pos}</div>
      <div><div class="label">Pronunciation</div><div class="ipa">${o.ipa}</div></div>
      <div><div class="label">Stress</div><div class="stress">${syl}</div></div>
      <div class="audio">
        <button class="abtn" data-say="${o.w}" data-rate="0.9">${spkIcon} Hear it</button>
        <button class="abtn alt" data-say="${o.w}" data-rate="0.55">${spkIcon} Slow</button>
      </div>
      <div class="extra">${o.extra}</div>
      <div class="links">
        <a href="https://dictionary.cambridge.org/dictionary/english/${o.slug}" target="_blank" rel="noopener">Cambridge Dictionary (US/UK audio)</a>
        <a href="https://youglish.com/pronounce/${encodeURIComponent(o.w)}/english/us" target="_blank" rel="noopener">YouGlish (real speakers)</a>
      </div>
    </div>
    <div class="right">
      <div><div class="label">Meaning</div><p class="def hideable">${o.def}</p></div>
      <div class="story hideable">${o.story}</div>
      <div class="label">Examples</div>
      ${o.ex.map((e,k)=>`<p class="ex hideable"><span><b>${k+1}.</b> ${e}</span><button class="play" title="Play example ${k+1}" data-say="${e.replace(/"/g,'&quot;')}" data-rate="0.9">${playIcon}</button></p>`).join('')}
      <div class="reveal-hint">Click a blurred box to reveal it.</div>
    </div>
  </section>`;
});
deck.innerHTML = html;

const slides = [...document.querySelectorAll('.slide')];
let cur = 0;
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,i)=>s.classList.toggle('active', i===cur));
  document.getElementById('counter').textContent = cur===0 ? 'Start' : `${cur} / ${WORDS.length}`;
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===slides.length-1;
  if (quiz) slides[cur].querySelectorAll('.hideable').forEach(h=>h.classList.add('hidden'));
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(+b.dataset.go));

// Guess-first mode
let quiz=false;
const qb=document.getElementById('quizBtn');
qb.onclick=()=>{
  quiz=!quiz; qb.setAttribute('aria-pressed',quiz);
  document.body.classList.toggle('quiz',quiz);
  document.querySelectorAll('.hideable').forEach(h=>h.classList.toggle('hidden',quiz));
};
document.addEventListener('click',e=>{
  const h=e.target.closest('.hideable.hidden');
  if(h && !e.target.closest('button')) h.classList.remove('hidden');
});

// Audio (Web Speech API, American English voice when available)
let voice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en-US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny|Natural/i.test(v.name))
       || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;
} else {
  document.getElementById('ttsWarn').style.display='inline-block';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]'); if(!b) return;
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(b.dataset.say);
  u.lang='en-US'; u.rate=parseFloat(b.dataset.rate||'0.9');
  if(voice) u.voice=voice;
  speechSynthesis.speak(u);
});
show(0);
</script>
