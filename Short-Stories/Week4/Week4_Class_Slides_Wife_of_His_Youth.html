<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 4 Class Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#143865;--blue:#1c4f8f;--gold:#d39f10;--gold-dk:#8c7535;--warm:#efe9d9;--sky-lt:#edf2f9;--sky-md:#e1e8f2;--sky-dk:#c1cddd;--ink:#1b2430;--muted:#55606e;
        --E:#d39f10;--S:#1c4f8f;--A:#2f6b45;--X:#7a8798}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Source Sans 3",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--navy) 0%,#0f2b4f 100%);display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;color:#fff;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.05}
  .brand b{font-family:"Libre Baskerville",Georgia,serif;letter-spacing:.12em;color:var(--gold);font-size:1.05rem}
  .brand span{font-family:"Libre Baskerville",Georgia,serif;font-size:.7rem;color:var(--warm)}
  .topinfo{font-size:.88rem;color:var(--sky-dk);text-align:right}
  .tools{display:flex;gap:8px}
  .tbtn{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 14px;font:600 .85rem "Source Sans 3",sans-serif;cursor:pointer}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 16px 0}
  .slide{display:none;width:min(1180px,100%);min-height:600px;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;border-top:10px solid var(--gold);position:relative}
  .slide.active{display:flex;flex-direction:column}
  .sh{display:flex;align-items:center;gap:14px;padding:22px 36px 14px;border-bottom:2px solid var(--sky-md);flex-wrap:wrap}
  .stage{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem;color:#fff;border-radius:999px;padding:5px 14px}
  .st-E{background:var(--E);color:var(--navy)} .st-S{background:var(--S)} .st-A{background:var(--A)} .st-X{background:var(--X)}
  .part{font-weight:700;color:var(--gold-dk);letter-spacing:.06em;text-transform:uppercase;font-size:.9rem}
  .sh h2{font-family:"Libre Baskerville",Georgia,serif;color:var(--navy);margin:0;font-size:clamp(1.6rem,3vw,2.3rem);flex-basis:100%}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .chip{background:var(--sky-lt);border:1px solid var(--sky-dk);color:var(--navy);border-radius:8px;padding:4px 12px;font-weight:700;font-size:.95rem}
  .chip.time{background:var(--navy);color:var(--gold);border-color:var(--navy)}
  .sb{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;padding:22px 36px 18px;flex:1}
  .sb.one{grid-template-columns:1fr}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 52px;font-size:1.32rem;line-height:1.4;border-bottom:1px solid var(--sky-md)}
  ol.steps li:last-child{border-bottom:none}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:700;display:grid;place-items:center;font-size:1.1rem}
  ol.steps li small{display:block;color:var(--muted);font-size:1rem}
  .side{display:flex;flex-direction:column;gap:14px}
  .box{background:var(--warm);border-left:8px solid var(--gold);border-radius:8px;padding:14px 18px;font-size:1.15rem;line-height:1.45}
  .box.blue{background:var(--sky-lt);border-left-color:var(--blue)}
  .box b.h{display:block;color:var(--gold-dk);letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;margin-bottom:4px}
  .box.blue b.h{color:var(--blue)}
  .quote{font-family:"Libre Baskerville",Georgia,serif;font-style:italic;color:var(--navy);font-size:1.25rem}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid3 div{background:var(--navy);color:#fff;border-radius:8px;padding:12px;text-align:center;font-weight:700;font-size:1.05rem}
  .grid3 div span{display:block;color:var(--gold);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
  .timer{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .timer .t{font:700 2.6rem/1 "Source Sans 3",sans-serif;color:var(--gold);min-width:120px;font-variant-numeric:tabular-nums}
  .timer .t.done{color:#ff8b7b}
  .timer button{background:var(--gold);color:var(--navy);border:none;border-radius:999px;padding:8px 16px;font:700 .95rem "Source Sans 3",sans-serif;cursor:pointer}
  .timer button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .timer .lab{color:var(--sky-dk);font-size:.85rem;width:100%}
  .sf{padding:10px 36px 16px}
  .track{height:10px;background:var(--sky-md);border-radius:999px;position:relative;overflow:hidden}
  .track i{position:absolute;top:0;bottom:0;background:var(--gold);border-radius:999px}
  .tracklab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:4px}
  /* title / agenda / break */
  .slide.dark{background:var(--navy);color:#fff}
  .dark .center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:50px 60px}
  .dark h1{font-family:"Libre Baskerville",Georgia,serif;font-size:clamp(2.2rem,4.6vw,3.6rem);margin:.15em 0;color:#fff}
  .dark .kick{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .dark .subt{color:var(--warm);font-size:1.35rem}
  .dark .three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
  .dark .three div{border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:12px 14px;color:var(--sky-md)}
  .dark .three b{display:block;color:var(--gold);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
  .agenda{list-style:none;margin:0;padding:0}
  .agenda li{display:grid;grid-template-columns:110px 120px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--sky-md);font-size:1.15rem}
  .agenda .tm{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
  .agenda .stage{font-size:.72rem;padding:3px 10px;text-align:center}
  .bigclock{font:700 6rem/1 "Source Sans 3",sans-serif;color:var(--gold);margin:20px 0;font-variant-numeric:tabular-nums}
  nav.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;color:#fff}
  nav.controls button{background:var(--gold);color:var(--navy);border:none;border-radius:999px;padding:9px 22px;font:700 1rem "Source Sans 3",sans-serif;cursor:pointer}
  nav.controls button:disabled{opacity:.4;cursor:default}
  #counter{min-width:110px;text-align:center;font-weight:600;color:var(--sky-md)}
  select.jump{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px;font:inherit;max-width:260px}
  select.jump option{color:var(--ink)}
  @media (max-width:860px){ .sb{grid-template-columns:1fr} .agenda li{grid-template-columns:90px 1fr} .agenda li .stage{display:none} .dark .three,.grid3{grid-template-columns:1fr} ol.steps li{font-size:1.1rem} }
  @media print{
    @page{size:letter landscape;margin:8mm}
    body{background:#fff} header,nav.controls,.timer{display:none!important}
    .slide{display:flex!important;flex-direction:column;box-shadow:none;border:1px solid #bbb;page-break-after:always;min-height:0;width:100%}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
.logo{width:52px;height:52px;border-radius:6px;display:block}
</style>
</head>

        <div class="grid3" style="grid-template-columns:1fr"><div><span>Sign 1</span>Acknowledge her publicly</div><div><span>Sign 2</span>Help her privately</div><div><span>Sign 3</span>Say nothing</div></div>`},

const stageName={E:'Engage',S:'Study',A:'Activate',X:'Logistics'};
const deck=document.getElementById('deck');
function track(st,en){return `<div class="sf"><div class="track"><i style="left:${st}%;width:${en-st}%"></i></div><div class="tracklab"><span>0 min</span><span>Class progress · minutes ${st}–${en}</span><span>100 min</span></div></div>`;}
function agenda(cls){
  const items=S.filter(s=>s.cls===cls&&s.title);
  return `<section class="slide"><div class="sh"><span class="stage st-X">Overview</span><span class="part">Class ${cls} · 100 minutes</span><h2>Class ${cls}: Today’s Flow</h2></div>
  <div class="sb one"><ul class="agenda">${items.map(s=>`<li><span class="tm">${s.start}–${s.end}</span><span class="stage st-${s.stage}">${stageName[s.stage]}</span><span><b>${s.title}</b> <span style="color:var(--muted)">· ${s.group}</span></span></li>`).join('')}</ul></div></section>`;
}
let html='';
S.forEach((s,i)=>{
  if(s.type==='title'){
    html+=`<section class="slide dark"><div class="center"><div class="kick">Week 4 · Unit II: New American Voices</div><h1>“The Wife of His Youth”</h1><div class="subt">Charles W. Chesnutt (1898)</div>
    <div class="three"><div><b>Literary Lens</b>Characterization &amp; Antihero</div><div><b>Author’s Style</b>Juxtaposition</div><div><b>Assignment</b>Author’s Style Analysis 1</div></div></div></section>`;
  } else if(s.type==='agenda'){ html+=agenda(s.cls);
  } else if(s.type==='break'){
    html+=`<section class="slide dark"><div class="center" style="align-items:center;text-align:center"><div class="kick">Break</div><h1>30-Minute Break</h1><div class="bigclock" id="bclock">30:00</div>
    <div class="timer" style="background:transparent;justify-content:center"><button data-bt="start">Start</button><button class="ghost" data-bt="reset">Reset</button></div>
    <div class="subt" style="margin-top:16px">Class B begins with Conscience Alley. Please do not read Part III yet.</div></div></section>`;
  } else if(s.type==='end'){
    html+=`<section class="slide dark"><div class="center" style="align-items:center;text-align:center"><div class="kick">Week 4</div><h1>Thank you</h1><div class="subt">Next week: Unit III. Bring your Author’s Style Analysis 1.</div></div></section>`;
  } else {
    const mins=s.end-s.start;
    html+=`<section class="slide"><div class="sh"><span class="stage st-${s.stage}">${stageName[s.stage]}</span><span class="part">Class ${s.cls} · ${s.part}</span>
      <div class="meta"><span class="chip">${s.group}</span><span class="chip time">${s.start}–${s.end} min · ${mins} min</span></div><h2>${s.title}</h2></div>
      <div class="sb"><ol class="steps">${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
      <div class="side">${s.side||''}<div class="timer" data-min="${mins}"><span class="t">${String(mins).padStart(2,'0')}:00</span><button data-t="start">Start</button><button class="ghost" data-t="reset">Reset</button><span class="lab">Activity timer</span></div></div></div>
      ${track(s.start,s.end)}</section>`;
  }
});
deck.innerHTML=html;

const slides=[...document.querySelectorAll('.slide')];
const jump=document.getElementById('jump');
jump.innerHTML=S.map((s,i)=>`<option value="${i}">${i+1}. ${s.type==='title'?'Title':s.type==='agenda'?'Class '+s.cls+' overview':s.type==='break'?'Break':s.type==='end'?'End':'Class '+s.cls+' · '+s.title}</option>`).join('');
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((x,i)=>x.classList.toggle('active',i===cur));
  document.getElementById('counter').textContent=`${cur+1} / ${slides.length}`;
  document.getElementById('prev').disabled=cur===0; document.getElementById('next').disabled=cur===slides.length-1;
  jump.value=cur;
  try{localStorage.setItem('approach_w4_slide',cur)}catch(e){}
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
jump.onchange=()=>show(+jump.value);
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT')return; if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(cur+1)} if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1)});
document.getElementById('fs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

// Timers
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
document.querySelectorAll('.timer[data-min]').forEach(t=>{
  const total=+t.dataset.min*60; let left=total, id=null; const d=t.querySelector('.t'), b=t.querySelector('[data-t=start]');
  b.onclick=()=>{ if(id){clearInterval(id);id=null;b.textContent='Start';return;} b.textContent='Pause';
    id=setInterval(()=>{ left--; d.textContent=fmt(Math.max(left,0)); if(left<=0){clearInterval(id);id=null;b.textContent='Start';d.classList.add('done');} },1000); };
  t.querySelector('[data-t=reset]').onclick=()=>{clearInterval(id);id=null;left=total;d.textContent=fmt(total);d.classList.remove('done');b.textContent='Start';};
});
(()=>{ const c=document.getElementById('bclock'); if(!c)return; let left=1800,id=null; const b=document.querySelector('[data-bt=start]');
  b.onclick=()=>{ if(id){clearInterval(id);id=null;b.textContent='Start';return;} b.textContent='Pause'; id=setInterval(()=>{left--;c.textContent=fmt(Math.max(left,0)); if(left<=0){clearInterval(id);id=null;b.textContent='Start';}},1000); };
  document.querySelector('[data-bt=reset]').onclick=()=>{clearInterval(id);id=null;left=1800;c.textContent='30:00';b.textContent='Start';};
})();
let start=0; try{start=+(localStorage.getItem('approach_w4_slide')||0)}catch(e){}
show(start||0);
</script>
</body>
</html>
