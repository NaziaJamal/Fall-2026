&lt;h1 class=&quot;author&quot;&gt;Stephen Crane&lt;/h1&gt;&lt;div class=&quot;dates&quot;&gt;1871 – 1900 · American writer and journalist&lt;/div&gt;
&lt;div class=&quot;bio&quot;&gt;&lt;h2 class=&quot;sub&quot;&gt;About the Author&lt;/h2&gt;&lt;div class=&quot;photo&quot;&gt;Picture:&lt;br&gt;Stephen Crane&lt;/div&gt;
&lt;p&gt;Stephen Crane was born in 1871 in Newark, New Jersey. He was the youngest of fourteen children. His father was a minister, and his mother wrote for newspapers. Crane loved writing from a young age, and he left college to work as a newspaper reporter in New York City.&lt;/p&gt;
&lt;p&gt;In 1895, when he was only 24, he published The Red Badge of Courage, a novel about a young soldier in the American Civil War. The book made him famous in the United States and in Britain. Crane had never been in a war, but people said the book felt completely real.&lt;/p&gt;
&lt;p&gt;After this, newspapers sent Crane to report on wars and dangerous places. He worked as a correspondent — a reporter who sends news from far away. He later lived in England, where he became friends with famous writers like Joseph Conrad and H. G. Wells.&lt;/p&gt;
&lt;p&gt;Crane was often sick, and he died of tuberculosis in 1900, in Germany. He was only 28 years old. Today he is remembered as one of the most important American writers of his time.&lt;/p&gt;
&lt;h2 class=&quot;sub&quot; style=&quot;clear:both&quot;&gt;Historical Context&lt;/h2&gt;
&lt;p&gt;“The Open Boat” is based on a true story. On January 1, 1897, Crane got on a ship called the Commodore in Jacksonville, Florida. The ship was secretly carrying weapons to Cuba, where people were fighting for independence from Spain. Crane was going there to write about the war.&lt;/p&gt;
&lt;p&gt;On the morning of January 2, the Commodore sank in the Atlantic Ocean, near the coast of Florida. Crane and three other men — the captain, the cook, and an oiler (an engine-room worker) — escaped in a tiny boat called a dinghy. They spent about thirty hours at sea before they tried to reach the beach near Daytona.&lt;/p&gt;
&lt;p&gt;The four men in the story are based on the real men. The original title says it is “A Tale Intended to Be After the Fact” — a story told after it really happened. The story was published in Scribner&amp;#x27;s Magazine in June 1897.&lt;/p&gt;
&lt;p&gt;Crane&amp;#x27;s story belongs to a style called naturalism. Naturalist writers show people as small and weak in a world controlled by nature and chance. In naturalism, nature is not good or evil. It simply does not care.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;help&quot;&gt;&lt;div class=&quot;lt&quot;&gt;WHO IS IN THE BOAT?&lt;/div&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;The captain&lt;/td&gt;&lt;td&gt;The leader. He was the captain of the ship that sank. His arm is hurt.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The oiler (Billie)&lt;/td&gt;&lt;td&gt;He worked in the ship&amp;#x27;s engine room. He is a strong, experienced sailor.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The cook&lt;/td&gt;&lt;td&gt;A fat, cheerful man. He talks a lot and bails water out of the boat.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The correspondent&lt;/td&gt;&lt;td&gt;A newspaper reporter. The story often shows us his thoughts.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;help&quot;&gt;&lt;div class=&quot;lt&quot;&gt;SEA WORDS&lt;/div&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;dinghy&lt;/td&gt;&lt;td&gt;a very small open boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;bow / stern&lt;/td&gt;&lt;td&gt;the front / the back of a boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;oar&lt;/td&gt;&lt;td&gt;a long wooden pole with a flat end, used to row&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;to bail&lt;/td&gt;&lt;td&gt;to throw water out of a boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;surf&lt;/td&gt;&lt;td&gt;big waves that break on the beach&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;life belt&lt;/td&gt;&lt;td&gt;a belt made of cork that helps you float&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;pic&quot;&gt;Picture: the four men in the dinghy (with the parts of the boat labeled)&lt;/div&gt;
&lt;div class=&quot;pb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;running&quot;&gt;THE OPEN BOAT&lt;/div&gt;
&lt;h1 class=&quot;title&quot;&gt;THE OPEN BOAT&lt;/h1&gt;
&lt;div class=&quot;byline&quot;&gt;Stephen Crane · adapted for A2–B1+ readers&lt;/div&gt;
&lt;div class=&quot;partlbl&quot;&gt;PART 1 OF 3 · SECTIONS I–III · WEEK 7&lt;/div&gt;
&lt;div class=&quot;lens&quot;&gt;&lt;div class=&quot;lt&quot;&gt;LITERARY LENS: MAN VS. NATURE&lt;/div&gt;&lt;p&gt;In “The Open Boat,” the main conflict is between four men and the sea. The men cannot fight the sea with guns or words. They can only row, wait, and hope. As you read, notice how the men feel about the sea and how they work together.&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Man vs. Nature&lt;/td&gt;&lt;td&gt;A conflict where characters struggle against a natural force — a storm, the sea, cold, or wild animals.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Setting&lt;/td&gt;&lt;td&gt;Where and when a story happens. Here: a tiny boat on a cold, wild sea near Florida, in January.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Character&lt;/td&gt;&lt;td&gt;A person in a story. We learn about characters from what they say, what they do, and what others say about them.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;help&quot;&gt;&lt;div class=&quot;lt&quot;&gt;READING HELP&lt;/div&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;house of refuge / life-saving station&lt;/td&gt;&lt;td&gt;In the 1890s, the Florida coast had small houses with food and clothes for shipwrecked people (houses of refuge). Life-saving stations had a crew and a rescue boat. The men argue about which one is near.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mosquito Inlet, New Smyrna&lt;/td&gt;&lt;td&gt;Real places on the east coast of Florida.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“steal eggs from under a sitting hen”&lt;/td&gt;&lt;td&gt;a very difficult and careful job. Changing seats in the boat is even harder!&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;I · Four Men in a Small Boat&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶1&lt;/span&gt;&lt;p&gt;None of them knew the color of the sky. Their eyes looked straight ahead and stayed on the waves that rushed toward them. These waves were gray like slate, except for the tops, which were white with foam. All of the men knew the colors of the sea. The horizon became narrow and then wide again. It went down and came up again, and its edge was always rough with waves that pushed up in sharp points, like rocks.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶2&lt;/span&gt;&lt;p&gt;Many people have a bathtub bigger than the boat that was riding on the sea here. The waves were terribly and cruelly steep and tall, and each white top of foam was a new problem for a small boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶3&lt;/span&gt;&lt;p&gt;The cook sat low in the bottom of the boat. He looked hard at the six inches of wooden side that separated him from the ocean. His sleeves were rolled up over his fat arms, and the two sides of his open vest hung down as he bent forward to bail the water out of the boat. He often said, &amp;quot;My God! That was close.&amp;quot; Each time he said it, he looked east over the broken sea.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶4&lt;/span&gt;&lt;p&gt;The oiler was steering with one of the two oars in the boat. Sometimes he lifted himself up quickly to stay away from the water that came in over the back of the boat. It was a thin little oar, and it often seemed ready to break.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶5&lt;/span&gt;&lt;p&gt;The correspondent, pulling on the other oar, watched the waves and wondered why he was there.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;The correspondent … watched the waves and wondered why he was there.&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶6&lt;/span&gt;&lt;p&gt;The injured captain was lying in the front of the boat. At this time he was lost in a deep sadness and did not seem to care about anything. This feeling comes, for a while at least, even to the bravest and strongest men when the business fails, the army loses, or the ship goes down. A captain&amp;#x27;s mind is deeply connected to the wood of his ship, whether he has commanded her for one day or for ten years. This captain carried a terrible picture in his mind. In the gray light of early morning, he had seen seven faces turned toward him. Later he had seen the top of a broken mast, with a white ball on it, moving back and forth in the waves. It went down, lower and lower, and then it was gone. After that, there was something strange in his voice. It was steady, but it was deep with mourning, in a way that was beyond speeches or tears.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶7&lt;/span&gt;&lt;p&gt;&amp;quot;Keep her a little more south, Billie,&amp;quot; he said.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶8&lt;/span&gt;&lt;p&gt;&amp;quot;&amp;#x27;A little more south,&amp;#x27; sir,&amp;quot; said the oiler at the back of the boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶9&lt;/span&gt;&lt;p&gt;A seat in this boat was a lot like a seat on a wild, jumping horse — and a wild horse is not much smaller. The boat jumped up and kicked and fell forward like an animal. As each wave came and the boat rose up to meet it, she looked like a horse trying to jump over a fence that was much too high. How she climbed over these walls of water was a mystery. And at the top of each wave there were more problems: white foam raced down from the top and the boat needed to jump again, this time from the air. Then, after she hit the top of the wave as if she did not care, she slid and raced and splashed down a long slope. She arrived at the bottom, rocking and nodding, in front of the next danger.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶10&lt;/span&gt;&lt;p&gt;The sea has one very unpleasant quality. After you get safely over one wave, you discover that there is another wave behind it. This new wave is just as important, and just as nervous and eager to fill up and sink small boats. In a ten-foot dinghy, you can learn things about the waves of the sea that most people, who are never at sea in a dinghy, will never know. As each gray wall of water came toward them, it hid everything else from the men in the boat. It was easy to imagine that this wave was the ocean&amp;#x27;s last explosion of anger, the final effort of the hard, cruel water. There was a terrible beauty in the way the waves moved. They came in silence, except for the angry growling of their white tops.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶11&lt;/span&gt;&lt;p&gt;In the weak light, the men&amp;#x27;s faces must have been gray. Their eyes must have shone strangely as they looked steadily behind them. Seen from a balcony, the whole scene would probably have looked strangely beautiful, like a painting. But the men in the boat had no time to look at it. And if they had had free time, they had other things to think about. The sun moved steadily up the sky. They knew that it was full daylight because the color of the sea changed from gray to emerald green, with lines of golden light, and the foam looked like falling snow. They did not see the sun come up. They only noticed how it changed the color of the waves that rolled toward them.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶12&lt;/span&gt;&lt;p&gt;The cook and the correspondent argued, in short, broken sentences, about the difference between a life-saving station and a house of refuge. The cook had said, &amp;quot;There&amp;#x27;s a house of refuge just north of the Mosquito Inlet Light. As soon as they see us, they&amp;#x27;ll come out in their boat and pick us up.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶13&lt;/span&gt;&lt;p&gt;&amp;quot;As soon as who sees us?&amp;quot; said the correspondent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶14&lt;/span&gt;&lt;p&gt;&amp;quot;The crew,&amp;quot; said the cook.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶15&lt;/span&gt;&lt;p&gt;&amp;quot;Houses of refuge don&amp;#x27;t have crews,&amp;quot; said the correspondent. &amp;quot;As I understand it, they are only places where clothes and food are kept for shipwrecked people. They don&amp;#x27;t have crews.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶16&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, yes, they do,&amp;quot; said the cook.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶17&lt;/span&gt;&lt;p&gt;&amp;quot;No, they don&amp;#x27;t,&amp;quot; said the correspondent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶18&lt;/span&gt;&lt;p&gt;&amp;quot;Well, we&amp;#x27;re not there yet, anyway,&amp;quot; said the oiler at the back.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶19&lt;/span&gt;&lt;p&gt;&amp;quot;Well,&amp;quot; said the cook, &amp;quot;maybe the place I&amp;#x27;m thinking of near the Mosquito Inlet Light is not a house of refuge. Maybe it&amp;#x27;s a life-saving station.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶20&lt;/span&gt;&lt;p&gt;&amp;quot;We&amp;#x27;re not there yet,&amp;quot; said the oiler at the back.&lt;/p&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;II · The Gull and the Lighthouse&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶21&lt;/span&gt;&lt;p&gt;As the boat bounced from the top of each wave, the wind tore through the hair of the men, who had no hats. And as the boat dropped its back end down again, the spray of salt water flew past them. The top of each wave was like a hill. From there, for a moment, the men could see a wide, wild area of sea, shining and torn by the wind. It was probably wonderful. It was probably glorious, this game of the free sea, wild with lights of emerald and white and gold.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶22&lt;/span&gt;&lt;p&gt;&amp;quot;It&amp;#x27;s a really good thing the wind is blowing toward the shore,&amp;quot; said the cook. &amp;quot;If not, where would we be? We wouldn&amp;#x27;t have a chance.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶23&lt;/span&gt;&lt;p&gt;&amp;quot;That&amp;#x27;s right,&amp;quot; said the correspondent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶24&lt;/span&gt;&lt;p&gt;The busy oiler nodded to agree.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶25&lt;/span&gt;&lt;p&gt;Then the captain, in the front of the boat, laughed quietly. His laugh was funny, bitter, and tragic all at the same time. &amp;quot;Do you think we have much of a chance now, boys?&amp;quot; he said.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶26&lt;/span&gt;&lt;p&gt;The other three were silent, except for a few small, uncertain sounds. They felt that it would be childish and stupid to be very hopeful at this time, but each of them surely understood the situation in his own mind. A young man thinks stubbornly at times like these. On the other hand, the rules of their situation were strongly against saying openly that there was no hope. So they were silent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶27&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, well,&amp;quot; said the captain, calming them like a father with his children, &amp;quot;we&amp;#x27;ll get to the shore all right.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶28&lt;/span&gt;&lt;p&gt;But something in his voice made them think. So the oiler said, &amp;quot;Yes! If this wind stays!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶29&lt;/span&gt;&lt;p&gt;The cook was bailing. &amp;quot;Yes! If we don&amp;#x27;t get into terrible trouble in the surf.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶30&lt;/span&gt;&lt;p&gt;Seagulls, soft and white like cotton, flew near and far. Sometimes they sat down on the sea near pieces of brown seaweed. The seaweed rolled over the waves like carpets hanging on a clothesline in a storm. The birds sat comfortably in groups, and some of the men in the dinghy were jealous of them. The anger of the sea meant nothing to the birds — it was no more important to them than it was to a group of chickens on a farm a thousand miles from the ocean. Often the gulls came very close and stared at the men with black eyes like little beads. At these times they seemed strange and evil, because they stared and never blinked. The men shouted angrily at them and told them to go away. One gull came and clearly decided to land on top of the captain&amp;#x27;s head. The bird flew next to the boat. It did not fly in circles; it made short jumps sideways in the air, like a chicken. Its black eyes looked hungrily at the captain&amp;#x27;s head. &amp;quot;Ugly beast,&amp;quot; said the oiler to the bird. &amp;quot;You look like somebody made you with a pocketknife.&amp;quot; The cook and the correspondent cursed the bird darkly. Of course, the captain wanted to hit it away with the end of the heavy rope. But he did not dare, because any strong movement could turn over this heavy, full boat. So, with his open hand, the captain gently and carefully waved the gull away. After the bird gave up and flew off, the captain breathed more easily because his hair was safe. The others breathed more easily too, because at this time the bird seemed to them a terrible sign of something bad to come.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶31&lt;/span&gt;&lt;p&gt;Meanwhile, the oiler and the correspondent rowed. And they rowed some more.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶32&lt;/span&gt;&lt;p&gt;They sat together on the same seat, and each one rowed with one oar. Then the oiler took both oars. Then the correspondent took both oars. Then the oiler. Then the correspondent. They rowed and they rowed. The most dangerous part of the work was when the man resting at the back had to take his turn at the oars. In all truth, it is easier to steal eggs from under a sitting hen than it was to change seats in the dinghy. First, the man at the back slid his hand along the seat and moved very carefully, as if he were made of fine glass. Then the man in the rowing seat slid his hand along the other seat. Everything was done with great care. As the two men moved slowly past each other, everybody watched the next wave, and the captain shouted, &amp;quot;Look out now! Steady there!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶33&lt;/span&gt;&lt;p&gt;From time to time, they saw brown mats of seaweed that looked like islands, little pieces of land. They did not seem to be moving in any direction. They were, in fact, almost still. They told the men in the boat that the boat was moving slowly toward the land.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶34&lt;/span&gt;&lt;p&gt;The boat climbed a big wave, and the captain carefully lifted himself up in the front. He said that he had seen the lighthouse at Mosquito Inlet. Soon the cook said that he had seen it too. The correspondent was rowing at that moment, and for some reason he also wanted to look at the lighthouse. But his back was toward the faraway shore, and the waves were important, so for some time he could not find a chance to turn his head. But at last a gentler wave came, and when he was at the top of it, he quickly searched the western horizon.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶35&lt;/span&gt;&lt;p&gt;&amp;quot;See it?&amp;quot; said the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶36&lt;/span&gt;&lt;p&gt;&amp;quot;No,&amp;quot; said the correspondent slowly. &amp;quot;I didn&amp;#x27;t see anything.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶37&lt;/span&gt;&lt;p&gt;&amp;quot;Look again,&amp;quot; said the captain. He pointed. &amp;quot;It&amp;#x27;s exactly in that direction.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶38&lt;/span&gt;&lt;p&gt;At the top of another wave, the correspondent did what he was told. This time his eyes found a small, still thing on the edge of the moving horizon. It was exactly like the point of a pin. Only a worried, hopeful eye could find a lighthouse so tiny.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶39&lt;/span&gt;&lt;p&gt;&amp;quot;Do you think we&amp;#x27;ll make it, captain?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶40&lt;/span&gt;&lt;p&gt;&amp;quot;If this wind stays and the boat doesn&amp;#x27;t fill with water and sink, we can&amp;#x27;t do much else,&amp;quot; said the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶41&lt;/span&gt;&lt;p&gt;Each big wave lifted the little boat, and the white tops of the waves splashed her violently. She was moving forward, but without the seaweed the men could not see it. She seemed like a tiny thing rolling in the water, still on top by some miracle, with no power against five oceans. Sometimes a wide sheet of water, like white flames, rushed into the boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶42&lt;/span&gt;&lt;p&gt;&amp;quot;Bail her, cook,&amp;quot; said the captain calmly.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶43&lt;/span&gt;&lt;p&gt;&amp;quot;All right, captain,&amp;quot; said the cheerful cook.&lt;/p&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;III · Brothers on the Sea&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶44&lt;/span&gt;&lt;p&gt;It would be difficult to describe the quiet brotherhood that was born among these men on the sea. Nobody said that it existed. Nobody talked about it. But it lived in the boat, and each man felt it warm him. They were a captain, an oiler, a cook, and a correspondent, and they were friends — friends in a stronger, more iron-hard way than usual. The injured captain lay against the water jar in the front of the boat. He always spoke quietly and calmly, but no captain ever had a more willing and quicker crew than these three very different men in the dinghy. It was more than just understanding what was best for everyone&amp;#x27;s safety. There was surely something personal and heartfelt in it. And besides this loyalty to the leader of the boat, there was the friendship between the men. The correspondent, for example, had been taught not to trust people or believe in their goodness. But even at that moment, he knew it was the best experience of his life. Still, nobody said that it was so. Nobody talked about it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;He knew it was the best experience of his life.&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶45&lt;/span&gt;&lt;p&gt;&amp;quot;I wish we had a sail,&amp;quot; said the captain. &amp;quot;We could try my overcoat on the end of an oar and give you two boys a chance to rest.&amp;quot; So the cook and the correspondent held up the oar like a mast and spread the overcoat wide. The oiler steered, and the little boat moved well with her new sail. Sometimes the oiler had to row hard and fast to stop a wave from breaking into the boat, but otherwise the sailing was a success.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶46&lt;/span&gt;&lt;p&gt;Meanwhile, the lighthouse had slowly grown bigger. Now it almost had a color, and it looked like a little gray shadow on the sky. The man at the oars could not stop himself from turning his head quite often to try to see this little gray shadow.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶47&lt;/span&gt;&lt;p&gt;At last, from the top of each wave, the men in the tossing boat could see land. The lighthouse was a tall shadow standing up on the sky, and the land was just a long, black shadow lying on the sea. It was certainly thinner than paper. &amp;quot;We must be about across from New Smyrna,&amp;quot; said the cook. He had sailed along this coast many times in fishing ships. &amp;quot;Captain, by the way, I think they closed the life-saving station there about a year ago.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶48&lt;/span&gt;&lt;p&gt;&amp;quot;Did they?&amp;quot; said the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶49&lt;/span&gt;&lt;p&gt;The wind slowly died. The cook and the correspondent no longer had to work like slaves to hold the oar up high. But the waves kept attacking the dinghy as wildly as before, and the little boat, no longer moving forward, fought painfully over them. The oiler or the correspondent took the oars again.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶50&lt;/span&gt;&lt;p&gt;Shipwrecks happen without warning. If men could train for them and have them happen only when they were in perfect physical shape, fewer men would drown at sea. None of the four men in the dinghy had slept for more than a few minutes during the two days and two nights before they got into the dinghy. And in the excitement of climbing around the deck of a sinking ship, they had also forgotten to eat properly.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶51&lt;/span&gt;&lt;p&gt;For these reasons, and for others, neither the oiler nor the correspondent enjoyed rowing at this time. The correspondent wondered, honestly and simply, how any sane person could think that rowing a boat was fun. It was not fun. It was a punishment from the devil. Even the craziest person in the world could see that it was only a horror for the muscles and a crime against the back. He told everyone in the boat what he thought about the &amp;quot;fun&amp;quot; of rowing, and the tired-faced oiler smiled in complete agreement. By the way, before the ship sank, the oiler had worked two shifts in a row in the engine room.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶52&lt;/span&gt;&lt;p&gt;&amp;quot;Take it easy now, boys,&amp;quot; said the captain. &amp;quot;Don&amp;#x27;t use up all your strength. If we have to go through the surf, you&amp;#x27;ll need all your strength, because we&amp;#x27;ll surely have to swim for it. Take your time.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶53&lt;/span&gt;&lt;p&gt;Slowly the land rose out of the sea. First it was a black line. Then it became a black line and a white line — trees and sand. Finally, the captain said that he could see a house on the shore. &amp;quot;That&amp;#x27;s the house of refuge, for sure,&amp;quot; said the cook. &amp;quot;They&amp;#x27;ll see us soon and come out to get us.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶54&lt;/span&gt;&lt;p&gt;The faraway lighthouse stood tall. &amp;quot;The keeper should be able to see us now if he&amp;#x27;s looking through a telescope,&amp;quot; said the captain. &amp;quot;He&amp;#x27;ll tell the life-saving people.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶55&lt;/span&gt;&lt;p&gt;&amp;quot;None of the other boats could have reached the shore to tell people about the shipwreck,&amp;quot; said the oiler in a low voice. &amp;quot;If they had, the lifeboat would be out looking for us.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶56&lt;/span&gt;&lt;p&gt;Slowly and beautifully, the land appeared out of the sea. The wind came again. It had changed direction, from the northeast to the southeast. Finally, a new sound reached the men&amp;#x27;s ears. It was the low thunder of the surf on the shore. &amp;quot;We&amp;#x27;ll never be able to reach the lighthouse now,&amp;quot; said the captain. &amp;quot;Turn her front a little more north, Billie,&amp;quot; he said.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶57&lt;/span&gt;&lt;p&gt;&amp;quot;&amp;#x27;A little more north,&amp;#x27; sir,&amp;quot; said the oiler.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶58&lt;/span&gt;&lt;p&gt;So the little boat turned her nose once more in the direction of the wind. Everyone except the rower watched the shore grow bigger. As it grew, the men&amp;#x27;s doubts and terrible fears began to leave their minds. Steering the boat still took all their attention, but it could not stop a quiet happiness. In an hour, maybe, they would be on the shore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶59&lt;/span&gt;&lt;p&gt;Their backs had become completely used to keeping their balance in the boat, and now they rode this wild young horse of a dinghy like circus performers. The correspondent thought that he was wet all the way to his skin. But when he happened to feel the top pocket of his coat, he found eight cigars inside. Four of them were wet with seawater; four were perfectly fine. After a search, somebody found three dry matches. Then the four homeless men rode proudly and boldly in their little boat. With the certainty of a coming rescue shining in their eyes, they smoked the big cigars and gave their opinions — good and bad — about all men. Everybody took a drink of water.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;summary&quot;&gt;&lt;h4&gt;Part 1 Summary&lt;/h4&gt;&lt;p&gt;After their ship sinks, four men — a captain, a cook, an oiler, and a correspondent — are in a tiny dinghy on a wild sea. The captain is injured and sad, but he calmly gives orders. The oiler and the correspondent take turns rowing, and the cook bails water out of the boat.&lt;/p&gt;&lt;p&gt;A gull tries to land on the captain&amp;#x27;s head, and he gently waves it away. The captain sees a lighthouse, and later the men see the land. A strong feeling of brotherhood grows between them.&lt;/p&gt;&lt;p&gt;They use the captain&amp;#x27;s overcoat as a sail. The cook says a life-saving station near New Smyrna closed a year ago. At the end of Part 1, the men find dry cigars and smoke them, sure that a rescue is coming soon.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;c&quot;&gt;Short Stories and Critical Thinking – Independent Level (A2 / B1 / B1+)&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;STUDENT WORKSHEET&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;inner&quot;&gt;
&lt;div class=&quot;kick&quot;&gt;WEEK 7 · PART 1 OF 3 &lt;/div&gt;&lt;h1&gt;The Open Boat&lt;/h1&gt;&lt;p class=&quot;meta&quot;&gt;Stephen Crane · Unit 3: The Unknown · Literary focus: man vs. nature, setting, character&lt;/p&gt;&lt;p class=&quot;meta&quot;&gt;One class · 110 minutes · ¶ numbers refer to the paragraph numbers in the Part 1 student story&lt;/p&gt;
&lt;div class=&quot;name&quot;&gt;Name:&lt;span&gt;&lt;/span&gt;Date:&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;banner&quot;&gt;&lt;b&gt;PART 1&lt;/b&gt;&lt;span&gt;Sections I–III · “Four Men in a Small Boat” to “Brothers on the Sea”&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;h2&gt;Warm-Up — Lost at Sea&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;10 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Groups of 3 and 4, then whole class.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;1a — What Would You Keep?&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Your ship has sunk. You are in a very small boat with three other people. You can see land, but it is far away. With your group, choose the FIVE most useful things. Rank them 1–5 (1 = most useful).&lt;/div&gt;&lt;div class=&quot;rank&quot;&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;two oars&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;a jar of drinking water&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;a heavy overcoat&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;a bath towel&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;eight cigars and three matches&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;a life belt&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;a small mirror&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;a fishing line&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;Discuss:&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;Who would you want in your boat — a strong person, a funny person, or a calm leader? Why?&lt;div class=&quot;starter&quot;&gt;I would want … because …&lt;/div&gt;&lt;/li&gt;&lt;li&gt;The title of the story is “The Open Boat.” What do you think will happen?&lt;div class=&quot;starter&quot;&gt;I think the story is about …&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num v&quot;&gt;2&lt;/div&gt;&lt;h2&gt;Vocabulary I&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;15 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;All words below are used in the story or in the reading-help boxes.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;2a — The Little Boat&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Look at the picture with a partner. Point to the bow, the stern, the oars, and the four men.&lt;/div&gt;&lt;div class=&quot;pic&quot; style=&quot;height:2.3in&quot;&gt;Picture: the dinghy and its parts&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;2b — Matching&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Match each word (1–8) to its meaning (A–H). Write the letter on the line.&lt;/div&gt;&lt;table class=&quot;m&quot;&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;1&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;dinghy&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;A&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the back part of a boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;2&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;bow&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;B&lt;/b&gt;&lt;/td&gt;&lt;td&gt;to throw water out of a boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;3&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;stern&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;C&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a reporter who sends news from far away&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;4&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;oar&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;D&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a very small open boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;5&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;to bail&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;E&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a worker who keeps a ship&amp;#x27;s engine running&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;6&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;surf&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;F&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the front part of a boat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;7&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;correspondent&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;G&lt;/b&gt;&lt;/td&gt;&lt;td&gt;big waves that break on the beach&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;8&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;oiler&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;H&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a long pole with a flat end, used to row a boat&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;2c — Fill in the Blank&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Complete each sentence with a word from the box. Use each word once.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;lighthouse · seaweed · cigars · overcoat · horizon · foam&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li style=&quot;margin-bottom:8px&quot;&gt;The tops of the gray waves were white with &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt;.&lt;/li&gt;&lt;li style=&quot;margin-bottom:8px&quot;&gt;The &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; went down and came up again as the boat moved.&lt;/li&gt;&lt;li style=&quot;margin-bottom:8px&quot;&gt;The brown &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; in the water showed that the boat was moving toward land.&lt;/li&gt;&lt;li style=&quot;margin-bottom:8px&quot;&gt;At first, the &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; looked as small as the point of a pin.&lt;/li&gt;&lt;li style=&quot;margin-bottom:8px&quot;&gt;The captain used his &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; as a sail.&lt;/li&gt;&lt;li style=&quot;margin-bottom:8px&quot;&gt;The correspondent found eight &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; in his pocket.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;h2&gt;Reading — Section I&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;20 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Read “Four Men in a Small Boat” (¶1–20, about 10 min). Then answer the questions.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;3a — True, False, or Not Given?&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Write T (true), F (false), or NG (not given — the story does not say).&lt;/div&gt;&lt;table class=&quot;m tf&quot;&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;1&lt;/td&gt;&lt;td&gt;The four men looked up and knew the color of the sky.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;2&lt;/td&gt;&lt;td&gt;The captain was hurt.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;3&lt;/td&gt;&lt;td&gt;The cook was the youngest man in the boat.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;4&lt;/td&gt;&lt;td&gt;The captain remembered seven faces looking at him before the ship sank.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;5&lt;/td&gt;&lt;td&gt;The cook and the correspondent agreed about the house of refuge.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;3b — Short Answer&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Answer in complete sentences. Use the sentence starter.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;How does the captain feel after his ship sinks? Give one detail from the story. &lt;span class=&quot;ref&quot;&gt;(¶6)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;The captain feels … In the story, …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;h2&gt;Reading — Sections II–III&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;30 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Read “The Gull and the Lighthouse” and “Brothers on the Sea” (¶21–59, about 18 min). Then answer the questions.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;4a — Multiple Choice&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Circle the correct answer.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;Why did the captain wave the gull away gently and not hit it? &lt;span class=&quot;ref&quot;&gt;(¶30)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) He liked birds.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) Any strong movement could turn over the boat.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) The oiler told him to.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) He was too tired.&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;Who saw the lighthouse first? &lt;span class=&quot;ref&quot;&gt;(¶34)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) the captain&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) the cook&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) the oiler&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) the correspondent&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What showed the men that the boat was moving toward land? &lt;span class=&quot;ref&quot;&gt;(¶33)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) the gulls&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) the seaweed&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) the wind&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) the sun&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What did the men use as a sail? &lt;span class=&quot;ref&quot;&gt;(¶45)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) a bath towel&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) the captain&amp;#x27;s overcoat&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) a blanket&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) the cook&amp;#x27;s vest&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What did the cook say about the life-saving station near New Smyrna? &lt;span class=&quot;ref&quot;&gt;(¶47)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) It was very big.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) It closed about a year ago.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) It had a new lifeboat.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) Its crew was sleeping.&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;At the end of Section III, how do the men feel? &lt;span class=&quot;ref&quot;&gt;(¶59)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) afraid and angry&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) sure that they will be rescued soon&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) bored&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) sick&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;4b — Short Answer&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Answer in complete sentences. Use the sentence starter.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;In Section III, the correspondent feels something new. What is it, and why is it special for him? &lt;span class=&quot;ref&quot;&gt;(¶44)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;He feels … It is special because …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;h2&gt;Close Reading — Who Is in the Boat?&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;15 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Character. Group A (3 students): the captain and the oiler. Group B (4 students): the cook and the correspondent. Then share.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;5a — Character Cards&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;For your two characters, find what they do, one short quotation, and one adjective. Write the ¶ number.&lt;/div&gt;&lt;table class=&quot;chart&quot;&gt;&lt;tr&gt;&lt;th&gt;Character&lt;/th&gt;&lt;th&gt;What does he do in the boat?&lt;/th&gt;&lt;th&gt;Evidence (quotation + ¶)&lt;/th&gt;&lt;th&gt;One adjective&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The captain&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The oiler (Billie)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The cook&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The correspondent&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;h2&gt;Prediction&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;8 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Individual writing, then share with a partner.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;The men feel sure that someone will rescue them soon. Will help come? Write 2 sentences.&lt;/div&gt;&lt;div class=&quot;starter&quot;&gt;I think help will / will not come because … · In the story, …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;h2&gt;Put the Scenes in Order&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;7 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Sections I–III. Look at the pictures and read the sentences.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;Put the story in order. Write 1–6 in the boxes (1 = first, 6 = last).&lt;/div&gt;&lt;div class=&quot;pics&quot;&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;The men use the captain&amp;#x27;s overcoat as a sail.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;The cook and the correspondent argue about the house of refuge.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;A gull tries to land on the captain&amp;#x27;s head.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;The men find cigars and feel sure they will be rescued.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;The captain sees a tiny lighthouse far away.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;The oiler and the correspondent carefully change seats.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;✓&lt;/div&gt;&lt;h2&gt;Wrap-Up and Homework&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;5 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Whole class.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;hw&quot;&gt;&lt;b&gt;HOMEWORK — Before Week 8&lt;/b&gt;&lt;p style=&quot;margin:6px 0 0&quot;&gt;1. Read Part 2 of the story (Sections IV–V).  2. Reading journal entry for Part 1: a 3-sentence summary · 3 new vocabulary items with definitions · 1 personal response sentence · 1 question about the story.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
