&lt;div class=&quot;running&quot;&gt;THE OPEN BOAT&lt;/div&gt;
&lt;h1 class=&quot;title&quot;&gt;THE OPEN BOAT&lt;/h1&gt;
&lt;div class=&quot;byline&quot;&gt;Stephen Crane · adapted for A2–B1+ readers&lt;/div&gt;
&lt;div class=&quot;partlbl&quot;&gt;PART 2 OF 3 · SECTIONS IV–V · WEEK 8&lt;/div&gt;
&lt;div class=&quot;recap&quot;&gt;&lt;div class=&quot;lt&quot;&gt;THE STORY SO FAR&lt;/div&gt;&lt;p&gt;Four men — a captain, a cook, an oiler named Billie, and a correspondent — are in a tiny dinghy after their ship has sunk near the coast of Florida.&lt;/p&gt;&lt;p&gt;They worked together and became like brothers. They saw a lighthouse, then the land, and a house on the shore. They used the captain&amp;#x27;s overcoat as a sail.&lt;/p&gt;&lt;p&gt;At the end of Part 1, they smoked cigars and felt sure that people on the shore would see them and come to save them.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;lens&quot;&gt;&lt;div class=&quot;lt&quot;&gt;LITERARY LENS: IRONY AND POINT OF VIEW&lt;/div&gt;&lt;p&gt;In Part 2, the men see people on the beach — but they can only see them from far away. As you read, notice what the men think is happening, and what is really happening.&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Point of View&lt;/td&gt;&lt;td&gt;Who tells the story and what they can see. We see the beach only through the eyes of the men in the boat.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Dramatic Irony&lt;/td&gt;&lt;td&gt;When the reader knows something that the characters do not know.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Irony&lt;/td&gt;&lt;td&gt;When what happens is the opposite of what we expect — for example, when help seems close but does not come.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;help&quot;&gt;&lt;div class=&quot;lt&quot;&gt;READING HELP&lt;/div&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;omnibus&lt;/td&gt;&lt;td&gt;a large horse-drawn vehicle that carried passengers, like an early bus. Hotels used them to carry guests.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;St. Augustine&lt;/td&gt;&lt;td&gt;a real city on the east coast of Florida.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“the seven mad gods who rule the sea”&lt;/td&gt;&lt;td&gt;Crane&amp;#x27;s invented image: the sea is controlled by crazy gods who do not make sense.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fate&lt;/td&gt;&lt;td&gt;a power that some people believe controls what happens in our lives. Here Fate is imagined as a foolish old woman.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;the light in the sea&lt;/td&gt;&lt;td&gt;At night, tiny sea creatures can glow blue when something moves fast through the water. Crane calls it “blue fire.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;the babes in the wood&lt;/td&gt;&lt;td&gt;An old English children&amp;#x27;s story about two small children who are lost in a forest and fall asleep together.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;IV · The Man with the Coat&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶1&lt;/span&gt;&lt;p&gt;&amp;quot;Cook,&amp;quot; said the captain, &amp;quot;there don&amp;#x27;t seem to be any signs of life at your house of refuge.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶2&lt;/span&gt;&lt;p&gt;&amp;quot;No,&amp;quot; answered the cook. &amp;quot;Funny they don&amp;#x27;t see us!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶3&lt;/span&gt;&lt;p&gt;A wide, low coast lay in front of the men. It was made of sand dunes covered with dark plants. The roar of the surf was clear, and sometimes they could see the white edge of a wave as it rushed up the beach. A tiny house stood black against the sky. To the south, the thin lighthouse lifted its little gray body.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶4&lt;/span&gt;&lt;p&gt;The tide, the wind, and the waves were pushing the dinghy north. &amp;quot;Funny they don&amp;#x27;t see us,&amp;quot; said the men.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶5&lt;/span&gt;&lt;p&gt;Here, the roar of the surf was softer, but its sound was still like strong, powerful thunder. As the boat swam over the great rolling waves, the men sat and listened to this roar. &amp;quot;We&amp;#x27;ll sink for sure,&amp;quot; said everybody.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶6&lt;/span&gt;&lt;p&gt;It is fair to say here that there was no life-saving station within twenty miles in either direction. But the men did not know this. So they made dark and insulting comments about the eyesight of the country&amp;#x27;s life-savers. Four angry-faced men sat in the dinghy and broke records for inventing bad names.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶7&lt;/span&gt;&lt;p&gt;&amp;quot;Funny they don&amp;#x27;t see us.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶8&lt;/span&gt;&lt;p&gt;The happy mood of earlier was completely gone. Their tired, sharp minds could easily imagine all kinds of reasons: the life-savers were bad at their job, they were blind, or they were even cowards. There was the shore, a land full of people, and it was very, very bitter to the men that no sign came from it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶9&lt;/span&gt;&lt;p&gt;&amp;quot;Well,&amp;quot; said the captain at last, &amp;quot;I suppose we&amp;#x27;ll have to try it ourselves. If we stay out here too long, none of us will have enough strength left to swim after the boat sinks.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶10&lt;/span&gt;&lt;p&gt;So the oiler, who was rowing, turned the boat straight toward the shore. Everybody&amp;#x27;s muscles suddenly became tight. There was some thinking.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶11&lt;/span&gt;&lt;p&gt;&amp;quot;If we don&amp;#x27;t all get to the shore —&amp;quot; said the captain. &amp;quot;If we don&amp;#x27;t all get to the shore, I suppose you guys know where to send the news of my death?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶12&lt;/span&gt;&lt;p&gt;Then they quickly exchanged some addresses and gave each other some instructions. As for the men&amp;#x27;s thoughts, there was a lot of anger in them. Maybe their thoughts were something like this: &amp;quot;If I am going to drown — if I am going to drown — if I am going to drown, then why, in the name of the seven mad gods who rule the sea, was I allowed to come this far and look at sand and trees? Was I brought here only to have my nose pulled away just when I was about to taste the sweet cheese of life? It is ridiculous. If Fate, that foolish old woman, cannot do better than this, she should lose her job of controlling men&amp;#x27;s lives. She is a silly old hen who does not know what she wants. If she decided to drown me, why didn&amp;#x27;t she do it at the beginning and save me all this trouble? The whole thing makes no sense. . . . But no, she cannot want to drown me. She does not dare to drown me. She cannot drown me. Not after all this work.&amp;quot; Then perhaps the man wanted to shake his fist at the clouds: &amp;quot;Go ahead and drown me now — and then listen to what I call you!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;“If I am going to drown … why … was I allowed to come this far and look at sand and trees?”&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶13&lt;/span&gt;&lt;p&gt;The waves that came at this time were more dangerous. They always seemed ready to break and roll over the little boat in a crazy mass of foam. Their voices made a long, low growl before they broke. Nobody who did not know the sea would believe that the dinghy could climb these steep walls of water in time. The shore was still far away. The oiler was a clever, experienced surf man. &amp;quot;Boys,&amp;quot; he said quickly, &amp;quot;she won&amp;#x27;t last three minutes more, and we&amp;#x27;re too far out to swim. Should I take her back out to sea, captain?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶14&lt;/span&gt;&lt;p&gt;&amp;quot;Yes! Go ahead!&amp;quot; said the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶15&lt;/span&gt;&lt;p&gt;With a series of quick miracles and fast, steady rowing, the oiler turned the boat around in the middle of the surf and took her safely back out to sea.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶16&lt;/span&gt;&lt;p&gt;There was a long silence as the boat bumped over the rough sea to deeper water. Then somebody spoke sadly. &amp;quot;Well, anyway, they must have seen us from the shore by now.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶17&lt;/span&gt;&lt;p&gt;The gulls flew at an angle up into the wind, toward the gray, empty east. A sudden storm, with dirty clouds and brick-red clouds like smoke from a burning building, appeared in the southeast.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶18&lt;/span&gt;&lt;p&gt;&amp;quot;What do you think of those life-saving people? Aren&amp;#x27;t they wonderful?&amp;quot; (He did not mean it.)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶19&lt;/span&gt;&lt;p&gt;&amp;quot;Funny they haven&amp;#x27;t seen us.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶20&lt;/span&gt;&lt;p&gt;&amp;quot;Maybe they think we&amp;#x27;re out here for fun! Maybe they think we&amp;#x27;re fishing. Maybe they think we&amp;#x27;re stupid fools.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶21&lt;/span&gt;&lt;p&gt;It was a long afternoon. A changing tide tried to push them south, but the wind and the waves pushed them north. Far ahead, where the coastline, the sea, and the sky met in a great angle, there were little dots that seemed to show a city on the shore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶22&lt;/span&gt;&lt;p&gt;&amp;quot;St. Augustine?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶23&lt;/span&gt;&lt;p&gt;The captain shook his head. &amp;quot;Too close to Mosquito Inlet.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶24&lt;/span&gt;&lt;p&gt;And the oiler rowed, and then the correspondent rowed. Then the oiler rowed. It was tiring work. The human back can have more aches and pains than the medical books list for a whole army. It is a small area, but it can become the stage for many battles of the muscles: twists, pulls, knots, and other &amp;quot;comforts.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶25&lt;/span&gt;&lt;p&gt;&amp;quot;Did you ever like to row, Billie?&amp;quot; asked the correspondent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶26&lt;/span&gt;&lt;p&gt;&amp;quot;No,&amp;quot; said the oiler. &amp;quot;Forget it.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶27&lt;/span&gt;&lt;p&gt;When a man left the rowing seat for a place in the bottom of the boat, he felt so weak and tired that he did not care about anything. He could barely move one finger. Cold seawater moved back and forth in the bottom of the boat, and he lay in it. His head rested on a seat like a pillow, only an inch from the top of a wave. Sometimes a very wild wave came into the boat and soaked him again. But these things did not bother him. It is almost certain that if the boat had turned over, he would have rolled comfortably out onto the ocean as if he were sure it was a big, soft bed.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶28&lt;/span&gt;&lt;p&gt;&amp;quot;Look! There&amp;#x27;s a man on the shore!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶29&lt;/span&gt;&lt;p&gt;&amp;quot;Where?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶30&lt;/span&gt;&lt;p&gt;&amp;quot;There! See him? See him?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶31&lt;/span&gt;&lt;p&gt;&amp;quot;Yes, sure! He&amp;#x27;s walking along.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶32&lt;/span&gt;&lt;p&gt;&amp;quot;Now he&amp;#x27;s stopped. Look! He&amp;#x27;s facing us!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶33&lt;/span&gt;&lt;p&gt;&amp;quot;He&amp;#x27;s waving at us!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶34&lt;/span&gt;&lt;p&gt;&amp;quot;Yes, he is! Wow!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶35&lt;/span&gt;&lt;p&gt;&amp;quot;Ah, now we&amp;#x27;re all right! Now we&amp;#x27;re all right! There&amp;#x27;ll be a boat out here for us in half an hour.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶36&lt;/span&gt;&lt;p&gt;&amp;quot;He&amp;#x27;s going on. He&amp;#x27;s running. He&amp;#x27;s going up to that house there.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶37&lt;/span&gt;&lt;p&gt;The faraway beach seemed lower than the sea, and they had to look very hard to see the little black figure. The captain saw a floating stick, and they rowed to it. By some strange chance, there was a bath towel in the boat. The captain tied it to the stick and waved it. The rower did not dare to turn his head, so he had to ask questions.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶38&lt;/span&gt;&lt;p&gt;&amp;quot;What&amp;#x27;s he doing now?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶39&lt;/span&gt;&lt;p&gt;&amp;quot;He&amp;#x27;s standing still again. He&amp;#x27;s looking, I think. . . . There he goes again. Toward the house. . . . Now he&amp;#x27;s stopped again.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶40&lt;/span&gt;&lt;p&gt;&amp;quot;Is he waving at us?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶41&lt;/span&gt;&lt;p&gt;&amp;quot;No, not now! But he was.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶42&lt;/span&gt;&lt;p&gt;&amp;quot;Look! Here comes another man!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶43&lt;/span&gt;&lt;p&gt;&amp;quot;He&amp;#x27;s running.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶44&lt;/span&gt;&lt;p&gt;&amp;quot;Look at him go!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶45&lt;/span&gt;&lt;p&gt;&amp;quot;Why, he&amp;#x27;s on a bicycle. Now he&amp;#x27;s met the other man. They&amp;#x27;re both waving at us. Look!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶46&lt;/span&gt;&lt;p&gt;&amp;quot;Something is coming up the beach.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶47&lt;/span&gt;&lt;p&gt;&amp;quot;What in the world is that thing?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶48&lt;/span&gt;&lt;p&gt;&amp;quot;Why, it looks like a boat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶49&lt;/span&gt;&lt;p&gt;&amp;quot;Of course it&amp;#x27;s a boat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶50&lt;/span&gt;&lt;p&gt;&amp;quot;No, it&amp;#x27;s on wheels.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶51&lt;/span&gt;&lt;p&gt;&amp;quot;Yes, it is. Well, that must be the lifeboat. They pull them along the shore on a wagon.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶52&lt;/span&gt;&lt;p&gt;&amp;quot;That&amp;#x27;s the lifeboat, for sure.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶53&lt;/span&gt;&lt;p&gt;&amp;quot;No, by God, it&amp;#x27;s — it&amp;#x27;s an omnibus.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶54&lt;/span&gt;&lt;p&gt;&amp;quot;I tell you, it&amp;#x27;s a lifeboat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶55&lt;/span&gt;&lt;p&gt;&amp;quot;It is not! It&amp;#x27;s an omnibus. I can see it clearly. See? One of those big hotel buses.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶56&lt;/span&gt;&lt;p&gt;&amp;quot;Wow, you&amp;#x27;re right. It&amp;#x27;s an omnibus, as sure as fate. What do you think they&amp;#x27;re doing with an omnibus? Maybe they&amp;#x27;re driving around to collect the lifeboat crew, right?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶57&lt;/span&gt;&lt;p&gt;&amp;quot;That&amp;#x27;s probably it. Look! There&amp;#x27;s a guy waving a little black flag. He&amp;#x27;s standing on the steps of the omnibus. Here come those other two guys. Now they&amp;#x27;re all talking together. Look at the guy with the flag. Maybe he isn&amp;#x27;t waving it.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶58&lt;/span&gt;&lt;p&gt;&amp;quot;That isn&amp;#x27;t a flag, is it? That&amp;#x27;s his coat. Of course, that&amp;#x27;s his coat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶59&lt;/span&gt;&lt;p&gt;&amp;quot;Yes, it is. It&amp;#x27;s his coat. He&amp;#x27;s taken it off and he&amp;#x27;s waving it around his head. But look at him swing it!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶60&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, listen, there isn&amp;#x27;t any life-saving station there. That&amp;#x27;s just a bus from a winter vacation hotel. It brought some of the hotel guests to watch us drown.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶61&lt;/span&gt;&lt;p&gt;&amp;quot;What does that idiot with the coat mean? What&amp;#x27;s he signaling, anyway?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶62&lt;/span&gt;&lt;p&gt;&amp;quot;It looks like he&amp;#x27;s trying to tell us to go north. There must be a life-saving station up there.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶63&lt;/span&gt;&lt;p&gt;&amp;quot;No! He thinks we&amp;#x27;re fishing. He&amp;#x27;s just saying a cheerful hello. See? Hey there, Willie!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶64&lt;/span&gt;&lt;p&gt;&amp;quot;Well, I wish I could understand those signals. What do you think he means?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶65&lt;/span&gt;&lt;p&gt;&amp;quot;He doesn&amp;#x27;t mean anything. He&amp;#x27;s just playing.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶66&lt;/span&gt;&lt;p&gt;&amp;quot;Well, if he signaled us to try the surf again, or to go out to sea and wait, or go north, or go south, or go to hell — that would make some sense. But look at him. He just stands there and keeps turning his coat around like a wheel. The fool!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶67&lt;/span&gt;&lt;p&gt;&amp;quot;Here come more people.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶68&lt;/span&gt;&lt;p&gt;&amp;quot;Now there&amp;#x27;s a big crowd. Look! Isn&amp;#x27;t that a boat?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶69&lt;/span&gt;&lt;p&gt;&amp;quot;Where? Oh, I see what you mean. No, that&amp;#x27;s not a boat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶70&lt;/span&gt;&lt;p&gt;&amp;quot;That guy is still waving his coat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶71&lt;/span&gt;&lt;p&gt;&amp;quot;He must think we like to watch him do that. Why doesn&amp;#x27;t he stop? It doesn&amp;#x27;t mean anything.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶72&lt;/span&gt;&lt;p&gt;&amp;quot;I don&amp;#x27;t know. I think he&amp;#x27;s trying to make us go north. There must be a life-saving station there somewhere.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶73&lt;/span&gt;&lt;p&gt;&amp;quot;Hey, he isn&amp;#x27;t tired yet. Look at him wave.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶74&lt;/span&gt;&lt;p&gt;&amp;quot;I wonder how long he can keep doing that. He&amp;#x27;s been turning his coat around since he first saw us. He&amp;#x27;s an idiot. Why aren&amp;#x27;t they getting men to bring a boat out? A fishing boat — one of those big ones — could come out here with no problem. Why doesn&amp;#x27;t he do something?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶75&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, it&amp;#x27;s all right now.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶76&lt;/span&gt;&lt;p&gt;&amp;quot;They&amp;#x27;ll have a boat out here for us very soon, now that they&amp;#x27;ve seen us.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶77&lt;/span&gt;&lt;p&gt;A light yellow color came into the sky over the low land. The shadows on the sea slowly became darker. The wind brought cold with it, and the men began to shake.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶78&lt;/span&gt;&lt;p&gt;&amp;quot;Holy smoke!&amp;quot; said one of them, letting his voice show his angry, disrespectful mood. &amp;quot;If we keep on fooling around out here! If we have to fight the waves out here all night!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶79&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, we&amp;#x27;ll never have to stay here all night! Don&amp;#x27;t worry. They&amp;#x27;ve seen us now, and it won&amp;#x27;t be long before they come out after us.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶80&lt;/span&gt;&lt;p&gt;The shore became dark. Little by little, the man waving the coat disappeared into the darkness. The darkness swallowed the omnibus and the group of people in the same way. When the spray of salt water crashed loudly over the side of the boat, the men jumped and cursed like men who were being burned with hot iron.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;Little by little, the man waving the coat disappeared into the darkness.&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶81&lt;/span&gt;&lt;p&gt;&amp;quot;I&amp;#x27;d like to catch the fool who waved the coat. I feel like hitting him, just for luck.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶82&lt;/span&gt;&lt;p&gt;&amp;quot;Why? What did he do?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶83&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, nothing. But he seemed so damn cheerful.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶84&lt;/span&gt;&lt;p&gt;Meanwhile, the oiler rowed, and then the correspondent rowed, and then the oiler rowed. With gray faces, bent forward, they took turns pulling the oars, which felt as heavy as lead. They moved like machines. The shape of the lighthouse had disappeared from the southern horizon, but finally a pale star appeared, just rising from the sea. The orange-yellow lines in the western sky disappeared into the darkness that covered everything, and the sea to the east was black. The land had disappeared. The only sign of it was the low, sad thunder of the surf.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶85&lt;/span&gt;&lt;p&gt;&amp;quot;If I am going to drown — if I am going to drown — if I am going to drown, then why, in the name of the seven mad gods who rule the sea, was I allowed to come this far and look at sand and trees? Was I brought here only to have my nose pulled away just when I was about to taste the sweet cheese of life?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶86&lt;/span&gt;&lt;p&gt;The patient captain, bent over the water jar, sometimes had to speak to the rower.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶87&lt;/span&gt;&lt;p&gt;&amp;quot;Keep her head up! Keep her head up!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶88&lt;/span&gt;&lt;p&gt;&amp;quot;&amp;#x27;Keep her head up,&amp;#x27; sir.&amp;quot; Their voices were tired and low.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶89&lt;/span&gt;&lt;p&gt;It was certainly a quiet evening. Everyone except the rower lay heavily in the bottom of the boat, without energy. As for the rower, his eyes could only just see the tall black waves that rushed forward in a very frightening silence — except, sometimes, for the soft growl of a white top.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶90&lt;/span&gt;&lt;p&gt;The cook&amp;#x27;s head was on a seat, and he looked without interest at the water under his nose. His mind was far away, in other places. Finally he spoke. &amp;quot;Billie,&amp;quot; he said softly, as if in a dream, &amp;quot;what kind of pie do you like best?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;V · A Long Night&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶91&lt;/span&gt;&lt;p&gt;&amp;quot;Pie!&amp;quot; said the oiler and the correspondent, upset. &amp;quot;Don&amp;#x27;t talk about those things, damn you!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶92&lt;/span&gt;&lt;p&gt;&amp;quot;Well,&amp;quot; said the cook, &amp;quot;I was just thinking about ham sandwiches, and —&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶93&lt;/span&gt;&lt;p&gt;A night on the sea in an open boat is a long night. When it was finally dark, the light rising from the sea in the south turned bright gold. On the northern horizon a new light appeared, a small bluish light at the edge of the water. These two lights were the only furniture of the world. Except for them, there was nothing but waves.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶94&lt;/span&gt;&lt;p&gt;Two men lay close together at the back of the boat. The dinghy was so &amp;quot;big&amp;quot; that the rower could keep his feet a little warm by pushing them under his friends. Their legs went far under the rowing seat until they touched the feet of the captain at the front. Sometimes, even when the tired rower tried his best, a wave came piling into the boat — an icy wave of the night — and the freezing water soaked them again. They twisted their bodies for a moment and groaned. Then they fell back into a deep sleep, like dead men, while the water in the boat made bubbling sounds around them as the boat rocked.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶95&lt;/span&gt;&lt;p&gt;The oiler and the correspondent had a plan: one man would row until he could not row anymore. Then he would wake the other man from his bed of seawater in the bottom of the boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶96&lt;/span&gt;&lt;p&gt;The oiler pulled the oars until his head fell forward and a powerful sleep made him blind. And he kept rowing after that. Then he touched a man in the bottom of the boat and called his name. &amp;quot;Will you take my place for a little while?&amp;quot; he asked gently.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶97&lt;/span&gt;&lt;p&gt;&amp;quot;Sure, Billie,&amp;quot; said the correspondent. He woke up and pulled himself up to sit. They changed places carefully, and the oiler lay down in the seawater next to the cook. He seemed to fall asleep immediately.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶98&lt;/span&gt;&lt;p&gt;The sea was not as violent now. The waves came without growling. The rower&amp;#x27;s job was to keep the boat pointing in the right direction, so that the angle of the waves would not turn her over, and to stop her from filling with water when the white tops rushed past. The black waves were silent and hard to see in the dark. Often a wave was almost on top of the boat before the rower noticed it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶99&lt;/span&gt;&lt;p&gt;In a low voice, the correspondent spoke to the captain. He was not sure the captain was awake, although this man of iron always seemed to be awake. &amp;quot;Captain, should I keep her going toward that light in the north, sir?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶100&lt;/span&gt;&lt;p&gt;The same steady voice answered him. &amp;quot;Yes. Keep it a little to the left of the front of the boat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶101&lt;/span&gt;&lt;p&gt;The cook had tied a life belt around his body to get even the small warmth that this awkward cork object could give him. He seemed almost as warm as a stove to a rower who dropped down to sleep next to him. (The rowers&amp;#x27; teeth always chattered wildly as soon as they stopped working.)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶102&lt;/span&gt;&lt;p&gt;As he rowed, the correspondent looked down at the two men sleeping under his feet. The cook&amp;#x27;s arm was around the oiler&amp;#x27;s shoulders. With their torn clothes and tired, thin faces, they were the babes of the sea — a strange, ugly copy of the old story of the babes in the wood.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶103&lt;/span&gt;&lt;p&gt;Later, he must have become stupid from the work, because suddenly there was a growl of water, and a white wave top came into the boat with a roar and a splash. It was a wonder that it did not lift the cook and float him away in his life belt. The cook kept sleeping, but the oiler sat up, blinking his eyes and shaking with the new cold.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶104&lt;/span&gt;&lt;p&gt;&amp;quot;Oh, I&amp;#x27;m awfully sorry, Billie,&amp;quot; said the correspondent, feeling guilty.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶105&lt;/span&gt;&lt;p&gt;&amp;quot;That&amp;#x27;s all right, old boy,&amp;quot; said the oiler. He lay down again and was asleep.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶106&lt;/span&gt;&lt;p&gt;Soon it seemed that even the captain was sleeping, and the correspondent felt that he was the only man floating on all the oceans of the world. The wind had a voice as it came over the waves, and it was sadder than the end of everything.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶107&lt;/span&gt;&lt;p&gt;There was a long, loud swishing sound behind the boat, and a shining line of light, like blue fire, was cut into the black water. It looked as if a huge knife had made it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶108&lt;/span&gt;&lt;p&gt;Then everything was still, while the correspondent breathed with his mouth open and looked at the sea.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶109&lt;/span&gt;&lt;p&gt;Suddenly there was another swish and another long flash of bluish light. This time it was next to the boat. He could almost touch it with an oar. The correspondent saw a huge fin rush like a shadow through the water, throwing up clear, shining drops and leaving the long, glowing line behind it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶110&lt;/span&gt;&lt;p&gt;The correspondent looked over his shoulder at the captain. His face was hidden, and he seemed to be asleep. He looked at the babes of the sea. They were certainly asleep. So, with no one to share his feelings, he leaned a little to one side and cursed softly into the sea.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶111&lt;/span&gt;&lt;p&gt;But the thing did not leave the area around the boat. In front or behind, on one side or the other, sometimes after a long time and sometimes after a short time, the long, sparkling line rushed by, and he could hear the &amp;quot;whiroo&amp;quot; of the dark fin. The speed and power of the thing were truly amazing. It cut through the water like a giant, sharp bullet.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶112&lt;/span&gt;&lt;p&gt;The presence of this waiting thing did not fill the man with the horror that a person on a picnic would feel. He just looked at the sea without feeling much and cursed quietly.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶113&lt;/span&gt;&lt;p&gt;But it is true that he did not want to be alone. He wanted one of his companions to wake up by chance and keep him company with it. But the captain hung without moving over the water jar, and the oiler and the cook at the bottom of the boat were deep in sleep.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;He did not want to be alone.&lt;/div&gt;
&lt;div class=&quot;summary&quot;&gt;&lt;h4&gt;Part 2 Summary&lt;/h4&gt;&lt;p&gt;Nobody comes from the shore. There is no life-saving station within twenty miles, but the men do not know this, and they become angry. They try to go through the surf, but the waves are too dangerous, so the oiler takes the boat back out to sea.&lt;/p&gt;&lt;p&gt;People on the beach see them. A man waves his coat around his head, and an omnibus brings a crowd of people, but nobody understands the signals and no boat comes out. Night falls.&lt;/p&gt;&lt;p&gt;During the long, cold night, the oiler and the correspondent take turns rowing while the others sleep in the cold water in the bottom of the boat. A shark swims around the boat, and the correspondent, who is the only one awake, feels completely alone.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;c&quot;&gt;Short Stories and Critical Thinking – Independent Level (A2 / B1 / B1+)&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;STUDENT WORKSHEET&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;inner&quot;&gt;
&lt;div class=&quot;kick&quot;&gt;WEEK 8 · PART 2 OF 3 &lt;/div&gt;&lt;h1&gt;The Open Boat&lt;/h1&gt;&lt;p class=&quot;meta&quot;&gt;Stephen Crane · Unit 3: The Unknown · Literary focus: point of view, dramatic irony, irony&lt;/p&gt;&lt;p class=&quot;meta&quot;&gt;One class · 110 minutes · ¶ numbers refer to the paragraph numbers in the Part 2 student story&lt;/p&gt;
&lt;div class=&quot;name&quot;&gt;Name:&lt;span&gt;&lt;/span&gt;Date:&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;banner&quot;&gt;&lt;b&gt;PART 2&lt;/b&gt;&lt;span&gt;Sections IV–V · “The Man with the Coat” and “A Long Night”&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;h2&gt;Warm-Up — Waiting for Help&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;8 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Pairs and one group of 3, then whole class.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;Discuss:&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;Retell Part 1 in three sentences. Was your prediction from Week 7 right?&lt;div class=&quot;starter&quot;&gt;First, … Then, … At the end, … · My prediction was …&lt;/div&gt;&lt;/li&gt;&lt;li&gt;Have you ever waited for help (a bus, a doctor, a phone call) that did not come? How did you feel?&lt;div class=&quot;starter&quot;&gt;Once, I waited for … I felt …&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num v&quot;&gt;9&lt;/div&gt;&lt;h2&gt;Vocabulary II&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;12 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;All words below appear in Part 2.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;9a — Matching&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Match each word (1–8) to its meaning (A–H). Write the letter on the line.&lt;/div&gt;&lt;table class=&quot;m&quot;&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;1&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;omnibus&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;A&lt;/b&gt;&lt;/td&gt;&lt;td&gt;to give a message with a movement, sound, or light&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;2&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;to signal&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;B&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a belt made of cork that helps you float&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;3&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;coward&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;C&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the rising and falling of the sea twice every day&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;4&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;tide&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;D&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the thin, flat part on a fish&amp;#x27;s back&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;5&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;to chatter&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;E&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a large old vehicle pulled by horses that carried passengers&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;6&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;life belt&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;F&lt;/b&gt;&lt;/td&gt;&lt;td&gt;to make something or someone completely wet&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;7&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;to soak&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;G&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a person who is not brave&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;8&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;fin&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;H&lt;/b&gt;&lt;/td&gt;&lt;td&gt;(of teeth) to hit together quickly because you are cold&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;9b — Circle the Correct Word&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Circle the word that matches the story.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The captain tied a bath ( towel / shirt ) to a stick and waved it.&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;Another man on the beach was riding a ( horse / bicycle ) .&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The man on the beach waved his ( hat / coat ) around his head.&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The cook asked Billie what kind of ( pie / bread ) he liked best.&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;At night, the correspondent saw a long line of ( blue / red ) light in the water.&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The cook and the oiler slept together like the ( babes / soldiers ) of the sea.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;h2&gt;Reading — Section IV&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;32 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Read “The Man with the Coat” (¶1–90, about 20 min). Then answer the questions.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;10a — True, False, or Not Given?&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Write T (true), F (false), or NG (not given — the story does not say).&lt;/div&gt;&lt;table class=&quot;m tf&quot;&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;1&lt;/td&gt;&lt;td&gt;There was a life-saving station near the men.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;2&lt;/td&gt;&lt;td&gt;Before they tried the surf, the men gave each other addresses.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;3&lt;/td&gt;&lt;td&gt;The oiler knew a lot about the surf.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;4&lt;/td&gt;&lt;td&gt;The man on the beach had a dog with him.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;5&lt;/td&gt;&lt;td&gt;The captain tied a towel to a stick and waved it.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;6&lt;/td&gt;&lt;td&gt;The men understood the signals of the man with the coat.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;10b — Short Answer&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Answer in complete sentences. Use the sentence starter.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;At the end of Section IV, why are the men angry at the man with the coat? &lt;span class=&quot;ref&quot;&gt;(¶81–83)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;They are angry because …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;11&lt;/div&gt;&lt;h2&gt;Reading — Section V&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;20 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Read “A Long Night” (¶91–113, about 10 min). Then answer the questions.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;11a — Multiple Choice&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Circle the correct answer.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;Why were the oiler and the correspondent upset with the cook? &lt;span class=&quot;ref&quot;&gt;(¶91)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) He fell asleep.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) He talked about food.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) He stopped bailing.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) He lost an oar.&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;How did the oiler and the correspondent share the rowing at night? &lt;span class=&quot;ref&quot;&gt;(¶95)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) They rowed together all night.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) One rowed until he could not, then woke the other.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) The cook rowed all night.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) The captain rowed.&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What did the correspondent see next to the boat in the dark? &lt;span class=&quot;ref&quot;&gt;(¶109)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) a gull&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) a lifeboat&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) a huge fin&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) a fire&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;Who are “the babes of the sea”? &lt;span class=&quot;ref&quot;&gt;(¶102)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) two children&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) the cook and the oiler&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) the captain and the cook&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) the gulls&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;Why did the correspondent wish someone would wake up? &lt;span class=&quot;ref&quot;&gt;(¶113)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) He was hungry.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) He did not want to be alone.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) He wanted to sleep.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) He needed help to bail.&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;12&lt;/div&gt;&lt;h2&gt;Close Reading — The Man with the Coat&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;15 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Point of view: we see the beach only through the men&amp;#x27;s eyes. Work in pairs.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;12a — What Do They See? What Do They Think?&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Read ¶28–75. Complete the chart. In the last column, write your own idea.&lt;/div&gt;&lt;table class=&quot;chart&quot;&gt;&lt;tr&gt;&lt;th&gt;What the men see&lt;/th&gt;&lt;th&gt;What the men think it means&lt;/th&gt;&lt;th&gt;What else could it mean?&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A man on the beach stops and waves. (¶32–33)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Something with wheels comes up the beach. (¶50)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A man swings his coat around his head. (¶59)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;12b — The Reader Knows More&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;One sentence tells the reader something that the men do NOT know. Find it and copy it. Then answer the question.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;Copy the sentence. How does it change the way you feel about the men&amp;#x27;s anger? &lt;span class=&quot;ref&quot;&gt;(¶6)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;The sentence is: “…” This makes me feel …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;13&lt;/div&gt;&lt;h2&gt;Message from the Boat&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;10 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Individual writing. Before the surf, the men exchange addresses (¶12).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;You are one of the four men. Write a short message (3–4 sentences) to your family, in case you do not reach the shore.&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Say where you are, how you feel, and one thing you want them to know. Use at least two words from Vocabulary I or II.&lt;/div&gt;&lt;div class=&quot;starter&quot;&gt;Dear … · I am in a small boat … · I feel … · Please remember …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;

&lt;/div&gt;
