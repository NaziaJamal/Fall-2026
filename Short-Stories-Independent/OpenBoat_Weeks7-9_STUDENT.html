&lt;div class=&quot;running&quot;&gt;THE OPEN BOAT&lt;/div&gt;
&lt;h1 class=&quot;title&quot;&gt;THE OPEN BOAT&lt;/h1&gt;
&lt;div class=&quot;byline&quot;&gt;Stephen Crane · adapted for A2–B1+ readers&lt;/div&gt;
&lt;div class=&quot;partlbl&quot;&gt;PART 3 OF 3 · SECTIONS VI–VII · WEEK 9&lt;/div&gt;
&lt;div class=&quot;recap&quot;&gt;&lt;div class=&quot;lt&quot;&gt;THE STORY SO FAR&lt;/div&gt;&lt;p&gt;Four men — a captain, a cook, an oiler named Billie, and a correspondent — are in a tiny dinghy near the coast of Florida after a shipwreck.&lt;/p&gt;&lt;p&gt;During the day, people on the beach saw them, but nobody came to help. The surf was too dangerous, so the men stayed at sea.&lt;/p&gt;&lt;p&gt;Now it is night. The men are cold, hungry, and exhausted. A shark is swimming around the boat. The correspondent is rowing, and he feels completely alone.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;lens&quot;&gt;&lt;div class=&quot;lt&quot;&gt;LITERARY LENS: NATURE THAT DOES NOT CARE&lt;/div&gt;&lt;p&gt;In Part 3, the correspondent begins to understand something new about nature. As you read, ask: Is the sea cruel? Is it kind? Or does it simply not care about the four men?&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Indifferent&lt;/td&gt;&lt;td&gt;Not caring at all. In this story, nature does not want to help the men or to hurt them.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Symbol&lt;/td&gt;&lt;td&gt;An object that represents a bigger idea — for example, the cold star or the tall windmill.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Irony of Fate&lt;/td&gt;&lt;td&gt;When life gives a result that seems unfair or the opposite of what we expect.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;help&quot;&gt;&lt;div class=&quot;lt&quot;&gt;READING HELP&lt;/div&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;the Legion / Algiers&lt;/td&gt;&lt;td&gt;The French Foreign Legion was an army of foreign soldiers. Algiers is a city in Algeria, North Africa.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;the poem&lt;/td&gt;&lt;td&gt;A popular 19th-century poem by Caroline Norton. Simple meaning: A soldier was dying far from home in Algiers. No woman was there to care for him or cry for him. But a friend stood next to him, and the soldier held his hand and said, “I will never see my country again.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“to throw bricks at the temple”&lt;/td&gt;&lt;td&gt;to attack the gods or the world because you feel angry and treated unfairly&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“Will you take my place?”&lt;/td&gt;&lt;td&gt;Will you do my job (rowing) for a while so I can rest?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;interpreters&lt;/td&gt;&lt;td&gt;people who explain the meaning of something&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;VI · The Soldier of the Legion&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶1&lt;/span&gt;&lt;p&gt;&amp;quot;If I am going to drown — if I am going to drown — if I am going to drown, then why, in the name of the seven mad gods who rule the sea, was I allowed to come this far and look at sand and trees?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶2&lt;/span&gt;&lt;p&gt;During this dark and miserable night, a man might decide that the seven mad gods really did want to drown him, even though it was terribly unfair. Because it was certainly terribly unfair to drown a man who had worked so hard, so hard. The man felt that it would be a most unnatural crime. Other people had drowned at sea since the days of the ancient ships with painted sails, but still —&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶3&lt;/span&gt;&lt;p&gt;When a man realizes that nature does not think he is important, and that nature feels the universe will not be damaged if she gets rid of him, at first he wants to throw bricks at the temple. And he hates the fact that there are no bricks and no temples. If nature had a shape that he could see, he would surely throw insults at it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶4&lt;/span&gt;&lt;p&gt;Then, if there is nothing real to shout at, he may want to face nature as if she were a person. He wants to go down on one knee and beg, with his hands held up, saying, &amp;quot;Yes, but I love myself.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶5&lt;/span&gt;&lt;p&gt;A high, cold star on a winter night — this is the answer he feels nature gives him. After that, he understands how sad and helpless his situation is.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;A high, cold star on a winter night — this is the answer he feels nature gives him.&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶6&lt;/span&gt;&lt;p&gt;The men in the dinghy had not talked about these things. But each of them had surely thought about them in silence, in his own way. Their faces rarely showed anything except complete tiredness. When they spoke, it was only about the work of the boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶7&lt;/span&gt;&lt;p&gt;Then, to match his feelings, a poem mysteriously came into the correspondent&amp;#x27;s head. He had even forgotten that he had forgotten this poem, but suddenly it was in his mind.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;poem&quot;&gt;&amp;quot;A soldier of the Legion lay dying in Algiers,&lt;br&gt;There was lack of woman&amp;#x27;s nursing, there was dearth of woman&amp;#x27;s tears;&lt;br&gt;But a comrade stood beside him, and he took that comrade&amp;#x27;s hand,&lt;br&gt;And he said: &amp;#x27;I shall never see my own, my native land.&amp;#x27;&amp;quot;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶8&lt;/span&gt;&lt;p&gt;In his childhood, the correspondent had learned the fact that a soldier of the Legion lay dying in Algiers, but he had never thought it was important. Thousands of his schoolmates had told him about the soldier&amp;#x27;s terrible situation, but hearing it again and again had naturally made him not care at all. He had never thought that a soldier of the Legion dying in Algiers was his business, and it had never seemed like a reason for sadness. It meant less to him than breaking the point of a pencil.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶9&lt;/span&gt;&lt;p&gt;Now, however, it came to him in a strange way, as something human and alive. It was no longer just a picture of a few painful feelings in the heart of a poet who was drinking tea and warming his feet by the fire. It was real — hard, sad, and beautiful.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶10&lt;/span&gt;&lt;p&gt;The correspondent clearly saw the soldier. He lay on the sand with his feet straight out and still. His pale left hand was on his chest, trying to stop his life from leaving him, and the blood came out between his fingers. Far away in Algeria, a city of low, square buildings stood against a sky that was faint with the last colors of the sunset. The correspondent, pulling the oars and dreaming of the slow and slower movements of the soldier&amp;#x27;s lips, felt a deep understanding that was not about himself at all. He was sorry for the soldier of the Legion who lay dying in Algiers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶11&lt;/span&gt;&lt;p&gt;The thing that had followed the boat and waited had clearly become bored with waiting. The men could no longer hear the slash of the fin cutting the water, and there was no longer the fire of the long line of light. The light in the north was still shining weakly, but it did not seem any closer to the boat. Sometimes the boom of the surf sounded in the correspondent&amp;#x27;s ears, and then he turned the boat toward the sea and rowed harder. To the south, someone had clearly made a fire on the beach. It was too low and too far away to see, but it made a shimmering pink light on the hill behind it, and the men could see this from the boat. The wind became stronger. Sometimes a wave suddenly jumped out angrily like a wild cat, and they could see the shine and sparkle of a broken white top.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶12&lt;/span&gt;&lt;p&gt;The captain, at the front, moved on his water jar and sat up straight. &amp;quot;Pretty long night,&amp;quot; he said to the correspondent. He looked at the shore. &amp;quot;Those life-saving people take their time.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶13&lt;/span&gt;&lt;p&gt;&amp;quot;Did you see that shark playing around?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶14&lt;/span&gt;&lt;p&gt;&amp;quot;Yes, I saw him. He was a big guy, all right.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶15&lt;/span&gt;&lt;p&gt;&amp;quot;I wish I had known you were awake.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶16&lt;/span&gt;&lt;p&gt;Later, the correspondent spoke to someone in the bottom of the boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶17&lt;/span&gt;&lt;p&gt;&amp;quot;Billie!&amp;quot; Slowly, little by little, the bodies at the bottom separated. &amp;quot;Billie, will you take my place?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶18&lt;/span&gt;&lt;p&gt;&amp;quot;Sure,&amp;quot; said the oiler.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶19&lt;/span&gt;&lt;p&gt;As soon as the correspondent touched the cold, comfortable seawater in the bottom of the boat and lay close to the cook&amp;#x27;s life belt, he was deep asleep — even though his teeth were chattering out all the popular songs. This sleep was so good for him that it seemed only a moment before he heard a voice call his name. The voice sounded completely exhausted. &amp;quot;Will you take my place?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶20&lt;/span&gt;&lt;p&gt;&amp;quot;Sure, Billie.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶21&lt;/span&gt;&lt;p&gt;The light in the north had mysteriously disappeared, but the correspondent took his direction from the captain, who was wide awake.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶22&lt;/span&gt;&lt;p&gt;Later in the night, they took the boat farther out to sea. The captain told the cook to take one oar at the back and keep the front of the boat facing the waves. He had to shout if he heard the thunder of the surf. This plan let the oiler and the correspondent rest at the same time. &amp;quot;We&amp;#x27;ll give those boys a chance to get their strength back,&amp;quot; said the captain. They curled up and, after some chattering and shaking at first, fell back into the deep sleep of the dead. Neither of them knew that they had left the cook with the company of another shark — or maybe the same shark.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶23&lt;/span&gt;&lt;p&gt;As the boat danced wildly on the waves, spray sometimes jumped over the side and soaked them again, but this could not wake them. The threatening slash of the wind and the water had no more effect on them than on mummies.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶24&lt;/span&gt;&lt;p&gt;&amp;quot;Boys,&amp;quot; said the cook, and every note in his voice showed that he did not want to wake them, &amp;quot;she&amp;#x27;s drifted in pretty close. I think one of you had better take her out to sea again.&amp;quot; The correspondent woke up and heard the crash of falling white wave tops.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶25&lt;/span&gt;&lt;p&gt;As he was rowing, the captain gave him some whiskey and water, and this stopped his shaking. &amp;quot;If I ever get to the shore and anybody shows me even a photograph of an oar —&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶26&lt;/span&gt;&lt;p&gt;At last there was a short conversation.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶27&lt;/span&gt;&lt;p&gt;&amp;quot;Billie. . . . Billie, will you take my place?&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶28&lt;/span&gt;&lt;p&gt;&amp;quot;Sure,&amp;quot; said the oiler.&lt;/p&gt;&lt;/div&gt;
&lt;h3 class=&quot;sec&quot;&gt;VII · The Surf&lt;/h3&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶29&lt;/span&gt;&lt;p&gt;When the correspondent opened his eyes again, the sea and the sky were both the gray color of early morning. Later, deep red and gold were painted on the water. Finally the morning came in all its beauty, with a sky of pure blue, and the sunlight burned like fire on the tops of the waves.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶30&lt;/span&gt;&lt;p&gt;On the faraway sand dunes there were many little black cottages, and a tall white windmill stood above them. No man, no dog, and no bicycle appeared on the beach. The cottages could have been an empty village where nobody lived.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶31&lt;/span&gt;&lt;p&gt;The men studied the shore carefully. They had a meeting in the boat. &amp;quot;Well,&amp;quot; said the captain, &amp;quot;if no help is coming, we&amp;#x27;d better try to go through the surf right away. If we stay out here much longer, we&amp;#x27;ll be too weak to do anything for ourselves at all.&amp;quot; The others silently agreed. The boat was turned toward the beach. The correspondent wondered if anyone ever climbed the tall windmill tower, and if they ever looked out at the sea. The tower was a giant, standing with its back to the trouble of the ants. To the correspondent, it represented, in a way, how calm nature is while one person struggles — nature in the wind, and nature in the eyes of men. At that moment, nature did not seem cruel to him, or kind, or false, or wise. But she was indifferent — completely indifferent. Perhaps it makes sense that a man in this situation, who feels that the universe does not care about him, should see all the many mistakes of his life. He tastes them bitterly in his mind and wishes for another chance. Now, at the edge of the grave, the difference between right and wrong seems ridiculously clear to him. He understands that if he were given another chance, he would fix the way he acts and speaks. He would be better and brighter when he meets new people or goes to a tea party.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;But she was indifferent — completely indifferent.&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶32&lt;/span&gt;&lt;p&gt;&amp;quot;Now, boys,&amp;quot; said the captain, &amp;quot;she&amp;#x27;s going to sink, for sure. All we can do is take her in as far as possible, and then, when she sinks, jump out and fight your way to the beach. Stay calm now, and don&amp;#x27;t jump until she&amp;#x27;s really sinking.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶33&lt;/span&gt;&lt;p&gt;The oiler took the oars. He looked at the surf over his shoulders. &amp;quot;Captain,&amp;quot; he said, &amp;quot;I think I&amp;#x27;d better turn her around, keep her front facing the waves, and row her in backward.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶34&lt;/span&gt;&lt;p&gt;&amp;quot;All right, Billie,&amp;quot; said the captain. &amp;quot;Back her in.&amp;quot; Then the oiler turned the boat. The cook and the correspondent, sitting at the back, had to look over their shoulders to see the lonely and indifferent shore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶35&lt;/span&gt;&lt;p&gt;The huge waves near the shore lifted the boat high, and the men could again see the white sheets of water racing up the sloping beach. &amp;quot;We won&amp;#x27;t get in very close,&amp;quot; said the captain. Every time a man could take his attention away from the waves, he turned his eyes toward the shore, and there was something unusual in the look in his eyes. The correspondent watched the others and knew that they were not afraid, but the full meaning of their looks was hidden.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶36&lt;/span&gt;&lt;p&gt;As for himself, he was too tired to think deeply about the situation. He tried to force his mind to think about it, but at this time his muscles controlled his mind, and the muscles said that they did not care. He only thought that if he drowned, it would be a shame.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶37&lt;/span&gt;&lt;p&gt;There were no fast words, no white faces, and no clear signs of panic. The men simply looked at the shore. &amp;quot;Now, remember to get far away from the boat when you jump,&amp;quot; said the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶38&lt;/span&gt;&lt;p&gt;Out at sea, the top of a big wave suddenly fell with a crash like thunder, and the long white wave came roaring down at the boat.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶39&lt;/span&gt;&lt;p&gt;&amp;quot;Steady now,&amp;quot; said the captain. The men were silent. They turned their eyes from the shore to the big wave and waited. The boat slid up the slope, jumped at the wild top, bounced over it, and swung down the long back of the wave. Some water had come in, and the cook bailed it out.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶40&lt;/span&gt;&lt;p&gt;But the next wave crashed too. The tumbling, boiling flood of white water caught the boat and spun it until it was almost standing straight up. Water rushed in from every side. The correspondent had his hands on the side of the boat at this moment, and when the water came in at that place, he quickly pulled his fingers away, as if he did not want to get them wet.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶41&lt;/span&gt;&lt;p&gt;The little boat, drunk with this heavy water, swayed and sank deeper into the sea.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶42&lt;/span&gt;&lt;p&gt;&amp;quot;Bail her out, cook! Bail her out,&amp;quot; said the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶43&lt;/span&gt;&lt;p&gt;&amp;quot;All right, captain,&amp;quot; said the cook.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶44&lt;/span&gt;&lt;p&gt;&amp;quot;Now, boys, the next one will finish us, for sure,&amp;quot; said the oiler. &amp;quot;Remember to jump clear of the boat.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶45&lt;/span&gt;&lt;p&gt;The third wave moved forward — huge, wild, and impossible to stop. It completely swallowed the dinghy, and almost at the same moment the men fell into the sea. A piece of a life belt had been lying in the bottom of the boat, and as the correspondent went over the side, he held it to his chest with his left hand.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶46&lt;/span&gt;&lt;p&gt;The January water was icy. He immediately thought that it was colder than he had expected to find it off the coast of Florida. To his confused mind, this seemed like a fact important enough to notice at the time. The coldness of the water was sad; it was tragic. In his mind, this fact was somehow so mixed up with his feelings about his own situation that it seemed almost a good reason to cry. The water was cold.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶47&lt;/span&gt;&lt;p&gt;When he came up to the surface, he was aware of little except the noisy water. Then he saw his companions in the sea. The oiler was ahead in the race. He was swimming strongly and fast. To the correspondent&amp;#x27;s left, the cook&amp;#x27;s big white back, with the cork life belt on it, stuck up out of the water. And behind them, the captain was hanging with his one good hand onto the bottom of the overturned dinghy.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶48&lt;/span&gt;&lt;p&gt;A shore has a certain quality of never moving, and in the confusion of the sea the correspondent wondered at it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶49&lt;/span&gt;&lt;p&gt;The shore also looked very attractive, but the correspondent knew that it was a long trip, and he paddled slowly and calmly. The piece of life belt was under him, and sometimes he flew down the slope of a wave as if he were on a children&amp;#x27;s sled.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶50&lt;/span&gt;&lt;p&gt;But finally he came to a place in the sea where it was hard to move forward. He did not stop swimming to ask what kind of current had caught him, but there he stopped moving forward. The shore was in front of him like a painted background on a theater stage. He looked at it, and his eyes understood every detail of it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶51&lt;/span&gt;&lt;p&gt;As the cook passed, much farther to the left, the captain was calling to him, &amp;quot;Turn over on your back, cook! Turn over on your back and use the oar.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶52&lt;/span&gt;&lt;p&gt;&amp;quot;All right, sir.&amp;quot; The cook turned on his back and, paddling with an oar, moved forward like a canoe.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶53&lt;/span&gt;&lt;p&gt;Soon the boat also passed to the left of the correspondent, with the captain holding on with one hand to the bottom of it. He would have looked like a man lifting himself up to look over a wooden fence, if the boat had not been jumping around so wildly. The correspondent was amazed that the captain could still hold on to it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶54&lt;/span&gt;&lt;p&gt;They passed on, closer to the shore — the oiler, the cook, the captain — and behind them came the water jar, bouncing happily over the waves.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶55&lt;/span&gt;&lt;p&gt;The correspondent stayed in the hold of this strange new enemy — a current. The shore, with its white slope of sand and its green hill with little silent cottages on top, was spread out in front of him like a picture. It was very close to him then, but he felt like a person in an art gallery looking at a painting of a faraway country.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶56&lt;/span&gt;&lt;p&gt;He thought, &amp;quot;Am I going to drown? Can it be possible? Can it be possible? Can it be possible?&amp;quot; Perhaps every person must think that his own death is the final event of nature.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶57&lt;/span&gt;&lt;p&gt;But later a wave probably pulled him out of this small, deadly current, because he suddenly found that he could move toward the shore again. Later still, he noticed that the captain, holding on with one hand to the bottom of the dinghy, had turned his face away from the shore and toward him, and was calling his name. &amp;quot;Come to the boat! Come to the boat!&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶58&lt;/span&gt;&lt;p&gt;As he struggled to reach the captain and the boat, he thought that when a person is truly exhausted, drowning must really be a comfortable arrangement — the end of the fighting, with a lot of relief. He was glad of this, because for some moments the main thing in his mind had been horror of the pain of drowning. He did not want to be hurt.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶59&lt;/span&gt;&lt;p&gt;Soon he saw a man running along the shore. He was taking off his clothes amazingly fast. Coat, pants, shirt — everything flew off him like magic.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶60&lt;/span&gt;&lt;p&gt;&amp;quot;Come to the boat,&amp;quot; called the captain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶61&lt;/span&gt;&lt;p&gt;&amp;quot;All right, captain.&amp;quot; As the correspondent paddled, he saw the captain let himself down to the bottom and leave the boat. Then the correspondent did his one little miracle of the trip. A big wave caught him and threw him easily and very fast completely over the boat and far beyond it. Even then, it seemed to him like an act of gymnastics and a true miracle of the sea. An overturned boat in the surf is not a toy for a swimming man.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶62&lt;/span&gt;&lt;p&gt;The correspondent reached water that came only up to his waist, but he was so weak that he could not stand for more than a moment. Each wave knocked him down into a pile, and the undertow pulled at him.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶63&lt;/span&gt;&lt;p&gt;Then he saw the man who had been running and undressing, and undressing and running, come jumping into the water. He pulled the cook to the shore and then walked through the water toward the captain. But the captain waved him away and sent him to the correspondent. The man was naked — naked as a tree in winter — but there was a halo around his head, and he shone like a saint. He gave a strong pull, a long drag, and a great lift at the correspondent&amp;#x27;s hand. The correspondent, who had been taught small polite phrases, said, &amp;quot;Thanks, old man.&amp;quot; But suddenly the man cried, &amp;quot;What&amp;#x27;s that?&amp;quot; He pointed quickly. The correspondent said, &amp;quot;Go.&amp;quot;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pull&quot;&gt;He shone like a saint.&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶64&lt;/span&gt;&lt;p&gt;In the shallow water, face down, lay the oiler. His forehead touched sand that came out of the sea for a moment between each wave.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶65&lt;/span&gt;&lt;p&gt;The correspondent did not know everything that happened after that. When he reached safe ground, he fell, and every part of his body hit the sand. It was as if he had fallen from a roof, but he was thankful for the fall.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶66&lt;/span&gt;&lt;p&gt;It seems that suddenly the beach was full of men with blankets, clothes, and bottles of drink, and women with coffee pots and all the remedies that they believed in. The land&amp;#x27;s welcome to the men from the sea was warm and generous. But a still, dripping body was carried slowly up the beach, and for it the land could only offer a different, darker welcome: the grave.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;para&quot;&gt;&lt;span class=&quot;n&quot;&gt;¶67&lt;/span&gt;&lt;p&gt;When night came, the white waves moved back and forth in the moonlight, and the wind brought the sound of the great sea&amp;#x27;s voice to the men on the shore. And they felt that now they could be interpreters.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;summary&quot;&gt;&lt;h4&gt;Short Story Summary&lt;/h4&gt;&lt;p&gt;Four men — a captain, a cook, an oiler, and a correspondent — survive a shipwreck near Florida in a tiny dinghy. During the first day, they work together, grow close as brothers, and see the land. But no rescue comes, the surf is too dangerous, and the people on the beach do not understand their situation.&lt;/p&gt;&lt;p&gt;During the long night, the oiler and the correspondent take turns rowing. A shark follows the boat. The correspondent feels alone, and he realizes that nature does not care about him. He remembers a poem about a soldier dying far from home, and for the first time he feels real sympathy for the soldier.&lt;/p&gt;&lt;p&gt;In the morning, the men decide to go through the surf. A huge wave turns the boat over, and the men swim for the beach. A current holds the correspondent, but a wave helps him. A man from the shore runs into the water to help them. The cook, the captain, and the correspondent survive, but the oiler, the strongest of them, is found dead in the shallow water. That night, the survivors listen to the sea and feel that now they can understand — and explain — its voice.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;c&quot;&gt;Short Stories and Critical Thinking – Independent Level (A2 / B1 / B1+)&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;STUDENT WORKSHEET&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;inner&quot;&gt;
&lt;div class=&quot;kick&quot;&gt;WEEK 9 · PART 3 OF 3 &lt;/div&gt;&lt;h1&gt;The Open Boat&lt;/h1&gt;&lt;p class=&quot;meta&quot;&gt;Stephen Crane · Unit 3: The Unknown · Literary focus: naturalism, indifferent nature, symbol, irony of fate&lt;/p&gt;&lt;p class=&quot;meta&quot;&gt;One class · 110 minutes · ¶ numbers refer to the paragraph numbers in the Part 3 student story&lt;/p&gt;
&lt;div class=&quot;name&quot;&gt;Name:&lt;span&gt;&lt;/span&gt;Date:&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;banner&quot;&gt;&lt;b&gt;PART 3&lt;/b&gt;&lt;span&gt;Sections VI–VII · “The Soldier of the Legion” and “The Surf”&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;15&lt;/div&gt;&lt;h2&gt;Warm-Up — Cruel, Kind, or Indifferent?&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;10 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Opinion line: stand on the left (agree), in the middle (not sure), or on the right (disagree). Then explain.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;Read each statement. Where do you stand? Why?&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;The sea is cruel to the four men.&lt;div class=&quot;starter&quot;&gt;I agree / disagree because …&lt;/div&gt;&lt;/li&gt;&lt;li&gt;Nature cares about people.&lt;div class=&quot;starter&quot;&gt;I think … because …&lt;/div&gt;&lt;/li&gt;&lt;li&gt;If you work very hard, you will survive.&lt;div class=&quot;starter&quot;&gt;In my opinion, …&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num v&quot;&gt;16&lt;/div&gt;&lt;h2&gt;Vocabulary III&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;12 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;All words below appear in Part 3.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;16a — Matching&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Match each word (1–8) to its meaning (A–H). Write the letter on the line.&lt;/div&gt;&lt;table class=&quot;m&quot;&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;1&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;exhausted&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;A&lt;/b&gt;&lt;/td&gt;&lt;td&gt;extremely tired&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;2&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;indifferent&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;B&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a tall tower with arms that the wind turns&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;3&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;current&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;C&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a strong current under the water that pulls away from the beach&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;4&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;windmill&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;D&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a circle of light around the head of a saint&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;5&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;comrade&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;E&lt;/b&gt;&lt;/td&gt;&lt;td&gt;a friend, especially a soldier who fights next to you&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;6&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;halo&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;F&lt;/b&gt;&lt;/td&gt;&lt;td&gt;not caring at all&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;7&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;undertow&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;G&lt;/b&gt;&lt;/td&gt;&lt;td&gt;not deep&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;8&lt;/td&gt;&lt;td style=&quot;width:38%&quot;&gt;&lt;b&gt;shallow&lt;/b&gt; &lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;width:24px&quot;&gt;&lt;b&gt;H&lt;/b&gt;&lt;/td&gt;&lt;td&gt;water that moves strongly in one direction&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;16b — Circle the Correct Word&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Circle the word that matches the story.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The soldier in the poem was dying in ( Algiers / Florida ) .&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The captain gave the correspondent some ( whiskey / coffee ) and water.&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;In the morning, the men saw a tall white ( windmill / lighthouse ) on the dunes.&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The January water was ( warm / icy ) .&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The cook moved on his back like a ( canoe / sled ) .&lt;/li&gt;&lt;li style=&quot;margin-bottom:7px&quot;&gt;The man who ran into the water was ( naked / wearing a coat ) .&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;17&lt;/div&gt;&lt;h2&gt;Reading — Section VI&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;25 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Read “The Soldier of the Legion” (¶1–28, about 12 min). Then answer the questions.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;17a — Multiple Choice&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Circle the correct answer.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;What came into the correspondent&amp;#x27;s head? &lt;span class=&quot;ref&quot;&gt;(¶7)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) a song about the sea&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) a poem about a soldier dying in Algiers&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) a story about a shark&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) a prayer&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;As a child, how did the correspondent feel about this poem? &lt;span class=&quot;ref&quot;&gt;(¶8)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) He loved it.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) He did not care about it.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) He was afraid of it.&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) He wrote it.&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What did the correspondent imagine? &lt;span class=&quot;ref&quot;&gt;(¶10)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) the soldier lying on the sand, with blood between his fingers&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) the soldier riding a horse&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) the soldier swimming&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) the soldier coming home&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What did the captain say when he sat up? &lt;span class=&quot;ref&quot;&gt;(¶12)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) “Pretty long night.”&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) “We are lost.”&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) “Look, a boat!”&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) “I am hungry.”&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;Who held an oar and kept the boat facing the waves while the oiler and the correspondent slept? &lt;span class=&quot;ref&quot;&gt;(¶22)&lt;/span&gt;&lt;div class=&quot;mc&quot;&gt;&lt;div class=&quot;&quot;&gt;a) the captain&lt;/div&gt;&lt;div class=&quot;&quot;&gt;b) the cook&lt;/div&gt;&lt;div class=&quot;&quot;&gt;c) the oiler&lt;/div&gt;&lt;div class=&quot;&quot;&gt;d) a man from the beach&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;17b — Short Answers&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Answer in complete sentences. Use the sentence starters.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;When he was a child, the correspondent did not care about the soldier in the poem. Why does he care now? &lt;span class=&quot;ref&quot;&gt;(¶8–10)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;As a child, he … Now he cares because …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;What does the “high, cold star” tell the man about nature? &lt;span class=&quot;ref&quot;&gt;(¶5)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;The star shows that nature …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;18&lt;/div&gt;&lt;h2&gt;Reading — Section VII&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;25 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Read “The Surf” (¶29–67, about 12 min). Then answer the questions.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;18a — True, False, or Not Given?&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Write T (true), F (false), or NG (not given — the story does not say).&lt;/div&gt;&lt;table class=&quot;m tf&quot;&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;1&lt;/td&gt;&lt;td&gt;In the morning, many people were on the beach.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;2&lt;/td&gt;&lt;td&gt;The oiler rowed the boat in backward.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;3&lt;/td&gt;&lt;td&gt;The boat turned over on the third big wave.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;4&lt;/td&gt;&lt;td&gt;The correspondent was the best swimmer of the four men.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;5&lt;/td&gt;&lt;td&gt;A current stopped the correspondent from moving toward the shore.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;width:26px&quot;&gt;6&lt;/td&gt;&lt;td&gt;The man from the beach helped the captain first.&lt;/td&gt;&lt;td class=&quot;a&quot;&gt;&lt;span class=&quot;blank&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;18b — Short Answer&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Answer in complete sentences. Use the sentence starter.&lt;/div&gt;&lt;ol class=&quot;q&quot;&gt;&lt;li&gt;What happened to the oiler? Why is this surprising? &lt;span class=&quot;ref&quot;&gt;(¶47, ¶64)&lt;/span&gt;&lt;div class=&quot;starter&quot;&gt;The oiler … This is surprising because …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;19&lt;/div&gt;&lt;h2&gt;Man vs. Nature&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;12 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Work alone, then check with a partner.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;19a — What the Men Believe vs. The Truth&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Complete the chart with words from the box. Use each word once.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;indifferent · star · windmill · current&lt;/div&gt;&lt;table class=&quot;chart&quot;&gt;&lt;tr&gt;&lt;th&gt;What the men believe&lt;/th&gt;&lt;th&gt;The truth in the story&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fate, or the “seven mad gods,” wants to drown them.&lt;/td&gt;&lt;td&gt;Nature is not cruel or kind. She is &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt;. (¶31)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Nature will answer if they shout or beg.&lt;/td&gt;&lt;td&gt;Her only answer is a high, cold &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt;. (¶5)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Someone on the tall tower will see them.&lt;/td&gt;&lt;td&gt;The &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; stands with its back to the men. (¶31)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The shore is very close, so he is almost safe.&lt;/td&gt;&lt;td&gt;A &lt;span class=&quot;blank wide&quot;&gt;&amp;nbsp;&lt;/span&gt; holds him, and he cannot move forward. (¶50)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;19b — The Whole Story&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;Parts 1, 2, and 3. Number the events from 1 to 8.&lt;/div&gt;&lt;div class=&quot;ordl&quot;&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;A. The men see a man on the beach waving his coat.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;B. A huge fin passes next to the boat at night.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;C. A big wave turns the boat over.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;D. The cook and the correspondent argue about the house of refuge.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;E. The captain gently waves a gull away from his head.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;F. The men use the overcoat as a sail.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;G. The oiler takes the boat back out of the surf.&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;H. People carry a still body up the beach.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;20&lt;/div&gt;&lt;h2&gt;Critical Thinking — The Irony of Fate&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;13 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Pairs, then individual writing.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;Discuss with a partner, then write 2–3 sentences.&lt;/div&gt;&lt;div class=&quot;ci&quot;&gt;The oiler was the strongest man in the boat. He rowed the most, and in the water he was “ahead in the race” (¶47). But he is the only man who dies. Why do you think Crane ends the story this way? What does it show about nature? Use one short quotation from the story.&lt;/div&gt;&lt;div class=&quot;starter&quot;&gt;I think Crane ends the story this way because … · In the story, “…” · This shows that …&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ci&quot; style=&quot;margin-top:12px&quot;&gt;&lt;b&gt;Challenge (B1+): The last sentence says the men “could be interpreters” (¶67). What can they now explain about the sea?&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;lines&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;21&lt;/div&gt;&lt;h2&gt;Put the Scenes in Order&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;8 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Sections VI–VII. Look at the pictures and read the sentences.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ct&quot;&gt;Put the story in order. Write 1–6 in the boxes (1 = first, 6 = last).&lt;/div&gt;&lt;div class=&quot;pics&quot;&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;A huge wave turns the boat over.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;A current holds the correspondent in the water.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;People on the beach bring blankets and coffee.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;The correspondent remembers a soldier dying in Algiers.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;A naked man runs into the water to help.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pic&quot;&gt;Picture&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;span class=&quot;sq&quot;&gt;&lt;/span&gt;&lt;span&gt;In the morning, the men see a tall white windmill.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;keep&quot;&gt;
&lt;div class=&quot;act&quot;&gt;&lt;div class=&quot;ah&quot;&gt;&lt;div class=&quot;num&quot;&gt;✓&lt;/div&gt;&lt;h2&gt;Wrap-Up and Homework&lt;/h2&gt;&lt;span class=&quot;pill&quot;&gt;5 min&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;asub&quot;&gt;Whole class.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;hw&quot;&gt;&lt;b&gt;HOMEWORK — Analytical Writing 3 (150–200 words)&lt;/b&gt;&lt;p style=&quot;margin:6px 0 0&quot;&gt;How do Poe and Crane create a feeling of fear and danger? Compare “The Tell-Tale Heart” and “The Open Boat.” Write one paragraph with a topic sentence, at least one quotation from EACH story, and a concluding sentence. Also complete your reading journal entry for Part 3.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

, &quot;pos&quot;: &quot;noun&quot;, &quot;ipa&quot;: &quot;/ˈɑmnɪbəs/&quot;, &quot;defn&quot;: &quot;a large old vehicle pulled by horses that carried passengers, like an early bus&quot;, &quot;ex&quot;: &quot;It&#x27;s an omnibus, as sure as fate.&quot;, &quot;ref&quot;: &quot;¶56&quot;}, {&quot;week&quot;: 8, &quot;part&quot;: 2, &quot;word&quot;: &quot;signal&quot;, &quot;pos&quot;: &quot;noun&quot;, &quot;ipa&quot;: &quot;/ˈsɪɡnəl/&quot;, &quot;defn&quot;: &quot;a movement, sound, or light that gives a message&quot;, &quot;ex&quot;: &quot;Well, I wish I could understand those signals.&quot;, &quot;ref&quot;: &quot;¶64&quot;}, {&quot;week&quot;: 8, &quot;part&quot;: 2, &quot;word&quot;: &quot;to chatter&quot;, &quot;pos&quot;: &quot;verb&quot;, &quot;ipa&quot;: &quot;/ˈtʃætər/&quot;, &quot;defn&quot;: &quot;(of teeth) to hit together quickly because you are very cold or afraid&quot;, &quot;ex&quot;: &quot;The rowers&#x27; teeth always chattered wildly as soon as they stopped working.&quot;, &quot;ref&quot;: &quot;¶101&quot;}, {&quot;week&quot;: 8, &quot;part&quot;: 2, &quot;word&quot;: &quot;life belt&quot;, &quot;pos&quot;: &quot;noun&quot;, &quot;ipa&quot;: &quot;/ˈlaɪf ˌbɛlt/&quot;, &quot;defn&quot;: &quot;a belt made of cork or foam that helps you float in water&quot;, &quot;ex&quot;: &quot;The cook had tied a life belt around his body to get even the small warmth that this awkward cork object could give him.&quot;, &quot;ref&quot;: &quot;¶101&quot;}, {&quot;week&quot;: 8, &quot;part&quot;: 2, &quot;word&quot;: &quot;fin&quot;, &quot;pos&quot;: &quot;noun&quot;, &quot;ipa&quot;: &quot;/fɪn/&quot;, &quot;defn&quot;: &quot;the thin, flat part on a fish&#x27;s back or side&quot;, &quot;ex&quot;: &quot;The correspondent saw a huge fin rush like a shadow through the water, throwing up clear, shining drops and leaving the long, glowing line behind it.&quot;, &quot;ref&quot;: &quot;¶109&quot;}, {&quot;week&quot;: 8, &quot;part&quot;: 2, &quot;word&quot;: &quot;cowa
