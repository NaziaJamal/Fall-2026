<style>
:root{
  --navy:#143865; --deep:#0c2340; --blue:#1c4f8f; --gold:#8c7535; --gold-bright:#d39f10;
  --sky-dark:#c1cddd; --sky-med:#e1e8f2; --sky-light:#edf2f9; --warm:#efe9d9;
  --ink:#1b2433; --muted:#5a6578; --left:#1c4f8f; --right:#a8761a; --red:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07142a;font-family:"Source Sans 3",Arial,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center}
.slide{position:absolute;inset:0;display:none;flex-direction:column;background:#fff;overflow:hidden;border-radius:4px}
.slide.active{display:flex}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}

/* Header bar */
.top{height:78px;background:var(--deep);display:flex;align-items:center;gap:14px;padding:0 24px 0 18px;flex:none}
.top img{height:46px}
.top h2{font-family:"Source Serif 4",Georgia,serif;color:#fff;font-size:32px}
.top .count{margin-left:22px;color:var(--gold-bright);font-weight:700;font-size:20px;letter-spacing:.08em}
.goldline{height:5px;background:var(--gold-bright);flex:none}

/* Title + instructions */
.cover{background:radial-gradient(circle at 70% 30%,#1c4f8f 0%,#0c2340 62%);color:#fff;align-items:center;justify-content:center;text-align:center;gap:16px}
.cover img{height:120px}
.cover h1{font-family:"Source Serif 4",Georgia,serif;font-size:84px;line-height:1.05}
.cover h1 span{color:var(--gold-bright)}
.cover p{font-size:28px;opacity:.9}
.cover .bar{width:120px;height:5px;background:var(--gold-bright);border-radius:3px}

.howto{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;padding:30px 44px 40px;align-items:center}
.steps{display:grid;gap:14px}
.step{display:flex;gap:18px;align-items:center;background:var(--sky-light);border-radius:16px;padding:14px 20px;font-size:27px;line-height:1.3}
.step .n{width:50px;height:50px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:26px;flex:none}
.step small{display:block;font-size:19px;color:var(--muted)}
.room{background:var(--warm);border-radius:18px;padding:18px 18px 14px}
.room svg{width:100%;height:auto;display:block}
.room .cap{text-align:center;font-size:18px;color:var(--muted);margin-top:4px}
.frame{background:var(--deep);color:#fff;border-radius:14px;padding:12px 22px;font-family:"Source Serif 4",Georgia,serif;font-size:30px;text-align:center}
.frame b{color:var(--gold-bright)}

/* Question slide */
.q .qhead{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 24px 0;flex:none;position:relative}
.q .label{font-family:"Source Serif 4",Georgia,serif;font-size:44px;font-weight:700;color:var(--navy)}
.q .num{position:absolute;left:24px;top:16px;font-weight:700;color:var(--muted);font-size:18px;letter-spacing:.08em}
.q .tools{position:absolute;right:20px;top:12px;display:flex;gap:8px}
.arena{flex:1;display:grid;grid-template-columns:1fr 94px 1fr;gap:0;padding:10px 24px 0;min-height:0}
.side{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:4px solid transparent;transition:.25s;position:relative;min-height:0;cursor:pointer}
.side.L{background:#e7eef8;border-color:#b9cbe3}
.side.R{background:#f8f0de;border-color:#e6cf9d}
.side .dir{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:.12em;padding:10px 18px;color:#fff}
.side.L .dir{background:var(--left)}
.side.R .dir{background:var(--right);justify-content:flex-end}
.side .dir svg{width:30px;height:30px;stroke-width:3}
.photo{flex:1;margin:12px 14px 0;border-radius:14px;position:relative;overflow:hidden;min-height:0;display:grid;place-items:center;background:rgba(255,255,255,.65);border:3px dashed rgba(20,56,101,.25)}
.side.R .photo{border-color:rgba(140,117,53,.35)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo.has{border:0}
.photo.has .ph{display:none}
.photo .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:18px;font-weight:600;text-align:center;pointer-events:none}
.photo .ph svg{width:54px;height:54px;stroke-width:1.6;opacity:.6}
.photo .pbtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;opacity:0;transition:.2s;z-index:2}
.photo:hover .pbtns{opacity:1}
.photo.drag{outline:4px solid var(--gold-bright);outline-offset:-4px}
.mini{font:inherit;font-size:14px;font-weight:700;background:rgba(12,35,64,.85);color:#fff;border:0;border-radius:8px;padding:5px 10px;cursor:pointer}
.choice{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:40px;line-height:1.12;text-align:center;padding:12px 16px 14px;color:var(--deep);min-height:96px;display:flex;align-items:center;justify-content:center}
.side.win{transform:scale(1.015);box-shadow:0 0 0 5px var(--gold-bright)}
.or{display:grid;place-items:center}
.or span{width:84px;height:84px;border-radius:50%;background:var(--deep);color:var(--gold-bright);display:grid;place-items:center;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:32px;box-shadow:0 0 0 6px #fff,0 0 0 9px var(--gold-bright)}

/* votes */
.votes{position:absolute;top:56px;left:14px;right:14px;display:none;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.showvotes .votes{display:flex}
.vote{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:30px;padding:4px 6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.vote button{width:34px;height:34px;border-radius:50%;border:0;background:var(--sky-med);color:var(--navy);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.vote b{min-width:40px;text-align:center;font-size:28px;color:var(--deep)}
.side.R .vote{margin-left:auto}

/* bottom band */
.band{flex:none;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:10px 24px 14px}
.band .frame{font-size:28px;text-align:left;padding:10px 20px}
.follow{font-size:20px;color:var(--muted);margin-top:4px;display:none}
.follow b{color:var(--gold)}
.showfollow .follow{display:block}

/* timer */
.timer{display:flex;align-items:center;gap:10px;background:var(--sky-light);border:2px solid var(--sky-dark);border-radius:18px;padding:8px 12px}
.phase{display:flex;flex-direction:column;align-items:center;min-width:74px}
.phase .p{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.phase .t{font-size:36px;font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums;line-height:1}
.timer .tb{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px}
.timer .tb.alt{background:var(--gold-bright);color:var(--deep)}
.timer .tb.ghost{background:#fff;color:var(--navy);border:2px solid var(--sky-dark);padding:7px 10px}
.timer.choose{background:#e7eef8;border-color:var(--left)}
.timer.talk{background:#fbf1d9;border-color:var(--gold-bright)}
.timer.done{background:#fbe7e5;border-color:var(--red);animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.04)}}

/* big countdown overlay */
.overlay{position:absolute;inset:0;background:rgba(12,35,64,.86);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:8;gap:10px;cursor:pointer}
.overlay.show{display:flex}
.overlay .big{font-family:"Source Serif 4",Georgia,serif;font-size:260px;font-weight:700;line-height:1;color:var(--gold-bright);font-variant-numeric:tabular-nums}
.overlay .msg{font-size:44px;font-weight:700;letter-spacing:.04em}
.overlay .sub{font-size:24px;opacity:.85}
.overlay .arrows{display:flex;gap:300px;font-size:30px;font-weight:700;letter-spacing:.14em;margin-top:6px}
.overlay .arrows span{display:flex;align-items:center;gap:10px}
.overlay .arrows svg{width:44px;height:44px;stroke-width:3}

.tbtn{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--sky-dark);background:#fff;color:var(--navy);border-radius:20px;padding:5px 12px;cursor:pointer}
.tbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* results */
.results{flex:1;padding:22px 44px 26px;display:flex;flex-direction:column;gap:10px;min-height:0}
.rrow{display:grid;grid-template-columns:36px 250px 1fr 250px;gap:14px;align-items:center;font-size:20px}
.rrow .rl{text-align:right;font-weight:600;color:var(--left)}
.rrow .rr{font-weight:600;color:var(--right)}
.rrow .k{font-weight:700;color:var(--muted)}
.rbar{display:flex;height:40px;border-radius:10px;overflow:hidden;background:var(--sky-light)}
.rbar div{display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;font-size:17px}
.rbar .a{background:var(--left)} .rbar .b{background:var(--right);justify-content:flex-end}
.rlab{display:flex;justify-content:space-between;font-size:18px;color:var(--ink);gap:10px}
.rlab span:last-child{text-align:right}
.empty{color:var(--muted);font-size:24px;text-align:center;margin-top:60px}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:5px;background:var(--gold-bright);transition:.3s;z-index:9}
#nav{position:fixed;right:12px;top:12px;display:flex;gap:6px;z-index:10;opacity:.22;transition:.2s}
#nav:hover{opacity:1}
#nav button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:7px 11px;background:#fff;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:5px}
#nav button.on{background:var(--gold-bright);color:var(--deep)}
#help{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.93);color:var(--navy);font-size:14px;border-radius:20px;padding:6px 16px;z-index:12;transition:opacity 1s;white-space:nowrap}
#editbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--gold-bright);color:var(--deep);font-weight:700;font-size:14px;border-radius:20px;padding:6px 16px;z-index:12;display:none}
body.editing #editbar{display:block}
body.editing [data-edit]{outline:2px dashed var(--gold-bright);outline-offset:3px;cursor:text;border-radius:4px}
body.editing .side{cursor:default}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="progress"></div>
<div id="help">Arrows: move · Space: start timer · V: votes · Q: follow-up question · F: full screen · E: edit text</div>

function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

/* ---------- photos ---------- */
function setPhoto(box, src){
  box.querySelector("img")?.remove();
  if(src){ const im=new Image(); im.src=src; im.alt=""; box.prepend(im); box.classList.add("has"); }
  else box.classList.remove("has");
}
function shrink(file, cb){
  const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const max=900, sc=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement("canvas"); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",.8));
  }; im.src=r.result; };
  r.readAsDataURL(file);
}

  const k=box.dataset.photo, i=+k.slice(1,-1), s=k.slice(-1);
  const cfg = s==="L" ? QUESTIONS[i].imgL : QUESTIONS[i].imgR;
  setPhoto(box, saved.imgs[k] || cfg || "");
  const input=box.querySelector("input");
  const pick=e=>{ e.stopPropagation(); input.click(); };
  box.addEventListener("click", e=>{ if(document.body.classList.contains("editing")) return; if(e.target.closest("[data-clear]")) return; pick(e); });
  box.querySelector("[data-clear]").addEventListener("click", e=>{ e.stopPropagation(); delete saved.imgs[k]; persist(); setPhoto(box, cfg||""); });
  const use=f=>{ if(!f||!f.type.startsWith("image/")) return; shrink(f, url=>{ setPhoto(box,url); saved.imgs[k]=url; if(!persist()){ delete saved.imgs[k]; flash("Photo shown, but it is too big to save. Use the imgL / imgR paths for permanent photos."); } }); };
  input.addEventListener("change", ()=>{ use(input.files[0]); input.value=""; });
  box.addEventListener("dragover", e=>{ e.preventDefault(); box.classList.add("drag"); });
  box.addEventListener("dragleave", ()=>box.classList.remove("drag"));
  box.addEventListener("drop", e=>{ e.preventDefault(); box.classList.remove("drag"); use(e.dataTransfer.files[0]); });
});

/* ---------- edit mode ---------- */
function setEditing(on){
  document.body.classList.toggle("editing", on);
  stage.querySelectorAll("[data-edit]").forEach(el=>el.contentEditable = on ? "true" : "false");
  edBtn.textContent = on ? "Done" : "Edit"; edBtn.classList.toggle("on", on);
}
stage.addEventListener("input", e=>{ const el=e.target.closest("[data-edit]"); if(!el) return; saved.text[el.dataset.edit]=el.textContent; persist(); });
edBtn.onclick=()=>setEditing(!document.body.classList.contains("editing"));

/* ---------- votes ---------- */
function voteUI(slide){
  const i=slide.dataset.q;
  slide.querySelectorAll(".side").forEach(side=>{
    const s=side.dataset.side, k=`q${i}${s}`;
    side.querySelector(".votes").innerHTML = `<div class="vote"><button data-v="-1" aria-label="minus">−</button><b>${saved.votes[k]||0}</b><button data-v="1" aria-label="plus">+</button></div>`;
  });
  const a=saved.votes[`q${i}L`]||0, b=saved.votes[`q${i}R`]||0;
  slide.querySelectorAll(".side").forEach(s=>s.classList.remove("win"));
  if(slide.classList.contains("showvotes") && (a||b) && a!==b) slide.querySelector(`.side.${a>b?"L":"R"}`).classList.add("win");
}
stage.addEventListener("click", e=>{
  const v=e.target.closest("[data-v]"); if(!v) return;
  e.stopPropagation();
  const slide=v.closest(".slide"), s=v.closest(".side").dataset.side, k=`q${slide.dataset.q}${s}`;
  saved.votes[k]=Math.max(0,(saved.votes[k]||0)+ +v.dataset.v); persist(); voteUI(slide);
});
stage.querySelectorAll(".q").forEach(voteUI);

/* toggles */
stage.addEventListener("click", e=>{
  const t=e.target.closest("[data-toggle]"); if(!t) return;
  const slide=t.closest(".slide"); const cls=t.dataset.toggle;
  const on=slide.classList.toggle(cls); t.classList.toggle("on",on);
  if(cls==="showvotes") voteUI(slide);
});
/* clicking a side highlights it (when not editing / not on photo) */
stage.addEventListener("click", e=>{
  const side=e.target.closest(".side"); if(!side || e.target.closest(".photo,.vote,[data-edit]")) return;
  const slide=side.closest(".slide"); const was=side.classList.contains("win");
  slide.querySelectorAll(".side").forEach(s=>s.classList.remove("win")); if(!was) side.classList.add("win");
});

/* ---------- timer ---------- */
let tick=null, left=0, phase=null, active=null;
function beep(n=2){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); for(let k=0;k<n;k++){ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; o.connect(g); g.connect(c.destination); const t=c.currentTime+k*.35; g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.start(t); o.stop(t+.3);} }catch(e){} }
function render(){
  if(!active) return;
  const tm=active.querySelector("[data-timer]"), ov=active.querySelector(".overlay");
  tm.className="timer"+(phase?" "+phase:"");
  tm.querySelector(".p").textContent = phase==="choose"?"CHOOSE":phase==="talk"?"TALK":phase==="done"?"TIME!":"READY";
  tm.querySelector(".t").textContent = fmt(Math.max(left,0));
  ov.classList.toggle("show", phase==="choose");
  ov.querySelector(".big").textContent = Math.max(left,0);
  const go=tm.querySelector("[data-go]"), tk=tm.querySelector("[data-talk]");
  go.innerHTML = (phase==="choose"&&tick)? I.pause+"<span>Pause</span>" : I.play+"<span>Choose</span>";
  tk.innerHTML = (phase==="talk"&&tick)? I.pause+"<span>Pause</span>" : I.play+"<span>Talk</span>";
}
function stop(){ clearInterval(tick); tick=null; }
function run(slide, ph, secs){
  if(active!==slide){ reset(); active=slide; }
  if(phase===ph && tick){ stop(); render(); return; }        // pause
  if(phase!==ph || left<=0){ phase=ph; left=secs; }          // fresh start
  stop();
  tick=setInterval(()=>{
    left--;
    if(left<=0){ stop();
      if(phase==="choose"){ beep(1); phase="talk"; left=TALK_SECONDS; render(); run(active,"talk",TALK_SECONDS); return; }
      phase="done"; beep(3);
    }
    render();
  },1000);
  render();
}
function reset(){ stop(); if(active){ phase=null; left=CHOOSE_SECONDS; render(); active.querySelector(".overlay").classList.remove("show"); } phase=null; }
stage.addEventListener("click", e=>{
  const s=e.target.closest(".slide");
  if(e.target.closest("[data-go]")) run(s,"choose",CHOOSE_SECONDS);
  else if(e.target.closest("[data-talk]")) run(s,"talk",TALK_SECONDS);
  else if(e.target.closest("[data-reset]")){ active=s; reset(); }
  else if(e.target.closest(".overlay")){ stop(); phase="talk"; left=TALK_SECONDS; render(); run(s,"talk",TALK_SECONDS); }
});

/* ---------- results ---------- */
function buildResults(){
  const box=document.getElementById("results");
  const rows=QUESTIONS.map((q,i)=>{
    const a=saved.votes[`q${i}L`]||0, b=saved.votes[`q${i}R`]||0, t=a+b;
    if(!t) return "";
    const L=stage.querySelector(`[data-edit="q${i}L"]`).textContent, R=stage.querySelector(`[data-edit="q${i}R"]`).textContent;
    const pa=Math.round(a/t*100);
    return `<div class="rrow"><span class="k">${i+1}</span>
      <span class="rl">${L}</span>
      <div class="rbar"><div class="a" style="width:${pa}%">${a?a:""}</div><div class="b" style="width:${100-pa}%">${b?b:""}</div></div>
      <span class="rr">${R}</span></div>`;
  }).join("");
  box.innerHTML = rows ? rows + `<div class="mini" style="align-self:flex-end;margin-top:6px;background:none;color:#5a6578;padding:0"><button class="tbtn" id="clearVotes">Clear all votes</button></div>`
    : `<div class="empty">No votes yet. On each question, press <b>Votes</b> (or V) and count the students on each side.</div>`;
  const cv=document.getElementById("clearVotes");
  if(cv) cv.onclick=()=>{ if(confirm("Clear all votes?")){ saved.votes={}; persist(); stage.querySelectorAll(".q").forEach(voteUI); buildResults(); } };
}

/* ---------- navigation ---------- */
let cur=0;
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  if(active && active!==slides[cur]){ reset(); active=null; }
  slides.forEach((s,j)=>s.classList.toggle("active",j===cur));
  document.getElementById("progress").style.width=((cur+1)/slides.length*100)+"%";
  if(slides[cur].dataset.title==="Results") buildResults();
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
}
prev.onclick=()=>show(cur-1); next.onclick=()=>show(cur+1);
fsBtn.onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); };
document.addEventListener("keydown", e=>{
  if(document.body.classList.contains("editing")){ if(e.key==="Escape"||(e.key==="Enter"&&!e.shiftKey&&e.target.isContentEditable)){ e.preventDefault(); setEditing(false); } return; }
  const k=e.key, s=slides[cur];
  if(["ArrowRight","PageDown"].includes(k)){ e.preventDefault(); show(cur+1); }
  else if(["ArrowLeft","PageUp"].includes(k)){ e.preventDefault(); show(cur-1); }
  else if(k===" "){ e.preventDefault(); if(s.classList.contains("q")){ if(phase==="talk"||phase==="done"&&active===s) run(s,"talk",TALK_SECONDS); else run(s,"choose",CHOOSE_SECONDS);} }
  else if(k==="v"||k==="V"){ s.querySelector('[data-toggle="showvotes"]')?.click(); }
  else if(k==="q"||k==="Q"){ s.querySelector('[data-toggle="showfollow"]')?.click(); }
  else if(k==="r"||k==="R"){ if(s.classList.contains("q")){ active=s; reset(); } }
  else if(k==="f"||k==="F") fsBtn.click();
  else if(k==="e"||k==="E") setEditing(true);
  else if(k==="Home") show(0); else if(k==="End") show(slides.length-1);
});
let sx=null; document.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{ if(sx===null)return; const d=e.changedTouches[0].clientX-sx; if(Math.abs(d)>60) show(cur+(d<0?1:-1)); sx=null; });

function flash(m){ const h=document.getElementById("help"); h.textContent=m; h.style.opacity=1; setTimeout(()=>h.style.opacity=0,4000); }
function fit(){ const sc=Math.min(innerWidth/1280, innerHeight/720); stage.style.transform=`scale(${sc})`; }
addEventListener("resize",fit); fit();
setTimeout(()=>document.getElementById("help").style.opacity=0,5000);
show(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
</body>
