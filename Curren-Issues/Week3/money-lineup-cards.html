<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Line-Up Cards · Week 3</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#143865;--deep:#0c2340;--blue:#1c4f8f;--gold:#8c7535;--gold-bright:#d39f10;--sky-dark:#c1cddd;--sky-light:#edf2f9;--warm:#efe9d9;--ink:#1b2433;--muted:#5a6578}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dee6;font-family:"Source Sans 3",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.toolbar{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar p{font-size:14px;opacity:.9}
.toolbar button{background:var(--gold-bright);color:var(--deep);border:0;border-radius:6px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer}
.sheet{width:8.5in;min-height:11in;margin:20px auto;background:#fff;padding:.4in .45in;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:2.4in;gap:0}
.card{border:1.5px dashed #9aa6b8;padding:.16in .2in;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card .band{position:absolute;left:0;top:0;bottom:0;width:.16in}
.card .top{display:flex;justify-content:space-between;align-items:center;padding-left:.08in}
.card .cty{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.card img{height:26px}
.card .amt{flex:1;display:flex;align-items:center;justify-content:center;font-family:"Source Serif 4",Georgia,serif;font-weight:700;color:var(--deep);text-align:center;line-height:1;padding-left:.08in}
.card .cur{text-align:center;font-size:15px;color:var(--muted);margin-top:-6px;padding-left:.08in}
.card .hint{margin-top:6px;font-size:12.5px;background:var(--sky-light);border-radius:6px;padding:4px 8px;text-align:center;margin-left:.08in}
.card .say{margin-top:5px;font-size:12.5px;text-align:center;color:var(--gold);font-weight:700;padding-left:.08in}
.card .no{position:absolute;right:8px;bottom:5px;font-size:10px;color:#a5adbb}
h1{font-family:"Source Serif 4",Georgia,serif;color:var(--navy);font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:14px}
.box{background:var(--sky-light);border:1px solid var(--sky-dark);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.45}
.box h2{font-family:"Source Serif 4",Georgia,serif;color:var(--navy);font-size:18px;margin-bottom:4px}
.box ol,.box ul{padding-left:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px}
td{border-bottom:1px solid var(--sky-dark);padding:3px 8px}
tr:nth-child(even) td{background:var(--sky-light)}
td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.frame{background:var(--deep);color:#fff;border-radius:10px;padding:10px 14px;font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.6}
.frame b{color:var(--gold-bright)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  .toolbar{display:none}
  .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page;height:11in}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
@media screen and (max-width:8.6in){ .sheet{width:100%;min-height:auto;padding:12px} .grid{grid-auto-rows:auto} .card{min-height:200px} }
</style>
</head>
<body>
<div class="toolbar"><p>14 cards (one per student) on 2 pages + a teacher page. Print on Letter paper with “Background graphics” on, then cut on the dashed lines.</p><button onclick="window.print()">Print</button></div>
<div id="out"></div>

html+=`<section class="sheet">
  <h1>Money Line-Up · Teacher Page</h1>
  <p class="sub">Week 3 · A New Look for Banknotes · 5–8 minutes · 14 students</p>
  <div class="box"><h2>How to play</h2><ol>
    <li>Give each student one card. Students from that country are the <b>experts</b>: they help others understand the money.</li>
    <li>Everyone stands up and talks to classmates: <i>“I have 20,000 pesos. What do you have?”</i></li>
    <li>Students line up from the <b>least</b> money (left) to the <b>most</b> money (right). No talking in their first language!</li>
    <li>When the line is finished, each student says their amount. Check with the key below.</li>
  </ol></div>
  <div class="frame">I have <b>___</b>. &nbsp;What do you have?<br>Is that <b>more</b> or <b>less</b> than ___? &nbsp;·&nbsp; I think you go <b>before / after</b> me.<br>That's about <b>___</b> dollars.</div>
  <div class="box" style="margin-top:12px"><h2>Answer key (least to most)</h2>
  <table><tr><th>#</th><th>Card</th><th>Country</th><th style="text-align:right">About (US$)</th></tr>
  ${sorted.map((c,k)=>`<tr><td>${k+1}</td><td>${c.cur}</td><td>${c.cty}</td><td class="r">$${c.usd<1?c.usd.toFixed(2):c.usd.toFixed(c.usd<10?2:0)}</td></tr>`).join("")}
  </table>
  <p class="note">Values use October 2026 exchange rates (UK government monthly rates; fxfeed.io for the afghani) and are rounded. Rates change, but the cards are far enough apart that the order should stay the same.</p></div>
  <div class="box"><h2>Differentiation</h2><ul>
    <li><b>A1:</b> say the amount and use <i>more / less</i>. They can use the hint line.</li>
    <li><b>A2+:</b> cover the hint line with a sticky note. They must ask the experts.</li>
    <li><b>Fewer students?</b> Remove cards from the middle of the key, not the ends.</li>
  </ul></div>
</section>`;
