<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaking News Class Survey</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#143865; --blue:#1c4f8f; --gold:#8c7535; --gold-bright:#d39f10;
    --sky-dark:#c1cddd; --sky-med:#e1e8f2; --sky-light:#edf2f9; --warm:#efe9d9;
    --ink:#1b2433; --muted:#5a6578;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#d9dee6;font-family:"Source Sans 3",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .toolbar p{font-size:14px;opacity:.9}
  .toolbar button{background:var(--gold-bright);color:var(--navy);border:0;border-radius:6px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer}

  .sheet{width:8.5in;min-height:11in;margin:20px auto;background:#fff;padding:.45in .5in;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:.13in}

  .brand{display:flex;justify-content:space-between;align-items:center;background:#0c2340;color:#fff;border-radius:6px;padding:4px 14px 4px 6px}
  .brand img{height:44px;width:auto;display:block;margin:3px 2px}
  .brand .left{display:flex;align-items:center;gap:6px}
  .brand .logo{font-family:"Source Serif 4",Georgia,serif;color:var(--gold-bright);font-weight:700;font-size:20px;letter-spacing:.06em;line-height:1}
  .brand .logo small{display:block;font-family:"Source Sans 3",Arial,sans-serif;font-size:9.5px;letter-spacing:.04em;color:#e9d9a8;font-weight:400;margin-top:2px}
  .brand .course{font-size:12px;text-align:right;line-height:1.3}

  .title-row{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--gold-bright);padding-bottom:6px}
  .title-row h1{font-family:"Source Serif 4",Georgia,serif;font-size:26px;color:var(--navy);line-height:1}
  .title-row h1 span{color:#b3261e}
  .card-tag{background:var(--gold-bright);color:var(--navy);font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px;white-space:nowrap}

  .steps{display:flex;gap:6px}
  .steps div{flex:1;background:var(--sky-light);border:1px solid var(--sky-dark);border-radius:6px;padding:5px 8px;font-size:12.5px}
  .steps b{color:var(--navy);margin-right:4px}

  .questions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .q{border:2px solid var(--navy);border-radius:8px;padding:9px 12px;background:#fff}
  .q .label{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:11px;padding:2px 8px;border-radius:10px;margin-bottom:5px}
  .q .ask{font-family:"Source Serif 4",Georgia,serif;font-size:19px;color:var(--navy);line-height:1.2;margin-bottom:6px}
  .q .answer{font-size:12.5px;color:var(--muted)}
  .q .answer b{color:var(--ink)}
  .q .follow{margin-top:5px;font-size:12.5px;background:var(--warm);border-radius:5px;padding:3px 7px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--navy);color:#fff;font-weight:600;padding:5px 6px;text-align:left}
  th.c{text-align:center}
  td{border:1px solid var(--sky-dark);height:.27in;padding:0 6px}
  td.n{width:.32in;text-align:center;color:var(--muted);font-size:11px}
  td.yn{width:1.15in;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.05em}
  tr:nth-child(even) td{background:var(--sky-light)}
  tr.total td{background:var(--warm);font-weight:700;color:var(--navy);height:.32in}

  .report{border:2px dashed var(--gold);border-radius:8px;padding:9px 12px;background:#fffdf7}
  .report h2{font-family:"Source Serif 4",Georgia,serif;color:#b3261e;font-size:17px;margin-bottom:5px}
  .report .line{font-size:14.5px;margin:5px 0;line-height:1.4}
  .blank{display:inline-block;min-width:.55in;border-bottom:1.5px solid var(--ink);text-align:center}
  .grammar{display:flex;gap:8px;margin-top:7px}
  .grammar div{flex:1;background:var(--sky-med);border-radius:5px;padding:5px 8px;font-size:11.5px;line-height:1.35}
  .grammar b{color:var(--navy)}
  .grammar .s{color:#b3261e;font-weight:700}

  .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);border-top:1px solid var(--sky-dark);padding-top:5px}

  /* Teacher page */
  .teacher h2{font-family:"Source Serif 4",Georgia,serif;color:var(--navy);font-size:17px;margin:2px 0 3px}
  .teacher p,.teacher li{font-size:12.5px;line-height:1.4}
  .teacher{gap:.09in}
  .teacher ol,.teacher ul{padding-left:20px}
  .teacher li{margin-bottom:3px}
  .model{background:var(--navy);color:#fff;border-radius:8px;padding:12px 16px;font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.5}
  .model em{color:var(--gold-bright);font-style:normal}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .box{background:var(--sky-light);border:1px solid var(--sky-dark);border-radius:8px;padding:9px 12px}
  .list td{height:auto;padding:2px 6px;font-size:11px}

  @media print{
    @page{size:letter;margin:0}
    body{background:#fff}
    .toolbar{display:none}
    .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page;height:11in}
  }
  @media screen and (max-width:8.6in){
    .sheet{width:100%;min-height:auto;padding:16px}
    .questions,.grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="toolbar">
  <p>14 reporter cards (1 per student) + 1 teacher page at the end. Print on Letter paper, "Background graphics" ON.</p>
  <button onclick="window.print()">Print</button>
</div>

<div id="sheets"></div>

    {ask:"Do you watch the news in your language?", type:"do", report:"watch the news in their language.", follow:"What channel do you watch?"},

    {ask:"Do you drink coffee every morning?", type:"do", report:"drink coffee every morning.", follow:"How many cups do you drink?"},
    {ask:"Do you eat breakfast every day?", type:"do", report:"eat breakfast every day.", follow:"What do you eat?"}]},
  {theme:"Food Desk", q:[
    {ask:"Do you cook dinner at home?", type:"do", report:"cook dinner at home.", follow:"What do you cook?"},

    {ask:"Do you take the bus or the train?", type:"do", report:"take the bus or the train.", follow:"Which bus or train do you take?"},

let html = "";
cards.forEach((c,i)=>{
  const n=i+1;
  html += `<section class="sheet">
    ${head}
    <div class="title-row"><h1><span>Breaking News:</span> Class Survey</h1><div class="card-tag">Card ${n} · ${c.theme}</div></div>
    <div class="steps">
      <div><b>1</b>Ask every classmate.</div>
      <div><b>2</b>Write their name and country.</div>
      <div><b>3</b>Circle YES or NO.</div>
      <div><b>4</b>Count and report!</div>
    </div>
    <div class="questions">
      ${c.q.map((q,k)=>`<div class="q"><span class="label">QUESTION ${k+1}</span><div class="ask">${q.ask}</div><div class="answer">${answer(q.type)}</div><div class="follow">★ Ask more: <i>${q.follow}</i></div></div>`).join("")}
    </div>
    <table>
      <thead><tr><th class="c">#</th><th>Name</th><th>Country</th><th class="c">Question 1</th><th class="c">Question 2</th></tr></thead>
      <tbody>${rows}<tr class="total"><td></td><td colspan="2">TOTAL “YES”</td><td class="yn">_____ / 13</td><td class="yn">_____ / 13</td></tr></tbody>
    </table>
    <div class="report">
      <h2>📢 Breaking news!</h2>
      ${c.q.map(q=>`<div class="line">${reportLine(q)}</div>`).join("")}
      <div class="grammar">
        <div><b>1 student</b> drink<span class="s">s</span> · like<span class="s">s</span><br><b>2+ students</b> drink · like<br><b>No students</b> drink · like</div>
        <div><b>Report words:</b><br>All the students… · Most students…<br>Half of the students… · Only one student…</div>
        <div><b>★ Challenge:</b> Add one more fact from your follow-up question.<br><i>“Ana watches the news on TV.”</i></div>
      </div>
    </div>
    ${foot(n)}
  </section>`;
});

/* Teacher page */
html += `<section class="sheet teacher">
  ${head}
  <div class="title-row"><h1>Teacher Page</h1><div class="card-tag">Not for students</div></div>
  <div class="grid2">
    <div class="box">
      <h2>How to run it (≈20 min)</h2>
      <ol>
        <li><b>Model (2 min).</b> Ask 2–3 students one question. Show <i>Yes, I do / No, I don't</i>.</li>
        <li><b>Mingle (10 min).</b> Everyone stands, asks every classmate both questions, and writes names + countries.</li>
        <li><b>Count (2 min).</b> Students total the YES answers and fill in the report.</li>
        <li><b>Report (6 min).</b> Each student stands and gives one or two “Breaking news!” lines.</li>
      </ol>
    </div>
    <div class="box">
      <h2>Differentiation</h2>
      <ul>
        <li><b>A1:</b> Read the question, circle YES/NO, fill in the number.</li>
        <li><b>A2:</b> Ask the ★ follow-up question to 3+ classmates.</li>
        <li><b>A2+:</b> Do the ★ Challenge and use <i>most / half / only one</i>.</li>
        <li>Fewer than 14 students? Remove cards from the end and change “/ 13” on the board.</li>
      </ul>
    </div>
  </div>
  <h2>Board model for the report</h2>
  <div class="model">📢 Breaking news! <em>Eight</em> students drink coffee every morning.<br>
  Only <em>one</em> student drink<em>s</em> tea. &nbsp;·&nbsp; <em>Five</em> students say, “There is a park near my home.”</div>
  <h2>Listen for (quick feedback after reports)</h2>
  <div class="grid2">
