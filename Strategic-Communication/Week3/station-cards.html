<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Cards · Week 3</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c2340;--gold:#d39f10;--gold-dark:#8c7535;--warm:#efe9d9;--sky:#edf2f9;--ink:#1d2b44;--muted:#4f5f78;
  --serif:'Libre Baskerville',Georgia,serif;--sans:'Public Sans',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#d9dee6;font-family:var(--sans);color:var(--ink)}
.bar{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:15px;z-index:2}
.bar button{font:700 15px var(--sans);background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:9px 16px;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center}
.page{width:8.5in;height:11in;margin:24px auto;background:#fff;padding:.4in;box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex}
.card{flex:1;border:3px dashed #9aa6b8;border-radius:6px;padding:.35in .4in;display:flex;flex-direction:column;gap:18px;position:relative}
.card::before{content:"\2702  cut along the dashed line";position:absolute;top:-12px;left:18px;background:#fff;padding:0 8px;font-size:11px;color:#9aa6b8;letter-spacing:.05em}
.top{display:flex;align-items:center;gap:18px;border-bottom:6px solid var(--gold);padding-bottom:14px}
.top img{width:70px;height:70px;border-radius:6px}
.num{font:700 64px var(--serif);color:var(--navy);line-height:1}
.lbl{font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dark)}
h2{font:700 30px var(--serif);color:var(--navy);margin:2px 0 0;line-height:1.2}
ul{margin:0;padding-left:24px;display:grid;gap:12px}
li{font-size:19px;line-height:1.45}
.q{background:var(--warm);border-left:8px solid var(--gold);border-radius:6px;padding:14px 18px;font-size:20px;line-height:1.4}
.task{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.task div{border:2px solid var(--navy);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.3}
.task b{display:block;font:700 18px var(--serif);color:var(--navy)}
.scale{font-size:14px;color:var(--muted);text-align:center}
.wall{border:2px dashed #c1cddd;border-radius:8px;height:1.3in;display:flex;align-items:center;justify-content:center;color:#9aa6b8;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
body.nowall .wall{display:none}
@page{size:letter;margin:0}
@media print{
  body{background:#fff}
  .bar{display:none}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  var STATIONS=[
    {n:1,t:'Johnson & Johnson · Tylenol (1982)',card:['<b>The crisis:</b> In autumn 1982, seven people in the Chicago area died after taking Extra-Strength Tylenol capsules. Someone had put cyanide into capsules sold in stores. The person was never found.','<b>J&amp;J was not the cause</b> of the poisoning.','<b>What they did:</b> recalled 31 million bottles nationwide, at a cost of about $100 million. CEO James Burke personally kept the heads of the TV news divisions informed and met the heads of the FBI and the FDA.','<b>Next step:</b> about two months later, Tylenol returned to stores in new tamper-proof packaging.'],q:'Can you "accept" responsibility for something you didn\'t cause? How?'},
    {n:2,t:'Lance Armstrong · TV interview (January 2013)',card:['<b>The crisis:</b> For years the cyclist denied using performance-enhancing drugs. In 2012 an anti-doping report described an organized doping program, and he lost his seven Tour de France titles.','<b>What he did:</b> in January 2013, in a TV interview with Oprah Winfrey, he admitted doping in all seven Tour wins.','<b>His words:</b> he called his story "one big lie that I repeated a lot of times" and said: "This is too late, probably for most people, and that\'s my fault." He also said: "I didn\'t invent the culture, but I didn\'t try to stop the culture."','<b>He also</b> called himself "a deeply flawed character".'],q:'Does an apology still count if it comes only after you are caught?'},
    {n:3,t:'Mark Zuckerberg · Facebook (March–April 2018)',card:['<b>The crisis:</b> in March 2018, news reports revealed that data from up to 87 million Facebook users had been passed to Cambridge Analytica, a political consulting firm.','<b>First response (21 March, after several days of silence):</b> a Facebook post: "We have a responsibility to protect your data, and if we can\'t, then we don\'t deserve to serve you." He called it "a breach of trust" and announced new limits on app developers. The post did not say "sorry"; he said "I\'m really sorry it happened" in a CNN interview.','<b>US Congress (April 2018):</b> "We didn\'t take a broad enough view of our responsibility, and that was a big mistake. It was my mistake, and I\'m sorry. I started Facebook, I run it, and I\'m responsible for what happens here."'],q:'Which matters more: the first message, or the best message?'},
    {n:4,t:'KFC UK · newspaper ad (February 2018)',card:['<b>The crisis:</b> after KFC changed its delivery company, hundreds of its UK restaurants ran out of chicken and closed for days.','<b>What they did:</b> a full-page ad in two national newspapers, the Metro and The Sun. The picture: an empty KFC bucket with the letters rearranged to spell "FCK".','<b>The words:</b> "Huge apologies to our customers, especially those who traveled out of their way to find we were closed." The ad used a casual, self-mocking voice and promised that more restaurants were reopening every day.'],q:'When does humor help an apology, and when does it destroy it?'}
  ];
